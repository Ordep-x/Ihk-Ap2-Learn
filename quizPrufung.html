{"cat":"wiso","sub":"pruefung","q":"Die EcoTec GmbH formuliert u. a. die beiden Zielsetzungen 'Kundenzufriedenheit durch kompetente Mitarbeitende' und 'Mitarbeiterqualifikationen durch Fortbildungen erhöhen'. Welche Zielart liegt bei diesem Zielsetzungspaar vor?","qPt":"A EcoTec GmbH formula, entre os seus objetivos empresariais, os objetivos 'satisfação do cliente através de colaboradores competentes' e 'aumentar a qualificação dos colaboradores através de formação contínua'. Que tipo de relação entre objetivos existe?","a":"Es handelt sich um komplementäre Ziele: Durch Fortbildungen steigt die Mitarbeiterqualifikation, was wiederum kompetentere Mitarbeitende und damit höhere Kundenzufriedenheit fördert - die Erreichung des einen Ziels unterstützt also das andere.","aPt":"Trata-se de objetivos complementares: a formação contínua aumenta a qualificação dos colaboradores, o que, por sua vez, promove colaboradores mais competentes e, assim, maior satisfação dos clientes — ou seja, atingir um objetivo apoia o outro.","options":[{"text":"Komplementäre Ziele","textPt":"Objetivos complementares","correct":true},{"text":"Konkurrierende Ziele","textPt":"Objetivos concorrentes (em conflito)","correct":false},{"text":"Indifferente Ziele","textPt":"Objetivos indiferentes (neutros)","correct":false},{"text":"Substitutive Ziele","textPt":"Objetivos substitutivos","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die EcoTec GmbH formuliert u. a. die beiden Zielsetzungen 'Bezugskosten minimieren' und 'Gewinnmaximierung'. Welche Zielart liegt bei diesem Zielsetzungspaar vor?","qPt":"A EcoTec GmbH formula, entre os seus objetivos empresariais, os objetivos 'minimizar os custos de aquisição' e 'maximizar o lucro'. Que tipo de relação entre objetivos existe?","a":"Es handelt sich um komplementäre Ziele: Eine Minimierung der Bezugskosten (Einkaufskosten) trägt unmittelbar zur Gewinnmaximierung bei, da geringere Kosten bei gleichbleibenden Erlösen den Gewinn erhöhen.","aPt":"Trata-se de objetivos complementares: minimizar os custos de aquisição contribui diretamente para a maximização do lucro, pois custos menores, mantendo as receitas, aumentam o lucro.","options":[{"text":"Komplementäre Ziele","textPt":"Objetivos complementares","correct":true},{"text":"Konkurrierende Ziele","textPt":"Objetivos concorrentes (em conflito)","correct":false},{"text":"Indifferente Ziele","textPt":"Objetivos indiferentes (neutros)","correct":false},{"text":"Substitutive Ziele","textPt":"Objetivos substitutivos","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die EcoTec GmbH verfolgt auch soziale Ziele. Welche der folgenden Maßnahmen orientiert sich NICHT an sozialen Zielen, sondern an einem anderen Zielbereich?","qPt":"A EcoTec GmbH também persegue objetivos sociais. Qual das seguintes medidas NÃO se orienta por objetivos sociais, mas sim por outra área de objetivos?","a":"Das Sammeln der Verpackungsabfälle aus dem Wareneingang ist eine ökologische (umweltbezogene) Maßnahme und keine soziale Zielsetzung.","aPt":"A recolha dos resíduos de embalagens da receção de mercadorias é uma medida ecológica (ambiental), e não um objetivo social.","options":[{"text":"Sammeln der Verpackungsabfälle aus dem Wareneingang","textPt":"Recolha dos resíduos de embalagens da receção de mercadorias","correct":true},{"text":"Einrichten eines betrieblichen Kindergartens","textPt":"Criação de um infantário na empresa","correct":false},{"text":"Beteiligung der Arbeitenden am Unternehmenserfolg","textPt":"Participação dos trabalhadores no sucesso da empresa","correct":false},{"text":"Verwenden von fair gehandelten Produkten","textPt":"Utilização de produtos de comércio justo","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Einem Mitarbeiter der EcoTec GmbH wurde nach dreijähriger Betriebszugehörigkeit betriebsbedingt gekündigt. Welchen Grund kann eine betriebsbedingte Kündigung haben?","qPt":"Um colaborador da EcoTec GmbH foi despedido por motivos empresariais após três anos de vínculo à empresa. Que motivo pode justificar um despedimento por motivos empresariais?","a":"Der Wegfall des Arbeitsplatzes, z. B. durch eine Standortschließung, ist ein typischer betrieblicher (nicht personen- oder verhaltensbedingter) Kündigungsgrund.","aPt":"A extinção do posto de trabalho, por exemplo devido ao encerramento de uma unidade, é um motivo típico de despedimento por razões empresariais (não pessoais nem comportamentais).","options":[{"text":"Wegfall des Arbeitsplatzes durch Standortschließung","textPt":"Extinção do posto de trabalho devido ao encerramento de uma unidade","correct":true},{"text":"Trunkenheit am Arbeitsplatz","textPt":"Embriaguez no local de trabalho","correct":false},{"text":"Mangelndes Fachwissen","textPt":"Falta de conhecimentos técnicos","correct":false},{"text":"Grobe Beleidigung eines Vorgesetzten","textPt":"Insulto grave a um superior","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Drei ehemalige Mitarbeitende der EcoTec GmbH gründen eine GmbH mit Einlagen von 50.000 EUR, 20.000 EUR und 15.000 EUR (insgesamt 85.000 EUR). Welcher Sachverhalt entspricht den gesetzlichen Regelungen zur GmbH-Gründung?","qPt":"Três antigos colaboradores da EcoTec GmbH fundam uma GmbH com participações de 50.000 EUR, 20.000 EUR e 15.000 EUR (num total de 85.000 EUR). Que afirmação está de acordo com as regras legais para a fundação de uma GmbH?","a":"Die gesetzlich geforderte Mindesteinlage (Mindeststammkapital) einer GmbH beträgt 25.000 EUR. Mit insgesamt 85.000 EUR übersteigen die Einlagen der drei Gesellschafter dieses Mindestkapital.","aPt":"O capital social mínimo exigido por lei para uma GmbH é de 25.000 EUR. Com um total de 85.000 EUR, as participações dos três sócios ultrapassam esse capital mínimo.","options":[{"text":"Die Einlagen der drei Gesellschafter übersteigen das gesetzlich geforderte Mindestkapital der neuen GmbH.","textPt":"As participações dos três sócios ultrapassam o capital social mínimo exigido por lei para a nova GmbH.","correct":true},{"text":"Eine Eintragung der GmbH ins Handelsregister muss nicht zwangsläufig beantragt werden.","textPt":"O registo da GmbH no registo comercial não precisa necessariamente de ser requerido.","correct":false},{"text":"Die Geschäftsführung des neuen Unternehmens muss durch eine außenstehende Person erfolgen, da Gesellschafter einer GmbH nicht auch deren Geschäfte führen dürfen.","textPt":"A gerência da nova empresa tem de ser exercida por uma pessoa externa, pois os sócios de uma GmbH não podem também geri-la.","correct":false},{"text":"Der Gesellschaftsvertrag zwischen den drei Gesellschaftern kann auch mündlich abgeschlossen werden, um rechtswirksam sein zu können.","textPt":"O contrato de sociedade entre os três sócios também pode ser celebrado oralmente para ser juridicamente válido.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die neu gegründete GmbH der drei ehemaligen EcoTec-Mitarbeitenden erwirbt einen neuen Server. Wie ist die Haftung der GmbH gegenüber dem Verkäufer geregelt?","qPt":"A GmbH recém-fundada pelos três antigos colaboradores da EcoTec adquire um novo servidor. Como está regulada a responsabilidade da GmbH perante o vendedor?","a":"Die GmbH haftet gegenüber dem Verkäufer mit ihrem gesamten Betriebsvermögen (Gesellschaftsvermögen); die Gesellschafter haften grundsätzlich nicht mit ihrem Privatvermögen.","aPt":"A GmbH responde perante o vendedor com todo o seu património empresarial; em princípio, os sócios não respondem com o seu património pessoal.","options":[{"text":"Die GmbH haftet gegenüber dem Verkäufer mit dem gesamten Betriebsvermögen.","textPt":"A GmbH responde perante o vendedor com todo o seu património empresarial.","correct":true},{"text":"Die GmbH haftet mit ihrem Stammkapital und die drei Gesellschafter zusätzlich auch mit ihrem Privatvermögen.","textPt":"A GmbH responde com o seu capital social, e os três sócios respondem adicionalmente também com o seu património pessoal.","correct":false},{"text":"Dem Verkäufer gegenüber haftet nur der Gesellschafter mit der höchsten Einlage.","textPt":"Perante o vendedor, só responde o sócio com a maior participação.","correct":false},{"text":"Die GmbH haftet dem Verkäufer der Ware gegenüber nur bis zur Höhe des gesetzlich festgelegten und einzuzahlenden Mindestkapitals.","textPt":"A GmbH responde perante o vendedor apenas até ao montante do capital mínimo legal a realizar.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die EcoTec GmbH formuliert interne Ziele bezüglich Nachhaltigkeit und Umweltschutz. Welche Aussage stellt ein ökologisches Ziel dar?","qPt":"A EcoTec GmbH formula objetivos internos de sustentabilidade e proteção ambiental. Qual afirmação representa um objetivo ecológico?","a":"Der Bezug aller Produkte von ökologisch zertifizierten Lieferanten, ohne Abstriche bei Qualität und Funktionalität, ist ein ökologisches (umweltbezogenes) Unternehmensziel.","aPt":"A aquisição de todos os produtos junto de fornecedores certificados ecologicamente, sem comprometer a qualidade e a funcionalidade, é um objetivo empresarial ecológico (ambiental).","options":[{"text":"Alle Produkte sollen von ökologisch zertifizierten Lieferanten bezogen werden, ohne Abstriche bei der Qualität und Funktionalität hinzunehmen.","textPt":"Todos os produtos devem ser adquiridos junto de fornecedores certificados ecologicamente, sem comprometer a qualidade e a funcionalidade.","correct":true},{"text":"Hohe Investitionen in neue Produktionsanlagen.","textPt":"Altos investimentos em novas instalações de produção.","correct":false},{"text":"Die Verbesserung der Kundenzufriedenheit und damit der Kundenbindung.","textPt":"A melhoria da satisfação dos clientes e, assim, da sua fidelização.","correct":false},{"text":"Umsatzsteigerung durch stetige Erweiterung des Sortiments.","textPt":"Aumento do volume de negócios através da expansão contínua do sortido.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Im Lager der EcoTec GmbH werden zu hohe umweltbelastende Emissionen festgestellt. Welche Aussage ist in diesem Zusammenhang richtig?","qPt":"No armazém da EcoTec GmbH são detetadas emissões poluentes demasiado elevadas. Qual afirmação está correta neste contexto?","a":"Zu den umweltbelastenden Emissionen gehören neben umweltschädlichen Abgasen auch mögliche Schallemissionen (Lärm).","aPt":"As emissões poluentes incluem, além dos gases de escape prejudiciais ao ambiente, também possíveis emissões sonoras (ruído).","options":[{"text":"Zu den umweltbelastenden Emissionen gehören neben umweltschädlichen Abgasen auch mögliche Schallemissionen.","textPt":"As emissões poluentes incluem, além dos gases de escape prejudiciais ao ambiente, também possíveis emissões sonoras.","correct":true},{"text":"Emissionen entstehen in der EcoTec GmbH ausschließlich durch den Transport von Waren zwischen verschiedenen Lagerorten.","textPt":"As emissões na EcoTec GmbH surgem exclusivamente do transporte de mercadorias entre diferentes locais de armazenamento.","correct":false},{"text":"Emissionen können durch den Bau höherer Schornsteine für Abgase der EcoTec GmbH reduziert oder vermieden werden.","textPt":"As emissões podem ser reduzidas ou evitadas construindo chaminés mais altas para os gases de escape da EcoTec GmbH.","correct":false},{"text":"Die Verringerung der Emissionen in der EcoTec GmbH unterliegt keinerlei gesetzlichen Regelungen.","textPt":"A redução das emissões na EcoTec GmbH não está sujeita a nenhuma regulamentação legal.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die EcoTec GmbH strebt die Verleihung des Umweltzeichens 'Blauer Engel' an. Welche Aussage zu einer mit dem 'Blauen Engel' ausgezeichneten Ware ist zutreffend?","qPt":"A EcoTec GmbH pretende obter o selo ambiental 'Blauer Engel' (Anjo Azul). Qual afirmação sobre um produto distinguido com o 'Blauer Engel' está correta?","a":"Eine mit dem 'Blauen Engel' ausgezeichnete Ware ist aus schadstoffarmen Rohstoffen hergestellt und wurde umweltschonend produziert.","aPt":"Um produto distinguido com o 'Blauer Engel' é fabricado a partir de matérias-primas com baixo teor de substâncias nocivas e foi produzido de forma a preservar o ambiente.","options":[{"text":"Die Ware ist aus schadstoffarmen Rohstoffen und umweltschonend produziert worden.","textPt":"O produto é fabricado a partir de matérias-primas com baixo teor de substâncias nocivas e foi produzido de forma a preservar o ambiente.","correct":true},{"text":"Die Ware ist besonders haltbar.","textPt":"O produto é particularmente duradouro.","correct":false},{"text":"Die Ware ist besonders sicher in der Handhabung.","textPt":"O produto é particularmente seguro de manusear.","correct":false},{"text":"Die Ware ist nach ihrer Benutzung ausschließlich über das Duale System zu entsorgen.","textPt":"O produto deve ser eliminado, após o uso, exclusivamente através do Sistema Dual de reciclagem.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Monion soll nach Beendigung seiner Ausbildung die Aufgaben des Arbeitsschutzbeauftragten bei der EcoTec GmbH übernehmen. Welche Aufgabe hat er als Arbeitsschutzbeauftragter?","qPt":"Após terminar a sua formação, o Sr. Monion deverá assumir as funções de responsável pela segurança no trabalho na EcoTec GmbH. Que função tem ele nesse cargo?","a":"Der Arbeitsschutzbeauftragte unterstützt den Arbeitgeber bei der Durchführung des Unfallschutzes, trägt aber nicht allein die Verantwortung für die Sicherheit im Betrieb.","aPt":"O responsável pela segurança no trabalho apoia o empregador na implementação da prevenção de acidentes, mas não é o único responsável pela segurança na empresa.","options":[{"text":"Der Arbeitsschutzbeauftragte unterstützt den Arbeitgeber bei der Durchführung des Unfallschutzes.","textPt":"O responsável pela segurança no trabalho apoia o empregador na implementação da prevenção de acidentes.","correct":true},{"text":"Der Arbeitsschutzbeauftragte ist für die Sicherheit im Betrieb allein verantwortlich.","textPt":"O responsável pela segurança no trabalho é o único responsável pela segurança na empresa.","correct":false},{"text":"Der Arbeitsschutzbeauftragte ist ein selbstständiges Organ im Sinne des Betriebsverfassungsrechts.","textPt":"O responsável pela segurança no trabalho é um órgão autónomo no sentido do direito de organização empresarial.","correct":false},{"text":"Der Arbeitsschutzbeauftragte ist automatisch Mitglied im Arbeitssicherheitsausschuss des Betriebsrates.","textPt":"O responsável pela segurança no trabalho é automaticamente membro da comissão de segurança do conselho de trabalhadores.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In einem Seminar bei der EcoTec GmbH werden Sofortmaßnahmen im Brandfall thematisiert. Welche der folgenden Maßnahmen muss im Brandfall bei der EcoTec GmbH sofort ergriffen werden?","qPt":"Num seminário na EcoTec GmbH são discutidas as medidas imediatas em caso de incêndio. Qual das seguintes medidas deve ser tomada imediatamente em caso de incêndio na EcoTec GmbH?","a":"Im Brandfall muss sofort der Notruf abgesetzt werden, damit Feuerwehr und Rettungskräfte schnellstmöglich alarmiert werden.","aPt":"Em caso de incêndio, deve ser imediatamente acionado o número de emergência, para que os bombeiros e as equipas de socorro sejam alertados o mais rápido possível.","options":[{"text":"Den Notruf absetzen","textPt":"Acionar o número de emergência","correct":true},{"text":"Alle Fenster öffnen, damit der Rauch abziehen kann","textPt":"Abrir todas as janelas para o fumo poder sair","correct":false},{"text":"Den Sicherheitsbeauftragten informieren, da er für die technischen Anlagen zuständig ist","textPt":"Informar o responsável de segurança, pois é responsável pelas instalações técnicas","correct":false},{"text":"Alle erreichbaren Wasserstellen öffnen","textPt":"Abrir todas as tomadas de água acessíveis","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche weitere Maßnahme muss im Brandfall bei der EcoTec GmbH ebenfalls sofort ergriffen werden?","qPt":"Que outra medida também deve ser tomada imediatamente em caso de incêndio na EcoTec GmbH?","a":"Alle gefährdeten Personen müssen sofort evakuiert werden, da der Schutz von Leben und Gesundheit oberste Priorität hat.","aPt":"Todas as pessoas em perigo devem ser evacuadas imediatamente, pois a proteção da vida e da saúde tem prioridade máxima.","options":[{"text":"Alle gefährdeten Personen evakuieren","textPt":"Evacuar todas as pessoas em perigo","correct":true},{"text":"Den Vorgesetzten informieren, da dieser die Verantwortung für die Abteilung hat","textPt":"Informar o superior, pois é responsável pelo departamento","correct":false},{"text":"Alle Fenster öffnen, damit der Rauch abziehen kann","textPt":"Abrir todas as janelas para o fumo poder sair","correct":false},{"text":"Alle erreichbaren Wasserstellen öffnen","textPt":"Abrir todas as tomadas de água acessíveis","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die EcoTec GmbH sucht nach Maßnahmen zur Stressreduzierung am Arbeitsplatz. Welche der folgenden Maßnahmen ist dafür NICHT geeignet?","qPt":"A EcoTec GmbH procura medidas para reduzir o stress no local de trabalho. Qual das seguintes medidas NÃO é adequada para esse fim?","a":"Werden Kundenbeschwerden nicht mehr persönlich, sondern nur noch telefonisch bearbeitet und zusätzlich am schwarzen Brett veröffentlicht, erhöht dies eher den Druck und die Bloßstellung der Mitarbeitenden, statt Stress zu reduzieren.","aPt":"Se as reclamações dos clientes deixarem de ser tratadas pessoalmente e passarem a ser resolvidas apenas por telefone, sendo ainda publicadas no quadro de avisos, isso tende a aumentar a pressão e a exposição dos colaboradores, em vez de reduzir o stress.","options":[{"text":"Kundenbeschwerden werden nicht mehr in persönlicher Gegenwart des Kunden, sondern ausschließlich am Telefon bearbeitet und am schwarzen Brett veröffentlicht.","textPt":"As reclamações dos clientes deixam de ser tratadas pessoalmente, passando a ser resolvidas apenas por telefone e publicadas no quadro de avisos.","correct":true},{"text":"Es werden Workshops zur Work-Life-Balance angeboten.","textPt":"São oferecidos workshops sobre equilíbrio entre vida profissional e pessoal.","correct":false},{"text":"Das Betriebssportangebot wird stark erweitert.","textPt":"A oferta de desporto na empresa é fortemente ampliada.","correct":false},{"text":"Die Möglichkeit zum Homeoffice wird offener und flexibler gestaltet.","textPt":"A possibilidade de trabalho remoto torna-se mais aberta e flexível.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche weitere Maßnahme ist zur Stressreduzierung bei der EcoTec GmbH NICHT geeignet?","qPt":"Que outra medida NÃO é adequada para reduzir o stress na EcoTec GmbH?","a":"Werden Misserfolge der Mitarbeitenden für alle und nicht nur für die Vorgesetzten bekanntgegeben, führt dies zu zusätzlichem Druck und Bloßstellung statt zu einer Stressreduzierung.","aPt":"Se os fracassos dos colaboradores forem divulgados para todos e não apenas para os superiores, isso gera pressão e exposição adicionais, em vez de reduzir o stress.","options":[{"text":"Misserfolge der Mitarbeitenden werden für alle und nicht nur für die Vorgesetzten bekanntgegeben.","textPt":"Os fracassos dos colaboradores são divulgados para todos e não apenas para os superiores.","correct":true},{"text":"Es wird eine angenehme Arbeitsatmosphäre geschaffen.","textPt":"É criado um ambiente de trabalho agradável.","correct":false},{"text":"Es werden Workshops zur Work-Life-Balance angeboten.","textPt":"São oferecidos workshops sobre equilíbrio entre vida profissional e pessoal.","correct":false},{"text":"Das Betriebssportangebot wird stark erweitert.","textPt":"A oferta de desporto na empresa é fortemente ampliada.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die EcoTec GmbH legt sowohl im Einstellungsverfahren als auch während der Beschäftigung großen Wert auf Gleichbehandlung. Welche Aussage trifft auf das Allgemeine Gleichbehandlungsgesetz (AGG) zu?","qPt":"A EcoTec GmbH dá grande importância à igualdade de tratamento, tanto no processo de contratação como durante o vínculo laboral. Qual afirmação está correta sobre a Lei Geral de Igualdade de Tratamento (AGG)?","a":"Das AGG regelt unter anderem, dass Benachteiligungen aus Gründen des Geschlechts, der Religion oder Weltanschauung nicht zulässig sind (§1 AGG).","aPt":"A AGG estabelece, entre outras coisas, que são proibidas as discriminações com base no sexo, na religião ou na visão de mundo (§1 da AGG).","options":[{"text":"Das AGG regelt unter anderem, dass Benachteiligungen aus Gründen des Geschlechts, der Religion oder Weltanschauung nicht zulässig sind.","textPt":"A AGG estabelece, entre outras coisas, que são proibidas as discriminações com base no sexo, na religião ou na visão de mundo.","correct":true},{"text":"Das AGG gilt nicht für Auszubildende.","textPt":"A AGG não se aplica aos aprendizes.","correct":false},{"text":"Bei Verstoß gegen das AGG haben die Betroffenen keinen Anspruch auf Schadenersatz.","textPt":"Em caso de violação da AGG, as pessoas afetadas não têm direito a indemnização.","correct":false},{"text":"Stellenausschreibungen müssen nicht zwingend geschlechtsneutral ausgeschrieben werden.","textPt":"Os anúncios de emprego não precisam obrigatoriamente de ser neutros em termos de género.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die EcoTec GmbH plant, zwei Fachinformatiker Anwendungsentwicklung (m/w/d) einzustellen. Welche Formulierung in einer Stellenanzeige verstößt gegen das Allgemeine Gleichbehandlungsgesetz (AGG)?","qPt":"A EcoTec GmbH planeia contratar dois técnicos de informática para desenvolvimento de aplicações (m/f/d). Qual formulação num anúncio de emprego viola a Lei Geral de Igualdade de Tratamento (AGG)?","a":"Die Formulierung 'Sie passen in unser junges dynamisches Team, wenn Sie jünger als 30 Jahre sind' stellt eine unzulässige Altersdiskriminierung dar und verstößt gegen das AGG.","aPt":"A formulação 'você vai encaixar-se na nossa equipa jovem e dinâmica se tiver menos de 30 anos' constitui uma discriminação etária ilícita e viola a AGG.","options":[{"text":"Sie passen in unser junges dynamisches Team, wenn Sie jünger als 30 Jahre sind.","textPt":"Você vai encaixar-se na nossa equipa jovem e dinâmica se tiver menos de 30 anos.","correct":true},{"text":"Sie verfügen über hervorragende Kenntnisse in Webprogrammierung.","textPt":"Você possui excelentes conhecimentos de programação web.","correct":false},{"text":"Sie sind mobil und bereit, auch mehrtägige Geschäftsreisen zu unternehmen.","textPt":"Você é móvel e está disposto(a) a fazer viagens de negócios de vários dias.","correct":false},{"text":"Sie beherrschen die englische Sprache verhandlungssicher in Wort und Schrift.","textPt":"Você domina o inglês a nível de negociação, oralmente e por escrito.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Müller, 18 Jahre alt, möchte bei der CBA-IT-Service GmbH (IT-Dienstleistungsunternehmen mit Sitz in Erfurt) eine Ausbildung zur Fachinformatikerin Anwendungsentwicklung beginnen. Welche der folgenden Vereinbarungen im Ausbildungsvertrag ist zulässig?","qPt":"A Sra. Müller, de 18 anos, quer iniciar uma formação como técnica de informática para desenvolvimento de aplicações na CBA-IT-Service GmbH (empresa de serviços de TI sediada em Erfurt). Qual das seguintes cláusulas no contrato de formação é permitida?","a":"Eine Verpflichtung zum Stillschweigen über Betriebsgeheimnisse ist nach §13 Nr. 6 BBiG zulässig und sogar eine gesetzliche Pflicht des Auszubildenden.","aPt":"Uma obrigação de sigilo sobre segredos comerciais é permitida nos termos do §13 n.º 6 da BBiG e constitui mesmo um dever legal do aprendiz.","options":[{"text":"Frau Müller verpflichtet sich zum Stillschweigen über Betriebsgeheimnisse.","textPt":"A Sra. Müller compromete-se a manter sigilo sobre segredos comerciais.","correct":true},{"text":"Frau Müller muss keinen Ausbildungsnachweis führen.","textPt":"A Sra. Müller não precisa de manter um registo de formação.","correct":false},{"text":"Ein Jobangebot zur Weiterbeschäftigung bei der CBA-IT-Service GmbH muss bei bestandener Prüfung angenommen werden.","textPt":"Uma oferta de continuação do emprego na CBA-IT-Service GmbH tem de ser aceite caso passe no exame.","correct":false},{"text":"Nach ihrer Ausbildung ist Frau Müller verpflichtet, mindestens zwei Jahre bei der CBA-IT-Service GmbH zu arbeiten.","textPt":"Depois da formação, a Sra. Müller é obrigada a trabalhar pelo menos dois anos na CBA-IT-Service GmbH.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche Rechtsfolge hätte eine unzulässige Vereinbarung für den restlichen Berufsausbildungsvertrag von Frau Müller bei der CBA-IT-Service GmbH?","qPt":"Que consequência jurídica teria uma cláusula contratual ilícita para o restante contrato de formação profissional da Sra. Müller na CBA-IT-Service GmbH?","a":"Nach §25 BBiG ist nur die unzulässige Vereinbarung selbst nichtig; der übrige Berufsausbildungsvertrag bleibt davon unberührt und gültig.","aPt":"Segundo o §25 da BBiG, apenas a cláusula ilícita em si é nula; o restante contrato de formação profissional permanece válido e inalterado.","options":[{"text":"Die betroffene Vereinbarung ist nichtig, der restliche Berufsausbildungsvertrag bleibt gültig.","textPt":"A cláusula em causa é nula, mas o restante contrato de formação permanece válido.","correct":true},{"text":"Der gesamte Berufsausbildungsvertrag ist nichtig.","textPt":"Todo o contrato de formação profissional é nulo.","correct":false},{"text":"Der Berufsausbildungsvertrag ist gültig, wenn die IHK damit einverstanden ist.","textPt":"O contrato de formação é válido se a câmara de comércio (IHK) concordar.","correct":false},{"text":"Der Berufsausbildungsvertrag ist gültig, wenn Frau Müller der fraglichen Vereinbarung ausdrücklich zustimmt.","textPt":"O contrato de formação é válido se a Sra. Müller concordar expressamente com a cláusula em causa.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Berufsausbildung für Frau Müller bei der CBA-IT-Service GmbH soll am 01.09.2026 beginnen. Zu welchem Zeitpunkt muss der Ausbildungsvertrag spätestens abgeschlossen werden?","qPt":"A formação profissional da Sra. Müller na CBA-IT-Service GmbH deve começar em 01.09.2026. Até quando, o mais tardar, o contrato de formação deve ser celebrado?","a":"Der Berufsausbildungsvertrag muss vor Beginn der Ausbildung abgeschlossen sein, spätestens also am 31.08.2026, dem letzten Tag vor Ausbildungsbeginn.","aPt":"O contrato de formação profissional deve ser celebrado antes do início da formação, ou seja, o mais tardar em 31.08.2026, o último dia antes do início da formação.","options":[{"text":"Am 31.08.2026","textPt":"A 31.08.2026","correct":true},{"text":"Am ersten Werktag im September 2026","textPt":"No primeiro dia útil de setembro de 2026","correct":false},{"text":"Am 02.09.2026","textPt":"A 02.09.2026","correct":false},{"text":"Bis zum Beginn des Berufsschulunterrichts nach den Sommerferien","textPt":"Até ao início das aulas na escola profissional após as férias de verão","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Müller wird ihre Berufsausbildung bei der CBA-IT-Service GmbH voraussichtlich am 13.07.2029 mit dem letzten Prüfungsteil abschließen. Welche Aussage zur Beendigung des Ausbildungsverhältnisses trifft zu?","qPt":"A Sra. Müller deverá concluir a sua formação profissional na CBA-IT-Service GmbH a 13.07.2029, com a última parte do exame. Qual afirmação sobre o términus da relação de formação está correta?","a":"Nach §21 Abs. 2 BBiG endet das Ausbildungsverhältnis vorzeitig mit der Bekanntgabe des positiven Prüfungsergebnisses der Abschlussprüfung, also noch vor dem vertraglich vorgesehenen Ende.","aPt":"Segundo o §21, parágrafo 2, da BBiG, a relação de formação termina antecipadamente com a comunicação do resultado positivo do exame final, ou seja, antes do fim previsto no contrato.","options":[{"text":"Mit der Bekanntgabe des positiven Prüfungsergebnisses der Abschlussprüfung endet das Ausbildungsverhältnis.","textPt":"A relação de formação termina com a comunicação do resultado positivo do exame final.","correct":true},{"text":"Das Ausbildungsverhältnis endet nach der schriftlichen Abschlussprüfung.","textPt":"A relação de formação termina após o exame final escrito.","correct":false},{"text":"Der dreijährige Ausbildungsvertrag mit der CBA-IT-Service GmbH kann nur mit Fristablauf am 31.08.2029 beendet werden.","textPt":"O contrato de formação de três anos com a CBA-IT-Service GmbH só pode terminar com o fim do prazo a 31.08.2029.","correct":false},{"text":"Das Ausbildungsverhältnis endet mit Beginn der Sommerferien der Berufsschule.","textPt":"A relação de formação termina com o início das férias de verão da escola profissional.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der CBA-IT-Service GmbH werden zum 01.09.2026 zwei neue Auszubildende (Valentina Eberle, 21 Jahre, und Robert Traber, 22 Jahre) eingestellt. Welche Aussage zur Ausbildungsvergütung ist zutreffend?","qPt":"Na CBA-IT-Service GmbH serão contratados dois novos aprendizes (Valentina Eberle, 21 anos, e Robert Traber, 22 anos) a partir de 01.09.2026. Qual afirmação sobre a remuneração da formação está correta?","a":"Die Ausbildungsvergütung muss nach dem BBiG von einem Ausbildungsjahr zum nächsten ansteigen, um der wachsenden Leistung der Auszubildenden Rechnung zu tragen.","aPt":"Segundo a BBiG, a remuneração da formação deve aumentar de um ano de formação para o seguinte, de modo a refletir o desempenho crescente dos aprendizes.","options":[{"text":"Die Ausbildungsvergütung muss von einem Ausbildungsjahr auf das nächste Ausbildungsjahr ansteigen.","textPt":"A remuneração da formação deve aumentar de um ano de formação para o seguinte.","correct":true},{"text":"Die CBA-IT-Service GmbH ist verpflichtet, den beiden Auszubildenden die monatliche Ausbildungsvergütung bis zum 15. eines Monats zu zahlen.","textPt":"A CBA-IT-Service GmbH é obrigada a pagar aos dois aprendizes a remuneração mensal até ao dia 15 de cada mês.","correct":false},{"text":"Da die beiden Auszubildenden volljährig sind, müssen sie sich selbst um die Anmeldung zum Berufsschulunterricht kümmern.","textPt":"Como os dois aprendizes são maiores de idade, devem tratar sozinhos da inscrição nas aulas da escola profissional.","correct":false},{"text":"Da die beiden Auszubildenden volljährig sind, sind sie nicht verpflichtet, ein Berichtsheft zu führen.","textPt":"Como os dois aprendizes são maiores de idade, não são obrigados a manter um caderno de registo da formação.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche weitere Aussage zu den beiden neuen Auszubildenden (Valentina Eberle, 21 Jahre, und Robert Traber, 22 Jahre) bei der CBA-IT-Service GmbH ist zutreffend?","qPt":"Que outra afirmação sobre os dois novos aprendizes (Valentina Eberle, 21 anos, e Robert Traber, 22 anos) na CBA-IT-Service GmbH está correta?","a":"Nach dem Arbeitszeitgesetz steht Beschäftigten spätestens nach sechs Stunden Arbeitszeit eine Ruhepause zu; dies gilt auch für volljährige Auszubildende.","aPt":"Segundo a Lei do Tempo de Trabalho, os trabalhadores têm direito a uma pausa o mais tardar após seis horas de trabalho; isto também se aplica a aprendizes maiores de idade.","options":[{"text":"Den beiden Auszubildenden steht spätestens nach sechs Stunden Arbeitszeit eine Ruhepause zu.","textPt":"Os dois aprendizes têm direito a uma pausa o mais tardar após seis horas de trabalho.","correct":true},{"text":"Mit den Auszubildenden darf eine Probezeit von sechs Monaten vereinbart werden, da sie das 18. Lebensjahr bereits vollendet haben.","textPt":"Pode ser acordado um período de experiência de seis meses com os aprendizes, pois já completaram 18 anos.","correct":false},{"text":"Da die beiden Auszubildenden volljährig sind, müssen sie sich selbst um die Anmeldung zum Berufsschulunterricht kümmern.","textPt":"Como os dois aprendizes são maiores de idade, devem tratar sozinhos da inscrição nas aulas da escola profissional.","correct":false},{"text":"Da die beiden Auszubildenden volljährig sind, sind sie nicht verpflichtet, ein Berichtsheft zu führen.","textPt":"Como os dois aprendizes são maiores de idade, não são obrigados a manter um caderno de registo da formação.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Kermann ist bei der CBA-IT-Service GmbH angestellt. Sie rutscht während der Arbeit an einem Aufsteller aus und zieht sich dabei erhebliche Verletzungen zu. Welche der folgenden Reihenfolgen der Schritte nach dem Unfall ist richtig?\n\na) Eine Arbeitskollegin leistet Erste Hilfe.\nb) Frau Kermann nimmt nach insgesamt sieben Wochen die Arbeit wieder auf.\nc) Spätestens nach Kenntniserlangung vom Befund des Durchgangsarztes muss die CBA-IT-Service GmbH die Unfallmeldung an die Berufsgenossenschaft schicken.\nd) Frau Kermann tritt im Anschluss an die Zeit der Arbeitsunfähigkeit eine fünfwöchige Reha-Maßnahme in einer Klinik an.\ne) Die CBA-IT-Service GmbH schickt Frau Kermann unverzüglich zu einem Durchgangsarzt, der sie für zwei Wochen arbeitsunfähig schreibt.","qPt":"A Sra. Kermann trabalha na CBA-IT-Service GmbH. Durante o trabalho, escorrega num expositor e sofre ferimentos graves. Qual das seguintes sequências de passos após o acidente está correta?\n\na) Uma colega de trabalho presta os primeiros socorros.\nb) A Sra. Kermann retoma o trabalho após um total de sete semanas.\nc) O mais tardar após tomar conhecimento do diagnóstico do médico de urgência, a CBA-IT-Service GmbH deve enviar a participação do acidente à associação profissional.\nd) A Sra. Kermann inicia, após o período de incapacidade para o trabalho, um tratamento de reabilitação de cinco semanas numa clínica.\ne) A CBA-IT-Service GmbH envia imediatamente a Sra. Kermann a um médico de urgência, que a declara incapaz para o trabalho durante duas semanas.","a":"Die richtige Reihenfolge ist a-e-c-d-b: Zuerst leistet die Kollegin Erste Hilfe (a), danach wird Frau Kermann unverzüglich zum Durchgangsarzt geschickt (e), anschließend erfolgt spätestens nach dessen Befund die Unfallmeldung an die Berufsgenossenschaft (c), danach die fünfwöchige Reha-Maßnahme (d) und schließlich die Rückkehr zur Arbeit nach insgesamt sieben Wochen (b).","aPt":"A ordem correta é a-e-c-d-b: primeiro, a colega presta os primeiros socorros (a); depois, a Sra. Kermann é enviada imediatamente ao médico de urgência (e); em seguida, o mais tardar após o diagnóstico deste, é feita a participação do acidente à associação profissional (c); depois segue-se o tratamento de reabilitação de cinco semanas (d); e, por fim, o regresso ao trabalho após um total de sete semanas (b).","options":[{"text":"a – e – c – d – b","textPt":"a – e – c – d – b","correct":true},{"text":"e – a – d – c – b","textPt":"e – a – d – c – b","correct":false},{"text":"a – c – e – b – d","textPt":"a – c – e – b – d","correct":false},{"text":"c – a – e – d – b","textPt":"c – a – e – d – b","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche Versicherung kommt für die Kosten der Reha-Maßnahme nach dem Arbeitsunfall von Frau Kermann bei der CBA-IT-Service GmbH auf?","qPt":"Qual seguro cobre os custos do tratamento de reabilitação após o acidente de trabalho da Sra. Kermann na CBA-IT-Service GmbH?","a":"Für die Kosten einer Reha-Maßnahme nach einem Arbeitsunfall kommt die gesetzliche Unfallversicherung auf, die über die Berufsgenossenschaft organisiert ist.","aPt":"Os custos de um tratamento de reabilitação após um acidente de trabalho são cobertos pelo seguro de acidentes obrigatório, organizado através da associação profissional.","options":[{"text":"Gesetzliche Unfallversicherung","textPt":"Seguro de acidentes obrigatório","correct":true},{"text":"Gesetzliche Pflegeversicherung","textPt":"Seguro de dependência obrigatório","correct":false},{"text":"Betriebsunterbrechungsversicherung","textPt":"Seguro de interrupção de atividade da empresa","correct":false},{"text":"Private Unfallversicherung von Frau Kermann","textPt":"Seguro de acidentes privado da Sra. Kermann","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Kermann ist mit dem Bescheid zur Kostenübernahme ihrer Reha-Maßnahme nicht einverstanden und möchte den Sachverhalt vor Gericht klären lassen. Welches Gericht ist zunächst zuständig?","qPt":"A Sra. Kermann não concorda com a decisão sobre a cobertura dos custos do seu tratamento de reabilitação e pretende esclarecer o assunto em tribunal. Qual é o tribunal competente em primeira instância?","a":"Für Streitigkeiten mit der gesetzlichen Unfallversicherung (Berufsgenossenschaft) ist das Sozialgericht zuständig.","aPt":"Para litígios com o seguro de acidentes obrigatório (associação profissional), o tribunal competente é o Tribunal Social.","options":[{"text":"Sozialgericht","textPt":"Tribunal Social (Sozialgericht)","correct":true},{"text":"Arbeitsgericht","textPt":"Tribunal do Trabalho (Arbeitsgericht)","correct":false},{"text":"Verwaltungsgericht","textPt":"Tribunal Administrativo (Verwaltungsgericht)","correct":false},{"text":"Amtsgericht","textPt":"Tribunal de Primeira Instância (Amtsgericht)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Fachinformatikerin Wiebke Völker ist seit dem 1. März 2023 bei der CBA-IT-Service GmbH angestellt. Ihr Bruttogehalt beträgt 4.200,00 EUR. Frau Völker ist Mitglied einer gesetzlichen Krankenkasse, die den Zusatzbeitrag auf 2,4% erhöht hat. Der allgemeine Beitragssatz beträgt 14,6%. Berechnen Sie Frau Völkers Arbeitnehmeranteil zur gesetzlichen Krankenversicherung.","qPt":"A técnica de informática Wiebke Völker trabalha na CBA-IT-Service GmbH desde 1 de março de 2023. O seu salário bruto é de 4.200,00 EUR. A Sra. Völker é segurada de uma caixa de saúde pública que aumentou o contributo adicional para 2,4%. A taxa geral de contribuição é de 14,6%. Calcule a parte do contributo para o seguro de saúde público que cabe à trabalhadora.","a":"Der Gesamtbeitragssatz beträgt 14,6% + 2,4% = 17,0%. Dieser wird je zur Hälfte von Arbeitgeber und Arbeitnehmer getragen, der Arbeitnehmeranteil beträgt also 8,5%. 4.200,00 EUR × 8,5% = 357,00 EUR.","aPt":"A taxa total de contribuição é de 14,6% + 2,4% = 17,0%. Esta é dividida igualmente entre empregador e trabalhador, pelo que a parte da trabalhadora é de 8,5%. 4.200,00 EUR × 8,5% = 357,00 EUR.","options":[{"text":"357,00 EUR","textPt":"357,00 EUR","correct":true},{"text":"714,00 EUR","textPt":"714,00 EUR","correct":false},{"text":"613,20 EUR","textPt":"613,20 EUR","correct":false},{"text":"306,60 EUR","textPt":"306,60 EUR","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Auszubildende Paula Kaiser (20 Jahre) bei der CBA-IT-Service GmbH ist schwanger; der errechnete Geburtstermin ist der 1. Dezember 2026. Sie hat den Arbeitgeber über die Schwangerschaft informiert. Welche Aussage zu ihrem Ausbildungsvertrag trifft zu?","qPt":"A aprendiz Paula Kaiser (20 anos) na CBA-IT-Service GmbH está grávida; a data prevista de parto é 1 de dezembro de 2026. Ela informou o empregador sobre a gravidez. Qual afirmação sobre o seu contrato de formação está correta?","a":"Für werdende Mütter gilt nach dem Mutterschutzgesetz (MuSchG) ein besonderer Kündigungsschutz: Während der Schwangerschaft und bis vier Monate nach der Entbindung darf grundsätzlich nicht gekündigt werden.","aPt":"Para as futuras mães aplica-se, segundo a Lei de Proteção à Maternidade (MuSchG), uma proteção especial contra o despedimento: durante a gravidez e até quatro meses após o parto, em princípio não é permitido despedir.","options":[{"text":"Für werdende Mütter gilt ein besonderer Kündigungsschutz.","textPt":"Para as futuras mães aplica-se uma proteção especial contra o despedimento.","correct":true},{"text":"Das Ausbildungsverhältnis endet mit der Bekanntgabe des Geburtstermins an den Arbeitgeber.","textPt":"A relação de formação termina com a comunicação da data de parto ao empregador.","correct":false},{"text":"Frau Kaiser steht für die Zeit der Schwangerschaft keine Ausbildungsvergütung zu.","textPt":"A Sra. Kaiser não tem direito a remuneração de formação durante a gravidez.","correct":false},{"text":"Frau Kaiser muss Elterngeld als Lohnersatzleistung beantragen.","textPt":"A Sra. Kaiser deve requerer o subsídio parental como substituição do salário.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Am 30. November 2026 bringt Frau Kaiser ihre Tochter Lara zur Welt. Am 27. Dezember 2026 meldet sie sich bei der CBA-IT-Service GmbH und möchte wieder zur Arbeit kommen, da sie sich fit fühlt. Ab wann darf Frau Kaiser frühestens wieder arbeiten?","qPt":"A 30 de novembro de 2026, a Sra. Kaiser dá à luz a sua filha Lara. A 27 de dezembro de 2026, ela contacta a CBA-IT-Service GmbH e manifesta vontade de voltar a trabalhar, pois sente-se em condições. A partir de quando, o mais cedo possível, a Sra. Kaiser pode voltar a trabalhar?","a":"Nach §6 Abs. 1 MuSchG dürfen Mütter grundsätzlich bis zum Ablauf von acht Wochen nach der Entbindung nicht beschäftigt werden; vorher besteht ein Beschäftigungsverbot, unabhängig davon, ob sie sich arbeitsfähig fühlt.","aPt":"Segundo o §6, parágrafo 1, da MuSchG, em princípio as mães não podem trabalhar até ao fim de oito semanas após o parto; antes disso existe uma proibição de trabalho, independentemente de a trabalhadora se sentir apta.","options":[{"text":"Frühestens acht Wochen nach der Entbindung; vorher besteht ein Beschäftigungsverbot.","textPt":"O mais cedo, oito semanas após o parto; antes disso existe proibição de trabalho.","correct":true},{"text":"Frühestens sechs Wochen nach der Entbindung; vorher besteht ein Beschäftigungsverbot.","textPt":"O mais cedo, seis semanas após o parto; antes disso existe proibição de trabalho.","correct":false},{"text":"Sofort, wenn Frau Kaiser vom Arzt ihre Arbeitsfähigkeit bescheinigt wird.","textPt":"Imediatamente, se um médico certificar a sua aptidão para o trabalho.","correct":false},{"text":"Frühestens zwölf Wochen nach der Entbindung; vorher besteht ein Beschäftigungsverbot.","textPt":"O mais cedo, doze semanas após o parto; antes disso existe proibição de trabalho.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die CBA-IT-Service GmbH ist Mitglied des Arbeitgeberverbandes. In welchem Bestandteil des Arbeitsvertrags eines Mitarbeiters ist die CBA-IT-Service GmbH an kollektives Arbeitsrecht gebunden?","qPt":"A CBA-IT-Service GmbH é membro da associação patronal. Em qual elemento do contrato de trabalho de um colaborador a CBA-IT-Service GmbH está vinculada ao direito coletivo do trabalho?","a":"Als tarifgebundenes Unternehmen ist die CBA-IT-Service GmbH an die im Tarifvertrag festgelegte wöchentliche Arbeitszeit von 38,5 Stunden gebunden; dies ist kollektives (tarifliches) Arbeitsrecht.","aPt":"Enquanto empresa vinculada à convenção coletiva, a CBA-IT-Service GmbH está obrigada ao horário semanal de 38,5 horas fixado na convenção coletiva; trata-se de direito coletivo do trabalho.","options":[{"text":"Die wöchentliche Arbeitszeit beträgt laut Tarifvertrag 38,5 Stunden.","textPt":"O horário semanal de trabalho é de 38,5 horas, segundo a convenção coletiva.","correct":true},{"text":"Das Arbeitsverhältnis beginnt am 1. Juli 2026.","textPt":"A relação de trabalho começa a 1 de julho de 2026.","correct":false},{"text":"Der Mitarbeiter erhält eine individuelle Zulage von 200 EUR monatlich.","textPt":"O colaborador recebe um subsídio individual de 200 EUR por mês.","correct":false},{"text":"Der Mitarbeiter wird am Standort Erfurt eingesetzt.","textPt":"O colaborador é colocado na unidade de Erfurt.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Geschäftsleitung der CBA-IT-Service GmbH arbeitet vertrauensvoll mit dem Betriebsrat zusammen. Bei welcher der folgenden Angelegenheiten hat der Betriebsrat laut Betriebsverfassungsgesetz (BetrVG) ein Mitbestimmungsrecht?","qPt":"A direção da CBA-IT-Service GmbH trabalha em cooperação de confiança com o conselho de trabalhadores. Em qual dos seguintes assuntos o Betriebsrat tem direito de codecisão segundo a Lei de Organização Empresarial (BetrVG)?","a":"Beginn und Ende der täglichen Arbeitszeit sind nach §87 Abs. 1 Nr. 2 BetrVG ein klassischer Mitbestimmungstatbestand des Betriebsrats.","aPt":"O início e o fim do horário diário de trabalho constituem, segundo o §87, parágrafo 1, n.º 2, da BetrVG, um dos assuntos clássicos sujeitos ao direito de codecisão do conselho de trabalhadores.","options":[{"text":"Beginn und Ende der täglichen Arbeitszeit","textPt":"Início e fim do horário diário de trabalho","correct":true},{"text":"Bau einer neuen Lagerhalle","textPt":"Construção de um novo armazém","correct":false},{"text":"Anschaffung neuer Lagertechnik","textPt":"Aquisição de nova tecnologia de armazenamento","correct":false},{"text":"Gründung einer neuen Filiale","textPt":"Criação de uma nova filial","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei welcher weiteren Angelegenheit hat der Betriebsrat der CBA-IT-Service GmbH laut Betriebsverfassungsgesetz (BetrVG) ein Mitbestimmungsrecht?","qPt":"Em que outro assunto o Betriebsrat da CBA-IT-Service GmbH tem direito de codecisão segundo a BetrVG?","a":"Die Einführung und Anwendung von technischen Einrichtungen zur Überwachung des Verhaltens oder der Leistung der Arbeitnehmer unterliegt nach §87 Abs. 1 Nr. 6 BetrVG der Mitbestimmung des Betriebsrats.","aPt":"A introdução e utilização de dispositivos técnicos destinados a monitorizar o comportamento ou o desempenho dos trabalhadores está sujeita à codecisão do conselho de trabalhadores, segundo o §87, parágrafo 1, n.º 6, da BetrVG.","options":[{"text":"Überwachung der Arbeitnehmer durch technische Einrichtungen","textPt":"Monitorização dos trabalhadores através de dispositivos técnicos","correct":true},{"text":"Planung des Fortbildungsbedarfs","textPt":"Planeamento das necessidades de formação contínua","correct":false},{"text":"Bau einer neuen Lagerhalle","textPt":"Construção de um novo armazém","correct":false},{"text":"Anschaffung neuer Lagertechnik","textPt":"Aquisição de nova tecnologia de armazenamento","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Viele Mitarbeiter der CBA-IT-Service GmbH sind Mitglied einer Gewerkschaft. Welche Aussage über gewerkschaftliche Aufgaben und Forderungen in der Bundesrepublik Deutschland trifft zu?","qPt":"Muitos colaboradores da CBA-IT-Service GmbH são membros de um sindicato. Qual afirmação sobre as tarefas e reivindicações sindicais na República Federal da Alemanha está correta?","a":"Gewerkschaften verhandeln unter anderem mit Arbeitgeberverbänden über die Verbesserung von Arbeitsbedingungen, zum Beispiel im Rahmen von Tarifverhandlungen.","aPt":"Os sindicatos negociam, entre outras coisas, com as associações patronais a melhoria das condições de trabalho, por exemplo no âmbito de negociações coletivas.","options":[{"text":"Die Gewerkschaften verhandeln u. a. mit Arbeitgeberverbänden über die Verbesserung von Arbeitsbedingungen.","textPt":"Os sindicatos negoceiam, entre outras coisas, com as associações patronais a melhoria das condições de trabalho.","correct":true},{"text":"Das Grundgesetz räumt den Gewerkschaften lediglich ein Recht für den Abschluss von Lohntarifverträgen ein.","textPt":"A Lei Fundamental concede aos sindicatos apenas o direito de celebrar convenções salariais.","correct":false},{"text":"Gewerkschaftsvertreter dürfen zu Betriebsversammlungen nicht eingeladen werden.","textPt":"Os representantes sindicais não podem ser convidados para assembleias de empresa.","correct":false},{"text":"Die Gewerkschaften dürfen ihren Mitgliedern keinen Rechtsschutz in arbeitsgerichtlichen Rechtsstreitigkeiten gewähren.","textPt":"Os sindicatos não podem conceder aos seus membros proteção jurídica em litígios de tribunais do trabalho.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die CBA-IT-Service GmbH wird in der Rechtsform einer GmbH geführt. Welche Aussage trifft auf die Rechtsform der GmbH zu?","qPt":"A CBA-IT-Service GmbH está organizada sob a forma jurídica de uma GmbH. Qual afirmação está correta sobre a forma jurídica da GmbH?","a":"Die Gesellschafter einer GmbH haften grundsätzlich nur mit ihrer (eingezahlten) Stammeinlage, nicht mit ihrem sonstigen Privatvermögen - das ist das Kernmerkmal dieser Kapitalgesellschaft.","aPt":"Em princípio, os sócios de uma GmbH respondem apenas com a sua participação no capital social (já realizada), não com o restante património pessoal — esta é a característica central desta sociedade de capitais.","options":[{"text":"Die Gesellschafter der GmbH haften nur mit ihrer Stammeinlage.","textPt":"Os sócios da GmbH respondem apenas com a sua participação no capital social.","correct":true},{"text":"Die GmbH gehört zu den Personengesellschaften.","textPt":"A GmbH pertence às sociedades de pessoas.","correct":false},{"text":"Die Gesellschafter der GmbH dürfen nicht gleichzeitig Geschäftsführer der GmbH sein.","textPt":"Os sócios da GmbH não podem ser simultaneamente gerentes da GmbH.","correct":false},{"text":"Das Stammkapital muss mindestens 50.000 EUR betragen.","textPt":"O capital social deve ser de, no mínimo, 50.000 EUR.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die CBA-IT-Service GmbH erzielte im vergangenen Geschäftsjahr einen Reingewinn von 24.860,00 EUR. Das Eigenkapital betrug 220.000,00 EUR. Berechnen Sie die Eigenkapitalrentabilität der CBA-IT-Service GmbH.","qPt":"A CBA-IT-Service GmbH obteve, no último exercício, um lucro líquido de 24.860,00 EUR. O capital próprio era de 220.000,00 EUR. Calcule a rentabilidade do capital próprio da CBA-IT-Service GmbH.","a":"Eigenkapitalrentabilität = Reingewinn / Eigenkapital × 100 = 24.860,00 EUR / 220.000,00 EUR × 100 = 11,3 %.","aPt":"Rentabilidade do capital próprio = Lucro líquido / Capital próprio × 100 = 24.860,00 EUR / 220.000,00 EUR × 100 = 11,3%.","options":[{"text":"11,3 %","textPt":"11,3%","correct":true},{"text":"8,9 %","textPt":"8,9%","correct":false},{"text":"13,0 %","textPt":"13,0%","correct":false},{"text":"24,9 %","textPt":"24,9%","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Geschäftsführung der CBA-IT-Service GmbH diskutiert Maßnahmen, den Umsatz im nächsten Geschäftsjahr zu steigern. Welche Einzelmaßnahme ist geeignet, dieses Ziel kurzfristig und unmittelbar zu erreichen?","qPt":"A direção da CBA-IT-Service GmbH discute medidas para aumentar o volume de negócios no próximo exercício. Qual medida é adequada para alcançar este objetivo a curto prazo e de forma imediata?","a":"Die Förderung des Verkaufs der eigenen Software durch geeignete Marketingmaßnahmen kann kurzfristig und unmittelbar zu einer Umsatzsteigerung führen, während die übrigen Optionen entweder Kosten senken, nicht den Umsatz, oder erst langfristig wirken.","aPt":"A promoção da venda do software próprio através de medidas de marketing adequadas pode gerar um aumento imediato e a curto prazo do volume de negócios, enquanto as outras opções reduzem custos (não o volume de negócios) ou só têm efeito a longo prazo.","options":[{"text":"Der Verkauf einer eigenen Software soll durch geeignete Marketingmaßnahmen gefördert werden.","textPt":"A venda de um software próprio deve ser promovida através de medidas de marketing adequadas.","correct":true},{"text":"Die CBA-IT-Service GmbH stellt einen weiteren Lageristen ein.","textPt":"A CBA-IT-Service GmbH contrata mais um trabalhador de armazém.","correct":false},{"text":"Durch Umbaumaßnahmen wird das Versandlager um 20 % vergrößert.","textPt":"Através de obras, o armazém de expedição é ampliado em 20%.","correct":false},{"text":"Der Werbeetat wird um die Hälfte gekürzt.","textPt":"O orçamento de publicidade é cortado para metade.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Nach ihrer Ausbildung möchte Frau Müller eine Zeitlang im Ausland arbeiten und liest dafür vom Dienst Europass. Welche Aussage zum Europass trifft zu?","qPt":"Depois da sua formação, a Sra. Müller quer trabalhar algum tempo no estrangeiro e informa-se sobre o serviço Europass. Qual afirmação sobre o Europass está correta?","a":"Der Europass unterstützt Auszubildende dabei, ihre erworbenen Qualifikationen, Fähigkeiten und Kompetenzen bei Bewerbungen europaweit verständlich darzustellen.","aPt":"O Europass ajuda os formandos a apresentar, de forma compreensível em toda a Europa, as qualificações, aptidões e competências adquiridas, ao candidatarem-se a empregos.","options":[{"text":"Der Europass unterstützt Auszubildende, erworbene Qualifikationen, Fähigkeiten und Kompetenzen bei Bewerbungen europaweit verständlich darzustellen.","textPt":"O Europass ajuda os formandos a apresentar, de forma compreensível em toda a Europa, as qualificações e competências adquiridas.","correct":true},{"text":"Der Europass ist ein kostenpflichtiger Dienst der EU.","textPt":"O Europass é um serviço pago da UE.","correct":false},{"text":"Der Europass ist für eine Berufsausbildung im Ausland verpflichtend.","textPt":"O Europass é obrigatório para uma formação profissional no estrangeiro.","correct":false},{"text":"Der Europass beglaubigt Ausbildungsabschnitte von Auszubildenden, die im europäischen Ausland durchgeführt wurden.","textPt":"O Europass autentica períodos de formação realizados no estrangeiro europeu.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Korok soll bei der CBA-IT-Service GmbH die Aufgaben des Arbeitsschutzbeauftragten übernehmen. Welche Aufgabe hat der Arbeitsschutzbeauftragte in einem Betrieb?","qPt":"O Sr. Korok vai assumir, na CBA-IT-Service GmbH, as funções de responsável pela segurança no trabalho. Que função tem o responsável pela segurança no trabalho numa empresa?","a":"Der Arbeitsschutzbeauftragte unterstützt den Arbeitgeber bei der Durchführung des Unfallschutzes; die Gesamtverantwortung für den Arbeitsschutz verbleibt beim Arbeitgeber.","aPt":"O responsável pela segurança no trabalho apoia o empregador na implementação da prevenção de acidentes; a responsabilidade geral pela segurança no trabalho continua a ser do empregador.","options":[{"text":"Der Arbeitsschutzbeauftragte unterstützt den Arbeitgeber bei der Durchführung des Unfallschutzes.","textPt":"O responsável pela segurança no trabalho apoia o empregador na implementação da prevenção de acidentes.","correct":true},{"text":"Der Arbeitsschutzbeauftragte ist für den Arbeitsschutz im Betrieb allein verantwortlich.","textPt":"O responsável pela segurança no trabalho é o único responsável pela segurança na empresa.","correct":false},{"text":"Der Arbeitsschutzbeauftragte ist ein selbstständiges Organ im Sinne des Betriebsverfassungsgesetzes.","textPt":"O responsável pela segurança no trabalho é um órgão autónomo no sentido da Lei de Organização Empresarial.","correct":false},{"text":"Der Arbeitsschutzbeauftragte ist automatisch Mitglied im Arbeitssicherheitsausschuss des Betriebsrates.","textPt":"O responsável pela segurança no trabalho é automaticamente membro da comissão de segurança do conselho de trabalhadores.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In einem Seminar bei der CBA-IT-Service GmbH werden Sofortmaßnahmen im Brandfall thematisiert. Welche der folgenden Maßnahmen muss im Brandfall sofort ergriffen werden?","qPt":"Num seminário na CBA-IT-Service GmbH são discutidas as medidas imediatas em caso de incêndio. Qual das seguintes medidas deve ser tomada imediatamente em caso de incêndio?","a":"Im Brandfall muss sofort der Notruf abgesetzt werden, damit Feuerwehr und Rettungskräfte schnellstmöglich alarmiert werden.","aPt":"Em caso de incêndio, deve ser imediatamente acionado o número de emergência, para que os bombeiros e as equipas de socorro sejam alertados o mais rápido possível.","options":[{"text":"Notruf absetzen","textPt":"Acionar o número de emergência","correct":true},{"text":"Alle Fenster öffnen, damit der Rauch abziehen kann","textPt":"Abrir todas as janelas para o fumo poder sair","correct":false},{"text":"Die Sicherheitsbeauftragte informieren, da sie für die technischen Anlagen zuständig ist","textPt":"Informar a responsável de segurança, pois é responsável pelas instalações técnicas","correct":false},{"text":"Alle erreichbaren Wasserstellen öffnen","textPt":"Abrir todas as tomadas de água acessíveis","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche weitere Maßnahme muss im Brandfall bei der CBA-IT-Service GmbH sofort ergriffen werden?","qPt":"Que outra medida deve ser tomada imediatamente em caso de incêndio na CBA-IT-Service GmbH?","a":"Gefährdete Personen müssen sofort evakuiert werden, da der Schutz von Leben und Gesundheit oberste Priorität hat.","aPt":"As pessoas em perigo devem ser evacuadas imediatamente, pois a proteção da vida e da saúde tem prioridade máxima.","options":[{"text":"Gefährdete Personen evakuieren","textPt":"Evacuar as pessoas em perigo","correct":true},{"text":"Den Vorgesetzten informieren, da dieser die Verantwortung für die Abteilung hat","textPt":"Informar o superior, pois é responsável pelo departamento","correct":false},{"text":"Alle Fenster öffnen, damit der Rauch abziehen kann","textPt":"Abrir todas as janelas para o fumo poder sair","correct":false},{"text":"Alle erreichbaren Wasserstellen öffnen","textPt":"Abrir todas as tomadas de água acessíveis","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Das Lager der CBA-IT-Service GmbH soll auf Emissionen überprüft werden. Welche Darstellung ist in diesem Zusammenhang richtig?","qPt":"O armazém da CBA-IT-Service GmbH deve ser verificado quanto a emissões. Qual afirmação está correta neste contexto?","a":"Zu den umweltbelastenden Emissionen gehören neben umweltschädlichen Abgasen auch mögliche Schallemissionen und Elektrosmog/Strahlung.","aPt":"As emissões poluentes incluem, além dos gases de escape prejudiciais ao ambiente, também possíveis emissões sonoras e eletrossmog/radiação.","options":[{"text":"Zu den umweltbelastenden Emissionen gehören neben umweltschädlichen Abgasen auch mögliche Schallemissionen und Elektrosmog/Strahlung.","textPt":"As emissões poluentes incluem, além dos gases de escape prejudiciais, também possíveis emissões sonoras e eletrossmog/radiação.","correct":true},{"text":"Emissionen entstehen in der CBA-IT-Service GmbH allein durch den Transport von Waren zwischen verschiedenen Lagerorten.","textPt":"As emissões na CBA-IT-Service GmbH surgem apenas do transporte de mercadorias entre diferentes locais de armazenamento.","correct":false},{"text":"Emissionen können durch den Bau höherer Schornsteine für Abgase der CBA-IT-Service GmbH reduziert oder vermieden werden.","textPt":"As emissões podem ser reduzidas ou evitadas construindo chaminés mais altas para os gases de escape da CBA-IT-Service GmbH.","correct":false},{"text":"Die Verringerung der Emissionen in der CBA-IT-Service GmbH ist wichtiger als deren Vermeidung.","textPt":"A redução das emissões na CBA-IT-Service GmbH é mais importante do que a sua prevenção.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die CBA-IT-Service GmbH sucht nach Maßnahmen, um die Gesundheit der Mitarbeiter am Arbeitsplatz zu fördern; eine Umfrage ergab den Wunsch nach Stressreduzierung. Welche der folgenden Maßnahmen ist dafür NICHT geeignet?","qPt":"A CBA-IT-Service GmbH procura medidas para promover a saúde dos colaboradores no local de trabalho; um inquérito revelou o desejo de reduzir o stress. Qual das seguintes medidas NÃO é adequada para esse fim?","a":"Werden Kundenbeschwerden nicht mehr persönlich, sondern ausschließlich telefonisch bearbeitet und zusätzlich am schwarzen Brett veröffentlicht, erhöht dies eher den Druck und die Bloßstellung der Mitarbeiter, statt Stress zu reduzieren.","aPt":"Se as reclamações dos clientes deixarem de ser tratadas pessoalmente, passando a ser resolvidas apenas por telefone e ainda publicadas no quadro de avisos, isso tende a aumentar a pressão e a exposição dos colaboradores, em vez de reduzir o stress.","options":[{"text":"Kundenbeschwerden werden nicht mehr in persönlicher Gegenwart des Kunden, sondern ausschließlich am Telefon bearbeitet und am schwarzen Brett veröffentlicht.","textPt":"As reclamações dos clientes deixam de ser tratadas pessoalmente, passando a ser resolvidas apenas por telefone e publicadas no quadro de avisos.","correct":true},{"text":"Es werden Workshops zur Work-Life-Balance angeboten.","textPt":"São oferecidos workshops sobre equilíbrio entre vida profissional e pessoal.","correct":false},{"text":"Das Betriebssportangebot wird stark erweitert.","textPt":"A oferta de desporto na empresa é fortemente ampliada.","correct":false},{"text":"Die Möglichkeit zum Homeoffice wird offener und flexibler gestaltet.","textPt":"A possibilidade de trabalho remoto torna-se mais aberta e flexível.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche weitere Maßnahme ist zur Stressreduzierung bei der CBA-IT-Service GmbH NICHT geeignet?","qPt":"Que outra medida NÃO é adequada para reduzir o stress na CBA-IT-Service GmbH?","a":"Werden Misserfolge der Mitarbeiter für alle und nicht nur für die Vorgesetzten bekanntgegeben, führt dies zu zusätzlichem Druck und Bloßstellung statt zu einer Stressreduzierung.","aPt":"Se os fracassos dos colaboradores forem divulgados para todos e não apenas para os superiores, isso gera pressão e exposição adicionais, em vez de reduzir o stress.","options":[{"text":"Misserfolge der Mitarbeiter werden für alle und nicht nur für die Vorgesetzten bekanntgegeben.","textPt":"Os fracassos dos colaboradores são divulgados para todos e não apenas para os superiores.","correct":true},{"text":"Es wird eine angenehme Arbeitsatmosphäre geschaffen.","textPt":"É criado um ambiente de trabalho agradável.","correct":false},{"text":"Es werden Workshops zur Work-Life-Balance angeboten.","textPt":"São oferecidos workshops sobre equilíbrio entre vida profissional e pessoal.","correct":false},{"text":"Das Betriebssportangebot wird stark erweitert.","textPt":"A oferta de desporto na empresa é fortemente ampliada.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die CBA-IT-Service GmbH formuliert für ein internes Audit Ziele zur Nachhaltigkeit und zum Umweltschutz. Welches der folgenden Ziele stellt ein ökologisches Ziel dar?","qPt":"A CBA-IT-Service GmbH formula, para uma auditoria interna, objetivos de sustentabilidade e proteção ambiental. Qual dos seguintes objetivos representa um objetivo ecológico?","a":"Der Bezug aller Produkte von ökologisch zertifizierten Lieferanten, ohne Abstriche bei Qualität und Funktionalität, ist ein ökologisches (umweltbezogenes) Ziel.","aPt":"A aquisição de todos os produtos junto de fornecedores certificados ecologicamente, sem comprometer a qualidade e a funcionalidade, é um objetivo ecológico (ambiental).","options":[{"text":"Alle Produkte sollen von ökologisch zertifizierten Lieferanten bezogen werden, ohne Abstriche bei der Qualität und Funktionalität hinzunehmen.","textPt":"Todos os produtos devem ser adquiridos junto de fornecedores certificados ecologicamente, sem comprometer a qualidade e a funcionalidade.","correct":true},{"text":"Die Verbesserung der Kundenzufriedenheit und damit der Kundenbindung.","textPt":"A melhoria da satisfação dos clientes e, assim, da sua fidelização.","correct":false},{"text":"Die Umstellung des Fuhrparks für die Geschäftsführung auf größere und leistungsstärkere Fahrzeuge mit Verbrennungsmotor stellt ein ökologisches Ziel dar.","textPt":"A substituição da frota da direção por veículos maiores e mais potentes com motor de combustão representa um objetivo ecológico.","correct":false},{"text":"Die Umsatzsteigerung durch stetige Erweiterung des Sortiments.","textPt":"O aumento do volume de negócios através da expansão contínua do sortido.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der CBA-IT-Service GmbH wird Drucker- und Kopierpapier verwendet, das mit dem 'Blauen Engel' ausgezeichnet ist. Welche Aussage zum Umweltzeichen 'Blauer Engel' ist zutreffend?","qPt":"Na CBA-IT-Service GmbH é usado papel de impressora e fotocópia distinguido com o selo 'Blauer Engel'. Qual afirmação sobre o selo ambiental 'Blauer Engel' está correta?","a":"Das Drucker- und Kopierpapier ist aus schadstoffarmen Rohstoffen und wurde umweltschonend produziert.","aPt":"O papel de impressora e fotocópia é fabricado a partir de matérias-primas com baixo teor de substâncias nocivas e foi produzido de forma a preservar o ambiente.","options":[{"text":"Das Drucker- und Kopierpapier ist aus schadstoffarmen Rohstoffen und umweltschonend produziert worden.","textPt":"O papel de impressora e fotocópia é fabricado a partir de matérias-primas com baixo teor de substâncias nocivas e foi produzido de forma a preservar o ambiente.","correct":true},{"text":"Das Drucker- und Kopierpapier ist besonders haltbar.","textPt":"O papel de impressora e fotocópia é particularmente duradouro.","correct":false},{"text":"Das Drucker- und Kopierpapier ist besonders sicher in der Handhabung.","textPt":"O papel de impressora e fotocópia é particularmente seguro de manusear.","correct":false},{"text":"Das Drucker- und Kopierpapier ist nach seiner Benutzung ausschließlich über das Duale System zu entsorgen.","textPt":"O papel de impressora e fotocópia deve ser eliminado, após o uso, exclusivamente através do Sistema Dual de reciclagem.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Wirtschaftsordnung in der Bundesrepublik Deutschland wird als soziale Marktwirtschaft bezeichnet. Welches Merkmal beschreibt die soziale Marktwirtschaft?","qPt":"A ordem económica da República Federal da Alemanha é designada economia social de mercado. Que característica descreve a economia social de mercado?","a":"Ein zentrales Merkmal der sozialen Marktwirtschaft ist, dass der Staat die wirtschaftlich Schwächeren schützt, z. B. durch soziale Sicherungssysteme, und so den sozialen Ausgleich zur freien Marktwirtschaft hinzufügt.","aPt":"Uma característica central da economia social de mercado é que o Estado protege os mais fracos economicamente, por exemplo através de sistemas de segurança social, acrescentando assim o equilíbrio social à economia de mercado livre.","options":[{"text":"Der Staat schützt die wirtschaftlich Schwächeren.","textPt":"O Estado protege os mais fracos economicamente.","correct":true},{"text":"Das Wirtschaftsgeschehen wird zentral vom Staat gelenkt.","textPt":"A atividade económica é centralmente dirigida pelo Estado.","correct":false},{"text":"Die Produktionsmittel sind ausschließlich staatlich.","textPt":"Os meios de produção são exclusivamente estatais.","correct":false},{"text":"Die staatliche Wettbewerbspolitik hat das Ziel, den Wettbewerb auszuschalten.","textPt":"A política de concorrência estatal tem como objetivo eliminar a concorrência.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Arbeitsleistungen der CBA-IT-Service GmbH werden von verschiedenen Wirtschaftseinheiten erbracht. In welchem der folgenden Fälle handelt es sich um eine betriebliche Arbeitsteilung (Arbeitszerlegung)?","qPt":"As prestações de trabalho da CBA-IT-Service GmbH são realizadas por diferentes unidades económicas. Em qual dos seguintes casos se trata de uma divisão do trabalho dentro da empresa?","a":"Die Gliederung eines Beschaffungsprozesses für Hardware in mehrere Teilprozesse, die von mehreren Arbeitskräften innerhalb desselben Betriebs ausgeführt werden, ist eine betriebliche Arbeitsteilung (Arbeitszerlegung innerhalb des Unternehmens).","aPt":"A divisão de um processo de aquisição de hardware em vários subprocessos, executados por diversos trabalhadores dentro da mesma empresa, constitui uma divisão do trabalho dentro da empresa.","options":[{"text":"Die CBA-IT-Service GmbH gliedert einen Beschaffungsprozess für Hardware in mehrere Teilprozesse, die von mehreren Arbeitskräften ausgeführt werden.","textPt":"A CBA-IT-Service GmbH divide um processo de aquisição de hardware em vários subprocessos, executados por diversos trabalhadores.","correct":true},{"text":"Die CBA-IT-Service GmbH gliedert einen Schritt des Arbeitsprozesses an die Byte GmbH aus.","textPt":"A CBA-IT-Service GmbH externaliza uma etapa do processo de trabalho para a Byte GmbH.","correct":false},{"text":"Die CBA-IT-Service GmbH lässt von einer Mitarbeiterin ein Produkt aus Komponenten zusammenbauen, die von verschiedenen externen Unternehmen hergestellt werden.","textPt":"A CBA-IT-Service GmbH manda uma colaboradora montar um produto com componentes fabricados por diferentes empresas externas.","correct":false},{"text":"Die CBA-IT-Service GmbH schließt eine Filiale in Niedersachsen, deren Kunden zukünftig von der Hamburger Filiale beliefert werden.","textPt":"A CBA-IT-Service GmbH encerra uma filial na Baixa Saxónia, cujos clientes passarão a ser atendidos pela filial de Hamburgo.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ein Mitbewerber der CBA-IT-Service GmbH, die GROTHE AG, bietet Dienstleistungen für IT-Unternehmen an. Welchem Wirtschaftssektor gehört die GROTHE AG an?","qPt":"Um concorrente da CBA-IT-Service GmbH, a GROTHE AG, oferece serviços para empresas de TI. A que setor económico pertence a GROTHE AG?","a":"Als Dienstleistungsanbieter gehört die GROTHE AG dem tertiären Sektor (Dienstleistungssektor) an.","aPt":"Enquanto prestadora de serviços, a GROTHE AG pertence ao setor terciário (setor dos serviços).","options":[{"text":"Unternehmen des tertiären Sektors","textPt":"Empresa do setor terciário","correct":true},{"text":"Unternehmen des primären Sektors","textPt":"Empresa do setor primário","correct":false},{"text":"Gemeinwirtschaftliches Unternehmen","textPt":"Empresa de economia coletiva (sem fins lucrativos)","correct":false},{"text":"Personengesellschaft","textPt":"Sociedade de pessoas","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche weitere Angabe trifft auf die GROTHE AG, einen Mitbewerber der CBA-IT-Service GmbH, zu?","qPt":"Que outra característica se aplica à GROTHE AG, concorrente da CBA-IT-Service GmbH?","a":"Als Aktiengesellschaft, die Gewinne erwirtschaften will, ist die GROTHE AG ein erwerbswirtschaftliches Unternehmen.","aPt":"Enquanto sociedade anónima com fins lucrativos, a GROTHE AG é uma empresa com fins económicos.","options":[{"text":"Erwerbswirtschaftliches Unternehmen","textPt":"Empresa com fins económicos (lucrativos)","correct":true},{"text":"Gemeinwirtschaftliches Unternehmen","textPt":"Empresa de economia coletiva (sem fins lucrativos)","correct":false},{"text":"Personengesellschaft","textPt":"Sociedade de pessoas","correct":false},{"text":"Gesellschaft bürgerlichen Rechts","textPt":"Sociedade de direito civil (GbR)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Volkswirtschaft der Bundesrepublik Deutschland profitiert von der Globalisierung. Welche Maßnahme fördert die Globalisierung?","qPt":"A economia da República Federal da Alemanha beneficia da globalização. Qual medida promove a globalização?","a":"Der Abschluss eines Freihandelsabkommens zwischen der EU und südamerikanischen Staaten baut Handelshemmnisse ab und fördert damit den internationalen Handel und die Globalisierung.","aPt":"A celebração de um acordo de livre comércio entre a UE e estados sul-americanos elimina barreiras comerciais e, assim, promove o comércio internacional e a globalização.","options":[{"text":"Die EU schließt ein Freihandelsabkommen mit den südamerikanischen Staaten ab.","textPt":"A UE celebra um acordo de livre comércio com os estados sul-americanos.","correct":true},{"text":"Die EU plant, für bestimmte Produkte aus China die Zölle zu erhöhen.","textPt":"A UE planeia aumentar os direitos aduaneiros para certos produtos da China.","correct":false},{"text":"Die Bundesregierung beschließt die Erhöhung der Steuern für Transportdienstleistungen.","textPt":"O governo federal decide aumentar os impostos sobre os serviços de transporte.","correct":false},{"text":"Ein deutsches Unternehmen zentralisiert seine weltweite Fertigung in Deutschland.","textPt":"Uma empresa alemã centraliza a sua produção mundial na Alemanha.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Zwei Kunden der CBA-IT-Service GmbH, die Byte GmbH und die IT-Sec GmbH, schließen sich zur neuen Byte-Sec GmbH zusammen; die beiden bisherigen Unternehmen gehen dabei unter. Um welche Unternehmensverbindung handelt es sich?","qPt":"Dois clientes da CBA-IT-Service GmbH, a Byte GmbH e a IT-Sec GmbH, fundem-se na nova Byte-Sec GmbH, deixando de existir como empresas independentes. Que tipo de concentração empresarial é esta?","a":"Da die beiden ursprünglichen Unternehmen rechtlich und wirtschaftlich in einem neuen Unternehmen aufgehen und ihre Selbstständigkeit verlieren, handelt es sich um eine Fusion.","aPt":"Como as duas empresas originais se fundem numa nova empresa, perdendo a sua independência jurídica e económica, trata-se de uma fusão.","options":[{"text":"Fusion","textPt":"Fusão","correct":true},{"text":"Kartell","textPt":"Cartel","correct":false},{"text":"Konzern","textPt":"Grupo empresarial (Konzern)","correct":false},{"text":"Arbeitsgemeinschaft","textPt":"Consórcio (Arbeitsgemeinschaft)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die CBA-IT-Service GmbH führt gemeinsam mit zwei anderen, rechtlich selbstständig bleibenden Unternehmen einen Großauftrag aus. Um welche Unternehmensverbindung handelt es sich?","qPt":"A CBA-IT-Service GmbH executa, em conjunto com duas outras empresas que permanecem juridicamente independentes, um grande projeto. Que tipo de associação empresarial é esta?","a":"Da sich rechtlich selbstständige Unternehmen nur für ein einzelnes, zeitlich begrenztes Projekt (den Großauftrag) zusammenschließen, handelt es sich um eine Arbeitsgemeinschaft (ARGE).","aPt":"Como empresas juridicamente independentes se juntam apenas para um projeto único e de duração limitada, trata-se de um consórcio (ARGE).","options":[{"text":"Arbeitsgemeinschaft","textPt":"Consórcio (Arbeitsgemeinschaft)","correct":true},{"text":"Fusion","textPt":"Fusão","correct":false},{"text":"Kartell","textPt":"Cartel","correct":false},{"text":"Konzern","textPt":"Grupo empresarial (Konzern)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die SecureSoft AG, ein Partnerunternehmen der CBA-IT-Service GmbH, gründet in Düsseldorf und Stuttgart jeweils eine Tochtergesellschaft, die unter der einheitlichen Leitung der SecureSoft AG stehen. Um welche Unternehmensverbindung handelt es sich?","qPt":"A SecureSoft AG, empresa parceira da CBA-IT-Service GmbH, funda em Düsseldorf e em Estugarda, respetivamente, uma subsidiária, ambas sob a direção unificada da SecureSoft AG. Que tipo de associação empresarial é esta?","a":"Rechtlich selbstständige Tochtergesellschaften unter der einheitlichen Leitung eines Mutterunternehmens bilden zusammen einen Konzern.","aPt":"Subsidiárias juridicamente independentes, sob a direção unificada de uma empresa-mãe, formam em conjunto um grupo empresarial (Konzern).","options":[{"text":"Konzern","textPt":"Grupo empresarial (Konzern)","correct":true},{"text":"Fusion","textPt":"Fusão","correct":false},{"text":"Kartell","textPt":"Cartel","correct":false},{"text":"Arbeitsgemeinschaft","textPt":"Consórcio (Arbeitsgemeinschaft)","correct":false}]},
