{"cat":"wiso","sub":"pruefung","q":"Der Auszubildende Alex Konstantinus spricht mit seinem Ausbilder über die gesetzliche Altersvorsorge. Herr Konstantinus überlegt, ob es notwendig ist, in eine private Altersvorsorge zu investieren. Welche der folgenden Aussagen über die Notwendigkeit einer privaten Altersvorsorge trifft zu?","qPt":"O aprendiz Alex Konstantinus conversa com seu formador sobre a previdência estatal. O Sr. Konstantinus pondera se é necessário investir em uma previdência privada. Qual das seguintes afirmações sobre a necessidade de uma previdência privada é correta?","a":"Eine private Altersvorsorge ist notwendig, weil die gesetzliche Rentenversicherung voraussichtlich nicht ausreichen wird. Einer gemeinsamen Finanzschätzung von BMAS und Deutscher Rentenversicherung Bund zufolge wird das Rentenniveau 2030 nur noch 44,3 % betragen.","aPt":"Uma previdência privada é necessária porque a previdência estatal provavelmente não será suficiente. Segundo uma estimativa financeira conjunta do Ministério Federal do Trabalho e Assuntos Sociais (BMAS) e da Previdência Federal Alemã, o nível de aposentadoria em 2030 será de apenas 44,3%.","options":[{"text":"Eine private Altersvorsorge ist notwendig, weil die gesetzliche Rentenversicherung voraussichtlich nicht ausreichen wird.","textPt":"Uma previdência privada é necessária porque a previdência estatal provavelmente não será suficiente.","correct":true},{"text":"Der demografische Wandel sorgt auch in Zukunft für genug Beitragszahler, weshalb das Rentenniveau der gesetzlichen Rentenversicherung stetig steigt.","textPt":"A mudança demográfica garantirá contribuintes suficientes também no futuro, por isso o nível da previdência estatal continuará subindo.","correct":false},{"text":"Eine private Altersvorsorge lohnt sich nicht, weil jedem Arbeitnehmer eine Betriebsrente zusteht.","textPt":"Uma previdência privada não vale a pena, pois todo trabalhador tem direito a uma pensão empresarial.","correct":false},{"text":"Eine private Altersvorsorge ist nur notwendig, wenn die Inflationsrate steigt.","textPt":"Uma previdência privada só é necessária se a taxa de inflação subir.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die vermögenswirksame Leistung (VL) ist eine staatlich geförderte Sparform. Oftmals gewährt der Arbeitgeber – so auch die Koch-IT GmbH – hierfür unabhängig vom Gehalt eine vereinbarte Geldleistung. Der Auszubildende Alex Konstantinus möchte hiervon Gebrauch machen und seine VL in einen Bausparvertrag einzahlen. Wird diese Anlageform im Rahmen der VL staatlich gefördert?","qPt":"A prestação de formação de patrimônio (VL, vermögenswirksame Leistung) é uma forma de poupança subsidiada pelo Estado. Muitas vezes o empregador — como a Koch-IT GmbH — concede, independentemente do salário, um valor acordado para esse fim. O aprendiz Alex Konstantinus quer aproveitar essa possibilidade e depositar sua VL em um contrato de poupança-construção (Bausparvertrag). Essa forma de investimento é subsidiada pelo Estado no âmbito da VL?","a":"Ja. Gesetzliche Regelungen zu den vermögenswirksamen Leistungen wurden im Fünften Vermögensbildungsgesetz (5. VermBG) getroffen; der Bausparvertrag ist eine der dort geförderten Anlageformen.","aPt":"Sim. As regras legais sobre a VL foram estabelecidas na Quinta Lei de Formação de Patrimônio (5. VermBG); o contrato de poupança-construção é uma das formas de investimento ali contempladas.","options":[{"text":"Ja, der Bausparvertrag wird im Rahmen der VL staatlich gefördert.","textPt":"Sim, o contrato de poupança-construção é subsidiado pelo Estado no âmbito da VL.","correct":true},{"text":"Nein, nur Aktien der Kaufmarkt AG werden im Rahmen der VL staatlich gefördert.","textPt":"Não, apenas ações da Kaufmarkt AG são subsidiadas no âmbito da VL.","correct":false},{"text":"Nein, nur eine Unfallversicherung wird im Rahmen der VL staatlich gefördert.","textPt":"Não, apenas um seguro contra acidentes é subsidiado no âmbito da VL.","correct":false},{"text":"Nein, nur eine Sterbegeldversicherung wird im Rahmen der VL staatlich gefördert.","textPt":"Não, apenas um seguro de auxílio-funeral é subsidiado no âmbito da VL.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Alex Konstantinus überlegt stattdessen, seine VL in einen speziellen VL-Sparplan der Bank einzuzahlen. Wird diese Anlageform im Rahmen der VL ebenfalls staatlich gefördert?","qPt":"Alex Konstantinus pondera, em vez disso, depositar sua VL em um plano de poupança VL especial do banco. Essa forma de investimento também é subsidiada pelo Estado no âmbito da VL?","a":"Ja. Neben dem Bausparvertrag ist auch der spezielle VL-Sparplan der Bank eine im Fünften Vermögensbildungsgesetz (5. VermBG) staatlich geförderte Anlageform.","aPt":"Sim. Além do contrato de poupança-construção, o plano de poupança VL especial do banco também é uma forma de investimento subsidiada pelo Estado segundo a Quinta Lei de Formação de Patrimônio (5. VermBG).","options":[{"text":"Ja, der spezielle VL-Sparplan der Bank wird im Rahmen der VL ebenfalls staatlich gefördert.","textPt":"Sim, o plano de poupança VL especial do banco também é subsidiado pelo Estado no âmbito da VL.","correct":true},{"text":"Nein, nur Sparlose bei einer Bank werden im Rahmen der VL staatlich gefördert.","textPt":"Não, apenas sorteios de poupança em um banco são subsidiados no âmbito da VL.","correct":false},{"text":"Nein, nur Aktien der Kaufmarkt AG werden im Rahmen der VL staatlich gefördert.","textPt":"Não, apenas ações da Kaufmarkt AG são subsidiadas no âmbito da VL.","correct":false},{"text":"Nein, nur eine Unfallversicherung wird im Rahmen der VL staatlich gefördert.","textPt":"Não, apenas um seguro contra acidentes é subsidiado no âmbito da VL.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Heppner, Auszubildender im ersten Jahr bei der Koch-IT GmbH, möchte wissen, welche Bestimmungen in einer Ausbildungsordnung geregelt sind. Welche der folgenden Aussagen beschreibt Regelungen einer Ausbildungsordnung?","qPt":"O Sr. Heppner, aprendiz do primeiro ano na Koch-IT GmbH, quer saber quais disposições são regulamentadas em um regulamento de formação (Ausbildungsordnung). Qual das seguintes afirmações descreve regulamentações de um regulamento de formação?","a":"Die Ausbildungsordnung ist die rechtsverbindliche Grundlage für die betriebliche Ausbildungsplanung; sie enthält u. a. Bestimmungen über Kenntnisse, Fertigkeiten und Fähigkeiten, die während der Ausbildung zu vermitteln sind.","aPt":"O regulamento de formação é a base juridicamente vinculante para o planejamento da formação na empresa; ele contém, entre outras coisas, disposições sobre os conhecimentos, habilidades e competências a serem transmitidos durante a formação.","options":[{"text":"Bestimmungen über Kenntnisse, Fertigkeiten und Fähigkeiten, die während der Ausbildung zu vermitteln sind.","textPt":"Disposições sobre os conhecimentos, habilidades e competências a serem transmitidos durante a formação.","correct":true},{"text":"Angaben über die Höhe der Ausbildungsvergütung.","textPt":"Informações sobre o valor da remuneração da formação.","correct":false},{"text":"Planungshilfen in Bezug auf die Urlaubsdauer der Auszubildenden.","textPt":"Auxílios de planejamento quanto à duração das férias dos aprendizes.","correct":false},{"text":"Bestimmungen über die Dauer der überbetrieblichen Ausbildung.","textPt":"Disposições sobre a duração da formação interempresarial.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Koch-IT GmbH hat mit der ledigen, kinderlosen Kauffrau für Digitalisierungsmanagement Petra Remmert einen Einzelarbeitsvertrag geschlossen. In welche der folgenden Lohnsteuerklassen wird Frau Remmert eingruppiert?","qPt":"A Koch-IT GmbH celebrou um contrato de trabalho individual com a gestora de digitalização Petra Remmert, solteira e sem filhos. Em qual das seguintes classes de imposto sobre salário (Lohnsteuerklasse) a Sra. Remmert é enquadrada?","a":"Siehe § 38b Lohnsteuerklassen EStG: Als ledige, kinderlose Arbeitnehmerin wird Frau Remmert in die Lohnsteuerklasse 1 eingruppiert.","aPt":"Ver § 38b da Lei do Imposto de Renda (EStG) — classes de imposto sobre salário: como trabalhadora solteira e sem filhos, a Sra. Remmert é enquadrada na classe de imposto 1.","options":[{"text":"Lohnsteuerklasse 1","textPt":"Classe de imposto 1","correct":true},{"text":"Lohnsteuerklasse 2","textPt":"Classe de imposto 2","correct":false},{"text":"Lohnsteuerklasse 3","textPt":"Classe de imposto 3","correct":false},{"text":"Lohnsteuerklasse 4","textPt":"Classe de imposto 4","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Rögener hat vor einigen Jahren seine Ausbildung zum Informatikkaufmann bei der Koch-IT GmbH abgeschlossen und dort gearbeitet. Jetzt überlegt er, selbst eine IT-Dienstleistungs-GmbH zu gründen. Welche der folgenden Aussagen zu einer GmbH ist richtig?","qPt":"O Sr. Rögener concluiu, alguns anos atrás, sua formação como Informatikkaufmann na Koch-IT GmbH e trabalhou lá. Agora ele pondera fundar sua própria GmbH de prestação de serviços de TI. Qual das seguintes afirmações sobre uma GmbH é correta?","a":"Siehe § 5 GmbHG (Stammkapital): Das Stammkapital einer GmbH muss mindestens 25.000 EUR betragen.","aPt":"Ver § 5 da Lei das Sociedades de Responsabilidade Limitada (GmbHG) — capital social: o capital social de uma GmbH deve ser de, no mínimo, 25.000 euros.","options":[{"text":"Das Stammkapital muss mindestens 25.000 EUR betragen.","textPt":"O capital social deve ser de, no mínimo, 25.000 euros.","correct":true},{"text":"Die Gesellschafter der GmbH haften auch mit ihrem Privatvermögen.","textPt":"Os sócios da GmbH respondem também com seu patrimônio pessoal.","correct":false},{"text":"Die GmbH hat einen Kommanditisten und einen Komplementär.","textPt":"A GmbH tem um sócio comanditário e um sócio comanditado.","correct":false},{"text":"Die GmbH ist eine Personengesellschaft.","textPt":"A GmbH é uma sociedade de pessoas.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Koch-IT GmbH überlegt, ihre Organisationsstruktur zu vereinfachen, und vergleicht dazu verschiedene Organisationsformen. Bei einer der untersuchten Formen steht dem Nachteil einer uneinheitlichen Führung der Vorteil der kurzen Wege gegenüber. Um welche Organisationsform handelt es sich?","qPt":"A Koch-IT GmbH pondera simplificar sua estrutura organizacional e, para isso, compara diferentes formas de organização. Em uma das formas examinadas, à desvantagem de uma direção não unificada contrapõe-se a vantagem de caminhos curtos. De qual forma de organização se trata?","a":"Es handelt sich um eine Mehrlinienorganisation: Jede untergeordnete Stelle kann Weisungen von mehreren übergeordneten Stellen gleichzeitig erhalten, was zu kurzen Wegen, aber auch zu uneinheitlicher Führung führen kann.","aPt":"Trata-se de uma organização de múltiplas linhas (Mehrlinienorganisation): cada posição subordinada pode receber ordens de várias posições superiores ao mesmo tempo, o que gera caminhos curtos, mas também pode causar uma direção não unificada.","options":[{"text":"Mehrlinienorganisation","textPt":"Organização de múltiplas linhas","correct":true},{"text":"Matrixorganisation","textPt":"Organização matricial","correct":false},{"text":"Stablinienorganisation","textPt":"Organização de linha e assessoria (staff-and-line)","correct":false},{"text":"Einlinienorganisation","textPt":"Organização de linha única","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei einer anderen der untersuchten Organisationsformen werden besonders hohe Ansprüche an die Teamfähigkeit der Mitarbeiter gestellt, und es herrscht ein besonders hoher Kommunikationsbedarf. Um welche Organisationsform handelt es sich?","qPt":"Em outra das formas de organização examinadas, são exigidas competências de trabalho em equipe especialmente altas dos funcionários, e há uma necessidade de comunicação particularmente alta. De qual forma de organização se trata?","a":"Es handelt sich um eine Matrixorganisation – eine überlappende Organisationsform, bei der mehrere Dimensionen (z. B. Funktion und Projekt) gemeinsam Weisungsbefugnis über dieselben Stellen haben, was hohe Teamfähigkeit und Kommunikation erfordert.","aPt":"Trata-se de uma organização matricial — uma forma organizacional sobreposta em que várias dimensões (por exemplo, função e projeto) compartilham autoridade sobre os mesmos cargos, exigindo grande capacidade de trabalho em equipe e comunicação.","options":[{"text":"Matrixorganisation","textPt":"Organização matricial","correct":true},{"text":"Mehrlinienorganisation","textPt":"Organização de múltiplas linhas","correct":false},{"text":"Stablinienorganisation","textPt":"Organização de linha e assessoria (staff-and-line)","correct":false},{"text":"Einlinienorganisation","textPt":"Organização de linha única","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei einer weiteren der untersuchten Organisationsformen werden einige Instanzen entlastet, und die Spezialkenntnisse der Stabstellen werden besser genutzt. Um welche Organisationsform handelt es sich?","qPt":"Em mais uma das formas de organização examinadas, algumas instâncias são aliviadas, e os conhecimentos especializados das assessorias (Stabstellen) são mais bem aproveitados. De qual forma de organização se trata?","a":"Es handelt sich um eine Stablinienorganisation: Den Linieninstanzen werden beratende Stabstellen zur Seite gestellt, wodurch die Linieninstanzen entlastet und Spezialkenntnisse gezielt genutzt werden.","aPt":"Trata-se de uma organização de linha e assessoria (Stablinienorganisation): às instâncias de linha são atribuídas assessorias consultivas, o que alivia as instâncias de linha e permite o uso direcionado de conhecimentos especializados.","options":[{"text":"Stablinienorganisation","textPt":"Organização de linha e assessoria (staff-and-line)","correct":true},{"text":"Mehrlinienorganisation","textPt":"Organização de múltiplas linhas","correct":false},{"text":"Matrixorganisation","textPt":"Organização matricial","correct":false},{"text":"Einlinienorganisation","textPt":"Organização de linha única","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Koch-IT GmbH hat als Ausbildungsbetrieb im Rahmen der Berufsausbildung gegenüber der Industrie- und Handelskammer (IHK) Rechte und Pflichten. Welche der folgenden Aussagen dazu ist zutreffend?","qPt":"Como empresa formadora, a Koch-IT GmbH tem direitos e deveres perante a Câmara de Indústria e Comércio (IHK) no âmbito da formação profissional. Qual das seguintes afirmações a esse respeito é correta?","a":"Siehe § 8 BBiG (Verkürzung oder Verlängerung der Ausbildungsdauer): Die Koch-IT GmbH hat die Pflicht, eine Verkürzung der Ausbildung eines Auszubildenden von der IHK genehmigen zu lassen.","aPt":"Ver § 8 da BBiG (redução ou prolongamento da duração da formação): a Koch-IT GmbH tem o dever de fazer aprovar pela IHK uma redução da duração da formação de um aprendiz.","options":[{"text":"Die Koch-IT GmbH hat die Pflicht, eine Verkürzung der Ausbildung eines Auszubildenden von der IHK genehmigen zu lassen.","textPt":"A Koch-IT GmbH tem o dever de fazer aprovar pela IHK uma redução da duração da formação de um aprendiz.","correct":true},{"text":"Die Koch-IT GmbH hat das Recht, Auszubildende ohne Zustimmung der IHK auszubilden.","textPt":"A Koch-IT GmbH tem o direito de formar aprendizes sem o consentimento da IHK.","correct":false},{"text":"Die Koch-IT GmbH hat die Pflicht, jede Fehlzeit der Auszubildenden sofort der IHK zu melden.","textPt":"A Koch-IT GmbH tem o dever de comunicar imediatamente à IHK toda falta dos aprendizes.","correct":false},{"text":"Die Koch-IT GmbH hat das Recht, von der IHK eine Verschiebung des Prüfungstermins zu verlangen, wenn die Auftragslage es erfordert.","textPt":"A Koch-IT GmbH tem o direito de exigir da IHK o adiamento da data da prova, caso a situação de pedidos assim o exija.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Monion ist seit dem 01.01.2021 in der Koch-IT GmbH beschäftigt. Am 16.04. desselben Jahres wurde sie 18 Jahre alt. Im Mai 2021 wird im Betrieb ein neuer Betriebsrat gewählt. Darf Frau Monion bei der Betriebsratswahl ihre Stimme abgeben?","qPt":"A Sra. Monion trabalha na Koch-IT GmbH desde 01.01.2021. Em 16.04. do mesmo ano, ela completou 18 anos. Em maio de 2021, um novo conselho de empresa é eleito na empresa. A Sra. Monion pode votar na eleição do conselho de empresa?","a":"Ja, weil sie volljährig ist. Nach § 7 Betriebsverfassungsgesetz (Wahlberechtigung) sind alle volljährigen Arbeitnehmer des Betriebs wahlberechtigt, unabhängig von der Dauer der Betriebszugehörigkeit.","aPt":"Sim, porque ela é maior de idade. Segundo o § 7 da Lei de Organização da Empresa (direito de voto), todos os trabalhadores maiores de idade da empresa têm direito de voto, independentemente do tempo de vínculo com a empresa.","options":[{"text":"Ja, weil sie volljährig ist.","textPt":"Sim, porque ela é maior de idade.","correct":true},{"text":"Nein, weil sie zu Beginn des Jahres noch minderjährig war.","textPt":"Não, porque ela ainda era menor de idade no início do ano.","correct":false},{"text":"Nein, weil sie noch nicht lange genug bei der Koch-IT GmbH beschäftigt ist.","textPt":"Não, porque ela ainda não trabalha há tempo suficiente na Koch-IT GmbH.","correct":false},{"text":"Ja, aber nur, wenn sie Gewerkschaftsmitglied ist.","textPt":"Sim, mas apenas se for filiada ao sindicato.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Der Betriebsrat der Koch-IT GmbH hat gegenüber dem Arbeitgeber verschiedene Rechte. In welchem der folgenden Fälle hat der Betriebsrat ein Mitbestimmungsrecht?","qPt":"O conselho de empresa da Koch-IT GmbH tem diversos direitos perante o empregador. Em qual dos seguintes casos o conselho de empresa tem um direito de cogestão (Mitbestimmungsrecht)?","a":"Siehe § 87 Mitbestimmungsrechte Betriebsverfassungsgesetz: Wenn der Arbeitgeber während der Weihnachtssaison Mehrarbeit anordnen möchte, hat der Betriebsrat bei der Lage und Verteilung der Arbeitszeit ein Mitbestimmungsrecht.","aPt":"Ver § 87 da Lei de Organização da Empresa — direitos de cogestão: quando o empregador deseja determinar horas extras durante a temporada de Natal, o conselho de empresa tem direito de cogestão quanto à distribuição do horário de trabalho.","options":[{"text":"Der Arbeitgeber möchte während der Weihnachtssaison Mehrarbeit anordnen.","textPt":"O empregador deseja determinar horas extras durante a temporada de Natal.","correct":true},{"text":"Eine neue Mitarbeiterin kündigt innerhalb der Probezeit, um eine besser bezahlte Stelle anzutreten.","textPt":"Uma nova funcionária pede demissão durante o período de experiência para assumir um emprego mais bem pago.","correct":false},{"text":"Der gesetzliche Mindeststundenlohn wird von der Bundesregierung um 1,00 EUR/h erhöht.","textPt":"O salário mínimo legal por hora é aumentado em 1,00 euro/hora pelo governo federal.","correct":false},{"text":"Das Unternehmen besetzt die Stelle des Geschäftsführers neu.","textPt":"A empresa preenche a vaga de diretor executivo.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Koch-IT GmbH stellt einen neuen Mitarbeiter ein. Wer ist für dessen Unterweisung nach der Unfallverhütungsvorschrift 'Grundsätze der Prävention' verantwortlich?","qPt":"A Koch-IT GmbH contrata um novo funcionário. Quem é responsável por sua instrução conforme a norma de prevenção de acidentes 'Princípios da Prevenção'?","a":"Die Grundsätze der Prävention sind ein Regelwerk der deutschen gesetzlichen Unfallversicherung; verantwortlich für die Unterweisung ist der Arbeitgeber bzw. die betrieblichen Vorgesetzten.","aPt":"Os 'Princípios da Prevenção' são um regulamento do seguro legal de acidentes alemão; o responsável pela instrução é o empregador ou os superiores diretos da empresa.","options":[{"text":"Der Arbeitgeber bzw. die betrieblichen Vorgesetzten","textPt":"O empregador ou os superiores diretos da empresa","correct":true},{"text":"Die Fachkraft für Arbeitssicherheit","textPt":"O técnico de segurança do trabalho","correct":false},{"text":"Der Betriebsrat","textPt":"O conselho de empresa","correct":false},{"text":"Der Mitarbeiter in Eigenverantwortung","textPt":"O próprio funcionário, por conta própria","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Koch-IT GmbH ist an verschiedene Arbeitsschutzgesetze gebunden. Welches Arbeitsschutzgesetz regelt einen besonderen Kündigungsschutz von Arbeitnehmern, der 36 Monate oder länger betragen kann?","qPt":"A Koch-IT GmbH está vinculada a diversas leis de proteção ao trabalho. Qual lei de proteção ao trabalho regula uma proteção especial contra demissão de trabalhadores, que pode durar 36 meses ou mais?","a":"Siehe Elternzeitgesetz: Während der Elternzeit besteht ein besonderer Kündigungsschutz, der sich über bis zu 36 Monate oder länger erstrecken kann.","aPt":"Ver a Lei da Licença Parental (Elternzeitgesetz): durante a licença parental existe uma proteção especial contra demissão, que pode se estender por até 36 meses ou mais.","options":[{"text":"Elternzeitgesetz","textPt":"Lei da Licença Parental","correct":true},{"text":"Schwerbehindertengesetz","textPt":"Lei das Pessoas com Deficiência Grave","correct":false},{"text":"Arbeitszeitgesetz","textPt":"Lei do Horário de Trabalho","correct":false},{"text":"Bundesurlaubsgesetz","textPt":"Lei Federal de Férias","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welches Arbeitsschutzgesetz regelt den Mindestanspruch für Arbeitende auf 24 Werktage bezahlten Urlaubs?","qPt":"Qual lei de proteção ao trabalho regula o direito mínimo de 24 dias úteis de férias remuneradas para trabalhadores?","a":"Siehe Bundesurlaubsgesetz: Es regelt den gesetzlichen Mindestanspruch auf bezahlten Urlaub von 24 Werktagen pro Jahr.","aPt":"Ver a Lei Federal de Férias (Bundesurlaubsgesetz): ela regula o direito legal mínimo a 24 dias úteis de férias remuneradas por ano.","options":[{"text":"Bundesurlaubsgesetz","textPt":"Lei Federal de Férias","correct":true},{"text":"Arbeitszeitgesetz","textPt":"Lei do Horário de Trabalho","correct":false},{"text":"Entgeltfortzahlungsgesetz","textPt":"Lei de Continuidade do Pagamento de Salário","correct":false},{"text":"Elternzeitgesetz","textPt":"Lei da Licença Parental","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welches Arbeitsschutzgesetz regelt die Zahlung eines Arbeitsentgelts auch bei Arbeitsausfall an gesetzlichen Feiertagen?","qPt":"Qual lei de proteção ao trabalho regula o pagamento do salário mesmo quando há interrupção do trabalho em feriados legais?","a":"Siehe Entgeltfortzahlungsgesetz: Es regelt u. a. die Fortzahlung des Arbeitsentgelts bei Arbeitsausfall infolge gesetzlicher Feiertage.","aPt":"Ver a Lei de Continuidade do Pagamento de Salário (Entgeltfortzahlungsgesetz): ela regula, entre outras coisas, a continuidade do pagamento do salário em caso de interrupção do trabalho devido a feriados legais.","options":[{"text":"Entgeltfortzahlungsgesetz","textPt":"Lei de Continuidade do Pagamento de Salário","correct":true},{"text":"Bundesurlaubsgesetz","textPt":"Lei Federal de Férias","correct":false},{"text":"Arbeitszeitgesetz","textPt":"Lei do Horário de Trabalho","correct":false},{"text":"Schwerbehindertengesetz","textPt":"Lei das Pessoas com Deficiência Grave","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welches Arbeitsschutzgesetz schreibt eine tägliche Arbeitszeit von acht Stunden fest, die im Ausnahmefall verlängert werden kann?","qPt":"Qual lei de proteção ao trabalho fixa uma jornada diária de trabalho de oito horas, que pode ser prolongada em casos excepcionais?","a":"Siehe Arbeitszeitgesetz: Es schreibt die werktägliche Arbeitszeit von grundsätzlich acht Stunden fest, die im Ausnahmefall verlängert werden kann.","aPt":"Ver a Lei do Horário de Trabalho (Arbeitszeitgesetz): ela fixa a jornada diária de trabalho, em princípio, em oito horas, que pode ser prolongada em casos excepcionais.","options":[{"text":"Arbeitszeitgesetz","textPt":"Lei do Horário de Trabalho","correct":true},{"text":"Bundesurlaubsgesetz","textPt":"Lei Federal de Férias","correct":false},{"text":"Entgeltfortzahlungsgesetz","textPt":"Lei de Continuidade do Pagamento de Salário","correct":false},{"text":"Schwerbehindertengesetz","textPt":"Lei das Pessoas com Deficiência Grave","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welches Arbeitsschutzgesetz regelt den besonderen Kündigungsschutz von Arbeitenden und deren Anspruch auf einen zusätzlichen Urlaub von fünf Tagen?","qPt":"Qual lei de proteção ao trabalho regula a proteção especial contra demissão de trabalhadores e o direito a cinco dias adicionais de férias?","a":"Siehe Schwerbehindertengesetz: Es regelt den besonderen Kündigungsschutz schwerbehinderter Menschen sowie deren Anspruch auf fünf zusätzliche Urlaubstage.","aPt":"Ver a Lei das Pessoas com Deficiência Grave (Schwerbehindertengesetz): ela regula a proteção especial contra demissão de pessoas com deficiência grave e o direito a cinco dias adicionais de férias.","options":[{"text":"Schwerbehindertengesetz","textPt":"Lei das Pessoas com Deficiência Grave","correct":true},{"text":"Elternzeitgesetz","textPt":"Lei da Licença Parental","correct":false},{"text":"Arbeitszeitgesetz","textPt":"Lei do Horário de Trabalho","correct":false},{"text":"Bundesurlaubsgesetz","textPt":"Lei Federal de Férias","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der Koch-IT GmbH hat der Umweltschutz einen hohen Stellenwert. Welche der folgenden Maßnahmen dient NICHT dem Umweltschutz?","qPt":"Na Koch-IT GmbH, a proteção ambiental tem grande importância. Qual das seguintes medidas NÃO serve à proteção ambiental?","a":"Bei Werbemaßnahmen sollen künftig nur noch Hochglanzkataloge verwendet werden, dient nicht dem Umweltschutz: Glänzende Lacke, die mittels Chemikalien erzeugt werden, tragen nicht zum Umweltschutz bei.","aPt":"Nas ações de publicidade, usar apenas catálogos de papel brilhante não serve à proteção ambiental: os vernizes brilhantes, produzidos com produtos químicos, não contribuem para a proteção do meio ambiente.","options":[{"text":"Bei Werbemaßnahmen sollen künftig nur noch Hochglanzkataloge verwendet werden.","textPt":"Nas ações de publicidade, usar apenas catálogos de papel brilhante no futuro.","correct":true},{"text":"Es werden nur noch nachfüllbare Textmarker verwendet.","textPt":"Usar apenas marcadores de texto recarregáveis.","correct":false},{"text":"Bei Kopiervorgängen wird Recyclingpapier verwendet.","textPt":"Usar papel reciclado nas cópias.","correct":false},{"text":"Häufige Bestellungen von Kleinpackungen sollen möglichst nicht mehr durchgeführt werden.","textPt":"Evitar, na medida do possível, pedidos frequentes de embalagens pequenas.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Auf der Umverpackung eines Elektronikgeräts findet die Koch-IT GmbH das Umweltzeichen 'Blauer Engel'. Welche der folgenden Aussagen zu mit diesem Umweltzeichen ausgezeichneter Ware ist zutreffend?","qPt":"Na embalagem externa de um aparelho eletrônico, a Koch-IT GmbH encontra o selo ambiental 'Blauer Engel' (Anjo Azul). Qual das seguintes afirmações sobre mercadorias com esse selo ambiental é correta?","a":"Diese Ware ist umweltschonend produziert worden. Der Blaue Engel ist seit über 40 Jahren das Umweltzeichen der Bundesregierung.","aPt":"Essa mercadoria foi produzida de forma a poupar o meio ambiente. O 'Blauer Engel' é, há mais de 40 anos, o selo ambiental do governo federal alemão.","options":[{"text":"Diese Ware ist umweltschonend produziert worden.","textPt":"Essa mercadoria foi produzida de forma a poupar o meio ambiente.","correct":true},{"text":"Diese Ware ist besonders haltbar.","textPt":"Essa mercadoria é particularmente durável.","correct":false},{"text":"Diese Ware hat bereits mehrere Umweltpreise gewonnen.","textPt":"Essa mercadoria já ganhou diversos prêmios ambientais.","correct":false},{"text":"Diese Ware ist nach ihrer Benutzung ausschließlich über das Duale System zu entsorgen.","textPt":"Essa mercadoria deve ser descartada, após o uso, exclusivamente pelo sistema dual de reciclagem.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In der Koch-IT GmbH ereignet sich ein Arbeitsunfall, eine Mitarbeiterin verbrennt sich dabei. Welche der folgenden Verhaltensweisen eines Ersthelfers ist in diesem Fall richtig?","qPt":"Na Koch-IT GmbH ocorre um acidente de trabalho em que uma funcionária se queima. Qual das seguintes condutas de um socorrista é correta nesse caso?","a":"Brandwunden mit speziellen, keimfreien Verbandpäckchen für Brandwunden bedecken. Alle übrigen Antwortmöglichkeiten tragen nicht dazu bei, dass die Verbrennungen bzw. die Schmerzen der Mitarbeiterin gemildert werden.","aPt":"Cobrir as queimaduras com curativos especiais e estéreis próprios para queimaduras. Todas as demais opções não contribuem para aliviar as queimaduras ou a dor da funcionária.","options":[{"text":"Brandwunden mit speziellen, keimfreien Verbandpäckchen für Brandwunden bedecken.","textPt":"Cobrir as queimaduras com curativos especiais e estéreis próprios para queimaduras.","correct":true},{"text":"Als Erstmaßnahme die betroffene Stelle erwärmen.","textPt":"Como primeira medida, aquecer o local afetado.","correct":false},{"text":"Brandwunden mit Öl, Salben, Talk oder Ähnlichem bedecken.","textPt":"Cobrir as queimaduras com óleo, pomadas, talco ou produtos semelhantes.","correct":false},{"text":"Brandwunden auswaschen und Brandblasen öffnen.","textPt":"Lavar as queimaduras e abrir as bolhas de queimadura.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ulli Mayer, 26 Jahre, will sich nach Abschluss seiner Ausbildung als Fachinformatiker für Daten- und Prozessanalyse auf eine Stellenanzeige der Koch-IT GmbH bewerben. In der Anzeige steht als Position 1 der Titel 'Fachinformatiker für Daten- und Prozessanalyse' (ohne Geschlechterzusatz). Verstößt diese Formulierung gegen das Allgemeine Gleichbehandlungsgesetz (AGG)?","qPt":"Ulli Mayer, 26 anos, quer se candidatar, após concluir sua formação como especialista em TI para análise de dados e processos, a um anúncio de vaga da Koch-IT GmbH. No anúncio, a posição 1 traz o título 'Fachinformatiker für Daten- und Prozessanalyse' (sem indicação de gênero). Essa formulação viola a Lei Geral de Igualdade de Tratamento (AGG)?","a":"Ja. Stellenanzeigen dürfen nicht geschlechtsspezifisch sein; die Formulierung ohne Geschlechterzusatz (z. B. 'm/w/d') verstößt daher gegen das AGG.","aPt":"Sim. Anúncios de vaga não podem ser específicos de gênero; a formulação sem indicação de gênero (por exemplo, 'm/w/d') viola, portanto, a AGG.","options":[{"text":"Ja, denn Stellenanzeigen dürfen nicht geschlechtsspezifisch sein.","textPt":"Sim, pois anúncios de vaga não podem ser específicos de gênero.","correct":true},{"text":"Nein, denn 'Wir bieten Ihnen Weiterbildungsmöglichkeiten in unserem Unternehmen' ist neutral formuliert.","textPt":"Não, pois 'Oferecemos oportunidades de capacitação em nossa empresa' está formulado de maneira neutra.","correct":false},{"text":"Nein, denn 'Wir bieten Ihnen einen gesicherten Arbeitsplatz mit einem attraktiven Gehalt' ist neutral formuliert.","textPt":"Não, pois 'Oferecemos um emprego seguro com salário atrativo' está formulado de maneira neutra.","correct":false},{"text":"Nein, denn 'Wir bieten Ihnen diverse Aufstiegsmöglichkeiten in einem hochmotivierten Team' ist neutral formuliert.","textPt":"Não, pois 'Oferecemos diversas oportunidades de ascensão em uma equipe altamente motivada' está formulado de maneira neutra.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Dieselbe Stellenanzeige der Koch-IT GmbH enthält als Position 2 die Formulierung 'Sie sind jung, belastbar und haben ein angenehmes äußeres Erscheinungsbild'. Verstößt diese Formulierung gegen das AGG?","qPt":"O mesmo anúncio de vaga da Koch-IT GmbH traz, na posição 2, a frase 'Você é jovem, resiliente e tem uma aparência agradável'. Essa formulação viola a AGG?","a":"Ja. Die Formulierung 'Sie sind jung ...' ist altersdiskriminierend und verstößt daher gegen das AGG.","aPt":"Sim. A frase 'Você é jovem...' é discriminatória em razão da idade e, portanto, viola a AGG.","options":[{"text":"Ja, denn die Formulierung ist altersdiskriminierend.","textPt":"Sim, pois a formulação é discriminatória em razão da idade.","correct":true},{"text":"Nein, denn 'Wir bieten Ihnen Weiterbildungsmöglichkeiten in unserem Unternehmen' ist neutral formuliert.","textPt":"Não, pois 'Oferecemos oportunidades de capacitação em nossa empresa' está formulado de maneira neutra.","correct":false},{"text":"Nein, denn 'Wir bieten Ihnen viele Gestaltungsmöglichkeiten in unserem Unternehmen' ist neutral formuliert.","textPt":"Não, pois 'Oferecemos muitas possibilidades de atuação em nossa empresa' está formulado de maneira neutra.","correct":false},{"text":"Nein, denn 'Wir bieten Ihnen diverse Aufstiegsmöglichkeiten in einem hochmotivierten Team' ist neutral formuliert.","textPt":"Não, pois 'Oferecemos diversas oportunidades de ascensão em uma equipe altamente motivada' está formulado de maneira neutra.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Als Mitarbeiter/-in in Festanstellung bei der Koch-IT GmbH haben Sie ein Programm entwickelt, das mit großem Erfolg verkauft wird. Welche der folgenden Aussagen ist richtig?","qPt":"Como funcionário(a) em contrato permanente na Koch-IT GmbH, você desenvolveu um programa que é vendido com grande sucesso. Qual das seguintes afirmações é correta?","a":"Sofern vertraglich nicht anders geregelt, besitzen Sie das Urheberrecht an dem Programm und die Koch-IT GmbH die Verwertungsrechte. Das Urheberrecht ist immer an den Schöpfer gebunden; hierbei darf es sich nur um natürliche Personen handeln.","aPt":"Salvo disposição contratual em contrário, você detém os direitos autorais sobre o programa e a Koch-IT GmbH detém os direitos de exploração econômica. O direito autoral está sempre vinculado ao criador, que só pode ser uma pessoa física.","options":[{"text":"Sofern vertraglich nicht anders geregelt, besitzen Sie das Urheberrecht an dem Programm und die Koch-IT GmbH die Verwertungsrechte.","textPt":"Salvo disposição contratual em contrário, você detém os direitos autorais sobre o programa e a Koch-IT GmbH detém os direitos de exploração econômica.","correct":true},{"text":"Als Urheber/-in haben Sie das Recht, die weitere Nutzung Ihres Programmes zu verbieten.","textPt":"Como autor(a), você tem o direito de proibir o uso futuro do seu programa.","correct":false},{"text":"Sie haben einen Anspruch auf Beteiligung am Erlös aus allen Verkäufen des Programmes.","textPt":"Você tem direito a uma participação nos lucros de todas as vendas do programa.","correct":false},{"text":"Sie sind als Autor/-in persönlich haftend für entstehende Schäden bei den Anwendern bei eventuellen Fehlern des Programmes.","textPt":"Como autor(a), você é pessoalmente responsável por danos causados aos usuários em caso de eventuais erros do programa.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Mevis, Auszubildende bei der Koch-IT GmbH, möchte acht Wochen ihrer Berufsausbildung im Ausland durchführen. In diesem Zusammenhang wurde sie auf den Europass hingewiesen. Zu welchem der folgenden Zwecke wurde der Europass geschaffen?","qPt":"A Sra. Mevis, aprendiz na Koch-IT GmbH, quer realizar oito semanas de sua formação profissional no exterior. Nesse contexto, foi informada sobre o Europass. Para qual das seguintes finalidades o Europass foi criado?","a":"Der Europass ist ein vereinheitlichtes Dokument, das Qualifikationen und Kompetenzen europaweit verständlich und transparent darstellt. Europass ist eine Website der EU, durch deren einheitliche Dokumente das länderübergreifende Verständnis von Qualifikationen erhöht werden soll.","aPt":"O Europass é um documento uniformizado que apresenta qualificações e competências de forma compreensível e transparente em toda a Europa. O Europass é um site da UE cujos documentos uniformes visam aumentar a compreensão transnacional das qualificações.","options":[{"text":"Der Europass ist ein vereinheitlichtes Dokument, das Qualifikationen und Kompetenzen europaweit verständlich und transparent darstellt.","textPt":"O Europass é um documento uniformizado que apresenta qualificações e competências de forma compreensível e transparente em toda a Europa.","correct":true},{"text":"Der Europass ersetzt die Reisepässe der EU-Mitgliedstaaten bei Auszubildenden.","textPt":"O Europass substitui os passaportes dos Estados-membros da UE para aprendizes.","correct":false},{"text":"Mit dem Europass kann man innerhalb der EU kostenlos Bahn fahren und verreisen, ohne Wartezeiten an den Grenzen zu haben.","textPt":"Com o Europass é possível viajar de trem gratuitamente dentro da UE, sem esperas nas fronteiras.","correct":false},{"text":"Mit dem Europass kann man innerhalb der EU formlos Unternehmen gründen und Mitarbeiter aus der gesamten EU einstellen.","textPt":"Com o Europass é possível fundar empresas informalmente dentro da UE e contratar funcionários de toda a UE.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der Koch-IT GmbH gab es in den letzten Monaten ein erhöhtes Aufkommen an sogenannten Phishing-Mails. Anhand welchem der folgenden Merkmale erkennen Sie Phishing-Mails?","qPt":"Nos últimos meses, a Koch-IT GmbH registrou um aumento no número de chamados e-mails de phishing. Por qual das seguintes características você reconhece e-mails de phishing?","a":"Phishing-Mails zielen darauf ab, Zugangsdaten zu erbeuten. Deshalb erhalten Sie meist einen Link, über den Sie diese eingeben sollen.","aPt":"E-mails de phishing visam roubar dados de acesso. Por isso, geralmente você recebe um link pelo qual deve inseri-los.","options":[{"text":"Phishing-Mails zielen darauf ab, Zugangsdaten zu erbeuten. Deshalb erhalten Sie meist einen Link, über den Sie diese eingeben sollen.","textPt":"E-mails de phishing visam roubar dados de acesso. Por isso, geralmente você recebe um link pelo qual deve inseri-los.","correct":true},{"text":"Phishing-Mails werden immer mit Signatur und persönlicher Anrede verschickt.","textPt":"E-mails de phishing são sempre enviados com assinatura e saudação pessoal.","correct":false},{"text":"Der wirkliche Absender der Mail stimmt allgemein mit dem Anzeigenamen des Absenders überein.","textPt":"O remetente real do e-mail geralmente coincide com o nome de exibição do remetente.","correct":false},{"text":"Phishing-Mails haben nie Anhänge.","textPt":"E-mails de phishing nunca têm anexos.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Sie erhalten bei der Koch-IT GmbH eine E-Mail mit folgendem Inhalt: 'Hallo, wir mussten mit großem Bedauern feststellen, dass wir einige Probleme mit unserem System hatten. Aus gegebenem Grund müssen wir Sie bitten, Ihre Mitgliedschaft im Account mit Ihrem Login sowie Ihren Kreditkarten-Daten zu bestätigen. Bitte folgen Sie dem nachfolgenden Link ...' Welche der folgenden Verhaltensweisen zum Umgang mit dieser Nachricht ist zutreffend?","qPt":"Você recebe na Koch-IT GmbH um e-mail com o seguinte conteúdo: 'Olá, lamentamos informar que tivemos alguns problemas com nosso sistema. Por esse motivo, precisamos que você confirme sua conta com seu login e os dados do seu cartão de crédito. Por favor, siga o link a seguir...' Qual das seguintes condutas em relação a essa mensagem é a correta?","a":"Die E-Mail löschen und die IT-Abteilung oder zuständige Stelle benachrichtigen, falls weitere Schritte notwendig sind. Die IT-Abteilung kann anhand von automatischen Regeln diese E-Mail in Zukunft unterbinden.","aPt":"Apagar o e-mail e avisar o departamento de TI ou o setor responsável, caso sejam necessárias outras medidas. O departamento de TI pode, com regras automáticas, bloquear esse tipo de e-mail no futuro.","options":[{"text":"Die E-Mail löschen und die IT-Abteilung oder zuständige Stelle benachrichtigen, falls weitere Schritte notwendig sind.","textPt":"Apagar o e-mail e avisar o departamento de TI ou o setor responsável, caso sejam necessárias outras medidas.","correct":true},{"text":"Den angegebenen Link öffnen und die geforderten Daten zu dem Account und den Zahlungsdaten eingeben.","textPt":"Abrir o link indicado e inserir os dados solicitados da conta e de pagamento.","correct":false},{"text":"Die E-Mail an alle Kontakte weiterleiten, um auf die Probleme mit dem genannten Account aufmerksam zu machen.","textPt":"Encaminhar o e-mail a todos os contatos para alertá-los sobre os problemas com a conta mencionada.","correct":false},{"text":"Die E-Mail ausdrucken und archivieren, falls deren Inhalt später noch gebraucht wird.","textPt":"Imprimir e arquivar o e-mail, caso seu conteúdo seja necessário mais tarde.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Sie besuchen bei der Koch-IT GmbH häufig die Webseiten eines Geschäftspartners. Welche der folgenden Einschätzungen zur Sicherheit in dieser Situation ist zutreffend?","qPt":"Na Koch-IT GmbH, você acessa frequentemente o site de um parceiro de negócios. Qual das seguintes avaliações sobre a segurança nessa situação é correta?","a":"Auch bei bekannten und vertrauenswürdigen Webseiten müssen die Standardsicherheitsmaßnahmen beachtet werden. Inhalte jeglicher Webseiten könnten manipuliert sein, Standardsicherheitsmaßnahmen gelten daher immer.","aPt":"Mesmo em sites conhecidos e confiáveis, é preciso observar as medidas de segurança padrão. O conteúdo de qualquer site pode ter sido manipulado, por isso as medidas de segurança padrão sempre se aplicam.","options":[{"text":"Auch bei bekannten und vertrauenswürdigen Webseiten müssen die Standardsicherheitsmaßnahmen beachtet werden.","textPt":"Mesmo em sites conhecidos e confiáveis, é preciso observar as medidas de segurança padrão.","correct":true},{"text":"Sie besuchen diese Seite sehr häufig und deshalb müssen Sie sich hier keine Sorgen machen.","textPt":"Você acessa essa página com muita frequência, por isso não precisa se preocupar.","correct":false},{"text":"Da Ihnen die Seite bekannt ist und seriösen Inhalt hat, kann Ihnen hier beim Surfen nichts passieren.","textPt":"Como o site é conhecido por você e tem conteúdo sério, nada pode acontecer enquanto você navega nele.","correct":false},{"text":"Nur bei Webseiten mit Animationen oder anderen aktiven Inhalten besteht eine Gefahr.","textPt":"Só há perigo em sites com animações ou outros conteúdos ativos.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Im Rahmen einer Geschäftsreise überlegen Sie als Mitarbeiter/-in der Koch-IT GmbH, ein öffentliches unverschlüsseltes WLAN geschäftlich zu nutzen. Welche der folgenden Aussagen zur Nutzung öffentlicher WLAN-Zugänge ist richtig?","qPt":"Durante uma viagem a negócios, você, como funcionário(a) da Koch-IT GmbH, pondera usar uma rede Wi-Fi pública não criptografada para fins profissionais. Qual das seguintes afirmações sobre o uso de redes Wi-Fi públicas é correta?","a":"Mithilfe einer VPN-Lösung können alle Dinge in einem offenen WLAN wie im abgesicherten Unternehmensnetz genutzt werden. Durch ein virtuelles privates Netzwerk (VPN) wird eine geschützte und verschlüsselte Verbindung innerhalb des öffentlichen Netzwerkes hergestellt.","aPt":"Com uma solução de VPN, é possível usar uma rede Wi-Fi aberta como se fosse a rede protegida da empresa. Por meio de uma rede privada virtual (VPN) é estabelecida uma conexão protegida e criptografada dentro da rede pública.","options":[{"text":"Mithilfe einer VPN-Lösung können alle Dinge in einem offenen WLAN wie im abgesicherten Unternehmensnetz genutzt werden.","textPt":"Com uma solução de VPN, é possível usar uma rede Wi-Fi aberta como se fosse a rede protegida da empresa.","correct":true},{"text":"Das E-Mail-Programm kann in jedem Fall benutzt werden, da alle E-Mail-Programme automatisch verschlüsseln.","textPt":"O programa de e-mail pode ser usado em qualquer caso, pois todos os programas de e-mail criptografam automaticamente.","correct":false},{"text":"Im öffentlichen WLAN kann kein Computernutzer die Daten mitlesen.","textPt":"Em uma rede Wi-Fi pública, nenhum usuário de computador pode ler os dados.","correct":false},{"text":"Wird ein WLAN-Zugang z. B. in einem Café zur Verfügung gestellt, kann man davon ausgehen, dass die Betreiber sich ausreichend um die Sicherheit des Netzes kümmern.","textPt":"Se um acesso Wi-Fi é disponibilizado, por exemplo, em um café, pode-se presumir que os operadores cuidam adequadamente da segurança da rede.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der Koch-IT GmbH wird bei einer Datenübertragung die aus den Ausgangsdaten errechnete Kontrollsumme immer mit übertragen. Der Empfänger berechnet nach dem vollständigen Empfang aus den Daten eine weitere Kontrollsumme und vergleicht die beiden Kontrollsummen. Welchen der folgenden Zwecke erfüllt dieses Verfahren?","qPt":"Na Koch-IT GmbH, em uma transmissão de dados, a soma de verificação calculada a partir dos dados de origem é sempre transmitida junto. O destinatário, após o recebimento completo, calcula outra soma de verificação a partir dos dados e compara as duas somas. A qual das seguintes finalidades esse procedimento serve?","a":"Dieses Verfahren dient der Gewährleistung der Daten-Integrität: Es wird sichergestellt, dass die Datenübertragung nicht beeinflusst wurde und die Daten unverändert sind.","aPt":"Esse procedimento serve para garantir a integridade dos dados: assegura que a transmissão de dados não foi alterada e que os dados permanecem inalterados.","options":[{"text":"Gewährleistung der Daten-Integrität","textPt":"Garantia da integridade dos dados","correct":true},{"text":"Gewährleistung der Daten-Verfügbarkeit","textPt":"Garantia da disponibilidade dos dados","correct":false},{"text":"Gewährleistung der Daten-Vertraulichkeit","textPt":"Garantia da confidencialidade dos dados","correct":false},{"text":"Gewährleistung der Daten-Lesbarkeit","textPt":"Garantia da legibilidade dos dados","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Medien berichten regelmäßig über Vorfälle, bei denen Unternehmen gegen allgemeine und selbst gesetzte Regelungen verstoßen. Bei der Koch-IT GmbH liegt ein Verstoß vor, da ein Geschäftspartner durch persönliche Zuwendungen beeinflusst werden sollte. Welchem der folgenden Felder wird ein derartiger Verstoß zugerechnet?","qPt":"A mídia relata regularmente casos em que empresas violam regulamentações gerais e autoimpostas. Na Koch-IT GmbH ocorreu uma violação, pois um parceiro de negócios deveria ser influenciado por meio de presentes pessoais. A qual dos seguintes campos essa violação é atribuída?","a":"Durch die Compliance werden rechtliche, unternehmensinterne und vertragliche Regelungen vorgeschrieben und deren Einhaltung eingefordert. Der Verstoß der Bestechlichkeit ist der Compliance zuzuschreiben.","aPt":"A compliance estabelece regulamentações legais, internas da empresa e contratuais, e exige seu cumprimento. A violação por suborno/corrupção é atribuída à compliance.","options":[{"text":"Compliance","textPt":"Compliance","correct":true},{"text":"Datenschutz","textPt":"Proteção de dados","correct":false},{"text":"Incidence","textPt":"Incidence","correct":false},{"text":"Disruption","textPt":"Disruption","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Korok-IT GmbH will eine Stelle neu besetzen. Mit einer Bewerberin wird ein Einstellungsgespräch geführt. Welche der folgenden Fragen ist dabei zulässig?","qPt":"A Korok-IT GmbH quer preencher uma vaga. Será realizada uma entrevista de emprego com uma candidata. Qual das seguintes perguntas é admissível nessa entrevista?","a":"Zulässig ist nur die Frage nach dem gewünschten Gehalt. Fragen nach Familienplanung, Parteizugehörigkeit, Vermögen oder früheren Krankheiten greifen unzulässig in die Privatsphäre bzw. das allgemeine Persönlichkeitsrecht der Bewerberin ein und dürfen in einem Vorstellungsgespräch grundsätzlich nicht gestellt werden.","aPt":"Só é admissível a pergunta sobre o salário pretendido. Perguntas sobre planos de ter filhos, filiação partidária, patrimônio ou doenças anteriores violam indevidamente a privacidade e o direito de personalidade da candidata e, em regra, não podem ser feitas numa entrevista de emprego (a candidata pode até mentir ao responder a uma pergunta ilícita).","options":[{"text":"Was möchten Sie bei uns verdienen?","textPt":"Quanto você gostaria de ganhar aqui?","correct":true},{"text":"Möchten Sie in den nächsten zwei Jahren heiraten?","textPt":"Você pretende se casar nos próximos dois anos?","correct":false},{"text":"Gehören Sie einer politischen Partei an?","textPt":"Você é filiada a algum partido político?","correct":false},{"text":"Welche Krankheiten haben Sie bisher gehabt?","textPt":"Quais doenças você já teve?","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Claudio Davidson, 17 Jahre alt, beginnt eine Ausbildung als Fachinformatiker bei der Korok-IT GmbH. Welche der folgenden Unterlagen muss er vor Beginn seiner Berufsausbildung zwingend vorlegen?","qPt":"Claudio Davidson, 17 anos, inicia uma formação como Fachinformatiker na Korok-IT GmbH. Qual dos seguintes documentos ele deve obrigatoriamente apresentar antes de começar a formação profissional?","a":"Da Herr Davidson minderjährig ist, muss er vor Beginn der Beschäftigung den Nachweis über die ärztliche Erstuntersuchung nach dem Jugendarbeitsschutzgesetz (§ 32 JArbSchG) vorlegen. Ohne diese Untersuchung darf ein Jugendlicher nicht beschäftigt werden.","aPt":"Como o Sr. Davidson é menor de idade, ele deve apresentar, antes do início do trabalho, o comprovante do exame médico inicial exigido pela Lei de Proteção ao Trabalho de Jovens (JArbSchG, § 32). Sem esse exame, um menor não pode ser empregado.","options":[{"text":"Das letzte Schulzeugnis","textPt":"O último boletim escolar","correct":false},{"text":"Die Geburtsurkunde","textPt":"A certidão de nascimento","correct":false},{"text":"Die notariell beglaubigte Kopie des Personalausweises","textPt":"A cópia autenticada em cartório do documento de identidade","correct":false},{"text":"Den Nachweis über die ärztliche Erstuntersuchung nach dem Jugendarbeitsschutzgesetz","textPt":"O comprovante do exame médico inicial exigido pela Lei de Proteção ao Trabalho de Jovens","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"In den Ausbildungsverträgen der Korok-IT GmbH ist in der Regel eine Probezeit von drei Monaten eingetragen. In welcher Rechtsgrundlage ist die Dauer der Probezeit bei einer Berufsausbildung geregelt?","qPt":"Nos contratos de formação da Korok-IT GmbH consta, em regra, um período de experiência de três meses. Em qual base legal está regulada a duração do período de experiência numa formação profissional?","a":"Die Dauer der Probezeit bei Berufsausbildungsverhältnissen ist im Berufsbildungsgesetz (BBiG) geregelt. Sie muss mindestens einen und darf höchstens vier Monate betragen.","aPt":"A duração do período de experiência em relações de formação profissional está regulada na Lei de Formação Profissional (Berufsbildungsgesetz, BBiG). Deve ser de no mínimo um e no máximo quatro meses.","options":[{"text":"Jugendschutzgesetz","textPt":"Lei de Proteção à Juventude","correct":false},{"text":"Jugendarbeitsschutzgesetz","textPt":"Lei de Proteção ao Trabalho de Jovens","correct":false},{"text":"Berufsbildungsgesetz","textPt":"Lei de Formação Profissional","correct":true},{"text":"Arbeitszeitgesetz","textPt":"Lei da Jornada de Trabalho","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei welcher der folgenden Maßnahmen handelt es sich um eine Umschulung?","qPt":"Qual das seguintes medidas constitui uma requalificação profissional (Umschulung)?","a":"Eine Umschulung liegt vor, wenn jemand nach bereits abgeschlossener Berufsausbildung eine neue berufliche Qualifikation in einem anderen Beruf erwirbt, um den Beruf zu wechseln – hier wechselt die bereits ausgebildete Friseurin aus gesundheitlichen Gründen in einen kaufmännischen IT-Beruf. Ein Ausbildungsabbruch mit neuem Ausbildungsbeginn ist dagegen eine neue Erstausbildung, und Lehrgänge oder Schulungen neben einer laufenden Tätigkeit sind Fortbildungen.","aPt":"Há requalificação profissional quando alguém, já tendo concluído uma formação profissional, adquire uma nova qualificação em outra profissão para mudar de carreira — aqui, a cabeleireira já formada muda, por motivos de saúde, para uma profissão administrativa de TI. Já abandonar uma formação e iniciar outra é uma nova formação inicial, e cursos ou treinamentos paralelos à atividade atual são apenas aperfeiçoamento profissional (Fortbildung).","options":[{"text":"Ein angehender Fachinformatiker Systemintegration bricht seine Ausbildung ab und beginnt eine Berufsausbildung zum Tischler.","textPt":"Um futuro Fachinformatiker de integração de sistemas abandona sua formação e inicia uma formação como marceneiro.","correct":false},{"text":"Eine Fachinformatikerin Systemintegration besucht ein Schulungsangebot zum Thema IT-Sicherheit.","textPt":"Uma Fachinformatikerin de integração de sistemas participa de um treinamento sobre segurança de TI.","correct":false},{"text":"Eine Friseurin macht aufgrund einer Allergie eine zweite Berufsausbildung zur Kauffrau für IT-System-Management.","textPt":"Uma cabeleireira, por causa de uma alergia, faz uma segunda formação profissional como auxiliar administrativa de gestão de sistemas de TI.","correct":true},{"text":"Eine IT-System-Kauffrau besucht einen Lehrgang zum Erwerb der Ausbildereignung.","textPt":"Uma auxiliar administrativa de sistemas de TI frequenta um curso para obter a habilitação de instrutora.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Davidson stolpert während der Arbeitszeit und verletzt sich am Knie. Er legt der Korok-IT GmbH eine Arbeitsunfähigkeitsbescheinigung über fünf Arbeitstage vor. Welchen der folgenden Schritte muss die Korok-IT GmbH daraufhin unternehmen?","qPt":"O Sr. Davidson tropeça durante o horário de trabalho e machuca o joelho. Ele apresenta à Korok-IT GmbH um atestado de incapacidade para o trabalho de cinco dias úteis. Qual das seguintes medidas a Korok-IT GmbH deve tomar em seguida?","a":"Ein Arbeitsunfall während der Arbeitszeit muss vom Arbeitgeber der zuständigen Berufsgenossenschaft gemeldet werden, da diese Träger der gesetzlichen Unfallversicherung ist.","aPt":"Um acidente de trabalho ocorrido durante o horário de trabalho deve ser comunicado pelo empregador à Berufsgenossenschaft (associação profissional/seguradora de acidentes) competente, pois ela é a entidade responsável pelo seguro legal contra acidentes.","options":[{"text":"Den Unfall dem Technischen Überwachungsverein (TÜV) melden.","textPt":"Comunicar o acidente ao órgão técnico de fiscalização (TÜV).","correct":false},{"text":"Den Unfall der Berufsgenossenschaft melden.","textPt":"Comunicar o acidente à associação profissional (Berufsgenossenschaft), seguradora de acidentes de trabalho.","correct":true},{"text":"Herrn Davidson Schadenersatz zahlen.","textPt":"Pagar indenização por danos ao Sr. Davidson.","correct":false},{"text":"Den Unfall dem Ordnungsamt melden.","textPt":"Comunicar o acidente ao órgão de ordem pública (Ordnungsamt).","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ein Kollege von Herrn Davidson möchte wissen, wie hoch sein Beitrag zur gesetzlichen Rentenversicherung nach einer Gehaltserhöhung sein wird. Sein sozialversicherungspflichtiges Bruttoarbeitsentgelt beträgt künftig 3.500,00 EUR monatlich, der Beitragssatz in der gesetzlichen Rentenversicherung beträgt 18,6 %. Wie hoch ist der Arbeitnehmeranteil, der ihm vom Gehalt abgezogen wird?","qPt":"Um colega do Sr. Davidson quer saber qual será sua contribuição ao seguro de aposentadoria legal após um aumento salarial. Seu salário bruto sujeito a contribuições sociais será de 3.500,00 EUR mensais, e a alíquota do seguro de aposentadoria legal é de 18,6 %. Qual é a parte do empregado, descontada do seu salário?","a":"Der Beitrag zur Rentenversicherung wird je zur Hälfte von Arbeitgeber und Arbeitnehmer getragen, der Arbeitnehmeranteil beträgt also 9,3 %: 3.500,00 EUR × 9,3 % = 325,50 EUR.","aPt":"A contribuição ao seguro de aposentadoria é dividida igualmente entre empregador e empregado, ou seja, a parte do empregado é de 9,3 %: 3.500,00 EUR × 9,3 % = 325,50 EUR.","options":[{"text":"350,00 EUR","textPt":"350,00 EUR","correct":false},{"text":"325,50 EUR","textPt":"325,50 EUR","correct":true},{"text":"651,00 EUR","textPt":"651,00 EUR","correct":false},{"text":"291,55 EUR","textPt":"291,55 EUR","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Aus dem Arbeitsverhältnis werden Beiträge zur gesetzlichen Arbeitslosenversicherung fällig. Wer bringt diese Beiträge auf?","qPt":"Da relação de trabalho decorrem contribuições ao seguro-desemprego legal. Quem arca com essas contribuições?","a":"Die Beiträge zur gesetzlichen Arbeitslosenversicherung werden, wie die meisten Sozialversicherungsbeiträge, je zur Hälfte von Arbeitgeber und Arbeitnehmer getragen.","aPt":"As contribuições ao seguro-desemprego legal, como a maioria das contribuições sociais, são pagas em partes iguais pelo empregador e pelo empregado.","options":[{"text":"Nur der Arbeitnehmer","textPt":"Somente o empregado","correct":false},{"text":"Nur der Arbeitgeber","textPt":"Somente o empregador","correct":false},{"text":"Arbeitgeber und Arbeitnehmer zu gleichen Teilen","textPt":"Empregador e empregado em partes iguais","correct":true},{"text":"Bundesagentur für Arbeit und Arbeitgeber zu gleichen Teilen","textPt":"A Agência Federal do Trabalho e o empregador em partes iguais","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Davidson liest, dass 2023 in der gesetzlichen Krankenversicherung (GKV) die Versicherungspflichtgrenze auf monatlich 5.550,00 EUR angehoben wurde. Welche der folgenden Aussagen über die Versicherungspflichtgrenze trifft zu?","qPt":"O Sr. Davidson lê que em 2023 o limite de obrigatoriedade de filiação ao seguro-saúde legal (GKV) foi elevado para 5.550,00 EUR mensais. Qual das seguintes afirmações sobre esse limite está correta?","a":"Versicherte, deren Bruttolohn über der Versicherungspflichtgrenze liegt, sind nicht mehr pflichtversichert, können aber freiwillig in der gesetzlichen Krankenversicherung bleiben, statt in die private Krankenversicherung zu wechseln.","aPt":"Segurados cujo salário bruto ultrapassa o limite de obrigatoriedade deixam de ser segurados obrigatórios, mas podem permanecer voluntariamente no seguro-saúde legal (GKV), em vez de migrar para um plano de saúde privado.","options":[{"text":"Auf den Teil des Bruttolohns, der über der Versicherungspflichtgrenze liegt, wird kein Beitrag erhoben.","textPt":"Sobre a parte do salário bruto que excede o limite de obrigatoriedade não é cobrada nenhuma contribuição.","correct":false},{"text":"Versicherte, deren Bruttolohn über der Versicherungspflichtgrenze liegt, müssen die GKV verlassen und in die private Krankenversicherung wechseln.","textPt":"Segurados cujo salário bruto ultrapassa o limite devem deixar o seguro-saúde legal e migrar para um plano privado.","correct":false},{"text":"Versicherte, deren Bruttolohn über der Versicherungspflichtgrenze liegt, können sich als freiwilliges Mitglied weiter in der GKV versichern.","textPt":"Segurados cujo salário bruto ultrapassa o limite podem permanecer filiados ao seguro-saúde legal como membros voluntários.","correct":true},{"text":"Bei einem Bruttolohn über der Versicherungspflichtgrenze sind Kinder nicht mehr in der GKV mitversichert.","textPt":"Com um salário bruto acima do limite, os filhos deixam de estar cobertos pelo seguro-saúde legal.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Davidson erhält eine Entgelterhöhung von monatlich 50,00 EUR. Obwohl sich sein Konsumverhalten nicht geändert hat, hat er am Monatsende weniger Geld zur Verfügung, weil die Preise gestiegen sind. Welches der folgenden Einkommen ist in diesem Fall gesunken?","qPt":"O Sr. Davidson recebe um aumento salarial de 50,00 EUR mensais. Embora seu comportamento de consumo não tenha mudado, ao final do mês ele dispõe de menos dinheiro, pois os preços subiram. Qual dos seguintes tipos de renda diminuiu nesse caso?","a":"Das Realeinkommen gibt an, wie viele Güter und Dienstleistungen man sich mit seinem Einkommen tatsächlich leisten kann (nominales Einkommen bereinigt um die Preissteigerung). Steigen die Preise stärker als das Einkommen, sinkt das Realeinkommen, auch wenn das Nominaleinkommen (die Geldsumme) gestiegen ist.","aPt":"A renda real (Realeinkommen) indica quantos bens e serviços se pode realmente comprar com a renda (a renda nominal ajustada pela inflação). Se os preços sobem mais do que a renda, a renda real cai, mesmo que a renda nominal (a quantia em dinheiro) tenha aumentado.","options":[{"text":"Bruttoeinkommen","textPt":"Renda bruta","correct":false},{"text":"Nominaleinkommen","textPt":"Renda nominal","correct":false},{"text":"Realeinkommen","textPt":"Renda real","correct":true},{"text":"Nettoeinkommen","textPt":"Renda líquida","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Davidson hat vom Betriebsrat der Korok-IT GmbH eine Einladung zur Betriebsversammlung erhalten. In welchem der folgenden Gesetze werden Betriebsversammlungen geregelt?","qPt":"O Sr. Davidson recebeu do conselho de trabalhadores (Betriebsrat) da Korok-IT GmbH um convite para a assembleia de empresa (Betriebsversammlung). Em qual das seguintes leis as assembleias de empresa estão regulamentadas?","a":"Betriebsversammlungen sind im Betriebsverfassungsgesetz (BetrVG) geregelt, das die Rechte und Pflichten von Betriebsrat und Arbeitgeber sowie die betriebliche Mitbestimmung regelt.","aPt":"As assembleias de empresa estão reguladas na Lei de Organização das Empresas (Betriebsverfassungsgesetz, BetrVG), que disciplina os direitos e deveres do conselho de trabalhadores e do empregador, bem como a cogestão na empresa.","options":[{"text":"Bürgerliches Gesetzbuch","textPt":"Código Civil alemão","correct":false},{"text":"Tarifvertragsgesetz","textPt":"Lei das Convenções Coletivas","correct":false},{"text":"Berufsbildungsgesetz","textPt":"Lei de Formação Profissional","correct":false},{"text":"Betriebsverfassungsgesetz","textPt":"Lei de Organização das Empresas","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Davidson möchte an der Betriebsversammlung teilnehmen. Die Betriebsversammlung findet während seiner Arbeitszeit statt. Welche Folge ergibt sich daraus?","qPt":"O Sr. Davidson quer participar da assembleia de empresa, que ocorre durante seu horário de trabalho. Qual é a consequência disso?","a":"Die Teilnahme an einer Betriebsversammlung während der Arbeitszeit gilt als Arbeitszeit und wird vom Arbeitgeber entsprechend vergütet; der Arbeitnehmer muss die ausgefallene Zeit nicht nacharbeiten.","aPt":"A participação na assembleia de empresa durante o horário de trabalho conta como tempo de trabalho e é remunerada normalmente pelo empregador; o empregado não precisa recuperar o tempo.","options":[{"text":"Herr Davidson muss die ausgefallene Arbeitszeit in den nächsten Tagen nachholen.","textPt":"O Sr. Davidson deve recuperar o tempo de trabalho perdido nos dias seguintes.","correct":false},{"text":"Er darf nur teilnehmen, wenn er seit mindestens einem halben Jahr bei der Korok-IT GmbH beschäftigt ist.","textPt":"Ele só pode participar se estiver empregado na Korok-IT GmbH há pelo menos meio ano.","correct":false},{"text":"Die Teilnahme an der Versammlung gilt als Arbeitszeit und wird entsprechend vergütet.","textPt":"A participação na assembleia conta como tempo de trabalho e é remunerada normalmente.","correct":true},{"text":"Herr Davidson darf nur teilnehmen, wenn er Gewerkschaftsmitglied ist.","textPt":"O Sr. Davidson só pode participar se for filiado a um sindicato.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Der Betriebsrat der Korok-IT GmbH hat verschiedene Rechte gegenüber dem Arbeitgeber. In welchem der folgenden Fälle hat der Betriebsrat ein Mitbestimmungsrecht?","qPt":"O conselho de trabalhadores da Korok-IT GmbH tem vários direitos perante o empregador. Em qual dos seguintes casos o conselho de trabalhadores tem direito de cogestão (Mitbestimmungsrecht)?","a":"Nach § 87 Abs. 1 Nr. 2 BetrVG hat der Betriebsrat ein zwingendes Mitbestimmungsrecht bei Beginn und Ende der täglichen Arbeitszeit. Will die Korok-IT GmbH diese während der Ferienzeit ändern, muss sie den Betriebsrat einbeziehen.","aPt":"Segundo o § 87, parágrafo 1, nº 2 da Lei de Organização das Empresas, o conselho de trabalhadores tem direito de cogestão obrigatório sobre o início e o fim da jornada diária de trabalho. Se a Korok-IT GmbH quiser alterá-la durante o período de férias, precisa envolver o conselho de trabalhadores.","options":[{"text":"Eine neue Mitarbeiterin kündigt innerhalb der Probezeit fristgerecht, um eine besser bezahlte Stelle anzutreten.","textPt":"Uma nova funcionária pede demissão dentro do período de experiência, respeitando o prazo, para assumir um emprego melhor remunerado.","correct":false},{"text":"Die Korok-IT GmbH möchte während der Ferienzeit die tägliche Arbeitszeit von acht auf zehn Stunden ändern.","textPt":"A Korok-IT GmbH quer alterar, durante o período de férias, a jornada diária de trabalho de oito para dez horas.","correct":true},{"text":"Der gesetzliche Mindeststundenlohn wird vom Bundestag erhöht.","textPt":"O salário mínimo legal por hora é aumentado pelo parlamento federal (Bundestag).","correct":false},{"text":"Eine Auszubildende hat die Abschlussprüfung bestanden und möchte zu einem anderen Arbeitgeber wechseln.","textPt":"Uma estagiária passou no exame final e quer mudar para outro empregador.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Zu den Kunden der Korok-IT GmbH zählt unter anderem die Köhnken KG, Berlin. Welche der folgenden Aussagen trifft auf die Rechtsform der KG zu?","qPt":"Entre os clientes da Korok-IT GmbH está a Köhnken KG, de Berlim. Qual das seguintes afirmações está correta sobre a forma jurídica da KG (sociedade em comandita)?","a":"Bei der Kommanditgesellschaft (KG) gibt es mindestens einen Komplementär, der unbeschränkt mit seinem Privatvermögen haftet, und mindestens einen Kommanditisten, der nur in Höhe seiner im Handelsregister eingetragenen Einlage haftet.","aPt":"Na sociedade em comandita (KG) há pelo menos um sócio comanditado (Komplementär), que responde ilimitadamente com seu patrimônio pessoal, e pelo menos um sócio comanditário (Kommanditist), que responde apenas até o valor de sua participação registrada no registro comercial.","options":[{"text":"Alle Gesellschafter haften unbeschränkt mit ihrem Privatvermögen.","textPt":"Todos os sócios respondem ilimitadamente com seu patrimônio pessoal.","correct":false},{"text":"Die Mindesteinlage der Gesellschafter beträgt 25.000 EUR.","textPt":"A participação mínima dos sócios é de 25.000 EUR.","correct":false},{"text":"Komplementäre der KG haften nicht für die Verluste der KG.","textPt":"Os sócios comanditados da KG não respondem pelas perdas da sociedade.","correct":false},{"text":"Kommanditisten haften maximal in Höhe ihrer Einlage.","textPt":"Os sócios comanditários respondem no máximo até o valor de sua participação.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Fachinformatikerin Erika Schmitz möchte sich nach ihrer abgeschlossenen Berufsausbildung selbstständig machen. Sie möchte in Köln eine Werkstatt und ein Ladenlokal für IT-Dienstleistungen und den Vertrieb von EDV-Zubehör eröffnen. Welcher der folgenden Gesichtspunkte spielt bei der Standortwahl keine Rolle?","qPt":"A Fachinformatikerin Erika Schmitz quer se tornar autônoma após concluir sua formação profissional. Ela quer abrir em Colônia uma oficina e uma loja para serviços de TI e venda de acessórios de informática. Qual dos seguintes aspectos não tem relevância na escolha do local?","a":"Die aktuellen Umsatzsteuersätze sind bundesweit einheitlich geregelt und spielen daher bei der Wahl eines bestimmten Standorts innerhalb Deutschlands keine Rolle. Konkurrenz, behördliche Auflagen, Verkehrsanbindung und Mietkosten unterscheiden sich dagegen je nach Standort und sind entscheidungsrelevant.","aPt":"As alíquotas atuais de imposto sobre vendas (IVA) são regulamentadas de forma uniforme em toda a Alemanha e, por isso, não influenciam a escolha de um local específico dentro do país. Já a concorrência, exigências legais, acesso viário e custos de aluguel variam conforme o local e são relevantes para a decisão.","options":[{"text":"Anzahl und Größe der Konkurrenzbetriebe","textPt":"Número e porte dos concorrentes","correct":false},{"text":"Aktuelle Umsatzsteuersätze","textPt":"Alíquotas atuais do imposto sobre vendas","correct":true},{"text":"Behördliche Auflagen, z. B. Bau- und Umweltvorschriften","textPt":"Exigências legais, por exemplo normas de construção e meio ambiente","correct":false},{"text":"Verkehrsanbindung für Kunden und Lieferanten","textPt":"Acesso viário para clientes e fornecedores","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Erika Schmitz hat die Schmitz-IT GmbH gegründet. Sie ist die einzige Gesellschafterin der GmbH. Das Startkapital in Höhe von 100.000,00 EUR hat sie als Stammkapital in voller Höhe in die GmbH eingebracht. Welche der folgenden Regelungen zur gesetzlichen Haftung ist im Fall der Schmitz-IT GmbH zutreffend?","qPt":"Erika Schmitz fundou a Schmitz-IT GmbH. Ela é a única sócia da empresa e integralizou os 100.000,00 EUR de capital inicial como capital social da GmbH. Qual das seguintes regras sobre responsabilidade legal se aplica nesse caso?","a":"Bei einer GmbH haftet grundsätzlich nur die Gesellschaft selbst mit ihrem Gesellschaftsvermögen für Verbindlichkeiten; das Privatvermögen der Gesellschafterin bleibt davon unberührt – das ist gerade der Vorteil dieser Rechtsform.","aPt":"Numa GmbH, em regra, somente a própria sociedade responde com seu patrimônio social pelas dívidas; o patrimônio pessoal da sócia fica protegido — essa é justamente a vantagem dessa forma jurídica.","options":[{"text":"Die Haftung der Schmitz-IT GmbH ist auf maximal 25.000,00 EUR begrenzt.","textPt":"A responsabilidade da Schmitz-IT GmbH está limitada a no máximo 25.000,00 EUR.","correct":false},{"text":"Die Schmitz-IT GmbH haftet mit ihrem Gesellschaftsvermögen.","textPt":"A Schmitz-IT GmbH responde com o patrimônio da sociedade.","correct":true},{"text":"Frau Schmitz haftet nur mit ihrem Privatvermögen.","textPt":"A Sra. Schmitz responde apenas com seu patrimônio pessoal.","correct":false},{"text":"Frau Schmitz haftet zusätzlich zu ihrer Stammeinlage mit ihrem Privatvermögen.","textPt":"A Sra. Schmitz responde, além de sua participação no capital, também com seu patrimônio pessoal.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Geschäftsführerin der Schmitz-IT GmbH erhält die Nachricht, dass die Schmitz-IT GmbH Mitglied der örtlichen Industrie- und Handelskammer geworden ist. Welche der folgenden Aussagen über die Aufgaben der Industrie- und Handelskammern trifft zu?","qPt":"A diretora da Schmitz-IT GmbH recebe a notícia de que a empresa passou a ser membro da câmara local de indústria e comércio. Qual das seguintes afirmações sobre as atribuições das câmaras de indústria e comércio está correta?","a":"Die Industrie- und Handelskammern (IHK) unterstützen und beraten die Arbeitgeber unter anderem bei der Suche nach geeigneten Fachkräften, zum Beispiel über die Berufsberatung und die Organisation der Ausbildung.","aPt":"As câmaras de indústria e comércio (IHK) apoiam e orientam os empregadores, entre outras coisas, na busca por mão de obra qualificada, por exemplo por meio da orientação profissional e da organização da formação.","options":[{"text":"führt das Handelsregister.","textPt":"mantêm o registro comercial.","correct":false},{"text":"überprüft die Bilanzen der Unternehmen.","textPt":"fiscalizam os balanços das empresas.","correct":false},{"text":"unterstützt und berät die Arbeitgeber bei der Suche nach geeigneten Fachkräften.","textPt":"apoiam e orientam os empregadores na busca por mão de obra qualificada.","correct":true},{"text":"legt die Gewerbesteuersätze des jeweiligen IHK-Bezirks fest.","textPt":"fixam as alíquotas do imposto sobre atividades econômicas do respectivo distrito.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Geschäftsleitung der Korok-IT GmbH möchte überprüfen, ob die Einstellung neuer Mitarbeiter sich positiv auf die Umsatzentwicklung ausgewirkt hat. Im Jahr 2021 waren 40 Mitarbeiter beschäftigt, der Umsatz pro Mitarbeiter betrug 98.000 EUR. Im Jahr 2022 waren 45 Mitarbeiter beschäftigt und der Gesamtumsatz betrug 4.590.000 EUR. Wie hoch war der Umsatz pro Mitarbeiter im Jahr 2022?","qPt":"A diretoria da Korok-IT GmbH quer verificar se a contratação de novos funcionários teve efeito positivo sobre o faturamento. Em 2021 havia 40 funcionários e o faturamento por funcionário era de 98.000 EUR. Em 2022 havia 45 funcionários e o faturamento total foi de 4.590.000 EUR. Qual foi o faturamento por funcionário em 2022?","a":"Umsatz pro Mitarbeiter = Gesamtumsatz ÷ Anzahl Mitarbeiter = 4.590.000 EUR ÷ 45 = 102.000 EUR.","aPt":"Faturamento por funcionário = faturamento total ÷ número de funcionários = 4.590.000 EUR ÷ 45 = 102.000 EUR.","options":[{"text":"98.000 EUR","textPt":"98.000 EUR","correct":false},{"text":"101.000 EUR","textPt":"101.000 EUR","correct":false},{"text":"102.000 EUR","textPt":"102.000 EUR","correct":true},{"text":"104.550 EUR","textPt":"104.550 EUR","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Der Umsatz pro Mitarbeiter der Korok-IT GmbH betrug 2021 98.000 EUR und stieg 2022 auf 102.000 EUR. Wie hoch war die prozentuale Veränderung des Umsatzes pro Mitarbeiter von 2021 auf 2022 (gerundet auf zwei Nachkommastellen)?","qPt":"O faturamento por funcionário da Korok-IT GmbH era de 98.000 EUR em 2021 e subiu para 102.000 EUR em 2022. Qual foi a variação percentual do faturamento por funcionário de 2021 para 2022 (arredondada para duas casas decimais)?","a":"Prozentuale Veränderung = (102.000 EUR − 98.000 EUR) ÷ 98.000 EUR × 100 ≈ 4,08 %.","aPt":"Variação percentual = (102.000 EUR − 98.000 EUR) ÷ 98.000 EUR × 100 ≈ 4,08 %.","options":[{"text":"2,04 %","textPt":"2,04 %","correct":false},{"text":"4,08 %","textPt":"4,08 %","correct":true},{"text":"4,59 %","textPt":"4,59 %","correct":false},{"text":"5,10 %","textPt":"5,10 %","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die seit einem Jahr bei der Korok-IT GmbH angestellte Susanne Becker legt am 24.04.2023 der Personalabteilung ein Kündigungsschreiben vor: Sie kündigt ihr Arbeitsverhältnis fristgerecht zum 30.04.2023. Es gelten die gesetzlichen Kündigungsfristen nach § 622 BGB (vier Wochen zum Fünfzehnten oder zum Ende eines Kalendermonats für die Grundfrist). Ist diese Kündigung zum genannten Zeitpunkt wirksam?","qPt":"Susanne Becker, funcionária da Korok-IT GmbH há um ano, apresenta ao RH em 24.04.2023 uma carta de demissão, encerrando seu contrato, segundo ela, em 30.04.2023. Aplicam-se os prazos legais de aviso prévio do § 622 do BGB (quatro semanas até o dia 15 ou até o fim de um mês civil, prazo básico). Essa demissão é válida para a data indicada?","a":"Die gesetzliche Grundkündigungsfrist von vier Wochen zum Fünfzehnten oder zum Monatsende gilt auch für Kündigungen durch den Arbeitnehmer. Vier Wochen nach dem 24.04.2023 ist frühestens der 22.05.2023 erreicht; der nächste zulässige Termin danach ist der 31.05.2023. Eine Kündigung zum 30.04.2023 hält diese Frist nicht ein und ist daher unwirksam.","aPt":"O prazo legal básico de quatro semanas até o dia 15 ou até o fim do mês vale também para demissões pedidas pelo empregado. Quatro semanas após 24.04.2023 chegam, no mínimo, a 22.05.2023; a próxima data válida depois disso é 31.05.2023. Uma rescisão para 30.04.2023 não respeita esse prazo e, portanto, é inválida.","options":[{"text":"Wirksam, da Frau Becker schriftlich und mit Begründung gekündigt hat.","textPt":"Válida, pois a Sra. Becker pediu demissão por escrito e com justificativa.","correct":false},{"text":"Wirksam, weil Frau Becker schon einen neuen Arbeitsplatz hat.","textPt":"Válida, porque a Sra. Becker já tem um novo emprego.","correct":false},{"text":"Unwirksam, weil Frau Becker die Kündigungsfrist von vier Wochen zum Fünfzehnten oder zum Ende des Kalendermonats einhalten muss.","textPt":"Inválida, porque a Sra. Becker deve respeitar o prazo de quatro semanas até o dia 15 ou até o fim do mês civil.","correct":true},{"text":"Unwirksam, weil Frau Becker ohne Zustimmung der Industrie- und Handelskammer gekündigt hat.","textPt":"Inválida, porque a Sra. Becker pediu demissão sem o consentimento da câmara de indústria e comércio.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Korok-IT GmbH möchte aufgrund der wirtschaftlich schwierigen Lage dem Fachinformatiker Hans Baumgart, 38 Jahre, Vater von zwei Kindern, aus betriebsbedingten Gründen kündigen. Er hält die Kündigung für sozial ungerechtfertigt und wendet sich an den Betriebsrat. Welche der folgenden Aussagen zu den Kündigungsmodalitäten ist zutreffend?","qPt":"Devido à difícil situação econômica, a Korok-IT GmbH quer demitir o Fachinformatiker Hans Baumgart, 38 anos, pai de dois filhos, por motivos operacionais. Ele considera a demissão socialmente injustificada e recorre ao conselho de trabalhadores. Qual das seguintes afirmações sobre os trâmites da demissão está correta?","a":"Vor jeder Kündigung muss der Betriebsrat angehört werden (§ 102 BetrVG), eine ohne Anhörung ausgesprochene Kündigung ist unwirksam. Hält der Arbeitnehmer die Kündigung für sozial ungerechtfertigt, kann er innerhalb von drei Wochen nach Zugang Kündigungsschutzklage beim zuständigen Arbeitsgericht erheben (§ 4 KSchG).","aPt":"Antes de qualquer demissão, o conselho de trabalhadores deve ser ouvido (§ 102 BetrVG); uma demissão feita sem essa consulta é inválida. Se o empregado considerar a demissão socialmente injustificada, pode ajuizar ação de proteção contra demissão no tribunal do trabalho competente em até três semanas após o recebimento (§ 4 KSchG).","options":[{"text":"Der Betriebsrat muss angehört werden. Hält der Betriebsrat die Kündigung für ungerechtfertigt, dann darf der Arbeitgeber nicht kündigen.","textPt":"O conselho de trabalhadores deve ser ouvido. Se ele considerar a demissão injustificada, o empregador não pode demitir.","correct":false},{"text":"Der Betriebsrat muss angehört werden. Herr Baumgart kann innerhalb von drei Wochen nach Zugang der Kündigung Klage beim zuständigen Arbeitsgericht einreichen.","textPt":"O conselho de trabalhadores deve ser ouvido. O Sr. Baumgart pode ajuizar ação no tribunal do trabalho competente em até três semanas após receber a demissão.","correct":true},{"text":"Der Betriebsrat muss in Kündigungsfragen nicht angehört werden.","textPt":"O conselho de trabalhadores não precisa ser ouvido em questões de demissão.","correct":false},{"text":"Betriebsbedingte Kündigungen sind immer gültig. Hier braucht der Betriebsrat nicht angehört werden.","textPt":"Demissões por motivos operacionais são sempre válidas. Nesse caso, o conselho de trabalhadores não precisa ser ouvido.","correct":false}]},
