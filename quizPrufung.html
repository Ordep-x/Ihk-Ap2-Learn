{"cat":"wiso","sub":"pruefung","q":"Nach der letzten Gehaltserhöhung übersteigt das Bruttogehalt von Melanie Fuchs die Beitragsbemessungsgrenze für die gesetzliche Rentenversicherung. Welche Konsequenz ergibt sich daraus für Frau Fuchs?","qPt":"Após o último aumento salarial, o salário bruto de Melanie Fuchs ultrapassa o limite de cálculo de contribuição do seguro de aposentadoria público. Qual consequência disso resulta para a Sra. Fuchs?","a":"Frau Fuchs muss nun für einen Teil ihres Gehalts keinen Rentenversicherungsbeitrag mehr leisten. Oberhalb der Beitragsbemessungsgrenze werden keine weiteren Beiträge zur gesetzlichen Rentenversicherung erhoben.","aPt":"A Sra. Fuchs agora não precisa mais contribuir para o seguro de aposentadoria sobre uma parte do seu salário. Acima do limite de cálculo de contribuição, não são mais cobradas contribuições ao seguro de aposentadoria público.","options":[{"text":"Frau Fuchs muss sich nun privat versichern.","textPt":"A Sra. Fuchs agora deve contratar um seguro privado.","correct":false},{"text":"Frau Fuchs muss nun für einen Teil ihres Gehalts keinen Rentenversicherungsbeitrag mehr leisten.","textPt":"A Sra. Fuchs agora não precisa mais contribuir para o seguro de aposentadoria sobre uma parte do seu salário.","correct":true},{"text":"Frau Fuchs erhält für die Sozialversicherung keinen Arbeitgeberanteil mehr.","textPt":"A Sra. Fuchs deixa de receber a parte do empregador na contribuição social.","correct":false},{"text":"Frau Fuchs ist in der gesetzlichen Rentenversicherung nicht mehr versicherungspflichtig.","textPt":"A Sra. Fuchs deixa de ser obrigada a se segurar no seguro de aposentadoria público.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Solidarität ist ein gesellschaftspolitisches Prinzip, das in der Bundesrepublik Deutschland angewendet wird. Welcher der folgenden Sachverhalte entspricht dem Prinzip der Solidarität?","qPt":"A solidariedade é um princípio sociopolítico aplicado na República Federal da Alemanha. Qual dos seguintes fatos corresponde ao princípio da solidariedade?","a":"Der Staat hebt die Beitragsbemessungsgrenze für die gesetzliche Krankenkasse an. Dadurch zahlen Besserverdienende einen höheren Beitrag, während die Leistungen für alle Versicherten gleich bleiben – ein Ausdruck des Solidaritätsprinzips.","aPt":"O Estado eleva o limite de cálculo de contribuição do seguro de saúde público. Com isso, quem ganha mais paga uma contribuição maior, enquanto os benefícios permanecem iguais para todos os segurados — uma expressão do princípio da solidariedade.","options":[{"text":"Der Staat hebt die Beitragsbemessungsgrenze für die gesetzliche Krankenkasse an.","textPt":"O Estado eleva o limite de cálculo de contribuição do seguro de saúde público.","correct":true},{"text":"Der Staat fordert verstärkt Selbstverantwortung bei der Altersvorsorge.","textPt":"O Estado exige maior responsabilidade individual na previdência para a velhice.","correct":false},{"text":"Der Spitzensteuersatz bei der Einkommensteuer wird gesenkt.","textPt":"A alíquota máxima do imposto de renda é reduzida.","correct":false},{"text":"Kindergartenbeiträge sind für alle Eltern, unabhängig vom Einkommen, gleich hoch.","textPt":"As mensalidades da creche são iguais para todos os pais, independentemente da renda.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Mitarbeiter der GreenByte GmbH diskutieren über die unterschiedlichen Möglichkeiten einer privaten Altersvorsorge. Welcher der folgenden Sachverhalte gefährdet eine private Altersvorsorge?","qPt":"Os funcionários da GreenByte GmbH discutem as diferentes possibilidades de uma previdência privada. Qual dos seguintes fatos representa um risco para uma previdência privada?","a":"Die Einführung von Kurzarbeitergeld für ein Jahr als Folge der Pandemie gefährdet eine private Altersvorsorge, da das reduzierte Einkommen während der Kurzarbeit die finanziellen Mittel einschränkt, die für regelmäßige Beiträge zur privaten Vorsorge zur Verfügung stehen.","aPt":"A introdução do auxílio por jornada reduzida (Kurzarbeitergeld) por um ano, em decorrência da pandemia, representa um risco para a previdência privada, pois a renda reduzida durante esse período limita os recursos financeiros disponíveis para contribuições regulares à previdência privada.","options":[{"text":"Steigende Zinsen für Spareinlagen","textPt":"Aumento dos juros sobre depósitos de poupança.","correct":false},{"text":"Einführung von Kurzarbeitergeld für ein Jahr als Folge der Pandemie","textPt":"Introdução do auxílio por jornada reduzida por um ano, em decorrência da pandemia.","correct":true},{"text":"Steigendes Lohnniveau","textPt":"Aumento do nível salarial.","correct":false},{"text":"Anhebung der Beitragsbemessungsgrenze in der gesetzlichen Rentenversicherung","textPt":"Aumento do limite de cálculo de contribuição no seguro de aposentadoria público.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die GreenByte GmbH ist ein erwerbswirtschaftliches Unternehmen. Welche Aussage trifft auf ein erwerbswirtschaftliches Unternehmen zu: Arbeitet es gewinnorientiert?","qPt":"A GreenByte GmbH é uma empresa com fins lucrativos. Qual afirmação é correta sobre uma empresa com fins lucrativos: ela atua voltada para o lucro?","a":"Ja, ein erwerbswirtschaftliches Unternehmen arbeitet gewinnorientiert (erwerbswirtschaftliches Prinzip), im Gegensatz zu gemeinwirtschaftlichen Betrieben, deren Ziel die bestmögliche Bedarfsdeckung der Allgemeinheit ist.","aPt":"Sim, uma empresa com fins lucrativos atua voltada para o lucro (princípio erwerbswirtschaftlich), em contraste com empresas de interesse público, cujo objetivo é o melhor abastecimento possível das necessidades da coletividade.","options":[{"text":"Ja, ein erwerbswirtschaftliches Unternehmen arbeitet gewinnorientiert.","textPt":"Sim, uma empresa com fins lucrativos atua voltada para o lucro.","correct":true},{"text":"Nein, ein erwerbswirtschaftliches Unternehmen darf keine Gewinne erzielen.","textPt":"Não, uma empresa com fins lucrativos não pode obter lucros.","correct":false},{"text":"Nein, ein erwerbswirtschaftliches Unternehmen muss jeden Kunden zu staatlich festgelegten Bedingungen und Preisen beliefern.","textPt":"Não, uma empresa com fins lucrativos deve atender todo cliente conforme condições e preços fixados pelo Estado.","correct":false},{"text":"Nein, ein erwerbswirtschaftliches Unternehmen wirtschaftet nach einem öffentlichen Wirtschaftsplan mit dem Ziel der Bedarfsdeckung.","textPt":"Não, uma empresa com fins lucrativos opera segundo um plano econômico público, com o objetivo de suprir necessidades.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche weitere Aussage trifft auf ein erwerbswirtschaftliches Unternehmen wie die GreenByte GmbH zu: Richtet es sein Portfolio am Marktumfeld aus?","qPt":"Qual outra afirmação é correta sobre uma empresa com fins lucrativos como a GreenByte GmbH: ela orienta seu portfólio conforme o ambiente de mercado?","a":"Ja, ein erwerbswirtschaftliches Unternehmen richtet sein Portfolio am Marktumfeld aus, da es sich – anders als ein öffentlich-rechtlicher Betrieb – im Wettbewerb behaupten und auf Kundenbedürfnisse sowie Konkurrenz reagieren muss, um wirtschaftlich erfolgreich zu sein.","aPt":"Sim, uma empresa com fins lucrativos orienta seu portfólio conforme o ambiente de mercado, pois — diferentemente de uma empresa de direito público — precisa se afirmar na concorrência e reagir às necessidades dos clientes e à competição para ter sucesso econômico.","options":[{"text":"Ja, sie richtet ihr Portfolio am Marktumfeld aus.","textPt":"Sim, ela orienta seu portfólio conforme o ambiente de mercado.","correct":true},{"text":"Nein, sie kann nur Konsumgüter herstellen.","textPt":"Não, ela só pode produzir bens de consumo.","correct":false},{"text":"Nein, sie darf keine Gewinne erzielen.","textPt":"Não, ela não pode obter lucros.","correct":false},{"text":"Nein, sie muss jeden Kunden zu staatlich festgelegten Bedingungen und Preisen beliefern.","textPt":"Não, ela deve atender todo cliente conforme condições e preços fixados pelo Estado.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Gesellschafter der GreenByte GmbH haben insgesamt Stammeinlagen in Höhe von 1.375.000 EUR in die GmbH eingebracht. Im Geschäftsjahr 2020 betrug der Gewinn 129.250 EUR bei unveränderten Stammeinlagen. Wie hoch ist die Eigenkapitalrentabilität im Jahr 2020?","qPt":"Os sócios da GreenByte GmbH aportaram, no total, participações de capital no valor de 1.375.000 EUR na GmbH. No exercício de 2020, o lucro foi de 129.250 EUR, com as participações inalteradas. Qual é a rentabilidade sobre o patrimônio líquido (Eigenkapitalrentabilität) em 2020?","a":"Die Eigenkapitalrentabilität 2020 beträgt 129.250 EUR / 1.375.000 EUR × 100 = 9,4 %. Sie misst, wie sich das eingesetzte Eigenkapital der Gesellschafter verzinst hat.","aPt":"A rentabilidade sobre o patrimônio líquido em 2020 é de 129.250 EUR / 1.375.000 EUR × 100 = 9,4%. Ela mede o quanto o capital próprio investido pelos sócios rendeu.","options":[{"text":"9,4 %","textPt":"9,4%.","correct":true},{"text":"8,5 %","textPt":"8,5%.","correct":false},{"text":"11,0 %","textPt":"11,0%.","correct":false},{"text":"12,9 %","textPt":"12,9%.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Gesellschafter der GreenByte GmbH haben insgesamt Stammeinlagen in Höhe von 1.375.000 EUR eingebracht. Im Jahr 2019 erzielte die GreenByte GmbH einen Gewinn von 116.875 EUR, im Jahr 2020 einen Gewinn von 129.250 EUR bei unveränderten Stammeinlagen. Um wie viele Prozentpunkte ist die Eigenkapitalrentabilität 2020 im Vergleich zu 2019 gestiegen?","qPt":"Os sócios da GreenByte GmbH aportaram, no total, participações de capital no valor de 1.375.000 EUR. Em 2019, a GreenByte GmbH obteve um lucro de 116.875 EUR; em 2020, um lucro de 129.250 EUR, com as participações inalteradas. Quantos pontos percentuais a rentabilidade sobre o patrimônio líquido aumentou em 2020 em relação a 2019?","a":"Die Eigenkapitalrentabilität betrug 2019: 116.875/1.375.000 × 100 = 8,5 %, 2020: 129.250/1.375.000 × 100 = 9,4 %. Der Anstieg beträgt somit 9,4 % − 8,5 % = 0,9 Prozentpunkte.","aPt":"A rentabilidade sobre o patrimônio líquido foi de: 2019: 116.875/1.375.000 × 100 = 8,5%; 2020: 129.250/1.375.000 × 100 = 9,4%. O aumento é, portanto, de 9,4% − 8,5% = 0,9 pontos percentuais.","options":[{"text":"0,9 Prozentpunkte","textPt":"0,9 pontos percentuais.","correct":true},{"text":"1,9 Prozentpunkte","textPt":"1,9 pontos percentuais.","correct":false},{"text":"9,0 Prozentpunkte","textPt":"9,0 pontos percentuais.","correct":false},{"text":"0,09 Prozentpunkte","textPt":"0,09 pontos percentuais.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Der Umsatz pro Mitarbeiter betrug bei der GreenByte GmbH im Jahr 2019 112.000 EUR. Im Geschäftsjahr 2020 hatte das Unternehmen 32 Mitarbeitende und einen Umsatz von 3.763.200 EUR. Wie hoch war der Umsatz pro Mitarbeiter im Jahr 2020?","qPt":"O faturamento por funcionário na GreenByte GmbH foi de 112.000 EUR em 2019. No exercício de 2020, a empresa tinha 32 funcionários e um faturamento de 3.763.200 EUR. Qual foi o faturamento por funcionário em 2020?","a":"Der Umsatz pro Mitarbeiter 2020 beträgt 3.763.200 EUR / 32 = 117.600 EUR.","aPt":"O faturamento por funcionário em 2020 é de 3.763.200 EUR / 32 = 117.600 EUR.","options":[{"text":"117.600 EUR","textPt":"117.600 EUR.","correct":true},{"text":"112.000 EUR","textPt":"112.000 EUR.","correct":false},{"text":"120.400 EUR","textPt":"120.400 EUR.","correct":false},{"text":"109.500 EUR","textPt":"109.500 EUR.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Der Umsatz pro Mitarbeiter betrug bei der GreenByte GmbH im Jahr 2019 112.000 EUR und im Jahr 2020 117.600 EUR. Um wie viel Prozent hat sich der Umsatz pro Mitarbeiter von 2019 auf 2020 verändert?","qPt":"O faturamento por funcionário na GreenByte GmbH foi de 112.000 EUR em 2019 e de 117.600 EUR em 2020. Em quantos por cento o faturamento por funcionário variou de 2019 para 2020?","a":"Die prozentuale Veränderung beträgt (117.600 − 112.000) / 112.000 × 100 = 5.600/112.000 × 100 = 5 %. Der Umsatz pro Mitarbeiter ist trotz des insgesamt gesunkenen Gesamtumsatzes um 5 % gestiegen.","aPt":"A variação percentual é (117.600 − 112.000) / 112.000 × 100 = 5.600/112.000 × 100 = 5%. O faturamento por funcionário aumentou 5%, apesar da queda do faturamento total da empresa.","options":[{"text":"+5 %","textPt":"+5%.","correct":true},{"text":"+2 %","textPt":"+2%.","correct":false},{"text":"+10 %","textPt":"+10%.","correct":false},{"text":"−5 %","textPt":"−5%.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In der GreenByte GmbH wird die Zusammenarbeit von Unternehmen in ihrem wirtschaftlichen Umfeld beobachtet. Bei welchem der folgenden Sachverhalte handelt es sich um eine Fusion: Zwei Kunden der GreenByte GmbH, die Schmidt GmbH und die Weber KG, schließen sich zur Schmidt GmbH & Co. KG zusammen?","qPt":"Na GreenByte GmbH observa-se a colaboração entre empresas em seu ambiente econômico. Qual dos seguintes fatos representa uma fusão: dois clientes da GreenByte GmbH, a Schmidt GmbH e a Weber KG, se unem para formar a Schmidt GmbH & Co. KG?","a":"Ja, es handelt sich um eine Fusion. Die beiden ursprünglich rechtlich und wirtschaftlich selbstständigen Unternehmen verschmelzen zu einem neuen Unternehmen und verlieren dabei ihre bisherige Selbstständigkeit vollständig.","aPt":"Sim, trata-se de uma fusão. As duas empresas originalmente independentes, jurídica e economicamente, se fundem em uma nova empresa, perdendo totalmente sua independência anterior.","options":[{"text":"Ja, dies ist eine Fusion.","textPt":"Sim, isso é uma fusão.","correct":true},{"text":"Nein, dies ist eine Arbeitsgemeinschaft.","textPt":"Não, isso é um consórcio.","correct":false},{"text":"Nein, dies ist ein Kartell.","textPt":"Não, isso é um cartel.","correct":false},{"text":"Nein, dies ist ein Konzern.","textPt":"Não, isso é um grupo econômico (Konzern).","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die GreenByte GmbH will ein IT-Servicecenter in der Rechtsform einer GmbH gründen. Mit welchem der folgenden Ereignisse wird eine GmbH rechtsfähig?","qPt":"A GreenByte GmbH quer fundar um centro de serviços de TI na forma jurídica de GmbH. Com qual dos seguintes eventos uma GmbH se torna capaz de direitos (rechtsfähig)?","a":"Mit der Eintragung in das Handelsregister wird die GmbH rechtsfähig (§ 11 GmbHG). Erst ab diesem Zeitpunkt existiert die GmbH als eigenständige juristische Person; vorher handelt es sich lediglich um eine Vor-GmbH.","aPt":"Com o registro no registro comercial, a GmbH se torna capaz de direitos (§ 11 da GmbHG). Somente a partir desse momento a GmbH existe como pessoa jurídica própria; antes disso, trata-se apenas de uma pré-GmbH (Vor-GmbH).","options":[{"text":"Mit der Einzahlung des Stammkapitals","textPt":"Com a integralização do capital social.","correct":false},{"text":"Mit der notariellen Beurkundung des Gesellschaftsvertrages","textPt":"Com a escritura notarial do contrato social.","correct":false},{"text":"Mit dem Abschluss des ersten Rechtsgeschäfts","textPt":"Com a conclusão do primeiro negócio jurídico.","correct":false},{"text":"Mit der Eintragung in das Handelsregister","textPt":"Com o registro no registro comercial.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die GreenByte GmbH will ein IT-Servicecenter in der Rechtsform einer GmbH gründen. Welche Aussage zur GmbH ist zutreffend?","qPt":"A GreenByte GmbH quer fundar um centro de serviços de TI na forma jurídica de GmbH. Qual afirmação sobre a GmbH é correta?","a":"Ein Gesellschafter kann gleichzeitig Geschäftsführer sein (sogenannter Gesellschafter-Geschäftsführer). Dies ist bei GmbHs, insbesondere bei kleineren Unternehmen, eine sehr häufige und zulässige Konstellation.","aPt":"Um sócio pode ser, ao mesmo tempo, diretor-gerente (o chamado sócio-gerente, Gesellschafter-Geschäftsführer). Essa é uma configuração muito comum e permitida em GmbHs, especialmente em empresas menores.","options":[{"text":"Das Stammkapital muss mindestens 50.000 EUR betragen.","textPt":"O capital social deve ser de, no mínimo, 50.000 EUR.","correct":false},{"text":"Ein Gesellschafter kann gleichzeitig Geschäftsführer sein.","textPt":"Um sócio pode ser, ao mesmo tempo, diretor-gerente.","correct":true},{"text":"Die GmbH hat keine Firma.","textPt":"A GmbH não tem uma razão social (Firma).","correct":false},{"text":"Die neu gegründete GmbH ist eine juristische Person des öffentlichen Rechts.","textPt":"A GmbH recém-fundada é uma pessoa jurídica de direito público.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Das Verhalten von Konsumenten hängt von verschiedenen Faktoren ab. Welche Aussage ist zutreffend?","qPt":"O comportamento dos consumidores depende de diversos fatores. Qual afirmação é correta?","a":"Die Nachfrage der Konsumenten ist abhängig von der Kaufkraft. Ein Bedürfnis wird erst dann zu wirtschaftlich relevanter Nachfrage, wenn der Konsument auch über die finanziellen Mittel verfügt, es zu befriedigen.","aPt":"A demanda dos consumidores depende do poder de compra. Um desejo só se torna demanda economicamente relevante quando o consumidor também dispõe dos meios financeiros para satisfazê-lo.","options":[{"text":"Der Bedarf der Konsumenten ist unabhängig von der Menge ihrer Bedürfnisse.","textPt":"A necessidade dos consumidores independe da quantidade de seus desejos.","correct":false},{"text":"Die Kaufkraft hat keinen Einfluss auf den Bedarf.","textPt":"O poder de compra não tem influência sobre a necessidade.","correct":false},{"text":"Die Nachfrage der Konsumenten ist abhängig von der Kaufkraft.","textPt":"A demanda dos consumidores depende do poder de compra.","correct":true},{"text":"Die Bedürfnisse der Konsumenten entsprechen dem Angebot.","textPt":"Os desejos dos consumidores correspondem à oferta.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die GreenByte GmbH bietet ihren Kunden seit zwei Jahren erfolgreich ein Dokumentenmanagementsystem an. Da Dokumentenmanagementsysteme ein hohes Wachstumspotenzial haben, wurde das Angebot im Markt durch mehrere neue Mitbewerber stark erhöht. Die Nachfrage ist im geringeren Maße als die Erhöhung des Angebots gestiegen. Welche Aussage trifft auf diese Marktsituation zu?","qPt":"A GreenByte GmbH oferece com sucesso, há dois anos, um sistema de gestão de documentos a seus clientes. Como sistemas de gestão de documentos têm alto potencial de crescimento, a oferta no mercado aumentou fortemente devido a vários novos concorrentes. A demanda cresceu em menor medida do que o aumento da oferta. Qual afirmação é correta sobre essa situação de mercado?","a":"Es ist ein Käufermarkt, weil das gestiegene Angebot Preissenkungen erwarten lässt. Übersteigt das Angebot die Nachfrage deutlich, verschiebt sich die Marktmacht zugunsten der Käufer, die aus mehreren Anbietern wählen können und so günstigere Preise durchsetzen können.","aPt":"É um mercado comprador (Käufermarkt), pois a oferta aumentada faz esperar quedas de preço. Quando a oferta supera claramente a demanda, o poder de mercado se desloca em favor dos compradores, que podem escolher entre vários fornecedores e assim conseguir preços mais baixos.","options":[{"text":"Es ist ein Verkäufermarkt, weil das gestiegene Angebot Preissteigerungen ermöglicht.","textPt":"É um mercado vendedor, pois a oferta aumentada possibilita aumentos de preço.","correct":false},{"text":"Es ist ein Käufermarkt, weil das gestiegene Angebot Preissenkungen erwarten lässt.","textPt":"É um mercado comprador, pois a oferta aumentada faz esperar quedas de preço.","correct":true},{"text":"Das Angebot der neuen Mitbewerber hat keinen Einfluss auf die Preisbildung.","textPt":"A oferta dos novos concorrentes não tem influência na formação de preços.","correct":false},{"text":"Wegen des Nachfrageüberhangs können die Unternehmen Preissteigerungen durchsetzen.","textPt":"Devido ao excesso de demanda, as empresas podem impor aumentos de preço.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In einem vollkommenen Markt beeinflusst der erzielbare Preis eines Produkts die angebotene Menge des Produkts. Welche Aussage über den Zusammenhang von angebotener Menge und Preis eines Produktes trifft zu?","qPt":"Em um mercado perfeito, o preço alcançável de um produto influencia a quantidade ofertada do produto. Qual afirmação sobre a relação entre quantidade ofertada e preço de um produto é correta?","a":"Je höher der Preis des Produkts ist, umso höher ist die angebotene Menge. Dies entspricht dem Gesetz des Angebots: Mit steigendem Preis wird es für Anbieter attraktiver, mehr von einem Produkt auf den Markt zu bringen.","aPt":"Quanto mais alto o preço do produto, maior é a quantidade ofertada. Isso corresponde à lei da oferta: com o aumento do preço, torna-se mais atraente para os ofertantes colocar mais desse produto no mercado.","options":[{"text":"Je höher die angebotene Menge des Produkts ist, umso niedriger ist der Preis.","textPt":"Quanto maior a quantidade ofertada do produto, mais baixo é o preço.","correct":false},{"text":"Je höher der Preis des Produkts ist, umso niedriger ist die angebotene Menge.","textPt":"Quanto mais alto o preço do produto, menor é a quantidade ofertada.","correct":false},{"text":"Je höher der Preis des Produkts ist, umso höher ist die angebotene Menge.","textPt":"Quanto mais alto o preço do produto, maior é a quantidade ofertada.","correct":true},{"text":"Der Preis eines Produkts hat keinen Einfluss auf die angebotene Menge.","textPt":"O preço de um produto não tem influência na quantidade ofertada.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die GreenByte GmbH hat mit der Volt GmbH einen Vertrag geschlossen. Dieser wurde vonseiten der Volt GmbH mit 'ppa. Sylvia Heimer' unterschrieben. Welche Position hat Sylvia Heimer in der Volt GmbH laut dieser Unterschrift?","qPt":"A GreenByte GmbH firmou um contrato com a Volt GmbH. Este foi assinado, do lado da Volt GmbH, com 'ppa. Sylvia Heimer'. Qual posição Sylvia Heimer ocupa na Volt GmbH, segundo essa assinatura?","a":"Der Zusatz 'ppa.' (per procura) kennzeichnet Sylvia Heimer eindeutig als Prokuristin. Die Prokura ist eine weitreichende, gesetzlich definierte Vollmacht nach §§ 48 ff. HGB, die zu fast allen Geschäften des Handelsgewerbes ermächtigt.","aPt":"O acréscimo 'ppa.' (per procura) identifica claramente Sylvia Heimer como procuradora (Prokuristin). A Prokura é uma procuração ampla, definida por lei nos §§ 48 e seguintes do HGB, que autoriza a praticar quase todos os negócios do comércio.","options":[{"text":"Kommanditistin","textPt":"Sócia comanditária.","correct":false},{"text":"Prokuristin","textPt":"Procuradora (com Prokura).","correct":true},{"text":"Handlungsbevollmächtigte","textPt":"Procuradora comercial (com procuração limitada).","correct":false},{"text":"Vorstand","textPt":"Membro da diretoria.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die GreenByte GmbH hat mit der Volt GmbH einen Vertrag geschlossen. Dieser wurde vonseiten der Volt GmbH mit 'i. V. Dr. Karl Pfeffer' unterschrieben. Welche Position hat Dr. Karl Pfeffer in der Volt GmbH laut dieser Unterschrift?","qPt":"A GreenByte GmbH firmou um contrato com a Volt GmbH. Este foi assinado, do lado da Volt GmbH, com 'i. V. Dr. Karl Pfeffer'. Qual posição Dr. Karl Pfeffer ocupa na Volt GmbH, segundo essa assinatura?","a":"Der Zusatz 'i. V.' (in Vertretung) kennzeichnet Dr. Pfeffer als Handlungsbevollmächtigten. Im Gegensatz zur Prokura (ppa.) ist die Handlungsvollmacht nach § 54 HGB meist auf bestimmte, dem gewöhnlichen Geschäftsbetrieb entsprechende Arten von Geschäften beschränkt.","aPt":"O acréscimo 'i. V.' (in Vertretung, em representação) identifica o Dr. Pfeffer como procurador comercial (Handlungsbevollmächtigter). Ao contrário da Prokura (ppa.), a procuração comercial, segundo o § 54 do HGB, geralmente se limita a determinados tipos de negócios próprios da atividade comercial habitual.","options":[{"text":"Kommanditist","textPt":"Sócio comanditário.","correct":false},{"text":"Prokurist","textPt":"Procurador (com Prokura).","correct":false},{"text":"Handlungsbevollmächtigter","textPt":"Procurador comercial (com procuração limitada).","correct":true},{"text":"Vorstand","textPt":"Membro da diretoria.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Der Verbraucherschutz ist ein zentrales Element der sozialen Marktwirtschaft. Bei der GreenByte GmbH wird dies im Zusammenhang mit einem Kundenvertrag thematisiert. Welche Aussage trifft auf den Verbraucherschutz zu?","qPt":"A proteção ao consumidor é um elemento central da economia social de mercado. Na GreenByte GmbH, isso é discutido no contexto de um contrato com um cliente. Qual afirmação é correta sobre a proteção ao consumidor?","a":"Viele dem Verbraucherschutz dienenden Rechtsnormen sind im Bürgerlichen Gesetzbuch (BGB) verankert, z. B. die Vorschriften über Fernabsatzverträge (§§ 312c ff. BGB), die unter anderem ein Widerrufsrecht für Verbraucher vorsehen.","aPt":"Muitas normas jurídicas voltadas à proteção do consumidor estão ancoradas no Código Civil alemão (BGB), por exemplo, as normas sobre contratos à distância (§§ 312c e seguintes do BGB), que preveem, entre outras coisas, um direito de desistência para os consumidores.","options":[{"text":"Träger des Verbraucherschutzes sind die Unternehmen, welche die Verbraucher umfassend und objektiv über ihre Produkte und Dienstleistungen informieren müssen.","textPt":"Os responsáveis pela proteção ao consumidor são as próprias empresas, que devem informar os consumidores de forma abrangente e objetiva sobre seus produtos e serviços.","correct":false},{"text":"Der Verbraucherschutz schließt die Nachteile aus, welche aufgrund mangelnder Fachkenntnis, Information und/oder Erfahrung der Konsumenten entstehen.","textPt":"A proteção ao consumidor elimina completamente as desvantagens decorrentes da falta de conhecimento técnico, informação e/ou experiência dos consumidores.","correct":false},{"text":"Viele dem Verbraucherschutz dienenden Rechtsnormen sind im Bürgerlichen Gesetzbuch (BGB) verankert, z. B. die Vorschriften über Fernabsatzverträge.","textPt":"Muitas normas jurídicas voltadas à proteção do consumidor estão ancoradas no Código Civil alemão (BGB), por exemplo, as normas sobre contratos à distância.","correct":true},{"text":"Der Verbraucherschutz bezieht sich allein auf Produkte, welche die Gesundheit der Verbraucher schädigen können, z. B. Lebensmittel, Medikamente, Trinkwasser.","textPt":"A proteção ao consumidor se refere apenas a produtos que podem prejudicar a saúde dos consumidores, como alimentos, medicamentos, água potável.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Arbeitnehmer können Maßnahmen zur persönlichen Existenzsicherung treffen. Welche der folgenden Maßnahmen ist zur persönlichen Existenzsicherung geeignet?","qPt":"Os trabalhadores podem tomar medidas para garantir sua subsistência pessoal. Qual das seguintes medidas é adequada para a garantia da subsistência pessoal?","a":"Der Abschluss einer Versicherung für den Fall der Berufsunfähigkeit ist zur persönlichen Existenzsicherung geeignet, da sie bei Verlust der Erwerbsfähigkeit das Einkommen absichert und damit die materielle Existenzgrundlage schützt.","aPt":"A contratação de um seguro para o caso de incapacidade profissional é adequada para a garantia da subsistência pessoal, pois protege a renda em caso de perda da capacidade de trabalho, preservando assim a base material de existência.","options":[{"text":"Abschluss einer Garantieverlängerung für das neue Smartphone","textPt":"Contratação de uma extensão de garantia para o novo smartphone.","correct":false},{"text":"Abschluss einer Versicherung für den Fall der Berufsunfähigkeit","textPt":"Contratação de um seguro para o caso de incapacidade profissional.","correct":true},{"text":"Abschluss eines Ratenkaufvertrags aufgrund fehlender Liquidität","textPt":"Contratação de uma compra a prazo devido à falta de liquidez.","correct":false},{"text":"Abschluss einer privaten Zusatzkrankenversicherung","textPt":"Contratação de um seguro de saúde complementar privado.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Scholz will ein Unternehmen gründen, das in einem Onlineshop IT-Zubehör vertreibt. Das Unternehmen erfordert nach Art und Umfang einen kaufmännischen Geschäftsbetrieb. Welche Aussage zur Unternehmensgründung ist zutreffend?","qPt":"O Sr. Scholz quer fundar uma empresa que vende acessórios de TI em uma loja online. A empresa exige, por sua natureza e dimensão, uma atividade empresarial de caráter comercial. Qual afirmação sobre a fundação da empresa é correta?","a":"Herr Scholz muss als Ist-Kaufmann sein kaufmännisch geführtes Unternehmen im Handelsregister eintragen lassen (§ 1 HGB). Da sein Geschäftsbetrieb nach Art und Umfang einen kaufmännischen Zuschnitt erfordert, wird er kraft Gesetzes Kaufmann und unterliegt der Eintragungspflicht.","aPt":"O Sr. Scholz, como comerciante de fato (Ist-Kaufmann), deve registrar sua empresa, de gestão comercial, no registro comercial (§ 1 do HGB). Como sua atividade exige, por natureza e dimensão, um caráter comercial, ele se torna comerciante por força de lei e está sujeito à obrigação de registro.","options":[{"text":"Zur Absicherung von Krediten muss die Unternehmensform Gesellschaft mit beschränkter Haftung (GmbH) gewählt werden.","textPt":"Para garantir créditos, deve-se escolher a forma jurídica de sociedade de responsabilidade limitada (GmbH).","correct":false},{"text":"Die Industrie- und Handelskammer verlangt von Herrn Scholz den Nachweis seiner fachlichen Qualifikation zum Betrieb eines kaufmännisch zu führenden Unternehmens.","textPt":"A Câmara de Indústria e Comércio exige do Sr. Scholz a comprovação de sua qualificação técnica para operar uma empresa de gestão comercial.","correct":false},{"text":"Herr Scholz muss als Ist-Kaufmann sein kaufmännisch geführtes Unternehmen im Handelsregister eintragen lassen.","textPt":"O Sr. Scholz, como comerciante de fato, deve registrar sua empresa, de gestão comercial, no registro comercial.","correct":true},{"text":"Herr Scholz ist von der Einkommensteuerpflicht befreit, wenn er Gewerbesteuer zahlt.","textPt":"O Sr. Scholz está isento do imposto de renda se pagar o imposto sobre atividades comerciais.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Arbeitsleistung der GreenByte GmbH wird von verschiedenen Wirtschaftseinheiten erbracht. Bei welchem der folgenden Fälle handelt es sich um eine betriebliche Arbeitsteilung (Arbeitszerlegung)?","qPt":"O trabalho da GreenByte GmbH é realizado por diferentes unidades econômicas. Qual dos seguintes casos representa uma divisão do trabalho dentro da empresa (Arbeitszerlegung)?","a":"Die GreenByte GmbH produziert ein Produkt in mehreren Arbeitsschritten, die von verschiedenen Arbeitskräften ausgeführt werden. Dies ist der klassische Fall betrieblicher Arbeitsteilung: Ein Gesamtprozess wird innerhalb desselben Betriebs in Teilschritte zerlegt.","aPt":"A GreenByte GmbH produz um produto em várias etapas, executadas por diferentes trabalhadores. Este é o caso clássico de divisão do trabalho dentro da empresa: um processo total é dividido em etapas dentro da mesma empresa.","options":[{"text":"Die GreenByte GmbH gliedert einen Schritt eines Leistungsprozesses an die OS GmbH aus (zwischenbetrieblich).","textPt":"A GreenByte GmbH terceiriza uma etapa de um processo produtivo para a OS GmbH (entre empresas).","correct":false},{"text":"Die GreenByte GmbH organisiert einen Prozess als Lieferkette (Supply Chain) mit Lieferanten und Kunden (zwischenbetrieblich).","textPt":"A GreenByte GmbH organiza um processo como cadeia de suprimentos (Supply Chain) com fornecedores e clientes (entre empresas).","correct":false},{"text":"Die GreenByte GmbH betreibt eine Filiale, die in allen Geschäftsfeldern selbstständig operiert (keine Arbeitsteilung in diesem Sinne).","textPt":"A GreenByte GmbH opera uma filial que atua de forma independente em todas as áreas de negócio (não é divisão do trabalho nesse sentido).","correct":false},{"text":"Die GreenByte GmbH produziert ein Produkt in mehreren Arbeitsschritten, die von verschiedenen Arbeitskräften ausgeführt werden.","textPt":"A GreenByte GmbH produz um produto em várias etapas, executadas por diferentes trabalhadores.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die GreenByte GmbH hat sich mit den Auswirkungen der Globalisierung auseinanderzusetzen. Welche der folgenden Auswirkungen trifft auch auf die GreenByte GmbH zu?","qPt":"A GreenByte GmbH precisa lidar com os efeitos da globalização. Qual dos seguintes efeitos também se aplica à GreenByte GmbH?","a":"Das unternehmerische Risiko steigt, weil durch die notwendigen Warentransporte Lieferketten unterbrochen werden können. Internationale Verflechtungen machen Unternehmen anfälliger für globale Störungen wie z. B. Lieferengpässe.","aPt":"O risco empresarial aumenta, pois os transportes de mercadorias necessários podem levar a interrupções nas cadeias de suprimentos. O entrelaçamento internacional torna as empresas mais vulneráveis a perturbações globais, como gargalos de fornecimento.","options":[{"text":"Das unternehmerische Risiko sinkt, weil neue Märkte erschlossen werden.","textPt":"O risco empresarial diminui, pois novos mercados são explorados.","correct":false},{"text":"Da Deutschland ein Niedriglohnland ist, stehen der GreenByte GmbH ausreichend Fachkräfte zur Verfügung.","textPt":"Como a Alemanha é um país de baixos salários, a GreenByte GmbH dispõe de mão de obra qualificada suficiente.","correct":false},{"text":"Alle Aufträge der GreenByte GmbH werden weltweit in EUR abgewickelt.","textPt":"Todos os pedidos da GreenByte GmbH são processados em EUR em todo o mundo.","correct":false},{"text":"Das unternehmerische Risiko steigt, weil durch die notwendigen Warentransporte Lieferketten unterbrochen werden können.","textPt":"O risco empresarial aumenta, pois os transportes de mercadorias necessários podem levar a interrupções nas cadeias de suprimentos.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Wirtschaftsordnung Deutschlands wird als soziale Marktwirtschaft bezeichnet. Welche Aussage trifft auf die soziale Marktwirtschaft zu?","qPt":"A ordem econômica da Alemanha é chamada de economia social de mercado. Qual afirmação é correta sobre a economia social de mercado?","a":"Die Sozialgesetzgebung soll den Einzelnen vor den negativen Auswirkungen des Marktes schützen. Die soziale Marktwirtschaft verbindet die Freiheit des Marktes (Wettbewerb, Privateigentum) mit sozialem Ausgleich durch staatliche Sozialgesetzgebung.","aPt":"A legislação social deve proteger o indivíduo contra os efeitos negativos do mercado. A economia social de mercado combina a liberdade do mercado (concorrência, propriedade privada) com a compensação social por meio da legislação social estatal.","options":[{"text":"Die Produktionsmittel dürfen kein privates Eigentum sein.","textPt":"Os meios de produção não podem ser propriedade privada.","correct":false},{"text":"Die Sozialgesetzgebung soll den Einzelnen vor den negativen Auswirkungen des Marktes schützen.","textPt":"A legislação social deve proteger o indivíduo contra os efeitos negativos do mercado.","correct":true},{"text":"Die Gewinne dürfen von den Anbietern bis zur Gewinnschwelle frei kalkuliert werden.","textPt":"Os lucros podem ser calculados livremente pelos ofertantes apenas até o ponto de equilíbrio.","correct":false},{"text":"Es dürfen nur die Berufe ausgebildet werden, die auf dem Arbeitsmarkt nachgefragt werden.","textPt":"Só podem ser formadas as profissões demandadas no mercado de trabalho.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Sachs-IT GmbH hat mit dem 25-jährigen Harry Petry einen Einzelarbeitsvertrag geschlossen. Welche der folgenden Aussagen zu diesem Einzelarbeitsvertrag ist zutreffend?","qPt":"A Sachs-IT GmbH celebrou um contrato de trabalho individual (Einzelarbeitsvertrag) com Harry Petry, de 25 anos. Qual das seguintes afirmações sobre esse contrato é correta?","a":"Ein Einzelarbeitsvertrag ist auch dann gültig, wenn das individuell vereinbarte Arbeitsentgelt über dem tariflich geregelten Arbeitsentgelt liegt. Das tarifvertraglich festgelegte Entgelt ist nur eine Mindestgrenze, die im Einzelvertrag zugunsten des Arbeitnehmers überschritten werden darf (Günstigkeitsprinzip).","aPt":"Um contrato de trabalho individual continua válido mesmo quando o salário acordado individualmente é mais alto do que o salário fixado na convenção coletiva (Tarifvertrag). O valor da convenção coletiva é apenas um piso mínimo; o contrato individual pode superá-lo em favor do trabalhador (princípio da norma mais favorável).","options":[{"text":"Er ist auch gültig, wenn das vereinbarte Arbeitsentgelt über dem tarifvertraglich geregelten liegt.","textPt":"Continua válido mesmo que o salário acordado seja superior ao fixado na convenção coletiva.","correct":true},{"text":"Er kann nur geschlossen werden, wenn für die Sachs-IT GmbH kein gültiger Tarifvertrag vorliegt.","textPt":"Só pode ser celebrado se a Sachs-IT GmbH não tiver nenhuma convenção coletiva válida.","correct":false},{"text":"Er kann nur mit Zustimmung der Gewerkschaft geschlossen werden.","textPt":"Só pode ser celebrado com a aprovação do sindicato.","correct":false},{"text":"Er darf für höchstens zwei Jahre geschlossen werden.","textPt":"Só pode ser celebrado por no máximo dois anos.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In Herrn Petrys Arbeitsvertrag ist auch eine Angabe zur Probezeit vorgesehen. Muss bei einem Einzelarbeitsvertrag mit einem regulären Arbeitnehmer zwingend eine Probezeit vereinbart werden?","qPt":"No contrato de trabalho do Sr. Petry também consta uma cláusula de período de experiência (Probezeit). É obrigatório acordar um período de experiência num contrato individual com um trabalhador comum?","a":"Nein. Die Vereinbarung einer Probezeit ist bei einem regulären Arbeitsverhältnis gesetzlich nicht vorgeschrieben; sie könnte daher auch ganz entfallen.","aPt":"Não. A lei não exige um período de experiência numa relação de trabalho comum; portanto, ele poderia simplesmente não existir.","options":[{"text":"Nein, die Probezeit könnte ggf. ganz entfallen.","textPt":"Não, o período de experiência poderia até não existir.","correct":true},{"text":"Ja, sie muss mindestens einen Monat betragen.","textPt":"Sim, deve durar no mínimo um mês.","correct":false},{"text":"Ja, sie muss mindestens drei Monate betragen.","textPt":"Sim, deve durar no mínimo três meses.","correct":false},{"text":"Ja, sie muss mindestens vier Monate betragen.","textPt":"Sim, deve durar no mínimo quatro meses.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Wie lange darf die vereinbarte Probezeit im Arbeitsvertrag von Herrn Petry höchstens dauern?","qPt":"Qual é a duração máxima permitida para o período de experiência acordado no contrato de trabalho do Sr. Petry?","a":"Die Probezeit kann bei einem regulären Arbeitsverhältnis bis zu sechs Monate betragen.","aPt":"Numa relação de trabalho comum, o período de experiência pode durar até seis meses.","options":[{"text":"Sie kann bis zu sechs Monate betragen.","textPt":"Pode durar até seis meses.","correct":true},{"text":"Sie kann bis zu drei Monate betragen.","textPt":"Pode durar até três meses.","correct":false},{"text":"Sie kann bis zu zwei Jahren betragen.","textPt":"Pode durar até dois anos.","correct":false},{"text":"Sie kann bis zu einem Monat betragen.","textPt":"Pode durar até um mês.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Henry Witting, 17 Jahre, hat seine Berufsausbildung als Fachinformatiker bei der Sachs-IT GmbH begonnen. Nach § 14 Jugendarbeitsschutzgesetz (JArbSchG) dürfen Jugendliche nur in der Zeit von 6 bis 20 Uhr beschäftigt werden. Zu welcher Uhrzeit könnte Herr Witting unter Beachtung des JArbSchG frühestens seinen Dienst beginnen?","qPt":"Henry Witting, 17 anos, iniciou sua formação profissional como Fachinformatiker na Sachs-IT GmbH. Segundo o §14 da Lei de Proteção ao Trabalho de Jovens (JArbSchG), menores só podem trabalhar entre 6h e 20h. A que horas, no mais cedo, o Sr. Witting poderia começar seu turno respeitando essa lei?","a":"Frühestens um 06:00 Uhr, da § 14 Abs. 1 JArbSchG die Beschäftigung Jugendlicher erst ab 6 Uhr morgens erlaubt (Nachtruhe für Jugendliche).","aPt":"No mais cedo às 06:00h, pois o §14, parágrafo 1 da JArbSchG só permite o trabalho de menores a partir das 6h da manhã (período de repouso noturno obrigatório para jovens).","options":[{"text":"06:00 Uhr","textPt":"06:00h","correct":true},{"text":"05:00 Uhr","textPt":"05:00h","correct":false},{"text":"07:00 Uhr","textPt":"07:00h","correct":false},{"text":"08:00 Uhr","textPt":"08:00h","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche der folgenden Vorschriften gilt für den 17-jährigen Auszubildenden Herrn Witting laut Jugendarbeitsschutzgesetz?","qPt":"Qual das seguintes regras se aplica ao aprendiz de 17 anos, Sr. Witting, segundo a Lei de Proteção ao Trabalho de Jovens?","a":"Jugendliche dürfen nach § 15 JArbSchG (Fünf-Tage-Woche) grundsätzlich nur an fünf Tagen in der Woche beschäftigt werden.","aPt":"Segundo o §15 da JArbSchG (semana de cinco dias), em regra os jovens só podem trabalhar cinco dias por semana.","options":[{"text":"Jugendliche dürfen nur an fünf Tagen in der Woche beschäftigt werden.","textPt":"Jovens só podem trabalhar cinco dias por semana.","correct":true},{"text":"Die erste Nachuntersuchung muss drei Monate nach Ausbildungsbeginn stattfinden.","textPt":"O primeiro exame médico de acompanhamento deve ocorrer três meses após o início da formação.","correct":false},{"text":"An Feiertagen dürfen Jugendliche nicht beschäftigt werden; Ausnahmen sieht das Gesetz nicht vor.","textPt":"Jovens não podem trabalhar em feriados; a lei não prevê exceções.","correct":false},{"text":"Jugendliche dürfen nicht mehr als 48 Stunden wöchentlich beschäftigt werden.","textPt":"Jovens não podem trabalhar mais de 48 horas semanais.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Witting (Auszubildender, wird am 4. April 2022 volljährig) möchte wissen, wie viel Urlaub ihm für das Kalenderjahr 2022 zusteht. Nach § 19 JArbSchG stünden ihm als Jugendlichem mindestens 25 Werktage zu; der Tarifvertrag der Sachs-IT GmbH sieht in § 42 dagegen 30 Arbeitstage für alle Beschäftigten vor. Wie viele Urlaubstage stehen Herrn Witting für 2022 zu?","qPt":"O Sr. Witting (aprendiz, completa a maioridade em 4 de abril de 2022) quer saber quantos dias de férias tem direito no ano-calendário de 2022. Pela lei (§19 JArbSchG), como menor ele teria direito a pelo menos 25 dias úteis; já a convenção coletiva da Sachs-IT GmbH (§42) prevê 30 dias úteis para todos os funcionários. Quantos dias de férias o Sr. Witting tem direito em 2022?","a":"Ihm stehen 30 Urlaubstage zu. Bei unterschiedlichen Regelungen gilt stets die für den Arbeitnehmer günstigere Regelung – hier die tarifliche Regelung mit 30 Arbeitstagen, da sie höher ist als der gesetzliche Mindestanspruch.","aPt":"Ele tem direito a 30 dias de férias. Quando há regras diferentes aplicáveis, vale sempre a mais favorável ao trabalhador — neste caso, a regra da convenção coletiva (30 dias), por ser maior que o mínimo legal.","options":[{"text":"30 Tage","textPt":"30 dias","correct":true},{"text":"25 Tage","textPt":"25 dias","correct":false},{"text":"27 Tage","textPt":"27 dias","correct":false},{"text":"32 Tage","textPt":"32 dias","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Ausbildungsleiterin der Sachs-IT GmbH sucht Mitarbeitende, die als Ausbilder tätig werden wollen. Welche Voraussetzung muss ein Ausbilder nach den gesetzlichen Regelungen u. a. erfüllen?","qPt":"A responsável pela formação na Sachs-IT GmbH procura funcionários dispostos a atuar como formadores (Ausbilder). Qual requisito um formador deve cumprir, entre outros, segundo a lei?","a":"Ein Ausbilder muss über die notwendige persönliche und fachliche Eignung verfügen. Alle übrigen genannten Anforderungen (z. B. Mitglied der Geschäftsleitung oder einer Gewerkschaft zu sein) sind nicht gesetzlich vorgeschrieben.","aPt":"Um formador precisa ter a aptidão pessoal e técnica necessária. Todos os outros requisitos mencionados (por exemplo, ser membro da diretoria ou de um sindicato) não são exigidos por lei.","options":[{"text":"Er/Sie muss über eine notwendige persönliche und fachliche Eignung verfügen.","textPt":"Deve ter a aptidão pessoal e técnica necessária.","correct":true},{"text":"Er/Sie muss Mitglied der Geschäftsleitung sein.","textPt":"Deve ser membro da diretoria da empresa.","correct":false},{"text":"Er/Sie muss Mitglied einer Gewerkschaft sein.","textPt":"Deve ser membro de um sindicato.","correct":false},{"text":"Er/Sie muss jährlich ein Weiterbildungsseminar der IHK besuchen.","textPt":"Deve participar anualmente de um seminário de formação continuada da Câmara (IHK).","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Einem Mitarbeiter der Sachs-IT GmbH wurde ohne Anhörung des Betriebsrates gekündigt. Welche Aussage entspricht dem Betriebsverfassungsgesetz?","qPt":"Um funcionário da Sachs-IT GmbH foi demitido sem que o conselho de trabalhadores (Betriebsrat) fosse ouvido. Qual afirmação corresponde à Lei de Organização das Empresas (BetrVG)?","a":"Die Kündigung ist unwirksam, weil die Anhörung des Betriebsrates nach § 102 Abs. 1 BetrVG vor jeder Kündigung zwingend vorgeschrieben ist. Eine ohne Anhörung ausgesprochene Kündigung ist unwirksam und kann auch nicht nachträglich geheilt werden.","aPt":"A demissão é inválida, pois o §102, parágrafo 1 da BetrVG exige obrigatoriamente a oitiva do conselho de trabalhadores antes de qualquer demissão. Uma demissão feita sem essa oitiva é inválida e não pode ser corrigida posteriormente.","options":[{"text":"Die Kündigung ist unwirksam, weil eine Anhörung des Betriebsrates zwingend vorgeschrieben ist.","textPt":"A demissão é inválida, pois a oitiva do conselho de trabalhadores é obrigatória por lei.","correct":true},{"text":"Die Kündigung ist wirksam, weil eine Zustimmung des Betriebsrates nicht vorgeschrieben ist.","textPt":"A demissão é válida, pois a aprovação do conselho de trabalhadores não é exigida.","correct":false},{"text":"Die Kündigung ist durch eine nachträgliche Anhörung des Betriebsrates wirksam geworden.","textPt":"A demissão se torna válida com uma oitiva posterior do conselho de trabalhadores.","correct":false},{"text":"Die Kündigung ist unwirksam, wenn das Arbeitsgericht nicht beteiligt wurde.","textPt":"A demissão é inválida apenas se o tribunal do trabalho não foi envolvido.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die 17-jährige Auszubildende Pamela Bommering kündigt ihr Ausbildungsverhältnis eigenhändig mit einem Schreiben, das sie selbst unterschreibt. Hat Frau Bommering damit wirksam gekündigt?","qPt":"A aprendiz Pamela Bommering, de 17 anos, rescinde seu contrato de aprendizagem com uma carta assinada apenas por ela mesma. Essa rescisão é válida?","a":"Nein. Da Frau Bommering minderjährig ist, fehlt die erforderliche Unterschrift ihrer Erziehungsberechtigten als gesetzliche Vertreter. Ohne diese ist die Kündigung unwirksam.","aPt":"Não. Como a Sra. Bommering é menor de idade, falta a assinatura obrigatória de seus responsáveis legais. Sem essa assinatura, a rescisão é inválida.","options":[{"text":"Nein, weil die Unterschrift der Erziehungsberechtigten als gesetzliche Vertreter fehlt.","textPt":"Não, porque falta a assinatura dos responsáveis legais.","correct":true},{"text":"Ja, weil das Kündigungsschreiben rechtzeitig übergeben wurde.","textPt":"Sim, porque a carta de rescisão foi entregue dentro do prazo.","correct":false},{"text":"Ja, weil Frau Bommering schriftlich gekündigt und einen Kündigungsgrund angegeben hat.","textPt":"Sim, porque ela rescindiu por escrito e indicou um motivo.","correct":false},{"text":"Nein, weil die Kündigungsfrist von vier Wochen nicht eingehalten wurde.","textPt":"Não, porque o prazo de aviso prévio de quatro semanas não foi respeitado.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Bommering wünscht nach Beendigung ihres Ausbildungsvertrages ein qualifiziertes Zeugnis. Welche der folgenden Formulierungen macht das Zeugnis zu einem qualifizierten Zeugnis?","qPt":"Após o fim do contrato de aprendizagem, a Sra. Bommering deseja um atestado de trabalho qualificado (qualifiziertes Zeugnis). Qual das seguintes frases torna o atestado qualificado?","a":"Die Formulierung 'erledigte die ihr übertragenen Aufgaben stets zu unserer vollsten Zufriedenheit' macht das Zeugnis qualifiziert, da ein qualifiziertes Zeugnis – anders als ein einfaches Zeugnis – auch Aussagen über Leistung und Verhalten enthalten muss.","aPt":"A frase 'cumpriu as tarefas atribuídas sempre para nossa inteira satisfação' é o que torna o atestado qualificado, pois um atestado qualificado — diferente de um simples — precisa incluir avaliações sobre desempenho e comportamento.","options":[{"text":"„... erledigte die ihr übertragenen Aufgaben stets zu unserer vollsten Zufriedenheit.“","textPt":"\"...cumpriu as tarefas atribuídas sempre para nossa inteira satisfação.\"","correct":true},{"text":"„Pamela Bommering, geboren am 03.12.2004 ...“","textPt":"\"Pamela Bommering, nascida em 03.12.2004...\"","correct":false},{"text":"„... wurde seit dem 1. Januar 2021 in unserem Betrieb ausgebildet.“","textPt":"\"...foi formada em nossa empresa desde 1º de janeiro de 2021.\"","correct":false},{"text":"„Wir wünschen Frau Bommering für die Zukunft alles Gute.“","textPt":"\"Desejamos à Sra. Bommering tudo de bom para o futuro.\"","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In der Sachs-IT GmbH wurde ein Betriebsrat gewählt. Welche Aussage über den Betriebsrat ist zutreffend?","qPt":"Um conselho de trabalhadores (Betriebsrat) foi eleito na Sachs-IT GmbH. Qual afirmação sobre o conselho de trabalhadores é correta?","a":"Der Betriebsrat besitzt bei der Aufstellung des Urlaubsplans ein Mitbestimmungsrecht (§ 87 BetrVG). Ein Betriebsrat muss hingegen nicht in jeder GmbH gewählt werden und hat keine umfassende Vollmacht, für das Unternehmen Rechtsgeschäfte abzuschließen.","aPt":"O conselho de trabalhadores tem direito de cogestão na elaboração do plano de férias (§87 BetrVG). Por outro lado, não é obrigatório eleger um conselho de trabalhadores em toda GmbH, e ele não tem poderes amplos para realizar negócios jurídicos em nome da empresa.","options":[{"text":"Ein Betriebsrat besitzt bei der Aufstellung des Urlaubsplans ein Mitbestimmungsrecht.","textPt":"Tem direito de cogestão na elaboração do plano de férias.","correct":true},{"text":"Ein Betriebsrat muss in jeder Gesellschaft mit beschränkter Haftung gewählt werden.","textPt":"Deve ser eleito em toda sociedade de responsabilidade limitada (GmbH).","correct":false},{"text":"Ein Betriebsrat besitzt umfangreiche Handlungsvollmacht und kann in fast allen Belangen des Unternehmens Rechtsgeschäfte abschließen.","textPt":"Possui amplos poderes e pode realizar negócios jurídicos em quase todos os assuntos da empresa.","correct":false},{"text":"Ein Betriebsrat muss aufgrund der zwingenden Mitbestimmung der Gründung einer Filiale zustimmen.","textPt":"Deve aprovar obrigatoriamente a abertura de uma filial.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche Aussage zur Jugend- und Auszubildendenvertretung (JAV) ist zutreffend?","qPt":"Qual afirmação sobre a Representação de Jovens e Aprendizes (JAV) é correta?","a":"Als Auszubildende/-r unter 25 Jahren ist man sowohl wahlberechtigt als auch wählbar (§§ 60, 61 BetrVG). Wählbar sind alle Arbeitnehmer des Betriebs, die das 25. Lebensjahr noch nicht vollendet haben oder sich in der Berufsausbildung befinden.","aPt":"Como aprendiz com menos de 25 anos, a pessoa tem direito tanto a votar quanto a ser eleita (§§60, 61 BetrVG). Podem ser eleitos todos os funcionários da empresa que ainda não completaram 25 anos ou que estejam em formação profissional.","options":[{"text":"„Als Auszubildende/-r unter 25 sind Sie wahlberechtigt und auch wählbar.“","textPt":"\"Como aprendiz com menos de 25 anos, você tem direito a votar e a ser eleito.\"","correct":true},{"text":"„Es ist ausreichend, eine Liste von drei Vorgesetzten vorzulegen, die Ihre Wahl unterstützen.“","textPt":"\"Basta apresentar uma lista de três superiores que apoiem sua candidatura.\"","correct":false},{"text":"„Eine eventuelle strafrechtliche Verurteilung ist für die Wahl nicht relevant.“","textPt":"\"Uma eventual condenação criminal não tem relevância para a candidatura.\"","correct":false},{"text":"„Wenn es 20 Wahlberechtigte gibt, können Sie leicht eins der vier JAV-Mitglieder werden.“","textPt":"\"Se houver 20 eleitores, você facilmente se torna um dos quatro membros da JAV.\"","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In der Sachs-IT GmbH sind zwei Drittel der Mitarbeiter Mitglied einer Gewerkschaft und an die absolute Friedenspflicht gebunden. Was bedeutet die im Tarifrecht genannte absolute Friedenspflicht?","qPt":"Na Sachs-IT GmbH, dois terços dos funcionários são filiados a um sindicato e estão vinculados ao dever absoluto de paz social (absolute Friedenspflicht). O que significa esse dever no direito de convenções coletivas?","a":"Die absolute Friedenspflicht verbietet während der Laufzeit eines geltenden Tarifvertrages jeden Arbeitskampf (z. B. Streiks) zwischen den Tarifparteien.","aPt":"O dever absoluto de paz social proíbe qualquer medida de luta trabalhista (por exemplo, greves) entre as partes da convenção coletiva enquanto esta estiver em vigor.","options":[{"text":"Verbot eines Arbeitskampfes während eines geltenden Tarifvertrages","textPt":"Proibição de luta trabalhista enquanto a convenção coletiva estiver em vigor.","correct":true},{"text":"Erzeugung eines guten Betriebsklimas","textPt":"Criação de um bom clima de trabalho.","correct":false},{"text":"Vermeidung von Auseinandersetzungen vor dem Arbeitsgericht","textPt":"Evitar disputas no tribunal do trabalho.","correct":false},{"text":"Einhaltung des Kündigungsschutzes für Betriebsratsmitglieder","textPt":"Respeito à proteção contra demissão para membros do conselho de trabalhadores.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Sachs-IT GmbH ist tarifgebunden. Wie kommt ein Tarifvertrag zustande?","qPt":"A Sachs-IT GmbH está vinculada a uma convenção coletiva. Como uma convenção coletiva (Tarifvertrag) é formada?","a":"Ein Tarifvertrag kommt durch freie Vereinbarung der Tarifparteien (Gewerkschaft und Arbeitgeber bzw. Arbeitgeberverband) zustande, ohne dass es der Genehmigung eines staatlich bestellten Schlichters bedarf.","aPt":"Uma convenção coletiva é formada por meio de acordo livre entre as partes (sindicato e empregador ou associação patronal), sem necessidade de aprovação de um mediador nomeado pelo Estado.","options":[{"text":"Er kommt durch freie Vereinbarung der Tarifparteien zustande.","textPt":"É formada por acordo livre entre as partes da convenção coletiva.","correct":true},{"text":"Er bedarf der Genehmigung eines staatlich bestellten Schlichters.","textPt":"Precisa da aprovação de um mediador nomeado pelo Estado.","correct":false},{"text":"Er darf nur für gewerkschaftlich organisierte Arbeitende angewendet werden.","textPt":"Só pode ser aplicado a trabalhadores filiados ao sindicato.","correct":false},{"text":"Er gibt Höchstgrenzen für Löhne und Gehälter an.","textPt":"Define limites máximos para salários.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Schließt ein geltender Tarifvertrag bei der Sachs-IT GmbH für die Arbeitnehmer günstigere Betriebsvereinbarungen aus?","qPt":"Uma convenção coletiva vigente na Sachs-IT GmbH impede acordos de empresa (Betriebsvereinbarungen) mais favoráveis aos trabalhadores?","a":"Nein. Ein Tarifvertrag schließt günstigere Betriebsvereinbarungen nicht aus – nach dem Günstigkeitsprinzip dürfen Betriebsvereinbarungen von tariflichen Regelungen abweichen, wenn sie für die Arbeitnehmer vorteilhafter sind.","aPt":"Não. Uma convenção coletiva não impede acordos de empresa mais favoráveis — pelo princípio da norma mais favorável, acordos de empresa podem se desviar das regras coletivas quando forem mais vantajosos para os trabalhadores.","options":[{"text":"Nein, ein Tarifvertrag schließt günstigere Betriebsvereinbarungen nicht aus.","textPt":"Não, uma convenção coletiva não impede acordos de empresa mais favoráveis.","correct":true},{"text":"Ja, Betriebsvereinbarungen dürfen niemals von Tarifverträgen abweichen.","textPt":"Sim, acordos de empresa nunca podem se desviar de convenções coletivas.","correct":false},{"text":"Ja, weil Tarifverträge stets Höchstgrenzen festlegen.","textPt":"Sim, porque convenções coletivas sempre definem limites máximos.","correct":false},{"text":"Nein, aber nur wenn die Gewerkschaft zustimmt.","textPt":"Não, mas apenas se o sindicato concordar.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Neben einem neuen Gehaltstarifvertrag wird von den Tarifpartnern auch ein neuer Mantel- bzw. Rahmentarifvertrag geschlossen. Welcher Sachverhalt wird darin u. a. geregelt?","qPt":"Além de uma nova convenção coletiva salarial, as partes também celebram uma nova convenção-quadro (Manteltarifvertrag). O que, entre outras coisas, é regulado nessa convenção?","a":"Ein Manteltarifvertrag regelt die langfristigen und allgemeinen Arbeitsbedingungen, z. B. die Anzahl der Sonderurlaubstage – nicht konkrete Lohn- oder Gehaltshöhen, die Gegenstand des Lohn-/Gehaltstarifvertrags sind.","aPt":"Uma convenção-quadro regula as condições de trabalho gerais e de longo prazo, como o número de dias de licença especial — e não os valores concretos de salário, que são tratados na convenção salarial.","options":[{"text":"Die Anzahl der Sonderurlaubstage","textPt":"O número de dias de licença especial.","correct":true},{"text":"Die Mindest- und Höchstlohnsätze","textPt":"Os valores mínimos e máximos de salário.","correct":false},{"text":"Der Betrag des Ecklohns","textPt":"O valor do salário-base de referência.","correct":false},{"text":"Definition der jeweiligen Vergütungsgruppen","textPt":"A definição dos grupos de remuneração.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Petry bittet um Informationen zur Sozialversicherung. Ist eine Lebensversicherung Teil des Beitragssatzes des Arbeitnehmers zur gesetzlichen Sozialversicherung?","qPt":"O Sr. Petry pede informações sobre a previdência social. Um seguro de vida faz parte da contribuição do trabalhador à previdência social legal?","a":"Nein. Eine Lebensversicherung ist eine private Versicherung und nicht Teil der gesetzlichen Sozialversicherung (Kranken-, Pflege-, Renten-, Arbeitslosen- und Unfallversicherung).","aPt":"Não. Um seguro de vida é um seguro privado e não faz parte da previdência social legal (seguro-saúde, seguro-cuidado, previdência, seguro-desemprego e seguro de acidentes).","options":[{"text":"Nein, die Lebensversicherung ist eine private Versicherung und nicht in der gesetzlichen Sozialversicherung enthalten.","textPt":"Não, o seguro de vida é privado e não faz parte da previdência social legal.","correct":true},{"text":"Ja, sie zählt zu den fünf Säulen der Sozialversicherung.","textPt":"Sim, conta como um dos cinco pilares da previdência social.","correct":false},{"text":"Ja, aber nur für Arbeitnehmer über 50 Jahre.","textPt":"Sim, mas só para trabalhadores com mais de 50 anos.","correct":false},{"text":"Ja, sie ersetzt die Rentenversicherung.","textPt":"Sim, substitui a previdência (aposentadoria).","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Zahlt der Arbeitnehmer bei der Sachs-IT GmbH Beiträge zur gesetzlichen Unfallversicherung?","qPt":"O trabalhador da Sachs-IT GmbH paga contribuições ao seguro de acidentes legal?","a":"Nein. Die Beiträge zur gesetzlichen Unfallversicherung trägt allein der Arbeitgeber; sie sind nicht im Beitragssatz des Arbeitnehmers enthalten.","aPt":"Não. As contribuições ao seguro de acidentes legal são pagas exclusivamente pelo empregador; elas não fazem parte da contribuição do trabalhador.","options":[{"text":"Nein, die Beiträge zur gesetzlichen Unfallversicherung trägt der Arbeitgeber allein.","textPt":"Não, as contribuições ao seguro de acidentes são pagas somente pelo empregador.","correct":true},{"text":"Ja, Arbeitnehmer und Arbeitgeber teilen sich die Beiträge je zur Hälfte.","textPt":"Sim, trabalhador e empregador dividem as contribuições meio a meio.","correct":false},{"text":"Ja, der Arbeitnehmer trägt die Beiträge allein.","textPt":"Sim, o trabalhador paga sozinho as contribuições.","correct":false},{"text":"Ja, aber nur bei Berufskrankheiten.","textPt":"Sim, mas apenas em casos de doenças ocupacionais.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Eine Auszubildende der Sachs-IT GmbH will einen Teil ihrer Berufsausbildung im Ausland durchführen. Welche Aussage zum Europass ist zutreffend?","qPt":"Uma aprendiz da Sachs-IT GmbH quer realizar parte de sua formação profissional no exterior. Qual afirmação sobre o Europass é correta?","a":"Der Europass unterstützt Auszubildende dabei, erworbene Qualifikationen, Fähigkeiten und Kompetenzen bei Bewerbungen europaweit verständlich darzustellen.","aPt":"O Europass ajuda aprendizes a apresentar, de forma compreensível em toda a Europa, as qualificações, habilidades e competências adquiridas ao se candidatarem a vagas.","options":[{"text":"Der Europass unterstützt Auszubildende, erworbene Qualifikationen, Fähigkeiten und Kompetenzen bei Bewerbungen europaweit verständlich darzustellen.","textPt":"O Europass ajuda aprendizes a apresentar suas qualificações de forma compreensível em toda a Europa.","correct":true},{"text":"Der Europass ist ein kostenpflichtiger Dienst.","textPt":"O Europass é um serviço pago.","correct":false},{"text":"Der vom Europass ausgestellte Mobilitätsnachweis ist für eine Berufsausbildung im europäischen Ausland verpflichtend.","textPt":"O certificado de mobilidade do Europass é obrigatório para uma formação no exterior europeu.","correct":false},{"text":"Der Europass zertifiziert ausschließlich Fremdsprachenkenntnisse.","textPt":"O Europass certifica exclusivamente conhecimentos de línguas estrangeiras.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ein Computerhersteller produziert Laptops. Welchem Wirtschaftssektor wird diese Tätigkeit zugeordnet?","qPt":"Um fabricante de computadores produz laptops. A qual setor econômico essa atividade pertence?","a":"Die Produktion von Laptops gehört zum sekundären Sektor, da hier Rohstoffe und Vorprodukte zu einem fertigen Produkt verarbeitet werden.","aPt":"A produção de laptops pertence ao setor secundário, pois matérias-primas e produtos intermediários são transformados em um produto final.","options":[{"text":"Sekundärer Sektor","textPt":"Setor secundário","correct":true},{"text":"Primärer Sektor","textPt":"Setor primário","correct":false},{"text":"Tertiärer Sektor","textPt":"Setor terciário","correct":false},{"text":"Quartärer Sektor","textPt":"Setor quaternário","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die für die Smartphone-Fertigung benötigten Rohstoffe werden von der Mining Co. im Tagebau gefördert. Welchem Wirtschaftssektor gehört diese Tätigkeit an?","qPt":"As matérias-primas necessárias para a fabricação de smartphones são extraídas pela mineradora Mining Co. em uma mina a céu aberto. A qual setor econômico essa atividade pertence?","a":"Die Gewinnung von Rohstoffen gehört zum primären Sektor (Urproduktion).","aPt":"A extração de matérias-primas pertence ao setor primário (produção de base, como agricultura e mineração).","options":[{"text":"Primärer Sektor","textPt":"Setor primário","correct":true},{"text":"Sekundärer Sektor","textPt":"Setor secundário","correct":false},{"text":"Tertiärer Sektor","textPt":"Setor terciário","correct":false},{"text":"Quartärer Sektor","textPt":"Setor quaternário","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Altintas KG erstellt Sicherheits-Software. Welchem Wirtschaftssektor wird diese Tätigkeit zugeordnet?","qPt":"A empresa Altintas KG desenvolve software de segurança. A qual setor econômico essa atividade pertence?","a":"Die Herstellung/Entwicklung von Software gilt als Verarbeitung/Produktion und wird dem sekundären Sektor zugeordnet.","aPt":"A criação/desenvolvimento de software é considerada processamento/produção e pertence ao setor secundário.","options":[{"text":"Sekundärer Sektor","textPt":"Setor secundário","correct":true},{"text":"Primärer Sektor","textPt":"Setor primário","correct":false},{"text":"Tertiärer Sektor","textPt":"Setor terciário","correct":false},{"text":"Quartärer Sektor","textPt":"Setor quaternário","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Sachs-IT GmbH kauft Monitore und verkauft diese an einen Kunden weiter. Welchem Wirtschaftssektor gehört diese Tätigkeit an?","qPt":"A Sachs-IT GmbH compra monitores e os revende a um cliente. A qual setor econômico essa atividade pertence?","a":"Der reine Handel mit bereits fertigen Produkten ist eine Dienstleistung und gehört zum tertiären Sektor.","aPt":"O comércio puro de produtos já prontos é um serviço e pertence ao setor terciário.","options":[{"text":"Tertiärer Sektor","textPt":"Setor terciário","correct":true},{"text":"Primärer Sektor","textPt":"Setor primário","correct":false},{"text":"Sekundärer Sektor","textPt":"Setor secundário","correct":false},{"text":"Quartärer Sektor","textPt":"Setor quaternário","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Sachs-IT GmbH berät Kunden bei deren innerbetrieblichen Sicherheitsproblemen. Welchem Wirtschaftssektor wird diese Beratungstätigkeit zugeordnet?","qPt":"A Sachs-IT GmbH assessora clientes em seus problemas internos de segurança. A qual setor econômico essa atividade de consultoria pertence?","a":"Beratungsleistungen sind Dienstleistungen und gehören zum tertiären Sektor.","aPt":"Serviços de consultoria são serviços e pertencem ao setor terciário.","options":[{"text":"Tertiärer Sektor","textPt":"Setor terciário","correct":true},{"text":"Primärer Sektor","textPt":"Setor primário","correct":false},{"text":"Sekundärer Sektor","textPt":"Setor secundário","correct":false},{"text":"Quartärer Sektor","textPt":"Setor quaternário","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der Gründung der Sachs-IT GmbH wurde die Rechtsform GmbH gewählt. Welche Aussage trifft auf eine GmbH zu?","qPt":"Na fundação da Sachs-IT GmbH, foi escolhida a forma jurídica GmbH (sociedade de responsabilidade limitada). Qual afirmação sobre uma GmbH é correta?","a":"Die Gewinnverteilung einer GmbH erfolgt, sofern im Gesellschaftsvertrag nichts Abweichendes vereinbart wurde, der gesetzlichen Regelung entsprechend nach Geschäftsanteilen.","aPt":"A distribuição de lucros de uma GmbH ocorre, salvo disposição diferente no contrato social, de acordo com a regra legal, proporcionalmente às quotas sociais de cada sócio.","options":[{"text":"Die Gewinnverteilung erfolgt der gesetzlichen Regelung entsprechend nach Geschäftsanteilen.","textPt":"A distribuição de lucros segue a regra legal, proporcional às quotas sociais.","correct":true},{"text":"GmbH-Anteile werden an der Börse gehandelt.","textPt":"As quotas da GmbH são negociadas na bolsa de valores.","correct":false},{"text":"Das Stammkapital der GmbH muss bei Gründung mindestens 100.000 EUR betragen.","textPt":"O capital social da GmbH deve ser de pelo menos 100.000 euros na fundação.","correct":false},{"text":"Die Gesellschafter der GmbH haften für Verbindlichkeiten mit ihrem Privatvermögen.","textPt":"Os sócios da GmbH respondem pelas dívidas com seu patrimônio pessoal.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Für vier durchgeführte Aufträge der Sachs-IT GmbH liegen folgende Zahlen vor: Auftrag 1: Aufwand 150.000 EUR, Ertrag 180.000 EUR. Auftrag 2: Aufwand 40.000 EUR, Ertrag 50.000 EUR. Auftrag 3: Aufwand 40.000 EUR, Ertrag 52.000 EUR. Auftrag 4: Aufwand 50.000 EUR, Ertrag 62.000 EUR. Welcher Auftrag wurde am wirtschaftlichsten abgewickelt (Wirtschaftlichkeit = Ertrag ÷ Aufwand)?","qPt":"Para quatro pedidos realizados pela Sachs-IT GmbH, há os seguintes valores: Pedido 1: custo 150.000€, receita 180.000€. Pedido 2: custo 40.000€, receita 50.000€. Pedido 3: custo 40.000€, receita 52.000€. Pedido 4: custo 50.000€, receita 62.000€. Qual pedido foi o mais econômico (eficiência econômica = receita ÷ custo)?","a":"Auftrag 3 ist mit einer Wirtschaftlichkeit von 52.000 ÷ 40.000 = 1,3 am wirtschaftlichsten (Auftrag 1: 1,2; Auftrag 2: 1,25; Auftrag 4: 1,24).","aPt":"O Pedido 3 é o mais econômico, com eficiência de 52.000 ÷ 40.000 = 1,3 (Pedido 1: 1,2; Pedido 2: 1,25; Pedido 4: 1,24).","options":[{"text":"Auftrag 3","textPt":"Pedido 3","correct":true},{"text":"Auftrag 1","textPt":"Pedido 1","correct":false},{"text":"Auftrag 2","textPt":"Pedido 2","correct":false},{"text":"Auftrag 4","textPt":"Pedido 4","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Sachs-IT GmbH hat die Bätje GmbH gekauft und betreibt diese unter Beibehaltung der eigenen Firma weiter. Um welche Form eines Unternehmenszusammenschlusses handelt es sich?","qPt":"A Sachs-IT GmbH comprou a Bätje GmbH e continua operando-a mantendo o próprio nome empresarial. Que forma de fusão/aliança de empresas é essa?","a":"Es handelt sich um einen Konzern, da die rechtliche Selbstständigkeit der beiden GmbHs erhalten bleibt, während sie wirtschaftlich unter einheitlicher Leitung stehen.","aPt":"Trata-se de um grupo empresarial (Konzern), pois a independência jurídica das duas GmbHs é mantida, mesmo estando economicamente sob direção única.","options":[{"text":"Konzern","textPt":"Konzern (grupo empresarial)","correct":true},{"text":"Fusion","textPt":"Fusão","correct":false},{"text":"Kartell","textPt":"Cartel","correct":false},{"text":"Interessengemeinschaft","textPt":"Comunidade de interesses","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Das Leitungssystem der Sachs-IT GmbH zeigt, dass z. B. die Abteilung 'PC' sowohl dem Bereich Einkauf als auch den Bereichen Produktion und Absatz unterstellt ist (mehrere Weisungslinien je Stelle). Nach welchem Leitungssystem arbeitet die Sachs-IT GmbH?","qPt":"O organograma da Sachs-IT GmbH mostra que, por exemplo, o departamento 'PC' está subordinado tanto à área de Compras quanto às áreas de Produção e Vendas (várias linhas de comando por posição). Segundo qual sistema de gestão a Sachs-IT GmbH opera?","a":"Es handelt sich um ein Matrixsystem – eine überlappende Organisationsform, bei der mehrere Dimensionen (z. B. Funktion und Produkt) gemeinsam Weisungsbefugnis über dieselben Stellen haben.","aPt":"Trata-se de um sistema matricial — uma forma organizacional sobreposta em que várias dimensões (por exemplo, função e produto) compartilham autoridade sobre os mesmos cargos.","options":[{"text":"Matrixsystem","textPt":"Sistema matricial","correct":true},{"text":"Einliniensystem","textPt":"Sistema de linha única","correct":false},{"text":"Mehrliniensystem","textPt":"Sistema de múltiplas linhas","correct":false},{"text":"Stabliniensystem","textPt":"Sistema de linha e assessoria (staff-and-line)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Sachs-IT GmbH kauft Waren, die in weltweiter Arbeitsteilung hergestellt werden. Welche Auswirkung hat die weltweite Arbeitsteilung?","qPt":"A Sachs-IT GmbH compra mercadorias fabricadas com base na divisão internacional do trabalho. Qual é um efeito dessa divisão internacional do trabalho?","a":"Durch die Nutzung der jeweils wirtschaftlich günstigsten Rohstoff- und Produktionsbedingungen nimmt die Menge der weltweit transportierten Waren zu.","aPt":"Com o aproveitamento das condições mais vantajosas de matéria-prima e produção em cada país, aumenta a quantidade de mercadorias transportadas em escala mundial.","options":[{"text":"Durch Nutzung der jeweils wirtschaftlich günstigsten Rohstoff- und Produktionsbedingungen nimmt die Menge der transportierten Waren weltweit zu.","textPt":"Com o uso das condições mais vantajosas de matéria-prima e produção, aumenta a quantidade de mercadorias transportadas no mundo.","correct":true},{"text":"Die Produktion erfolgt jeweils in den Ländern mit den ökologisch besten Standards.","textPt":"A produção ocorre nos países com os melhores padrões ecológicos.","correct":false},{"text":"Die Volkswirtschaften der Länder spezialisieren sich nicht auf bestimmte Produktionen.","textPt":"As economias dos países não se especializam em produções específicas.","correct":false},{"text":"Auf dem weltweiten Arbeitsmarkt herrscht eine allgemeine Arbeitnehmerfreizügigkeit.","textPt":"Há livre circulação geral de trabalhadores no mercado de trabalho mundial.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welches Sicherheitskennzeichen bedeutet 'Warnung vor feuergefährlichen Stoffen'?","qPt":"Qual sinal de segurança significa 'Aviso de materiais inflamáveis'?","a":"Es ist das gelb-schwarze Warndreieck mit stilisierter Flamme – das allgemeine Warnzeichen für feuergefährliche Stoffe.","aPt":"É o triângulo de advertência amarelo e preto com uma chama estilizada — o sinal de advertência padrão para materiais inflamáveis.","options":[{"text":"Ein gelb-schwarzes Warndreieck mit einer stilisierten Flamme.","textPt":"Um triângulo amarelo e preto com uma chama estilizada.","correct":true},{"text":"Ein gelb-schwarzes Warndreieck mit einem Blitz-Symbol (Warnung vor elektrischer Spannung).","textPt":"Um triângulo amarelo e preto com um símbolo de raio (aviso de tensão elétrica).","correct":false},{"text":"Ein rotes quadratisches Zeichen mit einer Hand, die einen Alarmknopf drückt (manueller Brandmelder).","textPt":"Um sinal quadrado vermelho com uma mão pressionando um botão de alarme (acionador manual de incêndio).","correct":false},{"text":"Ein grünes quadratisches Zeichen mit einem Pfeil (Rettungsweg).","textPt":"Um sinal quadrado verde com uma seta (rota de fuga).","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welches Sicherheitskennzeichen bedeutet 'Gehäuse unter Spannung, nicht berühren'?","qPt":"Qual sinal de segurança significa 'Gabinete sob tensão, não tocar'?","a":"Es ist ein Verbotszeichen (weiß/rot/schwarz, runde Form) mit einem durchgestrichenen Blitzsymbol – es untersagt das Berühren spannungsführender Teile.","aPt":"É um sinal de proibição (branco/vermelho/preto, formato circular) com o símbolo de raio cortado — proíbe tocar em partes energizadas.","options":[{"text":"Ein rund-durchgestrichenes Verbotszeichen mit einem Blitz-Symbol.","textPt":"Um sinal circular de proibição com um símbolo de raio cortado.","correct":true},{"text":"Ein gelb-schwarzes Warndreieck mit einem Blitz-Symbol.","textPt":"Um triângulo amarelo e preto com um símbolo de raio.","correct":false},{"text":"Ein rotes quadratisches Zeichen mit einem Feuerlöscher.","textPt":"Um sinal quadrado vermelho com um extintor.","correct":false},{"text":"Ein grünes quadratisches Zeichen mit laufenden Personen.","textPt":"Um sinal quadrado verde com pessoas correndo.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welches Sicherheitskennzeichen bedeutet 'Manueller Brandmelder'?","qPt":"Qual sinal de segurança significa 'Acionador manual de incêndio'?","a":"Es ist ein rotes quadratisches Brandschutzzeichen mit einer Hand, die einen Alarmknopf drückt.","aPt":"É um sinal quadrado vermelho de proteção contra incêndio com uma mão pressionando um botão de alarme.","options":[{"text":"Ein rotes quadratisches Zeichen mit einer Hand, die einen Alarmknopf drückt.","textPt":"Um sinal quadrado vermelho com uma mão pressionando um botão de alarme.","correct":true},{"text":"Ein gelb-schwarzes Warndreieck mit einer Flamme.","textPt":"Um triângulo amarelo e preto com uma chama.","correct":false},{"text":"Ein grünes Zeichen mit einem Richtungspfeil.","textPt":"Um sinal verde com uma seta de direção.","correct":false},{"text":"Ein rund-durchgestrichenes Verbotszeichen.","textPt":"Um sinal circular de proibição cortado.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welches Sicherheitskennzeichen zeigt die Richtungsangabe eines Rettungsweges an?","qPt":"Qual sinal de segurança indica a direção de uma rota de fuga?","a":"Es ist ein grün-weißes Rettungszeichen in Form eines Pfeils, der die Fluchtrichtung angibt.","aPt":"É um sinal de salvamento verde e branco em forma de seta, indicando a direção da fuga.","options":[{"text":"Ein grünes quadratisches Zeichen mit einem Richtungspfeil.","textPt":"Um sinal quadrado verde com uma seta de direção.","correct":true},{"text":"Ein gelb-schwarzes Warndreieck.","textPt":"Um triângulo amarelo e preto.","correct":false},{"text":"Ein rotes Zeichen mit einem Feuerlöscher.","textPt":"Um sinal vermelho com um extintor.","correct":false},{"text":"Ein rund-durchgestrichenes Verbotszeichen.","textPt":"Um sinal circular de proibição cortado.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Mitarbeitenden der Sachs-IT GmbH müssen Unfallverhütungsvorschriften kennen und einhalten. Welche Aussage trifft auf die Informationspflicht über Unfallverhütungsvorschriften zu?","qPt":"Os funcionários da Sachs-IT GmbH precisam conhecer e seguir as normas de prevenção de acidentes. Qual afirmação sobre o dever de informar sobre essas normas é correta?","a":"Die Sachs-IT GmbH muss die Unfallverhütungsvorschriften im Betrieb gut sichtbar aushängen, damit alle Mitarbeitenden sie jederzeit einsehen können.","aPt":"A Sachs-IT GmbH deve afixar as normas de prevenção de acidentes em local bem visível na empresa, para que todos os funcionários possam consultá-las a qualquer momento.","options":[{"text":"Die Sachs-IT GmbH muss die Unfallverhütungsvorschriften im Betrieb gut sichtbar aushängen.","textPt":"A empresa deve afixar as normas de prevenção de acidentes em local bem visível.","correct":true},{"text":"Die Sachs-IT GmbH muss ihre Mitarbeiter zu Beginn ihrer Tätigkeit einmal mündlich informieren.","textPt":"A empresa deve informar verbalmente os funcionários apenas uma vez, no início do trabalho.","correct":false},{"text":"Die Sachs-IT GmbH muss jeden neuen Mitarbeiter zu einer Informationsveranstaltung bei der Berufsgenossenschaft anmelden.","textPt":"A empresa deve inscrever cada novo funcionário em um evento informativo na associação profissional (Berufsgenossenschaft).","correct":false},{"text":"Die Sachs-IT GmbH muss ihre Mitarbeiter schriftlich informieren, dass sie die Vorschriften bei der Berufsgenossenschaft einsehen können.","textPt":"A empresa deve informar por escrito que as normas podem ser consultadas na associação profissional.","correct":false}]},
