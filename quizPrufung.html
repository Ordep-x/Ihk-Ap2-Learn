{"cat":"wiso","sub":"pruefung","q":"Nach einer Kündigung erhält Frau Fürst von der Korok-IT GmbH ein Arbeitszeugnis, mit dem sie nicht einverstanden ist. Sie strebt eine gerichtliche Klärung an. An welches der folgenden Gerichte muss sich Frau Fürst wenden?","qPt":"Após uma demissão, a Sra. Fürst recebe da Korok-IT GmbH uma carta de referência (Arbeitszeugnis) com a qual não concorda. Ela quer buscar uma solução judicial. A qual dos seguintes tribunais a Sra. Fürst deve recorrer?","a":"Für Streitigkeiten aus dem Arbeitsverhältnis, wie z. B. über den Inhalt eines Arbeitszeugnisses, ist das Arbeitsgericht zuständig.","aPt":"Para litígios decorrentes da relação de trabalho, como disputas sobre o conteúdo de uma carta de referência, o tribunal competente é o tribunal do trabalho (Arbeitsgericht).","options":[{"text":"Arbeitsgericht","textPt":"Tribunal do trabalho","correct":true},{"text":"Verwaltungsgericht","textPt":"Tribunal administrativo","correct":false},{"text":"Amtsgericht","textPt":"Tribunal de primeira instância (Amtsgericht)","correct":false},{"text":"Sozialgericht","textPt":"Tribunal de assuntos sociais","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ein Mitbewerber der Korok-IT GmbH, die Grothe AG, bietet Dienstleistungen für IT-Unternehmen an. Welchem Wirtschaftssektor gehört die Grothe AG an?","qPt":"Um concorrente da Korok-IT GmbH, a Grothe AG, oferece serviços para empresas de TI. A qual setor econômico pertence a Grothe AG?","a":"Unternehmen, die Dienstleistungen anbieten, gehören zum tertiären Sektor (Dienstleistungssektor), im Unterschied zum primären Sektor (Urproduktion, z. B. Landwirtschaft) und zum sekundären Sektor (verarbeitendes Gewerbe/Industrie).","aPt":"Empresas que oferecem serviços pertencem ao setor terciário (setor de serviços), diferentemente do setor primário (produção primária, como agricultura) e do setor secundário (indústria/manufatura).","options":[{"text":"Primärer Sektor","textPt":"Setor primário","correct":false},{"text":"Sekundärer Sektor","textPt":"Setor secundário","correct":false},{"text":"Tertiärer Sektor","textPt":"Setor terciário","correct":true},{"text":"Es handelt sich um keinen der drei Wirtschaftssektoren.","textPt":"Não se enquadra em nenhum dos três setores econômicos.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Grothe AG ist ein börsennotiertes Unternehmen, dessen Aktionäre Privatpersonen sind, die Dividenden erwarten. Welches der folgenden Ziele verfolgt die Grothe AG vorrangig?","qPt":"A Grothe AG é uma empresa de capital aberto cujos acionistas são pessoas físicas que esperam receber dividendos. Qual dos seguintes objetivos a Grothe AG persegue prioritariamente?","a":"Als erwerbswirtschaftliches, börsennotiertes Unternehmen mit gewinnorientierten Aktionären verfolgt die Grothe AG vorrangig das Ziel der Gewinnmaximierung.","aPt":"Como empresa com fins lucrativos e de capital aberto, cujos acionistas visam lucro, a Grothe AG persegue prioritariamente a maximização do lucro.","options":[{"text":"der Kundenzufriedenheit.","textPt":"a satisfação dos clientes.","correct":false},{"text":"der bestmöglichen Versorgung der Bevölkerung.","textPt":"o melhor abastecimento possível da população.","correct":false},{"text":"der Gewinnmaximierung.","textPt":"a maximização do lucro.","correct":true},{"text":"der Bilanzverlängerung.","textPt":"a expansão do balanço patrimonial.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Grothe AG hat einen weiten Kundenkreis, darunter die Bätje GmbH, die Von Lente AG, die Grabau OHG und die Bamann eG. Bei welchem dieser Unternehmen haften alle Gesellschafter mit ihrem Privatvermögen und ihrer Einlage?","qPt":"A Grothe AG tem uma ampla carteira de clientes, entre eles a Bätje GmbH, a Von Lente AG, a Grabau OHG e a Bamann eG. Em qual dessas empresas todos os sócios respondem com seu patrimônio pessoal e com sua participação?","a":"In einer offenen Handelsgesellschaft (OHG) haften alle Gesellschafter unbeschränkt und gesamtschuldnerisch mit ihrem gesamten Privatvermögen für die Verbindlichkeiten der Gesellschaft.","aPt":"Numa sociedade em nome coletivo (OHG), todos os sócios respondem de forma ilimitada e solidária, com todo o seu patrimônio pessoal, pelas dívidas da sociedade.","options":[{"text":"Grabau OHG","textPt":"Grabau OHG","correct":true},{"text":"Bätje GmbH","textPt":"Bätje GmbH","correct":false},{"text":"Von Lente AG","textPt":"Von Lente AG","correct":false},{"text":"Bamann eG","textPt":"Bamann eG","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Von den Kunden der Grothe AG (Bätje GmbH, Von Lente AG, Grabau OHG, Bamann eG): Bei welchem Unternehmen können die Unternehmensanteile an der Börse gehandelt werden?","qPt":"Entre os clientes da Grothe AG (Bätje GmbH, Von Lente AG, Grabau OHG, Bamann eG): em qual empresa as participações podem ser negociadas em bolsa de valores?","a":"Nur Aktiengesellschaften (AG) können an der Börse notiert sein; ihre Anteile (Aktien) sind frei handelbar. Die Von Lente AG ist hier das einzige Unternehmen in dieser Rechtsform.","aPt":"Somente sociedades anônimas (AG) podem ter capital aberto em bolsa; suas participações (ações) são livremente negociáveis. A Von Lente AG é a única empresa nessa forma jurídica aqui.","options":[{"text":"Von Lente AG","textPt":"Von Lente AG","correct":true},{"text":"Bätje GmbH","textPt":"Bätje GmbH","correct":false},{"text":"Grabau OHG","textPt":"Grabau OHG","correct":false},{"text":"Bamann eG","textPt":"Bamann eG","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Von den Kunden der Grothe AG (Bätje GmbH, Von Lente AG, Grabau OHG, Bamann eG): Bei welchem Unternehmen haben die Gesellschafter Stimmrecht in der Gesellschafterversammlung?","qPt":"Entre os clientes da Grothe AG (Bätje GmbH, Von Lente AG, Grabau OHG, Bamann eG): em qual empresa os sócios têm direito de voto na assembleia de sócios (Gesellschafterversammlung)?","a":"Das zuständige Beschlussorgan einer GmbH, in dem die Gesellschafter Stimmrecht haben, ist die Gesellschafterversammlung – im Unterschied zur AG, deren oberstes Organ die Hauptversammlung der Aktionäre ist.","aPt":"O órgão deliberativo de uma GmbH, no qual os sócios têm direito de voto, é a assembleia de sócios (Gesellschafterversammlung) — diferente da AG, cujo órgão máximo é a assembleia geral de acionistas.","options":[{"text":"Bätje GmbH","textPt":"Bätje GmbH","correct":true},{"text":"Von Lente AG","textPt":"Von Lente AG","correct":false},{"text":"Grabau OHG","textPt":"Grabau OHG","correct":false},{"text":"Bamann eG","textPt":"Bamann eG","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Von den Kunden der Grothe AG (Bätje GmbH, Von Lente AG, Grabau OHG, Bamann eG): Welches Unternehmen ist in das örtliche Genossenschaftsregister eingetragen?","qPt":"Entre os clientes da Grothe AG (Bätje GmbH, Von Lente AG, Grabau OHG, Bamann eG): qual empresa está inscrita no registro local de cooperativas (Genossenschaftsregister)?","a":"Eine eingetragene Genossenschaft (eG) wird im Genossenschaftsregister geführt, nicht im Handelsregister wie Kapital- oder Personengesellschaften.","aPt":"Uma cooperativa registrada (eG) é inscrita no registro de cooperativas, e não no registro comercial, como ocorre com sociedades de capital ou sociedades de pessoas.","options":[{"text":"Bamann eG","textPt":"Bamann eG","correct":true},{"text":"Bätje GmbH","textPt":"Bätje GmbH","correct":false},{"text":"Von Lente AG","textPt":"Von Lente AG","correct":false},{"text":"Grabau OHG","textPt":"Grabau OHG","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Von den Kunden der Grothe AG (Bätje GmbH, Von Lente AG, Grabau OHG, Bamann eG): Bei welchem Unternehmen beträgt das Stammkapital mindestens 25.000 EUR?","qPt":"Entre os clientes da Grothe AG (Bätje GmbH, Von Lente AG, Grabau OHG, Bamann eG): em qual empresa o capital social é de no mínimo 25.000 EUR?","a":"Das gesetzliche Mindeststammkapital einer GmbH beträgt 25.000 EUR (§ 5 GmbHG). Personengesellschaften wie die OHG und Genossenschaften wie die eG kennen dagegen kein gesetzliches Mindestkapital in dieser Höhe.","aPt":"O capital social mínimo legal de uma GmbH é de 25.000 EUR (§ 5 da Lei da GmbH). Já sociedades de pessoas como a OHG e cooperativas como a eG não têm um capital mínimo legal nesse valor.","options":[{"text":"Bätje GmbH","textPt":"Bätje GmbH","correct":true},{"text":"Grabau OHG","textPt":"Grabau OHG","correct":false},{"text":"Von Lente AG","textPt":"Von Lente AG","correct":false},{"text":"Bamann eG","textPt":"Bamann eG","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Der Umweltschutz liegt im Interesse der Allgemeinheit. Welchen der folgenden Grundsätze bei der Verwendung von Verpackung sollte die Korok-IT GmbH daher berücksichtigen?","qPt":"A proteção ambiental está no interesse da coletividade. Qual dos seguintes princípios no uso de embalagens a Korok-IT GmbH deveria, portanto, considerar?","a":"Nach der Abfallhierarchie steht die Vermeidung von Abfall an erster Stelle – noch vor Wiederverwendung, Recycling und Entsorgung. Unnötige Verpackungen zu vermeiden ist daher stets besser, als sie anschließend zu entsorgen oder zu recyceln.","aPt":"Segundo a hierarquia de resíduos, a prevenção de resíduos vem em primeiro lugar — antes da reutilização, da reciclagem e do descarte. Evitar embalagens desnecessárias é, portanto, sempre melhor do que descartá-las ou reciclá-las depois.","options":[{"text":"Papierverpackungen sind immer umweltfreundlich.","textPt":"Embalagens de papel são sempre ecológicas.","correct":false},{"text":"Vermeidung unnötiger Verpackung ist besser als ihre Entsorgung.","textPt":"Evitar embalagens desnecessárias é melhor do que descartá-las.","correct":true},{"text":"Recycelte Plastikverpackungen sind immer umweltfreundlich.","textPt":"Embalagens de plástico reciclado são sempre ecológicas.","correct":false},{"text":"Jede Verpackung muss nach dem Gebrauch grob gereinigt in den Restmüll gegeben werden.","textPt":"Toda embalagem deve ser levemente limpa e descartada no lixo comum após o uso.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Korok-IT GmbH verwendet Kopierpapier mit dem Umweltzeichen 'Blauer Engel'. Wie unterstützt die Korok-IT GmbH mit der Verwendung dieses Kopierpapiers den Umweltschutz?","qPt":"A Korok-IT GmbH usa papel de impressão com o selo ambiental alemão 'Blauer Engel'. Como a Korok-IT GmbH contribui para a proteção ambiental ao usar esse papel?","a":"Das Umweltzeichen 'Blauer Engel' kennzeichnet unter anderem Recyclingpapier, das aus Altpapier statt aus Frischfasern (Holz) hergestellt wird. Dadurch werden Rohstoffe für die Papiererzeugung eingespart.","aPt":"O selo ambiental 'Blauer Engel' identifica, entre outros produtos, papel reciclado, feito de papel usado em vez de fibras novas (madeira). Com isso, economizam-se matérias-primas para a produção de papel.","options":[{"text":"Reduzierung des Kopierpapierverbrauchs bei der Korok-IT GmbH","textPt":"Redução do consumo de papel de impressão na Korok-IT GmbH","correct":false},{"text":"Einsparung von Rohstoffen für die Papiererzeugung","textPt":"Economia de matérias-primas para a produção de papel","correct":true},{"text":"Reduzierung der Kosten für das Kopierpapier","textPt":"Redução dos custos com papel de impressão","correct":false},{"text":"Bessere Qualität des Kopierpapiers","textPt":"Melhor qualidade do papel de impressão","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Konjunktur in Deutschland befindet sich in einer Rezession (Abschwung). An welchem der folgenden Merkmale lässt sich dies unter anderem erkennen?","qPt":"A economia alemã está em recessão (desaceleração). Em qual das seguintes características isso pode ser percebido, entre outras?","a":"In einer Rezession geht die gesamtwirtschaftliche Nachfrage zurück: Konsumenten geben weniger Geld aus, die Nachfrage nach Konsumgütern sinkt stark, was wiederum Produktion und Beschäftigung belastet.","aPt":"Numa recessão, a demanda geral da economia diminui: os consumidores gastam menos dinheiro, a demanda por bens de consumo cai fortemente, o que por sua vez prejudica a produção e o emprego.","options":[{"text":"Die Zahl der Arbeitslosen sinkt.","textPt":"O número de desempregados diminui.","correct":false},{"text":"Die Tarifparteien einigen sich auf deutlich höhere Löhne.","textPt":"As partes das convenções coletivas acordam salários bem mais altos.","correct":false},{"text":"Güternachfrage und Güterproduktion steigen.","textPt":"A demanda e a produção de bens aumentam.","correct":false},{"text":"Die Nachfrage nach Konsumgütern geht stark zurück.","textPt":"A demanda por bens de consumo cai fortemente.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Ein Fachinformatiker Systemintegration berät einen Kunden. Welchem der drei Wirtschaftssektoren (primär, sekundär, tertiär) wird diese Tätigkeit zugeordnet?","qPt":"Um Fachinformatiker de integração de sistemas presta consultoria a um cliente. A qual dos três setores econômicos (primário, secundário, terciário) essa atividade é atribuída?","a":"Beratungsleistungen sind Dienstleistungen und gehören daher zum tertiären Sektor.","aPt":"Serviços de consultoria são serviços e, por isso, pertencem ao setor terciário.","options":[{"text":"Primärer Sektor","textPt":"Setor primário","correct":false},{"text":"Sekundärer Sektor","textPt":"Setor secundário","correct":false},{"text":"Tertiärer Sektor","textPt":"Setor terciário","correct":true},{"text":"Keiner der drei Sektoren","textPt":"Nenhum dos três setores","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ein Winzer erntet Trauben im Weinberg. Welchem der drei Wirtschaftssektoren (primär, sekundär, tertiär) wird diese Tätigkeit zugeordnet?","qPt":"Um viticultor colhe uvas no vinhedo. A qual dos três setores econômicos (primário, secundário, terciário) essa atividade é atribuída?","a":"Die Gewinnung von Naturprodukten wie Trauben, also die Urproduktion in Land- und Forstwirtschaft, Fischerei und Bergbau, gehört zum primären Sektor.","aPt":"A extração de produtos naturais, como uvas — ou seja, a produção primária na agricultura, silvicultura, pesca e mineração — pertence ao setor primário.","options":[{"text":"Primärer Sektor","textPt":"Setor primário","correct":true},{"text":"Sekundärer Sektor","textPt":"Setor secundário","correct":false},{"text":"Tertiärer Sektor","textPt":"Setor terciário","correct":false},{"text":"Keiner der drei Sektoren","textPt":"Nenhum dos três setores","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ein Bäcker backt Brot. Welchem der drei Wirtschaftssektoren (primär, sekundär, tertiär) wird diese Tätigkeit zugeordnet?","qPt":"Um padeiro assa pão. A qual dos três setores econômicos (primário, secundário, terciário) essa atividade é atribuída?","a":"Die Be- und Verarbeitung von Rohstoffen zu fertigen Produkten, wie das Backen von Brot aus Mehl, gehört zum sekundären Sektor (verarbeitendes Gewerbe/Handwerk).","aPt":"O processamento de matérias-primas em produtos acabados, como assar pão a partir de farinha, pertence ao setor secundário (indústria/artesanato de transformação).","options":[{"text":"Sekundärer Sektor","textPt":"Setor secundário","correct":true},{"text":"Primärer Sektor","textPt":"Setor primário","correct":false},{"text":"Tertiärer Sektor","textPt":"Setor terciário","correct":false},{"text":"Keiner der drei Sektoren","textPt":"Nenhum dos três setores","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Davidson muss im Rahmen seiner Ausbildung Tätigkeiten verrichten, die nach seiner Meinung im betrieblichen Ausbildungsplan nicht vorgesehen sind. Er möchte sich an die für die betriebliche Ausbildung zuständige Stelle wenden. Welche der folgenden Stellen ist zuständig?","qPt":"No âmbito de sua formação, o Sr. Davidson precisa realizar tarefas que, na sua opinião, não estão previstas no plano de formação da empresa. Ele quer recorrer ao órgão responsável pela formação na empresa. Qual dos seguintes órgãos é o competente?","a":"Die Industrie- und Handelskammer (IHK) ist die für die betriebliche Berufsausbildung zuständige Stelle; sie überwacht die Durchführung der Ausbildung und ist Ansprechpartner bei Konflikten rund um den Ausbildungsplan.","aPt":"A câmara de indústria e comércio (IHK) é o órgão responsável pela formação profissional na empresa; ela fiscaliza a execução da formação e é o ponto de contato em conflitos relacionados ao plano de formação.","options":[{"text":"Berufsgenossenschaft","textPt":"Associação profissional (Berufsgenossenschaft)","correct":false},{"text":"Industrie- und Handelskammer","textPt":"Câmara de indústria e comércio","correct":true},{"text":"Gewerbeaufsichtsbehörde","textPt":"Órgão de fiscalização do trabalho (Gewerbeaufsichtsbehörde)","correct":false},{"text":"Berufsberatung","textPt":"Orientação profissional (Berufsberatung)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Korok-IT GmbH muss in ihren betrieblichen Abläufen das Allgemeine Gleichbehandlungsgesetz (AGG) beachten. Welche der folgenden Aussagen trifft auf das AGG zu?","qPt":"A Korok-IT GmbH deve observar a Lei Geral de Igualdade de Tratamento (AGG) em seus processos internos. Qual das seguintes afirmações sobre o AGG está correta?","a":"Das AGG verlangt, dass Stellen zwingend geschlechtsneutral ausgeschrieben werden, um eine Benachteiligung aufgrund des Geschlechts bereits bei der Stellenausschreibung zu vermeiden.","aPt":"A AGG exige que as vagas sejam obrigatoriamente anunciadas de forma neutra em relação ao gênero, para evitar discriminação por sexo já no anúncio da vaga.","options":[{"text":"Das AGG gilt nicht für Auszubildende.","textPt":"A AGG não se aplica a aprendizes/estagiários.","correct":false},{"text":"Bei Verstoß gegen das AGG hat der Betroffene keinen Anspruch auf Schadenersatz.","textPt":"Em caso de violação da AGG, o afetado não tem direito a indenização.","correct":false},{"text":"Das AGG erschwert die Einstellung von Arbeitnehmern aus Nicht-EU-Ländern.","textPt":"A AGG dificulta a contratação de trabalhadores de países fora da UE.","correct":false},{"text":"Stellen müssen zwingend geschlechtsneutral ausgeschrieben werden.","textPt":"As vagas devem ser obrigatoriamente anunciadas de forma neutra em relação ao gênero.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Korok-IT GmbH hat sich selbst Grundsätze und Regeln gegeben, die eine Bevorzugung einzelner Mitarbeiter aus sachfremden Gründen verhindern sollen. In welchem der folgenden Fälle wurden diese Regeln beachtet?","qPt":"A Korok-IT GmbH estabeleceu para si princípios e regras destinados a evitar que funcionários sejam favorecidos por motivos não relacionados ao mérito. Em qual dos seguintes casos essas regras foram respeitadas?","a":"Sandro Müller wird wegen fehlender fachlicher Qualifikation nicht ins Team aufgenommen – das ist ein sachlicher, leistungsbezogener Grund und stellt keine unzulässige Diskriminierung dar, anders als eine Benachteiligung aufgrund von Herkunft, Religion oder sexueller Orientierung.","aPt":"Sandro Müller não é admitido na equipe por falta de qualificação técnica — esse é um motivo objetivo, ligado ao mérito, e não constitui discriminação ilícita, ao contrário de um tratamento desfavorável por origem, religião ou orientação sexual.","options":[{"text":"Conny Toyson wurde eingestellt, weil sie die Nichte des Geschäftsführers ist.","textPt":"Conny Toyson foi contratada porque é sobrinha do diretor.","correct":false},{"text":"Andreas Brandtner wurde nicht ins Team aufgenommen, weil er offen homosexuell lebt.","textPt":"Andreas Brandtner não foi admitido na equipe porque vive abertamente sua homossexualidade.","correct":false},{"text":"Sandro Müller wurde wegen fehlender Qualifikation nicht ins Team aufgenommen.","textPt":"Sandro Müller não foi admitido na equipe por falta de qualificação.","correct":true},{"text":"Angelika Corleone wird bei einer internen Stellenausschreibung nicht berücksichtigt, weil sie gläubige Muslima ist.","textPt":"Angelika Corleone não é considerada numa vaga interna porque é muçulmana praticante.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Sabine Medstein hat sich nach erfolgreichem Abschluss ihrer Berufsausbildung zur Fachinformatikerin Anwendungsentwicklung bei der Ecotec GmbH beworben und soll zum 1. Oktober eingestellt werden. In welcher Reihenfolge laufen die folgenden Schritte bei ihrer Einstellung typischerweise ab?","qPt":"Depois de concluir com sucesso sua formação como Fachinformatikerin de desenvolvimento de aplicações, Sabine Medstein se candidatou a uma vaga na Ecotec GmbH e deve ser contratada em 1º de outubro. Em qual ordem ocorrem normalmente as seguintes etapas de sua contratação?","a":"Zunächst reicht die Bewerberin die digitale Bewerbung ein, danach folgt das Vorstellungsgespräch. Erst danach wird der Arbeitsvertrag geschlossen, gefolgt vom ersten Arbeitstag. Die erste Vergütung wird nach Ablauf des ersten Arbeitsmonats überwiesen, und die Probezeit endet erst einige Monate nach Beginn der Beschäftigung.","aPt":"Primeiro a candidata envia a candidatura digital, depois ocorre a entrevista de emprego. Só então o contrato de trabalho é firmado, seguido pelo primeiro dia de trabalho. A primeira remuneração é paga após o primeiro mês de trabalho, e o período de experiência só termina alguns meses após o início do vínculo.","options":[{"text":"Digitale Bewerbung → Vorstellungsgespräch → Abschluss des Arbeitsvertrages → Erster Arbeitstag → Überweisung der ersten Vergütung → Ende der Probezeit","textPt":"Candidatura digital → entrevista → assinatura do contrato → primeiro dia de trabalho → pagamento da primeira remuneração → fim do período de experiência","correct":true},{"text":"Vorstellungsgespräch → Digitale Bewerbung → Erster Arbeitstag → Abschluss des Arbeitsvertrages → Ende der Probezeit → Überweisung der ersten Vergütung","textPt":"Entrevista → candidatura digital → primeiro dia de trabalho → assinatura do contrato → fim do período de experiência → pagamento da primeira remuneração","correct":false},{"text":"Digitale Bewerbung → Abschluss des Arbeitsvertrages → Vorstellungsgespräch → Erster Arbeitstag → Ende der Probezeit → Überweisung der ersten Vergütung","textPt":"Candidatura digital → assinatura do contrato → entrevista → primeiro dia de trabalho → fim do período de experiência → pagamento da primeira remuneração","correct":false},{"text":"Vorstellungsgespräch → Digitale Bewerbung → Abschluss des Arbeitsvertrages → Ende der Probezeit → Erster Arbeitstag → Überweisung der ersten Vergütung","textPt":"Entrevista → candidatura digital → assinatura do contrato → fim do período de experiência → primeiro dia de trabalho → pagamento da primeira remuneração","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Medstein hatte auch ein Vorstellungsgespräch bei der Leuchtturm-IT GmbH. Welche der folgenden Fragen ist in einem solchen Gespräch unzulässig?","qPt":"A Sra. Medstein também teve uma entrevista de emprego na Leuchtturm-IT GmbH. Qual das seguintes perguntas é inadmissível nesse tipo de entrevista?","a":"Die Frage nach der Gewerkschaftsmitgliedschaft greift in die durch Art. 9 GG geschützte Koalitionsfreiheit ein und ist in einem Vorstellungsgespräch unzulässig. Fragen nach Qualifikation, Schulbildung oder bisheriger Tätigkeit sind dagegen zulässig, da sie unmittelbar mit der angestrebten Stelle zusammenhängen.","aPt":"A pergunta sobre filiação sindical viola a liberdade de associação protegida pelo artigo 9 da Constituição alemã e é inadmissível numa entrevista de emprego. Já perguntas sobre qualificação, formação escolar ou atividade anterior são admissíveis, pois estão diretamente relacionadas à vaga pretendida.","options":[{"text":"Die Frage nach der Mitgliedschaft bei einer Gewerkschaft.","textPt":"A pergunta sobre filiação a um sindicato.","correct":true},{"text":"Die Frage nach den Zusatzqualifikationen.","textPt":"A pergunta sobre qualificações adicionais.","correct":false},{"text":"Die Frage nach der Schulbildung.","textPt":"A pergunta sobre a formação escolar.","correct":false},{"text":"Die Frage nach den Vorbeschäftigungen und der letzten Tätigkeit.","textPt":"A pergunta sobre empregos anteriores e a última atividade exercida.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche der folgenden Unterlagen muss Frau Medstein ihrem neuen Arbeitgeber, der Ecotec GmbH, auf Anforderung zukommen lassen?","qPt":"Qual dos seguintes documentos a Sra. Medstein deve enviar ao seu novo empregador, a Ecotec GmbH, quando solicitado?","a":"Der Arbeitgeber benötigt für die Lohnabrechnung u. a. die steuerliche Identifikationsnummer der Arbeitnehmerin, um die Lohnsteuer korrekt an das Finanzamt abzuführen. Rein private Versicherungsnachweise oder die Geburtsurkunde muss sie dem Arbeitgeber dagegen nicht vorlegen.","aPt":"Para a folha de pagamento, o empregador precisa, entre outros dados, do número de identificação fiscal da funcionária, para recolher corretamente o imposto de renda retido na fonte. Já comprovantes de seguros particulares ou a certidão de nascimento não precisam ser entregues ao empregador.","options":[{"text":"Nachweis über die private Unfallversicherung","textPt":"Comprovante de seguro privado contra acidentes","correct":false},{"text":"Geburtsurkunde","textPt":"Certidão de nascimento","correct":false},{"text":"Steuerliche Identifikationsnummer (IdNr/TIN/eTIN)","textPt":"Número de identificação fiscal (IdNr/TIN/eTIN)","correct":true},{"text":"Nachweis über private Krankenzusatzversicherung","textPt":"Comprovante de seguro-saúde complementar privado","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Medstein erhält für November 2023 folgende Abrechnung: Stundenlohn 15,80 EUR, im Monat 170 Stunden gearbeitet, davon zwölf Stunden an Samstagen mit einem Zuschlag von 30 % auf den Stundenlohn, zusätzlich eine freiwillige Sonderzahlung als Urlaubsgeld in Höhe von 250,00 EUR brutto. Wie hoch ist ihr Bruttolohn für November 2023?","qPt":"A Sra. Medstein recebe o seguinte cálculo para novembro de 2023: salário-hora de 15,80 EUR, 170 horas trabalhadas no mês, das quais doze horas aos sábados com adicional de 30% sobre o salário-hora, além de um pagamento extra voluntário de auxílio-férias (Urlaubsgeld) de 250,00 EUR brutos. Qual é seu salário bruto de novembro de 2023?","a":"158 reguläre Stunden × 15,80 EUR = 2.496,40 EUR, zuzüglich 12 Stunden × (15,80 EUR × 1,3) = 246,48 EUR für die Samstagsarbeit, zuzüglich 250,00 EUR Urlaubsgeld ergibt einen Bruttolohn von 2.992,88 EUR.","aPt":"158 horas normais × 15,80 EUR = 2.496,40 EUR, mais 12 horas × (15,80 EUR × 1,3) = 246,48 EUR pelo trabalho de sábado, mais 250,00 EUR de auxílio-férias, resulta em um salário bruto de 2.992,88 EUR.","options":[{"text":"2.686,00 EUR","textPt":"2.686,00 EUR","correct":false},{"text":"2.742,48 EUR","textPt":"2.742,48 EUR","correct":false},{"text":"2.992,88 EUR","textPt":"2.992,88 EUR","correct":true},{"text":"3.242,88 EUR","textPt":"3.242,88 EUR","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Medsteins Bruttolohn für November 2023 beträgt 2.992,88 EUR. Wie hoch ist ihr Arbeitnehmeranteil zur gesetzlichen Rentenversicherung (Beitragssatz 2023: 18,6 %)?","qPt":"O salário bruto da Sra. Medstein em novembro de 2023 é de 2.992,88 EUR. Qual é sua contribuição (parte do empregado) ao seguro de aposentadoria legal (alíquota de 2023: 18,6%)?","a":"Der Arbeitnehmeranteil zur gesetzlichen Rentenversicherung beträgt die Hälfte des Beitragssatzes von 18,6 %, also 9,3 %, bezogen auf das gesamte sozialversicherungspflichtige Bruttoentgelt einschließlich Urlaubsgeld: 2.992,88 EUR × 9,3 % ≈ 278,34 EUR.","aPt":"A parte do empregado na contribuição ao seguro de aposentadoria legal corresponde à metade da alíquota de 18,6%, ou seja, 9,3%, calculada sobre todo o salário bruto sujeito a contribuições, incluindo o auxílio-férias: 2.992,88 EUR × 9,3% ≈ 278,34 EUR.","options":[{"text":"232,32 EUR","textPt":"232,32 EUR","correct":false},{"text":"278,34 EUR","textPt":"278,34 EUR","correct":true},{"text":"300,00 EUR","textPt":"300,00 EUR","correct":false},{"text":"556,68 EUR","textPt":"556,68 EUR","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Ecotec GmbH wird im Handelsregister geführt. Welche der folgenden Aussagen über das Handelsregister trifft zu?","qPt":"A Ecotec GmbH está inscrita no registro comercial (Handelsregister). Qual das seguintes afirmações sobre o registro comercial está correta?","a":"Das Handelsregister ist in zwei Abteilungen gegliedert: In Abteilung A werden Einzelkaufleute und Personengesellschaften (z. B. OHG, KG) geführt, in Abteilung B die Kapitalgesellschaften (z. B. GmbH, AG).","aPt":"O registro comercial se divide em duas seções: na seção A ficam os comerciantes individuais e as sociedades de pessoas (ex.: OHG, KG), e na seção B as sociedades de capital (ex.: GmbH, AG).","options":[{"text":"In der Abteilung A werden Großunternehmen, in Abteilung B alle anderen Unternehmen geführt.","textPt":"Na seção A ficam as grandes empresas, na seção B todas as demais.","correct":false},{"text":"Im Handelsregister werden nur Unternehmen geführt, die in Deutschland tätig sind.","textPt":"No registro comercial só constam empresas que atuam na Alemanha.","correct":false},{"text":"In Abteilung A werden die Personengesellschaften, in Abteilung B die Kapitalgesellschaften geführt.","textPt":"Na seção A ficam as sociedades de pessoas, na seção B as sociedades de capital.","correct":true},{"text":"Das Handelsregister wird von der zuständigen Handelskammer verwaltet.","textPt":"O registro comercial é administrado pela câmara de comércio competente.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Medstein soll die Aufgabe einer Sicherheitsbeauftragten in ihrer Abteilung übernehmen. An welche der folgenden für die Unfallverhütung zuständige Einrichtung muss sie sich wenden, um genauere Informationen zu diesem Thema zu erhalten?","qPt":"A Sra. Medstein deverá assumir a função de responsável pela segurança em seu departamento. A qual das seguintes entidades responsáveis pela prevenção de acidentes ela deve recorrer para obter informações mais detalhadas sobre o tema?","a":"Die Berufsgenossenschaften sind als Träger der gesetzlichen Unfallversicherung für die Unfallverhütung in den Betrieben zuständig und beraten Unternehmen und Sicherheitsbeauftragte zu Arbeitssicherheit und Unfallschutz.","aPt":"As Berufsgenossenschaften, como entidades responsáveis pelo seguro legal contra acidentes, cuidam da prevenção de acidentes nas empresas e orientam empresas e responsáveis pela segurança sobre segurança do trabalho e prevenção de acidentes.","options":[{"text":"Gewerbeaufsichtsbehörde","textPt":"Órgão de fiscalização do trabalho","correct":false},{"text":"Berufsgenossenschaft","textPt":"Associação profissional (Berufsgenossenschaft)","correct":true},{"text":"Deutscher Gewerkschaftsbund","textPt":"Confederação Alemã de Sindicatos","correct":false},{"text":"Industrie- und Handelskammer","textPt":"Câmara de indústria e comércio","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In der Ecotec GmbH soll ein neuer Betriebsrat gewählt werden. Insgesamt sind dort 61 Arbeitnehmer beschäftigt: 45 volljährige Mitarbeiter (ohne Auszubildende), 8 volljährige Auszubildende, 3 volljährige Leiharbeitnehmer, die seit einem Monat in der Ecotec GmbH eingesetzt sind, 3 jugendliche Auszubildende (16 Jahre) und 2 jugendliche Auszubildende (17 Jahre). Wie viele Mitarbeiter können insgesamt bei der Betriebsratswahl wählen?","qPt":"Um novo conselho de trabalhadores deve ser eleito na Ecotec GmbH. Ao todo há 61 funcionários: 45 maiores de idade (sem contar aprendizes), 8 aprendizes maiores de idade, 3 trabalhadores temporários maiores de idade, alocados na Ecotec GmbH há um mês, 3 aprendizes menores de idade (16 anos) e 2 aprendizes menores de idade (17 anos). Quantos funcionários ao todo podem votar na eleição do conselho de trabalhadores?","a":"Wahlberechtigt sind alle Arbeitnehmer des Betriebs ab dem vollendeten 16. Lebensjahr. Leiharbeitnehmer sind nur wahlberechtigt, wenn sie länger als drei Monate im Betrieb eingesetzt werden – die drei Leiharbeitnehmer scheiden hier also aus. Wahlberechtigt sind somit 45 + 8 + 3 + 2 = 58 Mitarbeiter.","aPt":"Têm direito de voto todos os funcionários da empresa a partir dos 16 anos completos. Trabalhadores temporários só têm direito de voto se estiverem alocados na empresa há mais de três meses — por isso os três temporários ficam de fora. Assim, 45 + 8 + 3 + 2 = 58 funcionários têm direito de voto.","options":[{"text":"53","textPt":"53","correct":false},{"text":"56","textPt":"56","correct":false},{"text":"58","textPt":"58","correct":true},{"text":"61","textPt":"61","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Betriebsratswahl soll zwei Monate nachdem Frau Medstein ihren neuen Arbeitsplatz bei der Ecotec GmbH angetreten hat, stattfinden. Welche der folgenden Aussagen über die Wählbarkeit von Frau Medstein trifft zu?","qPt":"A eleição do conselho de trabalhadores deve ocorrer dois meses depois de a Sra. Medstein ter iniciado seu novo emprego na Ecotec GmbH. Qual das seguintes afirmações sobre a elegibilidade da Sra. Medstein está correta?","a":"Wählbar ist nur, wer volljährig ist und mindestens sechs Monate dem Betrieb angehört (§ 8 BetrVG). Da Frau Medstein zum Zeitpunkt der Wahl erst zwei Monate im Betrieb ist, ist sie noch nicht wählbar.","aPt":"Só é elegível quem é maior de idade e pertence à empresa há pelo menos seis meses (§ 8 da Lei de Organização das Empresas). Como a Sra. Medstein está na empresa há apenas dois meses no momento da eleição, ela ainda não é elegível.","options":[{"text":"Sie ist wählbar, weil jeder Arbeitnehmer sofort bei Eintritt in den Betrieb wählbar ist.","textPt":"Ela é elegível, pois todo funcionário já é elegível assim que entra na empresa.","correct":false},{"text":"Sie ist wählbar, weil sie eine abgeschlossene Berufsausbildung hat.","textPt":"Ela é elegível porque tem formação profissional concluída.","correct":false},{"text":"Sie ist nicht wählbar, weil sie noch keine sechs Monate bei der Ecotec GmbH beschäftigt ist.","textPt":"Ela não é elegível porque ainda não está empregada na Ecotec GmbH há seis meses.","correct":true},{"text":"Sie ist nicht wählbar, weil sie kein Gewerkschaftsmitglied ist.","textPt":"Ela não é elegível porque não é filiada a um sindicato.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In der Ecotec GmbH wurde der Betriebsrat gewählt. Welche der folgenden Aussagen über die Wahl des Betriebsrats ist zutreffend?","qPt":"O conselho de trabalhadores da Ecotec GmbH foi eleito. Qual das seguintes afirmações sobre a eleição do conselho de trabalhadores está correta?","a":"Ein Betriebsrat wird regulär alle vier Jahre neu gewählt (§ 13 BetrVG); die Amtszeit beträgt somit vier Jahre, sofern keine vorzeitige Neuwahl erforderlich wird.","aPt":"Um conselho de trabalhadores é eleito regularmente a cada quatro anos (§ 13 da Lei de Organização das Empresas); o mandato é, portanto, de quatro anos, salvo necessidade de nova eleição antecipada.","options":[{"text":"Ein Betriebsrat muss alle vier Jahre neu gewählt werden.","textPt":"Um conselho de trabalhadores deve ser reeleito a cada quatro anos.","correct":true},{"text":"Ein Betriebsrat muss je zur Hälfte aus Arbeitnehmern und Arbeitnehmerinnen gebildet werden.","textPt":"Um conselho de trabalhadores deve ser formado por metade homens e metade mulheres.","correct":false},{"text":"In einen Betriebsrat können nur Arbeitnehmer gewählt werden, die mindestens eine zweijährige Betriebszugehörigkeit nachweisen können.","textPt":"Só podem ser eleitos para o conselho de trabalhadores funcionários com pelo menos dois anos de vínculo com a empresa.","correct":false},{"text":"Ein Betriebsrat muss in Kapitalgesellschaften mit mehr als 500 Mitarbeitern gewählt werden.","textPt":"Um conselho de trabalhadores só deve ser eleito em sociedades de capital com mais de 500 funcionários.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Geschäftsleitung der Ecotec GmbH arbeitet eng mit dem Betriebsrat zusammen. In welcher der folgenden Angelegenheiten hat der Betriebsrat laut Betriebsverfassungsgesetz ein Mitbestimmungsrecht?","qPt":"A diretoria da Ecotec GmbH trabalha em estreita colaboração com o conselho de trabalhadores. Em qual das seguintes questões o conselho de trabalhadores tem direito de cogestão segundo a Lei de Organização das Empresas?","a":"Nach § 87 Abs. 1 Nr. 6 BetrVG hat der Betriebsrat ein Mitbestimmungsrecht bei der Einführung und Anwendung technischer Überwachungseinrichtungen wie Kameras. Reine unternehmerische Entscheidungen wie Personalbedarfsplanung, Bau einer Lagerhalle oder Gründung einer Filiale sind dagegen mitbestimmungsfrei.","aPt":"Segundo o § 87, parágrafo 1, nº 6 da Lei de Organização das Empresas, o conselho de trabalhadores tem direito de cogestão na introdução e uso de dispositivos técnicos de vigilância, como câmeras. Já decisões puramente empresariais, como planejamento de pessoal, construção de um galpão ou abertura de uma filial, não exigem cogestão.","options":[{"text":"Einführung von Überwachungskameras im Warenlager","textPt":"Instalação de câmeras de vigilância no depósito","correct":true},{"text":"Planung des Personalbedarfs","textPt":"Planejamento da necessidade de pessoal","correct":false},{"text":"Errichtung einer neuen Lagerhalle","textPt":"Construção de um novo galpão","correct":false},{"text":"Gründung einer Filiale","textPt":"Abertura de uma filial","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Der 17-jährige Auszubildende Heiko Pateria zeigt Frau Medstein seinen Dienstplan. Nach § 11 JArbSchG dürfen Jugendliche nicht länger als viereinhalb Stunden hintereinander ohne Ruhepause beschäftigt werden. An welchem der folgenden Tage verstößt die Pausenregelung gegen das Gesetz?","qPt":"O aprendiz Heiko Pateria, 17 anos, mostra à Sra. Medstein sua escala de trabalho. Pelo § 11 da Lei de Proteção ao Trabalho de Jovens, menores não podem trabalhar mais de quatro horas e meia seguidas sem pausa. Em qual dos seguintes dias o horário de pausa viola essa lei?","a":"Am Freitag beginnt die Arbeitszeit um 9:00 Uhr, die erste Pause jedoch erst um 14:00 Uhr – das sind fünf Stunden am Stück ohne Pause. Nach § 11 Abs. 2 JArbSchG dürfen Jugendliche jedoch nicht länger als viereinhalb Stunden hintereinander ohne Ruhepause beschäftigt werden. An den anderen Tagen liegt die erste Pause jeweils innerhalb dieser 4,5-Stunden-Grenze.","aPt":"Na sexta-feira, o trabalho começa às 9h, mas a primeira pausa só ocorre às 14h — ou seja, cinco horas seguidas sem pausa. Segundo o § 11, parágrafo 2 da lei, menores não podem trabalhar mais de quatro horas e meia seguidas sem pausa. Nos demais dias, a primeira pausa ocorre dentro desse limite de 4,5 horas.","options":[{"text":"Montag: Arbeitszeit 08:00–15:00 Uhr, Beginn der ersten Pause um 11:30 Uhr","textPt":"Segunda-feira: horário 08:00–15:00, primeira pausa às 11:30","correct":false},{"text":"Dienstag: Arbeitszeit 09:00–17:00 Uhr, Beginn der ersten Pause um 12:00 Uhr","textPt":"Terça-feira: horário 09:00–17:00, primeira pausa às 12:00","correct":false},{"text":"Donnerstag: Arbeitszeit 09:30–17:00 Uhr, Beginn der ersten Pause um 13:00 Uhr","textPt":"Quinta-feira: horário 09:30–17:00, primeira pausa às 13:00","correct":false},{"text":"Freitag: Arbeitszeit 09:00–17:30 Uhr, Beginn der ersten Pause um 14:00 Uhr","textPt":"Sexta-feira: horário 09:00–17:30, primeira pausa às 14:00","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Ausbildungsleiterin der Ecotec GmbH, Sandra Wilke, schlägt vor, dass Frau Medstein mittelfristig als Ausbilderin arbeiten soll. Welche der folgenden Voraussetzungen muss ein Ausbilder nach den gesetzlichen Regelungen unter anderem erfüllen?","qPt":"A diretora de formação da Ecotec GmbH, Sandra Wilke, sugere que a Sra. Medstein trabalhe a médio prazo como instrutora de formação. Qual dos seguintes requisitos um instrutor deve, entre outros, cumprir segundo a lei?","a":"Ein Ausbilder muss nach dem Berufsbildungsgesetz über die notwendige persönliche und fachliche Eignung verfügen (u. a. nachgewiesen durch die Ausbildereignungsprüfung), nicht Mitglied des Prüfungsausschusses oder der Geschäftsleitung sein.","aPt":"Segundo a Lei de Formação Profissional, um instrutor deve possuir a aptidão pessoal e técnica necessária (comprovada, entre outras formas, pelo exame de habilitação para instrutores), não sendo exigido que seja membro da comissão examinadora ou da diretoria.","options":[{"text":"Mitglied im zuständigen Prüfungsausschuss sein","textPt":"Ser membro da comissão examinadora competente","correct":false},{"text":"Über eine notwendige persönliche und fachliche Eignung verfügen","textPt":"Possuir a necessária aptidão pessoal e técnica","correct":true},{"text":"Jährlich ein Weiterbildungsseminar der IHK besuchen","textPt":"Participar anualmente de um seminário de capacitação da câmara de comércio","correct":false},{"text":"Mitglied der Geschäftsleitung sein","textPt":"Ser membro da diretoria","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Sven Moritz, einem Mitarbeiter der Ecotec GmbH, wurde außerordentlich (fristlos) gekündigt. Welche der folgenden Ursachen rechtfertigt eine außerordentliche (fristlose) Kündigung?","qPt":"Sven Moritz, funcionário da Ecotec GmbH, foi demitido por justa causa (sem aviso prévio). Qual das seguintes causas justifica uma demissão por justa causa?","a":"Diebstahl von Eigentum des Arbeitgebers ist ein klassischer wichtiger Grund im Sinne des § 626 BGB, der eine außerordentliche fristlose Kündigung rechtfertigt, da das Vertrauensverhältnis dadurch schwerwiegend zerstört wird.","aPt":"O furto de patrimônio do empregador é um motivo grave clássico, nos termos do § 626 do BGB, que justifica a demissão por justa causa, pois destrói gravemente a relação de confiança.","options":[{"text":"Arbeitsmangel","textPt":"Falta de trabalho/serviço","correct":false},{"text":"Diebstahl von Eigentum der Ecotec GmbH","textPt":"Furto de patrimônio da Ecotec GmbH","correct":true},{"text":"Eintägiges unentschuldigtes Fehlen","textPt":"Uma falta injustificada de um dia","correct":false},{"text":"Unverschuldete Krankheit","textPt":"Doença sem culpa do funcionário","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der Ecotec GmbH wird unterschieden zwischen betriebsbedingter, personenbedingter und verhaltensbedingter Kündigung. Welchem dieser Kündigungsgründe ist folgender Fall zuzuordnen: Ein Mitarbeiter hat heimlich Kundendaten kopiert und an einen Konkurrenten der Ecotec GmbH weiterverkauft?","qPt":"Na Ecotec GmbH, distingue-se entre demissão por motivo operacional, por motivo pessoal e por motivo comportamental. A qual desses motivos de demissão se enquadra o seguinte caso: um funcionário copiou secretamente dados de clientes e os revendeu a um concorrente da Ecotec GmbH?","a":"Das heimliche Kopieren und Verkaufen von Kundendaten ist ein schwerwiegendes Fehlverhalten des Arbeitnehmers (Vertragsverletzung) und begründet damit eine verhaltensbedingte Kündigung.","aPt":"Copiar secretamente e vender dados de clientes é uma falta grave de conduta do funcionário (violação contratual) e, por isso, fundamenta uma demissão por motivo comportamental.","options":[{"text":"Betriebsbedingte Kündigung","textPt":"Demissão por motivo operacional","correct":false},{"text":"Personenbedingte Kündigung","textPt":"Demissão por motivo pessoal","correct":false},{"text":"Verhaltensbedingte Kündigung","textPt":"Demissão por motivo comportamental","correct":true},{"text":"Keine dieser Kündigungsarten, da hier gar keine Kündigung möglich ist.","textPt":"Nenhum desses tipos de demissão, pois aqui a demissão não seria possível.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der Ecotec GmbH wird unterschieden zwischen betriebsbedingter, personenbedingter und verhaltensbedingter Kündigung. Welchem dieser Kündigungsgründe ist folgender Fall zuzuordnen: Der Lohnbuchhalterin wird gekündigt, weil der Standort geschlossen und der Aufgabenbereich an das Steuerberatungsbüro der Ecotec GmbH abgegeben wird?","qPt":"Na Ecotec GmbH, distingue-se entre demissão por motivo operacional, por motivo pessoal e por motivo comportamental. A qual desses motivos se enquadra o seguinte caso: a contadora de folha de pagamento é demitida porque a filial é fechada e a área é transferida para o escritório de contabilidade da Ecotec GmbH?","a":"Fällt der Arbeitsplatz aufgrund einer unternehmerischen Entscheidung (hier: Standortschließung und Auslagerung) weg, handelt es sich um eine betriebsbedingte Kündigung – der Grund liegt also nicht in der Person oder im Verhalten der Arbeitnehmerin.","aPt":"Quando o posto de trabalho deixa de existir por uma decisão empresarial (neste caso: fechamento da filial e terceirização), trata-se de uma demissão por motivo operacional — o motivo não está, portanto, na pessoa ou no comportamento da funcionária.","options":[{"text":"Betriebsbedingte Kündigung","textPt":"Demissão por motivo operacional","correct":true},{"text":"Personenbedingte Kündigung","textPt":"Demissão por motivo pessoal","correct":false},{"text":"Verhaltensbedingte Kündigung","textPt":"Demissão por motivo comportamental","correct":false},{"text":"Außerordentliche fristlose Kündigung","textPt":"Demissão extraordinária por justa causa","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der Ecotec GmbH wird unterschieden zwischen betriebsbedingter, personenbedingter und verhaltensbedingter Kündigung. Welchem dieser Kündigungsgründe ist folgender Fall zuzuordnen: Ein Programmierer erfüllt nicht mehr die Anforderungen an seine Stelle, seine Arbeit ist häufig fehlerhaft, eine Fortbildung lehnt er ab?","qPt":"Na Ecotec GmbH, distingue-se entre demissão por motivo operacional, por motivo pessoal e por motivo comportamental. A qual desses motivos se enquadra o seguinte caso: um programador não atende mais aos requisitos do cargo, seu trabalho frequentemente contém erros e ele recusa capacitação?","a":"Kann ein Arbeitnehmer die geschuldete Leistung dauerhaft nicht mehr erbringen, ohne dass ihm ein Fehlverhalten vorzuwerfen ist (z. B. wegen fehlender, nicht nachholbarer Eignung), liegt eine personenbedingte Kündigung vor.","aPt":"Quando um funcionário deixa de conseguir entregar permanentemente o desempenho devido, sem que isso seja uma falta de conduta sua (por exemplo, por falta de aptidão que não pode ser suprida), trata-se de uma demissão por motivo pessoal.","options":[{"text":"Betriebsbedingte Kündigung","textPt":"Demissão por motivo operacional","correct":false},{"text":"Personenbedingte Kündigung","textPt":"Demissão por motivo pessoal","correct":true},{"text":"Verhaltensbedingte Kündigung","textPt":"Demissão por motivo comportamental","correct":false},{"text":"Außerordentliche fristlose Kündigung","textPt":"Demissão extraordinária por justa causa","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Freunde Robert Meyer und Julia Dango wollen ein IT-Serviceunternehmen gründen. Beide wollen gleichberechtigte Geschäftsführer sein, die Haftung soll sich auf das Gesellschaftsvermögen beschränken, und beide haben jeweils 20.000,00 EUR Eigenkapital einzubringen. Welche der folgenden Rechtsformen ist unter diesen Bedingungen geeignet?","qPt":"Os amigos Robert Meyer e Julia Dango querem fundar uma empresa de serviços de TI. Ambos querem ser diretores em igualdade de condições, a responsabilidade deve se limitar ao patrimônio da sociedade, e cada um tem 20.000,00 EUR de capital próprio a integralizar. Qual das seguintes formas jurídicas é adequada nessas condições?","a":"Zwei gleichberechtigte Geschäftsführer, auf das Gesellschaftsvermögen beschränkte Haftung und ein gemeinsames Stammkapital von 40.000,00 EUR (über der gesetzlichen Mindestgrenze von 25.000 EUR) entsprechen genau den Merkmalen einer GmbH.","aPt":"Dois diretores em igualdade de condições, responsabilidade limitada ao patrimônio da sociedade e um capital social conjunto de 40.000,00 EUR (acima do mínimo legal de 25.000 EUR) correspondem exatamente às características de uma GmbH.","options":[{"text":"AG","textPt":"AG (sociedade anônima)","correct":false},{"text":"KG","textPt":"KG (sociedade em comandita)","correct":false},{"text":"GmbH","textPt":"GmbH (sociedade limitada)","correct":true},{"text":"GbR","textPt":"GbR (sociedade civil simples)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Im ersten Geschäftsjahr erzielt das neu gegründete Unternehmen einen Gewinn von 3.140,00 EUR. Das eingesetzte Eigenkapital beträgt 40.000,00 EUR. Wie hoch ist die Eigenkapitalrentabilität?","qPt":"No primeiro ano de atividade, a empresa recém-fundada obtém um lucro de 3.140,00 EUR. O capital próprio empregado é de 40.000,00 EUR. Qual é a rentabilidade do capital próprio?","a":"Eigenkapitalrentabilität = Gewinn ÷ Eigenkapital × 100 = 3.140,00 EUR ÷ 40.000,00 EUR × 100 = 7,85 %.","aPt":"Rentabilidade do capital próprio = lucro ÷ capital próprio × 100 = 3.140,00 EUR ÷ 40.000,00 EUR × 100 = 7,85%.","options":[{"text":"3,14 %","textPt":"3,14 %","correct":false},{"text":"7,00 %","textPt":"7,00 %","correct":false},{"text":"7,85 %","textPt":"7,85 %","correct":true},{"text":"12,74 %","textPt":"12,74 %","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Meyer und Frau Dango haben Fragen bezüglich des gesetzlichen Kündigungsschutzes. Welche der folgenden Personengruppen genießt keinen besonderen Kündigungsschutz?","qPt":"O Sr. Meyer e a Sra. Dango têm dúvidas sobre a proteção legal contra demissão. Qual dos seguintes grupos de pessoas não goza de proteção especial contra demissão?","a":"Leitende Angestellte sind vom besonderen Kündigungsschutz weitgehend ausgenommen bzw. unterliegen Sonderregelungen, da sie arbeitgeberähnliche Funktionen wahrnehmen – anders als Betriebsratsmitglieder, Schwerbehinderte oder werdende Mütter, die ausdrücklich besonders geschützt sind.","aPt":"Os cargos de direção ficam, em grande parte, fora da proteção especial contra demissão ou sujeitos a regras próprias, pois exercem funções semelhantes às do empregador — diferentemente de membros do conselho de trabalhadores, pessoas com deficiência grave ou gestantes, que têm proteção especial explícita.","options":[{"text":"Betriebsratsmitglieder","textPt":"Membros do conselho de trabalhadores","correct":false},{"text":"Schwerbehinderte","textPt":"Pessoas com deficiência grave","correct":false},{"text":"Werdende Mütter","textPt":"Gestantes","correct":false},{"text":"Leitende Angestellte","textPt":"Cargos de direção (leitende Angestellte)","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Dango bringt nach einer Schwangerschaft ein gesundes Kind zur Welt. Wie viele Wochen Mutterschutz stehen ihr nach der Entbindung laut Mutterschutzgesetz im Regelfall zu?","qPt":"A Sra. Dango dá à luz uma criança saudável. Quantas semanas de licença-maternidade (Mutterschutz) ela tem direito, no caso regular, segundo a Lei de Proteção à Maternidade, após o parto?","a":"Nach dem Mutterschutzgesetz dürfen Mütter im Regelfall acht Wochen nach der Entbindung nicht beschäftigt werden (bei Mehrlings- oder Frühgeburten verlängert sich diese Frist auf zwölf Wochen).","aPt":"Segundo a Lei de Proteção à Maternidade, no caso regular, as mães não podem trabalhar durante oito semanas após o parto (em caso de partos múltiplos ou prematuros, esse prazo se estende a doze semanas).","options":[{"text":"6 Wochen","textPt":"6 semanas","correct":false},{"text":"8 Wochen","textPt":"8 semanas","correct":true},{"text":"10 Wochen","textPt":"10 semanas","correct":false},{"text":"12 Wochen","textPt":"12 semanas","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der Gründung des Unternehmens wurde von Herrn Meyer und Frau Dango die Rechtsform GmbH gewählt. Welche der folgenden Aussagen trifft auf eine GmbH zu?","qPt":"Na fundação da empresa, o Sr. Meyer e a Sra. Dango escolheram a forma jurídica GmbH. Qual das seguintes afirmações sobre uma GmbH está correta?","a":"Das gesetzliche Mindeststammkapital einer GmbH beträgt bei Gründung 25.000,00 EUR (§ 5 GmbHG).","aPt":"O capital social mínimo legal de uma GmbH, na fundação, é de 25.000,00 EUR (§ 5 da Lei da GmbH).","options":[{"text":"GmbH-Anteile werden an der Börse gehandelt.","textPt":"As participações da GmbH são negociadas em bolsa.","correct":false},{"text":"Das Stammkapital der GmbH muss bei Gründung mindestens 25.000 EUR betragen.","textPt":"O capital social da GmbH deve ser de no mínimo 25.000 EUR na fundação.","correct":true},{"text":"Alle Gesellschafter der GmbH sind jederzeit zur Geschäftsführung berechtigt.","textPt":"Todos os sócios da GmbH têm direito a administrar a empresa a qualquer momento.","correct":false},{"text":"Die Gesellschafter der GmbH haften für Verbindlichkeiten mit ihrem Privatvermögen.","textPt":"Os sócios da GmbH respondem pelas dívidas com seu patrimônio pessoal.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Für vier durchgeführte Aufträge des Unternehmens liegen folgende Zahlen vor: Auftrag 1: Aufwand 300.000 EUR, Ertrag 360.000 EUR; Auftrag 2: Aufwand 80.000 EUR, Ertrag 100.000 EUR; Auftrag 3: Aufwand 80.000 EUR, Ertrag 104.000 EUR; Auftrag 4: Aufwand 100.000 EUR, Ertrag 124.000 EUR. Welcher Auftrag wurde am wirtschaftlichsten abgewickelt?","qPt":"Para quatro pedidos executados pela empresa, há os seguintes números: Pedido 1: custo 300.000 EUR, receita 360.000 EUR; Pedido 2: custo 80.000 EUR, receita 100.000 EUR; Pedido 3: custo 80.000 EUR, receita 104.000 EUR; Pedido 4: custo 100.000 EUR, receita 124.000 EUR. Qual pedido foi executado de forma mais eficiente (econômica)?","a":"Wirtschaftlichkeit = Ertrag ÷ Aufwand. Auftrag 1: 1,20; Auftrag 2: 1,25; Auftrag 3: 1,30; Auftrag 4: 1,24. Auftrag 3 hat den höchsten Wert und wurde damit am wirtschaftlichsten abgewickelt.","aPt":"Eficiência econômica = receita ÷ custo. Pedido 1: 1,20; Pedido 2: 1,25; Pedido 3: 1,30; Pedido 4: 1,24. O Pedido 3 tem o maior valor e, portanto, foi o mais eficiente.","options":[{"text":"Auftrag 1","textPt":"Pedido 1","correct":false},{"text":"Auftrag 2","textPt":"Pedido 2","correct":false},{"text":"Auftrag 3","textPt":"Pedido 3","correct":true},{"text":"Auftrag 4","textPt":"Pedido 4","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Das Organigramm des neu gegründeten Unternehmens zeigt, dass jede nachgeordnete Stelle Linien zu mehreren übergeordneten Stellen hat, sodass sich die Verbindungslinien im Schema überkreuzen – jede Stelle hat also mehrere Vorgesetzte. Nach welchem der folgenden Leitungssysteme arbeitet das Unternehmen?","qPt":"O organograma da empresa recém-fundada mostra que cada posição subordinada tem linhas para várias posições superiores, de modo que as linhas de ligação se cruzam no esquema — ou seja, cada posição tem vários superiores. De acordo com qual dos seguintes sistemas de direção a empresa trabalha?","a":"Beim Mehrliniensystem (nach Taylor) erhält jede unterstellte Stelle Anweisungen von mehreren Vorgesetzten gleichzeitig, was sich im Organigramm durch sich überkreuzende Linien zeigt. Beim Einliniensystem hätte dagegen jede Stelle genau einen Vorgesetzten.","aPt":"No sistema multilinear (segundo Taylor), cada posição subordinada recebe ordens de vários superiores ao mesmo tempo, o que se mostra no organograma por linhas que se cruzam. Já no sistema unilinear, cada posição teria exatamente um único superior.","options":[{"text":"Einliniensystem","textPt":"Sistema unilinear","correct":false},{"text":"Matrixsystem","textPt":"Sistema matricial","correct":false},{"text":"Mehrliniensystem","textPt":"Sistema multilinear","correct":true},{"text":"Stabliniensystem","textPt":"Sistema de linha e assessoria (staff)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die finanzierende Bank erwartet von den beiden Existenzgründern Robert Meyer und Julia Dango die Vorlage eines Businessplanes. Welche der folgenden Aussagen über einen Businessplan trifft zu?","qPt":"O banco financiador espera que os dois empreendedores, Robert Meyer e Julia Dango, apresentem um plano de negócios. Qual das seguintes afirmações sobre um plano de negócios está correta?","a":"Im Businessplan werden unter anderem die strategischen Ziele eines Unternehmens dargelegt, neben Geschäftsidee, Markt- und Wettbewerbsanalyse, Marketing- und Finanzplanung. Er wird weder von der IHK ausgestellt noch im Handelsregister hinterlegt.","aPt":"No plano de negócios são apresentados, entre outros pontos, os objetivos estratégicos da empresa, além da ideia de negócio, análise de mercado e concorrência, e planejamento de marketing e financeiro. Ele não é emitido pela câmara de comércio nem registrado no registro comercial.","options":[{"text":"Der Businessplan wird von der zuständigen IHK ausgestellt, in dem das Unternehmen gegründet wird.","textPt":"O plano de negócios é emitido pela câmara de comércio competente onde a empresa é fundada.","correct":false},{"text":"Der Businessplan wird im Handelsregister hinterlegt.","textPt":"O plano de negócios é registrado no registro comercial.","correct":false},{"text":"Der Businessplan muss nur bei der Gründung von Kapitalgesellschaften erstellt werden.","textPt":"O plano de negócios só precisa ser elaborado na fundação de sociedades de capital.","correct":false},{"text":"Im Businessplan werden u. a. die strategischen Ziele eines Unternehmens festgelegt.","textPt":"No plano de negócios são definidos, entre outros pontos, os objetivos estratégicos da empresa.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Ecotec GmbH hat Probleme mit einem vermeintlichen Kartell. Welche der folgenden Aussagen trifft auf Kartelle zu?","qPt":"A Ecotec GmbH tem problemas com um suposto cartel. Qual das seguintes afirmações sobre cartéis está correta?","a":"Kartelle sind Absprachen zwischen rechtlich selbstständigen Unternehmen auf derselben Produktionsstufe (Wettbewerbern), mit dem Ziel, durch die Beschränkung des Wettbewerbs (z. B. über Preise, Mengen oder Gebiete) ihre wirtschaftliche Position zu stärken. Sie sind grundsätzlich kartellrechtlich verboten.","aPt":"Cartéis são acordos entre empresas juridicamente independentes no mesmo estágio de produção (concorrentes), com o objetivo de fortalecer sua posição econômica ao restringir a concorrência (por exemplo, por preços, quantidades ou territórios). Em regra, são proibidos pelo direito concorrencial.","options":[{"text":"Kartelle sind Absprachen auf gleicher Produktionsstufe, um durch Beschränkung des Wettbewerbs wirtschaftlich stärker zu sein.","textPt":"Cartéis são acordos no mesmo estágio de produção para se fortalecer economicamente restringindo a concorrência.","correct":true},{"text":"Kartelle schaffen günstigere Preise durch bessere Produktionsbedingungen.","textPt":"Cartéis geram preços mais baixos por meio de melhores condições de produção.","correct":false},{"text":"Kartelle sorgen für eine Sanierung des Betriebes durch eine innerbetriebliche Neuorganisation.","textPt":"Cartéis promovem a recuperação da empresa por meio de uma reorganização interna.","correct":false},{"text":"Kartelle sorgen für eine völlige Haftungsbeschränkung.","textPt":"Cartéis garantem uma limitação total de responsabilidade.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Der Tarifvertrag für die IT-Branche wurde fristgemäß gekündigt, es finden daraufhin Tarifverhandlungen statt. Welcher Verband vertritt dabei die Arbeitgeberseite beim Abschluss eines neuen Tarifvertrags?","qPt":"A convenção coletiva do setor de TI foi rescindida dentro do prazo, e as negociações coletivas são então realizadas. Qual associação representa o lado empregador na celebração de uma nova convenção coletiva?","a":"Auf Arbeitgeberseite wird ein Tarifvertrag von einem Arbeitgeberverband (oder einem einzelnen Arbeitgeber) abgeschlossen, auf Arbeitnehmerseite von der zuständigen Gewerkschaft. Industrie- und Handelskammer, Berufsgenossenschaft und Bundesagentur für Arbeit sind daran nicht beteiligt.","aPt":"Do lado empregador, uma convenção coletiva é celebrada por uma associação de empregadores (ou um único empregador), e do lado dos trabalhadores, pelo sindicato competente. A câmara de comércio, a associação profissional e a agência do trabalho não participam disso.","options":[{"text":"Arbeitgeberverband","textPt":"Associação de empregadores","correct":true},{"text":"Industrie- und Handelskammer","textPt":"Câmara de indústria e comércio","correct":false},{"text":"Berufsgenossenschaft","textPt":"Associação profissional (Berufsgenossenschaft)","correct":false},{"text":"Bundesagentur für Arbeit","textPt":"Agência Federal do Trabalho","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Tarifvertragsparteien haben das Recht, Löhne, Gehälter und andere Arbeitsbedingungen unter Beachtung der gesetzlichen Vorschriften selbstständig zu regeln. Welcher der folgenden Fachbegriffe beschreibt dieses Recht zutreffend?","qPt":"As partes das convenções coletivas têm o direito de regular de forma autônoma salários e outras condições de trabalho, respeitando as normas legais. Qual dos seguintes termos técnicos descreve corretamente esse direito?","a":"Dieses Recht wird als Tarifautonomie bezeichnet: Der Staat überlässt es den Tarifvertragsparteien (Gewerkschaften und Arbeitgeberverbänden/-gebern), Löhne und Arbeitsbedingungen eigenständig auszuhandeln, ohne direkte staatliche Einmischung.","aPt":"Esse direito é chamado de autonomia de negociação coletiva (Tarifautonomie): o Estado deixa que as partes das convenções (sindicatos e associações/empregadores) negociem de forma autônoma salários e condições de trabalho, sem interferência estatal direta.","options":[{"text":"Generationenvertrag","textPt":"Pacto entre gerações","correct":false},{"text":"Allgemeinverbindlichkeit","textPt":"Vinculação geral (Allgemeinverbindlichkeit)","correct":false},{"text":"Freizügigkeit","textPt":"Livre circulação","correct":false},{"text":"Tarifautonomie","textPt":"Autonomia de negociação coletiva","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Eine Tarifvertragspartei beabsichtigt, nach Ablauf der Laufzeit des Tarifvertrages die Löhne neu zu verhandeln. In welcher Reihenfolge laufen die folgenden Schritte ab, damit ein neuer Tarifvertrag zustande kommt?","qPt":"Uma das partes da convenção coletiva pretende renegociar os salários após o fim da vigência da convenção. Em qual ordem ocorrem as seguintes etapas até que uma nova convenção coletiva seja firmada?","a":"Zunächst kündigt eine Tarifvertragspartei den Tarifvertrag, danach beginnen die ersten Tarifverhandlungen. Erklärt eine Seite diese für gescheitert, kann die Gewerkschaft nach einer Urabstimmung zum Streik aufrufen. Bleibt auch das erfolglos, wird ein Schlichter angerufen; nimmt die Gegenseite dessen Empfehlung an, kommt der neue Tarifvertrag zustande.","aPt":"Primeiro, uma das partes rescinde a convenção coletiva, depois começam as primeiras negociações. Se um dos lados as declara fracassadas, o sindicato pode convocar greve após uma votação prévia. Se isso também não resolver, um mediador é chamado; se a outra parte aceitar a recomendação dele, a nova convenção coletiva é firmada.","options":[{"text":"Kündigung des Tarifvertrags → Erste Tarifverhandlungen → Verhandlungen werden für gescheitert erklärt → Urabstimmung und Streik → Schlichter wird angerufen → Schlichtung wird angenommen","textPt":"Rescisão da convenção → primeiras negociações → negociações declaradas fracassadas → votação e greve → mediador é chamado → mediação é aceita","correct":true},{"text":"Erste Tarifverhandlungen → Kündigung des Tarifvertrags → Schlichter wird angerufen → Urabstimmung und Streik → Verhandlungen werden für gescheitert erklärt → Schlichtung wird angenommen","textPt":"Primeiras negociações → rescisão da convenção → mediador é chamado → votação e greve → negociações declaradas fracassadas → mediação é aceita","correct":false},{"text":"Urabstimmung und Streik → Kündigung des Tarifvertrags → Erste Tarifverhandlungen → Schlichter wird angerufen → Verhandlungen werden für gescheitert erklärt → Schlichtung wird angenommen","textPt":"Votação e greve → rescisão da convenção → primeiras negociações → mediador é chamado → negociações declaradas fracassadas → mediação é aceita","correct":false},{"text":"Kündigung des Tarifvertrags → Schlichter wird angerufen → Erste Tarifverhandlungen → Verhandlungen werden für gescheitert erklärt → Urabstimmung und Streik → Schlichtung wird angenommen","textPt":"Rescisão da convenção → mediador é chamado → primeiras negociações → negociações declaradas fracassadas → votação e greve → mediação é aceita","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ein Bekannter von Frau Medstein, Matthias Räwer, kündigt nach einer Zusage der Ecotec GmbH sein altes Arbeitsverhältnis am 06.05.2023 schriftlich. Mit welchem Datum endet sein altes Arbeitsverhältnis frühestens, wenn die gesetzliche Kündigungsfrist von vier Wochen zum Fünfzehnten oder zum Ende eines Kalendermonats gilt (§ 622 BGB)?","qPt":"Matthias Räwer, conhecido da Sra. Medstein, após receber uma proposta da Ecotec GmbH, rescinde por escrito seu antigo vínculo de trabalho em 06.05.2023. Com qual data seu antigo vínculo termina, no mínimo, se vale o prazo legal de quatro semanas até o dia 15 ou até o fim de um mês civil (§ 622 do BGB)?","a":"Vier Wochen nach dem 06.05.2023 ist der 03.06.2023 erreicht. Der nächstmögliche gesetzliche Kündigungstermin (zum 15. oder zum Monatsende) danach ist der 15.06.2023.","aPt":"Quatro semanas após 06.05.2023 chegam a 03.06.2023. A próxima data legal possível de rescisão (dia 15 ou fim do mês) depois disso é 15.06.2023.","options":[{"text":"03.06.2023","textPt":"03.06.2023","correct":false},{"text":"31.05.2023","textPt":"31.05.2023","correct":false},{"text":"15.06.2023","textPt":"15.06.2023","correct":true},{"text":"30.06.2023","textPt":"30.06.2023","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die gesetzliche Unfallversicherung bietet den Versicherten verschiedene Leistungen. Welcher Leistung entspricht folgendes Beispiel: finanzielle Unterstützung zum Lebensunterhalt des Versicherten im Fall der Arbeitsunfähigkeit wegen eines Arbeitsunfalls?","qPt":"O seguro legal contra acidentes oferece aos segurados diversos benefícios. A qual benefício corresponde o seguinte exemplo: apoio financeiro para o sustento do segurado em caso de incapacidade para o trabalho devido a um acidente de trabalho?","a":"Das Verletztengeld ist die Lohnersatzleistung der gesetzlichen Unfallversicherung, die den Lebensunterhalt des Versicherten sichert, solange er wegen eines Arbeitsunfalls arbeitsunfähig ist (nach Ende der Entgeltfortzahlung durch den Arbeitgeber).","aPt":"O Verletztengeld (auxílio-acidente) é o benefício substitutivo do salário pago pelo seguro legal contra acidentes, que garante o sustento do segurado enquanto ele estiver incapacitado para o trabalho devido a um acidente de trabalho (após o fim do pagamento do salário pelo empregador).","options":[{"text":"Verletztengeld","textPt":"Verletztengeld (auxílio-acidente)","correct":true},{"text":"Heilbehandlungen","textPt":"Tratamentos médicos (Heilbehandlungen)","correct":false},{"text":"Rente","textPt":"Pensão (Rente)","correct":false},{"text":"Pflegegeld","textPt":"Auxílio-cuidado (Pflegegeld)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die gesetzliche Unfallversicherung bietet den Versicherten verschiedene Leistungen. Welcher Leistung entspricht folgendes Beispiel: Übernahme der Reha-Kosten nach einem Unfall auf dem direkten Weg zur Arbeit?","qPt":"O seguro legal contra acidentes oferece aos segurados diversos benefícios. A qual benefício corresponde o seguinte exemplo: cobertura dos custos de reabilitação após um acidente no trajeto direto para o trabalho?","a":"Heilbehandlungen umfassen alle medizinischen Maßnahmen, einschließlich Rehabilitationsmaßnahmen, die zur Wiederherstellung der Gesundheit nach einem Arbeits- oder Wegeunfall nötig sind; die Kosten trägt die Berufsgenossenschaft.","aPt":"Os tratamentos médicos (Heilbehandlungen) abrangem todas as medidas médicas, incluindo reabilitação, necessárias para restabelecer a saúde após um acidente de trabalho ou de trajeto; os custos são assumidos pela associação profissional (Berufsgenossenschaft).","options":[{"text":"Heilbehandlungen","textPt":"Tratamentos médicos (Heilbehandlungen)","correct":true},{"text":"Verletztengeld","textPt":"Verletztengeld (auxílio-acidente)","correct":false},{"text":"Rente","textPt":"Pensão (Rente)","correct":false},{"text":"Pflegegeld","textPt":"Auxílio-cuidado (Pflegegeld)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die gesetzliche Unfallversicherung bietet den Versicherten verschiedene Leistungen. Welcher Leistung entspricht folgendes Beispiel: Rente bei einem dauerhaften Gesundheitsschaden durch einen Arbeitsunfall, wenn die Erwerbsfähigkeit um mindestens 20 % gemindert ist?","qPt":"O seguro legal contra acidentes oferece aos segurados diversos benefícios. A qual benefício corresponde o seguinte exemplo: pensão em caso de dano permanente à saúde causado por um acidente de trabalho, quando a capacidade de trabalho é reduzida em pelo menos 20%?","a":"Eine Rente aus der gesetzlichen Unfallversicherung wird gezahlt, wenn infolge eines Arbeitsunfalls die Erwerbsfähigkeit über die 26. Woche nach dem Unfall hinaus um mindestens 20 % gemindert ist.","aPt":"Uma pensão do seguro legal contra acidentes é paga quando, em decorrência de um acidente de trabalho, a capacidade de trabalho permanece reduzida em pelo menos 20% após a 26ª semana seguinte ao acidente.","options":[{"text":"Rente","textPt":"Pensão (Rente)","correct":true},{"text":"Verletztengeld","textPt":"Verletztengeld (auxílio-acidente)","correct":false},{"text":"Heilbehandlungen","textPt":"Tratamentos médicos (Heilbehandlungen)","correct":false},{"text":"Pflegegeld","textPt":"Auxílio-cuidado (Pflegegeld)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die gesetzliche Unfallversicherung bietet den Versicherten verschiedene Leistungen. Welcher Leistung entspricht folgendes Beispiel: finanzielle Unterstützung der Pflegebedürftigkeit nach einem Arbeitsunfall?","qPt":"O seguro legal contra acidentes oferece aos segurados diversos benefícios. A qual benefício corresponde o seguinte exemplo: apoio financeiro em caso de necessidade de cuidados contínuos após um acidente de trabalho?","a":"Pflegegeld wird gezahlt, wenn ein Versicherter infolge eines Arbeitsunfalls so schwer geschädigt ist, dass er dauerhaft auf Hilfe bei alltäglichen Verrichtungen angewiesen ist.","aPt":"O Pflegegeld (auxílio-cuidado) é pago quando um segurado fica tão gravemente prejudicado por um acidente de trabalho que passa a depender permanentemente de ajuda para atividades do dia a dia.","options":[{"text":"Pflegegeld","textPt":"Auxílio-cuidado (Pflegegeld)","correct":true},{"text":"Verletztengeld","textPt":"Verletztengeld (auxílio-acidente)","correct":false},{"text":"Heilbehandlungen","textPt":"Tratamentos médicos (Heilbehandlungen)","correct":false},{"text":"Rente","textPt":"Pensão (Rente)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Für die Ecotec GmbH ist ein nachhaltiges Konzept wichtig. Welche der folgenden Maßnahmen unterstützt die Nachhaltigkeit?","qPt":"Para a Ecotec GmbH, um conceito sustentável é importante. Qual das seguintes medidas apoia a sustentabilidade?","a":"Behälter aus nachwachsenden Rohstoffen für Speisen und Getränke 'to go' zu verwenden, schont fossile Ressourcen und reduziert Plastikmüll – anders als Flugreisen statt Bahnfahrten, der Einkauf rein nach Preis unabhängig von der Herkunft oder altersdiskriminierende Einstellungspraktiken.","aPt":"Usar embalagens de matérias-primas renováveis para alimentos e bebidas 'para viagem' poupa recursos fósseis e reduz o lixo plástico — ao contrário de viajar só de avião em vez de trem, comprar apenas pelo preço sem considerar a origem, ou práticas de contratação discriminatórias por idade.","options":[{"text":"Geschäftsreisen werden aufgrund der Zeitersparnis künftig nur noch mit dem Flugzeug erledigt.","textPt":"As viagens de negócios passarão a ser feitas somente de avião, por economia de tempo.","correct":false},{"text":"Beim Einkauf werden die günstigsten Produkte bevorzugt, unabhängig von der Herkunft.","textPt":"Nas compras, dá-se preferência aos produtos mais baratos, independentemente da origem.","correct":false},{"text":"In der Kantine müssen Behälter für Getränke und Speisen 'to go' aus nachwachsenden Rohstoffen hergestellt sein.","textPt":"No refeitório, os recipientes para bebidas e comidas 'para viagem' devem ser feitos de matérias-primas renováveis.","correct":true},{"text":"Bewerber werden nur eingestellt, wenn sie über 30 Jahre alt sind.","textPt":"Só são contratados candidatos com mais de 30 anos.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Ecotec GmbH möchte nachhaltiger wirtschaften und die Umwelt weniger belasten. Welche der folgenden Maßnahmen dient der Vermeidung bzw. Verringerung von Umweltbelastungen durch die Ecotec GmbH?","qPt":"A Ecotec GmbH quer operar de forma mais sustentável e reduzir o impacto ambiental. Qual das seguintes medidas contribui para evitar ou reduzir o impacto ambiental causado pela Ecotec GmbH?","a":"Werden die aus recyceltem Papier hergestellten Verpackungen nicht mehr aus dem europäischen Ausland, sondern von einem lokalen Hersteller bezogen, verringern sich die Transportwege und damit die damit verbundenen CO₂-Emissionen.","aPt":"Ao comprar embalagens feitas de papel reciclado de um fabricante local, em vez de importá-las de outro país europeu, reduzem-se as distâncias de transporte e, com isso, as emissões de CO₂ associadas.","options":[{"text":"Die fällige Sanierung des Lagerdaches wird nicht zum Anlass genommen, eine moderne Photovoltaik-Anlage zu installieren.","textPt":"A reforma necessária do telhado do depósito não é aproveitada para instalar um sistema fotovoltaico moderno.","correct":false},{"text":"Statt Kartons verwendet die Ecotec GmbH mehrlagiges Einwegplastik als Umverpackung.","textPt":"Em vez de caixas de papelão, a Ecotec GmbH usa plástico descartável de várias camadas como embalagem externa.","correct":false},{"text":"Der Fuhrpark der Ecotec GmbH wird von Batterie-Elektrischen und Hybrid-Fahrzeugen auf Dieselfahrzeuge umgestellt.","textPt":"A frota da Ecotec GmbH é trocada de veículos elétricos e híbridos para veículos a diesel.","correct":false},{"text":"Die aus recyceltem Papier hergestellten Verpackungen werden nicht mehr aus dem europäischen Ausland bezogen, sondern von einem lokalen Hersteller.","textPt":"As embalagens feitas de papel reciclado deixam de ser importadas de outro país europeu e passam a ser compradas de um fabricante local.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Ecotec GmbH möchte zu Beginn des neuen Ausbildungsjahres zwei Ausbildungsplätze anbieten. In die Ausbildungsverträge sollen Vereinbarungen über eine Probezeit aufgenommen werden. Welche der folgenden Aussagen über die Probezeit in Ausbildungsverträgen trifft zu?","qPt":"No início do novo ano de formação, a Ecotec GmbH quer oferecer duas vagas de aprendizagem. Os contratos de formação devem incluir cláusulas sobre o período de experiência. Qual das seguintes afirmações sobre o período de experiência em contratos de formação está correta?","a":"Nach dem Berufsbildungsgesetz muss die Probezeit in einem Ausbildungsvertrag mindestens einen und darf höchstens vier Monate betragen.","aPt":"Segundo a Lei de Formação Profissional, o período de experiência num contrato de formação deve ser de no mínimo um mês e no máximo quatro meses.","options":[{"text":"Eine Probezeit ist bei Ausbildungsverträgen nicht erforderlich.","textPt":"Um período de experiência não é obrigatório em contratos de formação.","correct":false},{"text":"Eine Probezeit muss mindestens sechs Monate betragen.","textPt":"Um período de experiência deve ser de no mínimo seis meses.","correct":false},{"text":"Eine Probezeit ist nur bei kaufmännischen Berufen erforderlich.","textPt":"Um período de experiência só é exigido em profissões administrativas/comerciais.","correct":false},{"text":"Eine Probezeit muss mindestens einen und maximal vier Monate betragen.","textPt":"Um período de experiência deve ser de no mínimo um e no máximo quatro meses.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Medstein hat im September 2023 bei der Ecotec GmbH eine Ausbildung zur Fachinformatikerin Fachrichtung Anwendungsentwicklung begonnen. Sie möchte im Mai 2024 (also nach der Probezeit) die Ausbildung abbrechen und in eine Ausbildung zur Verwaltungsfachangestellten wechseln. Welche der folgenden Aussagen über die Kündigung ihres Ausbildungsvertrages trifft zu?","qPt":"A Sra. Medstein iniciou em setembro de 2023 uma formação como Fachinformatikerin na área de desenvolvimento de aplicações na Ecotec GmbH. Em maio de 2024 (ou seja, após o período de experiência), ela quer abandonar essa formação e mudar para uma formação como assistente administrativa pública. Qual das seguintes afirmações sobre a rescisão de seu contrato de formação está correta?","a":"Nach der Probezeit kann ein Auszubildender den Ausbildungsvertrag nur noch aus wichtigem Grund fristlos oder – wie hier, bei Aufgabe der Berufsausbildung zugunsten eines anderen Berufs – mit einer Kündigungsfrist von vier Wochen kündigen (§ 22 BBiG).","aPt":"Após o período de experiência, o aprendiz só pode rescindir o contrato de formação por justa causa (sem aviso prévio) ou — como neste caso, ao abandonar a formação para seguir outra profissão — com um prazo de aviso prévio de quatro semanas (§ 22 da Lei de Formação Profissional).","options":[{"text":"Die Kündigungsfrist beträgt für beide Vertragspartner sechs Monate.","textPt":"O prazo de aviso prévio é de seis meses para ambas as partes.","correct":false},{"text":"Frau Medstein kann den Ausbildungsvertrag mit einer Kündigungsfrist von vier Wochen kündigen.","textPt":"A Sra. Medstein pode rescindir o contrato de formação com um prazo de aviso prévio de quatro semanas.","correct":true},{"text":"Nach der Probezeit kann der Ausbildungsvertrag nicht mehr gekündigt werden.","textPt":"Após o período de experiência, o contrato de formação não pode mais ser rescindido.","correct":false},{"text":"Der Ausbildungsvertrag kann nur mit Zustimmung der IHK gekündigt werden.","textPt":"O contrato de formação só pode ser rescindido com o consentimento da câmara de comércio.","correct":false}]},
