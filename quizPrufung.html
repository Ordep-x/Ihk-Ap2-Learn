<style>
  :root{
    --paper:#F1ECDC;
    --paper-2:#E9E2CC;
    --card:#FBF8EE;
    --ink:#22314A;
    --ink-soft:#4C5A72;
    --rule:#C9BE9E;
    --stamp-1:#A6402F;
    --stamp-2:#2C6E62;
    --stamp-3:#7A5A2E;
    --stamp-1-bg:#F4DAD3;
    --stamp-2-bg:#D9EAE5;
    --stamp-3-bg:#EDE1C9;
    --good:#2C6E62;
    --good-bg:#D9EAE5;
    --bad:#A6402F;
    --bad-bg:#F4DAD3;
    --shadow:0 1px 0 rgba(34,49,74,.06);
    --focus:#2C6E62;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#1B1F23;
      --paper-2:#20252A;
      --card:#26292C;
      --ink:#EFE9D8;
      --ink-soft:#B9B2A0;
      --rule:#3B3E3A;
      --stamp-1-bg:#3A2624;
      --stamp-2-bg:#1E322D;
      --stamp-3-bg:#332B1C;
      --good-bg:#1E322D;
      --bad-bg:#3A2624;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1F23;
    --paper-2:#20252A;
    --card:#26292C;
    --ink:#EFE9D8;
    --ink-soft:#B9B2A0;
    --rule:#3B3E3A;
    --stamp-1-bg:#3A2624;
    --stamp-2-bg:#1E322D;
    --stamp-3-bg:#332B1C;
    --good-bg:#1E322D;
    --bad-bg:#3A2624;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--paper-2), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Spectral', Georgia, 'Times New Roman', serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 48px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    border-bottom:1px solid var(--rule);
    padding-bottom:14px;
    margin-bottom:20px;
  }
  h1{
    font-size:1.3rem;
    font-weight:700;
    margin:0;
    letter-spacing:.2px;
  }
  h1 small{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:.68rem;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin-top:4px;
    text-transform:none;
  }
  .header-right{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .back-link, .theme-toggle{
    font-family:'JetBrains Mono', monospace;
    font-size:.68rem;
    letter-spacing:.02em;
    padding:5px 9px;
    border-radius:3px;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .back-link:hover, .theme-toggle:hover{border-color:var(--ink-soft); color:var(--ink);}
  .theme-toggle:focus-visible, .back-link:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .theme-toggle svg{width:13px; height:13px; flex:none;}
  .theme-toggle svg *{stroke:currentColor;}

  .progressbar{
    height:3px;
    background:var(--rule);
    border-radius:2px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .progressbar > div{
    height:100%;
    background:var(--ink-soft);
    transition:width .25s ease;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    font-size:.7rem;
    color:var(--ink-soft);
    margin-bottom:20px;
  }

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
  }
  .chip{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    padding:6px 11px;
    border-radius:3px;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip:hover{border-color:var(--ink-soft);}
  .chip:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .chip[data-active="true"]{
    color:var(--ink);
    border-color:var(--ink);
    background:var(--card);
  }
  .chip .dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    margin-right:6px;
    position:relative;
    top:-1px;
  }

  .qcard{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:2px;
    box-shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 20px -12px rgba(34,49,74,.25);
    padding:26px 24px 22px;
    margin-bottom:16px;
  }
  .tab{
    align-self:flex-start;
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    letter-spacing:.04em;
    padding:4px 9px 4px 8px;
    border-radius:2px;
    margin-bottom:16px;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .tab .dot{width:6px;height:6px;border-radius:50%;}
  .facelabel{
    font-family:'JetBrains Mono', monospace;
    font-size:.62rem;
    color:var(--ink-soft);
    letter-spacing:.08em;
    margin-bottom:10px;
  }
  .qtext{
    font-size:1.18rem;
    line-height:1.5;
    font-weight:600;
    margin-bottom:6px;
  }
  .qpt{
    display:none;
    margin-top:4px;
    margin-bottom:18px;
    padding-top:12px;
    border-top:1px dashed var(--rule);
    font-size:.92rem;
    font-style:italic;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .qpt::before{
    content:'PT · ';
    font-style:normal;
    font-weight:700;
    opacity:.6;
  }
  .show-pt .qpt{ display:block; }

  .codeblock{
    margin:10px 0 0;
    padding:11px 13px;
    background:var(--paper-2);
    border:1px solid var(--rule);
    border-radius:3px;
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    overflow-x:auto;
    color:var(--ink);
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-top:6px;
  }
  .option{
    text-align:left;
    font-family:'Spectral', Georgia, serif;
    font-size:.98rem;
    line-height:1.45;
    padding:12px 14px;
    border-radius:3px;
    border:1px solid var(--rule);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled){border-color:var(--ink-soft);}
  .option:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .option .optpt{
    display:none;
    margin-top:5px;
    font-size:.82rem;
    font-style:italic;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .option .optpt::before{
    content:'PT · ';
    font-style:normal;
    font-weight:700;
    opacity:.6;
  }
  .show-pt .option .optpt{ display:block; }
  .option:disabled{cursor:default;}
  .option.correct{
    border-color:var(--good);
    background:var(--good-bg);
    color:var(--good);
  }
  .option.wrong{
    border-color:var(--bad);
    background:var(--bad-bg);
    color:var(--bad);
  }
  .option.correct .optpt, .option.wrong .optpt{ color:inherit; opacity:.85; }

  .explain{
    display:none;
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--rule);
  }
  .explain.show{ display:block; }
  .explain .explainlabel{
    font-family:'JetBrains Mono', monospace;
    font-size:.62rem;
    color:var(--ink-soft);
    letter-spacing:.08em;
    margin-bottom:8px;
  }
  .explain .atext{
    font-size:.95rem;
    line-height:1.55;
  }
  .explain .apt{
    display:none;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--rule);
    font-size:.88rem;
    font-style:italic;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .explain .apt::before{
    content:'PT · ';
    font-style:normal;
    font-weight:700;
    opacity:.6;
  }
  .show-pt .explain .apt{ display:block; }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  .navgroup{display:flex; gap:8px;}
  button.ctrl{
    font-family:'JetBrains Mono', monospace;
    font-size:.75rem;
    padding:9px 14px;
    border-radius:3px;
    border:1px solid var(--rule);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  button.ctrl:hover:not(:disabled){border-color:var(--ink-soft);}
  button.ctrl:disabled{opacity:.4; cursor:default;}
  button.ctrl.primary{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  footer{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    color:var(--ink-soft);
    margin-top:8px;
  }
  footer button{
    background:none;border:none;
    font-family:inherit;font-size:inherit;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }
  .license-line{
    margin-top:10px;
    font-size:.6rem;
    opacity:.75;
  }
  .license-line a{
    color:inherit;
  }
</style>
</head>

<script>
const QUIZ = [
{"cat":"wiso","sub":"pruefung","q":"Die Infotec GmbH ist ein IT-Dienstleister, der kundenspezifische Hard- und Softwarelösungen für klein- und mittelständische Betriebe anbietet. Welchem Wirtschaftssektor ist die Infotec GmbH zuzuordnen?","qPt":"A Infotec GmbH é uma prestadora de serviços de TI que oferece soluções de hardware e software personalizadas para pequenas e médias empresas. A qual setor econômico pertence a Infotec GmbH?","a":"Die Infotec GmbH ist dem tertiären Sektor (Dienstleistungssektor) zuzuordnen, da sie Dienstleistungen (IT-Lösungen) und keine selbst hergestellten Sachgüter oder Rohstoffe anbietet.","aPt":"A Infotec GmbH pertence ao setor terciário (setor de serviços), pois oferece serviços (soluções de TI) e não bens materiais produzidos por ela mesma ou matérias-primas.","options":[{"text":"Unternehmen des primären Sektors","textPt":"Empresa do setor primário.","correct":false},{"text":"Unternehmen des sekundären Sektors","textPt":"Empresa do setor secundário.","correct":false},{"text":"Unternehmen des tertiären Sektors","textPt":"Empresa do setor terciário.","correct":true},{"text":"Unternehmen, das keinem Wirtschaftssektor zugeordnet werden kann","textPt":"Empresa que não pode ser atribuída a nenhum setor econômico.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Infotec GmbH bietet als Unternehmen am Markt Gewinnerzielung an, ist aber nicht in der Hand des Staates oder einer Kommune. Welche Bezeichnung trifft auf die Infotec GmbH zu?","qPt":"A Infotec GmbH, como empresa no mercado, visa a obtenção de lucro, mas não está nas mãos do Estado ou de um município. Qual denominação se aplica à Infotec GmbH?","a":"Die Infotec GmbH ist ein erwerbswirtschaftlicher Betrieb, da ihr wirtschaftliches Handeln auf die Erzielung von Gewinn (erwerbswirtschaftliches Prinzip) ausgerichtet ist, im Gegensatz zu einem gemeinwirtschaftlichen (öffentlich-rechtlichen) Betrieb, der die Bedarfsdeckung der Allgemeinheit zum Ziel hat.","aPt":"A Infotec GmbH é uma empresa com fins lucrativos (erwerbswirtschaftlicher Betrieb), pois sua atuação econômica visa a obtenção de lucro (princípio erwerbswirtschaftlich), em contraste com uma empresa de interesse público (gemeinwirtschaftlich), cujo objetivo é suprir as necessidades da coletividade.","options":[{"text":"Gemeinwirtschaftlicher Betrieb","textPt":"Empresa de interesse público / economia comum.","correct":false},{"text":"Erwerbswirtschaftlicher Betrieb","textPt":"Empresa com fins lucrativos.","correct":true},{"text":"Öffentlich-rechtlicher Betrieb","textPt":"Empresa de direito público.","correct":false},{"text":"Genossenschaftlicher Betrieb","textPt":"Empresa cooperativa.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Infotec GmbH plant, für ein neues Geschäftsfeld Mitarbeiter einzustellen. In den Arbeitsverträgen soll vorübergehend eine tägliche Arbeitszeit von zehn Stunden vereinbart werden (Fünf-Tage-Woche, Montag bis Freitag). Wann ist eine solche Vereinbarung zulässig?","qPt":"A Infotec GmbH planeja contratar funcionários para uma nova área de negócio. Nos contratos de trabalho deve ser acordada temporariamente uma jornada diária de dez horas (semana de cinco dias, de segunda a sexta). Quando esse acordo é permitido?","a":"Die Vereinbarung ist zulässig, wenn innerhalb von sechs Monaten im Durchschnitt acht Stunden werktäglich nicht überschritten werden (§ 3 ArbZG). Die werktägliche Arbeitszeit darf zwar vorübergehend auf bis zu zehn Stunden verlängert werden, muss sich aber über einen Ausgleichszeitraum auf durchschnittlich acht Stunden ausgleichen.","aPt":"O acordo é permitido quando, em média, dentro de seis meses, as oito horas diárias úteis não forem ultrapassadas (§ 3 da Lei da Jornada de Trabalho - ArbZG). A jornada diária pode ser temporariamente estendida até dez horas, mas deve ser compensada em um período de referência para uma média de oito horas.","options":[{"text":"Wenn sie tarifvertraglich vereinbart wurde.","textPt":"Quando foi acordada por convenção coletiva.","correct":false},{"text":"Weil die tägliche Arbeitszeit keiner gesetzlichen Beschränkung unterliegt.","textPt":"Porque a jornada diária não está sujeita a nenhuma restrição legal.","correct":false},{"text":"Wenn innerhalb von sechs Monaten im Durchschnitt acht Stunden werktäglich nicht überschritten werden.","textPt":"Quando, em média, dentro de seis meses, as oito horas diárias úteis não forem ultrapassadas.","correct":true},{"text":"Wenn der Betriebsrat mit der Geschäftsleitung in einer Betriebsvereinbarung mehr Urlaubstage vereinbart.","textPt":"Quando o conselho de empresa e a direção acordam mais dias de férias em um acordo de empresa.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Für neue Mitarbeiter der Infotec GmbH soll in den Arbeitsverträgen eine Probezeit von sechs Monaten vereinbart werden. Welche Aussage trifft auf die vereinbarte Probezeit zu?","qPt":"Para os novos funcionários da Infotec GmbH deve ser acordado nos contratos de trabalho um período de experiência de seis meses. Qual afirmação é correta sobre o período de experiência acordado?","a":"Das Arbeitsverhältnis kann während der Probezeit mit einer verkürzten Frist von zwei Wochen gekündigt werden (§ 622 Abs. 3 BGB). Dies gilt für beide Vertragsparteien, nicht nur für den Arbeitnehmer.","aPt":"Durante o período de experiência, o contrato de trabalho pode ser rescindido com um prazo reduzido de duas semanas (§ 622, parágrafo 3, do BGB). Isso vale para ambas as partes do contrato, não apenas para o funcionário.","options":[{"text":"Der Arbeitnehmer kann das Arbeitsverhältnis während der Probezeit nicht kündigen.","textPt":"O funcionário não pode rescindir o contrato durante o período de experiência.","correct":false},{"text":"Der Arbeitgeber kann das Arbeitsverhältnis nur aus wichtigem Grund kündigen.","textPt":"O empregador só pode rescindir o contrato por motivo grave.","correct":false},{"text":"Das Arbeitsverhältnis kann während der Probezeit mit einer Frist von zwei Wochen gekündigt werden.","textPt":"Durante o período de experiência, o contrato pode ser rescindido com um prazo de duas semanas.","correct":true},{"text":"Die Probezeit muss mindestens einen Monat und darf maximal vier Monate betragen.","textPt":"O período de experiência deve ser de pelo menos um mês e no máximo quatro meses.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Infotec GmbH ist Mitglied des Arbeitgeberverbandes. Ein Mitarbeiter hat laut Arbeitsvertrag eine wöchentliche Arbeitszeit von 38,5 Stunden gemäß Tarifvertrag. Woran zeigt sich, dass die Infotec GmbH hier an kollektives Arbeitsrecht gebunden ist?","qPt":"A Infotec GmbH é membro da associação patronal. Segundo o contrato de trabalho, um funcionário tem uma jornada semanal de 38,5 horas conforme a convenção coletiva. Onde se mostra que a Infotec GmbH está vinculada ao direito coletivo do trabalho?","a":"Daran, dass die wöchentliche Arbeitszeit nach Tarifvertrag 38,5 Stunden beträgt. Als Mitglied des Arbeitgeberverbandes ist die Infotec GmbH tarifgebunden (§ 3 TVG) und muss die im Tarifvertrag ausgehandelten kollektiven Regelungen wie die Arbeitszeit einhalten.","aPt":"No fato de que a jornada semanal de trabalho, segundo a convenção coletiva, é de 38,5 horas. Como membro da associação patronal, a Infotec GmbH está vinculada à convenção coletiva (§ 3 TVG) e deve cumprir as regras coletivas negociadas, como a jornada de trabalho.","options":[{"text":"Das Arbeitsverhältnis beginnt am 1. Juli 2020.","textPt":"O contrato de trabalho começa em 1º de julho de 2020.","correct":false},{"text":"Die Infotec GmbH bietet den Mitarbeitern ein Job-Ticket für die Fahrt zur Arbeit an.","textPt":"A Infotec GmbH oferece aos funcionários um bilhete de transporte (Job-Ticket) para o trajeto ao trabalho.","correct":false},{"text":"Der Mitarbeiter erhält ein monatliches Bruttogehalt von 3.000,00 EUR.","textPt":"O funcionário recebe um salário bruto mensal de 3.000,00 EUR.","correct":false},{"text":"Die wöchentliche Arbeitszeit beträgt nach Tarifvertrag 38,5 Stunden.","textPt":"A jornada semanal de trabalho é de 38,5 horas segundo a convenção coletiva.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Fachinformatikerin Claudia Richter hat sich bei der Infotec GmbH beworben und wird zu einem Vorstellungsgespräch eingeladen. Welche Frage darf ihr dabei nicht gestellt werden bzw. muss sie nicht wahrheitsgemäß beantworten?","qPt":"A técnica em informática Claudia Richter se candidatou na Infotec GmbH e é convidada para uma entrevista de emprego. Qual pergunta não pode ser feita a ela, ou que ela não precisa responder com veracidade?","a":"Die Frage 'Sind Sie schwanger?' darf nicht gestellt werden. Eine Schwangerschaft ist für die Eignung zur Stelle in der Regel irrelevant, und das Fragerecht des Arbeitgebers ist durch das Persönlichkeitsrecht der Bewerberin sowie das Allgemeine Gleichbehandlungsgesetz (AGG, Diskriminierungsverbot wegen Geschlechts) begrenzt. Bei unzulässigen Fragen darf die Bewerberin auch wahrheitswidrig antworten, ohne dass dies Konsequenzen hat.","aPt":"A pergunta 'Você está grávida?' não pode ser feita. Uma gravidez normalmente é irrelevante para a aptidão à vaga, e o direito do empregador de perguntar é limitado pelo direito de personalidade da candidata e pela Lei Geral de Igualdade de Tratamento (AGG, proibição de discriminação por sexo). Em perguntas inadmissíveis, a candidata pode até responder de forma inverídica, sem que isso tenha consequências.","options":[{"text":"Sind Sie bereit, im Ausland zu arbeiten?","textPt":"Você está disposta a trabalhar no exterior?","correct":false},{"text":"Haben Sie Erfahrungen in Teamarbeit?","textPt":"Você tem experiência em trabalho em equipe?","correct":false},{"text":"Sind Sie bereit, gelegentlich Überstunden zu leisten?","textPt":"Você está disposta a fazer horas extras ocasionalmente?","correct":false},{"text":"Sind Sie schwanger?","textPt":"Você está grávida?","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Geschäftsleitung der Infotec GmbH plant die Einführung eines Zeiterfassungssystems. In welchen Angelegenheiten hat der Betriebsrat laut Betriebsverfassungsgesetz (BetrVG) ein Mitbestimmungsrecht?","qPt":"A direção da Infotec GmbH planeja introduzir um sistema de registro de ponto. Em quais assuntos o conselho de empresa (Betriebsrat) tem direito de cogestão segundo a Lei de Constituição das Empresas (BetrVG)?","a":"Die Einführung eines Zeiterfassungssystems unterliegt der zwingenden Mitbestimmung des Betriebsrats nach § 87 Abs. 1 Nr. 6 BetrVG, da es sich um eine technische Einrichtung handelt, die zur Überwachung von Verhalten oder Leistung der Arbeitnehmer geeignet ist.","aPt":"A introdução de um sistema de registro de ponto está sujeita à cogestão obrigatória do conselho de empresa conforme o § 87, parágrafo 1, nº 6 da BetrVG, pois se trata de um dispositivo técnico apto a monitorar o comportamento ou o desempenho dos funcionários.","options":[{"text":"Errichten einer neuen Lagerhalle","textPt":"Construção de um novo galpão de armazenamento.","correct":false},{"text":"Anschaffung neuer Lagertechnik","textPt":"Aquisição de nova tecnologia de armazenamento.","correct":false},{"text":"Einführung eines Zeiterfassungssystems","textPt":"Introdução de um sistema de registro de ponto.","correct":true},{"text":"Gründung einer Filiale","textPt":"Fundação de uma filial.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Der Betriebsrat der Infotec GmbH lädt zur vierteljährlichen Betriebsversammlung ein. Welcher Personenkreis ist berechtigt, an der Betriebsversammlung teilzunehmen?","qPt":"O conselho de empresa da Infotec GmbH convoca a assembleia trimestral de empresa (Betriebsversammlung). Qual grupo de pessoas tem o direito de participar dessa assembleia?","a":"Alle Arbeitnehmer des Unternehmens sind berechtigt, an der Betriebsversammlung teilzunehmen (§ 42 ff. BetrVG). Sie dient dazu, die Belegschaft über die Tätigkeit von Betriebsrat und Geschäftsleitung zu informieren.","aPt":"Todos os funcionários da empresa têm o direito de participar da assembleia de empresa (§ 42 e seguintes da BetrVG). Ela serve para informar o corpo de funcionários sobre as atividades do conselho de empresa e da direção.","options":[{"text":"Alle Arbeitnehmer des Unternehmens","textPt":"Todos os funcionários da empresa.","correct":true},{"text":"Nur die Betriebsratsmitglieder und die Gewerkschaftsvertreter","textPt":"Apenas os membros do conselho de empresa e os representantes sindicais.","correct":false},{"text":"Nur die gewerkschaftlich organisierten Mitarbeiter","textPt":"Apenas os funcionários sindicalizados.","correct":false},{"text":"Nur die Vollzeitmitarbeiter und die Führungskräfte","textPt":"Apenas os funcionários em tempo integral e os gestores.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der Infotec GmbH wird zwischen dem Entgelttarifvertrag und dem Manteltarifvertrag unterschieden. Welche der folgenden Regelungen wird typischerweise im Manteltarifvertrag vereinbart?","qPt":"Na Infotec GmbH se distingue entre a convenção coletiva salarial (Entgelttarifvertrag) e a convenção coletiva-quadro (Manteltarifvertrag). Qual das seguintes regras é tipicamente acordada na convenção coletiva-quadro?","a":"Die Pausenregelung wird im Manteltarifvertrag geregelt. Der Manteltarifvertrag enthält die allgemeinen Rahmenbedingungen des Arbeitsverhältnisses (z. B. Arbeitszeit, Pausen, Kündigungsfristen, Urlaub), während der Entgelttarifvertrag die konkreten Gehaltssätze festlegt.","aPt":"A regulamentação de pausas é definida na convenção coletiva-quadro. Essa convenção contém as condições gerais da relação de trabalho (por exemplo, jornada, pausas, prazos de aviso prévio, férias), enquanto a convenção coletiva salarial fixa os valores concretos dos salários.","options":[{"text":"Pausenregelung","textPt":"Regulamentação de pausas.","correct":true},{"text":"Gehaltssätze für die einzelnen Gehaltsgruppen","textPt":"Valores salariais para cada grupo de remuneração.","correct":false},{"text":"Ausbildungsvergütung","textPt":"Remuneração da formação profissional.","correct":false},{"text":"Höhe der Überstundenzulage","textPt":"Valor do adicional de horas extras.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Infotec GmbH ist an Vereinbarungen gebunden, die die Sozialpartner miteinander vereinbart haben. Welche der folgenden Einrichtungen wird zu den Sozialpartnern gerechnet?","qPt":"A Infotec GmbH está vinculada a acordos firmados entre os parceiros sociais (Sozialpartner). Qual das seguintes instituições é considerada um parceiro social?","a":"Arbeitgeberverbände zählen zu den Sozialpartnern. Als Sozialpartner (auch Tarifpartner genannt) bezeichnet man die Gewerkschaften auf Arbeitnehmerseite und die Arbeitgeberverbände auf Arbeitgeberseite, die gemeinsam Tarifverträge aushandeln.","aPt":"As associações patronais são consideradas parceiros sociais. Por parceiros sociais (também chamados de Tarifpartner) entendem-se os sindicatos do lado dos trabalhadores e as associações patronais do lado dos empregadores, que negociam juntos as convenções coletivas.","options":[{"text":"Bundesministerium für Gesundheit","textPt":"Ministério Federal da Saúde.","correct":false},{"text":"Bundesagentur für Arbeit","textPt":"Agência Federal do Trabalho.","correct":false},{"text":"Arbeitgeberverbände","textPt":"Associações patronais.","correct":true},{"text":"Industrie- und Handelskammern","textPt":"Câmaras de Indústria e Comércio.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Mitarbeiter der Infotec GmbH sind in der gesetzlichen Krankenversicherung (GKV) pflichtversichert. Welche Aussage trifft auf die gesetzliche Krankenversicherung zu?","qPt":"Os funcionários da Infotec GmbH são segurados obrigatórios no seguro de saúde público (GKV). Qual afirmação é correta sobre o seguro de saúde público?","a":"Die Beitragsbemessungsgrenze gibt an, bis zu welchem Jahresbruttoentgelt ein Arbeitnehmer in der GKV versichert sein muss. Oberhalb dieser Grenze besteht keine Versicherungspflicht mehr, und ein Wechsel in eine private Krankenversicherung wird möglich.","aPt":"O limite de cálculo de contribuição (Beitragsbemessungsgrenze) indica até qual remuneração bruta anual um funcionário deve estar segurado no GKV. Acima desse limite, deixa de haver obrigatoriedade de seguro, e torna-se possível migrar para um seguro de saúde privado.","options":[{"text":"Ein Wechsel der Krankenkasse ist nur mit Zustimmung des Arbeitgebers möglich.","textPt":"A troca de caixa de saúde só é possível com o consentimento do empregador.","correct":false},{"text":"Der Beitragssatz wird vom Bundesministerium für Gesundheit festgelegt.","textPt":"A alíquota de contribuição é fixada pelo Ministério Federal da Saúde.","correct":false},{"text":"Der Beitrag wird vom Nettolohn berechnet.","textPt":"A contribuição é calculada sobre o salário líquido.","correct":false},{"text":"Die Beitragsbemessungsgrenze gibt an, bis zu welchem Jahresbruttoentgelt ein Arbeitnehmer in der GKV versichert sein muss.","textPt":"O limite de cálculo de contribuição indica até qual remuneração bruta anual um funcionário deve estar segurado no GKV.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Fachinformatikerin Petra Müller ist seit dem 1. März 2020 bei der Infotec GmbH angestellt. Ihr Bruttogehalt beträgt 3.200,00 EUR. Der allgemeine Beitragssatz zur gesetzlichen Krankenversicherung liegt bei 14,6 %, der Zusatzbeitrag bei 0,7 %. Wie hoch ist Frau Müllers eigener Beitragsanteil zur gesetzlichen Krankenversicherung?","qPt":"A técnica em informática Petra Müller trabalha na Infotec GmbH desde 1º de março de 2020. Seu salário bruto é de 3.200,00 EUR. A alíquota geral do seguro de saúde público é de 14,6%, e a contribuição adicional é de 0,7%. Qual é a parte da contribuição que a própria Sra. Müller paga ao seguro de saúde público?","a":"Der Gesamtbeitragssatz beträgt 14,6 % + 0,7 % = 15,3 %. Dieser wird je zur Hälfte von Arbeitgeber und Arbeitnehmer getragen, also 7,65 % für Frau Müller. 3.200,00 EUR × 7,65 % = 244,80 EUR.","aPt":"A alíquota total é de 14,6% + 0,7% = 15,3%. Essa alíquota é dividida igualmente entre empregador e empregado, ou seja, 7,65% para a Sra. Müller. 3.200,00 EUR × 7,65% = 244,80 EUR.","options":[{"text":"244,80 EUR","textPt":"244,80 EUR","correct":true},{"text":"489,60 EUR","textPt":"489,60 EUR","correct":false},{"text":"233,60 EUR","textPt":"233,60 EUR","correct":false},{"text":"467,20 EUR","textPt":"467,20 EUR","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Arbeitnehmer der Infotec GmbH sind gesetzlich unfallversichert. Die Mitarbeiterin Sophia Kemm stolpert im Büro über ein Kabel und verstaucht sich den Fuß. Wird hierfür von der gesetzlichen Unfallversicherung Leistung gewährt?","qPt":"Os funcionários da Infotec GmbH têm seguro de acidentes obrigatório. A funcionária Sophia Kemm tropeça em um cabo no escritório e torce o pé. O seguro de acidentes obrigatório concede benefícios nesse caso?","a":"Ja, es handelt sich um einen klassischen Arbeitsunfall, da sich der Unfall während der versicherten Tätigkeit auf der Arbeitsstätte selbst ereignet hat. Die gesetzliche Unfallversicherung gewährt hierfür Leistungen (§ 8 SGB VII).","aPt":"Sim, trata-se de um acidente de trabalho clássico, pois o acidente ocorreu durante a atividade segurada, no próprio local de trabalho. O seguro de acidentes obrigatório concede benefícios nesse caso (§ 8 do SGB VII).","options":[{"text":"Ja, es handelt sich um einen Arbeitsunfall, da sich der Unfall während der versicherten Tätigkeit im Betrieb ereignet hat.","textPt":"Sim, trata-se de um acidente de trabalho, pois ocorreu durante a atividade segurada na empresa.","correct":true},{"text":"Nein, da es sich nur um eine Verstauchung und keine ernsthafte Verletzung handelt.","textPt":"Não, pois se trata apenas de uma torção e não de uma lesão grave.","correct":false},{"text":"Nein, Leistungen werden nur bei Unfällen außerhalb des Büros gewährt.","textPt":"Não, benefícios só são concedidos em acidentes fora do escritório.","correct":false},{"text":"Nein, da ein Kabel im Büro kein typisches Arbeitsrisiko darstellt.","textPt":"Não, pois um cabo no escritório não representa um risco típico do trabalho.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Auszubildende Paula Schmitz rutscht auf dem direkten Weg zur Arbeit aus und zieht sich eine Bänderdehnung zu. Wird hierfür von der gesetzlichen Unfallversicherung Leistung gewährt?","qPt":"A aprendiz Paula Schmitz escorrega no caminho direto para o trabalho e sofre um estiramento de ligamento. O seguro de acidentes obrigatório concede benefícios nesse caso?","a":"Ja, es handelt sich um einen sogenannten Wegeunfall. Der direkte Weg zur und von der Arbeitsstätte ist nach § 8 Abs. 2 SGB VII in die gesetzliche Unfallversicherung einbezogen.","aPt":"Sim, trata-se do chamado acidente de trajeto (Wegeunfall). O trajeto direto de ida e volta ao local de trabalho está incluído no seguro de acidentes obrigatório, segundo o § 8, parágrafo 2, do SGB VII.","options":[{"text":"Nein, Wegeunfälle sind grundsätzlich nicht versichert.","textPt":"Não, acidentes de trajeto não são, em princípio, segurados.","correct":false},{"text":"Ja, es handelt sich um einen versicherten Wegeunfall auf dem direkten Weg zur Arbeit.","textPt":"Sim, trata-se de um acidente de trajeto segurado, no caminho direto para o trabalho.","correct":true},{"text":"Nein, da Auszubildende nicht gesetzlich unfallversichert sind.","textPt":"Não, pois aprendizes não têm seguro de acidentes obrigatório.","correct":false},{"text":"Nein, nur Unfälle innerhalb des Betriebsgeländes sind versichert.","textPt":"Não, apenas acidentes dentro do terreno da empresa são segurados.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Zwei 20-jährige Auszubildende der Infotec GmbH diskutieren über die Leistungen der gesetzlichen Rentenversicherung und einer privaten Altersvorsorge. Welches Argument für eine private Altersvorsorge trifft zu?","qPt":"Dois aprendizes de 20 anos da Infotec GmbH discutem sobre os benefícios do seguro de aposentadoria público e de uma previdência privada. Qual argumento a favor de uma previdência privada é correto?","a":"Eine private Altersvorsorge ist notwendig, weil die gesetzliche Rentenversicherung voraussichtlich nicht ausreichen wird, um den gewohnten Lebensstandard im Alter zu halten. Grund dafür ist unter anderem der demografische Wandel, der das Rentenniveau langfristig unter Druck setzt.","aPt":"Uma previdência privada é necessária porque o seguro de aposentadoria público provavelmente não será suficiente para manter o padrão de vida habitual na velhice. Um dos motivos é a mudança demográfica, que pressiona o nível das aposentadorias a longo prazo.","options":[{"text":"Eine private Altersvorsorge ist notwendig, weil die gesetzliche Rentenversicherung voraussichtlich nicht ausreichen wird.","textPt":"Uma previdência privada é necessária porque o seguro de aposentadoria público provavelmente não será suficiente.","correct":true},{"text":"Der demografische Wandel sorgt auch in Zukunft für genug Beitragszahler, weshalb das Rentenniveau steigt.","textPt":"A mudança demográfica garantirá contribuintes suficientes também no futuro, por isso o nível das aposentadorias aumenta.","correct":false},{"text":"Eine private Altersvorsorge ist nicht sinnvoll, weil das Rentenniveau in der gesetzlichen Rentenversicherung stetig steigt.","textPt":"Uma previdência privada não faz sentido, pois o nível das aposentadorias no sistema público aumenta constantemente.","correct":false},{"text":"Eine private Altersvorsorge lohnt sich nicht, weil jedem Arbeitnehmer eine Betriebsrente zusteht.","textPt":"Uma previdência privada não vale a pena, pois todo trabalhador tem direito a uma pensão empresarial.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Solidarität ist ein gesellschaftspolitisches Prinzip, das in der Bundesrepublik Deutschland angewendet wird. Welcher der folgenden Sachverhalte entspricht dem Prinzip der Solidarität?","qPt":"Solidariedade é um princípio sociopolítico aplicado na República Federal da Alemanha. Qual dos seguintes fatos corresponde ao princípio da solidariedade?","a":"Die Leistungen der gesetzlichen Krankenversicherungen sind einkommensunabhängig. Das Solidaritätsprinzip besagt, dass die Beiträge zwar nach der wirtschaftlichen Leistungsfähigkeit (Einkommen) bemessen werden, die Leistungen aber allen Versicherten unabhängig von ihrem Einkommen in gleichem Umfang zustehen.","aPt":"Os benefícios do seguro de saúde público independem da renda. O princípio da solidariedade estabelece que as contribuições são calculadas conforme a capacidade econômica (renda), mas os benefícios são concedidos a todos os segurados na mesma medida, independentemente da renda.","options":[{"text":"Der Staat erhöht die Abschreibungen auf Gewerbeimmobilien.","textPt":"O Estado aumenta a depreciação de imóveis comerciais.","correct":false},{"text":"Die Freibeträge bei der Erbschaftssteuer werden gesenkt.","textPt":"As isenções no imposto sobre herança são reduzidas.","correct":false},{"text":"Der Erwerb von Immobilien durch Kapitalgesellschaften wird steuerlich gefördert.","textPt":"A aquisição de imóveis por sociedades de capital é incentivada fiscalmente.","correct":false},{"text":"Die Leistungen der gesetzlichen Krankenversicherungen sind einkommensunabhängig.","textPt":"Os benefícios do seguro de saúde público independem da renda.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"In Deutschland gibt es neben privaten Betrieben auch öffentlich-rechtliche Betriebe. Welches Ziel verfolgt ein öffentlich-rechtlicher Betrieb primär?","qPt":"Na Alemanha, além de empresas privadas, existem também empresas de direito público. Qual objetivo uma empresa de direito público persegue primariamente?","a":"Ein öffentlich-rechtlicher Betrieb verfolgt primär das Ziel der bestmöglichen Versorgung der Bevölkerung mit Dienstleistungen oder Sachgütern (Bedarfsdeckungsprinzip), nicht die Gewinnmaximierung wie ein erwerbswirtschaftlicher Betrieb.","aPt":"Uma empresa de direito público persegue primariamente o objetivo de fornecer à população, da melhor forma possível, serviços ou bens materiais (princípio da cobertura de necessidades), e não a maximização do lucro, como uma empresa com fins lucrativos.","options":[{"text":"Der Steigerung des Einkommens der Kommune","textPt":"O aumento da receita do município.","correct":false},{"text":"Der Kostenvermeidung","textPt":"A prevenção de custos.","correct":false},{"text":"Der bestmöglichen Versorgung der Bevölkerung mit Dienstleistungen oder Sachgütern","textPt":"O melhor abastecimento possível da população com serviços ou bens materiais.","correct":true},{"text":"Der Dividendenausschüttung","textPt":"A distribuição de dividendos.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Zu den Lieferanten der Infotec GmbH zählt unter anderem die InfoSys AG. Welche Aussage trifft auf eine Aktiengesellschaft (AG) wie die InfoSys AG im Vergleich zu anderen Rechtsformen zu?","qPt":"Entre os fornecedores da Infotec GmbH está, entre outros, a InfoSys AG. Qual afirmação é correta sobre uma sociedade anônima (AG), como a InfoSys AG, em comparação com outras formas jurídicas?","a":"Die Geschäftsanteile einer Aktiengesellschaft (in Form von Aktien) könnten an der Börse gehandelt werden. Dies ist ein charakteristisches Merkmal der AG als Kapitalgesellschaft und unterscheidet sie z. B. von einem Einzelunternehmen (e.K.) oder einer GmbH.","aPt":"As participações de uma sociedade anônima (na forma de ações) podem ser negociadas na bolsa de valores. Essa é uma característica típica da AG como sociedade de capital, que a diferencia, por exemplo, de uma empresa individual (e.K.) ou de uma GmbH.","options":[{"text":"Die Geschäftsanteile könnten an der Börse gehandelt werden.","textPt":"As participações podem ser negociadas na bolsa de valores.","correct":true},{"text":"Nur ein Teil der Gesellschafter haftet unbeschränkt.","textPt":"Apenas parte dos sócios responde ilimitadamente.","correct":false},{"text":"Das Unternehmen wird von genau einer natürlichen Person allein geführt und haftet unbeschränkt mit ihrem Privatvermögen.","textPt":"A empresa é administrada por uma única pessoa física e responde ilimitadamente com seu patrimônio pessoal.","correct":false},{"text":"Für die Gründung ist kein Mindestkapital erforderlich.","textPt":"Para a fundação não é exigido capital mínimo.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Zu den Lieferanten der Infotec GmbH zählt unter anderem die Wireless GmbH. Welche Aussage trifft typischerweise auf eine GmbH wie die Wireless GmbH zu?","qPt":"Entre os fornecedores da Infotec GmbH está, entre outros, a Wireless GmbH. Qual afirmação é tipicamente correta sobre uma GmbH como a Wireless GmbH?","a":"Bei einer GmbH muss das Stammkapital (mindestens 25.000 EUR) in das Handelsregister eingetragen werden. Dies ist eine gesetzliche Anforderung für die Gründung einer Gesellschaft mit beschränkter Haftung (§ 5 GmbHG, § 10 GmbHG).","aPt":"Em uma GmbH, o capital social (no mínimo 25.000 EUR) deve ser registrado no registro comercial. Essa é uma exigência legal para a fundação de uma sociedade de responsabilidade limitada (§ 5 e § 10 da GmbHG).","options":[{"text":"Die Geschäftsanteile könnten an der Börse gehandelt werden.","textPt":"As participações podem ser negociadas na bolsa de valores.","correct":false},{"text":"Das Stammkapital muss in das Handelsregister eingetragen werden.","textPt":"O capital social deve ser registrado no registro comercial.","correct":true},{"text":"Nur ein Teil der Gesellschafter haftet unbeschränkt.","textPt":"Apenas parte dos sócios responde ilimitadamente.","correct":false},{"text":"Es ist keine Eintragung ins Handelsregister erforderlich.","textPt":"Não é necessário registro no registro comercial.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Zu den Lieferanten der Infotec GmbH zählt unter anderem die Peters KG. Welche Aussage trifft typischerweise auf eine Kommanditgesellschaft (KG) wie die Peters KG zu?","qPt":"Entre os fornecedores da Infotec GmbH está, entre outros, a Peters KG. Qual afirmação é tipicamente correta sobre uma sociedade em comandita (KG) como a Peters KG?","a":"Bei einer Kommanditgesellschaft haftet nur ein Teil der Gesellschafter unbeschränkt: Der Komplementär haftet unbeschränkt mit seinem gesamten Vermögen, während der Kommanditist nur beschränkt bis zur Höhe seiner Einlage haftet.","aPt":"Em uma sociedade em comandita, apenas parte dos sócios responde ilimitadamente: o sócio comanditado (Komplementär) responde ilimitadamente com todo o seu patrimônio, enquanto o sócio comanditário (Kommanditist) responde apenas de forma limitada, até o valor de sua participação.","options":[{"text":"Die Geschäftsanteile könnten an der Börse gehandelt werden.","textPt":"As participações podem ser negociadas na bolsa de valores.","correct":false},{"text":"Das Stammkapital muss in das Handelsregister eingetragen werden.","textPt":"O capital social deve ser registrado no registro comercial.","correct":false},{"text":"Nur ein Teil der Gesellschafter haftet unbeschränkt.","textPt":"Apenas parte dos sócios responde ilimitadamente.","correct":true},{"text":"Alle Gesellschafter haften stets nur beschränkt auf ihre Einlage.","textPt":"Todos os sócios sempre respondem apenas de forma limitada à sua participação.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Infotec GmbH führt gemeinsam mit zwei anderen Unternehmen einen Großauftrag aus, wobei jedes Unternehmen rechtlich und wirtschaftlich selbstständig bleibt und die Zusammenarbeit nur für dieses eine Projekt gilt. Um welche Unternehmensverbindung handelt es sich?","qPt":"A Infotec GmbH executa, em conjunto com outras duas empresas, um grande pedido, permanecendo cada empresa juridicamente e economicamente independente, sendo a colaboração válida apenas para esse projeto. De que tipo de associação empresarial se trata?","a":"Es handelt sich um eine Arbeitsgemeinschaft (ARGE). Dabei schließen sich rechtlich und wirtschaftlich selbstständige Unternehmen nur für ein bestimmtes, zeitlich begrenztes Projekt zusammen, ohne ihre Selbstständigkeit dauerhaft aufzugeben.","aPt":"Trata-se de um consórcio (Arbeitsgemeinschaft, ARGE). Nele, empresas juridicamente e economicamente independentes se unem apenas para um projeto específico e limitado no tempo, sem abrir mão permanentemente de sua independência.","options":[{"text":"Fusion","textPt":"Fusão.","correct":false},{"text":"Kartell","textPt":"Cartel.","correct":false},{"text":"Konzern","textPt":"Grupo econômico (Konzern).","correct":false},{"text":"Arbeitsgemeinschaft","textPt":"Consórcio (ARGE).","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Zwei Kunden der Infotec GmbH, die Byte GmbH und die IT-Sec GmbH, schließen sich zur neuen Byte-Sec GmbH zusammen; die beiden ursprünglichen Unternehmen gehen dabei rechtlich und wirtschaftlich unter. Um welche Unternehmensverbindung handelt es sich?","qPt":"Dois clientes da Infotec GmbH, a Byte GmbH e a IT-Sec GmbH, se unem para formar a nova Byte-Sec GmbH; as duas empresas originais deixam de existir juridicamente e economicamente. De que tipo de associação empresarial se trata?","a":"Es handelt sich um eine Fusion. Bei einer Fusion verschmelzen zwei oder mehr bisher rechtlich und wirtschaftlich selbstständige Unternehmen zu einem neuen Unternehmen, wobei die ursprünglichen Unternehmen ihre Selbstständigkeit vollständig verlieren.","aPt":"Trata-se de uma fusão. Em uma fusão, duas ou mais empresas até então juridicamente e economicamente independentes se unem para formar uma nova empresa, perdendo totalmente sua independência original.","options":[{"text":"Fusion","textPt":"Fusão.","correct":true},{"text":"Kartell","textPt":"Cartel.","correct":false},{"text":"Konzern","textPt":"Grupo econômico (Konzern).","correct":false},{"text":"Arbeitsgemeinschaft","textPt":"Consórcio (ARGE).","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Infotec GmbH vereinbart mit Wettbewerbern einheitliche Verkaufskonditionen, wobei alle beteiligten Unternehmen rechtlich und wirtschaftlich selbstständig bleiben. Um welche Unternehmensverbindung handelt es sich?","qPt":"A Infotec GmbH acorda com concorrentes condições de venda uniformes, permanecendo todas as empresas envolvidas juridicamente e economicamente independentes. De que tipo de associação empresarial se trata?","a":"Es handelt sich um ein Kartell. Bei einem Kartell vereinbaren rechtlich und wirtschaftlich selbstständige Unternehmen eine Beschränkung des Wettbewerbs (z. B. einheitliche Preise oder Konditionen), was in Deutschland grundsätzlich nach dem Gesetz gegen Wettbewerbsbeschränkungen (GWB) verboten ist.","aPt":"Trata-se de um cartel. Em um cartel, empresas juridicamente e economicamente independentes acordam uma restrição da concorrência (por exemplo, preços ou condições uniformes), o que na Alemanha é, em princípio, proibido pela Lei contra Restrições à Concorrência (GWB).","options":[{"text":"Fusion","textPt":"Fusão.","correct":false},{"text":"Kartell","textPt":"Cartel.","correct":true},{"text":"Konzern","textPt":"Grupo econômico (Konzern).","correct":false},{"text":"Arbeitsgemeinschaft","textPt":"Consórcio (ARGE).","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Infotec GmbH hat die Mehrheit an der SecureSoft AG übernommen; die SecureSoft AG bleibt dabei als eigenständiges Unternehmen rechtlich bestehen, steht aber unter der einheitlichen Leitung der Infotec GmbH. Um welche Unternehmensverbindung handelt es sich?","qPt":"A Infotec GmbH assumiu a maioria na SecureSoft AG; a SecureSoft AG permanece juridicamente como empresa independente, mas sob a direção unificada da Infotec GmbH. De que tipo de associação empresarial se trata?","a":"Es handelt sich um einen Konzern. Bei einem Konzern bleiben die beteiligten Unternehmen rechtlich selbstständig, verlieren aber ihre wirtschaftliche Selbstständigkeit, da sie unter der einheitlichen Leitung des herrschenden Unternehmens stehen (§ 18 AktG).","aPt":"Trata-se de um grupo econômico (Konzern). Em um Konzern, as empresas envolvidas permanecem juridicamente independentes, mas perdem sua independência econômica, pois ficam sob a direção unificada da empresa controladora (§ 18 da AktG).","options":[{"text":"Fusion","textPt":"Fusão.","correct":false},{"text":"Kartell","textPt":"Cartel.","correct":false},{"text":"Konzern","textPt":"Grupo econômico (Konzern).","correct":true},{"text":"Arbeitsgemeinschaft","textPt":"Consórcio (ARGE).","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Für die Infotec GmbH liegen für das Jahr 2019 folgende Quartalszahlen vor: Q1 Umsatz 280.000 EUR / Gewinn 11.200 EUR; Q2 Umsatz 320.000 EUR / Gewinn 19.200 EUR; Q3 Umsatz 260.000 EUR / Gewinn 13.000 EUR; Q4 Umsatz 340.000 EUR / Gewinn 23.800 EUR. In welchem Quartal erzielte die Infotec GmbH die höchste Umsatzrentabilität, und wie hoch war sie?","qPt":"Para a Infotec GmbH, temos os seguintes números trimestrais de 2019: T1 faturamento 280.000 EUR / lucro 11.200 EUR; T2 faturamento 320.000 EUR / lucro 19.200 EUR; T3 faturamento 260.000 EUR / lucro 13.000 EUR; T4 faturamento 340.000 EUR / lucro 23.800 EUR. Em qual trimestre a Infotec GmbH obteve a maior rentabilidade sobre as vendas, e qual foi seu valor?","a":"Die Umsatzrentabilität (Gewinn/Umsatz × 100) betrug Q1: 4 %, Q2: 6 %, Q3: 5 %, Q4: 23.800/340.000 = 7 %. Die höchste Umsatzrentabilität wurde im 4. Quartal mit 7 % erzielt.","aPt":"A rentabilidade sobre as vendas (lucro/faturamento × 100) foi: T1: 4%, T2: 6%, T3: 5%, T4: 23.800/340.000 = 7%. A maior rentabilidade foi obtida no 4º trimestre, com 7%.","options":[{"text":"Quartal 4, 7 %","textPt":"4º trimestre, 7%.","correct":true},{"text":"Quartal 2, 6 %","textPt":"2º trimestre, 6%.","correct":false},{"text":"Quartal 3, 5 %","textPt":"3º trimestre, 5%.","correct":false},{"text":"Quartal 1, 4 %","textPt":"1º trimestre, 4%.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Nachfrage der Kunden (Konsumenten) der Infotec GmbH hängt von verschiedenen Faktoren ab. Welche Aussage hierzu trifft zu?","qPt":"A demanda dos clientes (consumidores) da Infotec GmbH depende de diversos fatores. Qual afirmação sobre isso é correta?","a":"Der Bedarf der Konsumenten ist abhängig von der Kaufkraft. Ein vorhandenes Bedürfnis wird erst dann zu einem wirtschaftlich relevanten Bedarf, wenn der Konsument auch über die finanziellen Mittel (Kaufkraft) verfügt, es zu befriedigen.","aPt":"A necessidade dos consumidores depende do poder de compra. Um desejo existente só se torna uma necessidade economicamente relevante quando o consumidor também dispõe dos meios financeiros (poder de compra) para satisfazê-la.","options":[{"text":"Die Nachfrage der Konsumenten ist immer unabhängig vom Angebot.","textPt":"A demanda dos consumidores é sempre independente da oferta.","correct":false},{"text":"Die Menge der Bedürfnisse der Konsumenten entsprechen dem Bedarf.","textPt":"A quantidade de desejos dos consumidores corresponde à necessidade.","correct":false},{"text":"Der Bedarf der Konsumenten ist abhängig von der Kaufkraft.","textPt":"A necessidade dos consumidores depende do poder de compra.","correct":true},{"text":"Die Bedürfnisse der Konsumenten entsprechen dem Angebot.","textPt":"Os desejos dos consumidores correspondem à oferta.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Der Verbraucherschutz ist ein zentrales Element der sozialen Marktwirtschaft. Welche Aussage trifft auf den Verbraucherschutz zu?","qPt":"A proteção ao consumidor é um elemento central da economia social de mercado. Qual afirmação é correta sobre a proteção ao consumidor?","a":"Träger des Verbraucherschutzes sind unter anderem die Verbraucherzentralen. Sie beraten und informieren Verbraucher über ihre Rechte und setzen sich für deren Interessen gegenüber Unternehmen ein.","aPt":"Entre os responsáveis pela proteção ao consumidor estão, entre outros, os centros de defesa do consumidor (Verbraucherzentralen). Eles aconselham e informam os consumidores sobre seus direitos e defendem seus interesses perante as empresas.","options":[{"text":"Der Verbraucherschutz greift nur bei B2B-Geschäften.","textPt":"A proteção ao consumidor se aplica apenas a negócios B2B (entre empresas).","correct":false},{"text":"Träger des Verbraucherschutzes sind u. a. die Verbraucherzentralen.","textPt":"Entre os responsáveis pela proteção ao consumidor estão os centros de defesa do consumidor.","correct":true},{"text":"Der Verbraucherschutz gilt nur bei Versandgeschäften.","textPt":"A proteção ao consumidor vale apenas para vendas por correspondência.","correct":false},{"text":"Der Verbraucherschutz ist ein Zweig der Sozialversicherung.","textPt":"A proteção ao consumidor é um ramo do seguro social.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die 18-jährige Auszubildende Laura Peters bestellt bei der Infotec GmbH einen High-End-Gaming-PC für 4.999,00 EUR. Sie zahlt eine Anzahlung und vereinbart, den Rest in Monatsraten zu begleichen. Welche Aussage zu diesem Rechtsgeschäft trifft zu?","qPt":"A aprendiz Laura Peters, de 18 anos, encomenda na Infotec GmbH um PC gamer de ponta por 4.999,00 EUR. Ela paga uma entrada e combina quitar o restante em parcelas mensais. Qual afirmação sobre esse negócio jurídico é correta?","a":"Das Rechtsgeschäft ist gültig, weil Frau Peters unbeschränkt geschäftsfähig ist. Mit Vollendung des 18. Lebensjahres tritt die Volljährigkeit ein (§ 2 BGB), wodurch die unbeschränkte Geschäftsfähigkeit erreicht wird — unabhängig davon, dass sie Auszubildende ist.","aPt":"O negócio jurídico é válido, pois a Sra. Peters tem capacidade jurídica plena. Ao completar 18 anos, ocorre a maioridade (§ 2 do BGB), atingindo-se a plena capacidade de praticar atos jurídicos — independentemente de ela ser aprendiz.","options":[{"text":"Darlehensgeschäfte mit Auszubildenden sind nichtig.","textPt":"Negócios de empréstimo com aprendizes são nulos.","correct":false},{"text":"Das Rechtsgeschäft ist bis zur Zustimmung der gesetzlichen Vertreter schwebend unwirksam.","textPt":"O negócio jurídico é ineficaz, pendente de aprovação dos representantes legais.","correct":false},{"text":"Das Rechtsgeschäft ist gültig, weil Frau Peters unbeschränkt geschäftsfähig ist.","textPt":"O negócio jurídico é válido, pois a Sra. Peters tem capacidade jurídica plena.","correct":true},{"text":"Auszubildende sind generell geschäftsunfähig.","textPt":"Aprendizes são, em geral, incapazes de praticar atos jurídicos.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Infotec GmbH hat einen großen Kundenstamm mit privaten als auch gewerblichen Kunden. Welche der folgenden Kunden ist eine natürliche Person?","qPt":"A Infotec GmbH tem uma grande base de clientes, tanto particulares quanto empresariais. Qual dos seguintes clientes é uma pessoa física?","a":"Die Steuerberaterin Sophie Kropp ist als Einzelperson, die selbstständig tätig ist, eine natürliche Person. Im Gegensatz dazu sind Unternehmen wie GmbHs oder AGs juristische Personen, die rechtlich von ihren Eigentümern getrennt sind.","aPt":"A consultora fiscal Sophie Kropp, como pessoa física que atua de forma autônoma, é uma pessoa natural. Em contraste, empresas como GmbHs ou AGs são pessoas jurídicas, juridicamente separadas de seus proprietários.","options":[{"text":"Städtische Werke Nürnberg GmbH","textPt":"Städtische Werke Nürnberg GmbH (empresa municipal).","correct":false},{"text":"Steuerberaterin Sophie Kropp","textPt":"A consultora fiscal Sophie Kropp.","correct":true},{"text":"Interbyte AG","textPt":"Interbyte AG.","correct":false},{"text":"Staatliche Museen Berlin","textPt":"Museus Estatais de Berlim.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Geschäftsleitung der Infotec GmbH hat der Abteilungsleiterin Petra Fischer Prokura erteilt. Welche Aussage trifft auf die Prokura zu?","qPt":"A direção da Infotec GmbH concedeu procuração comercial (Prokura) à chefe de departamento Petra Fischer. Qual afirmação é correta sobre a Prokura?","a":"Frau Fischer muss zukünftig Geschäftsbriefe mit dem Zusatz 'pp.' oder 'ppa.' (per procura) unterzeichnen, um nach außen erkennbar zu machen, dass sie als Prokuristin im Rahmen ihrer gesetzlich sehr weitreichenden Vertretungsmacht handelt (§ 51 HGB).","aPt":"A Sra. Fischer deve, a partir de agora, assinar correspondências comerciais com o acréscimo 'pp.' ou 'ppa.' (por procuração), para deixar claro externamente que ela atua como procuradora dentro de seu poder de representação legalmente muito amplo (§ 51 do HGB).","options":[{"text":"Frau Fischer muss zukünftig Geschäftsbriefe mit dem Zusatz pp. oder ppa. unterzeichnen.","textPt":"A Sra. Fischer deve, a partir de agora, assinar correspondências comerciais com o acréscimo pp. ou ppa.","correct":true},{"text":"Frau Fischer darf das Unternehmen verkaufen.","textPt":"A Sra. Fischer pode vender a empresa.","correct":false},{"text":"Frau Fischer muss die Bilanz der Infotec GmbH unterzeichnen.","textPt":"A Sra. Fischer deve assinar o balanço da Infotec GmbH.","correct":false},{"text":"Frau Fischer darf neue Gesellschafter in die Infotec GmbH aufnehmen.","textPt":"A Sra. Fischer pode admitir novos sócios na Infotec GmbH.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Geschäftsleitung der Infotec GmbH hat der Abteilungsleiterin Petra Fischer Prokura erteilt. Welche weitere Aussage trifft auf die Prokura zu?","qPt":"A direção da Infotec GmbH concedeu procuração comercial (Prokura) à chefe de departamento Petra Fischer. Qual outra afirmação é correta sobre a Prokura?","a":"Frau Fischer muss als Prokuristin in das Handelsregister eingetragen werden (§ 53 HGB). Die Eintragung dient der Rechtssicherheit im Geschäftsverkehr, da Dritte so erkennen können, wer zur Vertretung des Unternehmens befugt ist.","aPt":"A Sra. Fischer deve ser registrada no registro comercial como procuradora (§ 53 do HGB). O registro serve à segurança jurídica nas relações comerciais, pois terceiros podem assim identificar quem está autorizado a representar a empresa.","options":[{"text":"Frau Fischer muss als Prokuristin in das Handelsregister eingetragen werden.","textPt":"A Sra. Fischer deve ser registrada no registro comercial como procuradora.","correct":true},{"text":"Frau Fischer darf ohne Weiteres Unternehmensgrundstücke verkaufen.","textPt":"A Sra. Fischer pode vender imóveis da empresa sem mais formalidades.","correct":false},{"text":"Frau Fischer muss die Bilanz der Infotec GmbH unterzeichnen.","textPt":"A Sra. Fischer deve assinar o balanço da Infotec GmbH.","correct":false},{"text":"Frau Fischer darf neue Gesellschafter in die Infotec GmbH aufnehmen.","textPt":"A Sra. Fischer pode admitir novos sócios na Infotec GmbH.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Infotec GmbH überträgt der IT-Systemkauffrau Sophie Schulz als Sachbearbeiterin im Einkauf die Beschaffung von Hardware bis zu einem Auftragswert von 10.000,00 EUR je Auftrag. Mit welcher Unterschrift muss Frau Schulz die zugehörigen Geschäftsbriefe unterzeichnen?","qPt":"A Infotec GmbH atribui à comerciante de sistemas de TI Sophie Schulz, como colaboradora de compras, a aquisição de hardware até um valor de pedido de 10.000,00 EUR por pedido. Com qual assinatura a Sra. Schulz deve assinar as correspondências comerciais correspondentes?","a":"Frau Schulz muss mit 'i. A. Schulz' (im Auftrag) unterzeichnen. Da sie nur eine beschränkte, auf bestimmte Geschäfte begrenzte Vollmacht besitzt und keine umfassende Prokura oder Handlungsvollmacht, zeigt der Zusatz 'i. A.' an, dass sie im Auftrag, nicht in eigener umfassender Vertretungsmacht handelt.","aPt":"A Sra. Schulz deve assinar com 'i. A. Schulz' (por ordem). Como ela possui apenas uma procuração limitada a determinados negócios, e não uma Prokura ou procuração comercial ampla, o acréscimo 'i. A.' indica que ela age por ordem, e não com poder de representação próprio e amplo.","options":[{"text":"Schulz (ohne Zusatz)","textPt":"Schulz (sem acréscimo).","correct":false},{"text":"ppa. Schulz","textPt":"ppa. Schulz.","correct":false},{"text":"i. H. Schulz","textPt":"i. H. Schulz.","correct":false},{"text":"i. A. Schulz","textPt":"i. A. Schulz.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Infotec GmbH gliedert einen Beschaffungsprozess für Hardware in mehrere Teilprozesse, die von mehreren Arbeitskräften ausgeführt werden. Um welche Form der Arbeitsteilung handelt es sich hierbei?","qPt":"A Infotec GmbH divide um processo de aquisição de hardware em vários subprocessos, executados por diversos trabalhadores. De que forma de divisão do trabalho se trata?","a":"Es handelt sich um eine betriebliche Arbeitsteilung (Arbeitszerlegung). Ein Gesamtprozess wird innerhalb desselben Betriebs in mehrere Teilschritte zerlegt, die von unterschiedlichen Mitarbeitern ausgeführt werden, um Effizienz und Spezialisierung zu erhöhen.","aPt":"Trata-se de uma divisão do trabalho dentro da empresa (Arbeitszerlegung). Um processo total é dividido, dentro da mesma empresa, em várias etapas, executadas por diferentes funcionários, para aumentar a eficiência e a especialização.","options":[{"text":"Die Infotec GmbH gliedert einen Schritt des Leistungsprozesses an die Byte GmbH aus (zwischenbetriebliche Arbeitsteilung).","textPt":"A Infotec GmbH terceiriza uma etapa do processo produtivo para a Byte GmbH (divisão do trabalho entre empresas).","correct":false},{"text":"Die Infotec GmbH organisiert mehrere Prozesse als 'supply chain' mit Lieferanten und Kunden (zwischenbetriebliche Arbeitsteilung).","textPt":"A Infotec GmbH organiza vários processos como 'supply chain' com fornecedores e clientes (divisão do trabalho entre empresas).","correct":false},{"text":"Die Infotec GmbH gliedert einen Beschaffungsprozess für Hardware in mehrere Teilprozesse, die von mehreren Arbeitskräften ausgeführt werden (betriebliche Arbeitsteilung).","textPt":"A Infotec GmbH divide um processo de aquisição de hardware em vários subprocessos, executados por diversos trabalhadores (divisão do trabalho dentro da empresa).","correct":true},{"text":"Die Infotec GmbH schließt eine Filiale in Niedersachsen (keine Arbeitsteilung).","textPt":"A Infotec GmbH fecha uma filial na Baixa Saxônia (não é divisão do trabalho).","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Volkswirtschaft der Bundesrepublik Deutschland profitiert von der Globalisierung. Welche Maßnahme fördert die Globalisierung?","qPt":"A economia da República Federal da Alemanha se beneficia da globalização. Qual medida favorece a globalização?","a":"Die EU schließt ein Freihandelsabkommen mit den südamerikanischen Staaten. Freihandelsabkommen bauen Zölle und Handelshemmnisse ab und fördern dadurch den internationalen Austausch von Waren und Dienstleistungen — ein zentrales Element der Globalisierung.","aPt":"A UE firma um acordo de livre comércio com os países sul-americanos. Acordos de livre comércio reduzem tarifas e barreiras comerciais, favorecendo assim o intercâmbio internacional de bens e serviços — um elemento central da globalização.","options":[{"text":"Die USA plant, für bestimmte Produkte aus der EU die Zölle zu erhöhen.","textPt":"Os EUA planejam aumentar as tarifas para determinados produtos da UE.","correct":false},{"text":"Die EU schließt ein Freihandelsabkommen mit den südamerikanischen Staaten.","textPt":"A UE firma um acordo de livre comércio com os países sul-americanos.","correct":true},{"text":"Die Infotec GmbH schließt ihre Niederlassungen in Asien.","textPt":"A Infotec GmbH fecha suas filiais na Ásia.","correct":false},{"text":"Ein deutsches Unternehmen zentralisiert die Fertigung in Deutschland.","textPt":"Uma empresa alemã centraliza a produção na Alemanha.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ziel der Wirtschaftspolitik der Bundesrepublik Deutschland ist das gesamtwirtschaftliche Gleichgewicht. Im Stabilitätsgesetz werden vier Ziele genannt, deren Zielerreichung an Indikatoren gemessen wird. Welchem Ziel entspricht der Indikator 'Arbeitslosenquote'?","qPt":"O objetivo da política econômica da República Federal da Alemanha é o equilíbrio macroeconômico geral. A Lei de Estabilidade menciona quatro objetivos, cujo alcance é medido por indicadores. A qual objetivo corresponde o indicador 'taxa de desemprego'?","a":"Die Arbeitslosenquote ist der Indikator für das Ziel 'Hoher Beschäftigungsstand'. Je niedriger die Arbeitslosenquote, desto besser wird dieses Ziel erreicht.","aPt":"A taxa de desemprego é o indicador do objetivo 'alto nível de emprego'. Quanto mais baixa a taxa de desemprego, melhor esse objetivo é alcançado.","options":[{"text":"Stabilität des Preisniveaus","textPt":"Estabilidade do nível de preços.","correct":false},{"text":"Hoher Beschäftigungsstand","textPt":"Alto nível de emprego.","correct":true},{"text":"Außenwirtschaftliches Gleichgewicht","textPt":"Equilíbrio das relações econômicas externas.","correct":false},{"text":"Stetiges und angemessenes Wirtschaftswachstum","textPt":"Crescimento econômico constante e adequado.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Im Stabilitätsgesetz werden vier wirtschaftspolitische Ziele genannt, deren Zielerreichung an Indikatoren gemessen wird. Welchem Ziel entspricht der Indikator 'Preisindex für Lebenshaltung'?","qPt":"A Lei de Estabilidade menciona quatro objetivos de política econômica, cujo alcance é medido por indicadores. A qual objetivo corresponde o indicador 'índice de preços ao consumidor'?","a":"Der Preisindex für Lebenshaltung ist der Indikator für das Ziel 'Stabilität des Preisniveaus'. Eine geringe Veränderung dieses Index zeigt eine stabile Preisentwicklung (niedrige Inflation) an.","aPt":"O índice de preços ao consumidor é o indicador do objetivo 'estabilidade do nível de preços'. Uma pequena variação desse índice indica uma evolução estável dos preços (baixa inflação).","options":[{"text":"Stabilität des Preisniveaus","textPt":"Estabilidade do nível de preços.","correct":true},{"text":"Hoher Beschäftigungsstand","textPt":"Alto nível de emprego.","correct":false},{"text":"Außenwirtschaftliches Gleichgewicht","textPt":"Equilíbrio das relações econômicas externas.","correct":false},{"text":"Stetiges und angemessenes Wirtschaftswachstum","textPt":"Crescimento econômico constante e adequado.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Im Stabilitätsgesetz werden vier wirtschaftspolitische Ziele genannt, deren Zielerreichung an Indikatoren gemessen wird. Welchem Ziel entspricht der Indikator 'Zuwachsrate des realen Bruttoinlandsprodukts'?","qPt":"A Lei de Estabilidade menciona quatro objetivos de política econômica, cujo alcance é medido por indicadores. A qual objetivo corresponde o indicador 'taxa de crescimento do PIB real'?","a":"Die Zuwachsrate des realen Bruttoinlandsprodukts ist der Indikator für das Ziel 'Stetiges und angemessenes Wirtschaftswachstum'. Sie misst, wie stark die Wirtschaftsleistung eines Landes von Jahr zu Jahr real wächst.","aPt":"A taxa de crescimento do PIB real é o indicador do objetivo 'crescimento econômico constante e adequado'. Ela mede o quanto o desempenho econômico de um país cresce, em termos reais, de um ano para o outro.","options":[{"text":"Stabilität des Preisniveaus","textPt":"Estabilidade do nível de preços.","correct":false},{"text":"Hoher Beschäftigungsstand","textPt":"Alto nível de emprego.","correct":false},{"text":"Außenwirtschaftliches Gleichgewicht","textPt":"Equilíbrio das relações econômicas externas.","correct":false},{"text":"Stetiges und angemessenes Wirtschaftswachstum","textPt":"Crescimento econômico constante e adequado.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Im Stabilitätsgesetz werden vier wirtschaftspolitische Ziele genannt, deren Zielerreichung an Indikatoren gemessen wird. Welchem Ziel entspricht der Indikator 'Außenbeitrag (Saldo von Handels- und Dienstleistungsbilanz)'?","qPt":"A Lei de Estabilidade menciona quatro objetivos de política econômica, cujo alcance é medido por indicadores. A qual objetivo corresponde o indicador 'saldo externo (balança comercial e de serviços)'?","a":"Der Außenbeitrag ist der Indikator für das Ziel 'Außenwirtschaftliches Gleichgewicht'. Er zeigt, ob und wie stark ein Land mehr exportiert als importiert (oder umgekehrt), und soll weder stark positiv noch stark negativ ausfallen.","aPt":"O saldo externo é o indicador do objetivo 'equilíbrio das relações econômicas externas'. Ele mostra se e em que medida um país exporta mais do que importa (ou o contrário), e não deve ser nem fortemente positivo nem fortemente negativo.","options":[{"text":"Stabilität des Preisniveaus","textPt":"Estabilidade do nível de preços.","correct":false},{"text":"Hoher Beschäftigungsstand","textPt":"Alto nível de emprego.","correct":false},{"text":"Außenwirtschaftliches Gleichgewicht","textPt":"Equilíbrio das relações econômicas externas.","correct":true},{"text":"Stetiges und angemessenes Wirtschaftswachstum","textPt":"Crescimento econômico constante e adequado.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Bundesregierung plant Maßnahmen zur Steigerung der Kaufkraft. Welche der folgenden staatlichen Maßnahmen wirkt sich positiv auf die Kaufkraft aus?","qPt":"O governo federal planeja medidas para aumentar o poder de compra. Qual das seguintes medidas estatais tem efeito positivo sobre o poder de compra?","a":"Die Erhöhung des Wohngeldes wirkt sich positiv auf die Kaufkraft aus, da den Betroffenen dadurch mehr finanziell verfügbares Einkommen für andere Ausgaben bleibt. Maßnahmen wie höhere Beitragssätze, eine höhere Beitragsbemessungsgrenze oder eine höhere Mehrwertsteuer würden dagegen die Kaufkraft senken.","aPt":"O aumento do auxílio-moradia (Wohngeld) tem efeito positivo sobre o poder de compra, pois sobra mais renda disponível para os beneficiários gastarem em outras necessidades. Já medidas como alíquotas de contribuição mais altas, um limite de cálculo de contribuição maior ou um IVA mais alto reduziriam o poder de compra.","options":[{"text":"Erhöhung der Importzölle für bestimmte Produkte aus den USA","textPt":"Aumento das tarifas de importação para certos produtos dos EUA.","correct":false},{"text":"Erhöhung des Beitragssatzes zur gesetzlichen Krankenversicherung","textPt":"Aumento da alíquota de contribuição ao seguro de saúde público.","correct":false},{"text":"Erhöhung des Wohngeldes","textPt":"Aumento do auxílio-moradia.","correct":true},{"text":"Erhöhung des Mehrwertsteuersatzes","textPt":"Aumento da alíquota do IVA.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Gramberg GmbH, ein Dienstleistungsunternehmen im Bereich der IT-Sicherheit, hat unter anderem die Baumschule Holthaus GmbH und die Biohof Landwirtschaft Dröse GmbH als Kunden. Welchem Wirtschaftssektor sind diese beiden Unternehmen zuzuordnen?","qPt":"A Gramberg GmbH, prestadora de serviços na área de segurança de TI, tem como clientes, entre outros, a Baumschule Holthaus GmbH (viveiro de plantas) e a Biohof Landwirtschaft Dröse GmbH (fazenda agrícola). A qual setor econômico pertencem essas duas empresas?","a":"Beide Unternehmen gehören zum primären Sektor, da sie Urprodukte durch Gewinnung von Naturstoffen (Landwirtschaft, Pflanzenanbau) erzeugen. Der primäre Sektor umfasst Land- und Forstwirtschaft, Fischerei und Bergbau.","aPt":"Ambas as empresas pertencem ao setor primário, pois produzem bens primários por meio da extração de recursos naturais (agricultura, cultivo de plantas). O setor primário abrange agricultura e silvicultura, pesca e mineração.","options":[{"text":"Primärer Sektor","textPt":"Setor primário.","correct":true},{"text":"Sekundärer Sektor","textPt":"Setor secundário.","correct":false},{"text":"Tertiärer Sektor","textPt":"Setor terciário.","correct":false},{"text":"Quartärer Sektor","textPt":"Setor quaternário.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Zu den Kunden der Gramberg GmbH zählen unter anderem die Metallbau Steinemann GmbH und die Krieger GmbH, Hoch- und Tiefbau. Welchem Wirtschaftssektor sind diese beiden Unternehmen zuzuordnen?","qPt":"Entre os clientes da Gramberg GmbH estão, entre outros, a Metallbau Steinemann GmbH (metalurgia) e a Krieger GmbH, construção civil. A qual setor econômico pertencem essas duas empresas?","a":"Beide Unternehmen gehören zum sekundären Sektor (industriell-gewerblicher Sektor), da sie Sachgüter durch Be- und Verarbeitung herstellen (Metallverarbeitung, Hoch- und Tiefbau).","aPt":"Ambas as empresas pertencem ao setor secundário (setor industrial), pois produzem bens materiais por meio do processamento e transformação (metalurgia, construção civil).","options":[{"text":"Primärer Sektor","textPt":"Setor primário.","correct":false},{"text":"Sekundärer Sektor","textPt":"Setor secundário.","correct":true},{"text":"Tertiärer Sektor","textPt":"Setor terciário.","correct":false},{"text":"Quartärer Sektor","textPt":"Setor quaternário.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Zu den Kunden der Gramberg GmbH zählen unter anderem das Elektrokaufhaus Meier e. K. und die Rechtsanwälte Kook & Partner. Welchem Wirtschaftssektor sind diese beiden Unternehmen zuzuordnen?","qPt":"Entre os clientes da Gramberg GmbH estão, entre outros, a loja de eletrônicos Elektrokaufhaus Meier e. K. e o escritório de advocacia Rechtsanwälte Kook & Partner. A qual setor econômico pertencem essas duas empresas?","a":"Beide Unternehmen gehören zum tertiären Sektor (Dienstleistungssektor), da sie Dienstleistungen anbieten (Handel bzw. Rechtsberatung) und keine eigenen Sachgüter herstellen.","aPt":"Ambas as empresas pertencem ao setor terciário (setor de serviços), pois oferecem serviços (comércio ou assessoria jurídica) e não produzem bens materiais próprios.","options":[{"text":"Primärer Sektor","textPt":"Setor primário.","correct":false},{"text":"Sekundärer Sektor","textPt":"Setor secundário.","correct":false},{"text":"Tertiärer Sektor","textPt":"Setor terciário.","correct":true},{"text":"Quartärer Sektor","textPt":"Setor quaternário.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Das Leitungssystem der Gramberg GmbH zeigt folgendes Schema: Zwei übergeordnete Leitungsstellen sind jeweils durch Linien mit allen vier unterstellten Stellen verbunden, sodass jede unterstellte Stelle Weisungen von mehreren Vorgesetzten gleichzeitig erhalten kann. Nach welchem Leitungssystem arbeitet die Gramberg GmbH?","qPt":"O organograma da Gramberg GmbH mostra o seguinte esquema: duas posições de chefia superiores estão ligadas, por linhas, a todas as quatro posições subordinadas, de modo que cada posição subordinada pode receber ordens de vários superiores ao mesmo tempo. Segundo qual sistema de direção a Gramberg GmbH trabalha?","a":"Es handelt sich um ein Mehrliniensystem. Dabei erhält jede untergeordnete Stelle Anweisungen von mehreren übergeordneten Stellen (Mehrfachunterstellung), im Gegensatz zum Einliniensystem, bei dem jede Stelle nur einen einzigen direkten Vorgesetzten hat.","aPt":"Trata-se de um sistema de múltiplas linhas (Mehrliniensystem). Nele, cada posição subordinada recebe ordens de vários superiores (subordinação múltipla), ao contrário do sistema de linha única (Einliniensystem), em que cada posição tem apenas um único superior direto.","options":[{"text":"Einliniensystem","textPt":"Sistema de linha única.","correct":false},{"text":"Stabsystem","textPt":"Sistema de assessoria (staff).","correct":false},{"text":"Mehrliniensystem","textPt":"Sistema de múltiplas linhas.","correct":true},{"text":"Stabliniensystem","textPt":"Sistema de linha-assessoria.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Gramberg GmbH hat mit Stefan Brüning einen Einzelarbeitsvertrag geschlossen. Welche Aussage ist in diesem Zusammenhang zutreffend?","qPt":"A Gramberg GmbH firmou um contrato de trabalho individual com Stefan Brüning. Qual afirmação é correta nesse contexto?","a":"Ein Einzelarbeitsvertrag ist gültig, wenn das vereinbarte Arbeitsentgelt über dem tarifvertraglich geregelten liegt. Dies folgt aus dem Günstigkeitsprinzip (§ 4 Abs. 3 TVG): Individualvereinbarungen dürfen zugunsten des Arbeitnehmers von einem Tarifvertrag abweichen, aber nicht zu dessen Ungunsten.","aPt":"Um contrato de trabalho individual é válido quando a remuneração acordada for superior à prevista na convenção coletiva. Isso decorre do princípio da condição mais favorável (§ 4, parágrafo 3, do TVG): acordos individuais podem se afastar de uma convenção coletiva em benefício do trabalhador, mas não em seu prejuízo.","options":[{"text":"Ein Einzelarbeitsvertrag ist gültig, wenn das vereinbarte Arbeitsentgelt über dem tarifvertraglich geregelten liegt.","textPt":"Um contrato de trabalho individual é válido quando a remuneração acordada for superior à prevista na convenção coletiva.","correct":true},{"text":"Ein Einzelarbeitsvertrag kann nur geschlossen werden, wenn für die Gramberg GmbH kein gültiger Tarifvertrag vorliegt.","textPt":"Um contrato de trabalho individual só pode ser firmado se não houver convenção coletiva vigente para a Gramberg GmbH.","correct":false},{"text":"Ein Einzelarbeitsvertrag kann nur mit Zustimmung der Gewerkschaft geschlossen werden.","textPt":"Um contrato de trabalho individual só pode ser firmado com o consentimento do sindicato.","correct":false},{"text":"Ein Einzelarbeitsvertrag darf für höchstens zwei Jahre geschlossen werden.","textPt":"Um contrato de trabalho individual só pode ser firmado por no máximo dois anos.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Hans Baumgart, 38 Jahre, Vater von zwei Kindern, erhält aus betriebsbedingten Gründen die Kündigung. Da er diese für sozial ungerechtfertigt hält, wendet er sich an den Betriebsrat. Welche Aussage zu den Kündigungsmodalitäten ist richtig?","qPt":"Hans Baumgart, 38 anos, pai de dois filhos, recebe uma demissão por motivos operacionais da empresa. Como considera a demissão socialmente injustificada, ele recorre ao conselho de empresa. Qual afirmação sobre as modalidades de demissão é correta?","a":"Der Betriebsrat muss vor jeder Kündigung angehört werden (§ 102 BetrVG); eine ohne Anhörung ausgesprochene Kündigung ist unwirksam. Hält Herr Baumgart die Kündigung für sozial ungerechtfertigt, kann er innerhalb von drei Wochen nach Zugang der Kündigung Kündigungsschutzklage beim zuständigen Arbeitsgericht erheben (§ 4 KSchG).","aPt":"O conselho de empresa deve ser ouvido antes de qualquer demissão (§ 102 da BetrVG); uma demissão feita sem essa consulta é inválida. Se o Sr. Baumgart considerar a demissão socialmente injustificada, ele pode entrar com uma ação de proteção contra demissão no tribunal do trabalho competente dentro de três semanas após o recebimento da demissão (§ 4 da KSchG).","options":[{"text":"Der Betriebsrat muss angehört werden. Hält der Betriebsrat die Kündigung für ungerechtfertigt, dann darf der Arbeitgeber nicht kündigen.","textPt":"O conselho de empresa deve ser ouvido. Se ele considerar a demissão injustificada, o empregador não pode demitir.","correct":false},{"text":"Der Betriebsrat muss angehört werden. Herr Baumgart kann innerhalb von drei Wochen nach Zugang der Kündigung Klage beim zuständigen Arbeitsgericht einreichen.","textPt":"O conselho de empresa deve ser ouvido. O Sr. Baumgart pode entrar com ação no tribunal do trabalho competente dentro de três semanas após o recebimento da demissão.","correct":true},{"text":"Der Betriebsrat muss in Kündigungsfragen nicht angehört werden.","textPt":"O conselho de empresa não precisa ser ouvido em questões de demissão.","correct":false},{"text":"Mit Zustimmung des Betriebsrats kann die Kündigungsfrist kürzer ausfallen.","textPt":"Com o consentimento do conselho de empresa, o prazo de aviso prévio pode ser mais curto.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Michael Kuper, ein Mitarbeiter der Gramberg GmbH, ist erkrankt und muss operiert werden. Er wird insgesamt fünf Wochen nicht im Betrieb arbeiten können. Welche Aussage trifft auf die geschilderte Situation zu?","qPt":"Michael Kuper, funcionário da Gramberg GmbH, está doente e precisa ser operado. Ele ficará um total de cinco semanas sem poder trabalhar na empresa. Qual afirmação é correta sobre a situação descrita?","a":"Herr Kuper erhält für die Dauer von bis zu sechs Wochen weiterhin sein Bruttoentgelt von der Gramberg GmbH (Entgeltfortzahlung im Krankheitsfall nach § 3 EFZG). Da seine Erkrankung fünf Wochen dauert, liegt er innerhalb dieses Zeitraums.","aPt":"O Sr. Kuper continua recebendo seu salário bruto da Gramberg GmbH por até seis semanas (continuidade da remuneração em caso de doença, § 3 da EFZG). Como sua doença dura cinco semanas, ele está dentro desse período.","options":[{"text":"Herr Kuper erhält weiterhin von der Gramberg GmbH sein Bruttoentgelt.","textPt":"O Sr. Kuper continua recebendo seu salário bruto da Gramberg GmbH.","correct":true},{"text":"Herr Kuper erhält von der gesetzlichen Krankenkasse Krankengeld.","textPt":"O Sr. Kuper recebe auxílio-doença do seguro de saúde público.","correct":false},{"text":"Herr Kuper erhält von der Berufsgenossenschaft ein Übergangsgeld.","textPt":"O Sr. Kuper recebe um auxílio de transição da associação profissional (Berufsgenossenschaft).","correct":false},{"text":"Herr Kuper erhält von der Bundesagentur für Arbeit eine Entgeltersatzleistung.","textPt":"O Sr. Kuper recebe um benefício substitutivo de renda da Agência Federal do Trabalho.","correct":false}]},
