{"cat":"wiso","sub":"pruefung","q":"Michael Butt hat mit der Gramberg GmbH einen schriftlichen Arbeitsvertrag geschlossen. Welcher Bestandteil seines Arbeitsvertrags bindet die Gramberg GmbH an kollektives Arbeitsrecht?","qPt":"Michael Butt firmou um contrato de trabalho por escrito com a Gramberg GmbH. Qual parte de seu contrato de trabalho vincula a Gramberg GmbH ao direito coletivo do trabalho?","a":"Die reguläre wöchentliche Arbeitszeit beträgt gemäß Tarifvertrag 38,5 Stunden. Diese Regelung ergibt sich aus dem für die Gramberg GmbH geltenden Tarifvertrag und bindet das Unternehmen somit an kollektives (tarifliches) Arbeitsrecht.","aPt":"A jornada semanal regular, segundo a convenção coletiva, é de 38,5 horas. Essa regra decorre da convenção coletiva aplicável à Gramberg GmbH e, assim, vincula a empresa ao direito coletivo (tarifário) do trabalho.","options":[{"text":"Herr Butt bekommt einen Dienstwagen gestellt.","textPt":"O Sr. Butt recebe um carro da empresa.","correct":false},{"text":"Er arbeitet als Sachbearbeiter im Kundenservice.","textPt":"Ele trabalha como colaborador no atendimento ao cliente.","correct":false},{"text":"Die reguläre wöchentliche Arbeitszeit beträgt gemäß Tarifvertrag 38,5 Stunden.","textPt":"A jornada semanal regular, segundo a convenção coletiva, é de 38,5 horas.","correct":true},{"text":"Die Gramberg GmbH gewährt einen monatlichen Fahrtkostenzuschuss von 100,00 EUR.","textPt":"A Gramberg GmbH concede um auxílio-transporte mensal de 100,00 EUR.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In einer Stellenanzeige der Gramberg GmbH steht, dass eine 'IT-Kauffrau' gesucht wird (ausschließlich weibliche Form, ohne Hinweis auf andere Geschlechter). In welchem Gesetz ist ein solcher Sachverhalt geregelt?","qPt":"Em um anúncio de emprego da Gramberg GmbH, está escrito que se procura uma 'IT-Kauffrau' (forma exclusivamente feminina, sem menção a outros gêneros). Em qual lei esse fato é regulamentado?","a":"Dieser Sachverhalt ist im Allgemeinen Gleichbehandlungsgesetz (AGG) geregelt. Eine geschlechtsspezifische Stellenausschreibung ohne den Zusatz '(m/w/d)' verstößt gegen das Diskriminierungsverbot wegen des Geschlechts.","aPt":"Esse fato é regulamentado na Lei Geral de Igualdade de Tratamento (AGG). Um anúncio de emprego específico de gênero, sem o acréscimo '(m/w/d)', viola a proibição de discriminação por sexo.","options":[{"text":"Kündigungsschutzgesetz","textPt":"Lei de Proteção contra Demissão.","correct":false},{"text":"Allgemeines Gleichbehandlungsgesetz","textPt":"Lei Geral de Igualdade de Tratamento.","correct":true},{"text":"Betriebsverfassungsgesetz","textPt":"Lei de Constituição das Empresas.","correct":false},{"text":"Arbeitszeitgesetz","textPt":"Lei da Jornada de Trabalho.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der Gramberg GmbH darf die werktägliche Arbeitszeit der Arbeitnehmer acht Stunden nicht überschreiten. In welchem Gesetz ist dieser Sachverhalt geregelt?","qPt":"Na Gramberg GmbH, a jornada diária de trabalho dos funcionários não pode ultrapassar oito horas. Em qual lei esse fato é regulamentado?","a":"Dieser Sachverhalt ist im Arbeitszeitgesetz (ArbZG) geregelt. § 3 ArbZG legt die werktägliche Höchstarbeitszeit auf grundsätzlich acht Stunden fest, mit der Möglichkeit einer vorübergehenden Verlängerung auf bis zu zehn Stunden bei entsprechendem Ausgleich.","aPt":"Esse fato é regulamentado na Lei da Jornada de Trabalho (ArbZG). O § 3 da ArbZG fixa a jornada diária máxima em, em princípio, oito horas, com a possibilidade de extensão temporária até dez horas mediante compensação adequada.","options":[{"text":"Kündigungsschutzgesetz","textPt":"Lei de Proteção contra Demissão.","correct":false},{"text":"Allgemeines Gleichbehandlungsgesetz","textPt":"Lei Geral de Igualdade de Tratamento.","correct":false},{"text":"Betriebsverfassungsgesetz","textPt":"Lei de Constituição das Empresas.","correct":false},{"text":"Arbeitszeitgesetz","textPt":"Lei da Jornada de Trabalho.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der Gramberg GmbH ist eine betriebsbedingte Kündigung rechtsunwirksam, wenn eine Schwerbehinderung des betroffenen Mitarbeiters nicht ausreichend berücksichtigt wurde. In welchem Gesetz ist dieser Sachverhalt geregelt?","qPt":"Na Gramberg GmbH, uma demissão por motivos operacionais é juridicamente inválida se uma deficiência grave do funcionário afetado não tiver sido suficientemente considerada. Em qual lei esse fato é regulamentado?","a":"Dieser Sachverhalt ist im Kündigungsschutzgesetz (KSchG) geregelt. Bei einer betriebsbedingten Kündigung muss der Arbeitgeber im Rahmen der Sozialauswahl (§ 1 Abs. 3 KSchG) auch eine etwaige Schwerbehinderung des Arbeitnehmers berücksichtigen.","aPt":"Esse fato é regulamentado na Lei de Proteção contra Demissão (KSchG). Em uma demissão por motivos operacionais, o empregador deve considerar, na seleção social (§ 1, parágrafo 3, da KSchG), também uma eventual deficiência grave do funcionário.","options":[{"text":"Kündigungsschutzgesetz","textPt":"Lei de Proteção contra Demissão.","correct":true},{"text":"Allgemeines Gleichbehandlungsgesetz","textPt":"Lei Geral de Igualdade de Tratamento.","correct":false},{"text":"Betriebsverfassungsgesetz","textPt":"Lei de Constituição das Empresas.","correct":false},{"text":"Arbeitszeitgesetz","textPt":"Lei da Jornada de Trabalho.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der Gramberg GmbH werden Bewerber mit Behinderungen bei gleicher Eignung bevorzugt eingestellt. In welchem Gesetz ist dieser Sachverhalt geregelt?","qPt":"Na Gramberg GmbH, candidatos com deficiência são contratados preferencialmente em caso de igual qualificação. Em qual lei esse fato é regulamentado?","a":"Dieser Sachverhalt ist im Allgemeinen Gleichbehandlungsgesetz (AGG) geregelt. Das AGG soll Benachteiligungen u. a. wegen einer Behinderung verhindern und erlaubt bzw. fördert positive Maßnahmen wie eine Bevorzugung bei gleicher Eignung.","aPt":"Esse fato é regulamentado na Lei Geral de Igualdade de Tratamento (AGG). A AGG busca prevenir desvantagens, entre outras, por deficiência, e permite ou incentiva medidas positivas, como a preferência em caso de igual qualificação.","options":[{"text":"Kündigungsschutzgesetz","textPt":"Lei de Proteção contra Demissão.","correct":false},{"text":"Allgemeines Gleichbehandlungsgesetz","textPt":"Lei Geral de Igualdade de Tratamento.","correct":true},{"text":"Betriebsverfassungsgesetz","textPt":"Lei de Constituição das Empresas.","correct":false},{"text":"Arbeitszeitgesetz","textPt":"Lei da Jornada de Trabalho.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Gramberg GmbH informiert den Betriebsrat über die geplante Schließung einer Filiale. In welchem Gesetz ist dieser Sachverhalt geregelt?","qPt":"A Gramberg GmbH informa o conselho de empresa sobre o fechamento planejado de uma filial. Em qual lei esse fato é regulamentado?","a":"Dieser Sachverhalt ist im Betriebsverfassungsgesetz (BetrVG) geregelt. Die Schließung einer Filiale stellt eine Betriebsänderung dar (§ 111 BetrVG), über die der Unternehmer den Betriebsrat rechtzeitig und umfassend informieren muss.","aPt":"Esse fato é regulamentado na Lei de Constituição das Empresas (BetrVG). O fechamento de uma filial constitui uma alteração da empresa (§ 111 da BetrVG), sobre a qual o empresário deve informar o conselho de empresa de forma tempestiva e completa.","options":[{"text":"Kündigungsschutzgesetz","textPt":"Lei de Proteção contra Demissão.","correct":false},{"text":"Allgemeines Gleichbehandlungsgesetz","textPt":"Lei Geral de Igualdade de Tratamento.","correct":false},{"text":"Betriebsverfassungsgesetz","textPt":"Lei de Constituição das Empresas.","correct":true},{"text":"Arbeitszeitgesetz","textPt":"Lei da Jornada de Trabalho.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Gramberg GmbH will eine neue Mitarbeiterin zunächst befristet für ein Jahr einstellen. Welche Aussage über befristete Arbeitsverträge trifft zu?","qPt":"A Gramberg GmbH quer contratar uma nova funcionária inicialmente por prazo determinado de um ano. Qual afirmação sobre contratos de trabalho por prazo determinado é correta?","a":"Der befristete Arbeitsvertrag endet mit Ablauf der vereinbarten Frist, ohne dass es einer Kündigung bedarf (§ 15 Abs. 1 TzBfG). Eine ordentliche Kündigung während der Laufzeit ist nur möglich, wenn sie im Vertrag oder im anwendbaren Tarifvertrag ausdrücklich vorgesehen ist.","aPt":"O contrato de trabalho por prazo determinado termina com o fim do prazo acordado, sem necessidade de aviso prévio formal (§ 15, parágrafo 1, da TzBfG). Uma rescisão ordinária durante a vigência só é possível se estiver expressamente prevista no contrato ou na convenção coletiva aplicável.","options":[{"text":"Befristete Arbeitsverträge können vom Arbeitgeber während der Laufzeit nicht gekündigt werden.","textPt":"Contratos por prazo determinado não podem ser rescindidos pelo empregador durante a vigência.","correct":false},{"text":"Der befristete Arbeitsvertrag endet mit Ablauf der Frist, ohne dass es einer Kündigung bedarf.","textPt":"O contrato por prazo determinado termina com o fim do prazo, sem necessidade de aviso prévio formal.","correct":true},{"text":"Für befristete Arbeitsverträge gelten die tarifvertraglichen Vereinbarungen nicht.","textPt":"Para contratos por prazo determinado, as regras da convenção coletiva não se aplicam.","correct":false},{"text":"Bei befristeten Arbeitsverträgen gibt es keine Lohnfortzahlung im Krankheitsfall.","textPt":"Em contratos por prazo determinado não há continuidade da remuneração em caso de doença.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Gramberg GmbH nimmt an einer Messe teil. Beim Aufbau des Messestandes fällt eine Mitarbeiterin vom Leiter und bricht sich das rechte Bein. Welche Institution muss für die Heilbehandlungskosten aufkommen, wenn die Unfallverhütungsvorschriften eingehalten wurden?","qPt":"A Gramberg GmbH participa de uma feira comercial. Durante a montagem do estande, uma funcionária cai da escada e quebra a perna direita. Qual instituição deve arcar com os custos de tratamento médico, desde que as normas de prevenção de acidentes tenham sido cumpridas?","a":"Zuständig ist die Berufsgenossenschaft, der die Gramberg GmbH angehört. Der Unfall ereignete sich während einer versicherten betrieblichen Tätigkeit (Messeaufbau im Auftrag des Arbeitgebers) und ist somit ein Arbeitsunfall im Sinne der gesetzlichen Unfallversicherung (§ 8 SGB VII).","aPt":"A responsável é a associação profissional (Berufsgenossenschaft) à qual a Gramberg GmbH pertence. O acidente ocorreu durante uma atividade profissional segurada (montagem do estande a mando do empregador) e, portanto, é um acidente de trabalho no sentido do seguro de acidentes obrigatório (§ 8 do SGB VII).","options":[{"text":"Die Krankenkasse, bei der die Mitarbeiterin versichert ist.","textPt":"A caixa de saúde onde a funcionária é segurada.","correct":false},{"text":"Die private Unfallversicherung der Mitarbeiterin.","textPt":"O seguro de acidentes privado da funcionária.","correct":false},{"text":"Die Haftpflichtversicherung der Messegesellschaft.","textPt":"O seguro de responsabilidade civil da organizadora da feira.","correct":false},{"text":"Die Berufsgenossenschaft, der die Gramberg GmbH angehört.","textPt":"A associação profissional à qual a Gramberg GmbH pertence.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Gramberg GmbH musste den Betrieb auf behördliche Anordnung vorübergehend schließen. Der Geschäftsbetrieb ruht, die Mitarbeiter dürfen die Geschäftsräume für die Dauer der Schließung nicht mehr betreten. Welche Aussage ist in diesem Zusammenhang zutreffend?","qPt":"A Gramberg GmbH teve que fechar temporariamente suas operações por ordem das autoridades. O negócio fica paralisado e os funcionários não podem mais entrar nas instalações durante o fechamento. Qual afirmação é correta nesse contexto?","a":"Die Gramberg GmbH kann für die Dauer der Schließung bei der Bundesagentur für Arbeit Kurzarbeitergeld beantragen. Kurzarbeitergeld federn einen vorübergehenden, unvermeidbaren Arbeitsausfall ab und dienen der Vermeidung von Kündigungen.","aPt":"A Gramberg GmbH pode solicitar à Agência Federal do Trabalho o auxílio por jornada reduzida (Kurzarbeitergeld) durante o fechamento. Esse benefício amortece uma perda de trabalho temporária e inevitável, e serve para evitar demissões.","options":[{"text":"Die Gramberg GmbH kann für die Dauer der Schließung bei der Bundesagentur für Arbeit Kurzarbeitergeld beantragen.","textPt":"A Gramberg GmbH pode solicitar à Agência Federal do Trabalho o auxílio por jornada reduzida durante o fechamento.","correct":true},{"text":"Die Gehaltszahlungen für die Mitarbeiter muss die Behörde übernehmen, die die Schließung angeordnet hat.","textPt":"Os pagamentos de salário aos funcionários devem ser assumidos pela autoridade que ordenou o fechamento.","correct":false},{"text":"Die Gramberg GmbH muss allen Mitarbeitern kündigen.","textPt":"A Gramberg GmbH deve demitir todos os funcionários.","correct":false},{"text":"Die Gramberg GmbH hat für die Dauer der Schließung einen unbegrenzten Kreditanspruch an die Landesregierung.","textPt":"A Gramberg GmbH tem direito a um crédito ilimitado junto ao governo estadual durante o fechamento.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Gramberg GmbH ist Mitglied eines Arbeitgeberverbandes. Welche Verpflichtung ergibt sich unter anderem daraus?","qPt":"A Gramberg GmbH é membro de uma associação patronal. Qual obrigação decorre disso, entre outras?","a":"Die Gramberg GmbH muss mindestens Tariflöhne zahlen. Als tarifgebundenes Mitglied eines Arbeitgeberverbandes ist sie verpflichtet, die im Tarifvertrag vereinbarten Mindestlöhne/-gehälter einzuhalten; höhere Löhne darf sie freiwillig zahlen.","aPt":"A Gramberg GmbH deve pagar, no mínimo, os salários previstos na convenção coletiva. Como membro vinculado à convenção coletiva de uma associação patronal, ela é obrigada a cumprir os salários mínimos acordados na convenção; salários mais altos podem ser pagos voluntariamente.","options":[{"text":"Die Gramberg GmbH muss Lohnabrechnungen beim Verband prüfen lassen.","textPt":"A Gramberg GmbH deve mandar verificar os contracheques junto à associação.","correct":false},{"text":"Die Gramberg GmbH darf höchstens Tariflöhne zahlen.","textPt":"A Gramberg GmbH pode pagar, no máximo, os salários da convenção coletiva.","correct":false},{"text":"Die Gramberg GmbH nimmt direkt an Tarifverhandlungen teil.","textPt":"A Gramberg GmbH participa diretamente das negociações coletivas.","correct":false},{"text":"Die Gramberg GmbH muss mindestens Tariflöhne zahlen.","textPt":"A Gramberg GmbH deve pagar, no mínimo, os salários da convenção coletiva.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"In der Gramberg GmbH wurde ein Betriebsrat gewählt. Bei welcher der folgenden Angelegenheiten hat der Betriebsrat ein zwingendes Mitbestimmungsrecht: 'Beginn und Ende der täglichen Arbeitszeit'?","qPt":"Na Gramberg GmbH foi eleito um conselho de empresa (Betriebsrat). O conselho de empresa tem direito de cogestão obrigatória sobre o seguinte assunto: 'início e fim da jornada diária de trabalho'?","a":"Ja, die Festlegung von Beginn und Ende der täglichen Arbeitszeit unterliegt der zwingenden Mitbestimmung des Betriebsrats nach § 87 Abs. 1 Nr. 2 BetrVG, da sie die betriebliche Ordnung und das Verhalten der Arbeitnehmer im Betrieb unmittelbar betrifft.","aPt":"Sim, a definição do início e do fim da jornada diária de trabalho está sujeita à cogestão obrigatória do conselho de empresa, conforme o § 87, parágrafo 1, nº 2, da BetrVG, pois afeta diretamente a organização da empresa e o comportamento dos funcionários.","options":[{"text":"Ja, Beginn und Ende der täglichen Arbeitszeit sind mitbestimmungspflichtig.","textPt":"Sim, o início e o fim da jornada diária de trabalho estão sujeitos à cogestão.","correct":true},{"text":"Nein, die Festlegung der täglichen Arbeitszeit liegt allein beim Arbeitgeber.","textPt":"Não, a definição da jornada diária de trabalho cabe exclusivamente ao empregador.","correct":false},{"text":"Nein, hierfür ist ausschließlich die Gewerkschaft zuständig.","textPt":"Não, apenas o sindicato é responsável por isso.","correct":false},{"text":"Nein, dies betrifft nur eine freiwillige Anhörung ohne Mitbestimmungsrecht.","textPt":"Não, isso envolve apenas uma consulta voluntária, sem direito de cogestão.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In der Gramberg GmbH wurde ein Betriebsrat gewählt. Hat der Betriebsrat ein zwingendes Mitbestimmungsrecht bei der 'Einführung von Arbeitszeiterfassungsgeräten'?","qPt":"Na Gramberg GmbH foi eleito um conselho de empresa. O conselho de empresa tem direito de cogestão obrigatória na 'introdução de dispositivos de registro de ponto'?","a":"Ja, die Einführung von Arbeitszeiterfassungsgeräten unterliegt der zwingenden Mitbestimmung des Betriebsrats nach § 87 Abs. 1 Nr. 6 BetrVG, da es sich um technische Einrichtungen handelt, die zur Überwachung von Verhalten oder Leistung der Arbeitnehmer geeignet sind.","aPt":"Sim, a introdução de dispositivos de registro de ponto está sujeita à cogestão obrigatória do conselho de empresa, conforme o § 87, parágrafo 1, nº 6, da BetrVG, pois se trata de dispositivos técnicos aptos a monitorar o comportamento ou o desempenho dos funcionários.","options":[{"text":"Ja, die Einführung von Arbeitszeiterfassungsgeräten ist mitbestimmungspflichtig.","textPt":"Sim, a introdução de dispositivos de registro de ponto está sujeita à cogestão.","correct":true},{"text":"Nein, technische Geräte unterliegen nie der Mitbestimmung.","textPt":"Não, dispositivos técnicos nunca estão sujeitos à cogestão.","correct":false},{"text":"Nein, dies ist eine reine unternehmerische Entscheidung ohne Mitbestimmungsrecht.","textPt":"Não, trata-se de uma decisão puramente empresarial, sem direito de cogestão.","correct":false},{"text":"Nein, hierfür ist nur eine Information des Betriebsrats erforderlich.","textPt":"Não, basta apenas informar o conselho de empresa.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Im Rahmen eines Arbeitskampfes fällt der Begriff 'Aussperrung'. Welche Aussage trifft auf die Arbeitskampfmaßnahme 'Aussperrung' zu?","qPt":"No contexto de uma luta trabalhista, surge o termo 'Aussperrung' (lockout). Qual afirmação é correta sobre essa medida de luta trabalhista?","a":"Aussperrung bedeutet die vorübergehende Freistellung von Arbeitnehmern für den Zeitraum des Arbeitskampfes. Sie ist das Gegenstück zum Streik und wird vom Arbeitgeber eingesetzt, indem er Arbeitnehmern vorübergehend den Zutritt zum Betrieb und damit die Arbeit sowie die Lohnzahlung verweigert.","aPt":"'Aussperrung' significa a dispensa temporária de trabalhadores durante o período da luta trabalhista. É a contrapartida da greve e é usada pelo empregador, que impede temporariamente os trabalhadores de entrar na empresa, suspendendo o trabalho e o pagamento do salário.","options":[{"text":"Eine planmäßig organisierte Arbeitsniederlegung aller Mitarbeiter eines Betriebes.","textPt":"Uma paralisação do trabalho organizada e planejada por todos os funcionários de uma empresa.","correct":false},{"text":"Eine planmäßig organisierte Arbeitsniederlegung aller gewerkschaftlich organisierten Mitarbeiter eines Betriebes.","textPt":"Uma paralisação do trabalho organizada e planejada por todos os funcionários sindicalizados de uma empresa.","correct":false},{"text":"Die vorübergehende Freistellung von Arbeitnehmern für den Zeitraum des Arbeitskampfes.","textPt":"A dispensa temporária de trabalhadores durante o período da luta trabalhista.","correct":true},{"text":"Die ordentliche Kündigung des Arbeitsverhältnisses in den betroffenen Betrieben.","textPt":"A demissão ordinária do contrato de trabalho nas empresas afetadas.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Im Rahmen der Tarifverhandlungen wird zwischen Lohn- und Gehaltstarif und dem normalerweise längerfristig geltenden Manteltarif unterschieden. Welcher Inhalt wird typischerweise in einem Lohn- und Gehaltstarif geregelt?","qPt":"No âmbito das negociações coletivas, distingue-se entre a convenção salarial (Lohn- und Gehaltstarif) e a convenção-quadro (Manteltarif), normalmente de vigência mais longa. Qual conteúdo é tipicamente regulado em uma convenção salarial?","a":"Die Gehaltssätze für die einzelnen Gehaltsgruppen werden im Lohn- und Gehaltstarif geregelt. Dieser hat in der Regel eine kürzere Laufzeit als der Manteltarif, da Löhne/Gehälter häufiger an die wirtschaftliche Entwicklung angepasst werden.","aPt":"Os valores salariais para cada grupo de remuneração são regulados na convenção salarial. Ela geralmente tem vigência mais curta que a convenção-quadro, pois os salários são ajustados com mais frequência conforme a evolução econômica.","options":[{"text":"Kündigungsfristen","textPt":"Prazos de aviso prévio.","correct":false},{"text":"Tägliche und wöchentliche Arbeitszeit","textPt":"Jornada diária e semanal de trabalho.","correct":false},{"text":"Mindesturlaubstage","textPt":"Dias mínimos de férias.","correct":false},{"text":"Gehaltssätze für die einzelnen Gehaltsgruppen","textPt":"Valores salariais para cada grupo de remuneração.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Eine Auszubildende der Gramberg GmbH will einen Teil ihrer Berufsausbildung im Ausland durchführen und wurde auf den Dienst Europass hingewiesen. Welche Aussage zum Dienst Europass ist zutreffend?","qPt":"Uma aprendiz da Gramberg GmbH quer realizar parte de sua formação profissional no exterior e foi informada sobre o serviço Europass. Qual afirmação sobre o serviço Europass é correta?","a":"Der Dienst Europass unterstützt Auszubildende dabei, erworbene Qualifikationen, Fähigkeiten und Kompetenzen bei Bewerbungen europaweit verständlich darzustellen. Europass ist ein kostenloses europäisches Instrument zur Transparenz von Qualifikationen.","aPt":"O serviço Europass ajuda os aprendizes a apresentar, de forma compreensível em toda a Europa, as qualificações, habilidades e competências adquiridas ao se candidatarem a empregos. O Europass é um instrumento europeu gratuito para a transparência de qualificações.","options":[{"text":"Europass ist ein kostenpflichtiger Dienst.","textPt":"O Europass é um serviço pago.","correct":false},{"text":"Der Dienst Europass unterstützt Auszubildende, erworbene Qualifikationen, Fähigkeiten und Kompetenzen bei Bewerbungen europaweit verständlich darzustellen.","textPt":"O serviço Europass ajuda os aprendizes a apresentar, de forma compreensível em toda a Europa, as qualificações, habilidades e competências adquiridas ao se candidatarem a empregos.","correct":true},{"text":"Der vom Dienst Europass ausgestellte 'Europass-Mobilität' ist für eine Berufsausbildung im europäischen Ausland verpflichtend.","textPt":"O 'Europass-Mobilidade' emitido pelo serviço Europass é obrigatório para uma formação profissional no exterior europeu.","correct":false},{"text":"Der Dienst Europass beglaubigt rechtlich bindend alle im Ausland erzielten Ausbildungsabschlüsse.","textPt":"O serviço Europass certifica, de forma juridicamente vinculante, todos os diplomas de formação obtidos no exterior.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Nach der letzten Gehaltserhöhung übersteigt das Bruttogehalt von Dagmar Fitschen die Beitragsbemessungsgrenze für die gesetzliche Rentenversicherung. Welche Konsequenz ergibt sich daraus für Frau Fitschen?","qPt":"Após o último aumento salarial, o salário bruto de Dagmar Fitschen ultrapassa o limite de cálculo de contribuição do seguro de aposentadoria público. Qual consequência disso resulta para a Sra. Fitschen?","a":"Frau Fitschen muss nur noch für einen Teil ihres Gehaltes (bis zur Beitragsbemessungsgrenze) einen Beitrag zur gesetzlichen Rentenversicherung leisten. Für den Gehaltsanteil oberhalb dieser Grenze fallen keine weiteren Rentenversicherungsbeiträge an.","aPt":"A Sra. Fitschen só precisa contribuir para o seguro de aposentadoria público sobre uma parte do seu salário (até o limite de cálculo de contribuição). Para a parte do salário acima desse limite, não incidem mais contribuições previdenciárias.","options":[{"text":"Frau Fitschen ist von der gesetzlichen Rentenversicherungspflicht befreit.","textPt":"A Sra. Fitschen está isenta da obrigatoriedade do seguro de aposentadoria público.","correct":false},{"text":"Frau Fitschen muss sich nun privat rentenversichern.","textPt":"A Sra. Fitschen agora deve contratar um seguro de aposentadoria privado.","correct":false},{"text":"Frau Fitschen erhält für die Rentenversicherung keinen Arbeitgeberanteil mehr.","textPt":"A Sra. Fitschen deixa de receber a parte do empregador na contribuição previdenciária.","correct":false},{"text":"Frau Fitschen muss nur noch für einen Teil ihres Gehaltes einen Beitrag zur gesetzlichen Rentenversicherung leisten.","textPt":"A Sra. Fitschen só precisa contribuir para o seguro de aposentadoria público sobre uma parte do seu salário.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Tom Sauer, ein Mitarbeiter der Gramberg GmbH, erkrankt während seines Urlaubs. Welche Aussage trifft auf diesen Sachverhalt zu?","qPt":"Tom Sauer, funcionário da Gramberg GmbH, adoece durante suas férias. Qual afirmação é correta sobre esse fato?","a":"Die ärztlich nachgewiesenen Tage der Arbeitsunfähigkeit werden nicht auf den Jahresurlaub angerechnet (§ 9 BUrlG). Herr Sauer erhält diese Urlaubstage gutgeschrieben und kann sie zu einem späteren Zeitpunkt nehmen.","aPt":"Os dias de incapacidade para o trabalho comprovados por atestado médico não são descontados das férias anuais (§ 9 da BUrlG). O Sr. Sauer recebe esses dias de volta e pode usá-los em outro momento.","options":[{"text":"Die Tage der Arbeitsunfähigkeit werden voll auf den Jahresurlaub angerechnet.","textPt":"Os dias de incapacidade para o trabalho são totalmente descontados das férias anuais.","correct":false},{"text":"Die ärztlich nachgewiesenen Tage der Arbeitsunfähigkeit werden nicht auf den Jahresurlaub angerechnet.","textPt":"Os dias de incapacidade para o trabalho comprovados por atestado médico não são descontados das férias anuais.","correct":true},{"text":"Die Arbeitsunfähigkeit wird nur dann angerechnet, wenn die Erkrankung im Ausland auftrat.","textPt":"A incapacidade só é descontada se a doença ocorrer no exterior.","correct":false},{"text":"Die Tage der Arbeitsunfähigkeit werden nur bei Krankenhausaufenthalt nicht angerechnet.","textPt":"Os dias de incapacidade só não são descontados em caso de internação hospitalar.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Auszubildende Maren Wichern möchte wissen, welche Sachverhalte von der gesetzlichen Sozialversicherung gedeckt werden. Dem Sozialversicherungszweig 'Rentenversicherung' ist folgender Fall zuzuordnen: Die Assistentin der Geschäftsleitung scheidet zum 1. Juli 2020 mit Vollendung des 65. Lebensjahres aus dem Berufsleben aus. Trifft diese Zuordnung zu?","qPt":"A aprendiz Maren Wichern quer saber quais situações são cobertas pelo seguro social obrigatório. Ao ramo 'seguro de aposentadoria' deve ser atribuído o seguinte caso: a assistente da direção se aposenta em 1º de julho de 2020, ao completar 65 anos. Essa atribuição está correta?","a":"Ja, das Ausscheiden aus dem Berufsleben mit Erreichen der Regelaltersgrenze (65./67. Lebensjahr) ist der klassische Leistungsfall der gesetzlichen Rentenversicherung: Die Assistentin erhält ab diesem Zeitpunkt Altersrente.","aPt":"Sim, a aposentadoria ao atingir a idade legal (65/67 anos) é o caso clássico de benefício do seguro de aposentadoria público: a assistente passa a receber a aposentadoria por idade a partir desse momento.","options":[{"text":"Ja, dies ist ein klassischer Leistungsfall der Rentenversicherung (Altersrente).","textPt":"Sim, este é um caso clássico de benefício do seguro de aposentadoria (aposentadoria por idade).","correct":true},{"text":"Nein, dies ist ein Fall der Krankenversicherung.","textPt":"Não, este é um caso do seguro de saúde.","correct":false},{"text":"Nein, dies ist ein Fall der Arbeitslosenversicherung.","textPt":"Não, este é um caso do seguro-desemprego.","correct":false},{"text":"Nein, dies ist ein Fall der Pflegeversicherung.","textPt":"Não, este é um caso do seguro de assistência à dependência (Pflegeversicherung).","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welcher Sozialversicherungszweig ist für folgenden Fall zuständig: Der Mitarbeiter Jan Lange geht wegen einer Grippeerkrankung zu seinem Arzt?","qPt":"Qual ramo do seguro social é responsável pelo seguinte caso: o funcionário Jan Lange vai ao médico por causa de uma gripe?","a":"Zuständig ist die gesetzliche Krankenversicherung. Sie übernimmt die Kosten der ärztlichen Behandlung bei Krankheit und zahlt gegebenenfalls Krankengeld, wenn die Arbeitsunfähigkeit länger als sechs Wochen andauert.","aPt":"O responsável é o seguro de saúde público. Ele cobre os custos do tratamento médico em caso de doença e, se necessário, paga o auxílio-doença, caso a incapacidade para o trabalho ultrapasse seis semanas.","options":[{"text":"Rentenversicherung","textPt":"Seguro de aposentadoria.","correct":false},{"text":"Krankenversicherung","textPt":"Seguro de saúde.","correct":true},{"text":"Arbeitslosenversicherung","textPt":"Seguro-desemprego.","correct":false},{"text":"Pflegeversicherung","textPt":"Seguro de assistência à dependência.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welcher Sozialversicherungszweig ist für folgenden Fall zuständig: Dem Mitarbeiter Filip Bajovic wurde wegen Auftragsmangel zum 1. Juli 2020 gekündigt und er findet im Anschluss keine neue Beschäftigung?","qPt":"Qual ramo do seguro social é responsável pelo seguinte caso: o funcionário Filip Bajovic foi demitido por falta de pedidos em 1º de julho de 2020 e não encontra um novo emprego em seguida?","a":"Zuständig ist die Arbeitslosenversicherung. Sie sichert das Einkommen bei unverschuldeter Arbeitslosigkeit durch Zahlung von Arbeitslosengeld I ab und unterstützt bei der Arbeitsuche.","aPt":"O responsável é o seguro-desemprego. Ele garante a renda em caso de desemprego não causado pelo trabalhador, por meio do pagamento do seguro-desemprego I, e apoia na busca de emprego.","options":[{"text":"Rentenversicherung","textPt":"Seguro de aposentadoria.","correct":false},{"text":"Krankenversicherung","textPt":"Seguro de saúde.","correct":false},{"text":"Arbeitslosenversicherung","textPt":"Seguro-desemprego.","correct":true},{"text":"Gesetzliche Unfallversicherung","textPt":"Seguro de acidentes obrigatório.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welcher Sozialversicherungszweig ist für folgenden Fall zuständig: Die an Demenz erkrankte Großmutter einer Mitarbeiterin benötigt eine häusliche Pflegekraft?","qPt":"Qual ramo do seguro social é responsável pelo seguinte caso: a avó de uma funcionária, com demência, precisa de um cuidador em casa?","a":"Zuständig ist die Pflegeversicherung. Sie übernimmt bzw. bezuschusst Leistungen bei Pflegebedürftigkeit, z. B. durch häusliche Pflege, unabhängig davon, ob die pflegebedürftige Person selbst erwerbstätig war.","aPt":"O responsável é o seguro de assistência à dependência (Pflegeversicherung). Ele cobre ou subsidia os benefícios em caso de necessidade de cuidados, por exemplo, por meio de cuidados domiciliares, independentemente de a pessoa dependente ter sido ela mesma economicamente ativa.","options":[{"text":"Rentenversicherung","textPt":"Seguro de aposentadoria.","correct":false},{"text":"Krankenversicherung","textPt":"Seguro de saúde.","correct":false},{"text":"Arbeitslosenversicherung","textPt":"Seguro-desemprego.","correct":false},{"text":"Pflegeversicherung","textPt":"Seguro de assistência à dependência.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Welcher Sozialversicherungszweig ist für folgenden Fall zuständig: Die Mitarbeiterin Verena Mehrkens rutscht auf direktem Weg zur Arbeitsstelle aus und verstaucht sich den Fuß?","qPt":"Qual ramo do seguro social é responsável pelo seguinte caso: a funcionária Verena Mehrkens escorrega no caminho direto para o trabalho e torce o pé?","a":"Zuständig ist die gesetzliche Unfallversicherung. Es handelt sich um einen Wegeunfall (§ 8 Abs. 2 SGB VII), der auf dem direkten Weg zur Arbeitsstätte passiert ist und damit versichert ist.","aPt":"O responsável é o seguro de acidentes obrigatório. Trata-se de um acidente de trajeto (§ 8, parágrafo 2, do SGB VII), ocorrido no caminho direto para o local de trabalho, e por isso é segurado.","options":[{"text":"Rentenversicherung","textPt":"Seguro de aposentadoria.","correct":false},{"text":"Krankenversicherung","textPt":"Seguro de saúde.","correct":false},{"text":"Arbeitslosenversicherung","textPt":"Seguro-desemprego.","correct":false},{"text":"Gesetzliche Unfallversicherung","textPt":"Seguro de acidentes obrigatório.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Solidarität ist ein gesellschaftspolitisches Prinzip, das in der Bundesrepublik Deutschland angewendet wird. Bei der Gramberg GmbH diskutieren Mitarbeiter darüber. Welcher der folgenden Sachverhalte entspricht dem Prinzip der Solidarität?","qPt":"Solidariedade é um princípio sociopolítico aplicado na República Federal da Alemanha. Funcionários da Gramberg GmbH discutem sobre o tema. Qual dos seguintes fatos corresponde ao princípio da solidariedade?","a":"Der Staat erhöht die Erbschaftssteuer zur Umverteilung großer Vermögen. Dies entspricht dem Solidaritätsprinzip, wonach wirtschaftlich stärkere Mitglieder der Gesellschaft stärker zur Finanzierung des Gemeinwesens beitragen als wirtschaftlich schwächere.","aPt":"O Estado aumenta o imposto sobre herança para redistribuir grandes patrimônios. Isso corresponde ao princípio da solidariedade, segundo o qual os membros economicamente mais fortes da sociedade contribuem mais para o financiamento da coletividade do que os economicamente mais fracos.","options":[{"text":"Der Staat erhöht die Erbschaftssteuer zur Umverteilung großer Vermögen.","textPt":"O Estado aumenta o imposto sobre herança para redistribuir grandes patrimônios.","correct":true},{"text":"Die Kommune senkt die Zuschüsse für Kindertagesstätten.","textPt":"O município reduz os subsídios para creches.","correct":false},{"text":"Die Erbschaftssteuer wird gesenkt.","textPt":"O imposto sobre herança é reduzido.","correct":false},{"text":"Der Beitrag zur gesetzlichen Krankenversicherung steigt mit individuellem Krankheitsrisiko des Versicherten.","textPt":"A contribuição ao seguro de saúde público aumenta conforme o risco individual de doença do segurado.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Nach der Abschlussprüfung informieren sich Auszubildende der Gramberg GmbH über Möglichkeiten der beruflichen Fortbildung. Welcher der folgenden Sachverhalte ist ein Beispiel für eine berufliche Fortbildung?","qPt":"Após a prova final, aprendizes da Gramberg GmbH se informam sobre possibilidades de formação continuada. Qual dos seguintes fatos é um exemplo de formação continuada?","a":"Die Mitarbeiterin Claudia Langer nimmt nach der Ausbildung zur IT-System-Kauffrau an einem Fernlehrgang 'Business English' teil. Fortbildung setzt eine bereits abgeschlossene Erstausbildung voraus und dient der Vertiefung bzw. Erweiterung vorhandener Kenntnisse — anders als die Erstausbildung selbst (z. B. bei Auszubildenden) oder ein Studium.","aPt":"A funcionária Claudia Langer participa, após concluir a formação como comerciante de sistemas de TI, de um curso a distância de 'Business English'. A formação continuada pressupõe uma formação inicial já concluída e serve para aprofundar ou ampliar conhecimentos existentes — diferentemente da formação inicial em si (como no caso de aprendizes) ou de uma graduação.","options":[{"text":"Mustafa Akil beginnt nach dem mittleren Schulabschluss (MSA) die Ausbildung zum Kaufmann für Büromanagement.","textPt":"Mustafa Akil começa, após o ensino médio intermediário, a formação de comerciante de gestão de escritório.","correct":false},{"text":"Ein Auszubildender der Gramberg GmbH nimmt in einer überbetrieblichen Ausbildungsstätte an einem Lehrgang zum Thema IT-Sicherheit teil.","textPt":"Um aprendiz da Gramberg GmbH participa, em um centro de formação interempresarial, de um curso sobre segurança de TI.","correct":false},{"text":"Ein Auszubildender mit Abitur will nach Abschluss der Ausbildung studieren.","textPt":"Um aprendiz com ensino médio completo quer cursar faculdade após a formação.","correct":false},{"text":"Die Mitarbeiterin Claudia Langer nimmt nach der Ausbildung zur IT-System-Kauffrau an einem Fernlehrgang 'Business English' teil.","textPt":"A funcionária Claudia Langer participa, após concluir a formação como comerciante de sistemas de TI, de um curso a distância de 'Business English'.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Gramberg GmbH verfolgt unterschiedliche Zielsetzungen. Einige Ziele lassen sich gut miteinander verbinden (komplementäre Ziele), andere schließen sich gegenseitig aus (konkurrierende Ziele). Bei welcher der folgenden Aussagen handelt es sich um komplementäre Ziele?","qPt":"A Gramberg GmbH persegue diferentes objetivos. Alguns objetivos combinam bem entre si (objetivos complementares), outros se excluem mutuamente (objetivos concorrentes). Qual das seguintes afirmações trata de objetivos complementares?","a":"Abbau von Arbeitsplätzen und Outsourcing des Rechnungswesens sind komplementäre Ziele: Beide Maßnahmen zielen in dieselbe Richtung (Kostensenkung durch Reduzierung interner Personalkapazitäten) und unterstützen sich gegenseitig, ohne sich zu widersprechen.","aPt":"A redução de postos de trabalho e a terceirização da contabilidade são objetivos complementares: ambas as medidas apontam na mesma direção (redução de custos por meio da diminuição da capacidade interna de pessoal) e se reforçam mutuamente, sem se contradizer.","options":[{"text":"Einrichtung einer Betriebskantine und Erhöhung der Exportquote","textPt":"Instalação de um refeitório na empresa e aumento da taxa de exportação.","correct":false},{"text":"Reduzierung der Kosten und Erhöhung der Löhne","textPt":"Redução de custos e aumento dos salários.","correct":false},{"text":"Umsetzung von Rationalisierungsmaßnahmen und Verbesserung des Firmenimages","textPt":"Implementação de medidas de racionalização e melhoria da imagem da empresa.","correct":false},{"text":"Abbau von Arbeitsplätzen und Outsourcing des Rechnungswesens","textPt":"Redução de postos de trabalho e terceirização da contabilidade.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Für vier durchgeführte Aufträge der Gramberg GmbH liegen folgende Zahlen vor: Auftrag 1: Aufwand 300.000 EUR, Ertrag 360.000 EUR; Auftrag 2: Aufwand 80.000 EUR, Ertrag 100.000 EUR; Auftrag 3: Aufwand 80.000 EUR, Ertrag 104.000 EUR; Auftrag 4: Aufwand 100.000 EUR, Ertrag 124.000 EUR. Welcher Auftrag wurde am wirtschaftlichsten abgewickelt, und wie hoch ist die Wirtschaftlichkeits-Kennzahl (Ertrag/Aufwand, gerundet auf zwei Nachkommastellen)?","qPt":"Para quatro pedidos executados pela Gramberg GmbH, temos os seguintes números: Pedido 1: custo 300.000 EUR, receita 360.000 EUR; Pedido 2: custo 80.000 EUR, receita 100.000 EUR; Pedido 3: custo 80.000 EUR, receita 104.000 EUR; Pedido 4: custo 100.000 EUR, receita 124.000 EUR. Qual pedido foi executado de forma mais econômica, e qual é o índice de economicidade (receita/custo, arredondado a duas casas decimais)?","a":"Die Wirtschaftlichkeit (Ertrag/Aufwand) beträgt für Auftrag 1: 1,20; Auftrag 2: 1,25; Auftrag 3: 104.000/80.000 = 1,30; Auftrag 4: 1,24. Auftrag 3 wurde mit einer Kennzahl von 1,30 am wirtschaftlichsten abgewickelt.","aPt":"A economicidade (receita/custo) é: Pedido 1: 1,20; Pedido 2: 1,25; Pedido 3: 104.000/80.000 = 1,30; Pedido 4: 1,24. O Pedido 3 foi o mais econômico, com um índice de 1,30.","options":[{"text":"Auftrag 3, Kennzahl 1,30","textPt":"Pedido 3, índice 1,30.","correct":true},{"text":"Auftrag 2, Kennzahl 1,25","textPt":"Pedido 2, índice 1,25.","correct":false},{"text":"Auftrag 4, Kennzahl 1,24","textPt":"Pedido 4, índice 1,24.","correct":false},{"text":"Auftrag 1, Kennzahl 1,20","textPt":"Pedido 1, índice 1,20.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Gramberg GmbH hat die Bätje GmbH gekauft und betreibt diese unter Beibehaltung der eigenen Firma 'Bätje GmbH' als rechtlich selbstständiges, aber wirtschaftlich von der Gramberg GmbH abhängiges Unternehmen weiter. Um welche Form des Unternehmenszusammenschlusses handelt es sich?","qPt":"A Gramberg GmbH comprou a Bätje GmbH e continua operando-a sob o nome próprio 'Bätje GmbH', como empresa juridicamente independente, mas economicamente dependente da Gramberg GmbH. De que forma de associação empresarial se trata?","a":"Es handelt sich um einen Konzern. Die Bätje GmbH bleibt als eigene Firma rechtlich selbstständig bestehen, steht aber unter der einheitlichen wirtschaftlichen Leitung der Gramberg GmbH — das klassische Merkmal eines Konzerns im Unterschied zur Fusion, bei der die aufgekaufte Firma vollständig untergeht.","aPt":"Trata-se de um grupo econômico (Konzern). A Bätje GmbH continua existindo juridicamente de forma independente, como empresa própria, mas está sob a direção econômica unificada da Gramberg GmbH — a característica clássica de um Konzern, diferentemente da fusão, na qual a empresa comprada deixa de existir completamente.","options":[{"text":"Fusion","textPt":"Fusão.","correct":false},{"text":"Arbeitsgemeinschaft","textPt":"Consórcio (ARGE).","correct":false},{"text":"Interessengemeinschaft","textPt":"Comunidade de interesses.","correct":false},{"text":"Konzern","textPt":"Grupo econômico (Konzern).","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Gramberg GmbH will ein Tochterunternehmen in der Rechtsform einer GmbH mit vorerst zwanzig Mitarbeitern gründen. Welche der folgenden Vorschriften ist dabei zu beachten: Muss das Stammkapital mindestens 25.000 EUR betragen?","qPt":"A Gramberg GmbH quer fundar uma subsidiária na forma jurídica de GmbH, com vinte funcionários inicialmente. Qual das seguintes exigências deve ser observada: o capital social deve ser de, no mínimo, 25.000 EUR?","a":"Ja, das gesetzlich vorgeschriebene Mindest-Stammkapital einer GmbH beträgt 25.000 EUR (§ 5 Abs. 1 GmbHG). Dies gilt unabhängig von der Anzahl der zukünftigen Mitarbeiter.","aPt":"Sim, o capital social mínimo exigido por lei para uma GmbH é de 25.000 EUR (§ 5, parágrafo 1, da GmbHG). Isso vale independentemente do número de futuros funcionários.","options":[{"text":"Ja, das Stammkapital muss mindestens 25.000 EUR betragen.","textPt":"Sim, o capital social deve ser de, no mínimo, 25.000 EUR.","correct":true},{"text":"Nein, es gibt keine gesetzliche Mindesthöhe für das Stammkapital einer GmbH.","textPt":"Não, não existe um valor mínimo legal para o capital social de uma GmbH.","correct":false},{"text":"Nein, das Mindest-Stammkapital hängt von der Mitarbeiterzahl ab.","textPt":"Não, o capital social mínimo depende do número de funcionários.","correct":false},{"text":"Nein, bei einer Tochtergesellschaft entfällt die Pflicht zum Mindest-Stammkapital.","textPt":"Não, em uma subsidiária não há obrigação de capital social mínimo.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Gramberg GmbH will ein Tochterunternehmen in der Rechtsform einer GmbH gründen. Kann die Gründung allein durch die Gramberg GmbH erfolgen?","qPt":"A Gramberg GmbH quer fundar uma subsidiária na forma jurídica de GmbH. A fundação pode ser feita apenas pela Gramberg GmbH sozinha?","a":"Ja, die Gründung kann allein durch die Gramberg GmbH erfolgen. Das GmbH-Gesetz lässt seit 1980 auch die Ein-Personen-GmbH (bzw. Ein-Gesellschafter-GmbH) zu, sodass ein einzelner Gesellschafter — auch eine juristische Person wie die Gramberg GmbH — allein eine GmbH gründen kann.","aPt":"Sim, a fundação pode ser feita apenas pela Gramberg GmbH sozinha. Desde 1980, a lei das GmbH também permite a GmbH unipessoal (com um único sócio), de modo que um único sócio — mesmo sendo uma pessoa jurídica como a Gramberg GmbH — pode fundar sozinho uma GmbH.","options":[{"text":"Ja, eine GmbH kann auch als Ein-Personen-GmbH von einem einzigen Gesellschafter allein gegründet werden.","textPt":"Sim, uma GmbH também pode ser fundada como GmbH unipessoal por um único sócio.","correct":true},{"text":"Nein, für die Gründung einer GmbH sind mindestens zwei Gesellschafter erforderlich.","textPt":"Não, para fundar uma GmbH são exigidos, no mínimo, dois sócios.","correct":false},{"text":"Nein, eine GmbH kann nur von natürlichen Personen gegründet werden.","textPt":"Não, uma GmbH só pode ser fundada por pessoas físicas.","correct":false},{"text":"Nein, die Gründung bedarf zusätzlich der Zustimmung des Kartellamtes.","textPt":"Não, a fundação exige adicionalmente a aprovação da autoridade antitruste.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der Unternehmensgründung wurde vom Firmengründer Günter Gramberg die Rechtsform der GmbH gewählt. Welche Aussage trifft auf eine GmbH zu?","qPt":"Na fundação da empresa, o fundador Günter Gramberg escolheu a forma jurídica de GmbH. Qual afirmação é correta sobre uma GmbH?","a":"Nach der gesetzlichen Regelung erfolgt die Gewinnverteilung bei einer GmbH nach Geschäftsanteilen (§ 29 Abs. 3 GmbHG), sofern im Gesellschaftsvertrag nichts anderes vereinbart ist. Jeder Gesellschafter erhält also einen Anteil am Gewinn entsprechend seiner Kapitalbeteiligung.","aPt":"Segundo a regra legal, a distribuição de lucros em uma GmbH ocorre de acordo com as participações societárias (§ 29, parágrafo 3, da GmbHG), salvo disposição diferente no contrato social. Assim, cada sócio recebe uma parte do lucro proporcional à sua participação no capital.","options":[{"text":"Die GmbH hat einen Komplementär und einen Kommanditisten.","textPt":"A GmbH tem um sócio comanditado e um sócio comanditário.","correct":false},{"text":"Der Komplementär leitet die GmbH.","textPt":"O sócio comanditado dirige a GmbH.","correct":false},{"text":"Die Gesellschafter der GmbH haften für Verbindlichkeiten mit ihrem Privatvermögen.","textPt":"Os sócios da GmbH respondem pelas dívidas com seu patrimônio pessoal.","correct":false},{"text":"Nach der gesetzlichen Regelung erfolgt die Gewinnverteilung nach Geschäftsanteilen.","textPt":"Segundo a regra legal, a distribuição de lucros ocorre de acordo com as participações societárias.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Für die Dienstleistungen der Gramberg GmbH gibt es viele Konkurrenten und der Kundenkreis ist sehr umfangreich. Welcher Begriff beschreibt diese Marktform?","qPt":"Para os serviços da Gramberg GmbH existem muitos concorrentes e a base de clientes é muito ampla. Qual termo descreve essa forma de mercado?","a":"Diese Marktform wird als Polypol bezeichnet. Ein Polypol liegt vor, wenn viele Anbieter und viele Nachfrager auf dem Markt aufeinandertreffen, wodurch kein einzelner Marktteilnehmer den Preis maßgeblich beeinflussen kann.","aPt":"Essa forma de mercado é chamada de polipólio. Um polipólio ocorre quando muitos ofertantes e muitos demandantes se encontram no mercado, de modo que nenhum participante isolado pode influenciar significativamente o preço.","options":[{"text":"Angebotsmonopol","textPt":"Monopólio de oferta.","correct":false},{"text":"Angebotsoligopol","textPt":"Oligopólio de oferta.","correct":false},{"text":"Polypol","textPt":"Polipólio.","correct":true},{"text":"Nachfragemonopol","textPt":"Monopólio de demanda.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Der 16-jährige Auszubildende Murat Safin kauft ein E-Bike im Wert von 2.799,00 EUR. Welche Aussage trifft auf dieses Rechtsgeschäft zu?","qPt":"O aprendiz Murat Safin, de 16 anos, compra uma bicicleta elétrica no valor de 2.799,00 EUR. Qual afirmação é correta sobre esse negócio jurídico?","a":"Das Rechtsgeschäft ist bis zur Zustimmung der gesetzlichen Vertreter schwebend unwirksam (§ 108 BGB). Herr Safin ist als 16-Jähriger minderjährig und somit nur beschränkt geschäftsfähig; ein solcher Kauf ist nicht lediglich rechtlich vorteilhaft und bedarf daher der Einwilligung der Eltern.","aPt":"O negócio jurídico é ineficaz, pendente de aprovação dos representantes legais (§ 108 do BGB). O Sr. Safin, com 16 anos, é menor de idade e, portanto, tem capacidade jurídica apenas limitada; essa compra não é apenas juridicamente vantajosa e, por isso, necessita do consentimento dos pais.","options":[{"text":"Das Rechtsgeschäft ist nichtig.","textPt":"O negócio jurídico é nulo.","correct":false},{"text":"Das Rechtsgeschäft ist anfechtbar.","textPt":"O negócio jurídico é anulável.","correct":false},{"text":"Das Rechtsgeschäft ist gültig, weil Herr Safin das E-Bike in zwölf Monatsraten bezahlt.","textPt":"O negócio jurídico é válido, pois o Sr. Safin paga a bicicleta em doze parcelas mensais.","correct":false},{"text":"Das Rechtsgeschäft ist bis zur Zustimmung der gesetzlichen Vertreter schwebend unwirksam.","textPt":"O negócio jurídico é ineficaz, pendente de aprovação dos representantes legais.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Jemand möchte sich mit einem Software-Unternehmen selbstständig machen. Bei den Kreditgesprächen mit einer Bank wird die Vorlage eines Businessplans verlangt. An welcher Stelle des Businessplans erwartet die Bank Aussagen zu anderen Unternehmen, die ähnliche Dienstleistungen anbieten?","qPt":"Alguém quer abrir seu próprio negócio com uma empresa de software. Nas negociações de crédito com um banco, é exigida a apresentação de um plano de negócios. Em qual parte do plano de negócios o banco espera encontrar informações sobre outras empresas que oferecem serviços semelhantes?","a":"Die Bank erwartet solche Aussagen in der Markt- und Wettbewerbsanalyse. Dort werden das Marktumfeld, die Zielgruppe sowie bestehende Wettbewerber und deren Angebote analysiert, um die Erfolgsaussichten des Vorhabens einzuschätzen.","aPt":"O banco espera encontrar essas informações na análise de mercado e concorrência. Nessa parte, são analisados o ambiente de mercado, o público-alvo, bem como os concorrentes existentes e suas ofertas, para avaliar as chances de sucesso do empreendimento.","options":[{"text":"Unternehmensbeschreibung","textPt":"Descrição da empresa.","correct":false},{"text":"Standortbeschreibung","textPt":"Descrição da localização.","correct":false},{"text":"Beschreibung der Produkte und Leistungen","textPt":"Descrição dos produtos e serviços.","correct":false},{"text":"Markt- und Wettbewerbsanalyse","textPt":"Análise de mercado e concorrência.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Volkswirtschaft der Bundesrepublik Deutschland profitiert von der Globalisierung. Welche der folgenden Maßnahmen fördert die Globalisierung?","qPt":"A economia da República Federal da Alemanha se beneficia da globalização. Qual das seguintes medidas favorece a globalização?","a":"Ein deutsches Unternehmen eröffnet Niederlassungen in Asien und Amerika. Dies fördert die internationale Verflechtung von Wirtschaftsräumen, einen zentralen Aspekt der Globalisierung, da Produktion, Absatz und Investitionen grenzüberschreitend ausgeweitet werden.","aPt":"Uma empresa alemã abre filiais na Ásia e na América. Isso favorece o entrelaçamento internacional de espaços econômicos, um aspecto central da globalização, já que produção, vendas e investimentos são ampliados além das fronteiras.","options":[{"text":"Die Erhöhung der Importzölle.","textPt":"O aumento das tarifas de importação.","correct":false},{"text":"Die Erhöhung von Steuern für Transportdienstleistungen.","textPt":"O aumento de impostos para serviços de transporte.","correct":false},{"text":"Die Erhöhung von Exportschranken.","textPt":"O aumento de barreiras à exportação.","correct":false},{"text":"Ein deutsches Unternehmen eröffnet Niederlassungen in Asien und Amerika.","textPt":"Uma empresa alemã abre filiais na Ásia e na América.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"In einer Mittagspause ist vom 'magischen Viereck' die Rede. Welche der folgenden wirtschaftspolitischen Ziele sind damit NICHT gemeint?","qPt":"Em um intervalo de almoço, fala-se do 'quadrado mágico' (magisches Viereck). Qual dos seguintes objetivos de política econômica NÃO faz parte dele?","a":"Mit dem 'magischen Viereck' gemeint sind die vier Ziele des Stabilitätsgesetzes: Preisstabilität, hoher Beschäftigungsstand, außenwirtschaftliches Gleichgewicht sowie stetiges und angemessenes Wirtschaftswachstum. 'Gerechte Einkommens- und Vermögensverteilung' gehört nicht zu diesen vier klassischen Zielen, sondern wird manchmal als zusätzliches, fünftes Ziel diskutiert.","aPt":"O 'quadrado mágico' refere-se aos quatro objetivos da Lei de Estabilidade: estabilidade de preços, alto nível de emprego, equilíbrio das relações econômicas externas e crescimento econômico constante e adequado. A 'distribuição justa de renda e patrimônio' não faz parte desses quatro objetivos clássicos, sendo às vezes discutida como um quinto objetivo adicional.","options":[{"text":"Preisstabilität","textPt":"Estabilidade de preços.","correct":false},{"text":"Außenwirtschaftliches Gleichgewicht","textPt":"Equilíbrio das relações econômicas externas.","correct":false},{"text":"Gerechte Einkommens- und Vermögensverteilung","textPt":"Distribuição justa de renda e patrimônio.","correct":true},{"text":"Vollbeschäftigung","textPt":"Pleno emprego.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Zur GreenByte GmbH, einem IT-Dienstleistungsunternehmen mit Sitz in Hamburg und 110 Mitarbeitenden, liegen folgende Daten vor: Gesellschaft mit beschränkter Haftung, 25 % Marktanteil in der Region, 1.520.000 EUR Gewinn im Jahr 2020. Welche Bezeichnung trifft auf die GreenByte GmbH zu?","qPt":"Sobre a GreenByte GmbH, uma prestadora de serviços de TI sediada em Hamburgo com 110 funcionários, temos os seguintes dados: sociedade de responsabilidade limitada, 25% de participação de mercado na região, lucro de 1.520.000 EUR em 2020. Qual denominação se aplica à GreenByte GmbH?","a":"Die GreenByte GmbH ist eine Kapitalgesellschaft, da die GmbH (Gesellschaft mit beschränkter Haftung) zu den Kapitalgesellschaften zählt, bei denen die Haftung auf das Gesellschaftsvermögen beschränkt ist.","aPt":"A GreenByte GmbH é uma sociedade de capital (Kapitalgesellschaft), pois a GmbH (sociedade de responsabilidade limitada) pertence às sociedades de capital, nas quais a responsabilidade se limita ao patrimônio da sociedade.","options":[{"text":"Kapitalgesellschaft","textPt":"Sociedade de capital.","correct":true},{"text":"Monopolist in der Region","textPt":"Monopolista na região.","correct":false},{"text":"Unternehmen des primären Sektors","textPt":"Empresa do setor primário.","correct":false},{"text":"Personengesellschaft","textPt":"Sociedade de pessoas.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Zur GreenByte GmbH liegen folgende Daten vor: IT-Dienstleister, 25 % Marktanteil in der Region, 110 Mitarbeitende, 1.520.000 EUR Gewinn im Jahr 2020. Welche weitere Bezeichnung trifft auf die GreenByte GmbH zu?","qPt":"Sobre a GreenByte GmbH, temos os seguintes dados: prestadora de serviços de TI, 25% de participação de mercado na região, 110 funcionários, lucro de 1.520.000 EUR em 2020. Qual outra denominação se aplica à GreenByte GmbH?","a":"Die GreenByte GmbH ist ein erwerbswirtschaftliches Unternehmen, da sie am Markt tätig ist, um Gewinn zu erzielen (erwerbswirtschaftliches Prinzip) – im Gegensatz zu einem gemeinwirtschaftlichen Betrieb, dessen Ziel die Bedarfsdeckung ist.","aPt":"A GreenByte GmbH é uma empresa com fins lucrativos, pois atua no mercado para obter lucro (princípio erwerbswirtschaftlich) — em contraste com uma empresa de interesse público, cujo objetivo é suprir necessidades.","options":[{"text":"Erwerbswirtschaftliches Unternehmen","textPt":"Empresa com fins lucrativos.","correct":true},{"text":"Großunternehmen","textPt":"Grande empresa.","correct":false},{"text":"Unternehmen des primären Sektors","textPt":"Empresa do setor primário.","correct":false},{"text":"Monopolist in der Region","textPt":"Monopolista na região.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die GreenByte GmbH plant, zwei Fachinformatiker Anwendungsentwicklung (m/w/d) einzustellen. Welche der folgenden Formulierungen in einer Stellenanzeige würde gegen das Allgemeine Gleichbehandlungsgesetz (AGG) verstoßen?","qPt":"A GreenByte GmbH planeja contratar dois técnicos em informática para desenvolvimento de aplicações (m/w/d). Qual das seguintes formulações em um anúncio de emprego violaria a Lei Geral de Igualdade de Tratamento (AGG)?","a":"'Sie passen in unser junges dynamisches Team, wenn Sie jünger als 30 Jahre sind' verstößt gegen das AGG, da hier eine unmittelbare Diskriminierung wegen des Alters vorliegt (§ 1, § 7 AGG). Bewerber ab 30 Jahren würden von vornherein ausgeschlossen.","aPt":"'Você se encaixa em nossa equipe jovem e dinâmica se tiver menos de 30 anos' viola a AGG, pois configura discriminação direta por idade (§ 1 e § 7 da AGG). Candidatos a partir de 30 anos seriam excluídos de antemão.","options":[{"text":"Sie verfügen über hervorragende Kenntnisse in Webprogrammierung.","textPt":"Você possui excelentes conhecimentos em programação web.","correct":false},{"text":"Sie passen in unser junges dynamisches Team, wenn Sie jünger als 30 Jahre sind.","textPt":"Você se encaixa em nossa equipe jovem e dinâmica se tiver menos de 30 anos.","correct":true},{"text":"Sie sind mobil und bereit, auch mehrtägige Geschäftsreisen zu unternehmen.","textPt":"Você é móvel e está disposto a fazer viagens de negócios de vários dias.","correct":false},{"text":"Sie beherrschen die englische Sprache verhandlungssicher in Wort und Schrift.","textPt":"Você domina o inglês em nível de negociação, oral e escrito.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In der Geschäftsführung der GreenByte GmbH werden Maßnahmen zur Arbeitssicherheit im Unternehmen diskutiert. Welche Aussage trifft auf die Arbeitssicherheit im Unternehmen zu?","qPt":"Na diretoria da GreenByte GmbH são discutidas medidas de segurança do trabalho na empresa. Qual afirmação é correta sobre a segurança do trabalho na empresa?","a":"Der Arbeitgeber muss alle notwendigen Maßnahmen des Arbeitsschutzes treffen und die Einhaltung im Betrieb überwachen (§ 3 ArbSchG). Arbeitsschutz ist keine freiwillige Leistung, sondern eine gesetzliche Pflicht des Arbeitgebers.","aPt":"O empregador deve tomar todas as medidas necessárias de proteção ao trabalho e fiscalizar seu cumprimento na empresa (§ 3 da ArbSchG). A proteção ao trabalho não é um benefício voluntário, mas uma obrigação legal do empregador.","options":[{"text":"Betriebliche Arbeitsschutzbestimmungen sind eine freiwillige Leistung des Arbeitgebers.","textPt":"As normas internas de proteção ao trabalho são um benefício voluntário do empregador.","correct":false},{"text":"Betriebliche Arbeitsschutzbestimmungen gelten nur, wenn sie tarifvertraglich vereinbart wurden.","textPt":"As normas internas de proteção ao trabalho só valem se tiverem sido acordadas em convenção coletiva.","correct":false},{"text":"Der Arbeitgeber muss alle notwendigen Maßnahmen des Arbeitsschutzes treffen und die Einhaltung im Betrieb überwachen.","textPt":"O empregador deve tomar todas as medidas necessárias de proteção ao trabalho e fiscalizar seu cumprimento na empresa.","correct":true},{"text":"Die Ergonomie von Arbeitsplätzen ist nicht notwendig, weil die Ergonomie nicht der Arbeitssicherheit dient.","textPt":"A ergonomia dos postos de trabalho não é necessária, pois ela não serve à segurança do trabalho.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die GreenByte GmbH möchte zukünftig in den Arbeitsverträgen eine Probezeit von sechs Monaten vereinbaren. Welche Aussage trifft auf die Probezeit zu?","qPt":"A GreenByte GmbH quer, futuramente, acordar nos contratos de trabalho um período de experiência de seis meses. Qual afirmação é correta sobre o período de experiência?","a":"Eine Probezeit von sechs Monaten ist gesetzlich zulässig. § 622 Abs. 3 BGB erlaubt eine Probezeit von bis zu sechs Monaten, während der das Arbeitsverhältnis mit einer verkürzten Frist von zwei Wochen gekündigt werden kann.","aPt":"Um período de experiência de seis meses é legalmente permitido. O § 622, parágrafo 3, do BGB permite um período de experiência de até seis meses, durante o qual o contrato de trabalho pode ser rescindido com um prazo reduzido de duas semanas.","options":[{"text":"Eine Probezeit darf nur bei unbefristeten Arbeitsverträgen vereinbart werden.","textPt":"Um período de experiência só pode ser acordado em contratos por prazo indeterminado.","correct":false},{"text":"Eine Probezeit von sechs Monaten ist gesetzlich zulässig.","textPt":"Um período de experiência de seis meses é legalmente permitido.","correct":true},{"text":"Die Probezeit muss mindestens zwölf Monate betragen.","textPt":"O período de experiência deve ser de, no mínimo, doze meses.","correct":false},{"text":"Der Arbeitgeber kann die Probezeit beliebig oft verlängern.","textPt":"O empregador pode prorrogar o período de experiência quantas vezes quiser.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die GreenByte GmbH ist Mitglied des Arbeitgeberverbandes. Bei welcher der folgenden Vereinbarungen des Arbeitsvertrags ist die GreenByte GmbH an kollektives Arbeitsrecht gebunden?","qPt":"A GreenByte GmbH é membro da associação patronal. Em qual das seguintes cláusulas do contrato de trabalho a GreenByte GmbH está vinculada ao direito coletivo do trabalho?","a":"Die Wochenarbeitszeit beträgt regelmäßig 38 Stunden – diese Regelung ergibt sich aus dem für die GreenByte GmbH geltenden Tarifvertrag und bindet das Unternehmen somit an kollektives (tarifliches) Arbeitsrecht.","aPt":"A jornada semanal é regularmente de 38 horas — essa regra decorre da convenção coletiva aplicável à GreenByte GmbH e, assim, vincula a empresa ao direito coletivo (tarifário) do trabalho.","options":[{"text":"Die Wochenarbeitszeit beträgt regelmäßig 38 Stunden.","textPt":"A jornada semanal é regularmente de 38 horas.","correct":true},{"text":"Das Arbeitsverhältnis beginnt am 1. Juli 2021 und ist unbefristet.","textPt":"O contrato de trabalho começa em 1º de julho de 2021 e é por prazo indeterminado.","correct":false},{"text":"Der Mitarbeiter erhält einen außertariflichen Fahrgeldzuschuss von 100,00 EUR.","textPt":"O funcionário recebe um auxílio-transporte extratarifário de 100,00 EUR.","correct":false},{"text":"Der Mitarbeiter arbeitet im IT-Service in der Kundenbetreuung im Außendienst.","textPt":"O funcionário trabalha no atendimento a clientes externos na área de TI.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In der Unternehmenszentrale der GreenByte GmbH arbeiten insgesamt 110 Mitarbeitende. Durch Unterbrechungen in der Lieferkette können für voraussichtlich zwei Monate die Mitarbeitenden nur zum geringen Teil beschäftigt werden. Das Unternehmen möchte dennoch keine Kündigungen aussprechen, da sich die Auftragslage zum Jahresende voraussichtlich normalisiert. Welche Aussage trifft zu?","qPt":"Na sede da GreenByte GmbH trabalham ao todo 110 funcionários. Devido a interrupções na cadeia de suprimentos, os funcionários poderão ser ocupados apenas parcialmente por aproximadamente dois meses. A empresa não quer, porém, demitir ninguém, já que a situação de pedidos deve se normalizar até o fim do ano. Qual afirmação é correta?","a":"Die GreenByte GmbH kann bei der Bundesagentur für Arbeit für die Mitarbeitenden Kurzarbeitergeld beantragen. Kurzarbeitergeld federt einen vorübergehenden, unvermeidbaren Arbeitsausfall ab und ermöglicht es dem Unternehmen, Kündigungen zu vermeiden.","aPt":"A GreenByte GmbH pode solicitar à Agência Federal do Trabalho o auxílio por jornada reduzida (Kurzarbeitergeld) para os funcionários. Esse benefício amortece uma perda de trabalho temporária e inevitável e permite à empresa evitar demissões.","options":[{"text":"Die GreenByte GmbH muss allen Mitarbeitenden außerordentlich kündigen.","textPt":"A GreenByte GmbH deve demitir todos os funcionários por justa causa.","correct":false},{"text":"Die GreenByte GmbH darf jederzeit die Gehälter der Mitarbeitenden kürzen.","textPt":"A GreenByte GmbH pode reduzir os salários dos funcionários a qualquer momento.","correct":false},{"text":"Die Mitarbeitenden müssen für die Dauer der geringen Beschäftigung unbezahlten Urlaub nehmen.","textPt":"Os funcionários devem tirar férias não remuneradas durante o período de ocupação reduzida.","correct":false},{"text":"Die GreenByte GmbH kann bei der Bundesagentur für Arbeit für die Mitarbeitenden Kurzarbeitergeld beantragen.","textPt":"A GreenByte GmbH pode solicitar à Agência Federal do Trabalho o auxílio por jornada reduzida para os funcionários.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"In der GreenByte GmbH wurde ein Betriebsrat gewählt. Welche Aussage über den Betriebsrat ist zutreffend?","qPt":"Na GreenByte GmbH foi eleito um conselho de empresa (Betriebsrat). Qual afirmação sobre o conselho de empresa é correta?","a":"Ein Betriebsrat kann von allen Arbeitnehmern eines Betriebs gewählt werden, die das 18. Lebensjahr vollendet haben (§ 7 BetrVG, aktives Wahlrecht). Eine Mindestbetriebszugehörigkeit ist für das aktive Wahlrecht nicht erforderlich.","aPt":"Um conselho de empresa pode ser escolhido por todos os trabalhadores de uma empresa que já tenham completado 18 anos (§ 7 da BetrVG, direito de voto ativo). Não é exigido um tempo mínimo de vínculo com a empresa para o direito de voto ativo.","options":[{"text":"Ein Betriebsrat kann in der GreenByte GmbH nicht gewählt werden, weil sie weniger als 200 Mitarbeitende hat.","textPt":"Um conselho de empresa não pode ser eleito na GreenByte GmbH, pois ela tem menos de 200 funcionários.","correct":false},{"text":"Ein Betriebsrat muss je zur Hälfte aus Arbeitnehmern und Arbeitnehmerinnen gebildet werden.","textPt":"Um conselho de empresa deve ser formado por metade de trabalhadores e metade de trabalhadoras.","correct":false},{"text":"Ein Betriebsrat kann von allen Arbeitnehmern eines Betriebs gewählt werden, die das 18. Lebensjahr vollendet haben.","textPt":"Um conselho de empresa pode ser escolhido por todos os trabalhadores de uma empresa que já tenham completado 18 anos.","correct":true},{"text":"In einen Betriebsrat können nur Arbeitnehmer gewählt werden, die mindestens eine zweijährige Betriebszugehörigkeit nachweisen können.","textPt":"Para o conselho de empresa só podem ser eleitos trabalhadores que comprovem pelo menos dois anos de vínculo com a empresa.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Geschäftsleitung der GreenByte GmbH arbeitet eng mit dem Betriebsrat zusammen. Hat der Betriebsrat laut Betriebsverfassungsgesetz ein Mitbestimmungsrecht bei der 'Einführung eines neuen elektronischen Zeiterfassungssystems'?","qPt":"A direção da GreenByte GmbH trabalha em estreita colaboração com o conselho de empresa. Segundo a Lei de Constituição das Empresas, o conselho de empresa tem direito de cogestão na 'introdução de um novo sistema eletrônico de registro de ponto'?","a":"Ja, die Einführung eines neuen elektronischen Zeiterfassungssystems unterliegt der zwingenden Mitbestimmung des Betriebsrats nach § 87 Abs. 1 Nr. 6 BetrVG, da es sich um eine technische Einrichtung handelt, die zur Überwachung von Verhalten oder Leistung der Arbeitnehmer geeignet ist.","aPt":"Sim, a introdução de um novo sistema eletrônico de registro de ponto está sujeita à cogestão obrigatória do conselho de empresa, conforme o § 87, parágrafo 1, nº 6, da BetrVG, pois se trata de um dispositivo técnico apto a monitorar o comportamento ou o desempenho dos funcionários.","options":[{"text":"Ja, die Einführung des Zeiterfassungssystems ist mitbestimmungspflichtig.","textPt":"Sim, a introdução do sistema de registro de ponto está sujeita à cogestão.","correct":true},{"text":"Nein, dies ist eine reine technische Entscheidung der Geschäftsleitung.","textPt":"Não, trata-se de uma decisão puramente técnica da direção.","correct":false},{"text":"Nein, hierfür ist ausschließlich die Gewerkschaft zuständig.","textPt":"Não, apenas o sindicato é responsável por isso.","correct":false},{"text":"Nein, der Betriebsrat muss lediglich informiert werden.","textPt":"Não, o conselho de empresa precisa apenas ser informado.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Hat der Betriebsrat der GreenByte GmbH laut Betriebsverfassungsgesetz ein Mitbestimmungsrecht bei der 'Festlegung von Richtlinien zur gleitenden Arbeitszeit'?","qPt":"O conselho de empresa da GreenByte GmbH tem, segundo a Lei de Constituição das Empresas, direito de cogestão na 'definição de diretrizes sobre horário de trabalho flexível'?","a":"Ja, die Festlegung von Richtlinien zur gleitenden Arbeitszeit unterliegt der zwingenden Mitbestimmung des Betriebsrats nach § 87 Abs. 1 Nr. 2 BetrVG, da sie Beginn, Ende und Verteilung der Arbeitszeit betrifft.","aPt":"Sim, a definição de diretrizes sobre horário de trabalho flexível está sujeita à cogestão obrigatória do conselho de empresa, conforme o § 87, parágrafo 1, nº 2, da BetrVG, pois trata do início, fim e distribuição da jornada de trabalho.","options":[{"text":"Ja, die Festlegung von Richtlinien zur gleitenden Arbeitszeit ist mitbestimmungspflichtig.","textPt":"Sim, a definição de diretrizes sobre horário de trabalho flexível está sujeita à cogestão.","correct":true},{"text":"Nein, Arbeitszeitmodelle unterliegen nicht der Mitbestimmung.","textPt":"Não, modelos de jornada de trabalho não estão sujeitos à cogestão.","correct":false},{"text":"Nein, dies ist eine unternehmerische Entscheidung ohne Mitbestimmungsrecht.","textPt":"Não, trata-se de uma decisão empresarial sem direito de cogestão.","correct":false},{"text":"Nein, hierfür ist eine Zustimmung des Betriebsrats nur bei Vollzeitkräften nötig.","textPt":"Não, aqui o consentimento do conselho de empresa só é necessário para funcionários em tempo integral.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Für Arbeitgeber und Arbeitnehmer ist die Tarifautonomie gesetzlich festgeschrieben. Welche Aussage trifft auf die Tarifautonomie zu: Gibt sie den Vertragsparteien das Recht, die Arbeits- und Wirtschaftsbedingungen unabhängig von staatlicher Einflussnahme zu regeln?","qPt":"Para empregadores e trabalhadores, a autonomia de negociação coletiva (Tarifautonomie) está prevista em lei. Qual afirmação é correta sobre a autonomia de negociação coletiva: ela dá às partes contratantes o direito de regular as condições de trabalho e econômicas independentemente da influência estatal?","a":"Ja, das ist der Kern der Tarifautonomie (Art. 9 Abs. 3 GG). Gewerkschaften und Arbeitgeber(-verbände) können Löhne und Arbeitsbedingungen eigenverantwortlich und ohne direkte staatliche Einmischung aushandeln.","aPt":"Sim, essa é a essência da autonomia de negociação coletiva (artigo 9, parágrafo 3, da Lei Fundamental alemã). Sindicatos e empregadores (ou suas associações) podem negociar salários e condições de trabalho por conta própria, sem interferência estatal direta.","options":[{"text":"Ja, die Tarifautonomie gibt den Vertragsparteien das Recht, die Arbeits- und Wirtschaftsbedingungen unabhängig von staatlicher Einflussnahme zu regeln.","textPt":"Sim, a autonomia de negociação coletiva dá às partes o direito de regular as condições de trabalho e econômicas independentemente da influência estatal.","correct":true},{"text":"Nein, die Tarifautonomie gewährt der Bundesagentur für Arbeit die direkte Eingriffsmöglichkeit in Tarifverhandlungen.","textPt":"Não, a autonomia de negociação coletiva concede à Agência Federal do Trabalho a possibilidade de intervir diretamente nas negociações coletivas.","correct":false},{"text":"Nein, die Tarifautonomie ist individuelles Arbeitsrecht zur Regelung der Beziehungen zwischen einem Arbeitgeber und einem Arbeitnehmer.","textPt":"Não, a autonomia de negociação coletiva é direito individual do trabalho para regular a relação entre um empregador e um trabalhador.","correct":false},{"text":"Nein, die Tarifautonomie gibt den Vertragsparteien das Recht zu Regelungen, die schlechter sind als die in Gesetzen genannten.","textPt":"Não, a autonomia de negociação coletiva dá às partes o direito de fazer acordos piores do que os previstos em lei.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche weitere Aussage trifft auf die Tarifautonomie zu: Gibt sie den Vertragsparteien das Recht zu Vereinbarungen, die von den Vertragspartnern nicht einseitig zu Ungunsten der Arbeitnehmer abgeändert werden dürfen?","qPt":"Qual outra afirmação é correta sobre a autonomia de negociação coletiva: ela dá às partes o direito a acordos que não podem ser alterados unilateralmente em prejuízo dos trabalhadores?","a":"Ja, Tarifverträge sind unabdingbar (§ 4 Abs. 3 TVG): Von ihnen darf im Einzelarbeitsvertrag nur zugunsten des Arbeitnehmers (Günstigkeitsprinzip) abgewichen werden, nicht aber zu dessen Ungunsten.","aPt":"Sim, as convenções coletivas são irrenunciáveis (§ 4, parágrafo 3, do TVG): no contrato de trabalho individual, só é possível se afastar delas em benefício do trabalhador (princípio da condição mais favorável), nunca em seu prejuízo.","options":[{"text":"Ja, Tarifvereinbarungen dürfen nicht einseitig zu Ungunsten der Arbeitnehmer abgeändert werden.","textPt":"Sim, acordos coletivos não podem ser alterados unilateralmente em prejuízo dos trabalhadores.","correct":true},{"text":"Nein, Tarifvereinbarungen können vom Arbeitgeber jederzeit einseitig geändert werden.","textPt":"Não, acordos coletivos podem ser alterados unilateralmente pelo empregador a qualquer momento.","correct":false},{"text":"Nein, Tarifvereinbarungen gelten nur, solange keine abweichende Einzelvereinbarung existiert.","textPt":"Não, acordos coletivos só valem enquanto não existir um acordo individual diferente.","correct":false},{"text":"Nein, Tarifvereinbarungen dürfen beliebig zu Ungunsten der Arbeitnehmer unterschritten werden.","textPt":"Não, acordos coletivos podem ser rebaixados livremente em prejuízo dos trabalhadores.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die berufliche Weiterbildung wird in der GreenByte GmbH gefördert, um die Wettbewerbsfähigkeit des Unternehmens auch in Zukunft zu gewährleisten. Welche Aussage zur beruflichen Weiterbildung ist zutreffend?","qPt":"A formação continuada é incentivada na GreenByte GmbH para garantir a competitividade da empresa também no futuro. Qual afirmação sobre a formação continuada é correta?","a":"Die berufliche Weiterbildung ist in der IT-Branche zur Vertiefung und Erweiterung von Kenntnissen und Fertigkeiten notwendig, da sich Technologien und Standards sehr schnell weiterentwickeln und erworbenes Wissen laufend aktualisiert werden muss.","aPt":"A formação continuada é necessária na área de TI para aprofundar e ampliar conhecimentos e habilidades, pois as tecnologias e os padrões evoluem muito rapidamente e os conhecimentos adquiridos precisam ser constantemente atualizados.","options":[{"text":"Die berufliche Weiterbildung ist in der IT-Branche zur Vertiefung und Erweiterung von Kenntnissen und Fertigkeiten notwendig.","textPt":"A formação continuada é necessária na área de TI para aprofundar e ampliar conhecimentos e habilidades.","correct":true},{"text":"Die berufliche Weiterbildung ist für Arbeitnehmer grundsätzlich kostenpflichtig, weil sie überwiegend im persönlichen Interesse des Arbeitnehmers liegt.","textPt":"A formação continuada é, em princípio, paga para os trabalhadores, pois serve principalmente ao interesse pessoal do trabalhador.","correct":false},{"text":"Die berufliche Weiterbildung darf nur außerbetrieblich in Einrichtungen zertifizierter Bildungsträger erfolgen.","textPt":"A formação continuada só pode ocorrer fora da empresa, em instituições de provedores de ensino certificados.","correct":false},{"text":"Die berufliche Weiterbildung ist nur in einem anerkannten Ausbildungsberuf zulässig.","textPt":"A formação continuada só é permitida em uma profissão de formação reconhecida.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Eine Mitarbeiterin der GreenByte GmbH ist arbeitsunfähig, weil sie am Vortag auf dem direkten Weg zur Arbeit bei einem Sturz vom Fahrrad schwer verletzt wurde. Welche Aussage ist in diesem Zusammenhang zutreffend?","qPt":"Uma funcionária da GreenByte GmbH está incapacitada para o trabalho porque, no dia anterior, no caminho direto para o trabalho, sofreu uma queda de bicicleta e se machucou gravemente. Qual afirmação é correta nesse contexto?","a":"Die GreenByte GmbH muss den Unfall der Berufsgenossenschaft melden. Es handelt sich um einen Wegeunfall (§ 8 Abs. 2 SGB VII), der als Arbeitsunfall von der gesetzlichen Unfallversicherung (Berufsgenossenschaft) abgedeckt ist und meldepflichtig ist, sobald die Arbeitsunfähigkeit mehr als drei Tage dauert.","aPt":"A GreenByte GmbH deve comunicar o acidente à associação profissional (Berufsgenossenschaft). Trata-se de um acidente de trajeto (§ 8, parágrafo 2, do SGB VII), coberto como acidente de trabalho pelo seguro de acidentes obrigatório, e de notificação obrigatória assim que a incapacidade para o trabalho ultrapassar três dias.","options":[{"text":"Die GreenByte GmbH muss den Unfall der Krankenversicherung der Mitarbeiterin melden.","textPt":"A GreenByte GmbH deve comunicar o acidente ao seguro de saúde da funcionária.","correct":false},{"text":"Die GreenByte GmbH darf die Gehaltszahlung ab dem ersten Krankheitstag einstellen.","textPt":"A GreenByte GmbH pode suspender o pagamento do salário a partir do primeiro dia de doença.","correct":false},{"text":"Die GreenByte GmbH darf den Urlaubsanspruch der Mitarbeiterin kürzen.","textPt":"A GreenByte GmbH pode reduzir o direito a férias da funcionária.","correct":false},{"text":"Die GreenByte GmbH muss den Unfall der Berufsgenossenschaft melden.","textPt":"A GreenByte GmbH deve comunicar o acidente à associação profissional.","correct":true}]},
