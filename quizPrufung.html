{"cat":"wiso","sub":"pruefung","q":"Herrn Petry liegen Piktogramme zum Löschen mit Feuerlöschgeräten vor. Welches der folgenden dargestellten Verhaltensweisen ist im Löschfall UNZUTREFFEND (falsch)?","qPt":"O Sr. Petry tem pictogramas sobre o uso de extintores de incêndio. Qual dos comportamentos a seguir está ERRADO em caso de incêndio?","a":"Falsch ist die Darstellung 'Tropf- und Fließbrände von unten bekämpfen, nie von oben löschen'. Tatsächlich müssen Tropf- und Fließbrände von OBEN nach unten gelöscht werden, da sich das brennende Material sonst weiter ausbreiten kann.","aPt":"Está errada a representação 'combater incêndios de gotejamento e escoamento por baixo, nunca apagar por cima'. Na realidade, esse tipo de incêndio deve ser combatido de CIMA para baixo, pois senão o material em chamas pode se espalhar ainda mais.","options":[{"text":"Tropf- und Fließbrände von unten bekämpfen, nie von oben löschen.","textPt":"Combater incêndios de gotejamento e escoamento por baixo, nunca apagar por cima.","correct":true},{"text":"Brandstelle beobachten, auf Wiederentzündung warten, nicht einfach weggehen.","textPt":"Observar o local do incêndio, aguardar possível reignição, não ir embora simplesmente.","correct":false},{"text":"Möglichst viele Feuerlöscher gleichzeitig benutzen, nicht hintereinander.","textPt":"Usar o maior número possível de extintores ao mesmo tempo, não um após o outro.","correct":false},{"text":"Immer in Windrichtung löschen, nicht gegen den Wind.","textPt":"Sempre apagar a favor do vento, nunca contra o vento.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In welcher Reihenfolge wird ein Feuerlöscher mit Dauerdruck korrekt bedient?","qPt":"Em que ordem um extintor de pressão permanente deve ser operado corretamente?","a":"Die richtige Reihenfolge ist: 1. Zum Feuerlöschgerät laufen, 2. Feuerlöscher aus der Wandhalterung entnehmen, 3. Sicherungsstift/Sicherungslasche ziehen, 4. Betätigungshebel ziehen/Betätigungstaste drücken, 5. Schlauch in Richtung Feuer halten.","aPt":"A ordem correta é: 1. Correr até o extintor, 2. Retirar o extintor do suporte na parede, 3. Puxar o pino/trava de segurança, 4. Pressionar a alavanca/botão de acionamento, 5. Direcionar a mangueira para o fogo.","options":[{"text":"Zum Feuerlöschgerät laufen → Feuerlöscher entnehmen → Sicherungsstift ziehen → Betätigungshebel drücken → Schlauch auf das Feuer richten.","textPt":"Correr até o extintor → retirá-lo do suporte → puxar o pino de segurança → pressionar a alavanca → direcionar a mangueira ao fogo.","correct":true},{"text":"Sicherungsstift ziehen → Zum Feuerlöschgerät laufen → Schlauch auf das Feuer richten → Feuerlöscher entnehmen → Betätigungshebel drücken.","textPt":"Puxar o pino de segurança → correr até o extintor → direcionar a mangueira ao fogo → retirar o extintor → pressionar a alavanca.","correct":false},{"text":"Feuerlöscher entnehmen → Betätigungshebel drücken → Zum Feuerlöschgerät laufen → Sicherungsstift ziehen → Schlauch auf das Feuer richten.","textPt":"Retirar o extintor → pressionar a alavanca → correr até o extintor → puxar o pino → direcionar a mangueira ao fogo.","correct":false},{"text":"Schlauch auf das Feuer richten → Sicherungsstift ziehen → Feuerlöscher entnehmen → Zum Feuerlöschgerät laufen → Betätigungshebel drücken.","textPt":"Direcionar a mangueira ao fogo → puxar o pino → retirar o extintor → correr até ele → pressionar a alavanca.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Im Rahmen des Umweltschutzes soll künftig stärker das Verursacherprinzip berücksichtigt werden. Welche Aussage zum Verursacherprinzip trifft zu?","qPt":"No âmbito da proteção ambiental, o princípio do poluidor-pagador (Verursacherprinzip) deve ser aplicado com mais força no futuro. Qual afirmação sobre esse princípio é correta?","a":"Das Verursacherprinzip bedeutet, dass die Kosten für die Beseitigung von Umweltschäden von denjenigen getragen werden, die für die Schäden verantwortlich sind.","aPt":"O princípio do poluidor-pagador significa que os custos para reparar danos ambientais são arcados por quem é responsável por esses danos.","options":[{"text":"Das Verursacherprinzip bedeutet, dass die Kosten für die Beseitigung von Umweltschäden diejenigen tragen, die für die Schäden verantwortlich sind.","textPt":"O princípio do poluidor-pagador significa que os custos de reparação ambiental são pagos pelos responsáveis pelos danos.","correct":true},{"text":"Das Verursacherprinzip bedeutet, dass die Kosten für die Beseitigung von Umweltschäden auf alle Mitglieder der Solidargemeinschaft gleichmäßig aufgeteilt werden.","textPt":"Significa que os custos são divididos igualmente entre todos os membros da comunidade.","correct":false},{"text":"Das Verursacherprinzip bedeutet, dass die Abfallentsorgung wichtiger ist als die Abfallvermeidung.","textPt":"Significa que o descarte de resíduos é mais importante do que a sua prevenção.","correct":false},{"text":"Das Verursacherprinzip bedeutet, dass ausreichend Verpackungsmaterial eingesetzt wird, damit die Ware nicht beschädigt wird.","textPt":"Significa que deve ser usado material de embalagem suficiente para que a mercadoria não seja danificada.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Zweck des Kreislaufwirtschaftsgesetzes ist es u. a., das Recycling von Abfällen zu fördern. Welche Handlung im Betriebsablauf der Sachs-IT GmbH wird als Recycling bezeichnet?","qPt":"Um dos objetivos da Lei de Economia Circular (Kreislaufwirtschaftsgesetz) é promover a reciclagem de resíduos. Qual ação na rotina da Sachs-IT GmbH é considerada reciclagem?","a":"Recycling liegt vor, wenn anfallende Verpackungen erst nach Materialien getrennt und dann dem Dualen System zur Wiederverwertung zugeführt werden.","aPt":"Há reciclagem quando as embalagens geradas são separadas por tipo de material e depois encaminhadas ao sistema dual (Duales System) para reaproveitamento.","options":[{"text":"Anfallende Verpackungen werden erst nach Materialien getrennt und dann dem Dualen System zugeführt.","textPt":"As embalagens geradas são separadas por material e enviadas ao sistema dual de reciclagem.","correct":true},{"text":"Die Sachs-IT GmbH verwendet für Verpackungen nur Materialien mit dem Umweltsiegel.","textPt":"A empresa usa somente materiais com selo ambiental nas embalagens.","correct":false},{"text":"In den Waschräumen werden besonders hygienische Papierhandtücher bereitgelegt.","textPt":"Nos banheiros são disponibilizadas toalhas de papel especialmente higiênicas.","correct":false},{"text":"Durch Öko-Toiletten-Spülungen wird Trinkwasser gespart.","textPt":"Com descargas ecológicas, economiza-se água potável.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Sachs-IT GmbH überlegt, der 'Charta der Vielfalt' beizutreten, einer Selbstverpflichtung für ein vorurteilsfreies Arbeitsumfeld. Welcher der folgenden Punkte wird in der Charta der Vielfalt NICHT berücksichtigt?","qPt":"A Sachs-IT GmbH está considerando aderir à 'Carta da Diversidade', um compromisso voluntário por um ambiente de trabalho livre de preconceitos. Qual dos seguintes pontos NÃO é considerado pela Carta da Diversidade?","a":"Der Ausbildungsstand bzw. die Art des Abschlusses wird nicht berücksichtigt, da dies zur fachlichen/objektiven Qualifikation zählt und kein Diversity-Merkmal im Sinne der Charta ist.","aPt":"O nível de formação ou o tipo de diploma não é considerado, pois isso faz parte da qualificação técnica/objetiva e não é uma característica de diversidade no sentido da Carta.","options":[{"text":"Ausbildungsstand/Art des Abschlusses","textPt":"Nível de formação / tipo de diploma","correct":true},{"text":"Alter","textPt":"Idade","correct":false},{"text":"Religion","textPt":"Religião","correct":false},{"text":"Sexuelle Orientierung/Identität","textPt":"Orientação/identidade sexual","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ihr Kollege fragt Sie, was das Ziel des Diversity Managements ist. Welche Antwort geben Sie ihm?","qPt":"Um colega pergunta qual é o objetivo da gestão da diversidade (Diversity Management). Qual resposta você dá a ele?","a":"Diversity Management will die in der Vielfalt der Belegschaft liegenden Potenziale für das Unternehmen nutzbar machen.","aPt":"A gestão da diversidade busca aproveitar para a empresa os potenciais que existem na diversidade da equipe.","options":[{"text":"Diversity Management will die in der Vielfalt der Belegschaft liegenden Potenziale für das Unternehmen nutzbar machen.","textPt":"Busca aproveitar para a empresa os potenciais existentes na diversidade da equipe.","correct":true},{"text":"Diversity Management zielt auf eine Gewinnmaximierung durch Personaleinsparung ab.","textPt":"Visa maximizar lucros através da redução de pessoal.","correct":false},{"text":"Diversity Management umfasst alle Strategien, die es erlauben, Ungleiches gleich und Gleiches ungleich zu behandeln.","textPt":"Abrange estratégias que permitem tratar o desigual como igual e o igual como desigual.","correct":false},{"text":"Diversity Management ist ein klassischer Teil des Personalwesens und soll die bestehenden Vorurteile bei Kunden ausnutzen.","textPt":"É uma parte clássica de RH e visa explorar os preconceitos existentes nos clientes.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Daniel Koroki macht eine Ausbildung bei der MarSi-IT GmbH. Welche Anforderung muss ein Mitarbeiter erfüllen, um als Ausbilder tätig sein zu dürfen?","qPt":"Daniel Koroki faz uma formação profissional na MarSi-IT GmbH. Qual requisito um funcionário deve cumprir para poder atuar como formador (Ausbilder)?","a":"Der Ausbilder muss fachlich und persönlich geeignet sein. Eine eigene Berufsausbildung vorweisen zu müssen oder Mitglied der Geschäftsleitung zu sein, ist hingegen keine gesetzliche Voraussetzung.","aPt":"O formador precisa ter aptidão técnica e pessoal. Já ter concluído uma formação profissional própria ou ser membro da diretoria não são exigências legais.","options":[{"text":"Der Ausbilder muss fachlich und persönlich geeignet sein.","textPt":"O formador precisa ter aptidão técnica e pessoal.","correct":true},{"text":"Der Ausbilder muss eine Berufsausbildung vorweisen.","textPt":"O formador precisa comprovar uma formação profissional.","correct":false},{"text":"Der Ausbilder muss sicherstellen, dass eine angemessene Anzahl von Mitarbeitern im Betrieb tätig ist.","textPt":"O formador precisa garantir que um número adequado de funcionários trabalhe na empresa.","correct":false},{"text":"Der Ausbilder muss persönlich die notwendigen Räumlichkeiten und Gerätschaften besitzen.","textPt":"O formador precisa possuir pessoalmente as instalações e equipamentos necessários.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die MarSi-IT GmbH ist als Gesellschaft mit beschränkter Haftung organisiert. Welche Angabe trifft auf eine GmbH zu?","qPt":"A MarSi-IT GmbH está organizada como uma sociedade de responsabilidade limitada (GmbH). Qual afirmação sobre uma GmbH é correta?","a":"Eine GmbH ist eine Kapitalgesellschaft, bei der die Haftung der Gesellschafter grundsätzlich auf das Gesellschaftsvermögen beschränkt ist.","aPt":"Uma GmbH é uma sociedade de capital, na qual a responsabilidade dos sócios é, em regra, limitada ao patrimônio da sociedade.","options":[{"text":"Eine GmbH ist eine Kapitalgesellschaft.","textPt":"Uma GmbH é uma sociedade de capital.","correct":true},{"text":"Eine GmbH ist eine juristische Person des öffentlichen Rechts.","textPt":"Uma GmbH é uma pessoa jurídica de direito público.","correct":false},{"text":"Eine GmbH ist ein Monopolist in der jeweiligen Region und Branche.","textPt":"Uma GmbH é um monopolista na respectiva região e setor.","correct":false},{"text":"Eine GmbH ist ein legales Kartell.","textPt":"Uma GmbH é um cartel legal.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Gesellschafter Achim Klausen hat eine Stammeinlage von 375.000 EUR in die MarSi-IT GmbH eingebracht. Laut Beschluss der Gesellschafterversammlung erhielt er im Geschäftsjahr 2021 einen Gewinnanteil von 28.125 EUR. Wie hoch ist seine Eigenkapitalrentabilität in Prozent?","qPt":"O sócio Achim Klausen integralizou uma quota social de 375.000€ na MarSi-IT GmbH. Segundo decisão da assembleia de sócios, ele recebeu, no exercício de 2021, uma participação nos lucros de 28.125€. Qual é sua rentabilidade sobre o capital próprio, em porcentagem?","a":"Die Eigenkapitalrentabilität beträgt 7,5 % (Gewinn ÷ eingesetztes Eigenkapital × 100 = 28.125 ÷ 375.000 × 100 = 7,5 %).","aPt":"A rentabilidade sobre o capital próprio é de 7,5% (lucro ÷ capital próprio investido × 100 = 28.125 ÷ 375.000 × 100 = 7,5%).","options":[{"text":"7,5 %","textPt":"7,5%","correct":true},{"text":"6,5 %","textPt":"6,5%","correct":false},{"text":"8,5 %","textPt":"8,5%","correct":false},{"text":"10 %","textPt":"10%","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Noch vor dem Ende der Ausbildung wird Herrn Koroki ein befristeter Arbeitsvertrag angeboten. Welche Aussage zu befristeten Arbeitsverhältnissen ist zutreffend?","qPt":"Ainda antes do fim da formação, é oferecido ao Sr. Koroki um contrato de trabalho por prazo determinado. Qual afirmação sobre relações de trabalho por prazo determinado é correta?","a":"Die Befristung eines Arbeitsvertrages ist nach § 14 Abs. 4 TzBfG nur wirksam, wenn sie schriftlich vereinbart wurde.","aPt":"Segundo o §14, parágrafo 4 da TzBfG, a determinação do prazo de um contrato de trabalho só é válida se acordada por escrito.","options":[{"text":"Die Befristung eines Arbeitsvertrages ist nur wirksam, wenn sie schriftlich vereinbart wurde.","textPt":"A determinação do prazo só é válida se acordada por escrito.","correct":true},{"text":"Befristete Arbeitsverhältnisse sind immer unzulässig.","textPt":"Relações de trabalho por prazo determinado são sempre inadmissíveis.","correct":false},{"text":"Eine befristete Einstellung ist höchstens für eine Dauer von zwei Monaten zulässig.","textPt":"Uma contratação por prazo determinado é permitida no máximo por dois meses.","correct":false},{"text":"Die Befristung ist auch dann zulässig, wenn sie durch keinen sachlichen Grund gerechtfertigt ist und länger als drei Jahre andauert.","textPt":"A determinação do prazo é permitida mesmo sem justificativa material, ainda que dure mais de três anos.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Mit der Unterzeichnung des Arbeitsvertrages als Fachinformatiker Anwendungsentwicklung geht Herr Koroki bestimmte Pflichten gegenüber seinem Arbeitgeber ein. Welche Pflicht übernimmt ein Arbeitnehmer mit der Unterzeichnung des Arbeitsvertrages?","qPt":"Ao assinar o contrato de trabalho como Fachinformatiker em Desenvolvimento de Aplicações, o Sr. Koroki assume certos deveres perante seu empregador. Qual dever um trabalhador assume ao assinar o contrato de trabalho?","a":"Der Arbeitnehmer übernimmt u. a. die Verschwiegenheitspflicht, also die Pflicht, betriebliche und geschäftliche Geheimnisse nicht an Dritte weiterzugeben. Fürsorge-, Beschäftigungs- und Gleichbehandlungspflicht sind dagegen Pflichten des Arbeitgebers.","aPt":"O trabalhador assume, entre outros, o dever de sigilo — ou seja, o dever de não revelar a terceiros segredos empresariais e comerciais. Já os deveres de assistência, ocupação e igualdade de tratamento são obrigações do empregador.","options":[{"text":"Verschwiegenheitspflicht","textPt":"Dever de sigilo","correct":true},{"text":"Fürsorgepflicht","textPt":"Dever de assistência","correct":false},{"text":"Beschäftigungspflicht","textPt":"Dever de ocupação","correct":false},{"text":"Gleichbehandlungspflicht","textPt":"Dever de igualdade de tratamento","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Für den Umbau der Verkaufsräume setzt die MarSi-IT GmbH Zeitarbeitnehmer (Arbeitnehmerüberlassung) ein. Welche Aussage zur Arbeitnehmerüberlassung ist zutreffend?","qPt":"Para a reforma das salas de venda, a MarSi-IT GmbH contrata trabalhadores temporários (cessão de mão de obra). Qual afirmação sobre a cessão de trabalhadores temporários é correta?","a":"Die Entlohnung eines Zeitarbeitnehmers bestimmt der Verleiher (die Zeitarbeitsfirma), nicht der Entleihbetrieb, in dem der Zeitarbeitnehmer tatsächlich eingesetzt wird.","aPt":"A remuneração de um trabalhador temporário é definida pela empresa cedente (a agência de trabalho temporário), não pela empresa tomadora onde ele efetivamente atua.","options":[{"text":"Die Entlohnung eines Zeitarbeitnehmers bestimmt der Verleiher.","textPt":"A remuneração do trabalhador temporário é definida pela empresa cedente.","correct":true},{"text":"Die Entlohnung eines Zeitarbeitnehmers bestimmt der Betrieb, in dem der Zeitarbeitnehmer tätig ist.","textPt":"A remuneração é definida pela empresa onde o trabalhador atua.","correct":false},{"text":"Zeitarbeitnehmer haben keinen Urlaubsanspruch.","textPt":"Trabalhadores temporários não têm direito a férias.","correct":false},{"text":"Zeitarbeitnehmer werden ausschließlich unbefristet eingestellt.","textPt":"Trabalhadores temporários só são contratados por prazo indeterminado.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Für die MarSi-IT GmbH gelten als Arbeitgeber verschiedene arbeitsrechtliche Bestimmungen. Welche der folgenden Regelungen gehört zum Individualarbeitsrecht?","qPt":"Para a MarSi-IT GmbH, como empregadora, aplicam-se várias disposições do direito do trabalho. Qual das seguintes regras pertence ao direito individual do trabalho?","a":"Übertarifliche Gehaltsvereinbarungen gehören zum Individualarbeitsrecht, da sie individuell zwischen Arbeitgeber und einzelnem Arbeitnehmer vereinbart werden – im Gegensatz zu Betriebsvereinbarungen oder tariflichen/gesetzlichen Regelungen, die kollektives Arbeitsrecht sind.","aPt":"Acordos salariais acima da convenção coletiva pertencem ao direito individual do trabalho, pois são acordados individualmente entre empregador e trabalhador — diferente de acordos de empresa ou regras coletivas/legais, que são direito coletivo do trabalho.","options":[{"text":"Übertarifliche Gehaltsvereinbarungen","textPt":"Acordos salariais acima da convenção coletiva","correct":true},{"text":"Betriebsvereinbarungen","textPt":"Acordos de empresa","correct":false},{"text":"Unfallverhütungsvorschriften","textPt":"Normas de prevenção de acidentes","correct":false},{"text":"Urlaubsregelungen nach dem Bundesurlaubsgesetz","textPt":"Regras de férias segundo a lei federal de férias","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Koroki hat Fragen zu seinem Urlaubsanspruch nach dem Bundesurlaubsgesetz. Welche Aussage zum Bundesurlaubsgesetz ist zutreffend?","qPt":"O Sr. Koroki tem dúvidas sobre seu direito a férias segundo a Lei Federal de Férias (Bundesurlaubsgesetz). Qual afirmação sobre essa lei é correta?","a":"Der volle Urlaubsanspruch entsteht erst nach einer sechsmonatigen Wartezeit des Bestehens des Arbeitsverhältnisses (§ 4 BUrlG).","aPt":"O direito integral a férias só surge após um período de carência de seis meses de vigência da relação de trabalho (§4 BUrlG).","options":[{"text":"Der volle Urlaubsanspruch besteht erst nach sechsmonatigem Bestehen des Arbeitsverhältnisses.","textPt":"O direito integral a férias só existe após seis meses de relação de trabalho.","correct":true},{"text":"Erkrankt ein Arbeitnehmer in seinem Urlaub, verfällt sein Urlaubsanspruch.","textPt":"Se o trabalhador adoece durante as férias, seu direito a férias se extingue.","correct":false},{"text":"Jeder Arbeitnehmer hat Anspruch auf 30 Werktage Urlaub.","textPt":"Todo trabalhador tem direito a 30 dias úteis de férias.","correct":false},{"text":"Nicht beanspruchter Urlaub kann bis zu sechs Monate lang in das nächste Kalenderjahr übertragen werden.","textPt":"Férias não usufruídas podem ser transferidas por até seis meses para o próximo ano-calendário.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die schwangere Anwendungsentwicklerin Frau Menedi fragt, welche Regelung sich im Mutterschutzgesetz findet. Welche Aussage ist zutreffend?","qPt":"A desenvolvedora grávida, Sra. Menedi, pergunta qual regra consta na Lei de Proteção à Maternidade (Mutterschutzgesetz). Qual afirmação é correta?","a":"Es besteht Kündigungsschutz während der gesamten Schwangerschaft und bis zum Ablauf von vier Monaten nach der Entbindung.","aPt":"Existe proteção contra demissão durante toda a gravidez e até quatro meses após o parto.","options":[{"text":"Es besteht Kündigungsschutz während der gesamten Schwangerschaft und bis zum Ablauf von vier Monaten nach der Entbindung.","textPt":"Existe proteção contra demissão durante toda a gravidez e até quatro meses após o parto.","correct":true},{"text":"Im Normalfall dürfen Frauen zehn Wochen vor und fünfzehn Wochen nach der Entbindung nicht beschäftigt werden.","textPt":"Em regra, as mulheres não podem trabalhar dez semanas antes e quinze semanas depois do parto.","correct":false},{"text":"Das Mutterschaftsgeld wird während der gesamten Schwangerschaft gezahlt.","textPt":"O auxílio-maternidade é pago durante toda a gravidez.","correct":false},{"text":"Mütter haben bis zur Vollendung des sechsten Lebensjahres des Kindes einen Rechtsanspruch auf Elternzeit.","textPt":"As mães têm direito à licença parental até o filho completar seis anos.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Einem Arbeitnehmer der MarSi-IT GmbH soll wegen wiederholter Nichtbeachtung des Alkoholverbotes während der Arbeitszeit gekündigt werden. Um welche Art der Kündigung handelt es sich?","qPt":"Um funcionário da MarSi-IT GmbH deve ser demitido por descumprir repetidamente a proibição de álcool durante o horário de trabalho. Que tipo de demissão é essa?","a":"Es handelt sich um eine verhaltensbedingte Kündigung, da der Kündigungsgrund im steuerbaren Fehlverhalten des Arbeitnehmers liegt.","aPt":"Trata-se de uma demissão motivada por comportamento, pois o motivo da demissão está em uma conduta controlável e indevida do trabalhador.","options":[{"text":"Verhaltensbedingte Kündigung","textPt":"Demissão motivada por comportamento","correct":true},{"text":"Personenbedingte Kündigung","textPt":"Demissão motivada pela pessoa (sem culpa)","correct":false},{"text":"Betriebsbedingte Kündigung","textPt":"Demissão motivada por razões operacionais","correct":false},{"text":"Außerordentliche fristlose Kündigung ohne Grund","textPt":"Demissão extraordinária sem aviso prévio e sem motivo","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Einem Arbeitnehmer der MarSi-IT GmbH soll wegen Krankheit über einen langen Zeitraum gekündigt werden. Um welche Art der Kündigung handelt es sich?","qPt":"Um funcionário da MarSi-IT GmbH deve ser demitido por doença de longa duração. Que tipo de demissão é essa?","a":"Es handelt sich um eine personenbedingte Kündigung, da der Kündigungsgrund in der Person des Arbeitnehmers (hier: lang andauernde Erkrankung) liegt, ohne dass ihm ein Verschulden vorzuwerfen ist.","aPt":"Trata-se de uma demissão motivada pela pessoa, pois o motivo está em características do próprio trabalhador (aqui: doença de longa duração), sem que haja culpa dele.","options":[{"text":"Personenbedingte Kündigung","textPt":"Demissão motivada pela pessoa (sem culpa)","correct":true},{"text":"Verhaltensbedingte Kündigung","textPt":"Demissão motivada por comportamento","correct":false},{"text":"Betriebsbedingte Kündigung","textPt":"Demissão motivada por razões operacionais","correct":false},{"text":"Fristlose außerordentliche Kündigung","textPt":"Demissão extraordinária sem aviso prévio","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Einem Arbeitnehmer der MarSi-IT GmbH soll wegen Gewinnrückgang im Unternehmen gekündigt werden. Um welche Art der Kündigung handelt es sich?","qPt":"Um funcionário da MarSi-IT GmbH deve ser demitido devido à queda de lucros na empresa. Que tipo de demissão é essa?","a":"Es handelt sich um eine betriebsbedingte Kündigung, da der Kündigungsgrund in betrieblichen/wirtschaftlichen Erfordernissen liegt.","aPt":"Trata-se de uma demissão motivada por razões operacionais, pois o motivo está em necessidades econômicas/operacionais da empresa.","options":[{"text":"Betriebsbedingte Kündigung","textPt":"Demissão motivada por razões operacionais","correct":true},{"text":"Personenbedingte Kündigung","textPt":"Demissão motivada pela pessoa","correct":false},{"text":"Verhaltensbedingte Kündigung","textPt":"Demissão motivada por comportamento","correct":false},{"text":"Änderungskündigung ohne betrieblichen Grund","textPt":"Demissão com proposta de alteração contratual sem motivo operacional","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Einem Arbeitnehmer der MarSi-IT GmbH soll wegen wiederholten Verstoßes gegen das strenge Rauchverbot auf dem Betriebsgelände gekündigt werden. Um welche Art der Kündigung handelt es sich?","qPt":"Um funcionário da MarSi-IT GmbH deve ser demitido por violar repetidamente a rígida proibição de fumar nas instalações da empresa. Que tipo de demissão é essa?","a":"Es handelt sich um eine verhaltensbedingte Kündigung, da der wiederholte Verstoß gegen eine klare betriebliche Regel steuerbares Fehlverhalten darstellt.","aPt":"Trata-se de uma demissão motivada por comportamento, já que a violação repetida de uma regra clara da empresa representa uma conduta controlável e indevida.","options":[{"text":"Verhaltensbedingte Kündigung","textPt":"Demissão motivada por comportamento","correct":true},{"text":"Personenbedingte Kündigung","textPt":"Demissão motivada pela pessoa","correct":false},{"text":"Betriebsbedingte Kündigung","textPt":"Demissão motivada por razões operacionais","correct":false},{"text":"Fristlose Kündigung ohne vorherige Abmahnung","textPt":"Demissão sem aviso prévio e sem advertência anterior","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Einem Arbeitnehmer der MarSi-IT GmbH soll wegen Schließung einer Abteilung gekündigt werden. Um welche Art der Kündigung handelt es sich?","qPt":"Um funcionário da MarSi-IT GmbH deve ser demitido devido ao fechamento de um departamento. Que tipo de demissão é essa?","a":"Es handelt sich um eine betriebsbedingte Kündigung, da der Arbeitsplatz durch eine unternehmerische Entscheidung (Schließung der Abteilung) wegfällt.","aPt":"Trata-se de uma demissão motivada por razões operacionais, pois o posto de trabalho deixa de existir devido a uma decisão empresarial (fechamento do departamento).","options":[{"text":"Betriebsbedingte Kündigung","textPt":"Demissão motivada por razões operacionais","correct":true},{"text":"Personenbedingte Kündigung","textPt":"Demissão motivada pela pessoa","correct":false},{"text":"Verhaltensbedingte Kündigung","textPt":"Demissão motivada por comportamento","correct":false},{"text":"Verdachtskündigung","textPt":"Demissão por suspeita","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ulrich Schossauer hat seine Ausbildung bei der MarSi-IT GmbH beendet und möchte ein qualifiziertes Arbeitszeugnis. Welche Formulierung entspricht einer sehr guten Beurteilung?","qPt":"Ulrich Schossauer concluiu sua formação na MarSi-IT GmbH e deseja um atestado de trabalho qualificado. Qual frase corresponde a uma avaliação muito boa?","a":"'Er hat die übertragenen Arbeiten stets zu unserer vollsten Zufriedenheit erledigt' entspricht in der üblichen Zeugnissprache der Bestnote 'sehr gut'.","aPt":"'Ele cumpriu as tarefas atribuídas sempre para nossa inteira satisfação' corresponde, na linguagem padrão dos atestados alemães, à nota máxima 'muito bom'.","options":[{"text":"„Er hat die übertragenen Arbeiten stets zu unserer vollsten Zufriedenheit erledigt.“","textPt":"\"Ele cumpriu as tarefas atribuídas sempre para nossa inteira satisfação.\"","correct":true},{"text":"„Er hat die übertragenen Arbeiten zu unserer Zufriedenheit erledigt.“","textPt":"\"Ele cumpriu as tarefas atribuídas para nossa satisfação.\"","correct":false},{"text":"„Er hat sich bemüht, die übertragenen Arbeiten zu unserer Zufriedenheit zu erledigen.“","textPt":"\"Ele se esforçou para cumprir as tarefas atribuídas para nossa satisfação.\"","correct":false},{"text":"„Er hat die übertragenen Arbeiten im Großen und Ganzen zu unserer Zufriedenheit erledigt.“","textPt":"\"Ele cumpriu as tarefas atribuídas, de modo geral, para nossa satisfação.\"","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der MarSi-IT GmbH gibt es 537 Arbeitnehmer, die das 18. Lebensjahr vollendet haben (davon 250 seit einem halben Jahr befristet eingestellt), sowie 17 volljährige und 2 minderjährige Auszubildende. Nach § 9 BetrVG besteht der Betriebsrat in Betrieben mit 401 bis 700 wahlberechtigten Arbeitnehmern aus 11 Mitgliedern. Wie viele Betriebsratsmitglieder können bei der MarSi-IT GmbH gewählt werden?","qPt":"Na MarSi-IT GmbH há 537 funcionários maiores de 18 anos (dos quais 250 contratados por prazo determinado há seis meses), além de 17 aprendizes maiores e 2 aprendizes menores de idade. Segundo o §9 da BetrVG, o conselho de trabalhadores em empresas com 401 a 700 trabalhadores com direito a voto é formado por 11 membros. Quantos membros do conselho de trabalhadores podem ser eleitos na MarSi-IT GmbH?","a":"Es können 11 Betriebsratsmitglieder gewählt werden. Wahlberechtigt sind alle Arbeitnehmer ab 16 Jahren (§ 7 BetrVG), also 537 + 17 + 2 = 556 Arbeitnehmer – das fällt in die Stufe 401 bis 700 Arbeitnehmer, für die § 9 BetrVG 11 Mitglieder vorsieht.","aPt":"Podem ser eleitos 11 membros do conselho de trabalhadores. Têm direito a voto todos os trabalhadores a partir de 16 anos (§7 BetrVG), ou seja, 537 + 17 + 2 = 556 trabalhadores — o que se enquadra na faixa de 401 a 700 trabalhadores, para a qual o §9 BetrVG prevê 11 membros.","options":[{"text":"11 Mitglieder","textPt":"11 membros","correct":true},{"text":"9 Mitglieder","textPt":"9 membros","correct":false},{"text":"13 Mitglieder","textPt":"13 membros","correct":false},{"text":"7 Mitglieder","textPt":"7 membros","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Nach dem Betriebsverfassungsgesetz hat der Betriebsrat der MarSi-IT GmbH je nach Angelegenheit unterschiedliche Beteiligungsrechte. Bei welcher Angelegenheit hat der Betriebsrat ein Mitbestimmungsrecht?","qPt":"Segundo a Lei de Organização das Empresas, o conselho de trabalhadores da MarSi-IT GmbH tem diferentes direitos de participação conforme o assunto. Em qual assunto o conselho de trabalhadores tem direito de cogestão?","a":"Der Betriebsrat hat bei Betriebsferien (Lage und Verteilung des Urlaubs) nach § 87 BetrVG ein Mitbestimmungsrecht. Bei Umbauplänen, Personalbedarf oder der Einstellung leitender Mitarbeiter besteht dagegen kein Mitbestimmungsrecht in diesem Sinne.","aPt":"O conselho de trabalhadores tem direito de cogestão quanto a períodos coletivos de férias (datas e distribuição das férias), segundo o §87 BetrVG. Já em planos de reforma, necessidade de pessoal ou contratação de cargos de direção, não há esse direito de cogestão.","options":[{"text":"Betriebsferien","textPt":"Período coletivo de férias","correct":true},{"text":"Umbaupläne des Betriebsgeländes","textPt":"Planos de reforma das instalações","correct":false},{"text":"Personalbedarf des Betriebs","textPt":"Necessidade de pessoal da empresa","correct":false},{"text":"Einstellung von leitenden Mitarbeitern","textPt":"Contratação de funcionários em cargos de direção","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Für besondere Interessengruppen können bei der MarSi-IT GmbH spezielle Vertretungen gewählt werden, z. B. die Jugend- und Auszubildendenvertretung (JAV). Welche Aussage zur JAV ist zutreffend?","qPt":"Na MarSi-IT GmbH, grupos de interesse específicos podem eleger representações especiais, como a Representação de Jovens e Aprendizes (JAV). Qual afirmação sobre a JAV é correta?","a":"Nur in einem Betrieb mit Betriebsrat kann auch eine JAV gewählt werden, da die JAV in das System der Betriebsverfassung eingebunden ist und eng mit dem Betriebsrat zusammenarbeitet.","aPt":"A JAV só pode ser eleita em uma empresa que já tenha conselho de trabalhadores, pois a JAV está integrada ao sistema de organização da empresa e trabalha em estreita colaboração com o conselho.","options":[{"text":"Nur in einem Betrieb mit Betriebsrat kann auch eine JAV gewählt werden.","textPt":"A JAV só pode ser eleita em uma empresa que já tenha conselho de trabalhadores.","correct":true},{"text":"Die JAV wird gegenüber der Geschäftsleitung selbstständig tätig.","textPt":"A JAV atua de forma independente perante a diretoria.","correct":false},{"text":"Auszubildende bis zu einem Alter von 27 Jahren dürfen die JAV wählen.","textPt":"Aprendizes com até 27 anos podem votar na eleição da JAV.","correct":false},{"text":"Wer in die JAV gewählt wird, wird nach der Ausbildung automatisch übernommen.","textPt":"Quem é eleito para a JAV é automaticamente efetivado após a formação.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei welchen Stellen kann eine arbeitssuchende Anwendungsentwicklerin finanzielle Förderung für eine Fort- und Weiterbildungsmaßnahme bzw. eine Umschulung erhalten?","qPt":"Em quais órgãos uma desenvolvedora de aplicações desempregada pode obter apoio financeiro para uma medida de qualificação/formação continuada ou requalificação?","a":"Arbeitssuchende können bei den Arbeitsagenturen und den Rentenversicherungsträgern finanzielle Förderung für Fort- und Weiterbildungsmaßnahmen bzw. Umschulungen beantragen.","aPt":"Pessoas em busca de emprego podem solicitar apoio financeiro para qualificação/formação continuada ou requalificação junto às agências de emprego e aos órgãos de previdência social.","options":[{"text":"Arbeitsagenturen und Rentenversicherungsträger","textPt":"Agências de emprego e órgãos de previdência social","correct":true},{"text":"IHK und Krankenkassen","textPt":"Câmara de Comércio (IHK) e caixas de saúde","correct":false},{"text":"IHK und Handwerkskammern","textPt":"Câmara de Comércio (IHK) e câmaras de artesanato","correct":false},{"text":"Arbeitsagenturen und IHK","textPt":"Agências de emprego e Câmara de Comércio (IHK)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die gesetzliche Sozialversicherung ist in Deutschland die wichtigste Institution der sozialen Sicherung und folgt dem Solidarprinzip. Welche Aussage zur Sozialversicherung ist zutreffend?","qPt":"A previdência social legal é, na Alemanha, a instituição mais importante de proteção social e segue o princípio da solidariedade. Qual afirmação sobre a previdência social é correta?","a":"Bei geringfügig Beschäftigten (Minijobbern) zahlt in der Regel der Arbeitgeber allein alle pauschalen Sozialversicherungsabgaben.","aPt":"Em empregos de baixa remuneração (Minijobs), em regra é o empregador quem paga sozinho todas as contribuições sociais fixas.","options":[{"text":"Bei geringfügig Beschäftigten zahlt der Arbeitgeber in der Regel alle Beiträge.","textPt":"Em empregos de baixa remuneração, em regra o empregador paga todas as contribuições.","correct":true},{"text":"Nur Arbeitnehmer werden zur Zahlung der Sozialversicherungsbeiträge herangezogen.","textPt":"Somente trabalhadores são obrigados a pagar contribuições à previdência social.","correct":false},{"text":"Die Gemeinschaft sichert dem Einzelnen ein Tarifgehalt.","textPt":"A comunidade garante a cada indivíduo um salário conforme a convenção coletiva.","correct":false},{"text":"Nur Arbeitgeber werden zur Zahlung der Sozialversicherungsbeiträge herangezogen.","textPt":"Somente empregadores são obrigados a pagar contribuições à previdência social.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die MarSi-IT GmbH ist Mitglied der örtlich zuständigen Industrie- und Handelskammer (IHK). Welche Aufgabe wird von der IHK u. a. wahrgenommen?","qPt":"A MarSi-IT GmbH é membro da Câmara de Indústria e Comércio (IHK) local. Qual tarefa é exercida pela IHK, entre outras?","a":"Die IHK nimmt als Interessenvertreter der gewerblichen Wirtschaft bzw. des Handels Aufgaben in der Beratung sowie in der Aus- und Weiterbildung ihrer Mitgliedsunternehmen wahr.","aPt":"A IHK, como representante dos interesses da economia comercial e do comércio, exerce tarefas de assessoria e de formação profissional e continuada para suas empresas associadas.","options":[{"text":"Sie nimmt als Interessenvertreter der gewerblichen Wirtschaft/des Handels Aufgaben in der Beratung und der Aus- und Weiterbildung wahr.","textPt":"Atua como representante dos interesses da economia/comércio em tarefas de assessoria e formação profissional.","correct":true},{"text":"Sie wird zur Überwachung der verschiedenen Schutzgesetze eingesetzt.","textPt":"É usada para fiscalizar diversas leis de proteção.","correct":false},{"text":"Sie nimmt Meldungen von Betriebsunfällen entgegen und leitet sie an die zuständigen Stellen weiter.","textPt":"Recebe comunicações de acidentes de trabalho e as encaminha aos órgãos competentes.","correct":false},{"text":"Ihre Stimme ist beim Abschluss von Tarifverträgen entscheidend.","textPt":"Seu voto é decisivo na celebração de convenções coletivas.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Eine Praktikantin der MarSi-IT GmbH hat in der Zeitung von der gesetzlichen Unfallversicherung gelesen. Welche Aussage über die gesetzliche Unfallversicherung ist zutreffend?","qPt":"Uma estagiária da MarSi-IT GmbH leu no jornal sobre o seguro de acidentes legal. Qual afirmação sobre o seguro de acidentes legal é correta?","a":"Träger der gesetzlichen Unfallversicherung sind die zuständigen Berufsgenossenschaften.","aPt":"As responsáveis pelo seguro de acidentes legal são as associações profissionais competentes (Berufsgenossenschaften).","options":[{"text":"Träger der gesetzlichen Unfallversicherung sind die zuständigen Berufsgenossenschaften.","textPt":"As responsáveis pelo seguro de acidentes legal são as associações profissionais competentes.","correct":true},{"text":"In der gesetzlichen Unfallversicherung sind nur leitende Angestellte versichert.","textPt":"No seguro de acidentes legal, só funcionários em cargos de direção são segurados.","correct":false},{"text":"Wenn ein Arbeitnehmer bei einem Arbeitsunfall Erste Hilfe leistet, ist er nicht versichert.","textPt":"Se um trabalhador presta primeiros socorros em um acidente de trabalho, ele não está segurado.","correct":false},{"text":"Die gesetzliche Unfallversicherung bietet auch Schutz bei Unfällen in der Freizeit.","textPt":"O seguro de acidentes legal também protege acidentes ocorridos no tempo livre.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ein Freund von Herrn Koroki ist kurzfristig arbeitslos geworden und möchte Arbeitslosengeld beantragen. Welche Aussage über das Arbeitslosengeld ist zutreffend?","qPt":"Um amigo do Sr. Koroki ficou desempregado recentemente e quer solicitar o seguro-desemprego. Qual afirmação sobre o seguro-desemprego é correta?","a":"Zur Berechnung des Arbeitslosengeldes wird das Bruttoentgelt der vergangenen zwölf Monate zugrunde gelegt.","aPt":"Para o cálculo do seguro-desemprego, é utilizado como base o salário bruto dos últimos doze meses.","options":[{"text":"Zur Berechnung des Arbeitslosengeldes wird das Bruttoentgelt der vergangenen zwölf Monate zugrunde gelegt.","textPt":"Para o cálculo, usa-se como base o salário bruto dos últimos doze meses.","correct":true},{"text":"Die Höhe des Arbeitslosengeldes ist unabhängig von dem vorherigen Arbeitsentgelt immer gleich.","textPt":"O valor do seguro-desemprego é sempre igual, independente do salário anterior.","correct":false},{"text":"Das Arbeitslosengeld wird nur an diejenigen ausgezahlt, die bedürftig und arbeitsunfähig sind.","textPt":"O seguro-desemprego só é pago a quem é necessitado e incapaz para o trabalho.","correct":false},{"text":"Bevor ein Anspruch auf Arbeitslosengeld besteht, müssen erst alle Ersparnisse aufgebraucht werden.","textPt":"Antes de haver direito ao seguro-desemprego, é preciso esgotar todas as economias.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herrn Koroki fällt bei der Kontrolle seiner Lohnabrechnung der Beitrag zur Pflegeversicherung auf. Welche Aussage über die Pflegeversicherung ist zutreffend?","qPt":"Ao conferir seu holerite, o Sr. Koroki nota a contribuição ao seguro-cuidado (Pflegeversicherung). Qual afirmação sobre o seguro-cuidado é correta?","a":"Kinderlose Arbeitnehmer über 23 Jahre zahlen einen höheren Beitrag zur Pflegeversicherung als Arbeitnehmer mit Kindern (Kinderlosenzuschlag).","aPt":"Trabalhadores sem filhos com mais de 23 anos pagam uma contribuição mais alta ao seguro-cuidado do que trabalhadores com filhos (adicional para quem não tem filhos).","options":[{"text":"Kinderlose Arbeitnehmer über 23 Jahre zahlen einen höheren Beitrag als Arbeitnehmer mit Kindern.","textPt":"Trabalhadores sem filhos com mais de 23 anos pagam uma contribuição mais alta do que os com filhos.","correct":true},{"text":"Die Pflegeversicherungsträger sind eigenständige staatliche Institutionen.","textPt":"As entidades do seguro-cuidado são instituições estatais independentes.","correct":false},{"text":"Rentner, Studenten und Arbeitslosengeldempfänger sind nicht versichert.","textPt":"Aposentados, estudantes e beneficiários do seguro-desemprego não são segurados.","correct":false},{"text":"Die Pflegeversicherung wird allein vom Arbeitnehmer gezahlt.","textPt":"O seguro-cuidado é pago exclusivamente pelo trabalhador.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Beim Aufbau eines neuen Serverschrankes hat sich ein Kollege von Herrn Koroki einen Finger so stark eingeklemmt, dass dieser ärztlich versorgt werden muss. Welcher Stelle muss die MarSi-IT GmbH die Unfallmeldung unverzüglich zustellen?","qPt":"Durante a montagem de um novo rack de servidores, um colega do Sr. Koroki prendeu o dedo com tanta força que precisou de atendimento médico. A qual órgão a MarSi-IT GmbH deve enviar imediatamente a comunicação do acidente?","a":"Die Unfallmeldung muss unverzüglich der zuständigen Berufsgenossenschaft zugestellt werden, da sie Träger der gesetzlichen Unfallversicherung ist.","aPt":"A comunicação do acidente deve ser enviada imediatamente à associação profissional (Berufsgenossenschaft) competente, pois ela é a responsável pelo seguro de acidentes legal.","options":[{"text":"Berufsgenossenschaft","textPt":"Associação profissional (Berufsgenossenschaft)","correct":true},{"text":"Haftpflichtversicherung","textPt":"Seguro de responsabilidade civil","correct":false},{"text":"Gewerbeaufsichtsbehörde","textPt":"Órgão de fiscalização comercial","correct":false},{"text":"Krankenkasse","textPt":"Caixa de saúde","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Eine Statistik zeigt: meldepflichtige Wegeunfälle im Vorjahr 223.973, im aktuellen Jahr 188.452 (Veränderung -15,86 %). Lässt sich damit die Aussage belegen, dass es im Vorjahr mehr meldepflichtige Wegeunfälle gab als im aktuellen Jahr?","qPt":"Uma estatística mostra: acidentes de trajeto de notificação obrigatória no ano anterior: 223.973; no ano atual: 188.452 (variação de -15,86%). Isso comprova a afirmação de que houve mais acidentes de trajeto no ano anterior do que no ano atual?","a":"Ja. Mit 223.973 Wegeunfällen im Vorjahr gegenüber 188.452 im aktuellen Jahr (ein Rückgang von 15,86 %) gab es im Vorjahr tatsächlich mehr meldepflichtige Wegeunfälle.","aPt":"Sim. Com 223.973 acidentes de trajeto no ano anterior contra 188.452 no ano atual (uma queda de 15,86%), de fato houve mais acidentes de trajeto no ano anterior.","options":[{"text":"Ja, im Vorjahr gab es mehr meldepflichtige Wegeunfälle als im aktuellen Jahr.","textPt":"Sim, no ano anterior houve mais acidentes de trajeto do que no ano atual.","correct":true},{"text":"Nein, die Zahl der Wegeunfälle ist im aktuellen Jahr gestiegen.","textPt":"Não, o número de acidentes de trajeto aumentou no ano atual.","correct":false},{"text":"Nein, die Zahl blieb in beiden Jahren exakt gleich.","textPt":"Não, o número permaneceu exatamente igual nos dois anos.","correct":false},{"text":"Das lässt sich aus der Statistik nicht ablesen.","textPt":"Isso não pode ser lido na estatística.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Dieselbe Statistik zeigt bei den tödlichen Wegeunfällen: Vorjahr 367, aktuelles Jahr 394 (Veränderung +7,36 %). Lässt sich damit belegen, dass die Anzahl der tödlichen Wegeunfälle im aktuellen Jahr gestiegen ist?","qPt":"A mesma estatística mostra, para acidentes de trajeto fatais: ano anterior 367, ano atual 394 (variação de +7,36%). Isso comprova que o número de acidentes de trajeto fatais aumentou no ano atual?","a":"Ja. Mit 394 tödlichen Wegeunfällen im aktuellen Jahr gegenüber 367 im Vorjahr (+7,36 %) ist die Anzahl eindeutig gestiegen.","aPt":"Sim. Com 394 acidentes de trajeto fatais no ano atual contra 367 no ano anterior (+7,36%), o número claramente aumentou.","options":[{"text":"Ja, die Anzahl der tödlichen Wegeunfälle ist im aktuellen Jahr gestiegen.","textPt":"Sim, o número de acidentes de trajeto fatais aumentou no ano atual.","correct":true},{"text":"Nein, die Anzahl der tödlichen Wegeunfälle ist gesunken.","textPt":"Não, o número de acidentes de trajeto fatais diminuiu.","correct":false},{"text":"Nein, die Gesamtzahl der tödlichen Unfälle ist insgesamt gesunken.","textPt":"Não, o número total de acidentes fatais diminuiu no geral.","correct":false},{"text":"Die Statistik lässt dazu keine Aussage zu.","textPt":"A estatística não permite nenhuma conclusão sobre isso.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Nils Singer überlegt, sich nach seiner Berufsausbildung zum Fachinformatiker Systemintegration bei der MarSi-IT GmbH selbstständig zu machen. Welche Aussage zur Existenzgründung ist zutreffend?","qPt":"Nils Singer está pensando em abrir seu próprio negócio após concluir sua formação como Fachinformatiker em Integração de Sistemas na MarSi-IT GmbH. Qual afirmação sobre a abertura de um negócio é correta?","a":"Für den Erfolg der Existenzgründung sind Kenntnisse über den Markt und die Kundenwünsche wichtig.","aPt":"Para o sucesso da abertura de um negócio, é importante ter conhecimento sobre o mercado e os desejos dos clientes.","options":[{"text":"Für den Erfolg der Existenzgründung sind Kenntnisse über den Markt und die Kundenwünsche wichtig.","textPt":"Para o sucesso, é importante ter conhecimento sobre o mercado e os desejos dos clientes.","correct":true},{"text":"Sich in der heutigen Zeit selbstständig zu machen, bedeutet kein großes finanzielles Risiko.","textPt":"Hoje em dia, abrir um negócio próprio não representa grande risco financeiro.","correct":false},{"text":"In der Gründungsphase kann der Gründer immer von einem 'guten Verdienst' ausgehen.","textPt":"Na fase inicial, o empreendedor pode sempre contar com uma 'boa renda'.","correct":false},{"text":"Gegen Risiken wie Krankheit und Alter ist ein Existenzgründer automatisch durch die Sozialversicherung abgesichert.","textPt":"Um empreendedor está automaticamente protegido pela previdência social contra riscos como doença e velhice.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Singer überlegt, sein Unternehmen als Ist-Kaufmann zu betreiben. Welche Aussage zum angedachten Unternehmen ist zutreffend?","qPt":"O Sr. Singer está pensando em administrar sua empresa como 'Ist-Kaufmann' (comerciante de fato, segundo o Código Comercial alemão). Qual afirmação sobre a empresa planejada é correta?","a":"Die Eintragung von Herrn Singer als Ist-Kaufmann im Handelsregister hat rein deklaratorische Wirkung, da er bereits kraft Gesetzes (durch den Betrieb eines kaufmännisch eingerichteten Gewerbes) Kaufmann ist; die Eintragung bestätigt diesen Status nur.","aPt":"O registro do Sr. Singer como Ist-Kaufmann no registro comercial tem efeito meramente declaratório, pois ele já é comerciante por força de lei (por operar um negócio organizado comercialmente); o registro apenas confirma esse status.","options":[{"text":"Die Eintragung von Herrn Singer als Ist-Kaufmann im Handelsregister hat rein deklaratorische Wirkung.","textPt":"O registro como Ist-Kaufmann no registro comercial tem efeito meramente declaratório.","correct":true},{"text":"Zur Absicherung von Krediten muss Herr Singer zwingend die Unternehmensform der GmbH wählen.","textPt":"Para garantir créditos, o Sr. Singer deve obrigatoriamente escolher a forma jurídica de GmbH.","correct":false},{"text":"Herr Singer ist im ersten Jahr von der Einkommensteuerpflicht befreit, wenn er Gewerbesteuer zahlt.","textPt":"O Sr. Singer fica isento do imposto de renda no primeiro ano se pagar o imposto sobre atividades comerciais.","correct":false},{"text":"Als selbstständiger Ist-Kaufmann benötigt Herr Singer keine Krankenversicherung.","textPt":"Como Ist-Kaufmann autônomo, o Sr. Singer não precisa de seguro-saúde.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Beim Betreten des Lagers der MarSi-IT GmbH stellt Herr Koroki fest, dass Verpackungsmaterialien Feuer gefangen haben. Welche Aktion sollte er AUF KEINEN FALL durchführen?","qPt":"Ao entrar no depósito da MarSi-IT GmbH, o Sr. Koroki percebe que materiais de embalagem pegaram fogo. Qual ação ele NUNCA deveria realizar?","a":"Er sollte auf keinen Fall ein zweites Fenster öffnen, damit der Rauch besser abziehen kann, da die zusätzliche Luftzufuhr (Sauerstoff) das Feuer anfachen und sich schneller ausbreiten lassen würde.","aPt":"Ele nunca deveria abrir uma segunda janela para que a fumaça saísse melhor, pois a entrada extra de ar (oxigênio) alimentaria o fogo e faria com que ele se espalhasse mais rápido.","options":[{"text":"Ein zweites Fenster öffnen, damit der Rauch besser abziehen kann.","textPt":"Abrir uma segunda janela para que a fumaça saia melhor.","correct":true},{"text":"Den Brand durch Wahl der Notrufnummer 112 melden.","textPt":"Comunicar o incêndio ligando para o número de emergência 112.","correct":false},{"text":"Den nächstgelegenen Feuermelder einschlagen und den Meldeknopf drücken.","textPt":"Acionar o alarme de incêndio mais próximo pressionando o botão.","correct":false},{"text":"Die Mitarbeitenden durch lautes Rufen warnen.","textPt":"Avisar os colegas gritando em voz alta.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ein Schild zeigt einen Gabelstapler in einem gelb-schwarzen Warndreieck. Zu welcher Kategorie von Sicherheits-/Gefahrzeichen gehört dieses Symbol (Farbgebung gelb/schwarz)?","qPt":"Uma placa mostra uma empilhadeira dentro de um triângulo de advertência amarelo e preto. A qual categoria de sinal de segurança/perigo pertence esse símbolo (cores amarelo/preto)?","a":"Es handelt sich um ein Warnzeichen. Warnzeichen sind an der dreieckigen Form und der Farbgebung gelb/schwarz erkennbar und warnen vor einer Gefahr (hier: Gabelstapperverkehr).","aPt":"Trata-se de um sinal de advertência. Sinais de advertência são reconhecíveis pela forma triangular e pelas cores amarelo/preto, e alertam sobre um perigo (aqui: tráfego de empilhadeiras).","options":[{"text":"Warnzeichen","textPt":"Sinal de advertência","correct":true},{"text":"Gebotszeichen","textPt":"Sinal de obrigação","correct":false},{"text":"Verbotszeichen","textPt":"Sinal de proibição","correct":false},{"text":"Rettungszeichen","textPt":"Sinal de salvamento","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ein rundes, blau-weißes Schild zeigt eine Hand mit Schutzhandschuh. Zu welcher Kategorie von Sicherheitszeichen gehört dieses Symbol (Farbgebung blau/weiß)?","qPt":"Uma placa circular azul e branca mostra uma mão com luva de proteção. A qual categoria de sinal de segurança pertence esse símbolo (cores azul/branco)?","a":"Es handelt sich um ein Gebotszeichen. Gebotszeichen sind rund und blau/weiß und schreiben ein bestimmtes Verhalten vor (hier: Schutzhandschuhe tragen).","aPt":"Trata-se de um sinal de obrigação. Sinais de obrigação são circulares, nas cores azul/branco, e determinam um comportamento específico (aqui: usar luvas de proteção).","options":[{"text":"Gebotszeichen","textPt":"Sinal de obrigação","correct":true},{"text":"Warnzeichen","textPt":"Sinal de advertência","correct":false},{"text":"Verbotszeichen","textPt":"Sinal de proibição","correct":false},{"text":"Brandschutzzeichen","textPt":"Sinal de proteção contra incêndio","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ein grün-weißes quadratisches Schild zeigt Personen, die sich an einem Punkt versammeln. Zu welcher Kategorie von Sicherheitszeichen gehört dieses Symbol (Farbgebung grün/weiß)?","qPt":"Uma placa quadrada verde e branca mostra pessoas se reunindo em um ponto. A qual categoria de sinal de segurança pertence esse símbolo (cores verde/branco)?","a":"Es handelt sich um ein Rettungszeichen. Rettungszeichen sind grün/weiß und weisen z. B. auf Sammelpunkte oder Rettungswege hin.","aPt":"Trata-se de um sinal de salvamento. Sinais de salvamento são verdes/brancos e indicam, por exemplo, pontos de encontro ou rotas de fuga.","options":[{"text":"Rettungszeichen","textPt":"Sinal de salvamento","correct":true},{"text":"Gebotszeichen","textPt":"Sinal de obrigação","correct":false},{"text":"Brandschutzzeichen","textPt":"Sinal de proteção contra incêndio","correct":false},{"text":"Gefahrensymbol/Gefahrenpiktogramm","textPt":"Pictograma de perigo","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ein rot-weißes quadratisches Schild zeigt einen Feuerlöscher. Zu welcher Kategorie von Sicherheitszeichen gehört dieses Symbol (Farbgebung rot/weiß)?","qPt":"Uma placa quadrada vermelha e branca mostra um extintor de incêndio. A qual categoria de sinal de segurança pertence esse símbolo (cores vermelho/branco)?","a":"Es handelt sich um ein Brandschutzzeichen. Brandschutzzeichen sind rot/weiß und zeigen den Standort von Brandschutzeinrichtungen wie Feuerlöschern an.","aPt":"Trata-se de um sinal de proteção contra incêndio. Esses sinais são vermelhos/brancos e indicam a localização de equipamentos de combate a incêndio, como extintores.","options":[{"text":"Brandschutzzeichen","textPt":"Sinal de proteção contra incêndio","correct":true},{"text":"Warnzeichen","textPt":"Sinal de advertência","correct":false},{"text":"Verbotszeichen","textPt":"Sinal de proibição","correct":false},{"text":"Gefahrensymbol/Gefahrenpiktogramm","textPt":"Pictograma de perigo","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ein weiß-rot-schwarzes rautenförmiges Schild zeigt ein Umweltgefahr-Symbol (abgestorbener Baum und Fisch). Zu welcher Kategorie gehört dieses Symbol?","qPt":"Uma placa em forma de losango, nas cores branco/vermelho/preto, mostra um símbolo de perigo ambiental (árvore morta e peixe). A qual categoria pertence esse símbolo?","a":"Es handelt sich um ein Gefahrensymbol bzw. Gefahrenpiktogramm (GHS-Symbol), das vor einer Gefahr für die Umwelt warnt.","aPt":"Trata-se de um símbolo/pictograma de perigo (símbolo GHS), que alerta sobre um risco ao meio ambiente.","options":[{"text":"Gefahrensymbol/Gefahrenpiktogramm","textPt":"Pictograma de perigo","correct":true},{"text":"Rettungszeichen","textPt":"Sinal de salvamento","correct":false},{"text":"Gebotszeichen","textPt":"Sinal de obrigação","correct":false},{"text":"Brandschutzzeichen","textPt":"Sinal de proteção contra incêndio","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Ein rundes, weiß-rot-schwarzes Schild zeigt einen durchgestrichenen Gabelstapler. Zu welcher Kategorie von Sicherheitszeichen gehört dieses Symbol?","qPt":"Uma placa circular, nas cores branco/vermelho/preto, mostra uma empilhadeira cortada por uma linha. A qual categoria de sinal de segurança pertence esse símbolo?","a":"Es handelt sich um ein Verbotszeichen. Verbotszeichen sind rund und weiß/rot/schwarz und untersagen ein bestimmtes Verhalten (hier: Befahren mit dem Gabelstapler verboten).","aPt":"Trata-se de um sinal de proibição. Sinais de proibição são circulares, nas cores branco/vermelho/preto, e proíbem um comportamento específico (aqui: proibido trafegar com empilhadeira).","options":[{"text":"Verbotszeichen","textPt":"Sinal de proibição","correct":true},{"text":"Warnzeichen","textPt":"Sinal de advertência","correct":false},{"text":"Gebotszeichen","textPt":"Sinal de obrigação","correct":false},{"text":"Rettungszeichen","textPt":"Sinal de salvamento","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Worauf weist das grün-weiße Zeichen Nr. 3 (Personen, die sich an einem Punkt versammeln) hin?","qPt":"O que indica o sinal verde e branco nº 3 (pessoas se reunindo em um ponto)?","a":"Es weist auf den Sammelpunkt im Gefahrenfall hin – den Ort, an dem sich alle Mitarbeitenden im Notfall versammeln sollen.","aPt":"Indica o ponto de encontro em caso de perigo — o local onde todos os funcionários devem se reunir em uma emergência.","options":[{"text":"Sammelpunkt im Gefahrenfall","textPt":"Ponto de encontro em caso de perigo","correct":true},{"text":"Gemeinschaftsraum","textPt":"Sala de convivência","correct":false},{"text":"Belastung bis maximal vier Personen","textPt":"Carga máxima de quatro pessoas","correct":false},{"text":"Gendertoilette","textPt":"Banheiro unissex","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die MarSi-IT GmbH plant, zwei Anwendungsentwickler (m/w/d) einzustellen. Welche Formulierung in der Stellenanzeige verstößt gegen das Allgemeine Gleichbehandlungsgesetz (AGG)?","qPt":"A MarSi-IT GmbH planeja contratar dois desenvolvedores de aplicações (m/f/d). Qual frase no anúncio de vaga viola a Lei Geral de Igualdade de Tratamento (AGG)?","a":"Die Formulierung 'Sie passen in unser junges dynamisches Team, wenn Sie deutscher Herkunft sind' verstößt gegen das AGG, da sie Bewerber wegen ihrer ethnischen Herkunft diskriminiert.","aPt":"A frase 'Você se encaixa em nossa equipe jovem e dinâmica se for de origem alemã' viola a AGG, pois discrimina candidatos com base em sua origem étnica.","options":[{"text":"„Sie passen in unser junges dynamisches Team, wenn Sie deutscher Herkunft sind.“","textPt":"\"Você se encaixa em nossa equipe jovem e dinâmica se for de origem alemã.\"","correct":true},{"text":"„Sie verfügen über hervorragende Kenntnisse in JAVA.“","textPt":"\"Você tem excelentes conhecimentos em JAVA.\"","correct":false},{"text":"„Sie beherrschen die englische Sprache verhandlungssicher in Wort und Schrift.“","textPt":"\"Você domina o inglês em nível de negociação, falado e escrito.\"","correct":false},{"text":"„Sie sind an flexible Arbeitszeiten gewöhnt und können gelegentlich abends länger arbeiten.“","textPt":"\"Você está acostumado a horários flexíveis e pode ocasionalmente trabalhar até mais tarde.\"","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Daniel Koroki und sein Team sollen im nächsten Projekt 'agil' arbeiten. Welcher Gesichtspunkt gehört NICHT zu einem agilen Prozess?","qPt":"Daniel Koroki e sua equipe devem trabalhar de forma 'ágil' no próximo projeto. Qual aspecto NÃO pertence a um processo ágil?","a":"Dass die Lösung und der Weg dahin vom Vorgesetzten im Rahmen der Hierarchie vorgegeben werden, gehört nicht zu einem agilen Prozess – agile Teams arbeiten eigenverantwortlich und selbstorganisiert.","aPt":"O fato de a solução e o caminho até ela serem determinados pelo superior dentro da hierarquia não pertence a um processo ágil — equipes ágeis trabalham de forma autônoma e autogerida.","options":[{"text":"Die Lösung und der Weg dahin wird vom Vorgesetzten im Rahmen der Hierarchie vorgegeben.","textPt":"A solução e o caminho até ela são determinados pelo superior dentro da hierarquia.","correct":true},{"text":"Hohe Flexibilität/Agilität durch adaptives Planen","textPt":"Alta flexibilidade/agilidade por meio de planejamento adaptativo.","correct":false},{"text":"Eigenverantwortliche Selbstorganisation der agil arbeitenden Teams","textPt":"Autogestão responsável das equipes que trabalham de forma ágil.","correct":false},{"text":"Transparente Darstellung des Fortschritts mithilfe von sogenannten Boards","textPt":"Representação transparente do progresso usando os chamados quadros (boards).","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei welchem der folgenden Punkte handelt es sich um einen Vorteil des agilen Projektmanagements?","qPt":"Qual dos seguintes pontos representa uma vantagem da gestão ágil de projetos?","a":"Ein Vorteil des agilen Projektmanagements ist die zeitnahe Anpassung an neue Kundenwünsche, da auf Änderungen während des laufenden Prozesses flexibel reagiert werden kann.","aPt":"Uma vantagem da gestão ágil de projetos é a adaptação rápida a novos desejos dos clientes, já que é possível reagir com flexibilidade a mudanças durante o processo em andamento.","options":[{"text":"Zeitnahe Anpassung neuer Kundenwünsche","textPt":"Adaptação rápida a novos desejos dos clientes.","correct":true},{"text":"Erschwerte Kommunikation innerhalb des Teams","textPt":"Comunicação dificultada dentro da equipe.","correct":false},{"text":"Langfristige Problemidentifikation und Reaktion","textPt":"Identificação e reação a problemas apenas em longo prazo.","correct":false},{"text":"Hoher Kommunikations- und Abstimmungsaufwand","textPt":"Alto esforço de comunicação e alinhamento.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In den Ausbildungsverträgen der Koch-IT GmbH wird auch eine Probezeit vereinbart. Wie viele Monate muss die Probezeit eines Auszubildenden nach dem Gesetz mindestens dauern?","qPt":"Nos contratos de formação da Koch-IT GmbH também é acordado um período de experiência (Probezeit). Segundo a lei, quantos meses deve durar, no mínimo, o período de experiência de um aprendiz?","a":"Gemäß § 20 Berufsbildungsgesetz (BBiG) muss die Probezeit in der Ausbildung mindestens 1 Monat betragen.","aPt":"De acordo com o § 20 da Lei de Formação Profissional (BBiG), o período de experiência na formação deve durar no mínimo 1 mês.","options":[{"text":"Mindestens 1 Monat","textPt":"No mínimo 1 mês","correct":true},{"text":"Mindestens 2 Monate","textPt":"No mínimo 2 meses","correct":false},{"text":"Mindestens 3 Monate","textPt":"No mínimo 3 meses","correct":false},{"text":"Mindestens 4 Monate","textPt":"No mínimo 4 meses","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Und wie viele Monate darf die Probezeit eines Auszubildenden der Koch-IT GmbH nach dem Gesetz höchstens betragen?","qPt":"E quantos meses pode durar, no máximo, segundo a lei, o período de experiência de um aprendiz da Koch-IT GmbH?","a":"Gemäß § 20 BBiG darf die Probezeit in der Ausbildung maximal 4 Monate dauern.","aPt":"De acordo com o § 20 da BBiG, o período de experiência na formação pode durar no máximo 4 meses.","options":[{"text":"Höchstens 4 Monate","textPt":"No máximo 4 meses","correct":true},{"text":"Höchstens 1 Monat","textPt":"No máximo 1 mês","correct":false},{"text":"Höchstens 3 Monate","textPt":"No máximo 3 meses","correct":false},{"text":"Höchstens 6 Monate","textPt":"No máximo 6 meses","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Auszubildenden bei der Koch-IT GmbH sind verpflichtet, ein Ausbildungsnachweis (Berichtsheft) zu führen. Ein neuer Auszubildender fragt nach dem Sinn und Zweck eines solchen Ausbildungsnachweises. Welchem Zweck dient das Berichtsheft?","qPt":"Os aprendizes da Koch-IT GmbH são obrigados a manter um comprovante de formação (caderno de relatórios, Berichtsheft). Um novo aprendiz pergunta qual é o sentido e a finalidade desse comprovante. A qual finalidade o caderno de relatórios serve?","a":"Das Berichtsheft dient der Dokumentation der vermittelten Ausbildungsinhalte. Auszubildende können es hierdurch u. a. zur Prüfungsvorbereitung nutzen; es dient auch zu Beweiszwecken, falls das Ausbildungsziel nicht erreicht wird.","aPt":"O caderno de relatórios serve para documentar os conteúdos de formação transmitidos. Os aprendizes podem usá-lo, entre outras coisas, para se preparar para a prova; também serve como prova caso o objetivo da formação não seja alcançado.","options":[{"text":"Der Dokumentation der vermittelten Ausbildungsinhalte","textPt":"Documentar os conteúdos de formação transmitidos","correct":true},{"text":"Der Prüfung der Einhaltung der tariflich vereinbarten Ausbildungszeiten durch die Gewerkschaft","textPt":"Verificar, pelo sindicato, o cumprimento dos horários de formação acordados na convenção coletiva","correct":false},{"text":"Als Grundlage für die Benotung der Abschlussprüfung","textPt":"Servir de base para a nota da prova final","correct":false},{"text":"Der Information des Ausbilders über den regelmäßigen Berufsschulbesuch des Auszubildenden","textPt":"Informar o formador sobre a frequência regular à escola profissional","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Einem Arbeitnehmer der Koch-IT GmbH soll wegen wiederholter Nichtbeachtung des Alkoholverbotes während der Arbeitszeit gekündigt werden. Um welche Art der Kündigung handelt es sich?","qPt":"Um funcionário da Koch-IT GmbH deve ser demitido por descumprir repetidamente a proibição de álcool durante o horário de trabalho. Que tipo de demissão é essa?","a":"Es handelt sich um eine verhaltensbedingte Kündigung: Der Arbeitnehmer könnte das Alkoholverbot einhalten, will aber nicht.","aPt":"Trata-se de uma demissão motivada por comportamento: o trabalhador poderia respeitar a proibição de álcool, mas não quer.","options":[{"text":"Verhaltensbedingte Kündigung","textPt":"Demissão motivada por comportamento","correct":true},{"text":"Personenbedingte Kündigung","textPt":"Demissão motivada pela pessoa (sem culpa)","correct":false},{"text":"Betriebsbedingte Kündigung","textPt":"Demissão motivada por razões operacionais","correct":false},{"text":"Außerordentliche fristlose Kündigung ohne Grund","textPt":"Demissão extraordinária sem aviso prévio e sem motivo","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Einem Arbeitnehmer der Koch-IT GmbH soll wegen negativer Auswirkungen einer Krankheit über einen langen Zeitraum gekündigt werden. Um welche Art der Kündigung handelt es sich?","qPt":"Um funcionário da Koch-IT GmbH deve ser demitido devido aos efeitos negativos de uma doença de longa duração. Que tipo de demissão é essa?","a":"Es handelt sich um eine personenbedingte Kündigung: Der Arbeitnehmer will zwar arbeiten, schafft es aber krankheitsbedingt nicht.","aPt":"Trata-se de uma demissão motivada pela pessoa: o trabalhador quer trabalhar, mas não consegue por causa da doença.","options":[{"text":"Personenbedingte Kündigung","textPt":"Demissão motivada pela pessoa (sem culpa)","correct":true},{"text":"Verhaltensbedingte Kündigung","textPt":"Demissão motivada por comportamento","correct":false},{"text":"Betriebsbedingte Kündigung","textPt":"Demissão motivada por razões operacionais","correct":false},{"text":"Fristlose außerordentliche Kündigung","textPt":"Demissão extraordinária sem aviso prévio","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Einem Arbeitnehmer der Koch-IT GmbH soll wegen längerfristiger kritischer wirtschaftlicher Lage des Unternehmens gekündigt werden. Um welche Art der Kündigung handelt es sich?","qPt":"Um funcionário da Koch-IT GmbH deve ser demitido devido a uma situação econômica crítica e duradoura da empresa. Que tipo de demissão é essa?","a":"Es handelt sich um eine betriebsbedingte Kündigung: Der Arbeitnehmer kann die Ursache (die wirtschaftliche Lage des Unternehmens) nicht direkt beeinflussen.","aPt":"Trata-se de uma demissão motivada por razões operacionais: o trabalhador não pode influenciar diretamente a causa (a situação econômica da empresa).","options":[{"text":"Betriebsbedingte Kündigung","textPt":"Demissão motivada por razões operacionais","correct":true},{"text":"Personenbedingte Kündigung","textPt":"Demissão motivada pela pessoa","correct":false},{"text":"Verhaltensbedingte Kündigung","textPt":"Demissão motivada por comportamento","correct":false},{"text":"Änderungskündigung ohne betrieblichen Grund","textPt":"Demissão com proposta de alteração contratual sem motivo operacional","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Einem Arbeitnehmer der Koch-IT GmbH soll wegen mehrfachen Verstoßes gegen das absolute Rauchverbot auf dem Betriebsgelände trotz entsprechender Abmahnung gekündigt werden. Um welche Art der Kündigung handelt es sich?","qPt":"Um funcionário da Koch-IT GmbH deve ser demitido por violar repetidamente a proibição absoluta de fumar nas instalações da empresa, apesar da advertência correspondente. Que tipo de demissão é essa?","a":"Es handelt sich um eine verhaltensbedingte Kündigung: Der Arbeitnehmer könnte das Rauchverbot einhalten, will aber nicht.","aPt":"Trata-se de uma demissão motivada por comportamento: o trabalhador poderia respeitar a proibição de fumar, mas não quer.","options":[{"text":"Verhaltensbedingte Kündigung","textPt":"Demissão motivada por comportamento","correct":true},{"text":"Personenbedingte Kündigung","textPt":"Demissão motivada pela pessoa","correct":false},{"text":"Betriebsbedingte Kündigung","textPt":"Demissão motivada por razões operacionais","correct":false},{"text":"Außerordentliche fristlose Kündigung ohne Grund","textPt":"Demissão extraordinária sem aviso prévio e sem motivo","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Einem Arbeitnehmer der Koch-IT GmbH soll gekündigt werden, weil er auch nach wiederholter Abmahnung ständig zu spät zur Arbeit kommt. Um welche Art der Kündigung handelt es sich?","qPt":"Um funcionário da Koch-IT GmbH deve ser demitido porque, mesmo após advertências repetidas, chega constantemente atrasado ao trabalho. Que tipo de demissão é essa?","a":"Es handelt sich um eine verhaltensbedingte Kündigung: Der Arbeitnehmer könnte pünktlich erscheinen, will aber nicht.","aPt":"Trata-se de uma demissão motivada por comportamento: o trabalhador poderia chegar pontualmente, mas não quer.","options":[{"text":"Verhaltensbedingte Kündigung","textPt":"Demissão motivada por comportamento","correct":true},{"text":"Personenbedingte Kündigung","textPt":"Demissão motivada pela pessoa","correct":false},{"text":"Betriebsbedingte Kündigung","textPt":"Demissão motivada por razões operacionais","correct":false},{"text":"Fristlose außerordentliche Kündigung ohne Abmahnung","textPt":"Demissão extraordinária sem aviso prévio e sem advertência","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Zwischen der Koch-IT GmbH und deren Betriebsrat wurde bezüglich der betrieblichen Arbeitszeit und Gleitzeit eine Betriebsvereinbarung getroffen. Welche der folgenden Aussagen zu dieser Betriebsvereinbarung ist zutreffend?","qPt":"Entre a Koch-IT GmbH e seu conselho de empresa (Betriebsrat) foi firmado um acordo de empresa (Betriebsvereinbarung) sobre horário de trabalho e horário flexível. Qual das seguintes afirmações sobre esse acordo de empresa é correta?","a":"Die getroffene Betriebsvereinbarung schafft verbindliche Normen für alle in der Vereinbarung genannten Mitarbeitergruppen der Koch-IT GmbH. Durch die Übereinkunft zwischen Betriebsrat und Arbeitgeber wurde eine verbindliche Gestaltung des Arbeitsverhältnisses vorgenommen; sie ist betriebsintern genauso wie Gesetze oder Tarifverträge zu behandeln.","aPt":"O acordo de empresa firmado cria normas vinculantes para todos os grupos de funcionários da Koch-IT GmbH nele mencionados. O acordo entre o conselho de empresa e o empregador estabeleceu uma regulação vinculante da relação de trabalho; internamente, ele deve ser tratado como leis ou convenções coletivas.","options":[{"text":"Die getroffene Betriebsvereinbarung schafft verbindliche Normen für alle in der Vereinbarung genannten Mitarbeitergruppen der Koch-IT GmbH.","textPt":"O acordo de empresa firmado cria normas vinculantes para todos os grupos de funcionários nele mencionados.","correct":true},{"text":"Die getroffene Betriebsvereinbarung ist ein Vertrag zwischen der Koch-IT GmbH und der zuständigen Gewerkschaft.","textPt":"O acordo de empresa firmado é um contrato entre a Koch-IT GmbH e o sindicato responsável.","correct":false},{"text":"Diese Betriebsvereinbarung gilt für die ganze Branche.","textPt":"Esse acordo de empresa vale para todo o setor econômico.","correct":false},{"text":"Diese Betriebsvereinbarung ist ein Vertrag zwischen der Koch-IT GmbH und jedem einzelnen ihrer Mitarbeiter, um den jeweils individuellen Arbeitsvertrag zu ergänzen.","textPt":"Esse acordo de empresa é um contrato entre a Koch-IT GmbH e cada funcionário individualmente, para complementar o respectivo contrato de trabalho individual.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Eine Mitarbeiterin der Koch-IT GmbH ist schwanger – für sie gelten die Regelungen des Mutterschutzgesetzes. Welche der folgenden Aussagen zum Mutterschutzgesetz ist zutreffend?","qPt":"Uma funcionária da Koch-IT GmbH está grávida — para ela valem as regras da Lei de Proteção à Maternidade (Mutterschutzgesetz). Qual das seguintes afirmações sobre essa lei é correta?","a":"Die Arbeitnehmerin besitzt während ihrer Schwangerschaft und nach der Entbindung einen besonderen Kündigungsschutz (siehe § 17 MuSchG).","aPt":"A trabalhadora tem uma proteção especial contra demissão durante a gravidez e após o parto (ver § 17 da MuSchG).","options":[{"text":"Die Arbeitnehmerin besitzt während ihrer Schwangerschaft und nach der Entbindung einen besonderen Kündigungsschutz.","textPt":"A trabalhadora tem uma proteção especial contra demissão durante a gravidez e após o parto.","correct":true},{"text":"Die Arbeitnehmerin darf dem Arbeitgeber ihre Schwangerschaft nicht mitteilen.","textPt":"A trabalhadora não pode informar o empregador sobre sua gravidez.","correct":false},{"text":"Die Arbeitnehmerin kann in der Schwangerschaft ihre Arbeitszeiten (Kommen- und Gehen-Zeiten sowie Dauer) frei wählen.","textPt":"Durante a gravidez, a trabalhadora pode escolher livremente seus horários de entrada e saída e a duração do trabalho.","correct":false},{"text":"Die Arbeitnehmerin kann vom Arbeitgeber in der Schutzfrist nach der Entbindung beschäftigt werden.","textPt":"A trabalhadora pode ser empregada pelo empregador durante o prazo de proteção após o parto.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Im betrieblichen Unterricht der Koch-IT GmbH werden aufgrund anstehender Tarifverhandlungen die Themenbereiche 'Tarifvertrag und Gewerkschaften' besprochen. Welche der folgenden Wirkungen entfalten Tarifverträge?","qPt":"Nas aulas internas da Koch-IT GmbH, devido às negociações coletivas que se aproximam, são discutidos os temas 'convenção coletiva e sindicatos'. Qual dos seguintes efeitos as convenções coletivas produzem?","a":"Allgemeinverbindlich erklärte Tarifverträge gelten für alle Arbeitnehmer dieser Branche, unabhängig von deren Gewerkschaftszugehörigkeit (siehe § 5 Allgemeinverbindlichkeit TVG).","aPt":"Convenções coletivas declaradas de aplicação geral valem para todos os trabalhadores do setor, independentemente de serem filiados ao sindicato (ver § 5 do TVG — aplicação geral).","options":[{"text":"Allgemeinverbindlich erklärte Tarifverträge gelten für alle Arbeitnehmer dieser Branche, unabhängig von deren Gewerkschaftszugehörigkeit.","textPt":"Convenções coletivas declaradas de aplicação geral valem para todos os trabalhadores do setor, independentemente da filiação sindical.","correct":true},{"text":"Die Bestimmungen eines deutschen Tarifvertrages gelten in allen Ländern der Europäischen Union.","textPt":"As disposições de uma convenção coletiva alemã valem em todos os países da União Europeia.","correct":false},{"text":"Die Tarifverträge sind rechtlich nicht bindend, sondern stellen lediglich Empfehlungen für die Mitglieder der Tarifparteien dar.","textPt":"As convenções coletivas não são juridicamente vinculantes, sendo apenas recomendações para os membros das partes acordantes.","correct":false},{"text":"Haustarifverträge gelten jeweils für die gesamte Branche.","textPt":"Convenções coletivas de empresa (Haustarifverträge) valem para todo o setor.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bringen Sie die folgenden Schritte bis zum schlussendlichen Zustandekommen eines neuen Tarifvertrages der Koch-IT GmbH in die richtige Reihenfolge.","qPt":"Coloque na ordem correta os seguintes passos até a conclusão final de uma nova convenção coletiva da Koch-IT GmbH.","a":"Die richtige Reihenfolge ist: 1. Tarifverhandlungen, 2. Erklärung des Scheiterns der Tarifverhandlung, 3. Einleitung einer Schlichtung, 4. Spruch eines neutralen Schlichters, 5. Annahme der Schlichtung, 6. Abschluss des neuen Tarifvertrags.","aPt":"A ordem correta é: 1. Negociações coletivas, 2. Declaração do fracasso da negociação coletiva, 3. Início de uma conciliação (Schlichtung), 4. Decisão de um conciliador neutro, 5. Aceitação da conciliação, 6. Celebração da nova convenção coletiva.","options":[{"text":"Tarifverhandlungen → Erklärung des Scheiterns der Tarifverhandlung → Einleitung einer Schlichtung → Spruch eines neutralen Schlichters → Annahme der Schlichtung → Abschluss des neuen Tarifvertrags.","textPt":"Negociações coletivas → declaração do fracasso da negociação → início de uma conciliação → decisão de um conciliador neutro → aceitação da conciliação → celebração da nova convenção coletiva.","correct":true},{"text":"Einleitung einer Schlichtung → Tarifverhandlungen → Annahme der Schlichtung → Spruch eines neutralen Schlichters → Erklärung des Scheiterns der Tarifverhandlung → Abschluss des neuen Tarifvertrags.","textPt":"Início de uma conciliação → negociações coletivas → aceitação da conciliação → decisão de um conciliador neutro → declaração do fracasso da negociação → celebração da nova convenção coletiva.","correct":false},{"text":"Spruch eines neutralen Schlichters → Erklärung des Scheiterns der Tarifverhandlung → Abschluss des neuen Tarifvertrags → Tarifverhandlungen → Einleitung einer Schlichtung → Annahme der Schlichtung.","textPt":"Decisão de um conciliador neutro → declaração do fracasso da negociação → celebração da nova convenção coletiva → negociações coletivas → início de uma conciliação → aceitação da conciliação.","correct":false},{"text":"Abschluss des neuen Tarifvertrags → Annahme der Schlichtung → Spruch eines neutralen Schlichters → Einleitung einer Schlichtung → Erklärung des Scheiterns der Tarifverhandlung → Tarifverhandlungen.","textPt":"Celebração da nova convenção coletiva → aceitação da conciliação → decisão de um conciliador neutro → início de uma conciliação → declaração do fracasso da negociação → negociações coletivas.","correct":false}]},
