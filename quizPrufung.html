{"cat":"wiso","sub":"pruefung","q":"Der Auszubildende David Schmitz befindet sich bei der Ecotec GmbH im letzten Ausbildungsjahr und bereitet sich auf die Abschlussprüfung vor. Er möchte wissen, wann das Ausbildungsverhältnis konkret endet. Welche der folgenden Aussagen über die Beendigung des Ausbildungsverhältnisses trifft zu?","qPt":"O aprendiz David Schmitz está no último ano de formação na Ecotec GmbH e se prepara para o exame final. Ele quer saber exatamente quando termina seu vínculo de formação. Qual das seguintes afirmações sobre o fim do vínculo de formação está correta?","a":"Besteht der Auszubildende die Abschlussprüfung, endet das Ausbildungsverhältnis bereits mit Bekanntgabe des Prüfungsergebnisses, also vor Ablauf der im Vertrag vereinbarten Ausbildungszeit (§ 21 Abs. 2 BBiG) – eine gesonderte Kündigung ist dafür nicht nötig.","aPt":"Se o aprendiz é aprovado no exame final, o vínculo de formação termina já com a divulgação do resultado do exame, ou seja, antes do fim do período de formação previsto no contrato (§ 21, parágrafo 2 da Lei de Formação Profissional) — não é necessária uma rescisão separada para isso.","options":[{"text":"Der Auszubildende muss den Ausbildungsvertrag nach bestandener Abschlussprüfung kündigen.","textPt":"O aprendiz deve rescindir o contrato de formação após ser aprovado no exame final.","correct":false},{"text":"Der Ausbildungsbetrieb muss das Ausbildungsverhältnis nach bestandener Abschlussprüfung kündigen.","textPt":"A empresa deve rescindir o vínculo de formação após o aprendiz ser aprovado no exame final.","correct":false},{"text":"Das Ausbildungsverhältnis endet vor Ablauf der Ausbildungszeit bei bestandener Abschlussprüfung.","textPt":"O vínculo de formação termina antes do fim do período de formação quando o aprendiz é aprovado no exame final.","correct":true},{"text":"Das Ausbildungsverhältnis kann nur von der zuständigen Stelle (z. B. IHK) beendet werden.","textPt":"O vínculo de formação só pode ser encerrado pelo órgão competente (por exemplo, a câmara de comércio).","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Schmitz hat seine Ausbildung erfolgreich beendet und soll bei der Ecotec GmbH in ein befristetes Arbeitsverhältnis für zunächst ein Jahr übernommen werden. Welche der folgenden Aussagen über eine Befristung des Arbeitsverhältnisses trifft zu?","qPt":"O Sr. Schmitz concluiu com sucesso sua formação e será contratado pela Ecotec GmbH por um contrato por prazo determinado, inicialmente de um ano. Qual das seguintes afirmações sobre um contrato por prazo determinado está correta?","a":"Ein wirksam befristetes Arbeitsverhältnis endet automatisch mit Ablauf der vereinbarten Zeit, ohne dass es dafür einer gesonderten Kündigung durch eine der beiden Parteien bedarf.","aPt":"Um contrato de trabalho por prazo determinado válido termina automaticamente com o fim do prazo acordado, sem que seja necessária uma rescisão separada por qualquer uma das partes.","options":[{"text":"Auszubildende des eigenen Betriebs können nur in ein befristetes Arbeitsverhältnis übernommen werden.","textPt":"Aprendizes da própria empresa só podem ser contratados por prazo determinado.","correct":false},{"text":"Das Arbeitsverhältnis endet nach einem Jahr, ohne dass es einer Kündigung bedarf.","textPt":"O contrato termina depois de um ano, sem necessidade de rescisão.","correct":true},{"text":"Eine Befristung ist nur mit Zustimmung der Agentur für Arbeit möglich.","textPt":"Um contrato por prazo determinado só é possível com o consentimento da agência do trabalho.","correct":false},{"text":"Ein befristeter Arbeitsvertrag muss auf mindestens zwei Jahre abgeschlossen werden.","textPt":"Um contrato por prazo determinado deve ter duração mínima de dois anos.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In der Ecotec GmbH wurden verschiedene Sachverhalte durch betriebliche und tarifliche Vereinbarungen geregelt. Welcher der folgenden Sachverhalte kann durch eine Betriebsvereinbarung geregelt werden?","qPt":"Na Ecotec GmbH, várias questões foram regulamentadas por acordos de empresa e convenções coletivas. Qual das seguintes questões pode ser regulada por um acordo de empresa (Betriebsvereinbarung)?","a":"Der Betriebsrat hat bei der zeitlichen Lage und Verteilung des Urlaubs (z. B. der Aufstellung eines Urlaubsplans) nach § 87 Abs. 1 Nr. 5 BetrVG ein Mitbestimmungsrecht. Urlaubsdauer, Entgelthöhe und Entgeltfortzahlung im Krankheitsfall sind dagegen gesetzlich bzw. tariflich geregelt und stehen nicht zur Disposition einer Betriebsvereinbarung.","aPt":"O conselho de trabalhadores tem direito de cogestão sobre a época e a distribuição das férias (por exemplo, a elaboração de um plano de férias), conforme o § 87, parágrafo 1, nº 5 da Lei de Organização das Empresas. Já a duração das férias, o valor da remuneração e a continuidade do pagamento em caso de doença são regulados por lei ou convenção coletiva, e não por um acordo de empresa.","options":[{"text":"Die Reduzierung der Urlaubstage gemäß Tarifvertrag","textPt":"A redução dos dias de férias conforme a convenção coletiva","correct":false},{"text":"Die Aufstellung des Urlaubsplans","textPt":"A elaboração do plano de férias","correct":true},{"text":"Die Höhe der Arbeitsentgelte nach Gehaltsgruppen","textPt":"O valor da remuneração conforme as faixas salariais","correct":false},{"text":"Die Dauer der Entgeltfortzahlung im Krankheitsfall","textPt":"A duração da continuidade do pagamento do salário em caso de doença","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Wessen Interessen vertritt der Betriebsrat gemäß Betriebsverfassungsgesetz?","qPt":"Segundo a Lei de Organização das Empresas, os interesses de quem o conselho de trabalhadores representa?","a":"Der Betriebsrat ist die gewählte Interessenvertretung der Arbeitnehmer eines Betriebs gegenüber dem Arbeitgeber.","aPt":"O conselho de trabalhadores é a representação eleita dos interesses dos empregados de uma empresa perante o empregador.","options":[{"text":"Arbeitgeber","textPt":"O empregador","correct":false},{"text":"Arbeitnehmer","textPt":"Os empregados","correct":true},{"text":"Leitende Angestellte","textPt":"Os cargos de direção","correct":false},{"text":"Industrie- und Handelskammern","textPt":"As câmaras de indústria e comércio","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Vengeta ist gesetzlich krankenversichert. Die gesetzliche Krankenkasse bewilligt für einen Zahnersatz eine Zuzahlung von 50,00 EUR. Frau Vengeta ist mit der Höhe der Zuzahlung nicht einverstanden und will den Fall gerichtlich klären lassen. Bei welchem der folgenden Gerichte muss sie die Klage einreichen?","qPt":"A Sra. Vengeta tem seguro-saúde legal. A caixa de saúde legal aprova um subsídio de 50,00 EUR para uma prótese dentária. A Sra. Vengeta não concorda com o valor e quer resolver o caso judicialmente. Em qual dos seguintes tribunais ela deve apresentar a ação?","a":"Streitigkeiten mit der gesetzlichen Krankenkasse über Leistungen der Sozialversicherung (z. B. Höhe von Zuzahlungen) gehören vor das Sozialgericht.","aPt":"Litígios com a caixa de saúde legal sobre benefícios da previdência social (por exemplo, o valor de coparticipações) são de competência do tribunal de assuntos sociais (Sozialgericht).","options":[{"text":"Amtsgericht","textPt":"Tribunal de primeira instância (Amtsgericht)","correct":false},{"text":"Arbeitsgericht","textPt":"Tribunal do trabalho","correct":false},{"text":"Sozialgericht","textPt":"Tribunal de assuntos sociais","correct":true},{"text":"Finanzgericht","textPt":"Tribunal fiscal","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In der Tageszeitung liest Frau Vengeta, dass die Beitragsbemessungsgrenze in der gesetzlichen Rentenversicherung auf 87.600 EUR jährlich festgelegt wurde. Welche der folgenden Aussagen zur Beitragsbemessungsgrenze trifft zu?","qPt":"No jornal, a Sra. Vengeta lê que o teto de contribuição (Beitragsbemessungsgrenze) do seguro de aposentadoria legal foi fixado em 87.600 EUR anuais. Qual das seguintes afirmações sobre o teto de contribuição está correta?","a":"Auf den Teil des Bruttolohns, der über der Beitragsbemessungsgrenze liegt, werden keine Rentenversicherungsbeiträge erhoben – weder vom Arbeitnehmer noch vom Arbeitgeber.","aPt":"Sobre a parte do salário bruto que ultrapassa o teto de contribuição não incidem contribuições ao seguro de aposentadoria — nem do empregado, nem do empregador.","options":[{"text":"Die Beitragsbemessungsgrenze gibt an, wie hoch mindestens die Rente aus der gesetzlichen Rentenversicherung ist.","textPt":"O teto de contribuição indica o valor mínimo da pensão do seguro de aposentadoria legal.","correct":false},{"text":"Auf den Teil des Bruttolohns, der über der Beitragsbemessungsgrenze liegt, wird kein Rentenversicherungsbeitrag erhoben.","textPt":"Sobre a parte do salário bruto que ultrapassa o teto de contribuição não é cobrada nenhuma contribuição ao seguro de aposentadoria.","correct":true},{"text":"Bei einem Verdienst über der Beitragsbemessungsgrenze besteht keine Versicherungspflicht mehr in der gesetzlichen Rentenversicherung.","textPt":"Quem ganha acima do teto de contribuição deixa de ser obrigatoriamente segurado no seguro de aposentadoria legal.","correct":false},{"text":"Wer über der Beitragsbemessungsgrenze verdient, hat keinen Anspruch auf Erwerbsminderungsrente.","textPt":"Quem ganha acima do teto de contribuição não tem direito à pensão por incapacidade.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Ecotec GmbH ist ein IT-Dienstleistungsunternehmen. Welchem Wirtschaftssektor gehört sie damit an?","qPt":"A Ecotec GmbH é uma empresa de serviços de TI. A qual setor econômico ela pertence, portanto?","a":"Da die Ecotec GmbH Dienstleistungen anbietet, gehört sie zum tertiären Sektor (Dienstleistungssektor), nicht zum primären (Urproduktion) oder sekundären Sektor (verarbeitendes Gewerbe).","aPt":"Como a Ecotec GmbH presta serviços, ela pertence ao setor terciário (setor de serviços), não ao setor primário (produção primária) nem ao secundário (indústria de transformação).","options":[{"text":"Primärer Sektor","textPt":"Setor primário","correct":false},{"text":"Sekundärer Sektor","textPt":"Setor secundário","correct":false},{"text":"Tertiärer Sektor","textPt":"Setor terciário","correct":true},{"text":"Keiner der drei Sektoren","textPt":"Nenhum dos três setores","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Ecotec GmbH ist verpflichtet, die Arbeitssicherheit im Unternehmen zu gewährleisten. Welche der folgenden Aussagen trifft auf die Arbeitssicherheit in der Ecotec GmbH zu?","qPt":"A Ecotec GmbH é obrigada a garantir a segurança do trabalho na empresa. Qual das seguintes afirmações sobre a segurança do trabalho na Ecotec GmbH está correta?","a":"Unternehmen mit mehr als 20 Beschäftigten müssen nach dem Arbeitssicherheitsgesetz einen Arbeitsschutzausschuss einrichten, in dem Arbeitgeber, Betriebsrat, Betriebsarzt und Fachkraft für Arbeitssicherheit die Themen des Arbeitsschutzes erörtern.","aPt":"Empresas com mais de 20 funcionários devem, segundo a Lei de Segurança do Trabalho, criar uma comissão de segurança do trabalho, na qual empregador, conselho de trabalhadores, médico do trabalho e técnico de segurança discutem temas de proteção ao trabalho.","options":[{"text":"Eine Mitbestimmung von Arbeitnehmern bei der Arbeitssicherheit ist ausgeschlossen, da das Arbeitsschutzgesetz die Pflichten der Arbeitgeber im Einzelnen regelt.","textPt":"A cogestão dos trabalhadores em segurança do trabalho é excluída, pois a lei de proteção ao trabalho regula detalhadamente os deveres do empregador.","correct":false},{"text":"Betriebliche Arbeitsschutzbestimmungen sind kein zwingendes Recht des Arbeitsverhältnisses.","textPt":"As normas internas de proteção ao trabalho não são de direito cogente na relação de trabalho.","correct":false},{"text":"Ein Unternehmen mit mehr als 20 Beschäftigten muss einen Arbeitsschutzausschuss einrichten, in dem die Themen des Arbeitsschutzes erörtert werden.","textPt":"Uma empresa com mais de 20 funcionários deve criar uma comissão de segurança do trabalho para discutir os temas da proteção ao trabalho.","correct":true},{"text":"Die Ergonomie von Arbeitsplätzen ist keine Anforderung der Arbeitssicherheit, sondern eine freiwillige Leistung des Arbeitgebers.","textPt":"A ergonomia dos postos de trabalho não é uma exigência de segurança do trabalho, mas um benefício voluntário do empregador.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Mitarbeitenden der Ecotec GmbH sind gesetzlich unfallversichert. Welcher der folgenden Fälle wird von der gesetzlichen Unfallversicherung abgedeckt?","qPt":"Os funcionários da Ecotec GmbH têm seguro legal contra acidentes. Qual dos seguintes casos é coberto pelo seguro legal contra acidentes?","a":"Die gesetzliche Unfallversicherung deckt neben Arbeitsunfällen auch Wegeunfälle ab, also Unfälle auf dem direkten Weg zwischen Wohnung und Arbeitsstätte. Freizeitunfälle, allgemeine Erkrankungen oder die Betreuung eines kranken Kindes zu Hause fallen dagegen unter andere Versicherungszweige.","aPt":"O seguro legal contra acidentes cobre, além dos acidentes de trabalho, também os acidentes de trajeto, ou seja, acidentes no caminho direto entre a casa e o local de trabalho. Já acidentes no tempo livre, doenças comuns ou cuidar de um filho doente em casa são cobertos por outros ramos do seguro.","options":[{"text":"Ein Mitarbeiter stürzt in der Freizeit und zieht sich eine Schulterprellung zu.","textPt":"Um funcionário cai durante o tempo livre e sofre uma contusão no ombro.","correct":false},{"text":"Eine Auszubildende rutscht auf dem direkten Weg zur Arbeit aus und zieht sich eine Bänderdehnung zu.","textPt":"Uma aprendiz escorrega no trajeto direto para o trabalho e sofre um estiramento de ligamento.","correct":true},{"text":"Ein Mitarbeiter ist wegen einer Magenerkrankung arbeitsunfähig.","textPt":"Um funcionário fica incapacitado para o trabalho devido a uma doença de estômago.","correct":false},{"text":"Die kleine Tochter eines Mitarbeiters ist erkrankt und muss von ihm zu Hause betreut werden.","textPt":"A filha pequena de um funcionário adoece e precisa ser cuidada por ele em casa.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche der folgenden Organisationen ist Träger der gesetzlichen Unfallversicherung?","qPt":"Qual das seguintes organizações é a entidade responsável pelo seguro legal contra acidentes?","a":"Träger der gesetzlichen Unfallversicherung sind die Berufsgenossenschaften (für die gewerbliche Wirtschaft) bzw. die Unfallkassen (für den öffentlichen Dienst).","aPt":"As entidades responsáveis pelo seguro legal contra acidentes são as Berufsgenossenschaften (para o setor privado) e as Unfallkassen (para o serviço público).","options":[{"text":"Deutsche Rentenversicherung Bund","textPt":"Seguro Federal Alemão de Aposentadoria","correct":false},{"text":"Gewerbeaufsichtsamt","textPt":"Órgão de fiscalização do trabalho","correct":false},{"text":"Berufsgenossenschaft","textPt":"Associação profissional (Berufsgenossenschaft)","correct":true},{"text":"Gesetzliche Krankenversicherung","textPt":"Seguro-saúde legal","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei einer Führung durch die Betriebsräume der Ecotec GmbH soll neuen Auszubildenden die Bedeutung der Sicherheitsschilder erklärt werden. Ein Schild zeigt eine laufende Figur neben einem Pfeil. Welche Bedeutung hat dieses Schild?","qPt":"Numa visita guiada pelas instalações da Ecotec GmbH, deve-se explicar aos novos aprendizes o significado das placas de segurança. Uma placa mostra uma figura correndo ao lado de uma seta. Qual é o significado dessa placa?","a":"Das Rettungszeichen mit laufender Figur und Pfeil zeigt die Richtung des Fluchtweges an, dem im Notfall (z. B. Brand) zu folgen ist.","aPt":"O símbolo de salvamento com uma figura correndo e uma seta indica a direção da rota de fuga a ser seguida em caso de emergência (por exemplo, incêndio).","options":[{"text":"Vor Öffnen Netzstecker ziehen","textPt":"Desligar o plugue antes de abrir","correct":false},{"text":"Gefahr durch Laserstrahl","textPt":"Perigo de radiação laser","correct":false},{"text":"Richtung des Fluchtweges","textPt":"Direção da rota de fuga","correct":true},{"text":"Erste Hilfe","textPt":"Primeiros socorros","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei einer Führung durch die Betriebsräume der Ecotec GmbH soll neuen Auszubildenden die Bedeutung der Sicherheitsschilder erklärt werden. Ein Schild zeigt ein weißes Kreuz. Welche Bedeutung hat dieses Schild?","qPt":"Numa visita guiada pelas instalações da Ecotec GmbH, deve-se explicar aos novos aprendizes o significado das placas de segurança. Uma placa mostra uma cruz branca. Qual é o significado dessa placa?","a":"Ein weißes Kreuz auf grünem Grund ist das international genormte Rettungszeichen für Erste Hilfe und weist auf einen Erste-Hilfe-Kasten oder -Raum hin.","aPt":"Uma cruz branca sobre fundo verde é o símbolo internacional padronizado de salvamento para primeiros socorros e indica um kit ou sala de primeiros socorros.","options":[{"text":"Richtung des Fluchtweges","textPt":"Direção da rota de fuga","correct":false},{"text":"Erste Hilfe","textPt":"Primeiros socorros","correct":true},{"text":"Feuerlöscher","textPt":"Extintor de incêndio","correct":false},{"text":"Gefahr durch Laserstrahl","textPt":"Perigo de radiação laser","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei einer Führung durch die Betriebsräume der Ecotec GmbH soll neuen Auszubildenden die Bedeutung der Sicherheitsschilder erklärt werden. Ein Schild zeigt das Symbol eines Feuerlöschers vor Flammen. Welche Bedeutung hat dieses Schild?","qPt":"Numa visita guiada pelas instalações da Ecotec GmbH, deve-se explicar aos novos aprendizes o significado das placas de segurança. Uma placa mostra o símbolo de um extintor diante de chamas. Qual é o significado dessa placa?","a":"Dieses Brandschutzzeichen weist auf den Standort eines Feuerlöschers hin, der im Brandfall zur ersten Brandbekämpfung genutzt werden kann.","aPt":"Esse símbolo de proteção contra incêndio indica a localização de um extintor, que pode ser usado para o combate inicial a incêndios.","options":[{"text":"Feuerlöscher","textPt":"Extintor de incêndio","correct":true},{"text":"Erste Hilfe","textPt":"Primeiros socorros","correct":false},{"text":"Vor Öffnen Netzstecker ziehen","textPt":"Desligar o plugue antes de abrir","correct":false},{"text":"Richtung des Fluchtweges","textPt":"Direção da rota de fuga","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei einer Führung durch die Betriebsräume der Ecotec GmbH soll neuen Auszubildenden die Bedeutung der Sicherheitsschilder erklärt werden. Ein rundes Schild zeigt das Symbol eines Steckers, der aus einer Steckdose gezogen wird. Welche Bedeutung hat dieses Schild?","qPt":"Numa visita guiada pelas instalações da Ecotec GmbH, deve-se explicar aos novos aprendizes o significado das placas de segurança. Uma placa redonda mostra o símbolo de um plugue sendo retirado de uma tomada. Qual é o significado dessa placa?","a":"Dieses Gebotszeichen fordert dazu auf, vor dem Öffnen eines Gerätes zuerst den Netzstecker zu ziehen, um einen Stromschlag zu vermeiden.","aPt":"Esse símbolo de obrigação exige que se retire o plugue da tomada antes de abrir um aparelho, para evitar choque elétrico.","options":[{"text":"Gefahr durch Laserstrahl","textPt":"Perigo de radiação laser","correct":false},{"text":"Feuerlöscher","textPt":"Extintor de incêndio","correct":false},{"text":"Erste Hilfe","textPt":"Primeiros socorros","correct":false},{"text":"Vor Öffnen Netzstecker ziehen","textPt":"Desligar o plugue antes de abrir","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Bei einer Führung durch die Betriebsräume der Ecotec GmbH soll neuen Auszubildenden die Bedeutung der Sicherheitsschilder erklärt werden. Ein dreieckiges Warnschild zeigt Strahlen, die von einem Punkt ausgehen. Welche Bedeutung hat dieses Schild?","qPt":"Numa visita guiada pelas instalações da Ecotec GmbH, deve-se explicar aos novos aprendizes o significado das placas de segurança. Uma placa triangular de advertência mostra raios saindo de um ponto. Qual é o significado dessa placa?","a":"Dieses dreieckige Warnzeichen weist auf die Gefahr durch Laserstrahlung hin, die z. B. Augenschäden verursachen kann, wenn keine Schutzmaßnahmen getroffen werden.","aPt":"Esse símbolo triangular de advertência indica o perigo de radiação laser, que pode causar, por exemplo, lesões oculares, se nenhuma medida de proteção for tomada.","options":[{"text":"Erste Hilfe","textPt":"Primeiros socorros","correct":false},{"text":"Richtung des Fluchtweges","textPt":"Direção da rota de fuga","correct":false},{"text":"Vor Öffnen Netzstecker ziehen","textPt":"Desligar o plugue antes de abrir","correct":false},{"text":"Gefahr durch Laserstrahl","textPt":"Perigo de radiação laser","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Im Lager der Ecotec GmbH ist eine Palette in Brand geraten. Welche der folgenden Aktionen ist zuerst durchzuführen?","qPt":"No depósito da Ecotec GmbH, um palete pegou fogo. Qual das seguintes ações deve ser realizada primeiro?","a":"Im Brandfall ist zunächst der Brandmelder zu betätigen bzw. der Brand zu melden (z. B. über die Feuerwehr-Notrufnummer), damit schnellstmöglich professionelle Hilfe organisiert und weitere Schutzmaßnahmen koordiniert werden können.","aPt":"Em caso de incêndio, deve-se primeiro acionar o alarme de incêndio ou comunicar o incêndio (por exemplo, pelo número de emergência dos bombeiros), para que a ajuda profissional seja organizada o mais rápido possível e outras medidas de proteção sejam coordenadas.","options":[{"text":"Sofortiges Einleiten des Löschens","textPt":"Iniciar imediatamente o combate ao fogo","correct":false},{"text":"Brandmelder betätigen bzw. Brand melden","textPt":"Acionar o alarme de incêndio ou comunicar o incêndio","correct":true},{"text":"Sofort alle anderen Mitarbeitenden warnen","textPt":"Avisar imediatamente todos os demais funcionários","correct":false},{"text":"Sofort den nächsten Sammelpunkt aufsuchen","textPt":"Dirigir-se imediatamente ao ponto de encontro mais próximo","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Vengeta liegen zur Ecotec GmbH Informationen über die Firma, den Ort, das Stammkapital, die Gesellschafter und die Prokura vor. Aus welcher der folgenden Informationsquellen stammen solche Informationen üblicherweise?","qPt":"A Sra. Vengeta tem informações sobre a Ecotec GmbH referentes à firma, à sede, ao capital social, aos sócios e à procuração. De qual das seguintes fontes de informação esses dados normalmente provêm?","a":"Angaben zu Firma, Sitz, Stammkapital, Gesellschaftern und Prokuristen einer GmbH sind öffentlich einsehbar im Handelsregister, in das jede Kapitalgesellschaft eingetragen werden muss.","aPt":"Dados sobre a razão social, a sede, o capital social, os sócios e os procuradores de uma GmbH são de consulta pública no registro comercial, no qual toda sociedade de capital deve estar inscrita.","options":[{"text":"Grundbuch","textPt":"Registro de imóveis (Grundbuch)","correct":false},{"text":"Patentregister","textPt":"Registro de patentes","correct":false},{"text":"Gesellschaftsvertrag","textPt":"Contrato social","correct":false},{"text":"Handelsregister","textPt":"Registro comercial","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Ecotec GmbH hat zwei Gesellschafter. Peter Müller ist mit 198.000,00 EUR am Stammkapital von insgesamt 330.000,00 EUR beteiligt, die Gesellschafterin Claudia Simmer hält den Rest. Die Ecotec GmbH schüttet einen Gewinn nach Steuern von 87.450,00 EUR im Verhältnis der Kapitalanteile aus. Wie hoch ist der Gewinnanteil von Claudia Simmer?","qPt":"A Ecotec GmbH tem dois sócios. Peter Müller detém 198.000,00 EUR do capital social total de 330.000,00 EUR, e a sócia Claudia Simmer detém o restante. A Ecotec GmbH distribui um lucro após impostos de 87.450,00 EUR na proporção das participações de capital. Qual é a parte do lucro de Claudia Simmer?","a":"Claudia Simmer hält 330.000,00 EUR − 198.000,00 EUR = 132.000,00 EUR, das sind 40 % des Stammkapitals. Ihr Gewinnanteil beträgt somit 87.450,00 EUR × 40 % = 34.980,00 EUR.","aPt":"Claudia Simmer detém 330.000,00 EUR − 198.000,00 EUR = 132.000,00 EUR, ou seja, 40% do capital social. Sua parte do lucro é, portanto, 87.450,00 EUR × 40% = 34.980,00 EUR.","options":[{"text":"29.150,00 EUR","textPt":"29.150,00 EUR","correct":false},{"text":"34.980,00 EUR","textPt":"34.980,00 EUR","correct":true},{"text":"43.725,00 EUR","textPt":"43.725,00 EUR","correct":false},{"text":"52.470,00 EUR","textPt":"52.470,00 EUR","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welche der folgenden Aussagen trifft auf die Ecotec GmbH zu?","qPt":"Qual das seguintes afirmações sobre a Ecotec GmbH está correta?","a":"Eine GmbH kann als sogenannte Ein-Personen-GmbH von nur einer einzigen Person gegründet werden; sie benötigt also keine mehreren Gesellschafter.","aPt":"Uma GmbH pode ser fundada por uma única pessoa, na chamada GmbH unipessoal; portanto, não é obrigatório ter vários sócios.","options":[{"text":"Die Ecotec GmbH ist eine Personengesellschaft.","textPt":"A Ecotec GmbH é uma sociedade de pessoas.","correct":false},{"text":"Die Eintragung der GmbH erfolgt in das Handelsregister Abteilung A.","textPt":"A inscrição da GmbH é feita na seção A do registro comercial.","correct":false},{"text":"Die Gründung der GmbH ist durch eine Person möglich.","textPt":"A fundação da GmbH é possível por uma única pessoa.","correct":true},{"text":"Die Ecotec GmbH hat grundsätzlich nur einen Geschäftsführer; mehrere Geschäftsführer sind nicht zulässig.","textPt":"A Ecotec GmbH tem, em regra, apenas um diretor; vários diretores não são permitidos.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die 26-jährige Mitarbeiterin der Ecotec GmbH, Esma Barasi, erwartet ihr erstes Kind. Wie viele Wochen darf sie nach dem Mutterschutzgesetz ab dem Tag der Entbindung im Regelfall nicht beschäftigt werden?","qPt":"Esma Barasi, funcionária de 26 anos da Ecotec GmbH, está grávida do primeiro filho. Segundo a Lei de Proteção à Maternidade, por quantas semanas, no caso regular, ela não pode trabalhar a partir do dia do parto?","a":"Nach dem Mutterschutzgesetz dürfen Mütter im Regelfall acht Wochen nach der Entbindung nicht beschäftigt werden.","aPt":"Segundo a Lei de Proteção à Maternidade, no caso regular, as mães não podem trabalhar durante oito semanas após o parto.","options":[{"text":"6 Wochen","textPt":"6 semanas","correct":false},{"text":"8 Wochen","textPt":"8 semanas","correct":true},{"text":"10 Wochen","textPt":"10 semanas","correct":false},{"text":"12 Wochen","textPt":"12 semanas","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Zwei Mitarbeitende der Ecotec GmbH wollen sich mit einem IT-Service-Unternehmen selbstständig machen. Die finanzierende Bank erwartet von den beiden Existenzgründern die Vorlage eines Businessplanes. Welche der folgenden Aussagen über einen Businessplan trifft zu?","qPt":"Dois funcionários da Ecotec GmbH querem abrir seu próprio negócio com uma empresa de serviços de TI. O banco financiador espera que os dois empreendedores apresentem um plano de negócios. Qual das seguintes afirmações sobre um plano de negócios está correta?","a":"Im Businessplan werden u. a. das Finanzkonzept und die Unternehmensidee vorgestellt, neben Markt- und Wettbewerbsanalyse sowie den strategischen Zielen. Er wird weder von der IHK ausgestellt noch im Handelsregister eingetragen.","aPt":"No plano de negócios são apresentados, entre outros pontos, o conceito financeiro e a ideia de negócio, além da análise de mercado e concorrência e dos objetivos estratégicos. Ele não é emitido pela câmara de comércio nem registrado no registro comercial.","options":[{"text":"Der Businessplan wird von der zuständigen IHK ausgestellt, in dem das Unternehmen gegründet wird.","textPt":"O plano de negócios é emitido pela câmara de comércio competente onde a empresa é fundada.","correct":false},{"text":"Der Businessplan wird im Handelsregister des zuständigen Amtsgerichtes eingetragen.","textPt":"O plano de negócios é registrado no registro comercial do tribunal competente.","correct":false},{"text":"Der Businessplan muss nur bei der Gründung von Kapitalgesellschaften erstellt werden.","textPt":"O plano de negócios só precisa ser elaborado na fundação de sociedades de capital.","correct":false},{"text":"Im Businessplan werden u. a. das Finanzkonzept und die Unternehmensidee vorgestellt.","textPt":"No plano de negócios são apresentados, entre outros, o conceito financeiro e a ideia de negócio.","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Frau Vengeta bittet einen Praktikanten, vier durchgeführte Aufträge der Ecotec GmbH auf ihre Wirtschaftlichkeit zu prüfen: Auftrag 1: Aufwand 600.000 EUR, Ertrag 720.000 EUR; Auftrag 2: Aufwand 320.000 EUR, Ertrag 400.000 EUR; Auftrag 3: Aufwand 160.000 EUR, Ertrag 208.000 EUR; Auftrag 4: Aufwand 200.000 EUR, Ertrag 248.000 EUR. Welcher Auftrag wurde am wirtschaftlichsten abgewickelt?","qPt":"A Sra. Vengeta pede a um estagiário que avalie a eficiência econômica de quatro pedidos executados pela Ecotec GmbH: Pedido 1: custo 600.000 EUR, receita 720.000 EUR; Pedido 2: custo 320.000 EUR, receita 400.000 EUR; Pedido 3: custo 160.000 EUR, receita 208.000 EUR; Pedido 4: custo 200.000 EUR, receita 248.000 EUR. Qual pedido foi executado de forma mais eficiente?","a":"Wirtschaftlichkeit = Ertrag ÷ Aufwand. Auftrag 1: 1,20; Auftrag 2: 1,25; Auftrag 3: 1,30; Auftrag 4: 1,24. Auftrag 3 hat den höchsten Wert und wurde damit am wirtschaftlichsten abgewickelt.","aPt":"Eficiência econômica = receita ÷ custo. Pedido 1: 1,20; Pedido 2: 1,25; Pedido 3: 1,30; Pedido 4: 1,24. O Pedido 3 tem o maior valor e, portanto, foi o mais eficiente.","options":[{"text":"Auftrag 1","textPt":"Pedido 1","correct":false},{"text":"Auftrag 2","textPt":"Pedido 2","correct":false},{"text":"Auftrag 3","textPt":"Pedido 3","correct":true},{"text":"Auftrag 4","textPt":"Pedido 4","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Ecotec GmbH überlegt, ob das Unternehmen neu organisiert werden soll, und analysiert zunächst die bestehende Organisationsstruktur. Das Organigramm zeigt eine klare Pyramide: An der Spitze steht eine Stelle, darunter folgen mehrere Abteilungen, denen jeweils nur ihre eigenen Mitarbeiter unterstellt sind – jede Stelle hat genau einen Vorgesetzten. Nach welchem Leitungssystem arbeitet die Ecotec GmbH?","qPt":"A Ecotec GmbH avalia se a empresa deve ser reorganizada e analisa primeiro a estrutura organizacional existente. O organograma mostra uma pirâmide clara: no topo está uma posição, abaixo seguem vários departamentos, cada um com seus próprios funcionários subordinados — cada posição tem exatamente um superior. De acordo com qual sistema de direção a Ecotec GmbH trabalha?","a":"Beim Einliniensystem erhält jede Stelle Anweisungen von genau einem Vorgesetzten; die Befehlswege sind klar und eindeutig, wie in einer klassischen Pyramidenstruktur ohne sich überkreuzende Linien.","aPt":"No sistema unilinear, cada posição recebe ordens de exatamente um superior; as linhas de comando são claras e inequívocas, como numa estrutura piramidal clássica sem linhas que se cruzam.","options":[{"text":"Einliniensystem","textPt":"Sistema unilinear","correct":true},{"text":"Mehrliniensystem","textPt":"Sistema multilinear","correct":false},{"text":"Matrixsystem","textPt":"Sistema matricial","correct":false},{"text":"Stabliniensystem","textPt":"Sistema de linha e assessoria (staff)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Ecotec GmbH hat Probleme mit einem vermeintlichen Kartell. Welches der folgenden Kartelle ist in Deutschland grundsätzlich anmeldepflichtig (statt generell verboten)?","qPt":"A Ecotec GmbH tem problemas com um suposto cartel. Qual dos seguintes cartéis é, na Alemanha, em regra, apenas sujeito a notificação (em vez de simplesmente proibido)?","a":"Normen- und Typenkartelle, bei denen sich Unternehmen auf einheitliche technische Abmessungen oder Ausführungsformen (z. B. Normen) einigen, sind im Unterschied zu Preis-, Quoten- oder Gebietskartellen ausnahmsweise erlaubt, müssen aber beim Kartellamt angemeldet werden.","aPt":"Os cartéis de normas e tipos, nos quais empresas acordam dimensões técnicas ou formas de execução padronizadas (por exemplo, normas), são, diferentemente de cartéis de preço, cota ou território, excepcionalmente permitidos, mas devem ser notificados à autoridade concorrencial (Kartellamt).","options":[{"text":"Die Kartellmitglieder vereinbaren einen Mindestpreis.","textPt":"Os membros do cartel acordam um preço mínimo.","correct":false},{"text":"Die Kartellmitglieder vereinbaren einheitliche Abmessungen und Ausführungsformen (Normen- und Typenkartell).","textPt":"Os membros do cartel acordam dimensões e formas de execução padronizadas (cartel de normas e tipos).","correct":true},{"text":"Die Kartellmitglieder vereinbaren vertraglich, für welches Absatzgebiet sie ausschließlich zuständig sind.","textPt":"Os membros do cartel acordam contratualmente qual território de venda cabe exclusivamente a cada um.","correct":false},{"text":"Der Kartellvertrag vereinbart für jedes Kartellmitglied eine bestimmte Produktionsquote.","textPt":"O contrato do cartel estabelece para cada membro uma cota de produção determinada.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Eine Kollegin bei der Ecotec GmbH hat Fragen bezüglich des gesetzlichen Kündigungsschutzes. Welche der folgenden Personengruppen genießt keinen besonderen Kündigungsschutz?","qPt":"Uma colega da Ecotec GmbH tem dúvidas sobre a proteção legal contra demissão. Qual dos seguintes grupos de pessoas não goza de proteção especial contra demissão?","a":"Ein hohes Lebensalter allein (z. B. über 45 Jahre) begründet keinen besonderen gesetzlichen Kündigungsschutz – anders als bei Betriebsratsmitgliedern, Schwerbehinderten oder werdenden Müttern, die ausdrücklich besonders geschützt sind.","aPt":"A idade avançada por si só (por exemplo, acima de 45 anos) não gera proteção legal especial contra demissão — diferentemente de membros do conselho de trabalhadores, pessoas com deficiência grave ou gestantes, que têm proteção especial explícita.","options":[{"text":"Betriebsratsmitglieder","textPt":"Membros do conselho de trabalhadores","correct":false},{"text":"Schwerbehinderte","textPt":"Pessoas com deficiência grave","correct":false},{"text":"Werdende Mütter","textPt":"Gestantes","correct":false},{"text":"Mitarbeiter über 45 Jahre","textPt":"Funcionários com mais de 45 anos","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Im Rahmen der Tarifverhandlungen wird zwischen Lohn- und Gehaltstarifvertrag und dem normalerweise längerfristig geltenden Manteltarifvertrag unterschieden. Welcher der folgenden Inhalte wird typischerweise in einem Lohn- und Gehaltstarifvertrag geregelt?","qPt":"No âmbito das negociações coletivas, distingue-se entre a convenção salarial (Lohn- und Gehaltstarifvertrag) e a convenção-quadro (Manteltarifvertrag), normalmente de vigência mais longa. Qual dos seguintes conteúdos é tipicamente regulado numa convenção salarial?","a":"Der Lohn- und Gehaltstarifvertrag regelt vor allem die konkrete Höhe der Entgelte, also die Gehaltssätze für die einzelnen Gehaltsgruppen; er hat meist eine kürzere Laufzeit als der Manteltarifvertrag, der eher allgemeine Arbeitsbedingungen wie Arbeitszeit oder Kündigungsfristen regelt.","aPt":"A convenção salarial regula principalmente o valor concreto da remuneração, ou seja, os valores salariais para cada faixa salarial; costuma ter vigência mais curta do que a convenção-quadro, que regula condições gerais de trabalho, como jornada ou prazos de aviso prévio.","options":[{"text":"Kündigungsfristen","textPt":"Prazos de aviso prévio","correct":false},{"text":"Tägliche und wöchentliche Arbeitszeit","textPt":"Jornada diária e semanal de trabalho","correct":false},{"text":"Mindesturlaubstage","textPt":"Dias mínimos de férias","correct":false},{"text":"Gehaltssätze für die einzelnen Gehaltsgruppen","textPt":"Os valores salariais para cada faixa salarial","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Für die Ecotec GmbH wird ein neuer Tarifvertrag ausgehandelt. Welche der folgenden Aussagen zu Tarifverträgen ist zutreffend?","qPt":"Uma nova convenção coletiva é negociada para a Ecotec GmbH. Qual das seguintes afirmações sobre convenções coletivas está correta?","a":"Tarifverträge werden zwischen Arbeitgeberverbänden (oder einzelnen Arbeitgebern) auf der einen und Gewerkschaften auf der anderen Seite ausgehandelt, nicht zwischen der Geschäftsführung eines einzelnen Unternehmens und seinen Arbeitnehmern direkt.","aPt":"As convenções coletivas são negociadas entre associações de empregadores (ou empregadores individuais), de um lado, e sindicatos, do outro, e não diretamente entre a diretoria de uma única empresa e seus funcionários.","options":[{"text":"Arbeitgeberverbände und Gewerkschaften handeln Tarifverträge aus.","textPt":"Associações de empregadores e sindicatos negociam as convenções coletivas.","correct":true},{"text":"Während der Laufzeit von Tarifverträgen sind Arbeitskämpfe erlaubt, wenn sie vier Wochen vorher angekündigt werden.","textPt":"Durante a vigência das convenções coletivas, greves são permitidas se avisadas com quatro semanas de antecedência.","correct":false},{"text":"Tarifverträge werden zwischen der Geschäftsführung und den Arbeitnehmern geschlossen.","textPt":"As convenções coletivas são firmadas entre a diretoria e os funcionários.","correct":false},{"text":"Tarifverträge sind als Empfehlungen für die Tarifparteien zu interpretieren.","textPt":"As convenções coletivas devem ser interpretadas como meras recomendações para as partes.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"In der gesetzlichen Rentenversicherung wird der sogenannte 'Generationenvertrag' angewandt. Welche der folgenden Aussagen beschreibt die Funktionsweise dieses 'Vertrages' zutreffend?","qPt":"No seguro de aposentadoria legal, aplica-se o chamado 'pacto entre gerações' (Generationenvertrag). Qual das seguintes afirmações descreve corretamente o funcionamento desse 'pacto'?","a":"Der Generationenvertrag beschreibt das Umlageverfahren der gesetzlichen Rentenversicherung: Mit den laufenden Beiträgen der aktiven, erwerbstätigen Generation wird direkt die Rente der aktuellen Rentenempfänger finanziert, statt dass jeder für sich selbst ansparen würde.","aPt":"O pacto entre gerações descreve o sistema de repartição do seguro de aposentadoria legal: as contribuições correntes da geração ativa, que trabalha, financiam diretamente a pensão dos atuais aposentados, em vez de cada um poupar individualmente para si mesmo.","options":[{"text":"Der Generationenvertrag verlangt, dass jede Generation individuell Vorsorge für das Rentenalter treffen muss.","textPt":"O pacto entre gerações exige que cada geração faça previdência individual para a aposentadoria.","correct":false},{"text":"Der Generationenvertrag sieht vor, dass jeder Arbeitnehmer seine eingezahlten Beiträge erstattet bekommt.","textPt":"O pacto entre gerações prevê que cada trabalhador recebe de volta as contribuições que pagou.","correct":false},{"text":"Der Generationenvertrag regelt, dass mit den Einzahlungen der aktiven Arbeitnehmer die Rente der Rentenempfänger bestritten wird.","textPt":"O pacto entre gerações estabelece que, com as contribuições dos trabalhadores ativos, a pensão dos aposentados é paga.","correct":true},{"text":"Der Generationenvertrag besagt, dass jeder Sozialversicherungszweig den anderen finanziell unterstützen muss.","textPt":"O pacto entre gerações estabelece que cada ramo da previdência social deve apoiar financeiramente os demais.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die Ecotec GmbH möchte ihr 'Diversity Management' neu bewerten und überprüft die Einhaltung der Grundsätze des AGG (Allgemeines Gleichbehandlungsgesetz). Welcher der folgenden Punkte wird im AGG nicht berücksichtigt?","qPt":"A Ecotec GmbH quer reavaliar sua 'gestão da diversidade' e verifica o cumprimento dos princípios da AGG (Lei Geral de Igualdade de Tratamento). Qual dos seguintes pontos não é considerado pela AGG?","a":"Das AGG schützt vor Benachteiligung wegen Rasse/ethnischer Herkunft, Geschlecht, Religion/Weltanschauung, Behinderung, Alter oder sexueller Identität. Die Art des (Schul- oder Berufs-)Abschlusses gehört nicht zu den im AGG geschützten Merkmalen.","aPt":"A AGG protege contra discriminação por raça/origem étnica, sexo, religião/convicção, deficiência, idade ou identidade sexual. O tipo de formação escolar ou profissional não está entre as características protegidas pela AGG.","options":[{"text":"Alter","textPt":"Idade","correct":false},{"text":"Religion","textPt":"Religião","correct":false},{"text":"Sexuelle Orientierung/Identität","textPt":"Orientação/identidade sexual","correct":false},{"text":"Art des Abschlusses","textPt":"Tipo de formação/diploma","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"In der Ecotec GmbH wird dem Brandschutz besondere Beachtung geschenkt. An einer Stelle im Unternehmensgebäude ist ein Schild angebracht, das einen Schlauch mit Flammen zeigt. Welche Bedeutung hat dieses Schild?","qPt":"Na Ecotec GmbH, a proteção contra incêndio recebe atenção especial. Em um ponto do prédio da empresa há uma placa que mostra uma mangueira com chamas. Qual é o significado dessa placa?","a":"Dieses Brandschutzzeichen zeigt die Symbole für einen Löschschlauch und weist darauf hin, dass sich an dieser Stelle ein Löschschlauch für die Brandbekämpfung befindet.","aPt":"Esse símbolo de proteção contra incêndio representa uma mangueira de combate a incêndio e indica que, naquele ponto, há uma mangueira para combater o fogo.","options":[{"text":"Feuerwehrnoteingang mit Schlauchanschluss an dieser Stelle","textPt":"Entrada de emergência dos bombeiros com conexão de mangueira nesse local","correct":false},{"text":"Erste-Hilfe-Rettung durch Hilfedienste mit Hinweis auf Verbandskasten","textPt":"Resgate de primeiros socorros por serviços de ajuda, indicando um kit de primeiros socorros","correct":false},{"text":"Sprinkler-Anlage mit Sprühwassergefahr von oben","textPt":"Sistema de sprinklers com risco de água pulverizada vinda de cima","correct":false},{"text":"Löschschlauch hier","textPt":"Mangueira de incêndio aqui","correct":true}]},
{"cat":"wiso","sub":"pruefung","q":"Die Ecotec GmbH wirtschaftet, soweit möglich, nachhaltig. Welche der folgenden Maßnahmen zählt zum nachhaltigen Wirtschaften?","qPt":"A Ecotec GmbH opera de forma sustentável sempre que possível. Qual das seguintes medidas se enquadra numa gestão sustentável?","a":"Produkte, soweit möglich, aus nachwachsenden Rohstoffen herzustellen, schont begrenzte fossile Ressourcen und ist ein zentraler Bestandteil nachhaltigen Wirtschaftens – anders als der Bezug ausländischer Lebensmittel oder der Einkauf bei Zulieferern aus Entwicklungsländern unabhängig von deren Produktionsbedingungen.","aPt":"Fabricar produtos, sempre que possível, a partir de matérias-primas renováveis poupa recursos fósseis limitados e é um elemento central da gestão sustentável — diferentemente de comprar alimentos importados ou adquirir de fornecedores em países em desenvolvimento sem considerar as condições de produção.","options":[{"text":"Bezug von ausländischen Lebensmitteln für die Betriebskantine","textPt":"Compra de alimentos importados para o refeitório da empresa","correct":false},{"text":"Zuführung von Verpackungsabfällen zum Recycling","textPt":"Encaminhamento de resíduos de embalagens para reciclagem","correct":true},{"text":"Einkauf von Zulieferprodukten, die in Entwicklungsländern hergestellt wurden","textPt":"Compra de produtos fabricados em países em desenvolvimento","correct":false},{"text":"Ausweitung der Produktion bei nur wenigen Produkten","textPt":"Ampliação da produção de poucos produtos apenas","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Im Rahmen des Umweltschutzes soll nach dem Verursacherprinzip verfahren werden. Welche der folgenden Aussagen beschreibt dieses Prinzip zutreffend?","qPt":"No âmbito da proteção ambiental, deve-se seguir o princípio do poluidor-pagador (Verursacherprinzip). Qual das seguintes afirmações descreve corretamente esse princípio?","a":"Nach dem Verursacherprinzip müssen diejenigen, die einen Umweltschaden verursacht haben, auch die Kosten für dessen Beseitigung tragen – im Gegensatz etwa zum Gemeinlastprinzip, bei dem die Allgemeinheit dafür aufkommt.","aPt":"Segundo o princípio do poluidor-pagador, quem causou um dano ambiental deve também arcar com os custos de sua reparação — ao contrário, por exemplo, do princípio da responsabilidade coletiva, em que a coletividade arca com os custos.","options":[{"text":"Umweltschutz wird immer mehr grundsätzlicher Bestandteil schulischer Lehrpläne.","textPt":"A proteção ambiental é cada vez mais parte fundamental dos currículos escolares.","correct":false},{"text":"Abfalltrennung ist wichtiger als Abfallvermeidung.","textPt":"A separação de resíduos é mais importante do que a prevenção de resíduos.","correct":false},{"text":"Die Kosten für die Beseitigung von Umweltschäden tragen diejenigen, die für die Schäden verantwortlich sind.","textPt":"Os custos de reparação de danos ambientais são arcados por quem é responsável pelos danos.","correct":true},{"text":"Die Kosten für die Beseitigung von Umweltschäden werden gleichmäßig auf alle Einwohner eines Landes aufgeteilt.","textPt":"Os custos de reparação de danos ambientais são divididos igualmente entre todos os habitantes de um país.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Moritz Monion ist 17 Jahre alt (Geburtstag 02.03.) und beginnt am 01.08.2024 seine Ausbildung bei der EcoTec GmbH (IT-Service-Unternehmen, 25 Mitarbeiter). Im Jahr 2025 erhält er 30 Urlaubstage (Werktage). Wie viele Werktage mehr erhält Herr Monion, als ihm nach dem Jugendarbeitsschutzgesetz (JArbSchG) als Mindesturlaub zusteht?","qPt":"Moritz Monion tem 17 anos (aniversário a 02.03.) e começa a sua formação profissional na EcoTec GmbH (empresa de serviços de TI, 25 colaboradores) em 01.08.2024. Em 2025 ele recebe 30 dias úteis de férias. Quantos dias úteis a mais do que o mínimo legal previsto na Lei de Proteção ao Trabalho de Jovens (JArbSchG) ele recebe?","a":"Zu Beginn des Kalenderjahres 2025 hat Herr Monion das 18. Lebensjahr noch nicht vollendet (er wird erst im März 2025 18). Nach §19 JArbSchG stehen ihm daher mindestens 25 Werktage Urlaub zu. Da er tatsächlich 30 Werktage erhält, bekommt er 5 Werktage mehr als den gesetzlichen Mindesturlaub.","aPt":"No início do ano civil de 2025, o Sr. Monion ainda não tinha completado 18 anos (só os completa em março de 2025). Segundo o §19 da JArbSchG, isso lhe garante no mínimo 25 dias úteis de férias. Como ele recebe efetivamente 30 dias úteis, isso representa 5 dias úteis a mais do que o mínimo legal.","options":[{"text":"5 Werktage","textPt":"5 dias úteis","correct":true},{"text":"3 Werktage","textPt":"3 dias úteis","correct":false},{"text":"4 Werktage","textPt":"4 dias úteis","correct":false},{"text":"7 Werktage","textPt":"7 dias úteis","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die EcoTec GmbH schließt Ausbildungsverträge mit diversen Auszubildenden ab. Welcher der folgenden Punkte muss nach dem Berufsbildungsgesetz (BBiG) nicht zwingend im Ausbildungsvertrag festgehalten werden?","qPt":"A EcoTec GmbH celebra contratos de formação profissional com vários aprendizes. Qual dos seguintes pontos NÃO precisa obrigatoriamente constar no contrato de formação, segundo a Lei de Formação Profissional (BBiG)?","a":"Regelungen zur Gleitzeit gehören nicht zu den nach §11 BBiG zwingend vorgeschriebenen Mindestinhalten eines Ausbildungsvertrags. Art, Gliederung und Ziel der Ausbildung, Beginn und Dauer sowie Ausbildungsmaßnahmen außerhalb der Ausbildungsstätte sind dagegen zwingend anzugeben.","aPt":"As regras sobre horário flexível (Gleitzeit) não fazem parte do conteúdo mínimo obrigatório de um contrato de formação profissional segundo o §11 da BBiG. Já o tipo, a estrutura e o objetivo da formação, o início e a duração, e as medidas de formação fora do local de formação são obrigatórios.","options":[{"text":"Regelungen zur Gleitzeit","textPt":"Regras sobre horário flexível (Gleitzeit)","correct":true},{"text":"Art, sachliche und zeitliche Gliederung sowie Ziel der Berufsausbildung","textPt":"Tipo, estrutura material e temporal, e objetivo da formação profissional","correct":false},{"text":"Beginn und Dauer der Berufsausbildung","textPt":"Início e duração da formação profissional","correct":false},{"text":"Dauer der regelmäßigen täglichen Ausbildungszeit","textPt":"Duração do horário diário regular de formação","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Monion hat Fragen zur Probezeit in seinem Ausbildungsverhältnis bei der EcoTec GmbH. Wie lang muss die Probezeit nach dem Berufsbildungsgesetz (BBiG) mindestens sein?","qPt":"O Sr. Monion tem dúvidas sobre o período de experiência (Probezeit) no seu contrato de formação na EcoTec GmbH. Qual é a duração mínima do período de experiência segundo a Lei de Formação Profissional (BBiG)?","a":"Nach §20 BBiG muss die Probezeit mindestens einen Monat und darf höchstens vier Monate betragen.","aPt":"Segundo o §20 da BBiG, o período de experiência deve ter no mínimo um mês e pode ter, no máximo, quatro meses.","options":[{"text":"1 Monat","textPt":"1 mês","correct":true},{"text":"2 Monate","textPt":"2 meses","correct":false},{"text":"3 Monate","textPt":"3 meses","correct":false},{"text":"Eine Probezeit ist nicht zwingend notwendig.","textPt":"Um período de experiência não é obrigatório.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Justin Höhler, Mitauszubildender von Herrn Monion bei der EcoTec GmbH, kündigt seinen Ausbildungsvertrag während der Probezeit. Welche Feststellung entspricht dem Berufsbildungsgesetz (BBiG)?","qPt":"Justin Höhler, colega de formação do Sr. Monion na EcoTec GmbH, rescinde o seu contrato de formação durante o período de experiência. Qual afirmação está de acordo com a Lei de Formação Profissional (BBiG)?","a":"Nach §22 Abs. 1 BBiG können beide Seiten das Berufsausbildungsverhältnis während der Probezeit jederzeit ohne Angabe von Gründen und ohne Einhaltung einer Kündigungsfrist kündigen.","aPt":"Segundo o §22, parágrafo 1, da BBiG, ambas as partes podem rescindir a relação de formação profissional durante o período de experiência a qualquer momento, sem necessidade de justificação e sem cumprir prazo de aviso prévio.","options":[{"text":"Beide Seiten können das Berufsausbildungsverhältnis in der Probezeit ohne Angabe von Gründen und ohne Einhaltung einer Kündigungsfrist kündigen.","textPt":"Ambas as partes podem rescindir a relação de formação durante o período de experiência sem necessidade de justificação e sem prazo de aviso prévio.","correct":true},{"text":"Die Kündigung eines Ausbildungsverhältnisses kann mündlich erfolgen.","textPt":"A rescisão de uma relação de formação pode ser feita oralmente.","correct":false},{"text":"In Betrieben, in denen ein Betriebsrat besteht, muss dieser jeder Kündigung während der Probezeit durch den Arbeitgeber zustimmen.","textPt":"Em empresas com conselho de trabalhadores, este tem de aprovar toda rescisão feita pelo empregador durante o período de experiência.","correct":false},{"text":"Während einer Berufsausbildung kann vom Arbeitgeber nicht, auch nicht in der Probezeit, gekündigt werden.","textPt":"Durante uma formação profissional, o empregador não pode rescindir o contrato, nem mesmo durante o período de experiência.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der EcoTec GmbH soll ein neuer Betriebsrat gewählt werden. Welche Personengruppe ist nach dem Betriebsverfassungsgesetz (BetrVG) in den Betriebsrat wählbar (passives Wahlrecht)?","qPt":"Na EcoTec GmbH será eleito um novo conselho de trabalhadores (Betriebsrat). Qual grupo de pessoas é elegível para o conselho de trabalhadores (direito de ser eleito) segundo a Lei de Organização Empresarial (BetrVG)?","a":"Wählbar ist nach §8 BetrVG, wer das 18. Lebensjahr vollendet hat und seit mindestens sechs Monaten dem Betrieb angehört (passives Wahlrecht).","aPt":"Segundo o §8 da BetrVG, é elegível quem tiver completado 18 anos e pertencer à empresa há pelo menos seis meses (direito passivo de voto).","options":[{"text":"Alle Wahlberechtigten, die das 18. Lebensjahr vollendet haben und mindestens sechs Monate im Betrieb beschäftigt sind.","textPt":"Todos os eleitores que tenham completado 18 anos e estejam empregados na empresa há pelo menos seis meses.","correct":true},{"text":"Alle Wahlberechtigten, die über 16 Jahre alt sind.","textPt":"Todos os eleitores com mais de 16 anos.","correct":false},{"text":"Alle Betriebsangehörigen","textPt":"Todos os membros da empresa","correct":false},{"text":"Alle Wahlberechtigten, die der EcoTec GmbH seit mindestens sechs Wochen angehören.","textPt":"Todos os eleitores que pertencem à EcoTec GmbH há pelo menos seis semanas.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Maike Schröder, eine Kollegin von Herrn Monion bei der EcoTec GmbH, beschäftigt sich mit dem Aufgabenbereich des Betriebsrats und bringt Gewerkschaften bisher nur mit Tarifverträgen in Verbindung. Welche Darstellung von Gewerkschaften ist zutreffend?","qPt":"Maike Schröder, colega do Sr. Monion na EcoTec GmbH, está a estudar as funções do conselho de trabalhadores e, até agora, só associava os sindicatos às convenções coletivas de trabalho. Qual afirmação sobre os sindicatos está correta?","a":"Gewerkschaften können bei Streitigkeiten zwischen Arbeitgebern und Arbeitnehmern den organisierten Arbeitnehmern Rechtsbeistand leisten, etwa durch gewerkschaftlichen Rechtsschutz.","aPt":"Os sindicatos podem prestar apoio jurídico aos trabalhadores sindicalizados em caso de litígios entre empregadores e trabalhadores, por exemplo através da proteção jurídica sindical.","options":[{"text":"Gewerkschaften können bei Streitigkeiten zwischen Arbeitgebern und Arbeitnehmern den organisierten Arbeitnehmern Rechtsbeistand leisten.","textPt":"Os sindicatos podem prestar apoio jurídico aos trabalhadores sindicalizados em litígios entre empregadores e trabalhadores.","correct":true},{"text":"Gewerkschaften sind in den Betrieben für die Schlichtung von Auseinandersetzungen zwischen Arbeitnehmern und Arbeitgebern zuständig.","textPt":"Os sindicatos são responsáveis, dentro das empresas, pela mediação de conflitos entre trabalhadores e empregadores.","correct":false},{"text":"Gewerkschaften haben die Aufgabe, die Betriebsratswahlen zu kontrollieren.","textPt":"Os sindicatos têm a função de controlar as eleições do conselho de trabalhadores.","correct":false},{"text":"Gewerkschaften handeln mit den Arbeitgeberverbänden auch Betriebsvereinbarungen aus.","textPt":"Os sindicatos negoceiam também acordos de empresa com as associações patronais.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der EcoTec GmbH beschäftigt sich Herr Monion mit dem zeitlichen Ablauf beim Zustandekommen eines Tarifvertrags, nachdem die Tarifverhandlungen gescheitert sind. Was geschieht im richtigen zeitlichen Ablauf zuerst: die Erklärung des Scheiterns der Tarifverhandlungen durch eine der Tarifparteien oder die Urabstimmung über einen Arbeitskampf mit nachfolgendem Streik?","qPt":"Na EcoTec GmbH, o Sr. Monion está a estudar a sequência cronológica da formação de uma convenção coletiva de trabalho depois de as negociações terem fracassado. O que acontece primeiro, na ordem correta: a declaração de fracasso das negociações por uma das partes ou a votação sobre uma greve (Urabstimmung)?","a":"Zuerst erklärt eine der Tarifparteien offiziell das Scheitern der Tarifverhandlungen. Erst danach erfolgt die Urabstimmung über einen Arbeitskampf mit nachfolgendem Streik. Im ursprünglich vorgelegten Ablaufplan waren genau diese beiden Schritte versehentlich vertauscht.","aPt":"Primeiro, uma das partes da negociação coletiva declara oficialmente o fracasso das negociações. Só depois ocorre a votação sobre uma greve com a greve subsequente. No plano cronológico originalmente apresentado, exatamente estes dois passos tinham sido trocados por engano.","options":[{"text":"Die Erklärung des Scheiterns der Tarifverhandlungen erfolgt vor der Urabstimmung über einen Arbeitskampf mit nachfolgendem Streik.","textPt":"A declaração de fracasso das negociações ocorre antes da votação sobre uma greve.","correct":true},{"text":"Die Urabstimmung über einen Arbeitskampf erfolgt vor der Erklärung des Scheiterns der Tarifverhandlungen.","textPt":"A votação sobre uma greve ocorre antes da declaração de fracasso das negociações.","correct":false},{"text":"Beide Schritte erfolgen gleichzeitig und sind rechtlich nicht voneinander zu trennen.","textPt":"Ambos os passos ocorrem simultaneamente e não podem ser juridicamente separados.","correct":false},{"text":"Die Urabstimmung über die Verhandlungsergebnisse erfolgt vor der Erklärung des Scheiterns der Tarifverhandlungen.","textPt":"A votação sobre os resultados da negociação ocorre antes da declaração de fracasso das negociações.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der EcoTec GmbH wird überlegt, die tariflich festgelegten Arbeitsbedingungen in einzelnen Punkten zu ändern. Wann sind solche Änderungen zulässig?","qPt":"Na EcoTec GmbH pondera-se alterar, em alguns pontos, as condições de trabalho fixadas na convenção coletiva. Quando é que tais alterações são permitidas?","a":"Abweichungen von einem Tarifvertrag zugunsten der Arbeitnehmer sind nach dem arbeitsrechtlichen Günstigkeitsprinzip zulässig, da Tarifverträge nur ein Mindestniveau zum Schutz der Arbeitnehmer festlegen.","aPt":"Desvios de uma convenção coletiva a favor dos trabalhadores são permitidos de acordo com o princípio do tratamento mais favorável (Günstigkeitsprinzip), já que as convenções coletivas fixam apenas um nível mínimo de proteção dos trabalhadores.","options":[{"text":"Die Änderung ist zulässig, wenn sie zugunsten der Arbeitnehmer erfolgt.","textPt":"A alteração é permitida quando for a favor dos trabalhadores.","correct":true},{"text":"Die Änderung ist zulässig, wenn sie zugunsten der EcoTec GmbH erfolgt.","textPt":"A alteração é permitida quando for a favor da EcoTec GmbH.","correct":false},{"text":"Die Änderung ist zulässig, wenn die Berufsgenossenschaft der Änderung zustimmt.","textPt":"A alteração é permitida quando a associação profissional (Berufsgenossenschaft) a aprovar.","correct":false},{"text":"Die Änderung ist zulässig, wenn sie von der Bundesagentur für Arbeit genehmigt wird.","textPt":"A alteração é permitida quando for aprovada pela Agência Federal do Trabalho.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die EcoTec GmbH veröffentlicht im Intranet die aktuell gültigen Betriebsvereinbarungen. Von wem werden Betriebsvereinbarungen abgeschlossen?","qPt":"A EcoTec GmbH publica na intranet os acordos de empresa atualmente em vigor. Entre quem são celebrados os acordos de empresa?","a":"Betriebsvereinbarungen werden zwischen der Geschäftsleitung des Unternehmens und dem Betriebsrat abgeschlossen (§77 BetrVG).","aPt":"Os acordos de empresa são celebrados entre a direção da empresa e o conselho de trabalhadores, conforme o §77 da BetrVG.","options":[{"text":"Die Betriebsvereinbarungen werden abgeschlossen von der Geschäftsleitung der EcoTec GmbH und dem Betriebsrat.","textPt":"Os acordos de empresa são celebrados pela direção da EcoTec GmbH e pelo conselho de trabalhadores.","correct":true},{"text":"Die Betriebsvereinbarungen werden abgeschlossen von den Tarifparteien, also dem Arbeitgeberverband und der örtlich zuständigen Industrie- und Handelskammer.","textPt":"Os acordos de empresa são celebrados pelas partes da convenção coletiva, ou seja, a associação patronal e a câmara de comércio local.","correct":false},{"text":"Die Betriebsvereinbarungen werden abgeschlossen von der Industrie- und Handelskammer und dem Betriebsrat der EcoTec GmbH.","textPt":"Os acordos de empresa são celebrados pela câmara de comércio e pelo conselho de trabalhadores da EcoTec GmbH.","correct":false},{"text":"Die Betriebsvereinbarungen werden abgeschlossen von dem Betriebsrat der EcoTec GmbH und der zuständigen Arbeitsagentur.","textPt":"Os acordos de empresa são celebrados pelo conselho de trabalhadores da EcoTec GmbH e pela agência de emprego competente.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die 17-jährige Daniela Schubert ist Auszubildende im ersten Ausbildungsjahr bei der EcoTec GmbH. Sie möchte wissen, ob ihr Berufsausbildungsverhältnis gekündigt werden kann. In welchem Gesetz findet sie die passende Rechtsgrundlage dazu?","qPt":"Daniela Schubert, de 17 anos, é aprendiz no primeiro ano de formação na EcoTec GmbH. Ela quer saber se a sua relação de formação profissional pode ser rescindida. Em que lei encontra a base jurídica correspondente?","a":"Die Regelungen zur Kündigung eines Berufsausbildungsverhältnisses finden sich im Berufsbildungsgesetz (BBiG), insbesondere in §22 BBiG.","aPt":"As regras sobre a rescisão de uma relação de formação profissional encontram-se na Lei de Formação Profissional (BBiG), em especial no §22 da BBiG.","options":[{"text":"Berufsbildungsgesetz","textPt":"Lei de Formação Profissional (BBiG)","correct":true},{"text":"Jugendarbeitsschutzgesetz","textPt":"Lei de Proteção ao Trabalho de Jovens (JArbSchG)","correct":false},{"text":"Kündigungsschutzgesetz","textPt":"Lei de Proteção contra o Despedimento (KSchG)","correct":false},{"text":"Betriebsverfassungsgesetz","textPt":"Lei de Organização Empresarial (BetrVG)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Daniela Schubert (17 Jahre) möchte wissen, wie viel Pausenzeit ihr als jugendliche Auszubildende zusteht. In welchem Gesetz findet sie die passende Rechtsgrundlage dazu?","qPt":"Daniela Schubert (17 anos) quer saber a que tempo de pausa tem direito enquanto aprendiz menor de idade. Em que lei encontra a base jurídica correspondente?","a":"Pausenzeiten für Jugendliche sind im Jugendarbeitsschutzgesetz (JArbSchG), insbesondere in §11, geregelt.","aPt":"Os tempos de pausa para jovens trabalhadores estão regulados na Lei de Proteção ao Trabalho de Jovens (JArbSchG), em especial no §11.","options":[{"text":"Jugendarbeitsschutzgesetz","textPt":"Lei de Proteção ao Trabalho de Jovens (JArbSchG)","correct":true},{"text":"Berufsbildungsgesetz","textPt":"Lei de Formação Profissional (BBiG)","correct":false},{"text":"Bürgerliches Gesetzbuch","textPt":"Código Civil (BGB)","correct":false},{"text":"Betriebsverfassungsgesetz","textPt":"Lei de Organização Empresarial (BetrVG)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Daniela Schubert möchte wissen, welche Aufgaben die Jugend- und Auszubildendenvertretung (JAV) hat. In welchem Gesetz findet sie die passende Rechtsgrundlage dazu?","qPt":"Daniela Schubert quer saber quais são as funções da representação dos jovens e aprendizes (JAV). Em que lei encontra a base jurídica correspondente?","a":"Die Aufgaben der Jugend- und Auszubildendenvertretung (JAV) sind im Betriebsverfassungsgesetz (BetrVG), §§60-73, geregelt.","aPt":"As funções da representação dos jovens e aprendizes (JAV) estão reguladas na Lei de Organização Empresarial (BetrVG), §§60-73.","options":[{"text":"Betriebsverfassungsgesetz","textPt":"Lei de Organização Empresarial (BetrVG)","correct":true},{"text":"Berufsbildungsgesetz","textPt":"Lei de Formação Profissional (BBiG)","correct":false},{"text":"Jugendarbeitsschutzgesetz","textPt":"Lei de Proteção ao Trabalho de Jovens (JArbSchG)","correct":false},{"text":"Bürgerliches Gesetzbuch","textPt":"Código Civil (BGB)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Bei der EcoTec GmbH gibt es eine Jugend- und Auszubildendenvertretung (JAV), in der sich Herr Monion engagieren möchte. Welche Aussage zur JAV ist zutreffend?","qPt":"Na EcoTec GmbH existe uma representação dos jovens e aprendizes (JAV), na qual o Sr. Monion quer participar. Qual afirmação sobre a JAV está correta?","a":"Eine JAV kann nur gewählt werden, wenn im Betrieb bereits ein Betriebsrat besteht, da die JAV organisatorisch mit dem Betriebsrat verbunden ist.","aPt":"Uma JAV só pode ser eleita se já existir um conselho de trabalhadores (Betriebsrat) na empresa, pois a JAV está organizacionalmente ligada ao Betriebsrat.","options":[{"text":"Eine JAV kann nur gewählt werden, wenn bereits ein Betriebsrat besteht.","textPt":"Uma JAV só pode ser eleita se já existir um conselho de trabalhadores.","correct":true},{"text":"Die regelmäßige Amtszeit in der JAV beträgt vier Jahre.","textPt":"O mandato regular na JAV dura quatro anos.","correct":false},{"text":"Das Mindestalter für das aktive Wahlrecht beträgt 16 Jahre.","textPt":"A idade mínima para o direito ativo de voto é 16 anos.","correct":false},{"text":"Das passive Wahlrecht für die JAV endet mit Vollendung des 18. Lebensjahres.","textPt":"O direito passivo de voto para a JAV termina aos 18 anos.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Monion möchte sich bei der EcoTec GmbH als Kandidat zur Jugend- und Auszubildendenvertretung (JAV) aufstellen lassen. Welche Voraussetzung muss er unter anderem erfüllen?","qPt":"O Sr. Monion quer candidatar-se à representação dos jovens e aprendizes (JAV) na EcoTec GmbH. Que requisito deve cumprir, entre outros?","a":"Ein Kandidat für die JAV darf nicht gleichzeitig Mitglied des Betriebsrats sein, da JAV und Betriebsrat unterschiedliche Vertretungsorgane sind.","aPt":"Um candidato à JAV não pode ser, ao mesmo tempo, membro do conselho de trabalhadores, pois a JAV e o Betriebsrat são órgãos de representação distintos.","options":[{"text":"Herr Monion darf nicht Mitglied des Betriebsrats sein.","textPt":"O Sr. Monion não pode ser membro do conselho de trabalhadores.","correct":true},{"text":"Herr Monion muss die deutsche Staatsangehörigkeit besitzen.","textPt":"O Sr. Monion deve ter nacionalidade alemã.","correct":false},{"text":"Herr Monion muss im zweiten Ausbildungsjahr sein.","textPt":"O Sr. Monion deve estar no segundo ano de formação.","correct":false},{"text":"Herr Monion muss bereits seit mindestens drei Monaten im Betrieb beschäftigt sein.","textPt":"O Sr. Monion deve já estar empregado na empresa há pelo menos três meses.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Monion zeigt Frau Schröder das Organigramm der EcoTec GmbH: Unterhalb der Leitung gibt es eine Rechtsabteilung, die direkt der Leitung zugeordnet ist, sowie die Linienbereiche Sales/Vertrieb, Personal/Verwaltung und Organisation/IT. Welches Leitungssystem liegt diesem Organigramm zugrunde?","qPt":"O Sr. Monion mostra à Sra. Schröder o organograma da EcoTec GmbH: abaixo da direção há um departamento jurídico ligado diretamente à direção, além das áreas de linha Vendas, Pessoal/Administração e Organização/TI. Que sistema de direção está subjacente a este organograma?","a":"Es handelt sich um ein Stabliniensystem: Die Rechtsabteilung ist als beratende Stabsstelle direkt der Leitung zugeordnet, während die übrigen Abteilungen als Linieninstanzen mit klaren Weisungsbefugnissen organisiert sind.","aPt":"Trata-se de um sistema de linha com órgão de apoio (Stabliniensystem): o departamento jurídico está ligado diretamente à direção como órgão consultivo, enquanto os restantes departamentos estão organizados como instâncias de linha com poderes de decisão claros.","options":[{"text":"Stabliniensystem","textPt":"Sistema de linha com órgão de apoio (Stabliniensystem)","correct":true},{"text":"Liniensystem","textPt":"Sistema de linha simples (Liniensystem)","correct":false},{"text":"Mehrliniensystem","textPt":"Sistema de linhas múltiplas (Mehrliniensystem)","correct":false},{"text":"Matrixorganisation","textPt":"Organização matricial","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herr Monion erläutert Frau Schröder die Organisationsstruktur der EcoTec GmbH (mit der Rechtsabteilung als Stabsstelle direkt unter der Leitung). Welche Aussage dazu ist zutreffend?","qPt":"O Sr. Monion explica à Sra. Schröder a estrutura organizacional da EcoTec GmbH (com o departamento jurídico como órgão de apoio diretamente sob a direção). Qual afirmação está correta?","a":"Die Rechtsabteilung berät als Stabsstelle die Geschäftsleitung, hat gegenüber den übrigen Abteilungen und Angestellten jedoch keine eigene Weisungsbefugnis.","aPt":"O departamento jurídico, como órgão de apoio, aconselha a direção da empresa, mas não tem poder de decisão próprio sobre os restantes departamentos e colaboradores.","options":[{"text":"Die Rechtsabteilung berät die Geschäftsleitung, ist jedoch gegenüber den Angestellten der EcoTec GmbH nicht weisungsbefugt.","textPt":"O departamento jurídico aconselha a direção, mas não tem poder de decisão sobre os colaboradores da EcoTec GmbH.","correct":true},{"text":"Die IT-Abteilung ist als Stabsstelle organisiert.","textPt":"O departamento de TI está organizado como órgão de apoio.","correct":false},{"text":"Stabsstellen kommen auf keiner der Leitungsebenen der EcoTec GmbH vor.","textPt":"Não existem órgãos de apoio em nenhum nível de direção da EcoTec GmbH.","correct":false},{"text":"Die Leitung Personalmanagement ist nicht an die Weisungen der Geschäftsführung gebunden.","textPt":"A direção de gestão de pessoal não está vinculada às instruções da gerência.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Herrn Monion liegen Zahlen zur wirtschaftlichen Entwicklung in Europa vor: Das Bruttoinlandsprodukt sinkt von Quartal zu Quartal (von 3,87 auf 3,3 Billionen EUR), die Arbeitslosenquote steigt von 8,5% auf 11,5%, und das Wirtschaftswachstum ist durchgehend negativ und verschlechtert sich (von +1% auf -2%). Mit welchem Begriff lässt sich die gesamtwirtschaftliche Situation bezogen auf das Jahr beschreiben?","qPt":"O Sr. Monion tem dados sobre a evolução económica na Europa: o PIB desce de trimestre em trimestre (de 3,87 para 3,3 biliões de EUR), a taxa de desemprego sobe de 8,5% para 11,5%, e o crescimento económico é negativo e piora continuamente (de +1% para -2%). Que termo descreve a situação económica geral referente ao ano?","a":"Sinkendes BIP, steigende Arbeitslosigkeit und durchgehend negatives, sich verschlechterndes Wirtschaftswachstum sind typische Merkmale eines Abschwungs (Rezession) im Konjunkturzyklus.","aPt":"PIB em queda, desemprego crescente e crescimento económico negativo e cada vez pior são características típicas de uma fase de recessão no ciclo económico.","options":[{"text":"Abschwung (Rezession)","textPt":"Recessão (Abschwung/Rezession)","correct":true},{"text":"Aufschwung","textPt":"Expansão económica (Aufschwung)","correct":false},{"text":"Stillstand (Stagnation)","textPt":"Estagnação (Stillstand)","correct":false},{"text":"Höchststand (Boom)","textPt":"Auge económico (Boom)","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die EcoTec GmbH ist in zwei Märkten tätig: spezielle IT-Dienstleistungen für Medikamentenabrechnungen (hier gibt es vier Mitbewerber) sowie allgemeine IT-Dienstleistungen für Steuerabrechnungen für eine Vielzahl von Privathaushalten und Unternehmen (hier gibt es eine Vielzahl von Konkurrenten). Welche Aussage beschreibt und begründet die vorliegenden Marktformen korrekt?","qPt":"A EcoTec GmbH atua em dois mercados: serviços especializados de TI para faturação de medicamentos (onde há quatro concorrentes) e serviços gerais de TI para faturação de impostos, destinados a muitas famílias e empresas (onde há uma grande quantidade de concorrentes). Qual afirmação descreve e fundamenta corretamente as formas de mercado presentes?","a":"Der Markt für allgemeine IT-Dienstleistungen für Steuerabrechnungen weist auf ein Polypol hin, da dort eine hohe Zahl von Anbietern auf eine Vielzahl von Nachfragern (Privathaushalte und Unternehmen) trifft.","aPt":"O mercado de serviços gerais de TI para faturação de impostos aponta para um polipólio, já que ali um grande número de fornecedores se depara com uma grande quantidade de compradores (famílias e empresas).","options":[{"text":"Der Markt für allgemeine IT-Dienstleistungen für Steuerabrechnungen weist auf ein Polypol hin, da neben der EcoTec GmbH eine hohe Zahl an Anbietern auf eine Vielzahl von Nachfragern trifft.","textPt":"O mercado de serviços gerais de TI para faturação de impostos aponta para um polipólio, pois, além da EcoTec GmbH, há muitos fornecedores a atender uma grande quantidade de compradores.","correct":true},{"text":"Bei den Medikamentenabrechnungen ist die Marktform des Polypols gegeben, da viele Unternehmen und Haushalte als Nachfrager auftreten.","textPt":"Na faturação de medicamentos existe um polipólio, pois muitas empresas e famílias surgem como compradores.","correct":false},{"text":"Da neben der EcoTec GmbH nur wenige Anbieter auf dem Markt für Medikamentenabrechnungen zu finden sind, liegt die Marktform des Angebotsmonopols vor.","textPt":"Como, além da EcoTec GmbH, há poucos fornecedores no mercado de faturação de medicamentos, existe um monopólio de oferta.","correct":false},{"text":"Das Nachfrageoligopol kennzeichnet den Markt für Steuerabrechnungen, da mit Unternehmen und Haushalten nur zwei große Gruppen von Nachfragern auftreten.","textPt":"Um oligopólio de procura caracteriza o mercado de faturação de impostos, pois só há dois grandes grupos de compradores: empresas e famílias.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Welchen Unterschied weist der Markt für Steuerabrechnungen der EcoTec GmbH zum Modell des vollkommenen Marktes bzw. der vollständigen Konkurrenz auf?","qPt":"Que diferença existe entre o mercado de faturação de impostos da EcoTec GmbH e o modelo de mercado perfeito (concorrência perfeita)?","a":"Das Modell des vollkommenen Marktes unterstellt die Homogenität der Güter. Dies ist beim Markt für Steuerabrechnungen nicht gegeben, da die Anbieter ihre Software mit unterschiedlichen Merkmalen und Eigenschaften anbieten (heterogenes Gut).","aPt":"O modelo de mercado perfeito pressupõe a homogeneidade dos bens. Isso não se verifica no mercado de faturação de impostos, pois os fornecedores oferecem o seu software com características e propriedades diferentes (bem heterogéneo).","options":[{"text":"Das Modell des vollkommenen Marktes unterstellt die Homogenität der Güter; dies ist im Fall des Marktes für Steuerabrechnungen jedoch nicht gegeben, da die Anbieter ihre Software mit verschiedenen Merkmalen und Eigenschaften auf den Markt bringen.","textPt":"O modelo de mercado perfeito pressupõe a homogeneidade dos bens, o que não se verifica no mercado de faturação de impostos, pois os fornecedores oferecem o seu software com características diferentes.","correct":true},{"text":"Im Modell des vollkommenen Marktes wird von jedem Anbieter eine eigenständige und unabhängige Preispolitik betrieben.","textPt":"No modelo de mercado perfeito, cada fornecedor pratica uma política de preços própria e independente.","correct":false},{"text":"Der Markt für Steuerabrechnungen stellt einen Verkäufermarkt dar. Im Modell der vollständigen Konkurrenz liegt dagegen nur der Käufermarkt vor.","textPt":"O mercado de faturação de impostos é um mercado de vendedores. Já no modelo de concorrência perfeita existe apenas o mercado de compradores.","correct":false},{"text":"In dem Markt der vollständigen Konkurrenz kann der Staat zum Schutz der Verbraucher Mindestpreise und Höchstpreise festlegen. Dies ist für den Markt für Steuerabrechnungen nicht möglich.","textPt":"No mercado de concorrência perfeita, o Estado pode fixar preços mínimos e máximos para proteger os consumidores. Isso não é possível no mercado de faturação de impostos.","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die EcoTec GmbH formuliert u. a. die beiden Zielsetzungen 'Mitarbeiterzufriedenheit erhöhen' und 'erhöhte Ausgaben für Verpackungen vermeiden'. Welche Zielart liegt bei diesem Zielsetzungspaar vor?","qPt":"A EcoTec GmbH formula, entre os seus objetivos empresariais, os dois objetivos 'aumentar a satisfação dos colaboradores' e 'evitar o aumento dos gastos com embalagens'. Que tipo de relação entre objetivos existe neste par?","a":"Es handelt sich um indifferente (neutrale) Ziele: Die Verfolgung des einen Ziels hat keinen erkennbaren Einfluss auf die Erreichung des anderen Ziels.","aPt":"Trata-se de objetivos indiferentes (neutros): a prossecução de um objetivo não tem influência percetível sobre a realização do outro.","options":[{"text":"Indifferente Ziele","textPt":"Objetivos indiferentes (neutros)","correct":true},{"text":"Komplementäre Ziele","textPt":"Objetivos complementares","correct":false},{"text":"Konkurrierende Ziele","textPt":"Objetivos concorrentes (em conflito)","correct":false},{"text":"Substitutive Ziele","textPt":"Objetivos substitutivos","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die EcoTec GmbH formuliert u. a. die beiden Zielsetzungen 'Einkauf ausschließlich der preisgünstigsten Produkte' und 'Erlangung eines Gütesiegels in der Produktion'. Welche Zielart liegt bei diesem Zielsetzungspaar vor?","qPt":"A EcoTec GmbH formula, entre os seus objetivos empresariais, os objetivos 'comprar exclusivamente os produtos mais baratos' e 'obter um selo de qualidade na produção'. Que tipo de relação entre objetivos existe?","a":"Es handelt sich um konkurrierende Ziele: Der ausschließliche Einkauf der billigsten Produkte steht im Widerspruch zur Erlangung eines anspruchsvollen Gütesiegels, das in der Regel höhere Qualitäts- und Kostenanforderungen stellt.","aPt":"Trata-se de objetivos concorrentes (em conflito): comprar exclusivamente os produtos mais baratos entra em contradição com a obtenção de um selo de qualidade exigente, que normalmente implica requisitos de qualidade e custos mais elevados.","options":[{"text":"Konkurrierende Ziele","textPt":"Objetivos concorrentes (em conflito)","correct":true},{"text":"Komplementäre Ziele","textPt":"Objetivos complementares","correct":false},{"text":"Indifferente Ziele","textPt":"Objetivos indiferentes (neutros)","correct":false},{"text":"Substitutive Ziele","textPt":"Objetivos substitutivos","correct":false}]},
{"cat":"wiso","sub":"pruefung","q":"Die EcoTec GmbH formuliert u. a. die beiden Zielsetzungen 'Gutes Arbeitsklima' und 'Recycling der Verpackungen'. Welche Zielart liegt bei diesem Zielsetzungspaar vor?","qPt":"A EcoTec GmbH formula, entre os seus objetivos empresariais, os objetivos 'bom ambiente de trabalho' e 'reciclagem das embalagens'. Que tipo de relação entre objetivos existe?","a":"Es handelt sich um indifferente Ziele, da ein gutes Arbeitsklima und das Recycling von Verpackungen sich gegenseitig weder fördern noch behindern.","aPt":"Trata-se de objetivos indiferentes, pois um bom ambiente de trabalho e a reciclagem de embalagens não se promovem nem se prejudicam mutuamente.","options":[{"text":"Indifferente Ziele","textPt":"Objetivos indiferentes (neutros)","correct":true},{"text":"Komplementäre Ziele","textPt":"Objetivos complementares","correct":false},{"text":"Konkurrierende Ziele","textPt":"Objetivos concorrentes (em conflito)","correct":false},{"text":"Substitutive Ziele","textPt":"Objetivos substitutivos","correct":false}]},
