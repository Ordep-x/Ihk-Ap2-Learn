{"cat":"algo","sub":"sql","q":"Ist dieses Statement falsch? Was unterscheidet es von einem expliziten JOIN?","qPt":"Esta instrução está errada? O que a distingue de um JOIN explícito?","a":"Syntaktisch gültig (impliziter JOIN über Komma mit Bedingung in WHERE) und liefert dasselbe wie ein INNER JOIN — gilt aber als schlechter Stil, da die Join-Bedingung leicht vergessen werden kann.","aPt":"É sintaticamente válida (um JOIN implícito através de vírgula, com a condição na cláusula WHERE) e produz o mesmo resultado que um INNER JOIN — mas é considerada má prática, já que a condição de junção pode facilmente ser esquecida.","options":[{"text":"Das Statement ist syntaktisch falsch, da ein JOIN niemals über ein Komma in FROM geschrieben werden darf.","textPt":"A instrução é sintaticamente incorreta, pois um JOIN nunca pode ser escrito através de uma vírgula no FROM.","correct":false},{"text":"Syntaktisch gültig (impliziter JOIN über Komma mit Bedingung in WHERE) und liefert dasselbe wie ein INNER JOIN – gilt aber als schlechter Stil, da die Join-Bedingung leicht vergessen werden kann.","textPt":"Sintaticamente válido (JOIN implícito por vírgula com a condição em WHERE) e devolve o mesmo que um INNER JOIN – mas é considerado má prática, pois a condição de junção pode facilmente ser esquecida.","correct":true},{"text":"Das Statement liefert ein kartesisches Produkt, da die Bedingung in WHERE nicht als Join-Bedingung erkannt wird.","textPt":"A instrução devolve um produto cartesiano, pois a condição no WHERE não é reconhecida como condição de junção.","correct":false},{"text":"Es liefert dasselbe Ergebnis wie ein LEFT JOIN, da Kunden ohne Bestellungen ebenfalls angezeigt werden.","textPt":"Devolve o mesmo resultado que um LEFT JOIN, pois os clientes sem encomendas também são mostrados.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Welches Risiko birgt dieses INSERT-Statement, auch wenn es aktuell funktioniert?","qPt":"Que risco traz esta instrução INSERT, mesmo que funcione atualmente?","a":"Ohne explizite Spaltenliste verlässt sich das Statement auf die physische Spaltenreihenfolge der Tabelle. Ändert sich diese später, landen Werte in den falschen Spalten, ohne dass sofort ein Fehler auftritt.","aPt":"Sem uma lista explícita de colunas, a instrução depende da ordem física das colunas na tabela. Se essa ordem for alterada mais tarde, os valores acabam em colunas erradas, sem que ocorra imediatamente um erro.","options":[{"text":"Das Statement schlägt sofort mit einem Syntaxfehler fehl, da INSERT immer eine Spaltenliste benötigt.","textPt":"A instrução falha imediatamente com um erro de sintaxe, pois INSERT necessita sempre de uma lista de colunas.","correct":false},{"text":"Es besteht das Risiko, dass vorname und stadt vertauscht gespeichert werden, unabhängig von der Spaltenreihenfolge.","textPt":"Existe o risco de vorname e stadt serem guardados trocados, independentemente da ordem das colunas.","correct":false},{"text":"Ohne explizite Spaltenliste verlässt sich das Statement auf die physische Spaltenreihenfolge der Tabelle. Ändert sich diese später, landen Werte in den falschen Spalten, ohne dass sofort ein Fehler auftritt.","textPt":"Sem uma lista explícita de colunas, a instrução depende da ordem física das colunas da tabela. Se esta mudar mais tarde, os valores acabam em colunas erradas, sem que ocorra um erro imediato.","correct":true},{"text":"Ohne Spaltenliste werden automatisch alle NOT NULL-Spalten der Tabelle ignoriert.","textPt":"Sem lista de colunas, todas as colunas NOT NULL da tabela são automaticamente ignoradas.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Unter welcher Bedingung schlägt dieses Statement zur Laufzeit fehl?","qPt":"Em que condição falha esta instrução em tempo de execução?","a":"Liefert die Subquery mehr als eine Zeile (z. B. mehrere Abteilungen mit demselben Namen), schlägt der Vergleich mit = fehl, da = nur einen einzelnen Wert erwartet.","aPt":"Se a subquery devolver mais do que uma linha (p. ex., vários departamentos com o mesmo nome), a comparação com = falha, já que o = espera apenas um único valor.","options":[{"text":"Das Statement schlägt fehl, wenn die Subquery keine Zeile liefert, da = dann NULL nicht verarbeiten kann.","textPt":"A instrução falha se a subquery não devolver nenhuma linha, pois o = não consegue então processar NULL.","correct":false},{"text":"Das Statement funktioniert immer korrekt, da = automatisch wie IN behandelt wird, wenn mehrere Zeilen zurückkommen.","textPt":"A instrução funciona sempre corretamente, pois o = é tratado automaticamente como IN quando são devolvidas várias linhas.","correct":false},{"text":"Das Statement schlägt fehl, wenn abteilung_id in der Tabelle mitarbeiter NULL ist.","textPt":"A instrução falha se abteilung_id na tabela mitarbeiter for NULL.","correct":false},{"text":"Liefert die Subquery mehr als eine Zeile (z. B. mehrere Abteilungen mit demselben Namen), schlägt der Vergleich mit = fehl, da = nur einen einzelnen Wert erwartet.","textPt":"Se a subquery devolver mais do que uma linha (p. ex. vários departamentos com o mesmo nome), a comparação com = falha, pois = espera apenas um único valor.","correct":true}]},
{"cat":"algo","sub":"sql","q":"Warum ist dieses Statement wahrscheinlich nicht das, was beabsichtigt war?","qPt":"Por que motivo esta instrução provavelmente não corresponde ao que se pretendia?","a":"AND bindet stärker als OR, daher wird dies als (kunden_id = 5 AND status = 'offen') OR status = 'storniert' ausgewertet — dadurch werden auch stornierte Bestellungen ANDERER Kunden gelöscht.","aPt":"O AND tem precedência sobre o OR, por isso isto é avaliado como (kunden_id = 5 AND status = 'offen') OR status = 'storniert' — com isto, também são eliminadas encomendas canceladas de OUTROS clientes.","options":[{"text":"AND bindet stärker als OR, daher wird dies als (kunden_id = 5 AND status = 'offen') OR status = 'storniert' ausgewertet – dadurch werden auch stornierte Bestellungen ANDERER Kunden gelöscht.","textPt":"AND tem precedência sobre OR, por isso isto é avaliado como (kunden_id = 5 AND status = 'offen') OR status = 'storniert' – isto faz com que também sejam eliminadas encomendas canceladas de OUTROS clientes.","correct":true},{"text":"OR bindet stärker als AND, daher werden nur Bestellungen des Kunden 5 mit Status 'offen' oder 'storniert' gelöscht.","textPt":"OR tem precedência sobre AND, por isso só são eliminadas encomendas do cliente 5 com estado 'offen' ou 'storniert'.","correct":false},{"text":"Die Bedingung wird von links nach rechts ohne Operatorrangfolge ausgewertet, das Ergebnis ist aber trotzdem korrekt.","textPt":"A condição é avaliada da esquerda para a direita sem precedência de operadores, mas o resultado é ainda assim correto.","correct":false},{"text":"Das Statement löscht gar keine Zeilen, da die Kombination aus AND und OR in SQL einen Syntaxfehler verursacht.","textPt":"A instrução não elimina nenhuma linha, pois a combinação de AND e OR em SQL provoca um erro de sintaxe.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Warum kann dieses Statement bei einer bereits gefüllten Tabelle fehlschlagen?","qPt":"Por que motivo esta instrução pode falhar numa tabela já preenchida com dados?","a":"Eine neue NOT NULL-Spalte ohne Default-Wert kann für bereits existierende Zeilen keinen gültigen Wert erhalten — viele Datenbanksysteme lehnen das ohne DEFAULT ab.","aPt":"Uma nova coluna NOT NULL sem valor por defeito (DEFAULT) não tem como receber um valor válido nas linhas já existentes — muitos sistemas de bases de dados rejeitam isto se não for indicado um DEFAULT.","options":[{"text":"Das Statement schlägt fehl, weil VARCHAR(20) für Telefonnummern grundsätzlich zu kurz ist.","textPt":"A instrução falha porque VARCHAR(20) é, por princípio, demasiado curto para números de telefone.","correct":false},{"text":"Eine neue NOT NULL-Spalte ohne Default-Wert kann für bereits existierende Zeilen keinen gültigen Wert erhalten – viele Datenbanksysteme lehnen das ohne DEFAULT ab.","textPt":"Uma nova coluna NOT NULL sem valor default não pode receber um valor válido para as linhas já existentes – muitos sistemas de bases de dados rejeitam isto sem DEFAULT.","correct":true},{"text":"Das Statement funktioniert problemlos, da neue Spalten immer automatisch mit NULL vorbelegt werden, auch bei NOT NULL.","textPt":"A instrução funciona sem problemas, pois as novas colunas são sempre preenchidas automaticamente com NULL, mesmo com NOT NULL.","correct":false},{"text":"Das Statement schlägt fehl, weil ALTER TABLE keine neuen Spalten mit Constraints hinzufügen darf.","textPt":"A instrução falha porque o ALTER TABLE não pode adicionar novas colunas com restrições.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was ist hier falsch?","qPt":"O que está errado aqui?","a":"Aggregatfunktionen dürfen nicht in WHERE stehen — Filterungen auf aggregierte Werte gehören in die HAVING-Klausel, die nach der Gruppierung ausgewertet wird.","aPt":"Funções de agregação não podem estar na cláusula WHERE — filtros sobre valores agregados pertencem à cláusula HAVING, que é avaliada depois do agrupamento.","options":[{"text":"SUM(betrag) muss in WHERE stehen, da HAVING nur für Spalten ohne Aggregatfunktion erlaubt ist.","textPt":"SUM(betrag) tem de estar no WHERE, pois o HAVING só é permitido para colunas sem função de agregação.","correct":false},{"text":"Das Statement ist korrekt, solange SUM(betrag) auch im SELECT mit AS summe benannt wird.","textPt":"A instrução está correta, desde que SUM(betrag) seja também nomeado no SELECT com AS summe.","correct":false},{"text":"Aggregatfunktionen dürfen nicht in WHERE stehen – Filterungen auf aggregierte Werte gehören in die HAVING-Klausel, die nach der Gruppierung ausgewertet wird.","textPt":"Funções de agregação não podem estar no WHERE – filtragens sobre valores agregados pertencem à cláusula HAVING, avaliada depois do agrupamento.","correct":true},{"text":"GROUP BY muss vor WHERE stehen, nicht danach, damit SUM(betrag) korrekt berechnet wird.","textPt":"O GROUP BY tem de estar antes do WHERE, não depois, para que SUM(betrag) seja calculado corretamente.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was ist an der zweiten JOIN-Bedingung wahrscheinlich ein Fehler?","qPt":"O que é provavelmente um erro na segunda condição de JOIN?","a":"m.id = a.id verknüpft die Mitarbeiter-ID direkt mit der Abteilungs-ID — das sind unterschiedliche Entitäten. Vermutlich sollte über ein Fremdschlüsselfeld verknüpft werden.","aPt":"m.id = a.id liga diretamente o ID do funcionário ao ID do departamento — tratam-se de entidades diferentes. Provavelmente a ligação deveria ser feita através de um campo de chave estrangeira.","options":[{"text":"Die JOIN-Bedingung ist korrekt, da jede Mitarbeiter-ID zufällig auch als Abteilungs-ID existieren kann.","textPt":"A condição JOIN está correta, pois cada ID de funcionário pode, por coincidência, também existir como ID de departamento.","correct":false},{"text":"Der Fehler liegt in der ersten JOIN-Bedingung m.id = g.mitarbeiter_id, diese müsste g.id = m.mitarbeiter_id lauten.","textPt":"O erro está na primeira condição JOIN m.id = g.mitarbeiter_id, que deveria ser g.id = m.mitarbeiter_id.","correct":false},{"text":"Es fehlt lediglich der Tabellenalias a bei abteilung, die Bedingung selbst ist korrekt.","textPt":"Falta apenas o alias de tabela a em abteilung, a condição em si está correta.","correct":false},{"text":"m.id = a.id verknüpft die Mitarbeiter-ID direkt mit der Abteilungs-ID – das sind unterschiedliche Entitäten. Vermutlich sollte über ein Fremdschlüsselfeld verknüpft werden.","textPt":"m.id = a.id associa diretamente o ID do funcionário ao ID do departamento – são entidades diferentes. Provavelmente deveria ligar-se através de um campo de chave estrangeira.","correct":true}]},
{"cat":"algo","sub":"sql","q":"Welcher Syntaxfehler steckt in diesem CREATE TABLE-Statement?","qPt":"Que erro de sintaxe existe nesta instrução CREATE TABLE?","a":"Zwischen den Spaltendefinitionen datum DATE und betrag DECIMAL(10,2) fehlt ein Komma als Trennzeichen.","aPt":"Falta uma vírgula como separador entre as definições de coluna datum DATE e betrag DECIMAL(10,2).","options":[{"text":"Zwischen den Spaltendefinitionen datum DATE und betrag DECIMAL(10,2) fehlt ein Komma als Trennzeichen.","textPt":"Entre as definições de coluna datum DATE e betrag DECIMAL(10,2) falta uma vírgula como separador.","correct":true},{"text":"Die Spalte id darf nicht gleichzeitig INT und PRIMARY KEY sein, das verursacht den Syntaxfehler.","textPt":"A coluna id não pode ser simultaneamente INT e PRIMARY KEY, isso provoca o erro de sintaxe.","correct":false},{"text":"DECIMAL(10,2) ist keine gültige Datentypangabe, es muss DECIMAL(10;2) mit Semikolon lauten.","textPt":"DECIMAL(10,2) não é uma especificação de tipo válida, teria de ser DECIMAL(10;2) com ponto e vírgula.","correct":false},{"text":"Nach der letzten Spalte betrag DECIMAL(10,2) fehlt ein abschließendes Komma vor der Klammer.","textPt":"Após a última coluna betrag DECIMAL(10,2) falta uma vírgula final antes do parêntese.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was ist an diesem Statement syntaktisch falsch?","qPt":"O que está sintaticamente errado nesta instrução?","a":"Nach 500 steht ein überflüssiges Komma vor der schließenden Klammer — das ist ein Syntaxfehler.","aPt":"Depois de 500 existe uma vírgula a mais antes do parêntese de fecho — isso é um erro de sintaxe.","options":[{"text":"Die Subquery in IN (...) darf nur eine einzelne Spalte zurückgeben, hier sind es aber zwei.","textPt":"A subquery dentro de IN (...) só pode devolver uma única coluna, mas aqui são duas.","correct":false},{"text":"Nach 500 steht ein überflüssiges Komma vor der schließenden Klammer – das ist ein Syntaxfehler.","textPt":"Depois de 500 existe uma vírgula desnecessária antes do parêntese de fecho – isso é um erro de sintaxe.","correct":true},{"text":"Es fehlt ein Komma nach der schließenden Klammer der Subquery, nicht davor.","textPt":"Falta uma vírgula depois do parêntese de fecho da subquery, não antes.","correct":false},{"text":"WHERE betrag > 500 ist ungültig, da betrag kein numerischer Spaltentyp sein kann.","textPt":"WHERE betrag > 500 é inválido, pois betrag não pode ser um tipo de coluna numérico.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Warum liefert diese Abfrage vermutlich viel mehr Zeilen als erwartet?","qPt":"Por que motivo esta consulta devolve provavelmente muitas mais linhas do que o esperado?","a":"Es fehlt jede Verknüpfungsbedingung zwischen den beiden Tabellen — das Ergebnis ist ein kartesisches Produkt: jede Zeile aus mitarbeiter wird mit jeder Zeile aus abteilung kombiniert.","aPt":"Falta qualquer condição de ligação entre as duas tabelas — o resultado é um produto cartesiano: cada linha de mitarbeiter é combinada com cada linha de abteilung.","options":[{"text":"Die Abfrage liefert zu wenige Zeilen, da ohne Bedingung nur exakte Übereinstimmungen gezählt werden.","textPt":"A consulta devolve poucas linhas, pois sem condição só são contadas correspondências exatas.","correct":false},{"text":"Das Komma zwischen mitarbeiter und abteilung verursacht einen Syntaxfehler, die Abfrage läuft gar nicht.","textPt":"A vírgula entre mitarbeiter e abteilung provoca um erro de sintaxe, a consulta nem chega a executar.","correct":false},{"text":"Es fehlt jede Verknüpfungsbedingung zwischen den beiden Tabellen – das Ergebnis ist ein kartesisches Produkt: jede Zeile aus mitarbeiter wird mit jeder Zeile aus abteilung kombiniert.","textPt":"Falta qualquer condição de ligação entre as duas tabelas – o resultado é um produto cartesiano: cada linha de mitarbeiter é combinada com cada linha de abteilung.","correct":true},{"text":"Die Abfrage liefert nur Zeilen, bei denen abteilung in mitarbeiter bereits als Spalte vorhanden ist.","textPt":"A consulta só devolve linhas em que abteilung já existe como coluna em mitarbeiter.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Diese beiden Überweisungs-Statements laufen einzeln ohne Fehler — was fehlt trotzdem für den sicheren Praxiseinsatz?","qPt":"Estas duas instruções de transferência executam-se individualmente sem erro — o que falta, ainda assim, para uma utilização segura em produção?","a":"Eine Transaktion um beide Statements herum. Ohne sie könnte z. B. nach dem ersten UPDATE ein Systemabsturz passieren — Geld wird abgebucht, aber nie gutgeschrieben. Das verletzt die Atomicity (A in ACID).","aPt":"Uma transação que envolva as duas instruções. Sem ela, poderia ocorrer, por exemplo, uma falha do sistema logo após o primeiro UPDATE — o dinheiro seria debitado, mas nunca creditado. Isto viola a Atomicity (o A do ACID).","options":[{"text":"Es fehlt eine WHERE-Klausel bei beiden UPDATE-Statements, sonst würden alle Konten betroffen sein.","textPt":"Falta uma cláusula WHERE em ambas as instruções UPDATE, caso contrário todas as contas seriam afetadas.","correct":false},{"text":"Es fehlt ein COMMIT nach jedem einzelnen UPDATE-Statement, sonst werden die Änderungen nie gespeichert.","textPt":"Falta um COMMIT após cada instrução UPDATE individual, caso contrário as alterações nunca são guardadas.","correct":false},{"text":"Es fehlt eine Prüfung, ob konto_id = 1 und konto_id = 2 in derselben Tabelle liegen.","textPt":"Falta uma verificação se konto_id = 1 e konto_id = 2 estão na mesma tabela.","correct":false},{"text":"Eine Transaktion um beide Statements herum. Ohne sie könnte z. B. nach dem ersten UPDATE ein Systemabsturz passieren – Geld wird abgebucht, aber nie gutgeschrieben. Das verletzt die Atomicity (A in ACID).","textPt":"Uma transação a envolver ambas as instruções. Sem ela, poderia, por exemplo, ocorrer uma falha do sistema logo após o primeiro UPDATE – o dinheiro é debitado, mas nunca creditado. Isto viola a Atomicidade (A em ACID).","correct":true}]},
{"cat":"plan","sub":"uml","q":"Was zeigt dieses Diagramm, und was bedeutet die Multiplizität \"0..*\" auf der Seite von Bestellung?","qPt":"O que mostra este diagrama, e o que significa a multiplicidade \"0..*\" do lado de Bestellung?","a":"Es zeigt eine Assoziation zwischen den Klassen Kunde und Bestellung. Die Multiplizität 1 auf der Kunde-Seite und 0..* auf der Bestellung-Seite bedeutet: Ein Kunde kann keine, eine oder mehrere Bestellungen haben, aber jede Bestellung gehört zu genau einem Kunden.","aPt":"Mostra uma associação entre as classes Kunde (cliente) e Bestellung (encomenda). A multiplicidade 1 do lado de Kunde e 0..* do lado de Bestellung significa: um Kunde pode ter nenhuma, uma ou várias Bestellung, mas cada Bestellung pertence exatamente a um Kunde.","options":[{"text":"Es bedeutet, dass eine Bestellung zu mehreren Kunden gleichzeitig gehören kann.","textPt":"Significa que uma Bestellung (encomenda) pode pertencer a vários Kunden (clientes) em simultâneo.","correct":false},{"text":"Es zeigt eine Komposition: Eine Bestellung kann ohne den zugehörigen Kunden nicht existieren und wird mit ihm gelöscht.","textPt":"Mostra uma Komposition (composição): uma Bestellung não pode existir sem o Kunde associado e é eliminada juntamente com ele.","correct":false},{"text":"Es ist eine Assoziation zwischen Kunde und Bestellung; 0..* bei Bestellung bedeutet, ein Kunde kann keine, eine oder mehrere Bestellungen haben, jede Bestellung gehört aber genau einem Kunden.","textPt":"É uma associação entre Kunde (cliente) e Bestellung (encomenda); 0..* do lado de Bestellung significa que um Kunde pode ter nenhuma, uma ou várias Bestellungen, mas cada Bestellung pertence a exatamente um Kunde.","correct":true},{"text":"Es bedeutet, dass jeder Kunde mindestens eine Bestellung haben muss, um im System angelegt zu werden.","textPt":"Significa que cada Kunde tem de ter pelo menos uma Bestellung para poder ser registado no sistema.","correct":false}]},
{"cat":"plan","sub":"uml","q":"Welche der beiden Beziehungen ist die Aggregation und welche die Komposition — und woran erkennt man den Unterschied in der Notation?","qPt":"Qual das duas relações é a agregação e qual é a composição — e como se reconhece a diferença na notação?","a":"Links (offene, nicht gefüllte Raute) steht die Aggregation: Ein Rad kann unabhängig vom Fahrzeug existieren. Rechts (gefüllte Raute) steht die Komposition: Ein Zimmer ist existenzabhängig vom Haus — wird das Haus abgerissen, verschwindet auch das Zimmer als Teil davon.","aPt":"À esquerda (losango aberto, não preenchido) está a agregação: uma Rad (roda) pode existir independentemente do Fahrzeug (veículo). À direita (losango preenchido) está a composição: um Zimmer (quarto) depende existencialmente da Haus (casa) — se a casa for demolida, o quarto desaparece também, como parte dela.","options":[{"text":"Links (offene Raute) ist die Aggregation — ein Rad kann unabhängig vom Fahrzeug existieren; rechts (gefüllte Raute) die Komposition — ein Zimmer ist existenzabhängig vom Haus.","textPt":"À esquerda (losango vazio/aberto) está a Aggregation — agregação (uma Rad/roda pode existir independentemente do Fahrzeug/veículo); à direita (losango preenchido) está a Komposition — composição (um Zimmer/quarto depende existencialmente da Haus/casa).","correct":true},{"text":"Links (gefüllte Raute) ist die Komposition, rechts (offene Raute) die Aggregation.","textPt":"À esquerda (losango preenchido) está a Komposition, à direita (losango vazio) está a Aggregation.","correct":false},{"text":"Beide Rauten-Symbole zeigen eine Generalisierung, der Unterschied liegt nur in der Pfeilrichtung.","textPt":"Ambos os símbolos de losango representam uma Generalisierung (generalização); a diferença está apenas no sentido da seta.","correct":false},{"text":"Beide Beziehungen bedeuten, dass der Teil existenzabhängig vom Ganzen ist; sie unterscheiden sich nur optisch, nicht semantisch.","textPt":"Ambas as relações significam que a parte depende existencialmente do todo; diferem apenas visualmente, não semanticamente.","correct":false}]},
{"cat":"plan","sub":"uml","q":"Was drückt dieser Pfeil mit der offenen, nicht gefüllten Dreiecksspitze zwischen Auto und Fahrzeug aus?","qPt":"O que exprime esta seta com a ponta triangular aberta, não preenchida, entre Auto e Fahrzeug?","a":"Er zeigt eine Generalisierung/Vererbung: Auto ist eine Spezialisierung von Fahrzeug (\"Auto ist ein Fahrzeug\"). Der Pfeil zeigt dabei immer von der Unterklasse zur Oberklasse.","aPt":"Mostra uma generalização/herança: Auto (carro) é uma especialização de Fahrzeug (veículo) (\"um Auto é um Fahrzeug\"). A seta aponta sempre da subclasse para a superclasse.","options":[{"text":"Er zeigt eine Generalisierung/Vererbung: Auto ist eine Spezialisierung von Fahrzeug; der Pfeil zeigt von der Unterklasse zur Oberklasse.","textPt":"Mostra uma Generalisierung/herança: Auto (carro) é uma especialização de Fahrzeug (veículo); a seta aponta sempre da subclasse para a superclasse.","correct":true},{"text":"Er zeigt eine Vererbung, bei der der Pfeil von der Oberklasse Fahrzeug zur Unterklasse Auto zeigt.","textPt":"Mostra uma herança em que a seta aponta da superclasse Fahrzeug para a subclasse Auto.","correct":false},{"text":"Er zeigt, dass Auto eine Schnittstelle namens Fahrzeug implementiert, ohne deren Attribute zu erben.","textPt":"Mostra que Auto implementa uma interface chamada Fahrzeug, sem herdar os seus atributos.","correct":false},{"text":"Er zeigt eine Aggregation: Ein Auto besteht aus mehreren Fahrzeug-Teilen, die unabhängig existieren können.","textPt":"Mostra uma agregação: um Auto é composto por várias partes Fahrzeug que podem existir independentemente.","correct":false}]},
{"cat":"plan","sub":"uml","q":"Was bedeutet die gestrichelte Verbindung mit der Beschriftung «include» zwischen den beiden Anwendungsfällen?","qPt":"O que significa a ligação tracejada com a indicação «include» entre os dois casos de utilização?","a":"Der Anwendungsfall \"Bestellung aufgeben\" schließt \"Zahlung prüfen\" zwingend mit ein — jedes Mal, wenn \"Bestellung aufgeben\" ausgeführt wird, läuft automatisch auch \"Zahlung prüfen\" mit. Die Pfeilspitze zeigt dabei vom Basis-Anwendungsfall zum eingeschlossenen Anwendungsfall. Das unterscheidet «include» von «extend», wo die Einbindung nur optional erfolgt.","aPt":"O caso de utilização \"Bestellung aufgeben\" (fazer encomenda) inclui obrigatoriamente \"Zahlung prüfen\" (verificar pagamento) — sempre que \"Bestellung aufgeben\" é executado, \"Zahlung prüfen\" é automaticamente executado também. A ponta da seta aponta do caso de utilização base para o caso de utilização incluído. Isto distingue «include» de «extend», em que a inclusão é apenas opcional.","options":[{"text":"Die Pfeilspitze zeigt von \"Zahlung prüfen\" zu \"Bestellung aufgeben\", und die Einbindung erfolgt nur optional.","textPt":"A ponta da seta aponta de \"Zahlung prüfen\" para \"Bestellung aufgeben\", e a inclusão é apenas opcional.","correct":false},{"text":"«include» bedeutet, dass \"Zahlung prüfen\" nur unter bestimmten Bedingungen zusätzlich ausgeführt wird, ähnlich wie bei «extend».","textPt":"«include» significa que \"Zahlung prüfen\" só é executado adicionalmente em determinadas condições, à semelhança de «extend».","correct":false},{"text":"Es zeigt, dass \"Bestellung aufgeben\" eine Spezialisierung von \"Zahlung prüfen\" ist.","textPt":"Mostra que \"Bestellung aufgeben\" é uma especialização de \"Zahlung prüfen\".","correct":false},{"text":"\"Bestellung aufgeben\" schließt \"Zahlung prüfen\" zwingend mit ein — der Pfeil zeigt vom Basis- zum eingeschlossenen Anwendungsfall; bei «extend» wäre die Einbindung nur optional.","textPt":"\"Bestellung aufgeben\" (fazer encomenda) inclui obrigatoriamente \"Zahlung prüfen\" (verificar pagamento) — a seta aponta do caso de uso base para o caso incluído; no «extend» a inclusão seria apenas opcional.","correct":true}]},
{"cat":"plan","sub":"uml","q":"Was ist der Unterschied zwischen dem durchgezogenen und dem gestrichelten Pfeil in diesem Sequenzdiagramm?","qPt":"Qual é a diferença entre a seta contínua e a seta tracejada neste diagrama de sequência?","a":"Der durchgezogene Pfeil (bestellen()) ist ein synchroner Nachrichtenaufruf vom Kunden an den Webshop. Der gestrichelte Pfeil (Bestätigung) ist die zugehörige Rückantwort (Return-Nachricht) vom Webshop zurück an den Kunden.","aPt":"A seta contínua (bestellen()) é uma chamada de mensagem síncrona do Kunde (cliente) para o Webshop. A seta tracejada (Bestätigung — confirmação) é a resposta correspondente (mensagem de retorno) do Webshop de volta para o Kunde.","options":[{"text":"Der durchgezogene Pfeil (bestellen()) ist ein synchroner Nachrichtenaufruf vom Kunden an den Webshop, der gestrichelte (Bestätigung) ist die Rückantwort vom Webshop zum Kunden.","textPt":"A seta contínua (bestellen()/encomendar) é uma chamada de mensagem síncrona do Kunde (cliente) para o Webshop; a seta tracejada (Bestätigung/confirmação) é a resposta de retorno do Webshop para o Kunde.","correct":true},{"text":"Der durchgezogene Pfeil ist die Rückantwort des Webshops, der gestrichelte Pfeil ist der ursprüngliche Aufruf des Kunden.","textPt":"A seta contínua é a resposta de retorno do Webshop, a seta tracejada é a chamada original do Kunde.","correct":false},{"text":"Der durchgezogene Pfeil zeigt eine asynchrone Nachricht, der gestrichelte eine synchrone Antwort.","textPt":"A seta contínua representa uma mensagem assíncrona, a tracejada uma resposta síncrona.","correct":false},{"text":"Beide Pfeile stellen eigenständige Methodenaufrufe dar, es gibt keine Rückantwort in diesem Diagramm.","textPt":"Ambas as setas representam chamadas de método independentes; não existe resposta de retorno neste diagrama.","correct":false}]},
{"cat":"plan","sub":"uml","q":"Wie liest man die Kardinalitäten 1 und n in diesem ER-Diagramm zwischen Autor und Buch?","qPt":"Como se interpretam as cardinalidades 1 e n neste diagrama ER entre Autor e Buch?","a":"Ein Autor (1) kann n Bücher schreiben, aber jedes Buch wird in diesem Modell genau einem Autor zugeordnet — es handelt sich um eine 1:n-Beziehung zwischen Autor und Buch.","aPt":"Um Autor (autor) (1) pode escrever n Buch (livros), mas cada Buch é associado, neste modelo, a exatamente um Autor — trata-se de uma relação 1:n entre Autor e Buch.","options":[{"text":"Ein Buch (1) kann von n Autoren geschrieben werden, jeder Autor schreibt aber nur genau ein Buch.","textPt":"Um Buch (1) pode ser escrito por n Autor (autores), mas cada Autor escreve apenas exatamente um Buch.","correct":false},{"text":"Ein Autor (1) kann n Bücher schreiben, aber jedes Buch wird in diesem Modell genau einem Autor zugeordnet — eine 1:n-Beziehung.","textPt":"Um Autor (1) pode escrever n Buch (livros), mas cada Buch é atribuído a exatamente um Autor neste modelo — uma relação 1:n.","correct":true},{"text":"Ein Autor kann mehrere Bücher schreiben und ein Buch kann von mehreren Autoren gemeinsam verfasst werden.","textPt":"Um Autor pode escrever vários Buch, e um Buch pode ser escrito em conjunto por vários Autor.","correct":false},{"text":"Jeder Autor schreibt in diesem Modell genau ein Buch, und jedes Buch hat genau einen Autor.","textPt":"Neste modelo, cada Autor escreve exatamente um Buch, e cada Buch tem exatamente um Autor.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Was gibt dieses Programm aus, und warum (Stichwort: Polymorphismus)?","qPt":"O que é que este programa imprime, e porquê (palavra-chave: polimorfismo)?","a":"Es gibt \"Wuff!\" aus. Obwohl die Variable t vom Typ Tier deklariert ist, zeigt sie zur Laufzeit auf ein Hund-Objekt. Bei überschriebenen Methoden entscheidet der tatsächliche (dynamische) Typ des Objekts, welche Methode ausgeführt wird — nicht der deklarierte Typ der Variablen.","aPt":"Imprime \"Wuff!\". Embora a variável t esteja declarada do tipo Tier (animal), em tempo de execução ela referencia um objeto Hund (cão). Em métodos sobrescritos (overriding), é o tipo real (dinâmico) do objeto que determina qual o método executado — não o tipo declarado da variável.","options":[{"text":"\"Wuff!\" wird ausgegeben, denn bei überschriebenen Methoden entscheidet der tatsächliche (dynamische) Typ des Objekts (Hund), nicht der deklarierte Typ der Variable.","textPt":"É impresso \"Wuff!\", porque em métodos sobrepostos (overriding) é o tipo real (dinâmico) do objeto (Hund) que decide, não o tipo declarado da variável.","correct":true},{"text":"\"Ein Tier macht ein Geräusch\" wird ausgegeben, da der deklarierte Typ der Variable t (Tier) bestimmt, welche Methode ausgeführt wird.","textPt":"É impresso \"Ein Tier macht ein Geräusch\", pois o tipo declarado da variável t (Tier) determina qual método é executado.","correct":false},{"text":"Der Code kompiliert nicht, da die Klasse Hund die Methode sprich() nicht mit der exakt gleichen Signatur überschreiben darf.","textPt":"O código não compila, porque a classe Hund não pode sobrepor o método sprich() com exatamente a mesma assinatura.","correct":false},{"text":"Es werden beide Ausgaben \"Ein Tier macht ein Geräusch\" und \"Wuff!\" ausgegeben, da zuerst die Methode der Oberklasse und dann die der Unterklasse aufgerufen wird.","textPt":"São impressas as duas saídas \"Ein Tier macht ein Geräusch\" e \"Wuff!\", pois primeiro é chamado o método da superclasse e depois o da subclasse.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Wozu wird hier das Schlüsselwort this benötigt?","qPt":"Para que é necessária aqui a palavra-chave this?","a":"Der Konstruktor-Parameter heißt genauso wie das Attribut (saldo). this.saldo verweist explizit auf das Objektattribut, saldo (ohne this) auf den lokalen Parameter — ohne this würde sich das Attribut selbst zugewiesen und der übergebene Wert ginge verloren.","aPt":"O parâmetro do construtor tem o mesmo nome do atributo (saldo). this.saldo refere-se explicitamente ao atributo do objeto, enquanto saldo (sem this) se refere ao parâmetro local — sem this, o atributo seria atribuído a si mesmo e o valor recebido seria perdido.","options":[{"text":"this ist hier überflüssig, da Java Parameter und Attribute automatisch anhand des Datentyps unterscheidet.","textPt":"this é desnecessário aqui, pois o Java distingue automaticamente parâmetros e atributos pelo tipo de dado.","correct":false},{"text":"this.saldo verweist explizit auf das Objektattribut, da der Konstruktor-Parameter denselben Namen (saldo) trägt wie das Attribut — ohne this würde sich der Parameter selbst zuweisen.","textPt":"this.saldo refere-se explicitamente ao atributo do objeto, já que o parâmetro do construtor tem o mesmo nome (saldo) do atributo — sem this, o parâmetro atribuir-se-ia a si mesmo.","correct":true},{"text":"this wird benötigt, um den Konstruktor der Oberklasse aufzurufen und so das Attribut saldo korrekt zu initialisieren.","textPt":"this é necessário para chamar o construtor da superclasse e assim inicializar corretamente o atributo saldo.","correct":false},{"text":"this.saldo erzeugt ein neues, zusätzliches Attribut saldo, das unabhängig vom Konstruktor-Parameter existiert.","textPt":"this.saldo cria um novo atributo adicional saldo, independente do parâmetro do construtor.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Ist das Überladen oder Überschreiben — und woran erkennt man das?","qPt":"Isto é sobrecarga (overloading) ou sobrescrita (overriding) — e como se reconhece?","a":"Das ist Überladen (Overloading): Zwei Methoden mit demselben Namen (addiere) in derselben Klasse, aber mit unterschiedlicher Parameterliste (int vs. double). Überschreiben würde eine geerbte Methode in einer Unterklasse mit identischer Signatur betreffen.","aPt":"Isto é sobrecarga (overloading): dois métodos com o mesmo nome (addiere) na mesma classe, mas com listas de parâmetros diferentes (int vs. double). A sobrescrita (overriding) envolveria um método herdado, numa subclasse, com assinatura idêntica.","options":[{"text":"Überschreiben, da addiere in der Unterklasse die gleichnamige Methode der Oberklasse ersetzt.","textPt":"Overriding, pois addiere na subclasse substitui o método homónimo da superclasse.","correct":false},{"text":"Überladen, weil beide Methoden exakt dieselbe Parameterliste (int, int) verwenden.","textPt":"Overloading, porque ambos os métodos usam exatamente a mesma lista de parâmetros (int, int).","correct":false},{"text":"Überladen (Overloading): zwei Methoden mit demselben Namen in derselben Klasse, aber mit unterschiedlicher Parameterliste (int vs. double).","textPt":"Overloading (sobrecarga): dois métodos com o mesmo nome na mesma classe, mas com listas de parâmetros diferentes (int vs. double).","correct":true},{"text":"Weder Überladen noch Überschreiben, da Java zwei Methoden mit demselben Namen in einer Klasse grundsätzlich nicht erlaubt.","textPt":"Nem overloading nem overriding, pois o Java não permite, em geral, dois métodos com o mesmo nome numa classe.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Was ist aus Sicht der Kapselung an dieser Klasse problematisch?","qPt":"Do ponto de vista do encapsulamento, o que há de problemático nesta classe?","a":"Die Attribute sind nicht als private deklariert und damit von außen direkt les- und veränderbar (z. B. mitarbeiter.gehalt = -500;), ohne jede Kontrolle. Korrekt wäre: private Attribute mit öffentlichen Getter-/Setter-Methoden, die z. B. ungültige Werte abfangen können.","aPt":"Os atributos não estão declarados como private, por isso podem ser lidos e alterados diretamente a partir do exterior (por exemplo, mitarbeiter.gehalt = -500;), sem qualquer controlo. O correto seria ter atributos private com métodos getter/setter públicos, que podem, por exemplo, rejeitar valores inválidos.","options":[{"text":"Die Klasse hat keinen Konstruktor, wodurch Kapselung grundsätzlich unmöglich ist.","textPt":"A classe não tem construtor, o que torna o encapsulamento fundamentalmente impossível.","correct":false},{"text":"Die Attribute sind final, wodurch sie nie initialisiert werden können.","textPt":"Os atributos são final, por isso nunca podem ser inicializados.","correct":false},{"text":"Die Klasse erlaubt keine Vererbung, was gegen das Kapselungsprinzip verstößt.","textPt":"A classe não permite herança, o que viola o princípio do encapsulamento.","correct":false},{"text":"Die Attribute sind nicht private, sondern von außen direkt les- und schreibbar, ohne jede Kontrolle (z. B. ungültige Gehaltswerte).","textPt":"Os atributos não são private, logo podem ser lidos e alterados diretamente de fora, sem qualquer controlo (ex.: valores de salário inválidos).","correct":true}]},
{"cat":"algo","sub":"oop","q":"Warum lässt sich dieser Code nicht kompilieren?","qPt":"Por que razão este código não compila?","a":"Eine abstrakte Klasse kann nicht direkt mit new instanziiert werden — sie dient nur als Vorlage für konkrete Unterklassen, die alle abstrakten Methoden implementieren. new Form() muss durch eine konkrete Unterklasse ersetzt werden, z. B. new Kreis().","aPt":"Uma classe abstrata não pode ser instanciada diretamente com new — serve apenas como modelo para subclasses concretas, que têm de implementar todos os métodos abstratos. new Form() tem de ser substituído por uma subclasse concreta, por exemplo new Kreis().","options":[{"text":"Eine abstrakte Klasse kann nicht direkt mit new instanziiert werden — new Form() müsste durch eine konkrete Unterklasse ersetzt werden.","textPt":"Uma classe abstrata não pode ser instanciada diretamente com new — new Form() teria de ser substituído por uma subclasse concreta.","correct":true},{"text":"Die Methode flaeche() ist nicht als abstract markiert, obwohl Form eine abstrakte Klasse ist.","textPt":"O método flaeche() não está marcado como abstract, apesar de Form ser uma classe abstrata.","correct":false},{"text":"Form implementiert kein Interface, weshalb new Form() nicht erlaubt ist.","textPt":"Form não implementa nenhuma interface, por isso new Form() não é permitido.","correct":false},{"text":"Form fehlt ein expliziter Konstruktor, wodurch new Form() fehlschlägt.","textPt":"Falta a Form um construtor explícito, o que faz new Form() falhar.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Warum kompiliert diese Klasse nicht?","qPt":"Por que razão esta classe não compila?","a":"Rechnung implementiert das Interface Bezahlbar, setzt aber nicht alle seine Methoden um — storniere() fehlt. Eine Klasse, die ein Interface implementiert, muss zwingend ALLE darin deklarierten Methoden konkret implementieren (sofern sie nicht selbst abstrakt ist).","aPt":"Rechnung implementa a interface Bezahlbar, mas não implementa todos os seus métodos — falta storniere(). Uma classe que implementa uma interface tem obrigatoriamente de implementar de forma concreta TODOS os métodos nela declarados (a menos que ela própria seja abstrata).","options":[{"text":"Rechnung deklariert die Methode storniere(), implementiert sie aber mit falschem Rückgabetyp.","textPt":"Rechnung declara o método storniere(), mas implementa-o com um tipo de retorno errado.","correct":false},{"text":"Rechnung implementiert das Interface Bezahlbar, setzt aber nicht alle seine Methoden um — storniere() fehlt.","textPt":"Rechnung implementa a interface Bezahlbar, mas não implementa todos os seus métodos — falta storniere().","correct":true},{"text":"Interfaces dürfen in Java nur eine einzige Methode deklarieren, Bezahlbar deklariert aber zwei.","textPt":"As interfaces em Java só podem declarar um único método, mas Bezahlbar declara dois.","correct":false},{"text":"Die Methode bezahle() hat eine falsche Signatur im Vergleich zum Interface.","textPt":"O método bezahle() tem uma assinatura errada em comparação com a interface.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Was wird hier ausgegeben, und warum?","qPt":"O que é apresentado aqui, e porquê?","a":"3. Da anzahl als static deklariert ist, existiert sie nur einmal für die gesamte Klasse (nicht pro Objekt) und wird bei jedem Aufruf des Konstruktors (also bei jeder Objekterzeugung) um 1 erhöht — alle drei erzeugten Objekte teilen sich dieselbe Variable.","aPt":"3. Como anzahl está declarada como static, existe apenas uma vez para toda a classe (e não por objeto) e é incrementada em 1 sempre que o construtor é chamado (ou seja, sempre que se cria um objeto) — os três objetos criados partilham a mesma variável.","options":[{"text":"0, da anzahl bei jedem der drei new-Aufrufe wieder auf den Ausgangswert zurückgesetzt wird.","textPt":"0, pois anzahl é reposta ao valor inicial em cada uma das três chamadas a new.","correct":false},{"text":"1, da static bedeutet, dass anzahl nur beim allerersten Objekt erhöht wird.","textPt":"1, pois static significa que anzahl só é incrementada no primeiro objeto criado.","correct":false},{"text":"3. anzahl ist static und existiert nur einmal für die gesamte Klasse; sie wird bei jedem Konstruktoraufruf um 1 erhöht.","textPt":"3. anzahl é static e existe apenas uma vez para toda a classe; é incrementada em 1 a cada chamada do construtor.","correct":true},{"text":"Ein Kompilierfehler, da auf eine static-Variable nicht über Zaehler.anzahl zugegriffen werden darf.","textPt":"Um erro de compilação, pois não é permitido aceder a uma variável static através de Zaehler.anzahl.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Was gibt new Auto(\"VW\") aus, und was bewirkt super(marke) hier?","qPt":"O que é apresentado por new Auto(\"VW\"), e o que faz super(marke) aqui?","a":"Ausgabe: \"Fahrzeug: VW\" gefolgt von \"Auto erstellt\". super(marke) ruft explizit den Konstruktor der Oberklasse Fahrzeug auf, bevor der Rest des Auto-Konstruktors ausgeführt wird — so wird sichergestellt, dass die Oberklasse korrekt initialisiert wird.","aPt":"Resultado: \"Fahrzeug: VW\" seguido de \"Auto erstellt\". super(marke) chama explicitamente o construtor da superclasse Fahrzeug antes de ser executado o resto do construtor de Auto — isto garante que a superclasse é corretamente inicializada.","options":[{"text":"Ausgabe: \"Auto erstellt\" gefolgt von \"Fahrzeug: VW\", da super(marke) erst nach dem restlichen Konstruktorcode ausgeführt wird.","textPt":"Saída: \"Auto erstellt\" seguido de \"Fahrzeug: VW\", pois super(marke) só é executado depois do resto do código do construtor.","correct":false},{"text":"super(marke) erzeugt ein zusätzliches, unabhängiges Fahrzeug-Objekt neben dem Auto-Objekt.","textPt":"super(marke) cria um objeto Fahrzeug adicional e independente, além do objeto Auto.","correct":false},{"text":"super(marke) ist hier überflüssig, da Konstruktoren von Oberklassen in Java automatisch ohne Aufruf ausgeführt werden.","textPt":"super(marke) é desnecessário aqui, pois os construtores das superclasses em Java são executados automaticamente sem chamada.","correct":false},{"text":"Ausgabe: \"Fahrzeug: VW\" gefolgt von \"Auto erstellt\" — super(marke) ruft explizit den Konstruktor der Oberklasse auf, bevor der Rest des Auto-Konstruktors läuft.","textPt":"Saída: \"Fahrzeug: VW\" seguido de \"Auto erstellt\" — super(marke) chama explicitamente o construtor da superclasse antes de executar o resto do construtor de Auto.","correct":true}]},
{"cat":"algo","sub":"oop","q":"Überschreibt zeige(String x) in Abgeleitet die Methode zeige(int x) aus Basis?","qPt":"O método zeige(String x) em Abgeleitet substitui (faz override de) o método zeige(int x) de Basis?","a":"Nein. Da sich die Parametertypen unterscheiden (int vs. String), handelt es sich nicht um Overriding, sondern um eine zusätzliche überladene Methode. Beide Methoden existieren in Abgeleitet unabhängig nebeneinander.","aPt":"Não. Como os tipos dos parâmetros são diferentes (int vs. String), não se trata de overriding, mas sim de uma sobrecarga (overload) adicional do método. Os dois métodos existem em Abgeleitet de forma independente, um ao lado do outro.","options":[{"text":"Nein, da sich die Parametertypen unterscheiden (int vs. String) — es handelt sich um eine zusätzliche überladene Methode, nicht um Overriding.","textPt":"Não, pois os tipos de parâmetro são diferentes (int vs. String) — trata-se de um método sobrecarregado adicional, não de overriding.","correct":true},{"text":"Ja, da beide Methoden zeige heißen und Abgeleitet von Basis erbt, überschreibt Abgeleitet automatisch die Methode.","textPt":"Sim, pois ambos os métodos se chamam zeige e, como Abgeleitet herda de Basis, sobrepõe automaticamente o método.","correct":false},{"text":"Der Code kompiliert nicht, da in einer Unterklasse keine Methode mit demselben Namen wie in der Oberklasse definiert werden darf.","textPt":"O código não compila, pois numa subclasse não é permitido definir um método com o mesmo nome que na superclasse.","correct":false},{"text":"Ja, Java wählt zur Laufzeit automatisch die passendere der beiden Methoden basierend auf dem tatsächlichen Variablentyp aus und überschreibt dabei die Basis-Methode.","textPt":"Sim, o Java escolhe automaticamente em tempo de execução o método mais adequado entre os dois, com base no tipo real da variável, sobrepondo o método de Basis.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Warum verursacht dieser Code einen Kompilierfehler?","qPt":"Por que razão este código provoca um erro de compilação?","a":"saldo ist private und damit nur innerhalb der Klasse Konto selbst zugänglich — von außen (hier in der Klasse Test) kann nicht direkt auf k.saldo zugegriffen werden. Es wird ein öffentlicher Getter wie getSaldo() benötigt.","aPt":"saldo é private e, por isso, só é acessível dentro da própria classe Konto — a partir do exterior (aqui, na classe Test) não se pode aceder diretamente a k.saldo. É necessário um getter público, como getSaldo().","options":[{"text":"k.saldo erzeugt eine NullPointerException, da saldo im Konstruktor nicht initialisiert wurde.","textPt":"k.saldo gera uma NullPointerException, pois saldo não foi inicializado no construtor.","correct":false},{"text":"saldo ist private und damit nur innerhalb der Klasse Konto zugänglich — von außen fehlt ein öffentlicher Getter wie getSaldo().","textPt":"saldo é private e só pode ser acedido dentro da própria classe Konto — faltando de fora um getter público como getSaldo().","correct":true},{"text":"Der Fehler entsteht, weil Konto keinen öffentlichen Konstruktor besitzt.","textPt":"O erro ocorre porque Konto não tem um construtor público.","correct":false},{"text":"k.saldo funktioniert grundsätzlich, der Fehler liegt an der fehlenden Typumwandlung in System.out.println().","textPt":"k.saldo funciona em princípio; o erro deve-se à falta de conversão de tipo em System.out.println().","correct":false}]},
{"cat":"algo","sub":"oop","q":"Was wird hier ungefähr ausgegeben, und wie könnte man eine lesbarere Ausgabe erreichen?","qPt":"O que é, aproximadamente, apresentado aqui, e como se poderia obter uma saída mais legível?","a":"Ohne eigene Implementierung gibt System.out.println(p) etwas wie Punkt@1b6d3586 aus (Klassenname + Hashcode) — die geerbte Standard-toString()-Methode von Object. Für eine lesbare Ausgabe (z. B. \"Punkt(3, 4)\") müsste die Klasse Punkt die Methode toString() überschreiben.","aPt":"Sem uma implementação própria, System.out.println(p) apresenta algo como Punkt@1b6d3586 (nome da classe + hashcode) — o método toString() padrão herdado de Object. Para obter uma saída legível (por exemplo, \"Punkt(3, 4)\"), a classe Punkt teria de fazer override ao método toString().","options":[{"text":"Es wird automatisch \"Punkt(3, 4)\" ausgegeben, da Java für einfache Klassen automatisch eine lesbare toString()-Methode generiert.","textPt":"É impresso automaticamente \"Punkt(3, 4)\", pois o Java gera automaticamente um método toString() legível para classes simples.","correct":false},{"text":"Es wird ein Kompilierfehler ausgelöst, da Punkt keine toString()-Methode besitzt.","textPt":"É gerado um erro de compilação, pois Punkt não tem método toString().","correct":false},{"text":"Es wird etwas wie \"Punkt@1b6d3586\" ausgegeben (Klassenname + Hashcode); für eine lesbare Ausgabe müsste toString() überschrieben werden.","textPt":"É impresso algo como \"Punkt@1b6d3586\" (nome da classe + hashcode); para uma saída legível seria necessário sobrepor toString().","correct":true},{"text":"Es werden die Werte x und y als \"3, 4\" ausgegeben, da println() bei Objekten automatisch alle Attribute auflistet.","textPt":"São impressos os valores x e y como \"3, 4\", pois println() lista automaticamente todos os atributos de um objeto.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Gibt dieser Code true oder false aus, obwohl p1 und p2 dieselben Koordinaten haben?","qPt":"Este código apresenta true ou false, apesar de p1 e p2 terem as mesmas coordenadas?","a":"false. Ohne überschriebene equals()-Methode vergleicht die geerbte Standardimplementierung aus Object nur die Objektreferenzen (Identität) — p1 und p2 sind zwei unterschiedliche Objekte im Speicher, auch wenn ihre Attributwerte gleich sind.","aPt":"false. Sem um método equals() com override, a implementação padrão herdada de Object compara apenas as referências dos objetos (a identidade) — p1 e p2 são dois objetos diferentes na memória, mesmo que os valores dos seus atributos sejam iguais.","options":[{"text":"true, da Java bei Objekten mit identischen Attributwerten automatisch eine inhaltliche Gleichheit erkennt.","textPt":"true, pois o Java reconhece automaticamente igualdade de conteúdo quando os valores dos atributos são idênticos.","correct":false},{"text":"true, da equals() bei allen Klassen standardmäßig die Attributwerte vergleicht.","textPt":"true, pois equals() compara, por padrão, os valores dos atributos em todas as classes.","correct":false},{"text":"Ein Kompilierfehler, da equals() ohne eigene Implementierung nicht aufgerufen werden kann.","textPt":"Um erro de compilação, pois equals() não pode ser chamado sem implementação própria.","correct":false},{"text":"false. Ohne überschriebene equals()-Methode vergleicht die geerbte Standardimplementierung nur die Objektreferenzen (Identität), nicht den Inhalt.","textPt":"false. Sem um método equals() sobreposto, a implementação padrão herdada compara apenas as referências dos objetos (identidade), não o conteúdo.","correct":true}]},
{"cat":"algo","sub":"rekursion","q":"Was gibt fakultaet(4) zurück? Gehe die Rekursion Schritt für Schritt durch.","qPt":"O que devolve fakultaet(4)? Percorre a recursão passo a passo.","a":"24. fakultaet(4) = 4 * fakultaet(3) = 4 * 3 * fakultaet(2) = 4 * 3 * 2 * fakultaet(1) = 4 * 3 * 2 * 1 = 24 — der Basisfall n <= 1 liefert 1 und beendet die Rekursion.","aPt":"24. fakultaet(4) = 4 * fakultaet(3) = 4 * 3 * fakultaet(2) = 4 * 3 * 2 * fakultaet(1) = 4 * 3 * 2 * 1 = 24 — o caso base n <= 1 devolve 1 e termina a recursão.","options":[{"text":"6, da fakultaet(4) fälschlich als 4*3*2 ohne den letzten Faktor 1 berechnet wird.","textPt":"6, pois fakultaet(4) é calculado incorretamente como 4*3*2, sem o último fator 1.","correct":false},{"text":"24. fakultaet(4) = 4·3·2·1 = 24, wobei der Basisfall n <= 1 die Rekursion mit dem Rückgabewert 1 beendet.","textPt":"24. fakultaet(4) = 4·3·2·1 = 24, sendo que o caso base n <= 1 termina a recursão devolvendo 1.","correct":true},{"text":"4, da die Funktion bei n <= 1 sofort n statt 1 zurückgibt und die Multiplikationen sich gegenseitig aufheben.","textPt":"4, pois a função devolveria imediatamente n em vez de 1 quando n <= 1, e as multiplicações cancelar-se-iam.","correct":false},{"text":"Ein Stack-Overflow-Fehler, da keine Abbruchbedingung definiert ist.","textPt":"Um erro de stack overflow, pois não está definida nenhuma condição de paragem.","correct":false}]},
{"cat":"algo","sub":"ds","q":"Welcher Laufzeitfehler tritt hier auf, und warum?","qPt":"Que erro de execução ocorre aqui, e porquê?","a":"ArrayIndexOutOfBoundsException. Das Array hat 3 Elemente mit den gültigen Indizes 0, 1, 2 (zahlen.length ist 3). Durch i <= zahlen.length wird beim letzten Durchlauf i = 3 erreicht, also ein Index außerhalb des gültigen Bereichs — richtig wäre i < zahlen.length.","aPt":"ArrayIndexOutOfBoundsException. O array tem 3 elementos, com os índices válidos 0, 1 e 2 (zahlen.length é 3). Com i <= zahlen.length, na última iteração atinge-se i = 3, ou seja, um índice fora do intervalo válido — o correto seria i < zahlen.length.","options":[{"text":"NullPointerException, da zahlen beim letzten Durchlauf nicht mehr initialisiert ist.","textPt":"NullPointerException, pois zahlen deixa de estar inicializado na última iteração.","correct":false},{"text":"Kein Fehler, da Java bei Arrays automatisch über die Grenze hinaus mit dem Wert 0 weiterrechnet.","textPt":"Nenhum erro, pois o Java continua automaticamente com o valor 0 ao exceder o limite do array.","correct":false},{"text":"ArrayIndexOutOfBoundsException, da i <= zahlen.length beim letzten Durchlauf i=3 erreicht — ein Index außerhalb des gültigen Bereichs (0–2).","textPt":"ArrayIndexOutOfBoundsException, pois i <= zahlen.length faz com que, na última iteração, i=3 — um índice fora do intervalo válido (0–2).","correct":true},{"text":"Ein Kompilierfehler, da <= in einer for-Schleifenbedingung bei Arrays grundsätzlich nicht erlaubt ist.","textPt":"Um erro de compilação, pois <= não é permitido, de forma geral, na condição de um ciclo for com arrays.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Gibt dieser Code true oder false aus — und warum ist das für Anfänger oft überraschend?","qPt":"Este código apresenta true ou false — e por que razão isto costuma surpreender os principiantes?","a":"false. == vergleicht bei Objekten (wie String) die Referenzen, nicht den Inhalt. a und b sind hier zwei unterschiedliche String-Objekte mit demselben Inhalt. Für einen inhaltlichen Vergleich muss a.equals(b) verwendet werden, was hier true ergäbe.","aPt":"false. No caso de objetos (como String), o == compara as referências, não o conteúdo. Aqui, a e b são dois objetos String diferentes com o mesmo conteúdo. Para comparar o conteúdo, é preciso usar a.equals(b), o que neste caso daria true.","options":[{"text":"true, da == bei Strings in Java immer den Inhalt vergleicht, unabhängig davon, wie sie erzeugt wurden.","textPt":"true, pois == em strings no Java compara sempre o conteúdo, independentemente de como foram criadas.","correct":false},{"text":"false, da == bei Objekten wie String die Referenzen vergleicht und a, b zwei unterschiedliche Objekte mit gleichem Inhalt sind.","textPt":"false, pois == em objetos como String compara as referências, e a e b são dois objetos diferentes com o mesmo conteúdo.","correct":true},{"text":"Ein Kompilierfehler, da == für Strings in Java nicht verwendet werden darf.","textPt":"Um erro de compilação, pois == não pode ser usado com strings em Java.","correct":false},{"text":"true, da new String(\"Hallo\") beide Male auf denselben String im String-Pool verweist.","textPt":"true, pois new String(\"Hallo\") aponta, em ambos os casos, para a mesma string na String Pool.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Warum funktioniert der Zugriff auf wert in Abgeleitet, obwohl es nicht public ist?","qPt":"Por que razão o acesso a wert funciona em Abgeleitet, embora não seja public?","a":"protected erlaubt den Zugriff innerhalb derselben Klasse, desselben Pakets UND durch Unterklassen (auch in anderen Paketen). Da Abgeleitet von Basis erbt, darf sie auf das protected-Attribut wert zugreifen.","aPt":"protected permite o acesso dentro da mesma classe, do mesmo pacote E através de subclasses (mesmo que estejam noutros pacotes). Como Abgeleitet é subclasse de Basis (herda de Basis), pode aceder ao atributo protected wert.","options":[{"text":"Der Zugriff funktioniert, weil wert zusätzlich implizit als public gilt, sobald eine Unterklasse existiert.","textPt":"O acesso funciona porque wert passa a ser implicitamente public assim que existe uma subclasse.","correct":false},{"text":"Der Zugriff funktioniert nur, weil sich Basis und Abgeleitet im selben Paket befinden — protected würde sonst nichts bewirken.","textPt":"O acesso só funciona porque Basis e Abgeleitet estão no mesmo pacote — caso contrário, protected não teria efeito.","correct":false},{"text":"Der Zugriff funktioniert, da Java bei Vererbung automatisch alle Attribute, auch private, zugänglich macht.","textPt":"O acesso funciona porque, na herança, o Java torna automaticamente todos os atributos, mesmo private, acessíveis.","correct":false},{"text":"protected erlaubt den Zugriff innerhalb der Klasse, des Pakets und durch Unterklassen — da Abgeleitet von Basis erbt, darf sie auf wert zugreifen.","textPt":"protected permite o acesso dentro da classe, do pacote e através de subclasses — como Abgeleitet herda de Basis, pode aceder a wert.","correct":true}]},
{"cat":"algo","sub":"oop","q":"Dieser Code kompiliert, obwohl Person die Methode sagHallo() nicht selbst implementiert — warum?","qPt":"Este código compila, embora Person não implemente o próprio método sagHallo() — porquê?","a":"Seit Java 8 können Interfaces default-Methoden mit einer Standardimplementierung enthalten. Eine implementierende Klasse erbt diese Implementierung automatisch, wenn sie sie nicht selbst überschreibt — Person nutzt also die Standardimplementierung aus dem Interface.","aPt":"Desde o Java 8, as interfaces podem conter métodos default com uma implementação padrão. Uma classe que implementa a interface herda automaticamente essa implementação se não a substituir (override) ela própria — Person utiliza, portanto, a implementação padrão da interface.","options":[{"text":"Seit Java 8 können Interfaces default-Methoden mit Standardimplementierung enthalten, die implementierende Klassen automatisch erben, wenn sie sie nicht überschreiben.","textPt":"Desde o Java 8, as interfaces podem ter métodos default com implementação padrão, que as classes que as implementam herdam automaticamente se não os sobrepuserem.","correct":true},{"text":"Person kompiliert nur, weil sagHallo() implizit als abstract gilt und daher nicht implementiert werden muss.","textPt":"Person só compila porque sagHallo() é implicitamente abstract e, por isso, não precisa de ser implementado.","correct":false},{"text":"Der Code kompiliert nicht wirklich — der Fehler tritt erst zur Laufzeit beim Aufruf von sagHallo() auf.","textPt":"O código, na verdade, não compila — o erro só ocorre em tempo de execução ao chamar sagHallo().","correct":false},{"text":"Interfaces benötigen in Java keine Methodenimplementierung mehr, seit sie als Klassen behandelt werden.","textPt":"As interfaces em Java já não precisam de implementação de métodos, pois passaram a ser tratadas como classes.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Warum verursacht die Methode aendere() einen Kompilierfehler?","qPt":"Por que razão o método aendere() provoca um erro de compilação?","a":"MWST ist als final deklariert — einmal zugewiesen, kann der Wert nicht mehr geändert werden. Der Versuch, MWST erneut einen Wert zuzuweisen, ist ein Kompilierfehler.","aPt":"MWST está declarada como final — depois de atribuído, o valor já não pode ser alterado. A tentativa de atribuir novamente um valor a MWST provoca um erro de compilação.","options":[{"text":"Der Fehler entsteht, weil MWST als double statt als int deklariert wurde.","textPt":"O erro ocorre porque MWST foi declarado como double em vez de int.","correct":false},{"text":"MWST ist final — einmal zugewiesen, kann der Wert nicht mehr geändert werden; der erneute Zuweisungsversuch verursacht einen Kompilierfehler.","textPt":"MWST é final — depois de atribuído, o valor não pode ser alterado; a nova tentativa de atribuição causa um erro de compilação.","correct":true},{"text":"Der Fehler entsteht, weil aendere() keinen Rückgabewert hat, MWST aber einen double-Wert erwartet.","textPt":"O erro ocorre porque aendere() não tem valor de retorno, mas MWST esperaria um valor double.","correct":false},{"text":"Der Fehler entsteht, weil final-Attribute in Methoden grundsätzlich nicht gelesen werden dürfen.","textPt":"O erro ocorre porque atributos final não podem, de forma geral, ser lidos dentro de métodos.","correct":false}]},
{"cat":"algo","sub":"oop","q":"In welcher Reihenfolge wird hier ausgegeben, und warum?","qPt":"Em que ordem é apresentada a saída aqui, e porquê?","a":"Zuerst \"A\", dann \"B\". Auch ohne explizites super() ruft Java automatisch den (parameterlosen) Konstruktor der Oberklasse zuerst auf, bevor der Code des Unterklassen-Konstruktors ausgeführt wird — die Oberklasse muss vollständig initialisiert sein, bevor die Unterklasse aufgebaut wird.","aPt":"Primeiro \"A\", depois \"B\". Mesmo sem um super() explícito, o Java chama automaticamente primeiro o construtor (sem parâmetros) da superclasse, antes de ser executado o código do construtor da subclasse — a superclasse tem de estar totalmente inicializada antes de a subclasse ser construída.","options":[{"text":"Zuerst \"B\", dann \"A\", da der Konstruktor von B zuerst aufgerufen wird und erst danach den von A aufruft.","textPt":"Primeiro \"B\", depois \"A\", pois o construtor de B é chamado primeiro e só depois chama o de A.","correct":false},{"text":"Nur \"B\" wird ausgegeben, da ohne explizites super() der Konstruktor von A nicht aufgerufen wird.","textPt":"Só é impresso \"B\", pois sem um super() explícito o construtor de A não é chamado.","correct":false},{"text":"Zuerst \"A\", dann \"B\" — Java ruft automatisch den parameterlosen Konstruktor der Oberklasse auf, bevor der Code des Unterklassen-Konstruktors läuft.","textPt":"Primeiro \"A\", depois \"B\" — o Java chama automaticamente o construtor sem parâmetros da superclasse antes de executar o código do construtor da subclasse.","correct":true},{"text":"Ein Kompilierfehler, da B keinen expliziten super()-Aufruf im Konstruktor enthält.","textPt":"Um erro de compilação, pois B não contém uma chamada explícita a super() no construtor.","correct":false}]},
{"cat":"algo","sub":"netz","q":"Welche HTTP-Methode wird in einer REST-API typischerweise zum Erstellen einer neuen Ressource verwendet?","qPt":"Qual é o método HTTP normalmente utilizado numa API REST para criar um novo recurso?","a":"POST — sie wird verwendet, um eine neue Ressource zu erstellen, z. B. POST /kunden, um einen neuen Kunden anzulegen. GET dient dem Lesen, PUT/PATCH dem Aktualisieren und DELETE dem Löschen einer Ressource.","aPt":"POST — é utilizado para criar um novo recurso, por exemplo POST /kunden, para registar um novo cliente. O GET serve para ler, o PUT/PATCH para atualizar e o DELETE para eliminar um recurso.","options":[{"text":"GET, da sie die Standardmethode für jede Art von Anfrage an eine REST-API ist.","textPt":"GET, pois é o método padrão para qualquer tipo de pedido a uma API REST.","correct":false},{"text":"PUT, da sie sowohl zum Erstellen als auch zum vollständigen Ersetzen einer Ressource verwendet wird und deshalb die gängigste Wahl ist.","textPt":"PUT, pois é usado tanto para criar como para substituir completamente um recurso, sendo por isso a escolha mais comum.","correct":false},{"text":"DELETE, da beim Erstellen einer Ressource zunächst ein eventuell vorhandener alter Datensatz entfernt werden muss.","textPt":"DELETE, pois ao criar um recurso é preciso primeiro remover um eventual registo antigo existente.","correct":false},{"text":"POST — sie wird verwendet, um eine neue Ressource zu erstellen, z. B. POST /kunden, um einen neuen Kunden anzulegen.","textPt":"POST — é usado para criar um novo recurso, por exemplo POST /kunden para criar um novo cliente.","correct":true}]},
{"cat":"algo","sub":"netz","q":"Was bedeutet \"zustandslos\" (stateless) als Grundprinzip von REST?","qPt":"O que significa \"sem estado\" (stateless) como princípio fundamental do REST?","a":"Jede Anfrage an den Server muss alle notwendigen Informationen enthalten, um verarbeitet zu werden — der Server speichert keinen Sitzungszustand (Session) zwischen einzelnen Anfragen eines Clients.","aPt":"Cada pedido ao servidor tem de conter toda a informação necessária para ser processado — o servidor não guarda estado de sessão (session) entre pedidos individuais de um cliente.","options":[{"text":"Jede Anfrage muss alle notwendigen Informationen enthalten, da der Server keinen Sitzungszustand zwischen Anfragen eines Clients speichert.","textPt":"Cada pedido deve conter toda a informação necessária, pois o servidor não guarda estado de sessão entre os pedidos de um cliente.","correct":true},{"text":"Der Client darf keine Daten im Request-Body senden, sondern nur über die URL.","textPt":"O cliente não pode enviar dados no corpo do pedido, apenas através do URL.","correct":false},{"text":"Der Server speichert den gesamten Zustand aller Clients zentral, damit keine Anfrage Informationen wiederholen muss.","textPt":"O servidor guarda centralmente o estado de todos os clientes, para que nenhum pedido precise de repetir informação.","correct":false},{"text":"Jede Anfrage muss sich auf die vorherige Anfrage desselben Clients beziehen, damit der Server den Kontext rekonstruieren kann.","textPt":"Cada pedido tem de se referir ao pedido anterior do mesmo cliente, para que o servidor possa reconstruir o contexto.","correct":false}]},
{"cat":"algo","sub":"netz","q":"Was bedeutet \"idempotent\" bei einer HTTP-Methode wie PUT oder DELETE?","qPt":"O que significa \"idempotente\" numa operação HTTP como PUT ou DELETE?","a":"Mehrfaches identisches Ausführen derselben Anfrage führt zum gleichen Endzustand wie ein einmaliges Ausführen. PUT /kunden/5 mehrfach mit denselben Daten aufzurufen ändert den Zustand nicht erneut — im Gegensatz z. B. zu POST, das bei jedem Aufruf eine neue Ressource anlegen kann.","aPt":"Executar o mesmo pedido várias vezes de forma idêntica resulta no mesmo estado final que executá-lo apenas uma vez. Chamar PUT /kunden/5 repetidamente com os mesmos dados não altera o estado novamente — ao contrário, por exemplo, do POST, que pode criar um novo recurso a cada chamada.","options":[{"text":"Idempotent bedeutet, dass die Anfrage besonders schnell verarbeitet wird, unabhängig von der Serverlast.","textPt":"Idempotente significa que o pedido é processado de forma especialmente rápida, independentemente da carga do servidor.","correct":false},{"text":"Mehrfaches identisches Ausführen derselben Anfrage führt zum gleichen Endzustand wie ein einmaliges Ausführen — im Gegensatz z. B. zu POST.","textPt":"Executar repetidamente o mesmo pedido idêntico leva ao mesmo estado final que executá-lo uma única vez — ao contrário, por exemplo, de POST.","correct":true},{"text":"Idempotent bedeutet, dass die Methode nur einmal pro Sitzung aufgerufen werden darf.","textPt":"Idempotente significa que o método só pode ser chamado uma vez por sessão.","correct":false},{"text":"Idempotent bedeutet, dass bei jedem erneuten Aufruf automatisch eine neue Version der Ressource angelegt wird.","textPt":"Idempotente significa que, a cada nova chamada, é automaticamente criada uma nova versão do recurso.","correct":false}]},
{"cat":"algo","sub":"netz","q":"Was bedeuten die HTTP-Statuscodes 200, 201, 404 und 500?","qPt":"O que significam os códigos de estado HTTP 200, 201, 404 e 500?","a":"200 OK: Anfrage erfolgreich verarbeitet. 201 Created: Ressource erfolgreich erstellt (typisch nach POST). 404 Not Found: angeforderte Ressource existiert nicht. 500 Internal Server Error: unerwarteter Fehler auf Serverseite.","aPt":"200 OK: o pedido foi processado com sucesso. 201 Created: o recurso foi criado com sucesso (tipicamente após um POST). 404 Not Found: o recurso pedido não existe. 500 Internal Server Error: erro inesperado do lado do servidor.","options":[{"text":"200 bedeutet, dass eine Ressource erstellt wurde, und 201, dass die Anfrage allgemein erfolgreich war.","textPt":"200 significa que um recurso foi criado, e 201 que o pedido em geral foi bem-sucedido.","correct":false},{"text":"404 bedeutet einen Serverfehler, und 500 bedeutet, dass die angeforderte Ressource nicht existiert.","textPt":"404 significa um erro de servidor, e 500 significa que o recurso solicitado não existe.","correct":false},{"text":"200 OK: erfolgreich verarbeitet. 201 Created: Ressource erstellt. 404 Not Found: Ressource existiert nicht. 500 Internal Server Error: unerwarteter Serverfehler.","textPt":"200 OK: processado com sucesso. 201 Created: recurso criado. 404 Not Found: recurso não existe. 500 Internal Server Error: erro inesperado no servidor.","correct":true},{"text":"200 und 201 kennzeichnen beide einen Clientfehler, während 404 und 500 erfolgreiche Anfragen kennzeichnen.","textPt":"200 e 201 indicam ambos um erro do cliente, enquanto 404 e 500 indicam pedidos bem-sucedidos.","correct":false}]},
{"cat":"algo","sub":"netz","q":"Was unterscheidet die HTTP-Statuscodes 401 und 403?","qPt":"O que distingue os códigos de estado HTTP 401 e 403?","a":"401 Unauthorized bedeutet: Der Client ist nicht (korrekt) authentifiziert (z. B. fehlende/ungültige Anmeldedaten). 403 Forbidden bedeutet: Der Client ist zwar authentifiziert, hat aber keine Berechtigung für die angeforderte Aktion/Ressource.","aPt":"401 Unauthorized significa que o cliente não está (corretamente) autenticado (por exemplo, por falta de credenciais ou credenciais inválidas). 403 Forbidden significa que o cliente está autenticado, mas não tem autorização para a ação/recurso pedido.","options":[{"text":"401 bedeutet, dass die Ressource nicht existiert, 403, dass der Server überlastet ist.","textPt":"401 significa que o recurso não existe, e 403 que o servidor está sobrecarregado.","correct":false},{"text":"401 und 403 bedeuten dasselbe und werden in der Praxis austauschbar verwendet.","textPt":"401 e 403 significam o mesmo e são usados de forma intercambiável na prática.","correct":false},{"text":"401 bedeutet, dass der Client zwar authentifiziert ist, aber keine Berechtigung hat; 403, dass die Authentifizierung fehlt.","textPt":"401 significa que o cliente está autenticado, mas não tem permissão; 403 significa que falta a autenticação.","correct":false},{"text":"401 Unauthorized: der Client ist nicht korrekt authentifiziert. 403 Forbidden: der Client ist authentifiziert, hat aber keine Berechtigung.","textPt":"401 Unauthorized: o cliente não está corretamente autenticado. 403 Forbidden: o cliente está autenticado, mas não tem permissão.","correct":true}]},
{"cat":"plan","sub":"sicherheit","q":"Was ist der Unterschied zwischen Hashing und Verschlüsselung?","qPt":"Qual é a diferença entre hashing e encriptação?","a":"Verschlüsselung ist umkehrbar (mit dem passenden Schlüssel kann der ursprüngliche Klartext wiederhergestellt werden). Hashing ist eine Einwegfunktion — aus dem Hash-Wert lässt sich der ursprüngliche Wert nicht zurückrechnen. Hashing wird u. a. zur sicheren Passwortspeicherung verwendet.","aPt":"A encriptação é reversível (com a chave adequada, é possível recuperar o texto original). O hashing é uma função unidirecional — a partir do valor de hash não é possível recalcular o valor original. O hashing é utilizado, entre outras coisas, para o armazenamento seguro de palavras-passe.","options":[{"text":"Hashing ist umkehrbar und wird zur Übertragung sensibler Daten genutzt; Verschlüsselung ist eine Einwegfunktion zur Passwortspeicherung.","textPt":"O hashing é reversível e é usado para transmitir dados sensíveis; a encriptação é uma função unidirecional para armazenar palavras-passe.","correct":false},{"text":"Verschlüsselung ist umkehrbar (mit dem passenden Schlüssel wiederherstellbar); Hashing ist eine Einwegfunktion und wird u. a. zur sicheren Passwortspeicherung verwendet.","textPt":"A encriptação é reversível (recuperável com a chave correta); o hashing é uma função unidirecional, usada entre outros para armazenar palavras-passe de forma segura.","correct":true},{"text":"Verschlüsselung nutzt immer ein Schlüsselpaar aus öffentlichem und privatem Schlüssel; Hashing nutzt einen einzigen symmetrischen Schlüssel.","textPt":"A encriptação utiliza sempre um par de chaves pública e privada; o hashing utiliza uma única chave simétrica.","correct":false},{"text":"Sowohl Verschlüsselung als auch Hashing sind grundsätzlich umkehrbar, sofern genügend Rechenleistung zur Verfügung steht.","textPt":"Tanto a encriptação como o hashing são, em princípio, reversíveis, desde que haja capacidade de processamento suficiente.","correct":false}]},
{"cat":"plan","sub":"sicherheit","q":"Was ist Zwei-Faktor-Authentifizierung (2FA)?","qPt":"O que é a autenticação de dois fatores (2FA)?","a":"Eine Anmeldemethode, die zwei unabhängige Faktoren aus unterschiedlichen Kategorien kombiniert (z. B. Wissen wie ein Passwort + Besitz wie ein Smartphone-Code), um die Sicherheit gegenüber einer reinen Passwortanmeldung deutlich zu erhöhen.","aPt":"Um método de autenticação que combina dois fatores independentes de categorias diferentes (por exemplo, algo que se sabe, como uma palavra-passe, e algo que se possui, como um código enviado para o smartphone), de modo a aumentar significativamente a segurança em relação a um login apenas com palavra-passe.","options":[{"text":"Eine verschlüsselte Verbindung über ein öffentliches Netz, die zusätzlich zum Passwort verwendet wird.","textPt":"Uma ligação encriptada através de uma rede pública, utilizada em complemento à palavra-passe.","correct":false},{"text":"Eine Anmeldemethode, bei der zwei verschiedene Passwörter nacheinander eingegeben werden müssen.","textPt":"Um método de autenticação em que é necessário introduzir duas palavras-passe diferentes em sequência.","correct":false},{"text":"Eine Anmeldemethode, die zwei unabhängige Faktoren aus unterschiedlichen Kategorien kombiniert (z. B. Passwort + Smartphone-Code), um die Sicherheit zu erhöhen.","textPt":"Um método de autenticação que combina dois fatores independentes de categorias diferentes (p. ex. palavra-passe + código no smartphone), para aumentar a segurança.","correct":true},{"text":"Eine Technik, bei der ein Angreifer Vertrauen ausnutzt, um an ein zweites Passwort zu gelangen.","textPt":"Uma técnica em que um atacante explora a confiança para obter uma segunda palavra-passe.","correct":false}]},
{"cat":"plan","sub":"sicherheit","q":"Was versteht man unter Social Engineering?","qPt":"O que se entende por engenharia social (Social Engineering)?","a":"Manipulationstechniken, die menschliches Vertrauen oder Unachtsamkeit ausnutzen, um an vertrauliche Informationen zu gelangen oder Personen zu Handlungen zu bewegen (z. B. Phishing-E-Mails, vorgetäuschte Anrufe des \"IT-Supports\").","aPt":"Técnicas de manipulação que exploram a confiança ou a falta de atenção das pessoas para obter informação confidencial ou induzi-las a determinadas ações (por exemplo, e-mails de phishing, chamadas telefónicas a fingir ser do \"suporte de TI\").","options":[{"text":"Manipulationstechniken, die menschliches Vertrauen oder Unachtsamkeit ausnutzen, um an vertrauliche Informationen zu gelangen (z. B. Phishing-E-Mails, vorgetäuschte Anrufe).","textPt":"Técnicas de manipulação que exploram a confiança ou o descuido humano para obter informações confidenciais (p. ex. e-mails de phishing, chamadas falsas de suporte).","correct":true},{"text":"Ein technischer Angriff, der ein System durch massenhafte Anfragen überlastet und unerreichbar macht.","textPt":"Um ataque técnico que sobrecarrega um sistema com um volume massivo de pedidos, tornando-o inacessível.","correct":false},{"text":"Das gezielte Ausnutzen bekannter, aber ungepatchter Software-Sicherheitslücken.","textPt":"A exploração deliberada de falhas de segurança de software conhecidas, mas não corrigidas.","correct":false},{"text":"Ein rein automatisierter Prozess, bei dem Schadsoftware ohne menschliches Eingreifen vertrauliche Daten abgreift.","textPt":"Um processo totalmente automatizado em que software malicioso recolhe dados confidenciais sem qualquer intervenção humana.","correct":false}]},
{"cat":"plan","sub":"sicherheit","q":"Warum ist regelmäßiges Patch-Management wichtig für die IT-Sicherheit?","qPt":"Por que razão é importante uma gestão regular de patches (Patch-Management) para a segurança informática?","a":"Software-Updates (Patches) schließen bekannt gewordene Sicherheitslücken. Ungepatchte Systeme sind ein beliebtes Angriffsziel, da Schwachstellen oft öffentlich bekannt und leicht ausnutzbar sind.","aPt":"As atualizações de software (patches) corrigem vulnerabilidades de segurança conhecidas. Sistemas sem patches aplicados são um alvo frequente de ataques, uma vez que as vulnerabilidades são muitas vezes públicas e fáceis de explorar.","options":[{"text":"Regelmäßige Updates sichern vor allem Datenverlust ab, indem sie automatisch Backups der Systeme erstellen.","textPt":"As atualizações regulares protegem sobretudo contra a perda de dados, criando automaticamente cópias de segurança dos sistemas.","correct":false},{"text":"Patches dienen hauptsächlich dazu, neue Funktionen bereitzustellen; sicherheitsrelevante Korrekturen sind dabei nur ein Nebeneffekt.","textPt":"Os patches servem principalmente para disponibilizar novas funcionalidades; as correções de segurança são apenas um efeito secundário.","correct":false},{"text":"Patches filtern den Datenverkehr zwischen internen und externen Netzen anhand definierter Regeln.","textPt":"Os patches filtram o tráfego de dados entre redes internas e externas com base em regras definidas.","correct":false},{"text":"Software-Updates schließen bekannt gewordene Sicherheitslücken; ungepatchte Systeme sind ein beliebtes Angriffsziel, da Schwachstellen oft öffentlich bekannt sind.","textPt":"As atualizações de software corrigem vulnerabilidades conhecidas; sistemas não corrigidos são um alvo de ataque popular, pois as falhas são muitas vezes públicas.","correct":true}]},
{"cat":"plan","sub":"sicherheit","q":"Was ist ein Denial-of-Service-Angriff (DoS)?","qPt":"O que é um ataque de Denial-of-Service (DoS)?","a":"Ein Angriff, der ein System oder einen Dienst durch Überlastung (z. B. massenhafte Anfragen) für legitime Nutzer unerreichbar machen soll — bei verteilten Angriffen über viele Systeme spricht man von DDoS (Distributed Denial of Service).","aPt":"Um ataque que procura tornar um sistema ou serviço inacessível para os utilizadores legítimos através de sobrecarga (por exemplo, um grande volume de pedidos) — quando o ataque é distribuído por muitos sistemas, fala-se em DDoS (Distributed Denial of Service).","options":[{"text":"Ein Angriff, der menschliches Vertrauen ausnutzt, um Zugangsdaten zu einem System zu erlangen.","textPt":"Um ataque que explora a confiança humana para obter credenciais de acesso a um sistema.","correct":false},{"text":"Ein Angriff, der ein System durch Überlastung (z. B. massenhafte Anfragen) für legitime Nutzer unerreichbar machen soll; verteilt über viele Systeme heißt es DDoS.","textPt":"Um ataque que visa tornar um sistema inacessível para utilizadores legítimos através de sobrecarga (p. ex. pedidos massivos); quando distribuído por muitos sistemas, chama-se DDoS.","correct":true},{"text":"Ein Angriff, der durch systematisches Ausprobieren von Passwörtern Zugang zu einem Konto erlangt.","textPt":"Um ataque que obtém acesso a uma conta através da tentativa sistemática de palavras-passe.","correct":false},{"text":"Ein Angriff, dessen primäres Ziel das unbemerkte Kopieren vertraulicher Daten ist, ohne den Dienst zu beeinträchtigen.","textPt":"Um ataque cujo principal objetivo é copiar dados confidenciais sem ser detetado, sem afetar o serviço.","correct":false}]},
