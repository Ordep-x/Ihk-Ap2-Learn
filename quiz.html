{"cat":"algo","sub":"ds","q":"Was ist eine Hashtabelle?","qPt":"O que é uma tabela de hash?","a":"Eine Datenstruktur, die Schlüssel über eine Hashfunktion auf Speicherplätze abbildet, um im Idealfall Zugriff, Einfügen und Löschen in O(1) zu ermöglichen.","aPt":"Uma estrutura de dados que mapeia chaves para posições de memória através de uma função de hash, permitindo, no caso ideal, acesso, inserção e remoção em O(1).","options":[{"text":"Eine Datenstruktur, die Schlüssel in Einfügereihenfolge speichert und einen Zugriff in O(n) erfordert.","textPt":"Uma estrutura de dados que guarda as chaves pela ordem de inserção e exige acesso em O(n).","correct":false},{"text":"Eine Datenstruktur, die ihre Schlüssel stets nach Hashwert sortiert hält, um eine binäre Suche zu ermöglichen.","textPt":"Uma estrutura de dados que mantém as suas chaves sempre ordenadas pelo valor de hash, permitindo uma busca binária.","correct":false},{"text":"Eine Datenstruktur, die Schlüssel über eine Hashfunktion auf Speicherplätze abbildet, um im Idealfall Zugriff, Einfügen und Löschen in O(1) zu ermöglichen.","textPt":"Uma estrutura de dados que mapeia chaves para posições de memória através de uma função de hash, permitindo, no caso ideal, acesso, inserção e remoção em O(1).","correct":true},{"text":"Eine Datenstruktur, bei der ein Schlüssel nur durch sequenzielles Durchlaufen ab dem ersten Speicherplatz gefunden werden kann.","textPt":"Uma estrutura de dados em que uma chave só pode ser encontrada percorrendo sequencialmente a partir da primeira posição.","correct":false}]},
{"cat":"algo","sub":"ds","q":"Was ist eine Kollision in einer Hashtabelle und wie kann sie behandelt werden?","qPt":"O que é uma colisão numa tabela de hash e como pode ser tratada?","a":"Eine Kollision entsteht, wenn zwei Schlüssel auf denselben Speicherplatz abgebildet werden. Behandlung z. B. durch Verkettung (Chaining) oder offene Adressierung.","aPt":"Uma colisão ocorre quando duas chaves são mapeadas para a mesma posição de memória. Pode ser tratada, por exemplo, através de encadeamento (chaining) ou de endereçamento aberto.","options":[{"text":"Eine Kollision entsteht, wenn zwei Schlüssel auf denselben Speicherplatz abgebildet werden; Behandlung z. B. durch Verkettung (Chaining) oder offene Adressierung.","textPt":"Uma colisão ocorre quando duas chaves são mapeadas para a mesma posição de memória; é tratada, por exemplo, através de encadeamento (chaining) ou endereçamento aberto.","correct":true},{"text":"Eine Kollision entsteht, wenn die Hashfunktion für denselben Schlüssel bei zwei Aufrufen unterschiedliche Werte liefert.","textPt":"Uma colisão ocorre quando a função de hash produz valores diferentes para a mesma chave em duas chamadas.","correct":false},{"text":"Eine Kollision lässt sich ausschließlich dadurch beheben, dass die Hashtabelle auf doppelte Größe vergrößert wird.","textPt":"Uma colisão só pode ser resolvida aumentando a hashtable para o dobro do tamanho.","correct":false},{"text":"Eine Kollision bedeutet, dass die Hashtabelle voll ist und keine weiteren Schlüssel mehr abgebildet werden können.","textPt":"Uma colisão significa que a hashtable está cheia e já não é possível mapear mais nenhuma chave.","correct":false}]},
{"cat":"algo","sub":"ds","q":"Was ist ein Graph in der Informatik?","qPt":"O que é um grafo em informática?","a":"Eine Struktur aus Knoten (Nodes) und Kanten (Edges), die Beziehungen zwischen Objekten darstellt — kann gerichtet oder ungerichtet, gewichtet oder ungewichtet sein.","aPt":"Uma estrutura composta por nós (nodes) e arestas (edges) que representa relações entre objetos — pode ser dirigido ou não dirigido, com ou sem pesos.","options":[{"text":"Eine Struktur aus Knoten ohne Verbindungen, die eine Hierarchie zwischen Objekten darstellt.","textPt":"Uma estrutura de nós sem ligações que representa uma hierarquia entre objetos.","correct":false},{"text":"Eine Struktur aus Knoten und Kanten, die grundsätzlich immer gerichtet und gewichtet ist.","textPt":"Uma estrutura de nós e arestas que é sempre, por definição, dirigida e com pesos.","correct":false},{"text":"Eine Baumstruktur mit genau einem Wurzelknoten, die keine Zyklen enthalten darf.","textPt":"Uma estrutura em árvore com exatamente um nó-raiz, que não pode conter ciclos.","correct":false},{"text":"Eine Struktur aus Knoten und Kanten, die Beziehungen zwischen Objekten darstellt — kann gerichtet oder ungerichtet, gewichtet oder ungewichtet sein.","textPt":"Uma estrutura de nós e arestas que representa relações entre objetos — pode ser dirigida ou não dirigida, com ou sem pesos.","correct":true}]},
{"cat":"algo","sub":"sort","q":"Wie funktioniert Selection Sort?","qPt":"Como funciona o Selection Sort?","a":"In jedem Durchlauf wird das kleinste (oder größte) Element im unsortierten Bereich gesucht und mit dem ersten unsortierten Element vertauscht.","aPt":"Em cada passagem, procura-se o menor (ou maior) elemento na parte não ordenada e troca-se com o primeiro elemento não ordenado.","options":[{"text":"Benachbarte Elemente werden wiederholt paarweise verglichen und bei falscher Reihenfolge vertauscht.","textPt":"Elementos vizinhos são repetidamente comparados aos pares e trocados quando estão na ordem errada.","correct":false},{"text":"In jedem Durchlauf wird das kleinste (oder größte) Element im unsortierten Bereich gesucht und mit dem ersten unsortierten Element vertauscht.","textPt":"Em cada passagem procura-se o menor (ou maior) elemento na parte não ordenada e troca-se com o primeiro elemento não ordenado.","correct":true},{"text":"Jedes Element wird schrittweise an der richtigen Position im bereits sortierten Teil eingefügt.","textPt":"Cada elemento é inserido passo a passo na posição correta da parte já ordenada.","correct":false},{"text":"Ein Pivot-Element wird gewählt und das Array in kleinere und größere Elemente partitioniert.","textPt":"Escolhe-se um elemento pivô e o array é dividido em elementos menores e maiores do que ele.","correct":false}]},
{"cat":"algo","sub":"sort","q":"Wie funktioniert Insertion Sort?","qPt":"Como funciona o Insertion Sort?","a":"Das Array wird schrittweise aufgebaut, indem jedes Element an der richtigen Position im bereits sortierten Teil eingefügt wird.","aPt":"O array é construído progressivamente, inserindo cada elemento na posição correta dentro da parte já ordenada.","options":[{"text":"In jedem Durchlauf wird das kleinste Element im unsortierten Bereich gesucht und an den Anfang getauscht.","textPt":"Em cada passagem procura-se o menor elemento na parte não ordenada e troca-se para o início.","correct":false},{"text":"Das Array wird rekursiv in Hälften geteilt, bis einzelne Elemente übrig sind, die dann sortiert zusammengeführt werden.","textPt":"O array é dividido recursivamente em metades até restarem elementos isolados, que são depois fundidos de forma ordenada.","correct":false},{"text":"Das Array wird schrittweise aufgebaut, indem jedes Element an der richtigen Position im bereits sortierten Teil eingefügt wird.","textPt":"O array é construído passo a passo, inserindo cada elemento na posição correta da parte já ordenada.","correct":true},{"text":"Benachbarte Elemente werden so lange paarweise vertauscht, bis das größte Element ans Ende steigt.","textPt":"Elementos vizinhos são trocados aos pares sucessivamente até o maior elemento subir até ao fim.","correct":false}]},
{"cat":"algo","sub":"sort","q":"Wie funktioniert Quicksort grundsätzlich?","qPt":"Como funciona basicamente o Quicksort?","a":"Ein Pivot-Element wird gewählt, das Array wird in kleinere/größere Elemente als den Pivot partitioniert, und die Teilarrays werden rekursiv sortiert (Divide-and-Conquer).","aPt":"Escolhe-se um elemento pivot, o array é particionado em elementos menores/maiores do que o pivot, e os subarrays são ordenados recursivamente (divisão e conquista).","options":[{"text":"Ein Pivot-Element wird gewählt, das Array in kleinere/größere Elemente als den Pivot partitioniert, und die Teilarrays rekursiv sortiert (Divide-and-Conquer).","textPt":"Escolhe-se um elemento pivô, o array é particionado em elementos menores/maiores do que o pivô, e os subarrays são ordenados recursivamente (divisão e conquista).","correct":true},{"text":"Das Array wird rekursiv in Hälften geteilt, bis einzelne Elemente übrig sind, die dann sortiert zusammengeführt werden.","textPt":"O array é dividido recursivamente em metades até restarem elementos isolados, que são depois fundidos de forma ordenada.","correct":false},{"text":"In jedem Durchlauf wird wiederholt das kleinste Element gesucht und an den Anfang des unsortierten Bereichs getauscht.","textPt":"Em cada passagem procura-se repetidamente o menor elemento e troca-se para o início da parte não ordenada.","correct":false},{"text":"Benachbarte Elemente werden wiederholt paarweise verglichen und bei falscher Reihenfolge vertauscht, bis keine Vertauschung mehr nötig ist.","textPt":"Elementos vizinhos são repetidamente comparados aos pares e trocados quando estão na ordem errada, até não ser mais necessária nenhuma troca.","correct":false}]},
{"cat":"algo","sub":"sort","q":"Wie funktioniert Mergesort grundsätzlich?","qPt":"Como funciona basicamente o Mergesort?","a":"Das Array wird rekursiv in Hälften geteilt, bis einzelne Elemente übrig sind, die dann paarweise sortiert wieder zusammengeführt (gemergt) werden — Laufzeit O(n log n).","aPt":"O array é dividido recursivamente em metades até restarem elementos isolados, que depois são combinados (merged) de forma ordenada, aos pares — complexidade O(n log n).","options":[{"text":"Ein Pivot-Element wird gewählt und das Array wird darum herum rekursiv partitioniert und sortiert.","textPt":"Escolhe-se um elemento pivô e o array é particionado e ordenado recursivamente em torno dele.","correct":false},{"text":"Das Array wird schrittweise aufgebaut, indem jedes Element an der richtigen Position im sortierten Teil eingefügt wird.","textPt":"O array é construído passo a passo, inserindo cada elemento na posição correta da parte já ordenada.","correct":false},{"text":"Das Verfahren teilt das Array rekursiv, hat aber unabhängig vom Verfahren stets eine Laufzeit von O(n²).","textPt":"O método divide o array recursivamente, mas tem sempre, independentemente do caso, uma complexidade de O(n²).","correct":false},{"text":"Das Array wird rekursiv in Hälften geteilt, bis einzelne Elemente übrig sind, die dann paarweise sortiert zusammengeführt werden — Laufzeit O(n log n).","textPt":"O array é dividido recursivamente em metades até restarem elementos isolados, que são depois fundidos aos pares de forma ordenada — complexidade O(n log n).","correct":true}]},
{"cat":"algo","sub":"sort","q":"Welche Zeitkomplexität hat die lineare Suche im schlechtesten Fall?","qPt":"Qual é a complexidade temporal da pesquisa linear no pior caso?","a":"O(n), da im schlimmsten Fall jedes Element geprüft werden muss.","aPt":"O(n), uma vez que, no pior caso, é necessário verificar todos os elementos.","options":[{"text":"O(log n), da der Suchbereich bei jedem Schritt halbiert wird.","textPt":"O(log n), pois o espaço de busca é reduzido à metade em cada passo.","correct":false},{"text":"O(n), da im schlimmsten Fall jedes Element geprüft werden muss.","textPt":"O(n), pois no pior caso é preciso verificar todos os elementos.","correct":true},{"text":"O(1), da der Zugriff über einen Index wie bei einem Array erfolgt.","textPt":"O(1), pois o acesso ocorre através de um índice, tal como num array.","correct":false},{"text":"O(n²), da jedes Element mit jedem anderen Element verglichen werden muss.","textPt":"O(n²), pois cada elemento tem de ser comparado com todos os outros.","correct":false}]},
{"cat":"algo","sub":"rekursion","q":"Was ist der Unterschied zwischen Rekursion und Iteration?","qPt":"Qual é a diferença entre recursão e iteração?","a":"Rekursion löst ein Problem durch Selbstaufrufe der Funktion, Iteration durch Schleifen. Rekursion kann eleganter sein, benötigt aber mehr Speicher (Aufrufstapel); Iteration ist meist ressourcenschonender.","aPt":"A recursão resolve um problema através de chamadas da função a si própria, enquanto a iteração usa ciclos. A recursão pode ser mais elegante, mas precisa de mais memória (pilha de chamadas); a iteração é geralmente mais eficiente em termos de recursos.","options":[{"text":"Iteration benötigt durch die Schleifenvariablen stets mehr Speicher als Rekursion.","textPt":"A iteração precisa sempre de mais memória do que a recursão, devido às variáveis do ciclo.","correct":false},{"text":"Rekursion und Iteration haben grundsätzlich denselben Speicherbedarf, da beide denselben Code ausführen.","textPt":"A recursão e a iteração têm, por natureza, a mesma necessidade de memória, pois executam o mesmo código.","correct":false},{"text":"Rekursion löst ein Problem durch Selbstaufrufe, Iteration durch Schleifen; Rekursion kann eleganter sein, benötigt aber mehr Speicher (Aufrufstapel), Iteration ist meist ressourcenschonender.","textPt":"A recursão resolve um problema através de chamadas a si própria, a iteração através de ciclos; a recursão pode ser mais elegante, mas precisa de mais memória (pilha de chamadas), enquanto a iteração é geralmente mais económica em recursos.","correct":true},{"text":"Rekursion verwendet intern Schleifen, während Iteration auf Selbstaufrufen der Funktion basiert.","textPt":"A recursão usa ciclos internamente, enquanto a iteração se baseia em chamadas da função a si própria.","correct":false}]},
{"cat":"algo","sub":"rekursion","q":"Was ist ein Stack Overflow bei Rekursion?","qPt":"O que é um Stack Overflow na recursão?","a":"Ein Fehler, der auftritt, wenn zu viele rekursive Aufrufe den Aufrufstapel (Call Stack) überlaufen lassen, meist wegen fehlender oder falscher Abbruchbedingung.","aPt":"Um erro que ocorre quando demasiadas chamadas recursivas fazem a pilha de chamadas (call stack) ultrapassar o seu limite, normalmente por falta de uma condição de paragem ou por uma condição incorreta.","options":[{"text":"Ein Fehler, der auftritt, wenn zu viele rekursive Aufrufe den Aufrufstapel überlaufen lassen, meist wegen fehlender oder falscher Abbruchbedingung.","textPt":"Um erro que ocorre quando demasiadas chamadas recursivas fazem a pilha de chamadas ultrapassar a sua capacidade, geralmente devido a uma condição de paragem ausente ou incorreta.","correct":true},{"text":"Ein Fehler, der auftritt, wenn eine Schleife durch einen falschen Inkrementwert nie terminiert.","textPt":"Um erro que ocorre quando um ciclo nunca termina devido a um valor de incremento incorreto.","correct":false},{"text":"Ein Fehler, der auftritt, wenn zu viele Elemente in eine Queue eingefügt werden.","textPt":"Um erro que ocorre quando são inseridos demasiados elementos numa queue.","correct":false},{"text":"Ein Fehler, der nur auftritt, wenn die Rekursionstiefe den verfügbaren Heap-Speicher übersteigt.","textPt":"Um erro que só ocorre quando a profundidade da recursão excede a memória heap disponível.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Was ist der Konstruktor einer Klasse?","qPt":"O que é o construtor de uma classe?","a":"Eine spezielle Methode, die beim Erzeugen eines neuen Objekts automatisch aufgerufen wird, um dessen Attribute zu initialisieren.","aPt":"Um método especial que é chamado automaticamente quando um novo objeto é criado, para inicializar os seus atributos.","options":[{"text":"Eine spezielle Methode, die beim Zerstören eines Objekts aufgerufen wird, um Ressourcen freizugeben.","textPt":"Um método especial que é chamado ao destruir um objeto, para libertar recursos.","correct":false},{"text":"Eine statische Methode, die von allen Instanzen einer Klasse gemeinsam genutzt wird.","textPt":"Um método estático que é partilhado por todas as instâncias de uma classe.","correct":false},{"text":"Eine Methode, die nach der Objekterzeugung manuell aufgerufen werden muss, um die Attribute zu setzen.","textPt":"Um método que tem de ser chamado manualmente após a criação do objeto, para definir os atributos.","correct":false},{"text":"Eine spezielle Methode, die beim Erzeugen eines neuen Objekts automatisch aufgerufen wird, um dessen Attribute zu initialisieren.","textPt":"Um método especial que é chamado automaticamente ao criar um novo objeto, para inicializar os seus atributos.","correct":true}]},
{"cat":"algo","sub":"oop","q":"Was ist der Unterschied zwischen einer Klasse und einem Objekt?","qPt":"Qual é a diferença entre uma classe e um objeto?","a":"Eine Klasse ist die Bauplan-/Vorlagendefinition mit Attributen und Methoden. Ein Objekt ist eine konkrete Instanz dieser Klasse mit eigenen Attributwerten.","aPt":"Uma classe é a definição/modelo (plano) com atributos e métodos. Um objeto é uma instância concreta dessa classe, com os seus próprios valores de atributos.","options":[{"text":"Eine Klasse ist eine konkrete Instanz, ein Objekt ist die Bauplan-/Vorlagendefinition mit Attributen und Methoden.","textPt":"Uma classe é uma instância concreta, um objeto é a definição do modelo/molde com atributos e métodos.","correct":false},{"text":"Eine Klasse ist die Bauplan-/Vorlagendefinition mit Attributen und Methoden; ein Objekt ist eine konkrete Instanz dieser Klasse mit eigenen Attributwerten.","textPt":"Uma classe é a definição do modelo/molde com atributos e métodos; um objeto é uma instância concreta dessa classe com os seus próprios valores de atributos.","correct":true},{"text":"Klasse und Objekt sind in der OOP Synonyme für dasselbe Konzept.","textPt":"Classe e objeto são, na POO, sinónimos para o mesmo conceito.","correct":false},{"text":"Ein Objekt kann existieren, ohne jemals zu einer Klasse zu gehören.","textPt":"Um objeto pode existir sem nunca pertencer a nenhuma classe.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Was ist eine statische Methode/ein statisches Attribut in der OOP?","qPt":"O que é um método estático/atributo estático na POO?","a":"Ein Element, das zur Klasse selbst gehört und nicht an eine einzelne Instanz gebunden ist — es existiert nur einmal, unabhängig davon, wie viele Objekte erzeugt werden.","aPt":"Um elemento que pertence à própria classe e não está associado a uma instância individual — existe apenas uma vez, independentemente de quantos objetos forem criados.","options":[{"text":"Ein Element, das zu jeder einzelnen Instanz gehört und für jedes Objekt neu erzeugt wird.","textPt":"Um elemento que pertence a cada instância individual e é recriado para cada objeto.","correct":false},{"text":"Ein Element, auf das erst zugegriffen werden kann, nachdem mindestens ein Objekt der Klasse erzeugt wurde.","textPt":"Um elemento que só pode ser acedido depois de ter sido criado pelo menos um objeto da classe.","correct":false},{"text":"Ein Element, das zur Klasse selbst gehört und nicht an eine einzelne Instanz gebunden ist — es existiert nur einmal, unabhängig von der Anzahl erzeugter Objekte.","textPt":"Um elemento que pertence à própria classe e não está ligado a uma instância individual — existe apenas uma vez, independentemente do número de objetos criados.","correct":true},{"text":"Eine Methode, die eine geerbte Methode mit gleicher Signatur in einer Unterklasse neu implementiert.","textPt":"Um método que reimplementa, numa subclasse, um método herdado com a mesma assinatura.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Was ist der Unterschied zwischen Überladen (Overloading) und Überschreiben (Overriding)?","qPt":"Qual é a diferença entre sobrecarga (overloading) e sobreposição (overriding)?","a":"Überladen bedeutet, mehrere Methoden mit gleichem Namen, aber unterschiedlicher Parameterliste in derselben Klasse zu definieren. Überschreiben bedeutet, eine geerbte Methode in einer Unterklasse mit gleicher Signatur neu zu implementieren.","aPt":"A sobrecarga consiste em definir vários métodos com o mesmo nome, mas com listas de parâmetros diferentes, na mesma classe. A sobreposição consiste em reimplementar um método herdado numa subclasse com a mesma assinatura.","options":[{"text":"Überladen bedeutet, mehrere Methoden mit gleichem Namen, aber unterschiedlicher Parameterliste in derselben Klasse zu definieren; Überschreiben bedeutet, eine geerbte Methode in einer Unterklasse mit gleicher Signatur neu zu implementieren.","textPt":"Overloading significa definir, na mesma classe, vários métodos com o mesmo nome mas listas de parâmetros diferentes; overriding significa reimplementar, numa subclasse, um método herdado com a mesma assinatura.","correct":true},{"text":"Überschreiben bedeutet, mehrere Methoden mit gleichem Namen in derselben Klasse zu definieren; Überladen bedeutet, eine geerbte Methode in einer Unterklasse neu zu implementieren.","textPt":"Overriding significa definir vários métodos com o mesmo nome na mesma classe; overloading significa reimplementar, numa subclasse, um método herdado.","correct":false},{"text":"Überladen bedeutet, eine geerbte Methode in einer Unterklasse mit gleicher Signatur neu zu implementieren; Überschreiben bedeutet, mehrere Methoden mit gleichem Namen in derselben Klasse zu definieren.","textPt":"Overloading significa reimplementar, numa subclasse, um método herdado com a mesma assinatura; overriding significa definir vários métodos com o mesmo nome na mesma classe.","correct":false},{"text":"Überladen und Überschreiben bezeichnen in der OOP denselben Vorgang mit unterschiedlichem Namen.","textPt":"Overloading e overriding designam, na POO, o mesmo processo com nomes diferentes.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Was ist Abstraktion in der OOP?","qPt":"O que é a abstração na POO?","a":"Das Prinzip, nur die für den jeweiligen Kontext wesentlichen Eigenschaften/Verhaltensweisen eines Objekts abzubilden und unwichtige Details auszublenden.","aPt":"O princípio de representar apenas as propriedades/comportamentos essenciais de um objeto para o contexto em questão, ocultando os detalhes irrelevantes.","options":[{"text":"Das Prinzip, Attribute einer Klasse vor direktem Zugriff von außen zu schützen.","textPt":"O princípio de proteger os atributos de uma classe do acesso direto externo.","correct":false},{"text":"Das Prinzip, dass eine Unterklasse automatisch das Verhalten der Oberklasse übernimmt.","textPt":"O princípio de uma subclasse herdar automaticamente o comportamento da superclasse.","correct":false},{"text":"Das Prinzip, dass Objekte unterschiedlicher Klassen beim Aufruf derselben Methode unterschiedlich reagieren.","textPt":"O princípio de objetos de classes diferentes reagirem de forma diferente ao mesmo método.","correct":false},{"text":"Das Prinzip, nur die für den jeweiligen Kontext wesentlichen Eigenschaften/Verhaltensweisen eines Objekts abzubilden und unwichtige Details auszublenden.","textPt":"O princípio de representar apenas as propriedades/comportamentos essenciais de um objeto para o contexto em causa, ocultando os detalhes irrelevantes.","correct":true}]},
{"cat":"algo","sub":"pattern","q":"Was ist das Singleton-Entwurfsmuster?","qPt":"O que é o padrão de design Singleton?","a":"Ein Entwurfsmuster, das sicherstellt, dass von einer Klasse zur Laufzeit nur genau eine Instanz existiert, und einen globalen Zugriffspunkt darauf bereitstellt.","aPt":"Um padrão de design que garante que existe exatamente uma instância de uma classe em tempo de execução, fornecendo um ponto de acesso global a essa instância.","options":[{"text":"Ein Entwurfsmuster, das die Objekterzeugung über eine zentrale Methode kapselt, statt Objekte direkt mit \"new\" zu erzeugen.","textPt":"Um padrão de design que encapsula a criação de objetos através de um método central, em vez de os criar diretamente com \"new\".","correct":false},{"text":"Ein Entwurfsmuster, das sicherstellt, dass von einer Klasse zur Laufzeit nur genau eine Instanz existiert, und einen globalen Zugriffspunkt darauf bereitstellt.","textPt":"Um padrão de design que garante que, em tempo de execução, existe exatamente uma única instância de uma classe, fornecendo um ponto de acesso global a ela.","correct":true},{"text":"Ein Entwurfsmuster, bei dem sich Beobachter bei einem Subjekt registrieren und bei Zustandsänderung benachrichtigt werden.","textPt":"Um padrão de design em que observadores se registam num sujeito e são notificados quando o seu estado muda.","correct":false},{"text":"Ein Entwurfsmuster, das beliebig viele Instanzen einer Klasse erlaubt, die sich jedoch ein gemeinsames Attribut teilen.","textPt":"Um padrão de design que permite qualquer número de instâncias de uma classe, que partilham, no entanto, um atributo comum.","correct":false}]},
{"cat":"algo","sub":"pattern","q":"Was ist das Observer-Entwurfsmuster?","qPt":"O que é o padrão de design Observer?","a":"Ein Entwurfsmuster, bei dem sich Beobachter (Observer) bei einem Subjekt registrieren und automatisch benachrichtigt werden, wenn sich dessen Zustand ändert.","aPt":"Um padrão de design em que os observadores (observers) se registam junto de um sujeito (subject) e são automaticamente notificados quando o estado deste muda.","options":[{"text":"Ein Entwurfsmuster, das sicherstellt, dass von einer Klasse zur Laufzeit nur eine Instanz existiert.","textPt":"Um padrão de design que garante que apenas uma instância de uma classe existe em tempo de execução.","correct":false},{"text":"Ein Entwurfsmuster, das die Objekterzeugung über eine zentrale Methode kapselt, statt Objekte direkt mit \"new\" zu erzeugen.","textPt":"Um padrão de design que encapsula a criação de objetos através de um método central, em vez de os criar diretamente com \"new\".","correct":false},{"text":"Ein Entwurfsmuster, bei dem sich Beobachter bei einem Subjekt registrieren und automatisch benachrichtigt werden, wenn sich dessen Zustand ändert.","textPt":"Um padrão de design em que observadores se registam num sujeito e são automaticamente notificados quando o seu estado muda.","correct":true},{"text":"Ein Architekturmuster, das eine Anwendung in Model, View und Controller aufteilt.","textPt":"Um padrão de arquitetura que divide uma aplicação em Model, View e Controller.","correct":false}]},
{"cat":"algo","sub":"pattern","q":"Was ist das Factory-Entwurfsmuster?","qPt":"O que é o padrão de design Factory?","a":"Ein Entwurfsmuster, das die Erzeugung von Objekten über eine zentrale Methode/Klasse kapselt, statt Objekte direkt mit \"new\" zu erzeugen — erhöht Flexibilität und Austauschbarkeit.","aPt":"Um padrão de design que encapsula a criação de objetos através de um método/classe central, em vez de criar objetos diretamente com \"new\" — aumenta a flexibilidade e a capacidade de substituição.","options":[{"text":"Ein Entwurfsmuster, das die Erzeugung von Objekten über eine zentrale Methode/Klasse kapselt, statt Objekte direkt mit \"new\" zu erzeugen — erhöht Flexibilität und Austauschbarkeit.","textPt":"Um padrão de design que encapsula a criação de objetos através de um método/classe central, em vez de os criar diretamente com \"new\" — aumenta a flexibilidade e a intercambiabilidade.","correct":true},{"text":"Ein Entwurfsmuster, das sicherstellt, dass von einer Klasse zur Laufzeit nur genau eine Instanz existiert.","textPt":"Um padrão de design que garante que, em tempo de execução, existe exatamente uma única instância de uma classe.","correct":false},{"text":"Ein Entwurfsmuster, bei dem registrierte Beobachter automatisch über Zustandsänderungen benachrichtigt werden.","textPt":"Um padrão de design em que os observadores registados são automaticamente notificados sobre alterações de estado.","correct":false},{"text":"Eine Softwarearchitektur, die eine Anwendung in Präsentation, Logik und Datenzugriff aufteilt.","textPt":"Uma arquitetura de software que divide uma aplicação em apresentação, lógica e acesso a dados.","correct":false}]},
{"cat":"algo","sub":"pattern","q":"Was beschreibt das MVC-Architekturmuster?","qPt":"O que descreve o padrão de arquitetura MVC?","a":"Model-View-Controller trennt eine Anwendung in Datenmodell (Model), Darstellung (View) und Steuerungslogik (Controller), um Zuständigkeiten zu entkoppeln und Wartbarkeit zu erhöhen.","aPt":"Model-View-Controller separa uma aplicação em modelo de dados (Model), apresentação (View) e lógica de controlo (Controller), de modo a desacoplar responsabilidades e aumentar a manutenibilidade.","options":[{"text":"Eine Softwarearchitektur, die eine Anwendung in aufeinander aufbauende Schichten unterteilt, wobei jede Schicht nur mit den angrenzenden kommuniziert.","textPt":"Uma arquitetura de software que divide uma aplicação em camadas sucessivas, em que cada camada só comunica com as camadas adjacentes.","correct":false},{"text":"Ein Entwurfsmuster, das die Objekterzeugung über eine zentrale Methode kapselt, statt Objekte direkt mit \"new\" zu erzeugen.","textPt":"Um padrão de design que encapsula a criação de objetos através de um método central, em vez de os criar diretamente com \"new\".","correct":false},{"text":"Ein Architekturmodell, bei dem Clients Anfragen an einen zentralen Server stellen, der die Anfragen bearbeitet.","textPt":"Um modelo de arquitetura em que os clientes enviam pedidos a um servidor central, que processa esses pedidos.","correct":false},{"text":"Model-View-Controller trennt eine Anwendung in Datenmodell, Darstellung und Steuerungslogik, um Zuständigkeiten zu entkoppeln und Wartbarkeit zu erhöhen.","textPt":"Model-View-Controller separa uma aplicação em modelo de dados, apresentação e lógica de controlo, para desacoplar responsabilidades e aumentar a manutenibilidade.","correct":true}]},
{"cat":"algo","sub":"pattern","q":"Was ist eine Schichtenarchitektur (Layered Architecture)?","qPt":"O que é uma arquitetura em camadas (Layered Architecture)?","a":"Eine Softwarearchitektur, die eine Anwendung in aufeinander aufbauende Schichten (z. B. Präsentation, Logik, Datenzugriff) unterteilt, wobei jede Schicht nur mit den angrenzenden kommuniziert.","aPt":"Uma arquitetura de software que divide uma aplicação em camadas sucessivas (por exemplo, apresentação, lógica, acesso a dados), em que cada camada comunica apenas com as camadas adjacentes.","options":[{"text":"Model-View-Controller trennt eine Anwendung in Datenmodell, Darstellung und Steuerungslogik.","textPt":"Model-View-Controller separa uma aplicação em modelo de dados, apresentação e lógica de controlo.","correct":false},{"text":"Eine Softwarearchitektur, die eine Anwendung in aufeinander aufbauende Schichten (z. B. Präsentation, Logik, Datenzugriff) unterteilt, wobei jede Schicht nur mit den angrenzenden kommuniziert.","textPt":"Uma arquitetura de software que divide uma aplicação em camadas sucessivas (por exemplo, apresentação, lógica, acesso a dados), em que cada camada só comunica com as camadas adjacentes.","correct":true},{"text":"Ein Entwurfsmuster, das sicherstellt, dass von jeder Schicht einer Anwendung nur eine Instanz zur Laufzeit existiert.","textPt":"Um padrão de design que garante que existe apenas uma instância de cada camada de uma aplicação em tempo de execução.","correct":false},{"text":"Eine Programmierschnittstelle, die über HTTP-Methoden zustandslos auf Ressourcen zugreift, die über URLs identifiziert werden.","textPt":"Uma interface de programação que acede, de forma stateless, a recursos identificados por URLs através de métodos HTTP.","correct":false}]},
{"cat":"algo","sub":"pattern","q":"Was ist ein Client-Server-Modell?","qPt":"O que é um modelo cliente-servidor?","a":"Ein Architekturmodell, bei dem Clients Anfragen an einen zentralen Server stellen, der Ressourcen/Dienste bereitstellt und die Anfragen bearbeitet.","aPt":"Um modelo de arquitetura em que os clientes fazem pedidos a um servidor central, que fornece recursos/serviços e processa esses pedidos.","options":[{"text":"Ein Architekturmodell, bei dem gleichberechtigte Knoten direkt miteinander kommunizieren, ohne zentralen Server.","textPt":"Um modelo de arquitetura em que nós equivalentes comunicam diretamente entre si, sem servidor central.","correct":false},{"text":"Ein Architekturmuster, das eine Anwendung in Model, View und Controller aufteilt.","textPt":"Um padrão de arquitetura que divide uma aplicação em Model, View e Controller.","correct":false},{"text":"Ein Architekturmodell, bei dem Clients Anfragen an einen zentralen Server stellen, der Ressourcen/Dienste bereitstellt und die Anfragen bearbeitet.","textPt":"Um modelo de arquitetura em que os clientes enviam pedidos a um servidor central, que fornece recursos/serviços e processa esses pedidos.","correct":true},{"text":"Eine Softwarearchitektur, die eine Anwendung in Präsentation, Logik und Datenzugriff aufteilt.","textPt":"Uma arquitetura de software que divide uma aplicação em apresentação, lógica e acesso a dados.","correct":false}]},
{"cat":"algo","sub":"pattern","q":"Was ist eine REST-API?","qPt":"O que é uma API REST?","a":"Eine Programmierschnittstelle, die dem REST-Architekturstil folgt und über HTTP-Methoden (GET, POST, PUT, DELETE) zustandslos auf Ressourcen zugreift, die über URLs identifiziert werden.","aPt":"Uma interface de programação que segue o estilo arquitetural REST e acede a recursos, identificados por URLs, de forma sem estado (stateless), através de métodos HTTP (GET, POST, PUT, DELETE).","options":[{"text":"Eine Programmierschnittstelle, die dem REST-Architekturstil folgt und über HTTP-Methoden (GET, POST, PUT, DELETE) zustandslos auf Ressourcen zugreift, die über URLs identifiziert werden.","textPt":"Uma interface de programação que segue o estilo arquitetural REST e acede, de forma stateless, a recursos identificados por URLs, através de métodos HTTP (GET, POST, PUT, DELETE).","correct":true},{"text":"Eine Programmierschnittstelle, die zwischen Anfragen stets den Sitzungszustand auf dem Server speichert.","textPt":"Uma interface de programação que mantém sempre o estado da sessão no servidor entre pedidos.","correct":false},{"text":"Ein Datenaustauschformat, das ähnlich wie JSON und XML strukturierte Daten darstellt.","textPt":"Um formato de troca de dados que representa dados estruturados de forma semelhante a JSON e XML.","correct":false},{"text":"Eine Programmierschnittstelle, die ausschließlich GET-Anfragen zum Abrufen von Daten erlaubt.","textPt":"Uma interface de programação que permite exclusivamente pedidos GET para obter dados.","correct":false}]},
{"cat":"algo","sub":"pattern","q":"Was ist der Unterschied zwischen JSON und XML?","qPt":"Qual é a diferença entre JSON e XML?","a":"Beides sind Datenformate zum Datenaustausch. JSON ist kompakter und einfacher lesbar (Schlüssel-Wert-Paare), XML ist ausführlicher mit Tags und erlaubt z. B. Attribute und Validierung über Schemas (XSD).","aPt":"Ambos são formatos de dados para troca de informação. O JSON é mais compacto e mais fácil de ler (pares chave-valor); o XML é mais extenso, usa tags e permite, por exemplo, atributos e validação através de esquemas (XSD).","options":[{"text":"JSON ist ausführlicher mit Tags, XML ist kompakter und einfacher lesbar mit Schlüssel-Wert-Paaren.","textPt":"O JSON é mais extenso e usa tags, o XML é mais compacto e fácil de ler com pares chave-valor.","correct":false},{"text":"JSON erlaubt Schema-Validierung über XSD, während XML keine Validierung unterstützt.","textPt":"O JSON permite validação por esquema através de XSD, enquanto o XML não suporta qualquer validação.","correct":false},{"text":"JSON und XML sind funktional identisch und ohne jeden Unterschied austauschbar.","textPt":"O JSON e o XML são funcionalmente idênticos e completamente intercambiáveis sem qualquer diferença.","correct":false},{"text":"Beides sind Datenformate; JSON ist kompakter und einfacher lesbar (Schlüssel-Wert-Paare), XML ist ausführlicher mit Tags und erlaubt z. B. Attribute und Schema-Validierung (XSD).","textPt":"Ambos são formatos de dados; o JSON é mais compacto e fácil de ler (pares chave-valor), o XML é mais extenso, usa tags e permite, por exemplo, atributos e validação por esquema (XSD).","correct":true}]},
{"cat":"algo","sub":"sql","q":"Was bedeutet ACID bei Datenbanktransaktionen?","qPt":"O que significa ACID nas transações de bases de dados?","a":"Atomicity (Alles-oder-nichts), Consistency (Konsistenz bleibt erhalten), Isolation (Transaktionen beeinflussen sich nicht gegenseitig) und Durability (Ergebnisse bleiben nach Abschluss dauerhaft erhalten).","aPt":"Atomicity/Atomicidade (tudo ou nada), Consistency/Consistência (a consistência é mantida), Isolation/Isolamento (as transações não se influenciam mutuamente) e Durability/Durabilidade (os resultados permanecem permanentemente após a conclusão).","options":[{"text":"Atomicity, Concurrency (gleichzeitige Ausführung mehrerer Transaktionen), Isolation und Durability.","textPt":"Atomicity, Concurrency (execução simultânea de várias transações), Isolation e Durability.","correct":false},{"text":"Atomicity (Alles-oder-nichts), Consistency (Konsistenz bleibt erhalten), Isolation (Transaktionen beeinflussen sich nicht gegenseitig) und Durability (Ergebnisse bleiben dauerhaft erhalten).","textPt":"Atomicity (tudo ou nada), Consistency (a consistência mantém-se), Isolation (as transações não se influenciam mutuamente) e Durability (os resultados mantêm-se de forma permanente).","correct":true},{"text":"Atomicity, Consistency, Integration (Integration mehrerer Datenbanken) und Durability.","textPt":"Atomicity, Consistency, Integration (integração de várias bases de dados) e Durability.","correct":false},{"text":"Availability (Verfügbarkeit), Consistency, Isolation und Durability.","textPt":"Availability (disponibilidade), Consistency, Isolation e Durability.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was ist ein Datenbankindex und wozu dient er?","qPt":"O que é um índice de base de dados e para que serve?","a":"Eine zusätzliche Datenstruktur, die den schnellen Zugriff auf Datensätze anhand bestimmter Spalten ermöglicht, ähnlich einem Buchregister — beschleunigt Lesezugriffe, verlangsamt aber Schreibzugriffe.","aPt":"Uma estrutura de dados adicional que permite o acesso rápido a registos com base em determinadas colunas, semelhante a um índice de um livro — acelera as leituras, mas torna as escritas mais lentas.","options":[{"text":"Eine vollständige Kopie der gesamten Tabelle, die ausschließlich zu Sicherungszwecken gespeichert wird.","textPt":"Uma cópia completa de toda a tabela, guardada exclusivamente para fins de backup.","correct":false},{"text":"Eine zusätzliche Datenstruktur, die sowohl Lese- als auch Schreibzugriffe gleichermaßen beschleunigt.","textPt":"Uma estrutura de dados adicional que acelera igualmente os acessos de leitura e de escrita.","correct":false},{"text":"Eine zusätzliche Datenstruktur, die den schnellen Zugriff auf Datensätze anhand bestimmter Spalten ermöglicht, ähnlich einem Buchregister — beschleunigt Lesezugriffe, verlangsamt aber Schreibzugriffe.","textPt":"Uma estrutura de dados adicional que permite o acesso rápido a registos com base em determinadas colunas, semelhante a um índice de livro — acelera as leituras, mas torna as escritas mais lentas.","correct":true},{"text":"Eine Struktur, die für jede Tabelle einer Datenbank zwingend vorhanden sein muss, um den Primärschlüssel zu definieren.","textPt":"Uma estrutura que tem obrigatoriamente de existir em cada tabela de uma base de dados para definir a chave primária.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was macht das SQL-Statement HAVING im Unterschied zu WHERE?","qPt":"O que faz a instrução SQL HAVING em comparação com WHERE?","a":"WHERE filtert einzelne Zeilen vor der Gruppierung, HAVING filtert Gruppen (z. B. Ergebnisse von Aggregatfunktionen) nach der Ausführung von GROUP BY.","aPt":"O WHERE filtra linhas individuais antes do agrupamento; o HAVING filtra grupos (por exemplo, resultados de funções de agregação) depois de executado o GROUP BY.","options":[{"text":"WHERE filtert einzelne Zeilen vor der Gruppierung, HAVING filtert Gruppen (z. B. Ergebnisse von Aggregatfunktionen) nach der Ausführung von GROUP BY.","textPt":"O WHERE filtra linhas individuais antes do agrupamento, o HAVING filtra grupos (por exemplo, resultados de funções de agregação) depois da execução do GROUP BY.","correct":true},{"text":"HAVING filtert einzelne Zeilen vor der Gruppierung, WHERE filtert Gruppen nach der Ausführung von GROUP BY.","textPt":"O HAVING filtra linhas individuais antes do agrupamento, o WHERE filtra grupos depois da execução do GROUP BY.","correct":false},{"text":"WHERE und HAVING filtern auf identische Weise, HAVING ist lediglich die modernere Syntax für WHERE.","textPt":"O WHERE e o HAVING filtram exatamente da mesma forma, sendo o HAVING apenas a sintaxe mais moderna do WHERE.","correct":false},{"text":"WHERE filtert Gruppen nach der Aggregation, ORDER BY filtert einzelne Zeilen vor der Gruppierung.","textPt":"O WHERE filtra grupos depois da agregação, o ORDER BY filtra linhas individuais antes do agrupamento.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was macht ein RIGHT JOIN in SQL?","qPt":"O que faz um RIGHT JOIN em SQL?","a":"Er liefert alle Datensätze der rechten Tabelle sowie die übereinstimmenden Datensätze der linken Tabelle; gibt es keine Übereinstimmung, werden NULL-Werte für die linke Tabelle eingesetzt.","aPt":"Devolve todos os registos da tabela da direita, juntamente com os registos correspondentes da tabela da esquerda; quando não há correspondência, são colocados valores NULL para a tabela da esquerda.","options":[{"text":"Er liefert alle Datensätze der linken Tabelle sowie die übereinstimmenden Datensätze der rechten Tabelle.","textPt":"Devolve todos os registos da tabela da esquerda, bem como os registos correspondentes da tabela da direita.","correct":false},{"text":"Er liefert nur Datensätze, die in beiden Tabellen eine Übereinstimmung haben.","textPt":"Devolve apenas registos que têm correspondência em ambas as tabelas.","correct":false},{"text":"Er liefert nur die Datensätze der rechten Tabelle, die keine Übereinstimmung in der linken Tabelle haben.","textPt":"Devolve apenas os registos da tabela da direita que não têm correspondência na tabela da esquerda.","correct":false},{"text":"Er liefert alle Datensätze der rechten Tabelle sowie die übereinstimmenden Datensätze der linken Tabelle; gibt es keine Übereinstimmung, werden NULL-Werte für die linke Tabelle eingesetzt.","textPt":"Devolve todos os registos da tabela da direita, bem como os registos correspondentes da tabela da esquerda; quando não há correspondência, são colocados valores NULL para a tabela da esquerda.","correct":true}]},
{"cat":"algo","sub":"sql","q":"Was ist eine Subquery (Unterabfrage) in SQL?","qPt":"O que é uma subquery (subconsulta) em SQL?","a":"Eine SQL-Abfrage, die innerhalb einer anderen Abfrage verschachtelt ist, z. B. in der WHERE- oder FROM-Klausel, um Zwischenergebnisse weiterzuverarbeiten.","aPt":"Uma consulta SQL aninhada dentro de outra consulta, por exemplo na cláusula WHERE ou FROM, para processar resultados intermédios.","options":[{"text":"Eine gespeicherte Prozedur, die während der Ausführung einer Abfrage automatisch aufgerufen wird.","textPt":"Um procedimento armazenado que é chamado automaticamente durante a execução de uma consulta.","correct":false},{"text":"Eine SQL-Abfrage, die innerhalb einer anderen Abfrage verschachtelt ist, z. B. in der WHERE- oder FROM-Klausel, um Zwischenergebnisse weiterzuverarbeiten.","textPt":"Uma consulta SQL aninhada dentro de outra consulta, por exemplo na cláusula WHERE ou FROM, para processar resultados intermédios.","correct":true},{"text":"Eine Abfrage, die zwei Tabellen anhand einer Fremdschlüsselbeziehung miteinander verbindet.","textPt":"Uma consulta que combina duas tabelas com base numa relação de chave estrangeira.","correct":false},{"text":"Eine Abfrage, die dauerhaft als eigenständiges Objekt in der Datenbank gespeichert wird, um wiederverwendet zu werden.","textPt":"Uma consulta guardada de forma permanente como um objeto próprio na base de dados, para ser reutilizada.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was ist der Unterschied zwischen DDL und DML in SQL?","qPt":"Qual é a diferença entre DDL e DML em SQL?","a":"DDL (Data Definition Language, z. B. CREATE, ALTER, DROP) definiert die Struktur der Datenbank. DML (Data Manipulation Language, z. B. SELECT, INSERT, UPDATE, DELETE) bearbeitet die Daten selbst.","aPt":"O DDL (Data Definition Language, por exemplo CREATE, ALTER, DROP) define a estrutura da base de dados. O DML (Data Manipulation Language, por exemplo SELECT, INSERT, UPDATE, DELETE) manipula os próprios dados.","options":[{"text":"DDL (z. B. CREATE, ALTER, DROP) definiert die Datenbankstruktur, DML (z. B. SELECT, INSERT, UPDATE, DELETE) bearbeitet die Daten selbst.","textPt":"DDL (p. ex. CREATE, ALTER, DROP) define a estrutura da base de dados, DML (p. ex. SELECT, INSERT, UPDATE, DELETE) manipula os próprios dados.","correct":true},{"text":"DDL (z. B. SELECT, INSERT, UPDATE) bearbeitet die Daten, DML (z. B. CREATE, ALTER, DROP) definiert die Struktur.","textPt":"DDL (p. ex. SELECT, INSERT, UPDATE) manipula os dados, DML (p. ex. CREATE, ALTER, DROP) define a estrutura.","correct":false},{"text":"DDL verwaltet Zugriffsrechte wie GRANT und REVOKE, DML definiert die Tabellenstruktur.","textPt":"DDL gere permissões de acesso como GRANT e REVOKE, DML define a estrutura das tabelas.","correct":false},{"text":"Beide Begriffe bezeichnen dasselbe – nur unterschiedliche Bezeichnungen für Datenbankbefehle je nach Hersteller.","textPt":"Ambos os termos designam o mesmo conceito — apenas denominações diferentes conforme o fabricante.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was bewirkt das SQL-Statement DELETE im Vergleich zu TRUNCATE?","qPt":"O que faz a instrução SQL DELETE em comparação com TRUNCATE?","a":"DELETE löscht (optional gefilterte) Zeilen einzeln und protokolliert sie im Transaktionslog, ist rückgängig machbar. TRUNCATE entfernt alle Zeilen einer Tabelle auf einmal, meist schneller, aber nicht zeilenweise protokolliert.","aPt":"O DELETE apaga linhas (opcionalmente filtradas) uma a uma e regista-as no log de transações, sendo reversível. O TRUNCATE remove todas as linhas de uma tabela de uma só vez, geralmente mais rápido, mas sem registo linha a linha.","options":[{"text":"TRUNCATE kann mit WHERE gefiltert werden und einzelne Zeilen löschen, DELETE löscht immer die ganze Tabelle.","textPt":"TRUNCATE pode ser filtrado com WHERE e eliminar linhas individuais, DELETE elimina sempre a tabela inteira.","correct":false},{"text":"DELETE löscht (optional gefilterte) Zeilen einzeln und protokolliert sie im Transaktionslog, ist rückgängig machbar; TRUNCATE entfernt alle Zeilen auf einmal, meist schneller, aber nicht zeilenweise protokolliert.","textPt":"DELETE elimina linhas (opcionalmente filtradas) uma a uma e regista-as no log de transações, sendo reversível; TRUNCATE remove todas as linhas de uma vez, normalmente mais rápido, mas sem registo linha a linha.","correct":true},{"text":"DELETE und TRUNCATE sind funktional identisch, der einzige Unterschied liegt in der Schreibweise.","textPt":"DELETE e TRUNCATE são funcionalmente idênticos, a única diferença está na sintaxe.","correct":false},{"text":"TRUNCATE protokolliert jede gelöschte Zeile einzeln im Transaktionslog und ist deshalb langsamer als DELETE.","textPt":"TRUNCATE regista cada linha eliminada individualmente no log de transações, sendo por isso mais lento que o DELETE.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was ist ein zusammengesetzter Schlüssel (Composite Key)?","qPt":"O que é uma chave composta (Composite Key)?","a":"Ein Primärschlüssel, der aus mehreren Spalten besteht, die zusammen einen Datensatz eindeutig identifizieren.","aPt":"Uma chave primária composta por várias colunas que, em conjunto, identificam de forma única um registo.","options":[{"text":"Ein Fremdschlüssel, der auf mehrere verschiedene Tabellen gleichzeitig verweist.","textPt":"Uma chave estrangeira que aponta simultaneamente para várias tabelas diferentes.","correct":false},{"text":"Ein Index, der mehrere Spalten unabhängig voneinander eindeutig macht, auch einzeln betrachtet.","textPt":"Um índice que torna várias colunas únicas de forma independente, mesmo consideradas isoladamente.","correct":false},{"text":"Ein Primärschlüssel, der aus mehreren Spalten besteht, die zusammen einen Datensatz eindeutig identifizieren.","textPt":"Uma chave primária composta por várias colunas que, em conjunto, identificam um registo de forma única.","correct":true},{"text":"Ein Schlüssel, der aus einer einzigen Spalte besteht, aber mehrere Tabellen referenziert.","textPt":"Uma chave composta por uma única coluna, mas que referencia várias tabelas.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was ist die Boyce-Codd-Normalform (BCNF)?","qPt":"O que é a Forma Normal de Boyce-Codd (BCNF)?","a":"Eine Verschärfung der 3NF: Für jede funktionale Abhängigkeit muss die linke Seite ein Superschlüssel sein — beseitigt bestimmte Anomalien, die die 3NF noch zulässt.","aPt":"Um reforço da 3FN: para cada dependência funcional, o lado esquerdo tem de ser uma superchave — elimina determinadas anomalias que a 3FN ainda permite.","options":[{"text":"BCNF verlangt nur, dass es keine transitiven Abhängigkeiten gibt, was bereits die Definition der 2NF ist.","textPt":"BCNF exige apenas a ausência de dependências transitivas, o que já corresponde à definição da 2FN.","correct":false},{"text":"BCNF ist eine schwächere Form der 3NF, die mehr Redundanz als 3NF zulässt.","textPt":"BCNF é uma forma mais fraca da 3FN, que permite mais redundância do que a 3FN.","correct":false},{"text":"BCNF fordert, dass jede Tabelle nur atomare Werte enthält und keine Wiederholungsgruppen aufweist.","textPt":"BCNF exige que cada tabela contenha apenas valores atómicos e não tenha grupos repetidos.","correct":false},{"text":"Eine Verschärfung der 3NF: Für jede funktionale Abhängigkeit muss die linke Seite ein Superschlüssel sein – beseitigt bestimmte Anomalien, die die 3NF noch zulässt.","textPt":"Um reforço da 3FN: para cada dependência funcional, o lado esquerdo tem de ser uma superchave – elimina certas anomalias que a 3FN ainda permite.","correct":true}]},
{"cat":"algo","sub":"sql","q":"Was ist eine Anomalie in einer nicht normalisierten Datenbank?","qPt":"O que é uma anomalia numa base de dados não normalizada?","a":"Unerwünschte Effekte wie Einfüge-, Änderungs- oder Löschanomalien, die durch redundante Datenspeicherung entstehen können und durch Normalisierung vermieden werden.","aPt":"Efeitos indesejados, como anomalias de inserção, de atualização ou de eliminação, que podem surgir devido ao armazenamento redundante de dados e que são evitados através da normalização.","options":[{"text":"Unerwünschte Effekte wie Einfüge-, Änderungs- oder Löschanomalien, die durch redundante Datenspeicherung entstehen können und durch Normalisierung vermieden werden.","textPt":"Efeitos indesejados como anomalias de inserção, atualização ou eliminação, causados por armazenamento redundante de dados, evitados através da normalização.","correct":true},{"text":"Ein Programmierfehler in der Datenbank-Software, der durch fehlerhafte SQL-Syntax entsteht.","textPt":"Um erro de programação no software da base de dados, causado por sintaxe SQL incorreta.","correct":false},{"text":"Ein Sicherheitsproblem, das entsteht, wenn Benutzer zu viele Zugriffsrechte auf Tabellen besitzen.","textPt":"Um problema de segurança que surge quando os utilizadores têm demasiadas permissões de acesso às tabelas.","correct":false},{"text":"Ein Leistungsproblem, das durch zu viele Indizes auf einer Tabelle verursacht wird.","textPt":"Um problema de desempenho causado por demasiados índices numa tabela.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was ist der Unterschied zwischen einem Primärschlüssel und einem Unique-Constraint?","qPt":"Qual é a diferença entre uma chave primária e uma restrição Unique (Unique Constraint)?","a":"Ein Primärschlüssel identifiziert einen Datensatz eindeutig und darf nicht NULL sein; pro Tabelle gibt es nur einen. Ein Unique-Constraint erzwingt ebenfalls Eindeutigkeit, erlaubt aber NULL-Werte und kann mehrfach pro Tabelle vergeben werden.","aPt":"Uma chave primária identifica um registo de forma única e não pode ser NULL; só pode existir uma por tabela. Uma restrição Unique também garante a unicidade, mas permite valores NULL e pode ser definida várias vezes na mesma tabela.","options":[{"text":"Primärschlüssel erlaubt NULL-Werte und kann mehrfach vergeben werden, Unique-Constraint darf nicht NULL sein und nur einmal vorkommen.","textPt":"A chave primária permite valores NULL e pode ser definida várias vezes, o Unique-Constraint não pode ser NULL e só pode existir uma vez.","correct":false},{"text":"Ein Primärschlüssel identifiziert einen Datensatz eindeutig und darf nicht NULL sein; pro Tabelle gibt es nur einen. Ein Unique-Constraint erzwingt ebenfalls Eindeutigkeit, erlaubt aber NULL-Werte und kann mehrfach pro Tabelle vergeben werden.","textPt":"Uma chave primária identifica um registo de forma única e não pode ser NULL; só existe uma por tabela. Um Unique-Constraint também impõe unicidade, mas permite valores NULL e pode ser definido várias vezes por tabela.","correct":true},{"text":"Beide erlauben beliebig viele NULL-Werte und unterscheiden sich nur in der Groß-/Kleinschreibung des Constraints.","textPt":"Ambos permitem qualquer número de valores NULL e só se distinguem pelas maiúsculas/minúsculas usadas na restrição.","correct":false},{"text":"Ein Primärschlüssel kann mehrfach pro Tabelle definiert werden, ein Unique-Constraint nur einmal.","textPt":"Uma chave primária pode ser definida várias vezes por tabela, um Unique-Constraint apenas uma vez.","correct":false}]},
{"cat":"algo","sub":"netz","q":"Was ist das OSI-Referenzmodell?","qPt":"O que é o modelo de referência OSI?","a":"Ein 7-Schichten-Modell zur Beschreibung der Kommunikation in Netzwerken, von der physikalischen Übertragung (Schicht 1) bis zur Anwendung (Schicht 7).","aPt":"Um modelo de 7 camadas para descrever a comunicação em redes, desde a transmissão física (camada 1) até à aplicação (camada 7).","options":[{"text":"Ein 5-Schichten-Modell, das speziell für die Verschlüsselung von Internetverbindungen entwickelt wurde.","textPt":"Um modelo de 5 camadas desenvolvido especificamente para a encriptação de ligações à Internet.","correct":false},{"text":"Ein 7-Schichten-Modell, bei dem Schicht 1 die Anwendung und Schicht 7 die physikalische Übertragung beschreibt.","textPt":"Um modelo de 7 camadas em que a camada 1 descreve a aplicação e a camada 7 a transmissão física.","correct":false},{"text":"Ein 7-Schichten-Modell zur Beschreibung der Kommunikation in Netzwerken, von der physikalischen Übertragung (Schicht 1) bis zur Anwendung (Schicht 7).","textPt":"Um modelo de 7 camadas para descrever a comunicação em redes, desde a transmissão física (camada 1) até à aplicação (camada 7).","correct":true},{"text":"Ein Protokoll, das die Zuweisung von IP-Adressen in einem lokalen Netzwerk regelt.","textPt":"Um protocolo que regula a atribuição de endereços IP numa rede local.","correct":false}]},
{"cat":"algo","sub":"netz","q":"Auf welcher OSI-Schicht arbeitet ein Switch, auf welcher ein Router?","qPt":"Em que camada OSI opera um switch e em que camada opera um router?","a":"Ein (klassischer) Switch arbeitet auf Schicht 2 (Sicherungsschicht, MAC-Adressen), ein Router auf Schicht 3 (Vermittlungsschicht, IP-Adressen).","aPt":"Um switch (clássico) opera na camada 2 (camada de ligação de dados, endereços MAC); um router opera na camada 3 (camada de rede, endereços IP).","options":[{"text":"Ein Switch arbeitet auf Schicht 3 (IP-Adressen), ein Router auf Schicht 2 (MAC-Adressen).","textPt":"Um switch opera na camada 3 (endereços IP), um router na camada 2 (endereços MAC).","correct":false},{"text":"Beide arbeiten auf Schicht 1, da sie nur elektrische Signale weiterleiten.","textPt":"Ambos operam na camada 1, pois apenas transmitem sinais elétricos.","correct":false},{"text":"Ein Switch arbeitet auf Schicht 4 (Transportschicht), ein Router auf Schicht 7 (Anwendungsschicht).","textPt":"Um switch opera na camada 4 (camada de transporte), um router na camada 7 (camada de aplicação).","correct":false},{"text":"Ein (klassischer) Switch arbeitet auf Schicht 2 (Sicherungsschicht, MAC-Adressen), ein Router auf Schicht 3 (Vermittlungsschicht, IP-Adressen).","textPt":"Um switch (clássico) opera na camada 2 (camada de enlace, endereços MAC), um router na camada 3 (camada de rede, endereços IP).","correct":true}]},
{"cat":"algo","sub":"netz","q":"Was ist der Unterschied zwischen TCP und UDP?","qPt":"Qual é a diferença entre TCP e UDP?","a":"TCP ist verbindungsorientiert, stellt eine zuverlässige, geordnete Übertragung mit Fehlerkorrektur sicher. UDP ist verbindungslos, schneller, aber ohne Garantie für Zustellung oder Reihenfolge.","aPt":"O TCP é orientado à ligação e garante uma transmissão fiável e ordenada, com correção de erros. O UDP não é orientado à ligação, é mais rápido, mas não garante a entrega nem a ordem dos dados.","options":[{"text":"TCP ist verbindungsorientiert, stellt eine zuverlässige, geordnete Übertragung mit Fehlerkorrektur sicher. UDP ist verbindungslos, schneller, aber ohne Garantie für Zustellung oder Reihenfolge.","textPt":"TCP é orientado à ligação e garante uma transmissão fiável e ordenada com correção de erros. UDP não é orientado à ligação, é mais rápido, mas sem garantia de entrega ou ordem.","correct":true},{"text":"TCP ist verbindungslos und schneller, UDP ist verbindungsorientiert und zuverlässig.","textPt":"TCP não é orientado à ligação e é mais rápido, UDP é orientado à ligação e fiável.","correct":false},{"text":"TCP und UDP unterscheiden sich nur in der Portnummer, die sie standardmäßig verwenden.","textPt":"TCP e UDP diferem apenas no número de porta que utilizam por defeito.","correct":false},{"text":"UDP garantiert die Zustellung aller Pakete, benötigt dafür aber mehr Overhead als TCP.","textPt":"UDP garante a entrega de todos os pacotes, mas necessita de mais overhead do que o TCP.","correct":false}]},
{"cat":"algo","sub":"netz","q":"Was ist eine IP-Adresse?","qPt":"O que é um endereço IP?","a":"Eine eindeutige Adresse, die ein Gerät in einem Netzwerk identifiziert und die Kommunikation über das Internetprotokoll ermöglicht (z. B. IPv4 oder IPv6).","aPt":"Um endereço único que identifica um dispositivo numa rede e permite a comunicação através do protocolo de Internet (por exemplo, IPv4 ou IPv6).","options":[{"text":"Eine Adresse, die fest in der Netzwerkkarte eingebrannt ist und sich nie ändern kann.","textPt":"Um endereço gravado de forma fixa na placa de rede, que nunca pode ser alterado.","correct":false},{"text":"Eine eindeutige Adresse, die ein Gerät in einem Netzwerk identifiziert und die Kommunikation über das Internetprotokoll ermöglicht (z. B. IPv4 oder IPv6).","textPt":"Um endereço único que identifica um dispositivo numa rede e permite a comunicação através do protocolo Internet (p. ex. IPv4 ou IPv6).","correct":true},{"text":"Ein Name, der von einem DNS-Server für jedes Gerät automatisch vergeben wird und Domainnamen ersetzt.","textPt":"Um nome atribuído automaticamente a cada dispositivo por um servidor DNS, substituindo os nomes de domínio.","correct":false},{"text":"Eine Adresse, die nur innerhalb eines einzelnen Subnetzes gültig ist und außerhalb davon ignoriert wird.","textPt":"Um endereço válido apenas dentro de uma única sub-rede, sendo ignorado fora dela.","correct":false}]},
{"cat":"algo","sub":"netz","q":"Was macht eine Subnetzmaske?","qPt":"O que faz uma máscara de subrede?","a":"Sie legt fest, welcher Teil einer IP-Adresse das Netzwerk und welcher Teil das einzelne Gerät (Host) innerhalb dieses Netzwerks bezeichnet.","aPt":"Define qual a parte de um endereço IP que identifica a rede e qual a parte que identifica o dispositivo (host) individual dentro dessa rede.","options":[{"text":"Sie verschlüsselt die IP-Adresse, damit sie bei der Übertragung nicht abgehört werden kann.","textPt":"Encripta o endereço IP, para que não possa ser intercetado durante a transmissão.","correct":false},{"text":"Sie übersetzt die IP-Adresse eines Geräts in dessen MAC-Adresse.","textPt":"Traduz o endereço IP de um dispositivo para o respetivo endereço MAC.","correct":false},{"text":"Sie legt fest, welcher Teil einer IP-Adresse das Netzwerk und welcher Teil das einzelne Gerät (Host) innerhalb dieses Netzwerks bezeichnet.","textPt":"Define qual a parte de um endereço IP que identifica a rede e qual a parte que identifica o dispositivo (host) dentro dessa rede.","correct":true},{"text":"Sie legt fest, welcher Port für welchen Dienst auf einem Gerät reserviert ist.","textPt":"Define qual a porta reservada para cada serviço num dispositivo.","correct":false}]},
{"cat":"algo","sub":"netz","q":"Was macht ein DNS-Server?","qPt":"O que faz um servidor DNS?","a":"Er übersetzt menschenlesbare Domainnamen (z. B. www.example.com) in die zugehörigen IP-Adressen.","aPt":"Traduz nomes de domínio legíveis por humanos (por exemplo, www.example.com) nos respetivos endereços IP.","options":[{"text":"Er übersetzt IP-Adressen in die zugehörige MAC-Adresse eines Geräts im lokalen Netz.","textPt":"Traduz endereços IP no respetivo endereço MAC de um dispositivo na rede local.","correct":false},{"text":"Er verschlüsselt die Kommunikation zwischen Client und Server mittels TLS/SSL.","textPt":"Encripta a comunicação entre cliente e servidor através de TLS/SSL.","correct":false},{"text":"Er weist Geräten in einem Netzwerk automatisch eine freie IP-Adresse zu.","textPt":"Atribui automaticamente um endereço IP livre aos dispositivos numa rede.","correct":false},{"text":"Er übersetzt menschenlesbare Domainnamen (z. B. www.example.com) in die zugehörigen IP-Adressen.","textPt":"Traduz nomes de domínio legíveis por humanos (p. ex. www.example.com) nos respetivos endereços IP.","correct":true}]},
{"cat":"algo","sub":"netz","q":"Was ist der Unterschied zwischen HTTP und HTTPS?","qPt":"Qual é a diferença entre HTTP e HTTPS?","a":"HTTPS ist die verschlüsselte Variante von HTTP (mittels TLS/SSL) und schützt die Datenübertragung zwischen Client und Server vor Abhören und Manipulation.","aPt":"O HTTPS é a variante encriptada do HTTP (através de TLS/SSL) e protege a transmissão de dados entre o cliente e o servidor contra escutas e manipulação.","options":[{"text":"HTTPS ist die verschlüsselte Variante von HTTP (mittels TLS/SSL) und schützt die Datenübertragung zwischen Client und Server vor Abhören und Manipulation.","textPt":"HTTPS é a variante encriptada do HTTP (através de TLS/SSL) e protege a transmissão de dados entre cliente e servidor contra interceção e manipulação.","correct":true},{"text":"HTTP ist die verschlüsselte Variante von HTTPS und wird nur für interne Netzwerke verwendet.","textPt":"HTTP é a variante encriptada do HTTPS e é usado apenas em redes internas.","correct":false},{"text":"HTTPS unterscheidet sich von HTTP nur durch die Verwendung eines anderen Datenformats (XML statt HTML).","textPt":"HTTPS distingue-se do HTTP apenas por usar um formato de dados diferente (XML em vez de HTML).","correct":false},{"text":"HTTPS nutzt einen anderen Port als HTTP, verschlüsselt aber die Daten nicht zusätzlich.","textPt":"HTTPS usa uma porta diferente do HTTP, mas não encripta adicionalmente os dados.","correct":false}]},
{"cat":"algo","sub":"netz","q":"Was ist ein Port in der Netzwerkkommunikation?","qPt":"O que é uma porta (port) na comunicação em rede?","a":"Eine logische Adresse (0–65535), über die ein bestimmter Dienst/Prozess auf einem Gerät erreichbar ist, z. B. Port 80 für HTTP oder 443 für HTTPS.","aPt":"Um endereço lógico (0–65535) através do qual um determinado serviço/processo num dispositivo está acessível, por exemplo a porta 80 para HTTP ou a 443 para HTTPS.","options":[{"text":"Eine physische Schnittstelle am Netzwerkgerät, über die das Kabel angeschlossen wird.","textPt":"Uma interface física no dispositivo de rede, onde o cabo é ligado.","correct":false},{"text":"Eine logische Adresse (0–65535), über die ein bestimmter Dienst/Prozess auf einem Gerät erreichbar ist, z. B. Port 80 für HTTP oder 443 für HTTPS.","textPt":"Um endereço lógico (0–65535) através do qual um determinado serviço/processo num dispositivo é acessível, p. ex. a porta 80 para HTTP ou 443 para HTTPS.","correct":true},{"text":"Ein eindeutiger Name, der anstelle der IP-Adresse zur Identifikation eines Geräts verwendet wird.","textPt":"Um nome único usado em vez do endereço IP para identificar um dispositivo.","correct":false},{"text":"Eine Adresse im Bereich 0–255, die einem Gerät innerhalb eines Subnetzes zugewiesen wird.","textPt":"Um endereço no intervalo 0–255, atribuído a um dispositivo dentro de uma sub-rede.","correct":false}]},
{"cat":"algo","sub":"rekursion","q":"Was ist der Unterschied zwischen Binär- und Hexadezimalsystem?","qPt":"Qual é a diferença entre o sistema binário e o sistema hexadecimal?","a":"Das Binärsystem nutzt die Basis 2 (Ziffern 0/1), das Hexadezimalsystem die Basis 16 (Ziffern 0–9, A–F). Hexadezimalzahlen werden oft genutzt, um Binärzahlen kompakter darzustellen (4 Bit = 1 Hex-Ziffer).","aPt":"O sistema binário usa a base 2 (algarismos 0/1), o sistema hexadecimal usa a base 16 (algarismos 0–9, A–F). Os números hexadecimais são frequentemente usados para representar números binários de forma mais compacta (4 bits = 1 algarismo hexadecimal).","options":[{"text":"Das Binärsystem nutzt die Basis 16, das Hexadezimalsystem die Basis 2 – beide stellen Zahlen identisch dar, nur mit anderen Zeichen.","textPt":"O sistema binário usa base 16, o sistema hexadecimal usa base 2 – ambos representam números de forma idêntica, apenas com símbolos diferentes.","correct":false},{"text":"Das Hexadezimalsystem nutzt nur die Ziffern 0–9, während das Binärsystem zusätzlich die Buchstaben A–F verwendet.","textPt":"O sistema hexadecimal usa apenas os algarismos 0–9, enquanto o sistema binário usa também as letras A–F.","correct":false},{"text":"Das Binärsystem nutzt die Basis 2 (Ziffern 0/1), das Hexadezimalsystem die Basis 16 (Ziffern 0–9, A–F). Hexadezimalzahlen werden oft genutzt, um Binärzahlen kompakter darzustellen (4 Bit = 1 Hex-Ziffer).","textPt":"O sistema binário usa base 2 (algarismos 0/1), o sistema hexadecimal usa base 16 (algarismos 0–9, A–F). Os números hexadecimais são muitas vezes usados para representar números binários de forma mais compacta (4 bits = 1 algarismo hexadecimal).","correct":true},{"text":"Im Binärsystem entsprechen 8 Bit einer Hexadezimalziffer, im Hexadezimalsystem sind es nur 2 Bit.","textPt":"No sistema binário, 8 bits correspondem a um algarismo hexadecimal; no sistema hexadecimal, são apenas 2 bits.","correct":false}]},
{"cat":"algo","sub":"rekursion","q":"Wie wird eine negative Zahl im Zweierkomplement dargestellt?","qPt":"Como é representado um número negativo em complemento de dois?","a":"Man invertiert alle Bits der positiven Binärdarstellung und addiert 1 — dadurch lassen sich Addition/Subtraktion einheitlich mit demselben Rechenwerk durchführen.","aPt":"Inverte-se todos os bits da representação binária positiva e soma-se 1 — isto permite realizar a adição/subtração de forma uniforme com a mesma unidade de cálculo.","options":[{"text":"Man invertiert alle Bits und addiert 2, damit das Ergebnis immer eine gerade Zahl ergibt.","textPt":"Inverte-se todos os bits e soma-se 2, para que o resultado seja sempre um número par.","correct":false},{"text":"Man stellt einfach ein zusätzliches Vorzeichenbit vor die unveränderte positive Binärzahl.","textPt":"Basta colocar um bit de sinal adicional antes do número binário positivo inalterado.","correct":false},{"text":"Man vertauscht das höchste und niedrigste Bit der positiven Binärdarstellung.","textPt":"Troca-se o bit mais significativo com o menos significativo da representação binária positiva.","correct":false},{"text":"Man invertiert alle Bits der positiven Binärdarstellung und addiert 1 – dadurch lassen sich Addition/Subtraktion einheitlich mit demselben Rechenwerk durchführen.","textPt":"Inverte-se todos os bits da representação binária positiva e soma-se 1 – isto permite efetuar adição/subtração de forma uniforme com a mesma unidade de cálculo.","correct":true}]},
{"cat":"algo","sub":"rekursion","q":"Was ist der Unterschied zwischen einer Exception und einem Syntaxfehler?","qPt":"Qual é a diferença entre uma exceção e um erro de sintaxe?","a":"Ein Syntaxfehler verletzt die Grammatikregeln der Sprache und verhindert die Kompilierung/Ausführung. Eine Exception ist ein Laufzeitfehler, der während der Programmausführung auftritt und abgefangen (try-catch) werden kann.","aPt":"Um erro de sintaxe viola as regras gramaticais da linguagem e impede a compilação/execução. Uma exceção é um erro em tempo de execução, que ocorre durante a execução do programa e pode ser tratado (try-catch).","options":[{"text":"Ein Syntaxfehler verletzt die Grammatikregeln der Sprache und verhindert die Kompilierung/Ausführung. Eine Exception ist ein Laufzeitfehler, der während der Programmausführung auftritt und abgefangen (try-catch) werden kann.","textPt":"Um erro de sintaxe viola as regras gramaticais da linguagem e impede a compilação/execução. Uma exceção é um erro de execução que ocorre durante a execução do programa e pode ser capturada (try-catch).","correct":true},{"text":"Eine Exception verhindert die Kompilierung des Programms, ein Syntaxfehler tritt erst zur Laufzeit auf.","textPt":"Uma exceção impede a compilação do programa, um erro de sintaxe ocorre apenas em tempo de execução.","correct":false},{"text":"Beide Fehlerarten lassen sich ausschließlich durch einen try-catch-Block abfangen und behandeln.","textPt":"Ambos os tipos de erro só podem ser capturados e tratados através de um bloco try-catch.","correct":false},{"text":"Ein Syntaxfehler kann mit try-catch abgefangen werden, eine Exception dagegen nicht.","textPt":"Um erro de sintaxe pode ser capturado com try-catch, uma exceção não.","correct":false}]},
{"cat":"algo","sub":"rekursion","q":"Wozu dient ein try-catch-Block?","qPt":"Para que serve um bloco try-catch?","a":"Um Programmcode, bei dem ein Laufzeitfehler auftreten könnte, gezielt abzusichern und im Fehlerfall (catch) eine definierte Behandlung statt eines Programmabsturzes auszuführen.","aPt":"Para proteger de forma específica trechos de código onde possa ocorrer um erro em tempo de execução e, em caso de erro (catch), executar um tratamento definido em vez de deixar o programa terminar abruptamente.","options":[{"text":"Um Syntaxfehler bereits vor der Kompilierung des Programms automatisch zu korrigieren.","textPt":"Para corrigir automaticamente erros de sintaxe ainda antes da compilação do programa.","correct":false},{"text":"Um Programmcode, bei dem ein Laufzeitfehler auftreten könnte, gezielt abzusichern und im Fehlerfall (catch) eine definierte Behandlung statt eines Programmabsturzes auszuführen.","textPt":"Para proteger de forma direcionada código onde possa ocorrer um erro de execução e, em caso de erro (catch), executar um tratamento definido em vez de o programa falhar.","correct":true},{"text":"Um die Ausführungsgeschwindigkeit des Programms zu erhöhen, indem Fehlerprüfungen übersprungen werden.","textPt":"Para aumentar a velocidade de execução do programa, saltando verificações de erro.","correct":false},{"text":"Um sicherzustellen, dass ein Programm niemals eine Exception auslösen kann.","textPt":"Para garantir que um programa nunca pode gerar uma exceção.","correct":false}]},
{"cat":"algo","sub":"praxis","q":"Was ist Test-Driven Development (TDD)?","qPt":"O que é o Test-Driven Development (TDD)?","a":"Eine Entwicklungsmethode, bei der zuerst ein (fehlschlagender) Test geschrieben wird, dann die minimale Implementierung, die den Test besteht, und anschließend der Code refaktorisiert wird.","aPt":"Um método de desenvolvimento em que primeiro se escreve um teste (que falha), depois a implementação mínima que faz o teste passar, e por fim o código é refatorizado.","options":[{"text":"Eine Entwicklungsmethode, bei der zuerst der gesamte Code fertiggestellt und erst danach ein einziger Test am Ende geschrieben wird.","textPt":"Um método de desenvolvimento em que todo o código é terminado primeiro e só depois se escreve um único teste no final.","correct":false},{"text":"Eine Entwicklungsmethode, bei der Tests ausschließlich von einem separaten Testteam nach Projektabschluss geschrieben werden.","textPt":"Um método de desenvolvimento em que os testes são escritos exclusivamente por uma equipa de testes separada após o fim do projeto.","correct":false},{"text":"Eine Entwicklungsmethode, bei der zuerst ein (fehlschlagender) Test geschrieben wird, dann die minimale Implementierung, die den Test besteht, und anschließend der Code refaktorisiert wird.","textPt":"Um método de desenvolvimento em que primeiro se escreve um teste (que falha), depois a implementação mínima que o faz passar, e a seguir se refatora o código.","correct":true},{"text":"Eine Entwicklungsmethode, bei der Tests parallel zur Implementierung geschrieben werden, aber niemals fehlschlagen dürfen.","textPt":"Um método de desenvolvimento em que os testes são escritos em paralelo com a implementação, mas nunca podem falhar.","correct":false}]},
{"cat":"algo","sub":"praxis","q":"Was macht der Git-Befehl \"commit\"?","qPt":"O que faz o comando Git \"commit\"?","a":"Er speichert die aktuell im Staging-Bereich vorgemerkten Änderungen dauerhaft als neuen Versionsstand (Snapshot) im lokalen Repository.","aPt":"Guarda de forma permanente as alterações atualmente marcadas na área de staging como um novo estado de versão (snapshot) no repositório local.","options":[{"text":"Er lädt die lokalen Änderungen direkt in das entfernte Repository (Remote) hoch.","textPt":"Envia diretamente as alterações locais para o repositório remoto.","correct":false},{"text":"Er markiert Änderungen zur späteren Übernahme, speichert sie aber noch nicht als Versionsstand.","textPt":"Marca alterações para inclusão posterior, mas ainda não as guarda como estado de versão.","correct":false},{"text":"Er erstellt einen neuen Branch mit allen bisherigen Änderungen des aktuellen Branches.","textPt":"Cria um novo branch com todas as alterações feitas até então no branch atual.","correct":false},{"text":"Er speichert die aktuell im Staging-Bereich vorgemerkten Änderungen dauerhaft als neuen Versionsstand (Snapshot) im lokalen Repository.","textPt":"Guarda de forma permanente as alterações atualmente marcadas na staging area como um novo estado de versão (snapshot) no repositório local.","correct":true}]},
{"cat":"algo","sub":"praxis","q":"Was ist ein Branch in Git?","qPt":"O que é um branch (ramo) no Git?","a":"Ein unabhängiger Entwicklungsstrang innerhalb eines Repositories, der parallele Arbeit ermöglicht, ohne den Hauptzweig (z. B. main) direkt zu verändern.","aPt":"Uma linha de desenvolvimento independente dentro de um repositório, que permite trabalhar em paralelo sem alterar diretamente o ramo principal (por exemplo, main).","options":[{"text":"Ein unabhängiger Entwicklungsstrang innerhalb eines Repositories, der parallele Arbeit ermöglicht, ohne den Hauptzweig (z. B. main) direkt zu verändern.","textPt":"Uma linha de desenvolvimento independente dentro de um repositório, que permite trabalho paralelo sem alterar diretamente o ramo principal (p. ex. main).","correct":true},{"text":"Eine Kopie des gesamten Repositories auf einem anderen Server zur Datensicherung.","textPt":"Uma cópia de todo o repositório noutro servidor para efeitos de salvaguarda.","correct":false},{"text":"Ein einzelner Commit, der die Unterschiede zwischen zwei Versionsständen speichert.","textPt":"Um único commit que guarda as diferenças entre dois estados de versão.","correct":false},{"text":"Ein Mechanismus, der automatisch alle Änderungen zweier Entwickler ohne Konflikte zusammenführt.","textPt":"Um mecanismo que combina automaticamente todas as alterações de dois desenvolvedores sem conflitos.","correct":false}]},
{"cat":"algo","sub":"praxis","q":"Was passiert beim Git-Befehl \"merge\"?","qPt":"O que acontece com o comando Git \"merge\"?","a":"Änderungen aus einem Branch werden mit einem anderen Branch zusammengeführt, wobei Git versucht, die Änderungen automatisch zu kombinieren.","aPt":"As alterações de um branch são combinadas com outro branch, sendo que o Git tenta combinar automaticamente as alterações.","options":[{"text":"Ein Branch wird dauerhaft gelöscht und alle seine Änderungen verworfen.","textPt":"Um branch é apagado permanentemente e todas as suas alterações são descartadas.","correct":false},{"text":"Änderungen aus einem Branch werden mit einem anderen Branch zusammengeführt, wobei Git versucht, die Änderungen automatisch zu kombinieren.","textPt":"As alterações de um branch são combinadas com outro branch, sendo que o Git tenta combinar as alterações automaticamente.","correct":true},{"text":"Ein neuer, unabhängiger Branch wird aus dem aktuellen Versionsstand erstellt.","textPt":"Um novo branch independente é criado a partir do estado de versão atual.","correct":false},{"text":"Lokale Änderungen werden ins entfernte Repository hochgeladen, ohne andere Branches zu berühren.","textPt":"As alterações locais são enviadas para o repositório remoto, sem afetar outros branches.","correct":false}]},
{"cat":"algo","sub":"praxis","q":"Was ist ein Merge-Konflikt in Git?","qPt":"O que é um conflito de merge no Git?","a":"Er tritt auf, wenn dieselbe Stelle einer Datei in zwei zusammenzuführenden Branches unterschiedlich verändert wurde und Git die Änderungen nicht automatisch vereinen kann — manuelle Auflösung ist nötig.","aPt":"Ocorre quando o mesmo trecho de um ficheiro foi alterado de forma diferente em dois branches que estão a ser combinados, e o Git não consegue unir automaticamente as alterações — é necessária a resolução manual.","options":[{"text":"Er tritt auf, wenn zwei Entwickler denselben Branch gleichzeitig auf unterschiedlichen Rechnern auschecken.","textPt":"Ocorre quando dois desenvolvedores fazem checkout do mesmo branch em simultâneo em computadores diferentes.","correct":false},{"text":"Er wird automatisch von Git gelöst, indem immer die neueste Änderung bevorzugt wird – ohne manuelles Eingreifen.","textPt":"É resolvido automaticamente pelo Git, privilegiando sempre a alteração mais recente – sem intervenção manual.","correct":false},{"text":"Er tritt auf, wenn dieselbe Stelle einer Datei in zwei zusammenzuführenden Branches unterschiedlich verändert wurde und Git die Änderungen nicht automatisch vereinen kann – manuelle Auflösung ist nötig.","textPt":"Ocorre quando o mesmo trecho de um ficheiro foi alterado de forma diferente em dois branches a combinar e o Git não consegue unir as alterações automaticamente – é necessária uma resolução manual.","correct":true},{"text":"Er tritt nur auf, wenn zwei verschiedene Dateien im selben Commit geändert wurden.","textPt":"Só ocorre quando dois ficheiros diferentes foram alterados no mesmo commit.","correct":false}]},
