{"cat":"plan","sub":"pm","q":"Was ist eine Netzplantechnik-Rückwärtsterminierung?","qPt":"O que é o escalonamento para trás (Rückwärtsterminierung) na técnica de planeamento em rede?","a":"Die Berechnung der spätestmöglichen Anfangs- und Endzeitpunkte aller Vorgänge, ausgehend vom (fixen) Projektende.","aPt":"O cálculo dos momentos de início e fim mais tardios possíveis de todas as atividades, partindo do fim (fixo) do projeto.","options":[{"text":"Berechnung der frühestmöglichen Anfangs- und Endzeitpunkte aller Vorgänge, ausgehend vom Projektstart.","textPt":"Cálculo dos pontos de início e fim mais precoces possíveis de todas as atividades, partindo do início do projeto.","correct":false},{"text":"Die grafische Darstellung aller Vorgänge als Balken entlang einer Zeitachse.","textPt":"A representação gráfica de todas as atividades como barras ao longo de um eixo temporal.","correct":false},{"text":"Berechnung der spätestmöglichen Anfangs- und Endzeitpunkte aller Vorgänge, ausgehend vom (fixen) Projektende.","textPt":"Cálculo dos pontos de início e fim mais tardios possíveis de todas as atividades, partindo do fim (fixo) do projeto.","correct":true},{"text":"Die Festlegung bedeutsamer, terminierter Ereignisse ohne eigene Dauer im Projektverlauf.","textPt":"A definição de eventos marcantes e datados, sem duração própria, ao longo do projeto.","correct":false}]},
{"cat":"plan","sub":"pm","q":"Was ist ein Puffer (Slack) in der Netzplantechnik?","qPt":"O que é uma margem de folga (slack) na técnica de planeamento em rede?","a":"Die Zeitspanne, um die sich ein Vorgang verschieben kann, ohne den Gesamtendtermin des Projekts zu gefährden.","aPt":"O período de tempo durante o qual uma atividade pode ser deslocada sem comprometer a data final global do projeto.","options":[{"text":"Die Zeitspanne, um die sich ein Vorgang verschieben kann, ohne den Gesamtendtermin des Projekts zu gefährden.","textPt":"A margem de tempo em que uma atividade pode ser deslocada sem pôr em risco o prazo final total do projeto.","correct":true},{"text":"Die reine Bearbeitungsdauer eines Vorgangs, gemessen vom frühesten bis zum spätesten Anfangszeitpunkt.","textPt":"A duração pura de execução de uma atividade, medida do início mais precoce ao mais tardio.","correct":false},{"text":"Die Zeitspanne, die ein Vorgang auf dem kritischen Pfad zusätzlich benötigt, um fertig zu werden.","textPt":"O tempo adicional que uma atividade no caminho crítico necessita para ser concluída.","correct":false},{"text":"Die Differenz zwischen dem spätesten Anfangszeitpunkt eines Vorgangs und dem frühesten Anfangszeitpunkt seines Vorgängers.","textPt":"A diferença entre o início mais tardio de uma atividade e o início mais precoce da atividade anterior.","correct":false}]},
{"cat":"plan","sub":"pm","q":"Was zeigt ein Gantt-Diagramm?","qPt":"O que mostra um diagrama de Gantt?","a":"Eine Balkendarstellung, die Vorgänge eines Projekts über die Zeitachse zeigt, inklusive Start-/Endzeitpunkten und teilweise Abhängigkeiten.","aPt":"Uma representação em barras que mostra as atividades de um projeto ao longo do eixo do tempo, incluindo datas de início/fim e, por vezes, as suas dependências.","options":[{"text":"Ein Diagramm, das ausschließlich die logischen Abhängigkeiten zwischen Vorgängen als Pfeile ohne Zeitbezug darstellt.","textPt":"Um diagrama que representa exclusivamente as dependências lógicas entre atividades como setas, sem referência temporal.","correct":false},{"text":"Eine Tabelle, die Stärken, Schwächen, Chancen und Risiken eines Projekts gegenüberstellt.","textPt":"Uma tabela que confronta forças, fraquezas, oportunidades e riscos de um projeto.","correct":false},{"text":"Eine Matrix, die den Einfluss und das Interesse aller Projektbeteiligten gegenüberstellt.","textPt":"Uma matriz que confronta a influência e o interesse de todos os intervenientes do projeto.","correct":false},{"text":"Eine Balkendarstellung, die Vorgänge eines Projekts über die Zeitachse zeigt, inklusive Start-/Endzeitpunkten und teilweise Abhängigkeiten.","textPt":"Uma representação em barras que mostra as atividades de um projeto ao longo do eixo temporal, com datas de início/fim e, por vezes, dependências.","correct":true}]},
{"cat":"plan","sub":"pm","q":"Was ist ein Meilenstein im Projektmanagement?","qPt":"O que é um milestone (marco) em gestão de projetos?","a":"Ein bedeutsames, terminiertes Ereignis oder Teilergebnis im Projektverlauf ohne eigene Dauer, das den Fortschritt markiert.","aPt":"Um evento ou resultado parcial importante e datado no decorrer do projeto, sem duração própria, que marca o progresso.","options":[{"text":"Ein bedeutsames, terminiertes Ereignis oder Teilergebnis im Projektverlauf ohne eigene Dauer, das den Fortschritt markiert.","textPt":"Um evento ou resultado parcial marcante e datado ao longo do projeto, sem duração própria, que assinala o progresso.","correct":true},{"text":"Ein einzelner Vorgang mit fester Dauer, der auf dem kritischen Pfad liegt.","textPt":"Uma atividade individual com duração fixa, situada no caminho crítico.","correct":false},{"text":"Die Zeitreserve, die am Ende eines Projekts für unvorhergesehene Verzögerungen eingeplant wird.","textPt":"A reserva de tempo planeada no final de um projeto para atrasos imprevistos.","correct":false},{"text":"Ein formaler Antrag auf Änderung des Projektumfangs, der genehmigt werden muss.","textPt":"Um pedido formal de alteração do âmbito do projeto, que precisa de ser aprovado.","correct":false}]},
{"cat":"plan","sub":"pm","q":"Nenne die klassischen Phasen eines Softwareprojekts.","qPt":"Indica as fases clássicas de um projeto de software.","a":"Initiierung/Anforderungsanalyse, Planung/Entwurf, Umsetzung/Implementierung, Test/Abnahme und Einführung/Betrieb (inkl. Wartung).","aPt":"Iniciação/análise de requisitos, planeamento/conceção, implementação, teste/aceitação e implantação/operação (incluindo manutenção).","options":[{"text":"Sprint Planning, Daily Scrum, Sprint Review und Sprint Retrospective.","textPt":"Sprint Planning, Daily Scrum, Sprint Review e Sprint Retrospective.","correct":false},{"text":"Anforderungsanalyse, Implementierung und Test — danach gilt das Projekt als abgeschlossen.","textPt":"Análise de requisitos, implementação e teste — depois disso o projeto é considerado concluído.","correct":false},{"text":"Initiierung/Anforderungsanalyse, Planung/Entwurf, Umsetzung/Implementierung, Test/Abnahme und Einführung/Betrieb (inkl. Wartung).","textPt":"Iniciação/análise de requisitos, planeamento/concepção, implementação, teste/aceitação e introdução/operação (incl. manutenção).","correct":true},{"text":"Plan, Do, Check und Act als sich wiederholender Verbesserungszyklus.","textPt":"Plan, Do, Check e Act como ciclo de melhoria contínua repetido.","correct":false}]},
{"cat":"plan","sub":"test","q":"Was ist ein Unit-Test?","qPt":"O que é um teste unitário (Unit-Test)?","a":"Ein Test, der eine einzelne, isolierte Programmeinheit (z. B. eine Methode oder Klasse) auf korrektes Verhalten prüft.","aPt":"Um teste que verifica o comportamento correto de uma única unidade de programa isolada (por exemplo, um método ou uma classe).","options":[{"text":"Ein Test, der das Zusammenspiel mehrerer bereits einzeln getesteter Module prüft.","textPt":"Um teste que verifica a interação entre vários módulos já testados individualmente.","correct":false},{"text":"Ein Test, der eine einzelne, isolierte Programmeinheit (z. B. eine Methode oder Klasse) auf korrektes Verhalten prüft.","textPt":"Um teste que verifica o comportamento correto de uma única unidade de programa isolada (p. ex. um método ou uma classe).","correct":true},{"text":"Ein Test des gesamten integrierten Systems gegen die Gesamtanforderungen in produktionsnaher Umgebung.","textPt":"Um teste de todo o sistema integrado em relação aos requisitos globais, num ambiente próximo da produção.","correct":false},{"text":"Ein Test, bei dem der Auftraggeber prüft, ob das System die vereinbarten Anforderungen erfüllt.","textPt":"Um teste em que o cliente verifica se o sistema cumpre os requisitos acordados.","correct":false}]},
{"cat":"plan","sub":"test","q":"Was ist ein Integrationstest?","qPt":"O que é um teste de integração?","a":"Ein Test, der das Zusammenspiel mehrerer bereits einzeln getesteter Module/Komponenten prüft.","aPt":"Um teste que verifica a interação entre vários módulos/componentes já testados individualmente.","options":[{"text":"Ein Test, der eine einzelne, isolierte Programmeinheit auf korrektes Verhalten prüft.","textPt":"Um teste que verifica o comportamento correto de uma única unidade de programa isolada.","correct":false},{"text":"Ein Test des gesamten, integrierten Systems gegen die Gesamtanforderungen.","textPt":"Um teste de todo o sistema integrado em relação aos requisitos globais.","correct":false},{"text":"Ein Test, bei dem nur das Ein-/Ausgabeverhalten ohne Kenntnis der internen Struktur geprüft wird.","textPt":"Um teste em que apenas se verifica o comportamento de entrada/saída, sem conhecer a estrutura interna.","correct":false},{"text":"Ein Test, der das Zusammenspiel mehrerer bereits einzeln getesteter Module/Komponenten prüft.","textPt":"Um teste que verifica a interação entre vários módulos/componentes já testados individualmente.","correct":true}]},
{"cat":"plan","sub":"test","q":"Was ist ein Systemtest?","qPt":"O que é um teste de sistema?","a":"Ein Test des gesamten, integrierten Systems gegen die Gesamtanforderungen, meist in einer produktionsnahen Umgebung.","aPt":"Um teste do sistema completo e integrado em relação aos requisitos globais, normalmente num ambiente semelhante ao de produção.","options":[{"text":"Ein Test des gesamten, integrierten Systems gegen die Gesamtanforderungen, meist in einer produktionsnahen Umgebung.","textPt":"Um teste de todo o sistema integrado em relação aos requisitos globais, geralmente num ambiente próximo da produção.","correct":true},{"text":"Ein Test, bei dem der Auftraggeber die Abnahmefähigkeit des fertigen Systems bestätigt.","textPt":"Um teste em que o cliente confirma que o sistema concluído pode ser aceite.","correct":false},{"text":"Ein Test, der nur das Zusammenspiel zweier benachbarter Module prüft.","textPt":"Um teste que verifica apenas a interação entre dois módulos vizinhos.","correct":false},{"text":"Ein isolierter Test einzelner Methoden oder Klassen ohne Berücksichtigung des Gesamtsystems.","textPt":"Um teste isolado de métodos ou classes individuais, sem considerar o sistema global.","correct":false}]},
{"cat":"plan","sub":"test","q":"Was ist ein Abnahmetest?","qPt":"O que é um teste de aceitação?","a":"Ein Test, bei dem der Auftraggeber prüft, ob das fertige System die vereinbarten Anforderungen erfüllt und abgenommen werden kann.","aPt":"Um teste em que o cliente verifica se o sistema concluído cumpre os requisitos acordados e pode ser aceite.","options":[{"text":"Ein Test des gesamten integrierten Systems in einer produktionsnahen Umgebung, durchgeführt vom Entwicklerteam.","textPt":"Um teste de todo o sistema integrado num ambiente próximo da produção, realizado pela equipa de desenvolvimento.","correct":false},{"text":"Ein Test, der gezielt Werte an den Rändern von Äquivalenzklassen prüft.","textPt":"Um teste que verifica especificamente valores nos limites das classes de equivalência.","correct":false},{"text":"Ein Test, bei dem der Auftraggeber prüft, ob das fertige System die vereinbarten Anforderungen erfüllt und abgenommen werden kann.","textPt":"Um teste em que o cliente verifica se o sistema concluído cumpre os requisitos acordados e pode ser aceite.","correct":true},{"text":"Ein Test, der die Zusammenarbeit mehrerer Module nach deren Einzeltests prüft.","textPt":"Um teste que verifica a colaboração entre vários módulos após os respetivos testes individuais.","correct":false}]},
{"cat":"plan","sub":"test","q":"Was ist der Unterschied zwischen Black-Box- und White-Box-Testing?","qPt":"Qual é a diferença entre teste de caixa-preta (Black-Box) e teste de caixa-branca (White-Box)?","a":"Beim Black-Box-Test wird nur das Ein-/Ausgabeverhalten geprüft, ohne die interne Struktur zu kennen. Beim White-Box-Test kennt der Tester den internen Aufbau/Code und testet gezielt Pfade und Strukturen.","aPt":"No teste de caixa-preta, apenas se verifica o comportamento de entrada/saída, sem conhecer a estrutura interna. No teste de caixa-branca, o testador conhece a estrutura interna/o código e testa de forma direcionada caminhos e estruturas específicas.","options":[{"text":"Beim Black-Box-Test wird nur das Ein-/Ausgabeverhalten ohne Kenntnis der internen Struktur geprüft; beim White-Box-Test kennt der Tester den Code und testet gezielt interne Pfade.","textPt":"No teste Black-Box verifica-se apenas o comportamento de entrada/saída, sem conhecer a estrutura interna; no White-Box o testador conhece o código e testa caminhos internos específicos.","correct":true},{"text":"Beim Black-Box-Test kennt der Tester den internen Code; beim White-Box-Test wird nur das Ein-/Ausgabeverhalten geprüft.","textPt":"No teste Black-Box o testador conhece o código interno; no White-Box verifica-se apenas o comportamento de entrada/saída.","correct":false},{"text":"Black-Box-Test prüft, ob das Produkt die Spezifikation erfüllt (Verifikation); White-Box-Test prüft, ob es die Nutzerbedürfnisse erfüllt (Validierung).","textPt":"O teste Black-Box verifica se o produto cumpre a especificação (verificação); o White-Box verifica se satisfaz as necessidades do utilizador (validação).","correct":false},{"text":"Beide Testarten setzen vollständige Kenntnis des Quellcodes voraus, unterscheiden sich aber im Testumfang.","textPt":"Ambos os tipos de teste pressupõem conhecimento total do código-fonte, diferindo apenas no âmbito do teste.","correct":false}]},
{"cat":"plan","sub":"test","q":"Was ist die Äquivalenzklassenmethode beim Testen?","qPt":"O que é o método das classes de equivalência no teste de software?","a":"Eingabewerte werden in Klassen eingeteilt, die voraussichtlich gleich behandelt werden; es wird angenommen, dass ein Testfall pro Klasse repräsentativ für die gesamte Klasse ist.","aPt":"Os valores de entrada são divididos em classes que, presumivelmente, serão tratadas da mesma forma; assume-se que um caso de teste por classe é representativo de toda a classe.","options":[{"text":"Eingabewerte werden in Klassen eingeteilt, die voraussichtlich gleich behandelt werden; ein Testfall pro Klasse gilt als repräsentativ.","textPt":"Os valores de entrada são divididos em classes que previsivelmente são tratadas da mesma forma; considera-se um caso de teste por classe como representativo.","correct":true},{"text":"Es werden gezielt Werte an den Rändern von Wertebereichen getestet, da dort Fehler besonders häufig auftreten.","textPt":"Testam-se especificamente valores nos limites dos intervalos de valores, pois é aí que os erros ocorrem com mais frequência.","correct":false},{"text":"Jeder mögliche Eingabewert wird einzeln getestet, um vollständige Abdeckung zu garantieren.","textPt":"Cada valor de entrada possível é testado individualmente para garantir cobertura total.","correct":false},{"text":"Es werden gezielt alle möglichen Programmpfade anhand des Quellcodes nachvollzogen.","textPt":"Percorrem-se deliberadamente todos os caminhos possíveis do programa com base no código-fonte.","correct":false}]},
{"cat":"plan","sub":"test","q":"Was ist die Grenzwertanalyse beim Testen?","qPt":"O que é a análise de valores-limite no teste de software?","a":"Eine Testmethode, die gezielt Werte an den Rändern von Äquivalenzklassen testet (z. B. Minimum, Maximum, direkt darüber/darunter), da dort Fehler besonders häufig auftreten.","aPt":"Um método de teste que testa especificamente valores nos limites das classes de equivalência (por exemplo, mínimo, máximo, imediatamente acima/abaixo), uma vez que é aí que os erros ocorrem com mais frequência.","options":[{"text":"Eine Testmethode, die Eingabewerte in Klassen einteilt und nur einen Vertreter pro Klasse testet.","textPt":"Um método de teste que divide os valores de entrada em classes e testa apenas um representante por classe.","correct":false},{"text":"Eine Testmethode, die ausschließlich typische Werte in der Mitte eines Wertebereichs testet, um den Normalfall abzudecken.","textPt":"Um método de teste que testa exclusivamente valores típicos no meio de um intervalo, para cobrir o caso normal.","correct":false},{"text":"Eine Testmethode, die zufällig generierte Eingabewerte verwendet, um unbekannte Fehler zu finden.","textPt":"Um método de teste que utiliza valores de entrada gerados aleatoriamente para encontrar erros desconhecidos.","correct":false},{"text":"Eine Testmethode, die gezielt Werte an den Rändern von Äquivalenzklassen testet (z. B. Minimum, Maximum), da dort Fehler besonders häufig auftreten.","textPt":"Um método de teste que testa especificamente valores nos limites das classes de equivalência (p. ex. mínimo, máximo), pois é aí que os erros ocorrem com mais frequência.","correct":true}]},
{"cat":"plan","sub":"recht","q":"Was ist der Unterschied zwischen Werkvertrag und Dienstvertrag?","qPt":"Qual é a diferença entre contrato de empreitada (Werkvertrag) e contrato de prestação de serviços (Dienstvertrag)?","a":"Beim Werkvertrag (§631 BGB) wird ein konkreter Erfolg/ein Ergebnis geschuldet (z. B. eine fertige Software). Beim Dienstvertrag (§611 BGB) wird nur die Tätigkeit/Arbeitsleistung geschuldet, unabhängig vom Erfolg.","aPt":"No contrato de empreitada (§631 BGB) é devido um resultado/sucesso concreto (por exemplo, um software concluído). No contrato de prestação de serviços (§611 BGB) é devida apenas a atividade/o trabalho em si, independentemente do resultado.","options":[{"text":"Beim Werkvertrag wird nur die Tätigkeit geschuldet, beim Dienstvertrag ein konkreter Erfolg.","textPt":"No Werkvertrag é devida apenas a atividade; no Dienstvertrag é devido um resultado concreto.","correct":false},{"text":"Der Werkvertrag regelt vorformulierte Vertragsbedingungen, der Dienstvertrag die Gewährleistungsrechte.","textPt":"O Werkvertrag regula condições contratuais pré-formuladas; o Dienstvertrag regula os direitos de garantia.","correct":false},{"text":"Beim Werkvertrag (§631 BGB) wird ein konkreter Erfolg geschuldet, beim Dienstvertrag (§611 BGB) nur die Tätigkeit, unabhängig vom Erfolg.","textPt":"No Werkvertrag (contrato de empreitada, §631 BGB) é devido um resultado concreto; no Dienstvertrag (contrato de prestação de serviços, §611 BGB) é devida apenas a atividade, independentemente do resultado.","correct":true},{"text":"Sowohl Werkvertrag als auch Dienstvertrag verpflichten zur Erbringung eines messbaren Erfolgs, unterscheiden sich nur in der Vergütung.","textPt":"Tanto o Werkvertrag como o Dienstvertrag obrigam a entregar um resultado mensurável, diferindo apenas na forma de remuneração.","correct":false}]},
{"cat":"plan","sub":"recht","q":"Was regeln Allgemeine Geschäftsbedingungen (AGB)?","qPt":"O que regulam as Condições Gerais de Contrato (Allgemeine Geschäftsbedingungen, AGB)?","a":"Vorformulierte Vertragsbedingungen, die eine Partei der anderen bei Vertragsschluss stellt, um wiederkehrende Geschäfte einheitlich zu regeln — unterliegen einer gesetzlichen Inhaltskontrolle.","aPt":"São cláusulas contratuais pré-formuladas que uma das partes apresenta à outra na celebração do contrato, para regular de forma uniforme negócios recorrentes — estão sujeitas a um controlo legal de conteúdo.","options":[{"text":"Die gesetzliche Pflicht, für Mängel einer gelieferten Sache durch Nacherfüllung oder Schadensersatz einzustehen.","textPt":"A obrigação legal de responder por defeitos de um bem entregue, através de cumprimento posterior ou indemnização.","correct":false},{"text":"Vorformulierte Vertragsbedingungen, die eine Partei der anderen bei Vertragsschluss stellt, um wiederkehrende Geschäfte einheitlich zu regeln; sie unterliegen einer Inhaltskontrolle.","textPt":"Condições contratuais pré-formuladas que uma parte impõe à outra na celebração do contrato, para regular de forma uniforme negócios recorrentes; estão sujeitas a um controlo de conteúdo.","correct":true},{"text":"Individuell zwischen beiden Vertragsparteien ausgehandelte Bedingungen, die für jedes Geschäft neu formuliert werden.","textPt":"Condições negociadas individualmente entre ambas as partes, formuladas de novo para cada negócio.","correct":false},{"text":"Eine gesetzliche Regelung, die festlegt, ob ein Erfolg oder nur eine Tätigkeit geschuldet wird.","textPt":"Uma norma legal que determina se é devido um resultado ou apenas uma atividade.","correct":false}]},
{"cat":"plan","sub":"recht","q":"Was bedeutet Gewährleistung im Kaufrecht/Werkvertragsrecht?","qPt":"O que significa garantia legal (Gewährleistung) no direito da compra e venda/no direito da empreitada?","a":"Die gesetzliche Pflicht des Verkäufers/Werkunternehmers, für Mängel der gelieferten Sache/des Werks einzustehen, z. B. durch Nacherfüllung (Nachbesserung bzw. Nachlieferung), Minderung, Rücktritt oder Schadensersatz.","aPt":"É a obrigação legal do vendedor/empreiteiro de responder por defeitos na coisa/obra entregue, por exemplo através de cumprimento posterior (reparação ou substituição), redução do preço, resolução do contrato ou indemnização.","options":[{"text":"Die gesetzliche Pflicht des Verkäufers/Werkunternehmers, für Mängel einzustehen, z. B. durch Nacherfüllung, Minderung, Rücktritt oder Schadensersatz.","textPt":"A obrigação legal do vendedor/empreiteiro de responder por defeitos, p. ex. através de cumprimento posterior (Nacherfüllung), redução do preço, resolução do contrato ou indemnização.","correct":true},{"text":"Vorformulierte Vertragsbedingungen, die eine Partei der anderen bei Vertragsschluss stellt.","textPt":"Condições contratuais pré-formuladas que uma parte impõe à outra na celebração do contrato.","correct":false},{"text":"Die Pflicht, eine mangelhafte Sache ausschließlich durch eine kostenlose Ersatzlieferung zu ersetzen.","textPt":"A obrigação de substituir um bem defeituoso exclusivamente por uma entrega de substituição gratuita.","correct":false},{"text":"Eine freiwillige Herstellergarantie, die zusätzlich zum gesetzlichen Schutz angeboten werden kann.","textPt":"Uma garantia voluntária do fabricante, que pode ser oferecida como complemento à proteção legal.","correct":false}]},
{"cat":"plan","sub":"sicherheit","q":"Was sind die drei klassischen Schutzziele der IT-Sicherheit?","qPt":"Quais são os três objetivos clássicos de proteção da segurança informática?","a":"Vertraulichkeit (Confidentiality), Integrität (Integrity) und Verfügbarkeit (Availability) — oft als CIA-Triade bezeichnet.","aPt":"Confidencialidade (Confidentiality), Integridade (Integrity) e Disponibilidade (Availability) — frequentemente designados como a tríade CIA.","options":[{"text":"Authentizität, Verbindlichkeit und Vertraulichkeit.","textPt":"Autenticidade, Vinculação (não-repúdio) e Confidencialidade.","correct":false},{"text":"Rechtmäßigkeit, Zweckbindung und Datenminimierung.","textPt":"Licitude, Limitação da finalidade e Minimização dos dados.","correct":false},{"text":"Vertraulichkeit, Nachvollziehbarkeit und Skalierbarkeit.","textPt":"Confidencialidade, Rastreabilidade e Escalabilidade.","correct":false},{"text":"Vertraulichkeit, Integrität und Verfügbarkeit — zusammen als CIA-Triade bezeichnet.","textPt":"Confidencialidade, Integridade e Disponibilidade — conhecidas em conjunto como a tríade CIA.","correct":true}]},
{"cat":"plan","sub":"sicherheit","q":"Was ist der Unterschied zwischen symmetrischer und asymmetrischer Verschlüsselung?","qPt":"Qual é a diferença entre encriptação simétrica e assimétrica?","a":"Bei symmetrischer Verschlüsselung wird derselbe Schlüssel zum Ver- und Entschlüsseln verwendet. Bei asymmetrischer Verschlüsselung gibt es ein Schlüsselpaar aus öffentlichem und privatem Schlüssel.","aPt":"Na encriptação simétrica é usada a mesma chave para encriptar e desencriptar. Na encriptação assimétrica existe um par de chaves, uma pública e uma privada.","options":[{"text":"Bei symmetrischer Verschlüsselung wird derselbe Schlüssel zum Ver- und Entschlüsseln verwendet; bei asymmetrischer gibt es ein Schlüsselpaar aus öffentlichem und privatem Schlüssel.","textPt":"Na encriptação simétrica usa-se a mesma chave para encriptar e desencriptar; na assimétrica existe um par de chaves, pública e privada.","correct":true},{"text":"Bei symmetrischer Verschlüsselung gibt es ein Schlüsselpaar aus öffentlichem und privatem Schlüssel; bei asymmetrischer wird derselbe Schlüssel verwendet.","textPt":"Na encriptação simétrica existe um par de chaves pública e privada; na assimétrica usa-se a mesma chave.","correct":false},{"text":"Symmetrische Verschlüsselung ist umkehrbar, asymmetrische Verschlüsselung ist eine Einwegfunktion wie beim Hashing.","textPt":"A encriptação simétrica é reversível, a assimétrica é uma função unidirecional, como o hashing.","correct":false},{"text":"Asymmetrische Verschlüsselung nutzt denselben Schlüssel für beide Seiten und ist deutlich schneller als symmetrische.","textPt":"A encriptação assimétrica utiliza a mesma chave para ambos os lados e é claramente mais rápida do que a simétrica.","correct":false}]},
{"cat":"plan","sub":"sicherheit","q":"Was ist eine Firewall?","qPt":"O que é uma firewall?","a":"Ein System (Hard- oder Software), das den Datenverkehr zwischen Netzen anhand definierter Regeln überwacht und filtert, um unerwünschten Zugriff zu verhindern.","aPt":"Um sistema (hardware ou software) que monitoriza e filtra o tráfego de dados entre redes com base em regras definidas, para impedir acessos não autorizados.","options":[{"text":"Eine verschlüsselte Verbindung über ein öffentliches Netz, die Daten sicher wie in einem privaten Netzwerk übertragt.","textPt":"Uma ligação encriptada através de uma rede pública, que transmite dados de forma segura como numa rede privada.","correct":false},{"text":"Ein Mechanismus, der Passwörter als Einwegfunktion speichert, sodass sie nicht zurückgerechnet werden können.","textPt":"Um mecanismo que armazena palavras-passe como função unidirecional, impossível de inverter.","correct":false},{"text":"Ein System (Hard- oder Software), das den Datenverkehr zwischen Netzen anhand definierter Regeln überwacht und filtert.","textPt":"Um sistema (hardware ou software) que monitoriza e filtra o tráfego de dados entre redes com base em regras definidas.","correct":true},{"text":"Ein Verfahren, das zwei unabhängige Faktoren bei der Anmeldung kombiniert.","textPt":"Um procedimento que combina dois fatores independentes no momento do login.","correct":false}]},
{"cat":"plan","sub":"sicherheit","q":"Was ist ein VPN?","qPt":"O que é uma VPN?","a":"Ein Virtual Private Network stellt eine verschlüsselte Verbindung über ein öffentliches Netz her, sodass Daten sicher wie in einem privaten Netzwerk übertragen werden können.","aPt":"Uma Virtual Private Network estabelece uma ligação encriptada através de uma rede pública, permitindo transmitir dados com segurança como numa rede privada.","options":[{"text":"Ein System, das den Datenverkehr zwischen Netzen anhand definierter Regeln filtert und überwacht.","textPt":"Um sistema que filtra e monitoriza o tráfego de dados entre redes com base em regras definidas.","correct":false},{"text":"Ein Virtual Private Network stellt eine verschlüsselte Verbindung über ein öffentliches Netz her, sodass Daten sicher wie in einem privaten Netzwerk übertragen werden können.","textPt":"Uma Virtual Private Network estabelece uma ligação encriptada através de uma rede pública, permitindo transmitir dados com a segurança de uma rede privada.","correct":true},{"text":"Ein Angriff, der einen Dienst durch massenhafte Anfragen für legitime Nutzer unerreichbar macht.","textPt":"Um ataque que torna um serviço inacessível para utilizadores legítimos através de um volume massivo de pedidos.","correct":false},{"text":"Ein Netzwerkdienst, der die Identität des Nutzers verschleiert, die Daten dabei aber unverschlüsselt über das öffentliche Netz sendet.","textPt":"Um serviço de rede que oculta a identidade do utilizador, mas envia os dados sem encriptação através da rede pública.","correct":false}]},
{"cat":"plan","sub":"sicherheit","q":"Was besagt die DSGVO grundsätzlich?","qPt":"Qual é o conteúdo essencial do RGPD?","a":"Die Datenschutz-Grundverordnung regelt EU-weit einheitlich den Umgang mit personenbezogenen Daten und verpflichtet Unternehmen u. a. zu Rechtmäßigkeit, Zweckbindung, Datenminimierung und Transparenz bei der Verarbeitung.","aPt":"O Regulamento Geral sobre a Proteção de Dados regula de forma uniforme, em toda a UE, o tratamento de dados pessoais e obriga as empresas, entre outros aspetos, a cumprir os princípios da licitude, limitação da finalidade, minimização dos dados e transparência no tratamento.","options":[{"text":"Die DSGVO regelt EU-weit einheitlich den Umgang mit personenbezogenen Daten und verpflichtet u. a. zu Rechtmäßigkeit, Zweckbindung, Datenminimierung und Transparenz.","textPt":"O RGPD regula de forma uniforme em toda a UE o tratamento de dados pessoais e obriga, entre outros, à licitude, limitação da finalidade, minimização dos dados e transparência.","correct":true},{"text":"Sie verpflichtet Unternehmen, Datenschutz von Beginn an technisch in jedes System einzubauen, ohne weitere inhaltliche Vorgaben.","textPt":"Obriga as empresas a incorporar tecnicamente a proteção de dados desde o início em cada sistema, sem outras exigências de conteúdo.","correct":false},{"text":"Sie regelt ausschließlich den Umgang deutscher Unternehmen mit Kundendaten innerhalb Deutschlands.","textPt":"Regula exclusivamente o tratamento de dados de clientes por empresas alemãs dentro da Alemanha.","correct":false},{"text":"Sie definiert die drei Schutzziele Vertraulichkeit, Integrität und Verfügbarkeit für IT-Systeme.","textPt":"Define os três objetivos de proteção — confidencialidade, integridade e disponibilidade — para sistemas de TI.","correct":false}]},
{"cat":"plan","sub":"sicherheit","q":"Was versteht man unter \"Privacy by Design\"?","qPt":"O que se entende por \"Privacy by Design\"?","a":"Das Prinzip, Datenschutz bereits von Beginn an in die technische Konzeption und Entwicklung von Systemen und Prozessen einzubeziehen, statt ihn nachträglich hinzuzufügen.","aPt":"O princípio de incluir a proteção de dados desde o início na conceção técnica e no desenvolvimento de sistemas e processos, em vez de a acrescentar posteriormente.","options":[{"text":"Die gesetzliche Verpflichtung zur Meldung von Datenschutzverletzungen innerhalb von 72 Stunden.","textPt":"A obrigação legal de notificar violações de dados pessoais no prazo de 72 horas.","correct":false},{"text":"Das nachträgliche Hinzufügen von Sicherheitsmaßnahmen, sobald eine Datenschutzverletzung festgestellt wurde.","textPt":"A adição posterior de medidas de segurança, assim que é detetada uma violação de dados.","correct":false},{"text":"Die Verpflichtung, personenbezogene Daten ausschließlich verschlüsselt zu speichern.","textPt":"A obrigação de armazenar dados pessoais exclusivamente de forma encriptada.","correct":false},{"text":"Das Prinzip, Datenschutz bereits von Beginn an in die technische Konzeption und Entwicklung von Systemen einzubeziehen, statt ihn nachträglich hinzuzufügen.","textPt":"O princípio de incluir a proteção de dados desde o início na conceção técnica e no desenvolvimento de sistemas, em vez de a adicionar posteriormente.","correct":true}]},
{"cat":"plan","sub":"lizenz","q":"Was ist der Unterschied zwischen Open-Source- und proprietärer Software?","qPt":"Qual é a diferença entre software open source e software proprietário?","a":"Open-Source-Software stellt ihren Quellcode offen zur Verfügung und erlaubt meist Nutzung, Veränderung und Weitergabe unter bestimmten Lizenzbedingungen. Proprietäre Software ist closed-source, Rechte liegen beim Hersteller, Nutzung ist meist lizenzpflichtig eingeschränkt.","aPt":"O software open source disponibiliza abertamente o seu código-fonte e normalmente permite a utilização, alteração e distribuição sob determinadas condições de licença. O software proprietário é closed-source, os direitos pertencem ao fabricante e a utilização é geralmente limitada por licença.","options":[{"text":"Open-Source-Software ist closed-source und lizenzpflichtig; proprietäre Software stellt den Quellcode offen zur Verfügung.","textPt":"O software Open-Source é closed-source e sujeito a licença; o software proprietário disponibiliza o código-fonte abertamente.","correct":false},{"text":"Open-Source-Software stellt den Quellcode offen zur Verfügung und erlaubt meist Nutzung, Veränderung und Weitergabe; proprietäre Software ist closed-source und meist lizenzpflichtig eingeschränkt.","textPt":"O software Open-Source disponibiliza o código-fonte abertamente e permite geralmente o uso, alteração e redistribuição; o software proprietário é closed-source e geralmente restrito por licença.","correct":true},{"text":"Open-Source-Software ist immer kostenlos; proprietäre Software darf nur zeitlich begrenzt getestet werden.","textPt":"O software Open-Source é sempre gratuito; o software proprietário só pode ser testado por tempo limitado.","correct":false},{"text":"Open-Source-Software unterliegt keinerlei Lizenzbedingungen und darf beliebig verwendet werden.","textPt":"O software Open-Source não está sujeito a quaisquer condições de licença e pode ser utilizado livremente.","correct":false}]},
{"cat":"plan","sub":"lizenz","q":"Was ist der Unterschied zwischen Freeware und Shareware?","qPt":"Qual é a diferença entre freeware e shareware?","a":"Freeware ist kostenlos nutzbar, meist ohne Weitergabe des Quellcodes. Shareware darf zeitlich oder funktional eingeschränkt kostenlos getestet werden, für die Vollversion ist danach eine Zahlung fällig.","aPt":"O freeware pode ser utilizado gratuitamente, geralmente sem disponibilização do código-fonte. O shareware pode ser testado gratuitamente, com limitações de tempo ou de funcionalidades, sendo depois necessário pagar para obter a versão completa.","options":[{"text":"Shareware ist dauerhaft kostenlos nutzbar; Freeware darf nur zeitlich begrenzt kostenlos getestet werden.","textPt":"O Shareware pode ser usado gratuitamente de forma permanente; o Freeware só pode ser testado gratuitamente por tempo limitado.","correct":false},{"text":"Freeware stellt den vollständigen Quellcode offen zur Verfügung; Shareware ist stets closed-source.","textPt":"O Freeware disponibiliza o código-fonte completo de forma aberta; o Shareware é sempre closed-source.","correct":false},{"text":"Freeware ist kostenlos nutzbar, meist ohne Quellcode-Weitergabe; Shareware darf zeitlich/funktional eingeschränkt kostenlos getestet werden, danach ist für die Vollversion zu zahlen.","textPt":"O Freeware pode ser usado gratuitamente, geralmente sem distribuição do código-fonte; o Shareware pode ser testado gratuitamente com limitações de tempo/funcionalidade, sendo depois necessário pagar pela versão completa.","correct":true},{"text":"Freeware und Shareware unterscheiden sich nur im Namen, inhaltlich sind beide identisch kostenlos.","textPt":"Freeware e Shareware diferem apenas no nome, sendo ambos igualmente gratuitos na prática.","correct":false}]},
{"cat":"plan","sub":"pm","q":"Was ist eine Stakeholder-Analyse?","qPt":"O que é uma análise de stakeholders?","a":"Die systematische Identifikation und Bewertung aller Personen/Gruppen, die von einem Projekt betroffen sind oder Einfluss darauf haben, um deren Interessen und Erwartungen zu berücksichtigen.","aPt":"A identificação e avaliação sistemática de todas as pessoas/grupos afetados por um projeto ou com influência sobre ele, de forma a considerar os seus interesses e expectativas.","options":[{"text":"Die systematische Identifikation und Bewertung aller Personen/Gruppen, die von einem Projekt betroffen sind oder Einfluss darauf haben, um deren Interessen zu berücksichtigen.","textPt":"A identificação e avaliação sistemática de todas as pessoas/grupos afetados por um projeto ou com influência sobre ele, para considerar os seus interesses.","correct":true},{"text":"Die Gegenüberstellung von Stärken, Schwächen, Chancen und Risiken eines Projekts.","textPt":"O confronto entre forças, fraquezas, oportunidades e riscos de um projeto.","correct":false},{"text":"Die Bewertung mehrerer Lösungsalternativen anhand gewichteter Kriterien zur Entscheidungsfindung.","textPt":"A avaliação de várias alternativas de solução com base em critérios ponderados, para apoiar a decisão.","correct":false},{"text":"Die ausschließliche Erfassung externer Projektbeteiligter, interne Mitarbeiter werden dabei nicht berücksichtigt.","textPt":"O levantamento exclusivo dos intervenientes externos do projeto, não considerando os colaboradores internos.","correct":false}]},
{"cat":"plan","sub":"anforderungen","q":"Was ist ein Lastenheft-Bestandteil \"Muss-Kriterium\" vs. \"Kann-Kriterium\"?","qPt":"O que distingue, no caderno de encargos (Lastenheft), um \"critério obrigatório\" (Muss-Kriterium) de um \"critério opcional\" (Kann-Kriterium)?","a":"Muss-Kriterien sind zwingend zu erfüllende Anforderungen, ohne die die Lösung nicht akzeptiert wird. Kann-Kriterien sind wünschenswerte, aber nicht zwingende Zusatzanforderungen.","aPt":"Os critérios obrigatórios são requisitos que têm de ser cumpridos, sem os quais a solução não é aceite. Os critérios opcionais são requisitos adicionais desejáveis, mas não obrigatórios.","options":[{"text":"Muss-Kriterien sind optionale Wünsche; Kann-Kriterien sind zwingend zu erfüllende Anforderungen.","textPt":"Os critérios Muss são desejos opcionais; os critérios Kann são requisitos obrigatórios.","correct":false},{"text":"Muss-Kriterien sind zwingend zu erfüllende Anforderungen; Kann-Kriterien sind wünschenswerte, aber nicht zwingende Zusatzanforderungen.","textPt":"Os critérios Muss (obrigatórios) são requisitos que têm de ser cumpridos; os critérios Kann (opcionais) são requisitos adicionais desejáveis, mas não obrigatórios.","correct":true},{"text":"Muss-Kriterien beschreiben die Kundensicht im Lastenheft, Kann-Kriterien die technische Umsetzung im Pflichtenheft.","textPt":"Os critérios Muss descrevem a perspetiva do cliente no Lastenheft (caderno de encargos), os Kann a implementação técnica no Pflichtenheft (caderno de especificações).","correct":false},{"text":"Kann-Kriterien sind Anforderungen, die ausschließlich in einer späteren Projektphase umgesetzt werden dürfen.","textPt":"Os critérios Kann são requisitos que só podem ser implementados numa fase posterior do projeto.","correct":false}]},
{"cat":"plan","sub":"pm","q":"Was ist eine SWOT-Analyse?","qPt":"O que é uma análise SWOT?","a":"Eine Analysemethode, die Stärken (Strengths), Schwächen (Weaknesses), Chancen (Opportunities) und Risiken (Threats) eines Vorhabens oder Unternehmens systematisch gegenüberstellt.","aPt":"Um método de análise que confronta sistematicamente os pontos fortes (Strengths), os pontos fracos (Weaknesses), as oportunidades (Opportunities) e as ameaças (Threats) de um projeto ou empresa.","options":[{"text":"Eine Methode zur Identifikation aller vom Projekt betroffenen Personen und deren Interessen.","textPt":"Um método para identificar todas as pessoas afetadas pelo projeto e os seus interesses.","correct":false},{"text":"Ein Zyklus aus Planen, Umsetzen, Überprüfen und Anpassen zur kontinuierlichen Verbesserung.","textPt":"Um ciclo de Planear, Executar, Verificar e Agir para a melhoria contínua.","correct":false},{"text":"Eine Analysemethode, die Stärken, Schwächen, Chancen und Risiken eines Vorhabens systematisch gegenüberstellt.","textPt":"Um método de análise que confronta sistematicamente forças, fraquezas, oportunidades e riscos de um projeto.","correct":true},{"text":"Eine Methode, die ausschließlich interne Faktoren eines Unternehmens analysiert, externe Einflüsse bleiben unberücksichtigt.","textPt":"Um método que analisa exclusivamente fatores internos de uma empresa, sem considerar influências externas.","correct":false}]},
{"cat":"plan","sub":"pm","q":"Was ist ein Change-Request im Projektmanagement?","qPt":"O que é um Change Request na gestão de projetos?","a":"Ein formal gestellter Antrag auf Änderung des Projektumfangs, der Anforderungen, des Zeitplans oder des Budgets nach Projektstart, der bewertet und genehmigt werden muss.","aPt":"Um pedido formal de alteração ao âmbito do projeto, aos requisitos, ao cronograma ou ao orçamento, feito depois do início do projeto, que tem de ser avaliado e aprovado.","options":[{"text":"Die schleichende, unkontrollierte Ausweitung des Projektumfangs ohne formale Genehmigung.","textPt":"A expansão progressiva e descontrolada do âmbito do projeto, sem aprovação formal.","correct":false},{"text":"Ein terminiertes Ereignis, das einen wichtigen Teilerfolg im Projekt markiert.","textPt":"Um evento datado que assinala um resultado parcial importante do projeto.","correct":false},{"text":"Ein Antrag, der ausschließlich Änderungen am Projektbudget betrifft, nicht aber am Zeitplan oder Umfang.","textPt":"Um pedido que diz respeito exclusivamente a alterações ao orçamento do projeto, não ao cronograma ou ao âmbito.","correct":false},{"text":"Ein formal gestellter Antrag auf Änderung des Projektumfangs, der Anforderungen, des Zeitplans oder des Budgets nach Projektstart, der bewertet und genehmigt werden muss.","textPt":"Um pedido formal de alteração do âmbito do projeto, dos requisitos, do cronograma ou do orçamento após o início do projeto, que precisa de ser avaliado e aprovado.","correct":true}]},
{"cat":"plan","sub":"pm","q":"Was bedeutet \"Scope Creep\"?","qPt":"O que significa \"Scope Creep\"?","a":"Die schleichende, unkontrollierte Ausweitung des Projektumfangs ohne entsprechende Anpassung von Zeit, Budget oder Ressourcen.","aPt":"O alargamento gradual e descontrolado do âmbito do projeto, sem o correspondente ajuste do tempo, orçamento ou recursos.","options":[{"text":"Die schleichende, unkontrollierte Ausweitung des Projektumfangs ohne entsprechende Anpassung von Zeit, Budget oder Ressourcen.","textPt":"A expansão progressiva e descontrolada do âmbito do projeto, sem o correspondente ajuste de tempo, orçamento ou recursos.","correct":true},{"text":"Ein formal genehmigter Prozess zur kontrollierten Erweiterung des Projektumfangs.","textPt":"Um processo formalmente aprovado para a expansão controlada do âmbito do projeto.","correct":false},{"text":"Die systematische Bewertung von Chancen und Risiken bei einer Projektumfangserweiterung.","textPt":"A avaliação sistemática de oportunidades e riscos numa expansão do âmbito do projeto.","correct":false},{"text":"Die bewusste Reduzierung des Projektbudgets zur Kompensation gestiegener Anforderungen.","textPt":"A redução deliberada do orçamento do projeto para compensar o aumento dos requisitos.","correct":false}]},
{"cat":"plan","sub":"test","q":"Was ist der Unterschied zwischen Qualitätssicherung und Qualitätsmanagement?","qPt":"Qual é a diferença entre garantia de qualidade e gestão da qualidade?","a":"Qualitätssicherung (QS) umfasst konkrete Maßnahmen zur Prüfung/Sicherstellung der Produktqualität (z. B. Tests). Qualitätsmanagement (QM) ist der übergeordnete, organisatorische Rahmen, der Prozesse, Verantwortlichkeiten und kontinuierliche Verbesserung steuert.","aPt":"A garantia de qualidade (QS) engloba medidas concretas para verificar/assegurar a qualidade do produto (por exemplo, testes). A gestão da qualidade (QM) é o enquadramento organizacional mais amplo que rege processos, responsabilidades e a melhoria contínua.","options":[{"text":"QM umfasst konkrete Testmaßnahmen am Produkt; QS ist der übergeordnete organisatorische Rahmen.","textPt":"A gestão da qualidade (QM) abrange medidas concretas de teste do produto; a garantia da qualidade (QS) é o quadro organizacional mais amplo.","correct":false},{"text":"QS umfasst konkrete Maßnahmen zur Prüfung der Produktqualität; QM ist der übergeordnete organisatorische Rahmen für Prozesse, Verantwortlichkeiten und Verbesserung.","textPt":"A garantia de qualidade (QS) abrange medidas concretas para verificar a qualidade do produto; a gestão da qualidade (QM) é o quadro organizacional mais amplo para processos, responsabilidades e melhoria.","correct":true},{"text":"QS prüft, ob das Produkt die Spezifikation erfüllt; QM prüft, ob es die Nutzerbedürfnisse erfüllt.","textPt":"A QS verifica se o produto cumpre a especificação; a QM verifica se satisfaz as necessidades do utilizador.","correct":false},{"text":"QM beschränkt sich auf die Dokumentation von Testergebnissen, QS steuert die Prozesse im Unternehmen.","textPt":"A QM limita-se à documentação dos resultados dos testes; a QS gere os processos na empresa.","correct":false}]},
{"cat":"plan","sub":"test","q":"Was ist der PDCA-Zyklus?","qPt":"O que é o ciclo PDCA?","a":"Ein Modell für kontinuierliche Verbesserung mit den Phasen Plan (Planen), Do (Umsetzen), Check (Überprüfen) und Act (Anpassen/Standardisieren).","aPt":"Um modelo de melhoria contínua com as fases Plan (planear), Do (executar), Check (verificar) e Act (atuar/padronizar).","options":[{"text":"Ein Modell mit den Phasen Initiierung, Planung, Umsetzung und Einführung eines Softwareprojekts.","textPt":"Um modelo com as fases de iniciação, planeamento, implementação e introdução de um projeto de software.","correct":false},{"text":"Ein Zyklus aus Sprint Planning, Daily Scrum, Review und Retrospective.","textPt":"Um ciclo composto por Sprint Planning, Daily Scrum, Review e Retrospective.","correct":false},{"text":"Ein Modell für kontinuierliche Verbesserung mit den Phasen Plan, Do, Check und Act.","textPt":"Um modelo de melhoria contínua com as fases Plan (planear), Do (executar), Check (verificar) e Act (agir).","correct":true},{"text":"Ein einmalig durchlaufenes Vorgehen, das nach der Act-Phase endgültig abgeschlossen ist.","textPt":"Um procedimento executado uma única vez, que termina definitivamente após a fase Act.","correct":false}]},
{"cat":"algo","sub":"ds","q":"Was ist der Unterschied zwischen Stack und Queue?","qPt":"Qual é a diferença entre uma Stack e uma Queue?","a":"Ein Stack arbeitet nach dem LIFO-Prinzip (Last In, First Out) — das zuletzt eingefügte Element wird zuerst entnommen. Eine Queue arbeitet nach FIFO (First In, First Out) — das zuerst eingefügte Element wird zuerst entnommen.","aPt":"Uma Stack funciona segundo o princípio LIFO (Last In, First Out) — o último elemento inserido é o primeiro a ser retirado. Uma Queue funciona segundo o princípio FIFO (First In, First Out) — o primeiro elemento inserido é o primeiro a ser retirado.","options":[{"text":"Ein Stack arbeitet nach FIFO, eine Queue nach LIFO.","textPt":"Uma Stack funciona segundo FIFO, uma Queue segundo LIFO.","correct":false},{"text":"Beide arbeiten nach demselben Prinzip und unterscheiden sich nur im Namen.","textPt":"Ambas funcionam segundo o mesmo princípio, diferindo apenas no nome.","correct":false},{"text":"Ein Stack arbeitet nach LIFO (zuletzt eingefügt, zuerst entnommen), eine Queue nach FIFO (zuerst eingefügt, zuerst entnommen).","textPt":"Uma Stack funciona segundo LIFO (o último a entrar é o primeiro a saír), uma Queue segundo FIFO (o primeiro a entrar é o primeiro a saír).","correct":true},{"text":"Ein Stack erlaubt wahlfreien Zugriff auf jedes Element, eine Queue nur sequenziellen Zugriff.","textPt":"Uma Stack permite acesso aleatório a qualquer elemento, uma Queue apenas acesso sequencial.","correct":false}]},
{"cat":"algo","sub":"ds","q":"Was ist eine verkettete Liste (Linked List)?","qPt":"O que é uma lista ligada (Linked List)?","a":"Eine dynamische Datenstruktur, bei der jedes Element (Knoten) seinen Wert und einen Verweis (Zeiger) auf das nächste Element speichert — im Gegensatz zum Array liegt der Speicher nicht zwingend zusammenhängend vor.","aPt":"Uma estrutura de dados dinâmica em que cada elemento (nó) armazena o seu valor e uma referência (ponteiro) para o elemento seguinte — ao contrário de um array, a memória não tem de estar armazenada de forma contígua.","options":[{"text":"Eine dynamische Datenstruktur, bei der jeder Knoten seinen Wert und einen Verweis auf den nächsten Knoten speichert; der Speicher muss nicht zusammenhängend sein.","textPt":"Uma estrutura de dados dinâmica em que cada nó guarda o seu valor e uma referência para o nó seguinte; a memória não precisa de ser contígua.","correct":true},{"text":"Eine Datenstruktur fester Größe, deren Elemente im Speicher zusammenhängend liegen und über einen Index zugreifbar sind.","textPt":"Uma estrutura de dados de tamanho fixo cujos elementos ficam contíguos na memória e são acessíveis através de um índice.","correct":false},{"text":"Eine Datenstruktur, bei der jeder Knoten Verweise auf alle anderen Knoten speichert, um beliebigen Zugriff zu ermöglichen.","textPt":"Uma estrutura de dados em que cada nó guarda referências para todos os outros nós, permitindo acesso arbitrário.","correct":false},{"text":"Eine Datenstruktur, bei der jeder Knoten nur einen Wert speichert, aber keinen Verweis auf andere Knoten besitzt.","textPt":"Uma estrutura de dados em que cada nó guarda apenas um valor, sem qualquer referência a outros nós.","correct":false}]},
{"cat":"algo","sub":"sort","q":"Wie funktioniert Bubble Sort grundsätzlich?","qPt":"Como funciona basicamente o Bubble Sort?","a":"Benachbarte Elemente werden wiederholt paarweise verglichen und bei falscher Reihenfolge vertauscht. Nach jedem Durchlauf \"steigt\" das größte verbliebene Element ans Ende — bis das Array sortiert ist.","aPt":"Elementos vizinhos são repetidamente comparados aos pares e trocados quando estão na ordem errada. Após cada passagem, o maior elemento restante \"sobe\" até ao final — até o array estar ordenado.","options":[{"text":"In jedem Durchlauf wird das kleinste Element im unsortierten Bereich gesucht und mit dem ersten unsortierten Element vertauscht.","textPt":"Em cada passagem procura-se o menor elemento na parte não ordenada e troca-se com o primeiro elemento não ordenado.","correct":false},{"text":"Das Array wird rekursiv in Hälften geteilt, bis einzelne Elemente übrig sind, die dann sortiert zusammengeführt werden.","textPt":"O array é dividido recursivamente em duas metades até restarem elementos isolados, que depois são fundidos de forma ordenada.","correct":false},{"text":"Jedes Element wird schrittweise an der richtigen Position im bereits sortierten Teil des Arrays eingefügt.","textPt":"Cada elemento é inserido passo a passo na posição correta da parte já ordenada do array.","correct":false},{"text":"Benachbarte Elemente werden wiederholt paarweise verglichen und bei falscher Reihenfolge vertauscht, bis nach jedem Durchlauf das größte verbliebene Element ans Ende steigt.","textPt":"Elementos vizinhos são repetidamente comparados aos pares e trocados quando estão na ordem errada, até que em cada passagem o maior elemento restante suba até ao fim.","correct":true}]},
{"cat":"algo","sub":"rekursion","q":"Was ist Rekursion?","qPt":"O que é a recursividade?","a":"Eine Funktion, die sich selbst aufruft, um ein Problem in kleinere gleichartige Teilprobleme zu zerlegen. Sie benötigt eine Abbruchbedingung (Basisfall), sonst läuft sie unendlich weiter.","aPt":"Uma função que se chama a si mesma para decompor um problema em subproblemas mais pequenos e do mesmo tipo. Necessita de uma condição de paragem (caso base), caso contrário continua indefinidamente.","options":[{"text":"Eine Funktion, die statt eines Selbstaufrufs eine Schleife verwendet, um ein Problem zu lösen.","textPt":"Uma função que, em vez de se chamar a si própria, usa um ciclo para resolver um problema.","correct":false},{"text":"Eine Funktion, die sich selbst aufruft, um ein Problem in kleinere gleichartige Teilprobleme zu zerlegen; sie benötigt eine Abbruchbedingung, sonst läuft sie unendlich weiter.","textPt":"Uma função que se chama a si própria para decompor um problema em subproblemas semelhantes mais pequenos; precisa de uma condição de paragem, senão corre indefinidamente.","correct":true},{"text":"Eine Funktion, die sich selbst aufruft und dabei nie eine Abbruchbedingung benötigt, da sie automatisch stoppt.","textPt":"Uma função que se chama a si própria e nunca precisa de uma condição de paragem, pois para automaticamente.","correct":false},{"text":"Eine Funktion, die sich selbst aufruft und dabei grundsätzlich weniger Speicher benötigt als eine Schleife.","textPt":"Uma função que se chama a si própria e que, por norma, precisa de menos memória do que um ciclo.","correct":false}]},
{"cat":"algo","sub":"sort","q":"Wie funktioniert die binäre Suche und welche Voraussetzung hat sie?","qPt":"Como funciona a pesquisa binária e que condição tem de estar reunida?","a":"Sie halbiert wiederholt den Suchbereich, indem sie den Mittelwert mit dem Zielwert vergleicht. Voraussetzung: Das Array muss sortiert sein. Laufzeit: O(log n).","aPt":"Divide repetidamente o intervalo de pesquisa a meio, comparando o valor do meio com o valor procurado. Condição: o array tem de estar ordenado. Complexidade temporal: O(log n).","options":[{"text":"Sie prüft jedes Element nacheinander vom Anfang des Arrays, benötigt kein sortiertes Array, Laufzeit O(n).","textPt":"Verifica cada elemento sequencialmente a partir do início do array, não exige um array ordenado e tem complexidade O(n).","correct":false},{"text":"Sie setzt ein sortiertes Array voraus, hat aber im Durchschnitt eine Laufzeit von O(n).","textPt":"Exige um array ordenado, mas tem, em média, uma complexidade de O(n).","correct":false},{"text":"Sie halbiert wiederholt den Suchbereich, indem der Mittelwert mit dem Zielwert verglichen wird; Voraussetzung ist ein sortiertes Array, Laufzeit O(log n).","textPt":"Reduz repetidamente a área de busca à metade, comparando o valor do meio com o valor procurado; exige um array ordenado e tem complexidade O(log n).","correct":true},{"text":"Sie funktioniert auch auf unsortierten Arrays, da die Werte über eine Hashfunktion zugeordnet werden.","textPt":"Funciona também em arrays não ordenados, pois os valores são mapeados através de uma função de hash.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Was bedeutet Kapselung (Encapsulation) in der OOP?","qPt":"O que significa encapsulamento (Encapsulation) na POO?","a":"Attribute einer Klasse werden vor direktem Zugriff von außen geschützt (meist private) und nur über definierte Methoden (Getter/Setter) zugänglich gemacht — das schützt die Datenintegrität.","aPt":"Os atributos de uma classe são protegidos de acesso direto a partir do exterior (geralmente privados) e tornados acessíveis apenas através de métodos definidos (getters/setters) — isto protege a integridade dos dados.","options":[{"text":"Attribute einer Klasse werden vor direktem Zugriff von außen geschützt und nur über Getter/Setter zugänglich gemacht, um die Datenintegrität zu schützen.","textPt":"Os atributos de uma classe são protegidos do acesso direto externo e tornados acessíveis apenas através de getters/setters, protegendo a integridade dos dados.","correct":true},{"text":"Eine Unterklasse übernimmt Attribute und Methoden einer Oberklasse und kann diese erweitern oder überschreiben.","textPt":"Uma subclasse herda atributos e métodos de uma superclasse e pode estendê-los ou sobrepô-los.","correct":false},{"text":"Objekte unterschiedlicher Klassen verhalten sich bei Aufruf derselben Methode unterschiedlich.","textPt":"Objetos de classes diferentes comportam-se de forma diferente ao chamar o mesmo método.","correct":false},{"text":"Alle Attribute einer Klasse werden bewusst öffentlich gemacht, damit sie von außen direkt verändert werden können.","textPt":"Todos os atributos de uma classe são deliberadamente tornados públicos, para poderem ser alterados diretamente do exterior.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Was ist Vererbung (Inheritance) in der OOP?","qPt":"O que é a herança (Inheritance) na POO?","a":"Eine Klasse (Unterklasse) übernimmt Attribute und Methoden einer anderen Klasse (Oberklasse) und kann diese erweitern oder überschreiben — fördert Wiederverwendbarkeit.","aPt":"Uma classe (subclasse) herda atributos e métodos de outra classe (superclasse) e pode alargá-los ou sobrepô-los (override) — promove a reutilização de código.","options":[{"text":"Attribute einer Klasse werden vor direktem Zugriff von außen geschützt und nur über Getter/Setter zugänglich gemacht.","textPt":"Os atributos de uma classe são protegidos do acesso direto externo e tornados acessíveis apenas através de getters/setters.","correct":false},{"text":"Das Prinzip, nur wesentliche Eigenschaften eines Objekts abzubilden und unwichtige Details auszublenden.","textPt":"O princípio de representar apenas as propriedades essenciais de um objeto, ocultando os detalhes irrelevantes.","correct":false},{"text":"Eine Klasse kann dabei mehrere Interfaces implementieren, aber keine Klasse erweitern.","textPt":"Uma classe pode, assim, implementar vários interfaces, mas não pode estender nenhuma classe.","correct":false},{"text":"Eine Unterklasse übernimmt Attribute und Methoden einer Oberklasse und kann diese erweitern oder überschreiben, was Wiederverwendbarkeit fördert.","textPt":"Uma subclasse herda atributos e métodos de uma superclasse e pode estendê-los ou sobrepô-los, promovendo a reutilização.","correct":true}]},
{"cat":"algo","sub":"oop","q":"Was ist Polymorphismus?","qPt":"O que é o polimorfismo?","a":"Objekte unterschiedlicher Klassen können über dieselbe Methodensignatur angesprochen werden, verhalten sich dabei aber je nach konkreter Klasse unterschiedlich (z. B. durch Methodenüberschreibung).","aPt":"Objetos de classes diferentes podem ser tratados através da mesma assinatura de método, mas comportam-se de forma diferente de acordo com a classe concreta (por exemplo, através da sobreposição de métodos/override).","options":[{"text":"Eine Klasse kann zur Laufzeit beliebig viele Instanzen besitzen, die sich aber alle identisch verhalten.","textPt":"Uma classe pode ter, em tempo de execução, qualquer número de instâncias, mas todas se comportam de forma idêntica.","correct":false},{"text":"Objekte unterschiedlicher Klassen können über dieselbe Methodensignatur angesprochen werden, verhalten sich dabei aber je nach Klasse unterschiedlich, z. B. durch Overriding.","textPt":"Objetos de classes diferentes podem ser invocados através da mesma assinatura de método, mas comportam-se de forma diferente segundo a classe, por exemplo através de overriding.","correct":true},{"text":"Mehrere Methoden mit gleichem Namen, aber unterschiedlicher Parameterliste werden in derselben Klasse definiert.","textPt":"Vários métodos com o mesmo nome, mas com listas de parâmetros diferentes, são definidos na mesma classe.","correct":false},{"text":"Attribute eines Objekts werden vor direktem Zugriff von außen verborgen.","textPt":"Os atributos de um objeto são ocultados do acesso direto externo.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Was ist der Unterschied zwischen einer abstrakten Klasse und einem Interface?","qPt":"Qual é a diferença entre uma classe abstrata e uma interface?","a":"Eine abstrakte Klasse kann sowohl implementierte als auch abstrakte Methoden sowie Attribute enthalten und wird über einfache Vererbung genutzt. Ein Interface definiert primär Methodensignaturen (Verträge); eine Klasse kann mehrere Interfaces implementieren. Seit Java 8 dürfen Interfaces zusätzlich default- und static-Methoden mit eigener Implementierung enthalten, Instanzattribute sind aber weiterhin nicht möglich (nur öffentliche, statische, finale Konstanten).","aPt":"Uma classe abstrata pode conter tanto métodos implementados como métodos abstratos, além de atributos, e é utilizada através de herança simples. Uma interface define principalmente assinaturas de métodos (contratos); uma classe pode implementar várias interfaces. Desde o Java 8, as interfaces também podem conter métodos default e static com implementação própria, mas continuam a não permitir atributos de instância (apenas constantes públicas, estáticas e finais).","options":[{"text":"Eine abstrakte Klasse darf nur abstrakte Methoden enthalten, während ein Interface auch Instanzattribute besitzen darf.","textPt":"Uma classe abstrata só pode conter métodos abstratos, enquanto um interface pode ter atributos de instância.","correct":false},{"text":"Interfaces erlauben seit jeher Mehrfachvererbung von Implementierung inklusive Instanzattributen, abstrakte Klassen hingegen nicht.","textPt":"Os interfaces sempre permitiram herança múltipla de implementação, incluindo atributos de instância, ao contrário das classes abstratas.","correct":false},{"text":"Eine abstrakte Klasse kann implementierte und abstrakte Methoden sowie Attribute enthalten (einfache Vererbung); ein Interface definiert primär Methodensignaturen, ist mehrfach implementierbar und darf seit Java 8 default-/static-Methoden, aber keine Instanzattribute enthalten.","textPt":"Uma classe abstrata pode conter métodos implementados e abstratos, bem como atributos (herança simples); um interface define principalmente assinaturas de métodos, pode ser implementado várias vezes e, desde o Java 8, pode ter métodos default/static, mas não atributos de instância.","correct":true},{"text":"Eine Klasse kann mehrere abstrakte Klassen, aber nur ein einziges Interface implementieren.","textPt":"Uma classe pode implementar várias classes abstratas, mas apenas um único interface.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was unterscheidet Primärschlüssel und Fremdschlüssel in einer Datenbank?","qPt":"Qual é a diferença entre chave primária e chave estrangeira numa base de dados?","a":"Der Primärschlüssel identifiziert einen Datensatz eindeutig innerhalb seiner Tabelle. Der Fremdschlüssel verweist auf den Primärschlüssel einer anderen Tabelle und stellt so die Beziehung zwischen Tabellen her.","aPt":"A chave primária identifica de forma única um registo dentro da sua tabela. A chave estrangeira remete para a chave primária de outra tabela, estabelecendo assim a relação entre tabelas.","options":[{"text":"Der Primärschlüssel identifiziert einen Datensatz eindeutig innerhalb seiner Tabelle, der Fremdschlüssel verweist auf den Primärschlüssel einer anderen Tabelle.","textPt":"A chave primária identifica de forma única um registo dentro da sua própria tabela, a chave estrangeira remete para a chave primária de outra tabela.","correct":true},{"text":"Der Fremdschlüssel identifiziert einen Datensatz eindeutig innerhalb seiner Tabelle, der Primärschlüssel verweist auf eine andere Tabelle.","textPt":"A chave estrangeira identifica de forma única um registo dentro da sua própria tabela, a chave primária remete para outra tabela.","correct":false},{"text":"Beide identifizieren Datensätze eindeutig innerhalb ihrer Tabelle, sie unterscheiden sich nur im Namen.","textPt":"Ambas identificam registos de forma única dentro da sua tabela, diferindo apenas no nome.","correct":false},{"text":"Ein Fremdschlüssel muss ebenso wie der Primärschlüssel innerhalb seiner eigenen Tabelle immer eindeutig sein.","textPt":"Uma chave estrangeira, tal como a chave primária, tem sempre de ser única dentro da sua própria tabela.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was ist der Unterschied zwischen INNER JOIN und LEFT JOIN in SQL?","qPt":"Qual é a diferença entre INNER JOIN e LEFT JOIN em SQL?","a":"INNER JOIN liefert nur Datensätze, die in beiden Tabellen eine Übereinstimmung haben. LEFT JOIN liefert zusätzlich alle Datensätze der linken Tabelle, auch wenn es in der rechten keine Übereinstimmung gibt (dann mit NULL-Werten).","aPt":"O INNER JOIN devolve apenas os registos que têm correspondência em ambas as tabelas. O LEFT JOIN devolve, além disso, todos os registos da tabela da esquerda, mesmo quando não há correspondência na tabela da direita (nesse caso com valores NULL).","options":[{"text":"LEFT JOIN liefert nur Datensätze mit Übereinstimmung in beiden Tabellen; INNER JOIN liefert zusätzlich alle Datensätze der linken Tabelle.","textPt":"O LEFT JOIN devolve apenas registos com correspondência em ambas as tabelas; o INNER JOIN devolve ainda todos os registos da tabela da esquerda.","correct":false},{"text":"INNER JOIN liefert alle Datensätze aus beiden Tabellen, unabhängig von einer Übereinstimmung.","textPt":"O INNER JOIN devolve todos os registos de ambas as tabelas, independentemente de haver correspondência.","correct":false},{"text":"LEFT JOIN liefert nur die Datensätze der linken Tabelle, die keine Übereinstimmung in der rechten Tabelle haben.","textPt":"O LEFT JOIN devolve apenas os registos da tabela da esquerda que não têm correspondência na tabela da direita.","correct":false},{"text":"INNER JOIN liefert nur Datensätze mit Übereinstimmung in beiden Tabellen; LEFT JOIN liefert zusätzlich alle Datensätze der linken Tabelle, auch ohne Übereinstimmung (dann mit NULL).","textPt":"O INNER JOIN devolve apenas registos com correspondência em ambas as tabelas; o LEFT JOIN devolve ainda todos os registos da tabela da esquerda, mesmo sem correspondência (nesse caso com NULL).","correct":true}]},
{"cat":"algo","sub":"sql","q":"Was fordert die erste Normalform (1NF)?","qPt":"O que exige a primeira forma normal (1FN)?","a":"Jedes Attribut enthält nur atomare (unteilbare) Werte, es gibt keine Wiederholungsgruppen und jede Zeile ist über einen Primärschlüssel eindeutig identifizierbar.","aPt":"Cada atributo contém apenas valores atómicos (indivisíveis), não existem grupos repetitivos e cada linha é identificável de forma única através de uma chave primária.","options":[{"text":"Jedes Nicht-Schlüsselattribut ist voll funktional abhängig vom gesamten Primärschlüssel.","textPt":"Cada atributo não-chave depende funcionalmente por completo da chave primária inteira.","correct":false},{"text":"Jedes Attribut enthält nur atomare Werte, es gibt keine Wiederholungsgruppen, und jede Zeile ist über einen Primärschlüssel eindeutig identifizierbar.","textPt":"Cada atributo contém apenas valores atómicos, não existem grupos repetitivos e cada linha é identificável de forma única através de uma chave primária.","correct":true},{"text":"Es gibt keine transitiven Abhängigkeiten zwischen Nicht-Schlüsselattributen.","textPt":"Não existem dependências transitivas entre atributos não-chave.","correct":false},{"text":"Zeilen mit gleichen Werten in bestimmten Spalten werden zur Berechnung von Aggregatfunktionen zusammengefasst.","textPt":"Linhas com valores iguais em determinadas colunas são agrupadas para calcular funções de agregação.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was fordert die zweite Normalform (2NF)?","qPt":"O que exige a segunda forma normal (2FN)?","a":"Die Tabelle erfüllt die 1NF, und jedes Nicht-Schlüsselattribut ist voll funktional abhängig vom gesamten Primärschlüssel (keine Abhängigkeit von nur einem Teil eines zusammengesetzten Schlüssels).","aPt":"A tabela cumpre a 1FN e cada atributo que não faz parte da chave depende funcionalmente da totalidade da chave primária (sem dependência de apenas uma parte de uma chave composta).","options":[{"text":"Die Tabelle enthält nur atomare Werte und keine Wiederholungsgruppen.","textPt":"A tabela contém apenas valores atómicos e nenhum grupo repetitivo.","correct":false},{"text":"Die Tabelle erfüllt die 2NF zusätzlich dadurch, dass keine transitiven Abhängigkeiten zwischen Nicht-Schlüsselattributen bestehen.","textPt":"A tabela cumpre ainda a 2FN ao não existirem dependências transitivas entre atributos não-chave.","correct":false},{"text":"Die Tabelle erfüllt die 1NF, und jedes Nicht-Schlüsselattribut ist voll funktional abhängig vom gesamten Primärschlüssel, nicht nur von einem Teil davon.","textPt":"A tabela cumpre a 1FN, e cada atributo não-chave depende funcionalmente por completo da chave primária inteira, não apenas de parte dela.","correct":true},{"text":"Jeder Fremdschlüssel verweist eindeutig auf den Primärschlüssel genau einer anderen Tabelle.","textPt":"Cada chave estrangeira remete de forma inequívoca para a chave primária de exatamente uma outra tabela.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was fordert die dritte Normalform (3NF)?","qPt":"O que exige a terceira forma normal (3FN)?","a":"Die Tabelle erfüllt die 2NF, und es gibt keine transitiven Abhängigkeiten — Nicht-Schlüsselattribute dürfen nicht von anderen Nicht-Schlüsselattributen abhängen, sondern nur vom Primärschlüssel.","aPt":"A tabela cumpre a 2FN e não existem dependências transitivas — os atributos que não fazem parte da chave não podem depender de outros atributos não-chave, mas apenas da chave primária.","options":[{"text":"Die Tabelle erfüllt die 2NF, und es gibt keine transitiven Abhängigkeiten — Nicht-Schlüsselattribute hängen nur vom Primärschlüssel ab, nicht von anderen Nicht-Schlüsselattributen.","textPt":"A tabela cumpre a 2FN, e não existem dependências transitivas — os atributos não-chave dependem apenas da chave primária, não de outros atributos não-chave.","correct":true},{"text":"Jedes Nicht-Schlüsselattribut ist voll funktional abhängig vom gesamten Primärschlüssel.","textPt":"Cada atributo não-chave depende funcionalmente por completo da chave primária inteira.","correct":false},{"text":"Jedes Attribut enthält nur atomare Werte, und es gibt keine Wiederholungsgruppen.","textPt":"Cada atributo contém apenas valores atómicos, e não existem grupos repetitivos.","correct":false},{"text":"Fremdschlüssel zwischen Tabellen dürfen bei Einhaltung dieser Normalform nicht mehr verwendet werden.","textPt":"Ao cumprir esta forma normal, deixam de poder ser usadas chaves estrangeiras entre tabelas.","correct":false}]},
{"cat":"algo","sub":"sort","q":"Was beschreibt die Big-O-Notation?","qPt":"O que descreve a notação Big-O?","a":"Sie beschreibt, wie die Laufzeit oder der Speicherbedarf eines Algorithmus im schlechtesten Fall mit wachsender Eingabegröße n zunimmt, z. B. O(1), O(log n), O(n), O(n²).","aPt":"Descreve como o tempo de execução ou a necessidade de memória de um algoritmo aumenta no pior caso com o crescimento do tamanho da entrada n, por exemplo O(1), O(log n), O(n), O(n²).","options":[{"text":"Sie beschreibt die genaue durchschnittliche Anzahl an Rechenschritten, die ein Algorithmus für eine bestimmte Eingabe benötigt.","textPt":"Descreve o número médio exato de passos de cálculo que um algoritmo precisa para uma determinada entrada.","correct":false},{"text":"Sie beschreibt ausschließlich den Speicherbedarf eines Algorithmus, nicht dessen Laufzeit.","textPt":"Descreve exclusivamente a memória necessária de um algoritmo, não o seu tempo de execução.","correct":false},{"text":"Sie beschreibt, wie sich die Laufzeit eines Algorithmus im besten Fall mit wachsender Eingabegröße verhält.","textPt":"Descreve como o tempo de execução de um algoritmo se comporta no melhor caso com o aumento do tamanho da entrada.","correct":false},{"text":"Sie beschreibt, wie Laufzeit oder Speicherbedarf eines Algorithmus im schlechtesten Fall mit wachsender Eingabegröße n zunimmt, z. B. O(1), O(log n), O(n), O(n²).","textPt":"Descreve como o tempo de execução ou a memória necessária de um algoritmo aumenta no pior caso com o crescimento do tamanho da entrada n, por exemplo O(1), O(log n), O(n), O(n²).","correct":true}]},
{"cat":"algo","sub":"ds","q":"Was ist der Unterschied zwischen einem Array und einer verketteten Liste bezüglich des Zugriffs?","qPt":"Qual é a diferença entre um array e uma lista ligada em termos de acesso?","a":"Ein Array erlaubt direkten Zugriff über einen Index in O(1), da die Elemente zusammenhängend gespeichert sind. Bei einer verketteten Liste muss man ab dem Anfang sequenziell durchlaufen, Zugriff ist O(n) — dafür sind Einfügen/Löschen oft günstiger.","aPt":"Um array permite acesso direto através de um índice em O(1), uma vez que os elementos estão armazenados de forma contígua. Numa lista ligada é preciso percorrê-la sequencialmente a partir do início, pelo que o acesso é O(n) — em contrapartida, a inserção/remoção é normalmente mais eficiente.","options":[{"text":"Eine verkettete Liste erlaubt direkten Indexzugriff in O(1), ein Array benötigt dafür O(n), da sequenziell durchlaufen werden muss.","textPt":"Uma lista encadeada permite acesso direto por índice em O(1), enquanto um array precisa de O(n), pois tem de ser percorrido sequencialmente.","correct":false},{"text":"Ein Array erlaubt direkten Indexzugriff in O(1), da die Elemente zusammenhängend liegen; bei einer verketteten Liste ist der Zugriff O(n), da sequenziell ab dem Anfang durchlaufen werden muss.","textPt":"Um array permite acesso direto por índice em O(1), pois os elementos ficam contíguos; numa lista encadeada, o acesso é O(n), pois é preciso percorrer sequencialmente a partir do início.","correct":true},{"text":"Beide Strukturen erlauben Zugriff auf ein Element in O(1), da moderne Systeme den Speicher gleich verwalten.","textPt":"Ambas as estruturas permitem acesso a um elemento em O(1), pois os sistemas modernos gerem a memória da mesma forma.","correct":false},{"text":"Ein Array ermöglicht Zugriff über eine Art binäre Suche in O(log n), unabhängig von der Speicheranordnung.","textPt":"Um array permite o acesso através de uma espécie de busca binária em O(log n), independentemente da disposição na memória.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Wozu dient das SQL-Statement GROUP BY?","qPt":"Para que serve a instrução SQL GROUP BY?","a":"Es gruppiert Zeilen mit gleichen Werten in bestimmten Spalten zusammen, meist in Kombination mit Aggregatfunktionen wie COUNT(), SUM() oder AVG(), um pro Gruppe ein Ergebnis zu berechnen.","aPt":"Agrupa linhas que têm valores iguais em determinadas colunas, normalmente em combinação com funções de agregação como COUNT(), SUM() ou AVG(), para calcular um resultado por grupo.","options":[{"text":"GROUP BY filtert einzelne Zeilen vor der Gruppierung anhand einer Bedingung.","textPt":"O GROUP BY filtra linhas individuais antes do agrupamento, com base numa condição.","correct":false},{"text":"GROUP BY filtert Gruppen nach der Ausführung der Aggregatfunktionen anhand einer Bedingung.","textPt":"O GROUP BY filtra grupos depois da execução das funções de agregação, com base numa condição.","correct":false},{"text":"GROUP BY gruppiert Zeilen mit gleichen Werten in bestimmten Spalten, meist kombiniert mit Aggregatfunktionen wie COUNT(), SUM() oder AVG(), um ein Ergebnis pro Gruppe zu berechnen.","textPt":"O GROUP BY agrupa linhas com valores iguais em determinadas colunas, normalmente combinado com funções de agregação como COUNT(), SUM() ou AVG(), para calcular um resultado por grupo.","correct":true},{"text":"GROUP BY sortiert das Ergebnis einer Abfrage aufsteigend oder absteigend nach einer Spalte.","textPt":"O GROUP BY ordena o resultado de uma consulta de forma crescente ou decrescente por uma coluna.","correct":false}]},
{"cat":"algo","sub":"ds","q":"Was ist ein Array?","qPt":"O que é um array?","a":"Eine Datenstruktur fester Größe, die Elemente desselben Typs zusammenhängend im Speicher ablegt und über einen Index direkt zugreifbar macht.","aPt":"Uma estrutura de dados de tamanho fixo que armazena elementos do mesmo tipo de forma contígua na memória e permite o acesso direto através de um índice.","options":[{"text":"Eine Datenstruktur fester Größe, die Elemente desselben Typs zusammenhängend im Speicher ablegt und über einen Index direkt zugreifbar macht.","textPt":"Uma estrutura de dados de tamanho fixo que guarda elementos do mesmo tipo de forma contígua na memória e os torna acessíveis diretamente através de um índice.","correct":true},{"text":"Eine dynamische Datenstruktur, bei der jeder Knoten seinen Wert und einen Verweis auf den nächsten Knoten speichert.","textPt":"Uma estrutura de dados dinâmica em que cada nó guarda o seu valor e uma referência para o nó seguinte.","correct":false},{"text":"Eine Datenstruktur, die Schlüssel über eine Hashfunktion auf Speicherplätze abbildet.","textPt":"Uma estrutura de dados que mapeia chaves para posições de memória através de uma função de hash.","correct":false},{"text":"Eine Baumstruktur, bei der jeder Knoten maximal zwei Kindknoten besitzt.","textPt":"Uma estrutura em árvore em que cada nó tem, no máximo, dois nós-filho.","correct":false}]},
{"cat":"algo","sub":"ds","q":"Was ist ein binärer Baum?","qPt":"O que é uma árvore binária?","a":"Eine Baumstruktur, bei der jeder Knoten maximal zwei Kindknoten (linkes und rechtes Kind) besitzt.","aPt":"Uma estrutura em árvore em que cada nó tem, no máximo, dois nós-filho (filho esquerdo e filho direito).","options":[{"text":"Eine Baumstruktur, bei der jeder Knoten eine beliebige Anzahl an Kindknoten besitzen kann.","textPt":"Uma estrutura em árvore em que cada nó pode ter qualquer número de nós-filho.","correct":false},{"text":"Eine Baumstruktur, bei der jeder Knoten genau zwei Kindknoten besitzen muss.","textPt":"Uma estrutura em árvore em que cada nó tem necessariamente de ter exatamente dois nós-filho.","correct":false},{"text":"Eine Baumstruktur, bei der alle Werte im linken Teilbaum kleiner und im rechten größer als der Knotenwert sind.","textPt":"Uma estrutura em árvore em que todos os valores na subárvore esquerda são menores e na direita maiores do que o valor do nó.","correct":false},{"text":"Eine Baumstruktur, bei der jeder Knoten maximal zwei Kindknoten (linkes und rechtes Kind) besitzt.","textPt":"Uma estrutura em árvore em que cada nó tem, no máximo, dois nós-filho (filho esquerdo e filho direito).","correct":true}]},
{"cat":"algo","sub":"ds","q":"Was ist ein binärer Suchbaum?","qPt":"O que é uma árvore binária de pesquisa?","a":"Ein binärer Baum, bei dem für jeden Knoten gilt: alle Werte im linken Teilbaum sind kleiner, alle im rechten Teilbaum größer als der Knotenwert. Bei einem ausgeglichenen Baum ermöglicht das Suche in O(log n); im ungünstigsten Fall, z. B. bei einem entarteten (listenartigen) Baum, verschlechtert sich die Laufzeit auf O(n).","aPt":"Uma árvore binária em que, para cada nó, todos os valores na subárvore esquerda são menores e todos os valores na subárvore direita são maiores do que o valor do nó. Numa árvore equilibrada, isto permite pesquisar em O(log n); no pior caso, por exemplo numa árvore degenerada (semelhante a uma lista), o tempo de execução piora para O(n).","options":[{"text":"Ein binärer Baum, bei dem jeder Knoten maximal zwei Kindknoten besitzt, ohne Ordnung zwischen den Werten.","textPt":"Uma árvore binária em que cada nó tem, no máximo, dois nós-filho, sem qualquer ordem entre os valores.","correct":false},{"text":"Ein binärer Baum, bei dem im linken Teilbaum nur kleinere und im rechten nur größere Werte als der Knoten stehen; bei Ausgeglichenheit Suche in O(log n), bei entartetem Baum O(n).","textPt":"Uma árvore binária em que a subárvore esquerda contém apenas valores menores e a direita apenas valores maiores do que o nó; equilibrada, a busca é O(log n); numa árvore degenerada, piora para O(n).","correct":true},{"text":"Ein binärer Baum, bei dem im linken Teilbaum nur größere und im rechten nur kleinere Werte als der Knoten stehen.","textPt":"Uma árvore binária em que a subárvore esquerda contém apenas valores maiores e a direita apenas valores menores do que o nó.","correct":false},{"text":"Ein binärer Suchbaum, dessen Suchzeit unabhängig von der Form des Baumes stets O(log n) beträgt.","textPt":"Uma árvore binária de busca cujo tempo de pesquisa é sempre O(log n), independentemente da forma da árvore.","correct":false}]},
