{"cat":"plan","sub":"pm","q":"Ein Vorgang hat FAZ (frühester Anfangszeitpunkt) = 5 und Dauer = 4. Wie hoch ist der früheste Endzeitpunkt (FEZ)?","qPt":"Uma atividade tem FAZ (início mais cedo) = 5 e duração = 4. Qual é o FEZ (fim mais cedo)?","a":"FEZ = FAZ + Dauer = 5 + 4 = 9.","aPt":"FEZ = FAZ + duração = 5 + 4 = 9.","options":[{"text":"FEZ = FAZ − Dauer = 5 − 4 = 1.","textPt":"FEZ = FAZ − Duração = 5 − 4 = 1.","correct":false},{"text":"FEZ = FAZ + Dauer = 5 + 4 = 10, da der Starttag mitgezählt wird.","textPt":"FEZ = FAZ + Duração = 5 + 4 = 10, pois o dia de início também é contado.","correct":false},{"text":"FEZ = FAZ + Dauer = 5 + 4 = 9.","textPt":"FEZ (fim mais precoce) = FAZ + Duração = 5 + 4 = 9.","correct":true},{"text":"FEZ entspricht dem Gesamtpuffer des Vorgangs und beträgt somit 4.","textPt":"FEZ corresponde à margem total (Gesamtpuffer) da atividade, sendo portanto 4.","correct":false}]},
{"cat":"plan","sub":"pm","q":"Wie berechnet sich der Gesamtpuffer (GP) eines Vorgangs in der Netzplantechnik?","qPt":"Como se calcula a folga total (GP) de uma atividade na técnica de planeamento em rede (Netzplantechnik)?","a":"GP = SEZ − FEZ (spätester Endzeitpunkt minus frühester Endzeitpunkt), alternativ auch SAZ − FAZ. Ist GP = 0, liegt der Vorgang auf dem kritischen Pfad.","aPt":"GP = SEZ − FEZ (fim mais tarde menos fim mais cedo), ou, em alternativa, SAZ − FAZ (início mais tarde menos início mais cedo). Se GP = 0, a atividade está no caminho crítico.","options":[{"text":"GP = SEZ − FEZ (alternativ SAZ − FAZ); ist GP = 0, liegt der Vorgang auf dem kritischen Pfad.","textPt":"GP (margem total) = SEZ − FEZ (ou alternativamente SAZ − FAZ); se GP = 0, a atividade está no caminho crítico.","correct":true},{"text":"GP = FEZ − SEZ; ist GP = 0, liegt der Vorgang nicht auf dem kritischen Pfad.","textPt":"GP = FEZ − SEZ; se GP = 0, a atividade não está no caminho crítico.","correct":false},{"text":"GP entspricht der Dauer des Vorgangs, also FEZ − FAZ.","textPt":"GP corresponde à duração da atividade, ou seja, FEZ − FAZ.","correct":false},{"text":"GP ist stets identisch mit dem freien Puffer eines Vorgangs und unabhängig vom Endtermin des Projekts.","textPt":"GP é sempre idêntico à margem livre (freier Puffer) de uma atividade e independente do prazo final do projeto.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was bedeutet \"Isolation\" (das I in ACID) bei Datenbanktransaktionen in der Praxis?","qPt":"O que significa \"Isolation\" (o I de ACID) na prática, em transações de bases de dados?","a":"Parallel laufende Transaktionen dürfen sich nicht gegenseitig in unerwünschter Weise beeinflussen — jede Transaktion läuft (aus ihrer Sicht) so ab, als wäre sie die einzige, die gerade auf die Datenbank zugreift, obwohl technisch mehrere gleichzeitig ablaufen können.","aPt":"As transações que correm em paralelo não se podem influenciar mutuamente de forma indesejada — cada transação decorre (do seu ponto de vista) como se fosse a única a aceder à base de dados naquele momento, embora, tecnicamente, várias possam estar a correr em simultâneo.","options":[{"text":"Parallel laufende Transaktionen dürfen sich nicht gegenseitig unerwünscht beeinflussen — jede läuft so ab, als wäre sie die einzige auf der Datenbank.","textPt":"Transações em paralelo não se podem influenciar mutuamente de forma indesejada — cada uma decorre como se fosse a única a aceder à base de dados.","correct":true},{"text":"Isolation bedeutet, dass jede Transaktion vollständig ausgeführt wird oder komplett zurückgerollt wird, ohne Zwischenzustände.","textPt":"Isolamento significa que cada transação é executada por completo ou é totalmente revertida, sem estados intermédios.","correct":false},{"text":"Isolation bedeutet, dass Daten nach einer erfolgreichen Transaktion dauerhaft gespeichert bleiben, auch bei einem Systemabsturz.","textPt":"Isolamento significa que os dados permanecem guardados de forma permanente após uma transação bem-sucedida, mesmo em caso de falha do sistema.","correct":false},{"text":"Isolation bedeutet, dass alle Transaktionen strikt nacheinander und niemals gleichzeitig ausgeführt werden dürfen.","textPt":"Isolamento significa que todas as transações têm de ser executadas estritamente em sequência, nunca em simultâneo.","correct":false}]},
{"cat":"algo","sub":"pseudocode","q":"Gibt es eine gemeinsame Struktur, die (fast) jede Algorithmen-Pseudocode-Aufgabe der AP2 verwendet?","qPt":"Existe uma estrutura comum que (quase) todos os exercícios de pseudocódigo da AP2 seguem?","qCode":"methodenName(parameter: Typ[]): Rückgabetyp\n    // 1) Ergebnis anlegen — 2) Eingabe durchlaufen\n    // 3) pro Element entscheiden — 4) Ergebnis zurückgeben","a":"Ja: der Rückgabetyp verrät, was man anlegen muss — Integer=Zähler, Typ[]/List=neue Sammlung, void=bestehendes Array wird verändert.","aPt":"Sim: Integer → vais construir um contador; Tipo[] ou List<Tipo> → vais construir uma coleção nova; void → vais alterar o array/lista que já existe.","options":[{"text":"Integer → Zähler; Typ[]/List<Typ> → neue Sammlung; void → bestehendes Array wird verändert.","textPt":"Integer → contador; Tipo[]/List<Tipo> → coleção nova; void → o array existente é alterado.","correct":true},{"text":"Der Rückgabetyp hat keinen Einfluss darauf, was man im Algorithmus anlegen muss.","textPt":"O tipo de retorno não influencia o que precisas de construir no algoritmo.","correct":false},{"text":"Der Rückgabetyp bestimmt immer die Anzahl der Schleifendurchläufe.","textPt":"O tipo de retorno determina sempre o número de iterações do ciclo.","correct":false},{"text":"void bedeutet immer, dass die Methode ein neues Array zurückgibt.","textPt":"void significa sempre que o método devolve um array novo.","correct":false}]},
{"cat":"algo","sub":"pseudocode","q":"zaehleAktiver(Mitglied[] mitglieder): Integer soll zählen, bei wie vielen Mitgliedern besucheDiesenMonat größer als besucheVorigenMonat war. Welche Bedingung gehört in den Schleifenkörper?","qPt":"zaehleAktiver(Mitglied[] mitglieder): Integer deve contar em quantos membros besucheDiesenMonat foi maior que besucheVorigenMonat. Qual é a condição correta dentro do ciclo?","qCode":"Klasse Mitglied { name, besucheDiesenMonat, besucheVorigenMonat }  // getters\nzaehleAktiver(mitglieder: Mitglied[]): Integer\n    count: Integer = 0\n    for (i = 0; i < mitglieder.length; i++)\n        if ( ??? ) count++\n    End For\n    Return count","a":"mitglieder[i].getBesucheDiesenMonat() > mitglieder[i].getBesucheVorigenMonat() — vergleicht die beiden Getter DESSELBEN Objekts i.","aPt":"mitglieder[i].getBesucheDiesenMonat() > mitglieder[i].getBesucheVorigenMonat() — compara os dois getters do MESMO objeto i.","options":[{"text":"mitglieder[i].getBesucheDiesenMonat() > mitglieder[i].getBesucheVorigenMonat()","textPt":"mitglieder[i].getBesucheDiesenMonat() > mitglieder[i].getBesucheVorigenMonat()","correct":true},{"text":"mitglieder[i].getBesucheDiesenMonat() > mitglieder[i+1].getBesucheVorigenMonat()","textPt":"mitglieder[i].getBesucheDiesenMonat() > mitglieder[i+1].getBesucheVorigenMonat() — compara com o membro seguinte em vez do mesmo membro.","correct":false},{"text":"mitglieder[i].getName() > mitglieder[i].getBesucheVorigenMonat()","textPt":"mitglieder[i].getName() > mitglieder[i].getBesucheVorigenMonat() — compara um nome com um número, não faz sentido.","correct":false},{"text":"mitglieder[i].getBesucheDiesenMonat() >= mitglieder[i].getBesucheVorigenMonat()","textPt":"mitglieder[i].getBesucheDiesenMonat() >= mitglieder[i].getBesucheVorigenMonat() — com >= contarias também quem teve exatamente as mesmas visitas nos dois meses.","correct":false}]},
{"cat":"algo","sub":"pseudocode","q":"Im Bubble-Sort für sortiere(buchungen, vergleiche) wird getauscht, wenn vergleiche(buchungen[j], buchungen[j+1]) > 0 ist. Welche Tausch-Zeilen sind korrekt?","qPt":"No Bubble Sort de sortiere(buchungen, vergleiche), troca-se quando vergleiche(buchungen[j], buchungen[j+1]) > 0. Quais são as linhas de troca corretas?","qCode":"for (i = 0; i < buchungen.length - 1; i++)\n    for (j = 0; j < buchungen.length - 1 - i; j++)\n        if (vergleiche(buchungen[j], buchungen[j+1]) > 0)\n            ???\n        End if","a":"Zimmerbuchung k = buchungen[j]; buchungen[j] = buchungen[j+1]; buchungen[j+1] = k; — mit Hilfsvariable k, sonst geht der ursprüngliche Wert von buchungen[j] verloren.","aPt":"Zimmerbuchung k = buchungen[j]; buchungen[j] = buchungen[j+1]; buchungen[j+1] = k; — com a variável auxiliar k, senão o valor original de buchungen[j] perde-se.","options":[{"text":"Zimmerbuchung k = buchungen[j]; buchungen[j] = buchungen[j+1]; buchungen[j+1] = k;","textPt":"Zimmerbuchung k = buchungen[j]; buchungen[j] = buchungen[j+1]; buchungen[j+1] = k;","correct":true},{"text":"buchungen[j] = buchungen[j+1]; buchungen[j+1] = buchungen[j];","textPt":"buchungen[j] = buchungen[j+1]; buchungen[j+1] = buchungen[j]; — sem variável auxiliar, o valor original de buchungen[j] já foi perdido na primeira linha.","correct":false},{"text":"buchungen[j+1] = buchungen[j];","textPt":"buchungen[j+1] = buchungen[j]; — só copia um valor, não troca nada, e o de buchungen[j] mantém-se igual.","correct":false},{"text":"vergleiche(buchungen[j], buchungen[j+1]) = 0","textPt":"vergleiche(buchungen[j], buchungen[j+1]) = 0 — tentar atribuir um valor ao resultado de uma função não é uma troca, nem faz sentido.","correct":false}]},

const CATS = {
  plan:  { label: 'Planen eines Softwareproduktes', short: 'Planen', var: '--stamp-1', bg: '--stamp-1-bg' },
  algo:  { label: 'Entwicklung & Umsetzung von Algorithmen', short: 'Algorithmen', var: '--stamp-2', bg: '--stamp-2-bg' },
  wiso:  { label: 'Wirtschafts- und Sozialkunde', short: 'Wiso', var: '--stamp-3', bg: '--stamp-3-bg' },
};

const els = {
  filters: document.getElementById('filters'),
  progressFill: document.getElementById('progressFill'),
  progressText: document.getElementById('progressText'),
  scoreText: document.getElementById('scoreText'),
  tab: document.getElementById('tab'),
  tabDot: document.getElementById('tabDot'),
  tabText: document.getElementById('tabText'),
  qtext: document.getElementById('qtext'),
  qextra: document.getElementById('qextra'),
  qpt: document.getElementById('qpt'),
  options: document.getElementById('options'),
  explain: document.getElementById('explain'),
  atext: document.getElementById('atext'),
  aextra: document.getElementById('aextra'),
  apt: document.getElementById('apt'),
  nextBtn: document.getElementById('nextBtn'),
  mischenBtn: document.getElementById('mischenBtn'),
  resetBtn: document.getElementById('resetBtn'),
  ptToggle: document.getElementById('ptToggle'),
  themeToggle: document.getElementById('themeToggle'),
};

// Which section(s) the quiz draws from — 'all' or one of the CATS keys.
// Picking one narrows the question pool to just that section, like
// choosing a single filter chip; there's no multi-select here since a
// quiz run is meant to stay focused on one section (or everything).
let activeCat = 'all';

function buildFilters(){
  els.filters.innerHTML = '';
  els.filters.appendChild(makeChip('all', 'Alle', null));
  const presentCats = new Set(QUIZ.map(c => c.cat));
  Object.entries(CATS).forEach(([key, c])=>{
    if(presentCats.has(key)) els.filters.appendChild(makeChip(key, c.short, c));
  });
  updateFilterUI();
}

function makeChip(key, label, catObj){
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.dataset.key = key;
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.background = catObj ? `var(${catObj.var})` : 'var(--ink-soft)';
  btn.appendChild(dot);
  const span = document.createElement('span');
  span.textContent = label;
  btn.appendChild(span);
  btn.addEventListener('click', ()=> selectCat(key));
  return btn;
}

function updateFilterUI(){
  [...els.filters.children].forEach(chip=>{
    chip.dataset.active = (chip.dataset.key === activeCat) ? 'true' : 'false';
  });
}

function selectCat(key){
  if(key === activeCat) return;
  activeCat = key;
  updateFilterUI();
  rebuildOrder();
}

function rebuildOrder(){
  order = QUIZ.map((_,i)=>i).filter(i => activeCat === 'all' || QUIZ[i].cat === activeCat);
  pos = 0;
  render();
  saveQuizProgress();
}

let order = QUIZ.map((_,i)=>i);
let pos = 0;
let results = {}; // { quizIndex: true|false }
let answered = false;

const QUIZ_KEY = 'ap2-lernkartei-quiz-progress';
function saveQuizProgress(){
  try{
    localStorage.setItem(QUIZ_KEY, JSON.stringify({ order, pos, results, activeCat }));
  }catch(e){}
}
function loadQuizProgress(){
  try{
    const raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return null;
    const saved = JSON.parse(raw);
    if(!Array.isArray(saved.order) || !saved.order.every(i => Number.isInteger(i) && i >= 0 && i < QUIZ.length)) return null;
    if(typeof saved.pos !== 'number' || saved.pos < 0 || saved.pos >= Math.max(saved.order.length,1)) return null;
    if(saved.activeCat && saved.activeCat !== 'all' && !CATS[saved.activeCat]) return null;
    return saved;
  }catch(e){ return null; }
}

function currentQuestion(){
  return QUIZ[order[pos]];
}

function updateScore(){
  const answeredCount = Object.keys(results).length;
  const correctCount = Object.values(results).filter(Boolean).length;
  els.scoreText.textContent = answeredCount > 0
    ? `${correctCount} von ${answeredCount} richtig`
    : '0 richtig';
}

function fillExtra(container, code){
  container.innerHTML = '';
  if(code){
    const pre = document.createElement('pre');
    pre.className = 'codeblock';
    pre.textContent = code;
    container.appendChild(pre);
  }
}

function render(){
  if(order.length === 0){
    els.qtext.textContent = 'Keine Fragen verfügbar.';
    els.qextra.innerHTML = '';
    els.options.innerHTML = '';
    els.explain.classList.remove('show');
    return;
  }
  const c = currentQuestion();
  const qi = order[pos];
  const meta = CATS[c.cat];
  els.tab.style.background = `var(${meta.bg})`;
  els.tab.style.color = `var(${meta.var})`;
  els.tabDot.style.background = `var(${meta.var})`;
  els.tabText.textContent = meta.short;
  els.qtext.textContent = c.q;
  fillExtra(els.qextra, c.qCode);
  els.qpt.textContent = c.qPt || '';
  els.atext.textContent = c.a;
  fillExtra(els.aextra, c.aCode);
  els.apt.textContent = c.aPt || '';

  els.options.innerHTML = '';
  c.options.forEach((opt, oi)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';
    const span = document.createElement('div');
    span.textContent = opt.text;
    btn.appendChild(span);
    const pt = document.createElement('div');
    pt.className = 'optpt';
    pt.textContent = opt.textPt || '';
    btn.appendChild(pt);
    btn.addEventListener('click', ()=> selectOption(oi));
    els.options.appendChild(btn);
  });

  const alreadyAnswered = Object.prototype.hasOwnProperty.call(results, qi);
  answered = alreadyAnswered;
  if(alreadyAnswered){
    revealAnswer();
  } else {
    els.explain.classList.remove('show');
  }
  els.nextBtn.disabled = !alreadyAnswered;

  els.progressText.textContent = `Frage ${pos+1} von ${order.length}`;
  els.progressFill.style.width = `${(pos/order.length)*100}%`;
  updateScore();
}

function revealAnswer(){
  // Used when returning to a question already answered in a previous
  // session (after a reload). We only persist whether the pick was
  // correct, not which option it was, so on resume we highlight the
  // correct option but don't re-highlight the earlier wrong pick.
  const c = currentQuestion();
  const optionEls = els.options.querySelectorAll('.option');
  optionEls.forEach((btn, oi)=>{
    btn.disabled = true;
    if(c.options[oi].correct){
      btn.classList.add('correct');
    }
  });
  els.explain.classList.add('show');
}

function selectOption(oi){
  if(answered) return;
  answered = true;
  const c = currentQuestion();
  const qi = order[pos];
  const isCorrect = !!c.options[oi].correct;
  results[qi] = isCorrect;
  saveQuizProgress();

  const optionEls = els.options.querySelectorAll('.option');
  optionEls.forEach((btn, i)=>{
    btn.disabled = true;
    if(c.options[i].correct){
      btn.classList.add('correct');
    } else if(i === oi && !isCorrect){
      btn.classList.add('wrong');
    }
  });

  els.explain.classList.add('show');
  els.nextBtn.disabled = false;
  updateScore();
}

function next(){
  if(order.length === 0) return;
  pos = (pos + 1) % order.length;
  render();
  saveQuizProgress();
}

function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

els.nextBtn.addEventListener('click', next);
els.mischenBtn.addEventListener('click', ()=>{
  shuffleArr(order);
  pos = 0;
  render();
  saveQuizProgress();
});
els.resetBtn.addEventListener('click', ()=>{
  results = {};
  pos = 0;
  render();
  saveQuizProgress();
});

const THEME_ICONS = {

    return (v === 'light' || v === 'dark') ? v : 'auto';
  }catch(e){ return 'auto'; }
}
function saveThemePref(pref){

    if(pref === 'auto') localStorage.removeItem(THEME_KEY);

  if(pref === 'auto') document.documentElement.removeAttribute('data-theme');

    els.themeToggle.innerHTML = THEME_ICONS[pref] + '<span>' + THEME_LABELS[pref] + '</span>';
    els.themeToggle.setAttribute('aria-label', 'Design: ' + THEME_LABELS[pref] + ' — zum Wechseln klicken');
  }

let themePref = loadThemePref();
applyTheme(themePref);
if(els.themeToggle){
  els.themeToggle.addEventListener('click', () => {
    const i = THEME_ORDER.indexOf(themePref);
    themePref = THEME_ORDER[(i + 1) % THEME_ORDER.length];
    saveThemePref(themePref);
    applyTheme(themePref);
  });
}

const savedQuiz = loadQuizProgress();
if(savedQuiz){
  activeCat = savedQuiz.activeCat || 'all';
  order = savedQuiz.order;
  pos = savedQuiz.pos;
  results = savedQuiz.results || {};
  buildFilters();
  render();
} else {
  buildFilters();
  rebuildOrder();
}

if('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
