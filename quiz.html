{"cat":"wiso","sub":"wirtschaft","q":"Was ist ein Polypol?","qPt":"O que é um polipólio (Polypol)?","a":"Eine Marktform mit vielen Anbietern und vielen Nachfragern, bei der kein einzelner Marktteilnehmer allein den Preis wesentlich beeinflussen kann (z. B. Modell des vollkommenen Marktes).","aPt":"Uma forma de mercado com muitos fornecedores e muitos compradores, em que nenhum participante isolado consegue, por si só, influenciar significativamente o preço (por exemplo, o modelo do mercado perfeito).","options":[{"text":"Eine Marktform mit nur einem Anbieter, der den Preis für das gesamte Angebot allein festlegen kann.","textPt":"Uma forma de mercado com apenas um fornecedor, que pode fixar sozinho o preço de toda a oferta.","correct":false},{"text":"Eine Marktform mit wenigen großen Anbietern, die sich bei ihren Preisstrategien gegenseitig abstimmen.","textPt":"Uma forma de mercado com poucos grandes fornecedores, que coordenam entre si as suas estratégias de preços.","correct":false},{"text":"Eine Marktform mit vielen Anbietern, aber nur einem einzigen Nachfrager, der die Preise bestimmt.","textPt":"Uma forma de mercado com muitos fornecedores, mas apenas um único comprador, que determina os preços.","correct":false},{"text":"Eine Marktform mit vielen Anbietern und vielen Nachfragern, bei der kein einzelner Marktteilnehmer den Preis wesentlich beeinflussen kann.","textPt":"Uma forma de mercado com muitos fornecedores e muitos compradores, em que nenhum participante consegue influenciar significativamente o preço.","correct":true}]},
{"cat":"wiso","sub":"steuern","q":"Was ist die Umsatzsteuer und wer trägt sie wirtschaftlich?","qPt":"O que é o Umsatzsteuer (imposto sobre o volume de negócios, correspondente ao IVA) e quem o suporta economicamente?","a":"Eine indirekte Steuer auf den Verkauf von Waren und Dienstleistungen, die vom Unternehmen an den Staat abgeführt, aber wirtschaftlich letztlich vom Endverbraucher getragen wird.","aPt":"Um imposto indireto sobre a venda de bens e serviços, que é entregue ao Estado pela empresa, mas que, economicamente, é suportado, em última instância, pelo consumidor final.","options":[{"text":"Eine indirekte Steuer auf den Verkauf von Waren und Dienstleistungen, die das Unternehmen abführt, wirtschaftlich aber vom Endverbraucher getragen wird.","textPt":"Um imposto indireto sobre a venda de bens e serviços, que a empresa entrega ao Estado mas que, economicamente, é suportado pelo consumidor final.","correct":true},{"text":"Eine direkte Steuer auf das Einkommen von Unternehmen, die ausschließlich vom Unternehmen selbst wirtschaftlich getragen wird.","textPt":"Um imposto direto sobre o rendimento das empresas, que é suportado economicamente apenas pela própria empresa.","correct":false},{"text":"Eine Steuer auf den Gewinn von Unternehmen, die von den Gemeinden erhoben wird und deren Höhe der Hebesatz bestimmt.","textPt":"Um imposto sobre o lucro das empresas, cobrado pelos municípios, cuja taxa (Hebesatz) é fixada por estes.","correct":false},{"text":"Eine direkte Steuer, die der Endverbraucher selbst beim Finanzamt anmelden und abführen muss, ohne dass das Unternehmen beteiligt ist.","textPt":"Um imposto direto que o próprio consumidor final tem de declarar e entregar diretamente às Finanças, sem qualquer intervenção da empresa.","correct":false}]},
{"cat":"wiso","sub":"steuern","q":"Was ist der Unterschied zwischen direkten und indirekten Steuern?","qPt":"Qual é a diferença entre impostos diretos e indiretos?","a":"Bei direkten Steuern (z. B. Einkommensteuer) fallen Steuerschuldner und wirtschaftlich Belasteter zusammen. Bei indirekten Steuern (z. B. Umsatzsteuer) führt ein anderer die Steuer ab, als sie wirtschaftlich trägt.","aPt":"Nos impostos diretos (por exemplo, o imposto sobre o rendimento), o sujeito passivo do imposto coincide com quem economicamente o suporta. Nos impostos indiretos (por exemplo, o imposto sobre o volume de negócios), quem entrega o imposto ao Estado é diferente de quem o suporta economicamente.","options":[{"text":"Direkte Steuern werden vom Staat direkt vom Arbeitgeber eingezogen, indirekte Steuern zahlt der Arbeitnehmer eigenständig ans Finanzamt.","textPt":"Os impostos diretos são cobrados pelo Estado diretamente ao empregador, os indiretos são pagos pelo próprio trabalhador às Finanças.","correct":false},{"text":"Bei direkten Steuern fallen Steuerschuldner und wirtschaftlich Belasteter zusammen, bei indirekten Steuern führt ein anderer die Steuer ab, als sie wirtschaftlich trägt.","textPt":"Nos impostos diretos, o sujeito passivo e quem suporta o encargo económico coincidem; nos indiretos, quem entrega o imposto é diferente de quem o suporta economicamente.","correct":true},{"text":"Direkte Steuern betreffen nur Unternehmen, indirekte Steuern betreffen ausschließlich Privatpersonen.","textPt":"Os impostos diretos aplicam-se apenas a empresas, os indiretos aplicam-se exclusivamente a particulares.","correct":false},{"text":"Direkte Steuern werden auf Bundesebene erhoben, indirekte Steuern ausschließlich von den Gemeinden.","textPt":"Os impostos diretos são cobrados a nível federal, os indiretos exclusivamente pelos municípios.","correct":false}]},
{"cat":"wiso","sub":"steuern","q":"Was besteuert die Gewerbesteuer?","qPt":"O que tributa a Gewerbesteuer (imposto sobre a atividade comercial/industrial)?","a":"Sie besteuert den Ertrag von Gewerbebetrieben und wird von den Gemeinden erhoben, die auch den Hebesatz festlegen.","aPt":"Tributa o rendimento das empresas comerciais/industriais e é cobrada pelos municípios, que também definem a respetiva taxa (Hebesatz).","options":[{"text":"Sie besteuert den Umsatz aus dem Verkauf von Waren und Dienstleistungen und wird vollständig an den Bund abgeführt.","textPt":"Tributa o volume de vendas de bens e serviços e é integralmente entregue à Federação (Bund).","correct":false},{"text":"Sie besteuert das Einkommen von Einzelpersonen und wird einheitlich vom Finanzamt des Bundeslandes festgelegt.","textPt":"Tributa o rendimento das pessoas físicas e é fixado de forma uniforme pelas Finanças do Land.","correct":false},{"text":"Sie besteuert den Ertrag von Gewerbebetrieben und wird von den Gemeinden erhoben, die den Hebesatz selbst festlegen.","textPt":"Tributa o lucro das empresas comerciais (Gewerbebetriebe) e é cobrada pelos municípios, que fixam a taxa (Hebesatz).","correct":true},{"text":"Sie besteuert ausschließlich das Vermögen von Kapitalgesellschaften und wird bundesweit mit einem einheitlichen Satz erhoben.","textPt":"Tributa exclusivamente o património das sociedades de capitais e é cobrada em todo o país com uma taxa única.","correct":false}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist ein Konjunkturzyklus?","qPt":"O que é um ciclo económico (Konjunkturzyklus)?","a":"Die wiederkehrende Abfolge von Aufschwung, Boom (Hochkonjunktur), Abschwung und Rezession/Depression in der gesamtwirtschaftlichen Entwicklung.","aPt":"A sequência recorrente de recuperação, expansão (boom), abrandamento e recessão/depressão na evolução da economia como um todo.","options":[{"text":"Der einmalige, dauerhafte Übergang einer Volkswirtschaft von der Industrie- zur Dienstleistungsgesellschaft.","textPt":"A transição única e definitiva de uma economia de uma sociedade industrial para uma sociedade de serviços.","correct":false},{"text":"Die gleichmäßige, kontinuierliche Steigerung des Bruttoinlandsprodukts ohne nennenswerte Schwankungen über mehrere Jahrzehnte.","textPt":"O aumento contínuo e regular do Produto Interno Bruto, sem flutuações relevantes, ao longo de várias décadas.","correct":false},{"text":"Die saisonale Schwankung der Verbraucherausgaben zwischen den Sommer- und Wintermonaten eines Kalenderjahres.","textPt":"A variação sazonal dos gastos dos consumidores entre os meses de verão e de inverno de um ano civil.","correct":false},{"text":"Die wiederkehrende Abfolge von Aufschwung, Boom, Abschwung und Rezession in der gesamtwirtschaftlichen Entwicklung.","textPt":"A sucessão recorrente de expansão, boom (alta conjuntura), desaceleração e recessão na evolução económica geral.","correct":true}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was misst das Bruttoinlandsprodukt (BIP)?","qPt":"O que mede o Produto Interno Bruto (PIB)?","a":"Den Gesamtwert aller im Inland innerhalb eines Zeitraums (meist eines Jahres) hergestellten Waren und Dienstleistungen — ein zentraler Indikator für die wirtschaftliche Leistung eines Landes.","aPt":"O valor total de todos os bens e serviços produzidos no território nacional durante um determinado período (geralmente um ano) — um indicador central do desempenho económico de um país.","options":[{"text":"Den Gesamtwert aller im Inland in einem Zeitraum hergestellten Waren und Dienstleistungen als zentralen Indikator der wirtschaftlichen Leistung.","textPt":"O valor total de todos os bens e serviços produzidos no país num determinado período, um indicador central do desempenho económico.","correct":true},{"text":"Den Gesamtwert aller Exporte eines Landes abzüglich der Importe innerhalb eines Jahres.","textPt":"O valor total das exportações de um país, deduzido das importações, num ano.","correct":false},{"text":"Das Gesamtvermögen aller Bürger eines Landes einschließlich Immobilien, Aktien und Ersparnisse.","textPt":"O património total de todos os cidadãos de um país, incluindo imóveis, ações e poupanças.","correct":false},{"text":"Die Summe aller Steuereinnahmen des Staates innerhalb eines Haushaltsjahres.","textPt":"A soma de todas as receitas fiscais do Estado num ano orçamental.","correct":false}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist der Unterschied zwischen Inflation und Deflation?","qPt":"Qual é a diferença entre inflação e deflação?","a":"Inflation beschreibt einen anhaltenden Anstieg des allgemeinen Preisniveaus (Kaufkraftverlust), Deflation einen anhaltenden Rückgang des Preisniveaus.","aPt":"A inflação designa um aumento sustentado do nível geral de preços (com perda de poder de compra); a deflação designa uma queda sustentada do nível de preços.","options":[{"text":"Inflation beschreibt einen Rückgang der Arbeitslosigkeit, Deflation einen Anstieg der Arbeitslosenquote.","textPt":"Inflação descreve uma redução do desemprego, deflação um aumento da taxa de desemprego.","correct":false},{"text":"Inflation ist ein anhaltender Anstieg des allgemeinen Preisniveaus mit Kaufkraftverlust, Deflation ein anhaltender Rückgang des Preisniveaus.","textPt":"Inflação é um aumento sustentado do nível geral de preços, com perda de poder de compra; deflação é uma queda sustentada do nível de preços.","correct":true},{"text":"Inflation ist ein kurzfristiger Preisanstieg bei einzelnen Produkten, Deflation ein dauerhafter Anstieg der Zinssätze.","textPt":"Inflação é um aumento pontual do preço de produtos específicos, deflação é um aumento permanente das taxas de juro.","correct":false},{"text":"Inflation bezeichnet das Wachstum des Bruttoinlandsprodukts, Deflation dessen Schrumpfung in einer Rezession.","textPt":"Inflação designa o crescimento do Produto Interno Bruto, deflação a sua contração numa recessão.","correct":false}]},
{"cat":"wiso","sub":"wirtschaft","q":"Nenne zwei Arten von Arbeitslosigkeit.","qPt":"Indique dois tipos de desemprego.","a":"Z. B. konjunkturelle Arbeitslosigkeit (durch wirtschaftliche Abschwungphasen), strukturelle Arbeitslosigkeit (durch Wandel von Wirtschaftsstrukturen) und friktionelle Arbeitslosigkeit (durch vorübergehenden Wechsel zwischen Arbeitsplätzen).","aPt":"Por exemplo, o desemprego conjuntural (causado por fases de abrandamento económico), o desemprego estrutural (causado por mudanças nas estruturas económicas) e o desemprego friccional (causado pela transição temporária entre postos de trabalho).","options":[{"text":"Zum Beispiel saisonale Arbeitslosigkeit durch Inflation und freiwillige Arbeitslosigkeit durch zu hohe Lohnforderungen der Arbeitnehmer.","textPt":"Por exemplo, desemprego sazonal causado pela inflação e desemprego voluntário causado por exigências salariais excessivas dos trabalhadores.","correct":false},{"text":"Zum Beispiel demografische Arbeitslosigkeit durch Bevölkerungswachstum und technische Arbeitslosigkeit durch gesetzliche Vorschriften.","textPt":"Por exemplo, desemprego demográfico causado pelo crescimento populacional e desemprego técnico causado por normas legais.","correct":false},{"text":"Zum Beispiel konjunkturelle Arbeitslosigkeit durch wirtschaftliche Abschwungphasen und strukturelle Arbeitslosigkeit durch den Wandel von Wirtschaftsstrukturen.","textPt":"Por exemplo, desemprego conjuntural, causado por fases de desaceleração económica, e desemprego estrutural, causado pela mudança das estruturas económicas.","correct":true},{"text":"Zum Beispiel regionale Arbeitslosigkeit durch Naturkatastrophen und politische Arbeitslosigkeit durch Regierungswechsel.","textPt":"Por exemplo, desemprego regional causado por catástrofes naturais e desemprego político causado por mudanças de governo.","correct":false}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was versteht man unter Globalisierung?","qPt":"O que se entende por globalização?","a":"Die zunehmende weltweite wirtschaftliche, politische, kulturelle und technologische Vernetzung und gegenseitige Abhängigkeit von Ländern und Märkten.","aPt":"A crescente interligação e interdependência económica, política, cultural e tecnológica, a nível mundial, entre países e mercados.","options":[{"text":"Die Rückkehr von Unternehmen zu rein nationalen Produktions- und Absatzstrukturen ohne internationale Verflechtung.","textPt":"O regresso das empresas a estruturas de produção e venda puramente nacionais, sem qualquer ligação internacional.","correct":false},{"text":"Die gesetzlich vorgeschriebene Vereinheitlichung aller Steuersysteme innerhalb der Europäischen Union.","textPt":"A uniformização obrigatória, por lei, de todos os sistemas fiscais dentro da União Europeia.","correct":false},{"text":"Die ausschließliche Zusammenarbeit von Staaten im militärischen und sicherheitspolitischen Bereich.","textPt":"A cooperação exclusiva entre Estados apenas no domínio militar e de segurança.","correct":false},{"text":"Die zunehmende weltweite wirtschaftliche, politische, kulturelle und technologische Vernetzung und gegenseitige Abhängigkeit von Ländern und Märkten.","textPt":"A crescente interligação e interdependência económica, política, cultural e tecnológica de países e mercados a nível mundial.","correct":true}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was sind Standortfaktoren für Unternehmen?","qPt":"O que são fatores de localização (Standortfaktoren) para as empresas?","a":"Kriterien, die die Attraktivität eines Wirtschaftsstandorts beeinflussen, z. B. Infrastruktur, Lohnkosten, Verfügbarkeit von Fachkräften, Steuerlast, rechtliche Rahmenbedingungen und Nähe zu Absatzmärkten.","aPt":"Critérios que influenciam a atratividade de uma localização económica, como a infraestrutura, os custos salariais, a disponibilidade de mão de obra qualificada, a carga fiscal, o quadro legal e a proximidade dos mercados de venda.","options":[{"text":"Kriterien, die die Attraktivität eines Wirtschaftsstandorts beeinflussen, z. B. Infrastruktur, Lohnkosten, Fachkräfteverfügbarkeit, Steuerlast und Nähe zu Absatzmärkten.","textPt":"Critérios que influenciam a atratividade de uma localização económica, como infraestrutura, custos salariais, disponibilidade de mão de obra qualificada, carga fiscal e proximidade dos mercados.","correct":true},{"text":"Kennzahlen, die ausschließlich die Finanzierungsstruktur eines Unternehmens anhand von Eigen- und Fremdkapital beschreiben.","textPt":"Indicadores que descrevem exclusivamente a estrutura de financiamento de uma empresa através de capital próprio e capital de terceiros.","correct":false},{"text":"Gesetzlich festgelegte Mindestanforderungen, die ein Unternehmen erfüllen muss, um überhaupt gegründet werden zu dürfen.","textPt":"Requisitos mínimos estabelecidos por lei que uma empresa tem de cumprir para poder ser constituída.","correct":false},{"text":"Kriterien zur Bewertung der Kreditwürdigkeit eines Unternehmens durch Banken und Ratingagenturen.","textPt":"Critérios usados por bancos e agências de rating para avaliar a solvabilidade de uma empresa.","correct":false}]},
{"cat":"wiso","sub":"schutz","q":"Was regelt das Bundesdatenschutzgesetz (BDSG) im Verhältnis zur DSGVO?","qPt":"O que regula a Bundesdatenschutzgesetz (BDSG, lei federal de proteção de dados) em relação ao RGPD?","a":"Es ergänzt und konkretisiert die DSGVO für Deutschland dort, wo die DSGVO den Mitgliedstaaten eigenen Regelungsspielraum lässt (z. B. Beschäftigtendatenschutz).","aPt":"Complementa e concretiza o RGPD para a Alemanha, nos pontos em que o RGPD deixa aos Estados-membros margem própria de regulamentação (por exemplo, na proteção de dados dos trabalhadores).","options":[{"text":"Es ersetzt die DSGVO vollständig für alle in Deutschland tätigen Unternehmen und hebt deren Regelungen auf.","textPt":"Substitui integralmente a DSGVO (RGPD) para todas as empresas que operam na Alemanha, revogando as suas disposições.","correct":false},{"text":"Es ergänzt und konkretisiert die DSGVO für Deutschland dort, wo diese den Mitgliedstaaten eigenen Regelungsspielraum lässt, z. B. beim Beschäftigtendatenschutz.","textPt":"Complementa e concretiza a DSGVO (RGPD) para a Alemanha nos pontos em que esta deixa margem de regulação própria aos Estados-membros, por exemplo na proteção de dados dos trabalhadores.","correct":true},{"text":"Es regelt ausschließlich den Datenschutz bei Behörden und ist auf private Unternehmen nicht anwendbar.","textPt":"Regula exclusivamente a proteção de dados em organismos públicos e não é aplicável a empresas privadas.","correct":false},{"text":"Es setzt eine EU-Richtlinie um, die der DSGVO in ihrem Anwendungsbereich vorrangig ist.","textPt":"Transpõe uma diretiva da UE que prevalece sobre a DSGVO (RGPD) no seu âmbito de aplicação.","correct":false}]},
{"cat":"wiso","sub":"tarif","q":"Was ist eine Betriebsvereinbarung?","qPt":"O que é uma Betriebsvereinbarung (acordo de empresa)?","a":"Eine schriftliche Vereinbarung zwischen Arbeitgeber und Betriebsrat, die betriebliche Angelegenheiten verbindlich für alle Arbeitnehmer des Betriebs regelt.","aPt":"Um acordo escrito entre o empregador e o Betriebsrat que regula, de forma vinculativa para todos os trabalhadores da empresa, questões relativas ao funcionamento da empresa.","options":[{"text":"Eine mündliche Absprache zwischen Arbeitgeber und einzelnen Arbeitnehmern über individuelle Gehaltserhöhungen.","textPt":"Um acordo verbal entre o empregador e trabalhadores individuais sobre aumentos salariais específicos.","correct":false},{"text":"Ein zwischen Gewerkschaft und Arbeitgeberverband geschlossener Vertrag, der branchenweit für mehrere Betriebe gilt.","textPt":"Um contrato celebrado entre um sindicato e uma associação patronal, válido para vários estabelecimentos de todo um setor.","correct":false},{"text":"Eine schriftliche Vereinbarung zwischen Arbeitgeber und Betriebsrat, die betriebliche Angelegenheiten verbindlich für alle Arbeitnehmer des Betriebs regelt.","textPt":"Um acordo escrito entre o empregador e o conselho de empresa (Betriebsrat), que regula de forma vinculativa assuntos internos para todos os trabalhadores do estabelecimento.","correct":true},{"text":"Eine einseitige Anweisung des Arbeitgebers, die ohne Zustimmung des Betriebsrats erlassen werden kann.","textPt":"Uma instrução unilateral do empregador, que pode ser emitida sem o consentimento do conselho de empresa (Betriebsrat).","correct":false}]},
{"cat":"wiso","sub":"schutz","q":"Was verlangt das Arbeitsschutzgesetz (ArbSchG) von Arbeitgebern?","qPt":"O que exige a Arbeitsschutzgesetz (ArbSchG, lei de segurança no trabalho) dos empregadores?","a":"Es verpflichtet Arbeitgeber, Maßnahmen zur Sicherheit und zum Gesundheitsschutz der Beschäftigten bei der Arbeit zu treffen, u. a. durch Gefährdungsbeurteilungen.","aPt":"Obriga os empregadores a adotar medidas de segurança e de proteção da saúde dos trabalhadores no exercício das suas funções, nomeadamente através de avaliações de risco (Gefährdungsbeurteilungen).","options":[{"text":"Es verpflichtet ausschließlich die Arbeitnehmer, eigenverantwortlich für ihre Sicherheit am Arbeitsplatz zu sorgen.","textPt":"Obriga exclusivamente os trabalhadores a zelar, por sua própria responsabilidade, pela sua segurança no local de trabalho.","correct":false},{"text":"Es schreibt vor, dass jeder Betrieb unabhängig von Größe und Branche einen eigenen Betriebsarzt fest anstellen muss.","textPt":"Determina que todas as empresas, independentemente da dimensão ou do setor, têm de contratar um médico do trabalho a tempo inteiro.","correct":false},{"text":"Es regelt ausschließlich den Schutz vor Kündigung während einer Krankheit und hat mit Arbeitssicherheit nichts zu tun.","textPt":"Regula exclusivamente a proteção contra despedimento durante a doença e nada tem a ver com a segurança no trabalho.","correct":false},{"text":"Es verpflichtet Arbeitgeber, Maßnahmen zur Sicherheit und zum Gesundheitsschutz der Beschäftigten zu treffen, u. a. durch Gefährdungsbeurteilungen.","textPt":"Obriga os empregadores a adotar medidas de segurança e proteção da saúde dos trabalhadores, nomeadamente através de avaliações de riscos (Gefährdungsbeurteilungen).","correct":true}]},
{"cat":"wiso","sub":"schutz","q":"Was ist eine Gefährdungsbeurteilung?","qPt":"O que é uma Gefährdungsbeurteilung (avaliação de riscos)?","a":"Eine systematische Ermittlung und Bewertung von Gefahren am Arbeitsplatz mit dem Ziel, geeignete Schutzmaßnahmen abzuleiten.","aPt":"Uma identificação e avaliação sistemática dos riscos existentes no local de trabalho, com o objetivo de definir medidas de proteção adequadas.","options":[{"text":"Eine systematische Ermittlung und Bewertung von Gefahren am Arbeitsplatz mit dem Ziel, geeignete Schutzmaßnahmen abzuleiten.","textPt":"Uma identificação e avaliação sistemática dos riscos no local de trabalho, com o objetivo de definir medidas de proteção adequadas.","correct":true},{"text":"Eine jährliche medizinische Untersuchung aller Beschäftigten durch den Betriebsarzt zur Feststellung ihrer Arbeitsfähigkeit.","textPt":"Um exame médico anual de todos os trabalhadores pelo médico do trabalho para determinar a sua capacidade para o trabalho.","correct":false},{"text":"Eine nachträgliche Untersuchung von Arbeitsunfällen durch die Berufsgenossenschaft zur Feststellung der Schuldfrage.","textPt":"Uma análise posterior de acidentes de trabalho pela associação de seguro de acidentes (Berufsgenossenschaft) para apurar a culpa.","correct":false},{"text":"Eine freiwillige Selbstauskunft der Arbeitnehmer über ihre persönliche Risikobereitschaft am Arbeitsplatz.","textPt":"Uma declaração voluntária dos trabalhadores sobre a sua própria propensão pessoal para o risco no local de trabalho.","correct":false}]},
{"cat":"wiso","sub":"sonstiges-wiso","q":"Was unterscheidet einen kooperativen von einem autoritären Führungsstil?","qPt":"Qual é a diferença entre um estilo de liderança cooperativo e um estilo de liderança autoritário?","a":"Beim kooperativen Führungsstil werden Mitarbeiter in Entscheidungen einbezogen und Verantwortung geteilt. Beim autoritären Führungsstil trifft die Führungskraft Entscheidungen allein und gibt Anweisungen ohne Mitspracherecht der Mitarbeiter.","aPt":"No estilo de liderança cooperativo, os colaboradores são envolvidos nas decisões e a responsabilidade é partilhada. No estilo de liderança autoritário, é o superior hierárquico que toma as decisões sozinho e dá instruções sem direito de participação dos colaboradores.","options":[{"text":"Beim kooperativen Stil trifft ausschließlich die Führungskraft alle Entscheidungen, beim autoritären Stil entscheidet das gesamte Team gemeinsam.","textPt":"No estilo cooperativo, só o superior toma todas as decisões; no estilo autoritário, é toda a equipa que decide em conjunto.","correct":false},{"text":"Beim kooperativen Führungsstil werden Mitarbeiter in Entscheidungen einbezogen und Verantwortung geteilt, beim autoritären Stil entscheidet die Führungskraft allein ohne Mitspracherecht der Mitarbeiter.","textPt":"No estilo cooperativo, os colaboradores são envolvidos nas decisões e a responsabilidade é partilhada; no estilo autoritário, o superior decide só, sem direito de participação dos colaboradores.","correct":true},{"text":"Der kooperative Stil kommt nur in kleinen Start-ups vor, der autoritäre Stil ausschließlich in staatlichen Behörden.","textPt":"O estilo cooperativo só existe em pequenas start-ups, o estilo autoritário apenas em organismos públicos.","correct":false},{"text":"Beim kooperativen Stil gibt es keine Führungskraft, beim autoritären Stil entscheidet ausschließlich der Betriebsrat über alle Maßnahmen.","textPt":"No estilo cooperativo não existe chefia; no estilo autoritário decide exclusivamente o conselho de empresa (Betriebsrat).","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was ist ein befristetes Arbeitsverhältnis?","qPt":"O que é uma relação de trabalho a termo (contrato a prazo)?","a":"Ein Arbeitsverhältnis, das von vornherein auf einen bestimmten Zeitraum oder Zweck begrenzt ist und ohne Kündigung automatisch mit Fristablauf endet.","aPt":"Uma relação de trabalho que, desde o início, está limitada a um determinado período ou finalidade e que termina automaticamente com o fim do prazo, sem necessidade de despedimento.","options":[{"text":"Ein Arbeitsverhältnis, das jederzeit von beiden Seiten ohne Einhaltung einer Frist beendet werden kann.","textPt":"Um contrato de trabalho que pode ser terminado em qualquer momento por ambas as partes, sem necessidade de pré-aviso.","correct":false},{"text":"Ein Arbeitsverhältnis, das nur während der Probezeit besteht und danach automatisch unbefristet wird.","textPt":"Um contrato de trabalho que só existe durante o período experimental e que depois se torna automaticamente sem termo.","correct":false},{"text":"Ein Arbeitsverhältnis, das von vornherein auf einen bestimmten Zeitraum oder Zweck begrenzt ist und ohne Kündigung automatisch mit Fristablauf endet.","textPt":"Um contrato de trabalho limitado desde o início a um período ou a um fim determinado, que termina automaticamente com o decurso do prazo, sem necessidade de despedimento.","correct":true},{"text":"Ein Arbeitsverhältnis, das durch eine ordentliche Kündigung des Arbeitgebers zu einem festen Termin beendet werden muss.","textPt":"Um contrato de trabalho que tem de ser terminado através de um despedimento ordinário do empregador numa data fixa.","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Unter welchen Voraussetzungen ist eine sachgrundlose Befristung nach TzBfG zulässig?","qPt":"Em que condições é permitida, segundo a TzBfG (lei alemã do trabalho a tempo parcial e a termo), uma contratação a termo sem motivo justificativo?","a":"Grundsätzlich bis zu einer Gesamtdauer von 2 Jahren, innerhalb derer eine Verlängerung bis zu dreimal möglich ist, sofern zuvor kein Arbeitsverhältnis mit demselben Arbeitgeber bestand.","aPt":"Em princípio, até uma duração total de 2 anos, dentro da qual é possível renovar o contrato até três vezes, desde que não tenha existido anteriormente uma relação de trabalho com o mesmo empregador.","options":[{"text":"Grundsätzlich bis zu einer Gesamtdauer von 5 Jahren mit beliebig vielen Verlängerungen, unabhängig von einer früheren Beschäftigung.","textPt":"Em princípio até uma duração total de 5 anos, com um número ilimitado de renovações, independentemente de uma relação de trabalho anterior.","correct":false},{"text":"Nur zulässig, wenn ein sachlicher Grund wie Elternzeitvertretung oder ein befristetes Projekt vorliegt.","textPt":"Só é permitido quando existe um motivo justificado (Sachgrund), como a substituição durante uma licença parental ou um projeto temporário.","correct":false},{"text":"Grundsätzlich bis zu einer Gesamtdauer von 1 Jahr, wobei eine einmalige Verlängerung um weitere 6 Monate möglich ist.","textPt":"Em princípio até uma duração total de 1 ano, podendo ser renovado uma única vez por mais 6 meses.","correct":false},{"text":"Grundsätzlich bis zu einer Gesamtdauer von 2 Jahren, innerhalb derer eine Verlängerung bis zu dreimal möglich ist, sofern zuvor kein Arbeitsverhältnis mit demselben Arbeitgeber bestand.","textPt":"Em princípio até uma duração total de 2 anos, com até três renovações possíveis, desde que não tenha existido anteriormente uma relação de trabalho com o mesmo empregador.","correct":true}]},
{"cat":"wiso","sub":"steuern","q":"Was ist der Unterschied zwischen Brutto- und Nettolohn?","qPt":"Qual é a diferença entre salário bruto e salário líquido?","a":"Der Bruttolohn ist der vereinbarte Lohn vor Abzügen. Der Nettolohn ist der tatsächlich ausgezahlte Betrag nach Abzug von Steuern und Sozialversicherungsbeiträgen.","aPt":"O salário bruto é o valor acordado antes de quaisquer deduções. O salário líquido é o montante efetivamente pago após a dedução de impostos e contribuições para a segurança social.","options":[{"text":"Der Bruttolohn ist der vereinbarte Lohn vor Abzügen, der Nettolohn der tatsächlich ausgezahlte Betrag nach Steuern und Sozialabgaben.","textPt":"O salário bruto é o salário acordado antes das deduções; o salário líquido é o montante efetivamente pago após impostos e contribuições para a segurança social.","correct":true},{"text":"Der Bruttolohn ist der nach Abzug von Steuern ausgezahlte Betrag, der Nettolohn der vor Abzügen vereinbarte Lohn.","textPt":"O salário bruto é o montante pago após a dedução de impostos; o salário líquido é o salário acordado antes das deduções.","correct":false},{"text":"Der Bruttolohn umfasst nur das Grundgehalt, der Nettolohn zusätzlich alle Zulagen und Boni.","textPt":"O salário bruto inclui apenas o vencimento base; o salário líquido inclui, além disso, todos os subsídios e prémios.","correct":false},{"text":"Der Bruttolohn wird monatlich gezahlt, der Nettolohn nur einmal jährlich als Jahresabschlusszahlung.","textPt":"O salário bruto é pago mensalmente; o salário líquido é pago apenas uma vez por ano, como pagamento final.","correct":false}]},
{"cat":"wiso","sub":"steuern","q":"Wer trägt die Beiträge zur gesetzlichen Sozialversicherung in Deutschland grundsätzlich?","qPt":"Quem suporta, em princípio, as contribuições para a segurança social obrigatória na Alemanha?","a":"Sie werden in der Regel paritätisch, also etwa zur Hälfte, von Arbeitgeber und Arbeitnehmer getragen (Ausnahmen z. B. bei der Unfallversicherung, die allein der Arbeitgeber trägt).","aPt":"Em regra, são suportadas de forma paritária, ou seja, cerca de metade por cada parte, pelo empregador e pelo trabalhador (há excepções, como o seguro de acidentes de trabalho, que é suportado exclusivamente pelo empregador).","options":[{"text":"Sie werden vollständig vom Arbeitnehmer getragen, der Arbeitgeber beteiligt sich an keiner der Sozialversicherungen.","textPt":"São suportadas integralmente pelo trabalhador, não havendo qualquer participação do empregador em nenhum dos seguros sociais.","correct":false},{"text":"Sie werden in der Regel paritätisch, also etwa zur Hälfte, von Arbeitgeber und Arbeitnehmer getragen, mit Ausnahme der Unfallversicherung, die allein der Arbeitgeber zahlt.","textPt":"Em regra, são suportadas de forma paritária, ou seja, aproximadamente em partes iguais, pelo empregador e pelo trabalhador, com excepção do seguro de acidentes, pago apenas pelo empregador.","correct":true},{"text":"Sie werden vollständig vom Arbeitgeber getragen, da der Arbeitnehmer keine eigenen Beiträge zur Sozialversicherung leistet.","textPt":"São suportadas integralmente pelo empregador, uma vez que o trabalhador não efetua quaisquer contribuições próprias para a segurança social.","correct":false},{"text":"Sie werden ausschließlich vom Staat über Steuermittel finanziert, ohne direkte Beteiligung von Arbeitgebern oder Arbeitnehmern.","textPt":"São financiadas exclusivamente pelo Estado através de receitas fiscais, sem participação direta de empregadores ou trabalhadores.","correct":false}]},
{"cat":"wiso","sub":"steuern","q":"Was ist die Künstlersozialkasse und wen betrifft sie?","qPt":"O que é a Künstlersozialkasse (caixa de segurança social dos artistas) e quem afeta?","a":"Eine Einrichtung, über die selbstständige Künstler und Publizisten Zugang zur gesetzlichen Kranken-, Pflege- und Rentenversicherung erhalten, ähnlich wie Arbeitnehmer, wobei ein Teil der Beiträge über eine Abgabe der Verwerter (z. B. Verlage) finanziert wird.","aPt":"Uma instituição através da qual artistas e publicistas independentes têm acesso ao seguro de doença, de dependência e de reforma obrigatórios, de forma semelhante aos trabalhadores por conta de outrem, sendo parte das contribuições financiada por uma taxa paga pelos exploradores das obras (p. ex. editoras).","options":[{"text":"Eine staatliche Fördereinrichtung, die Künstlern direkte finanzielle Zuschüsse für die Produktion neuer Kunstwerke gewährt.","textPt":"Uma entidade pública que concede subsídios financeiros diretos a artistas para a produção de novas obras de arte.","correct":false},{"text":"Eine private Versicherung, die ausschließlich von den Künstlern selbst ohne jede Beteiligung Dritter finanziert wird.","textPt":"Um seguro privado financiado exclusivamente pelos próprios artistas, sem qualquer participação de terceiros.","correct":false},{"text":"Eine Einrichtung, über die selbstständige Künstler und Publizisten Zugang zur gesetzlichen Kranken-, Pflege- und Rentenversicherung erhalten, teilfinanziert durch eine Abgabe der Verwerter.","textPt":"Uma entidade através da qual artistas e publicistas independentes têm acesso ao seguro público de doença, dependência e reforma, financiada em parte por uma taxa paga pelos exploradores comerciais (Verwerter), como editoras.","correct":true},{"text":"Eine Institution, die festangestellte Mitarbeiter von Kulturbetrieben bei der privaten Krankenversicherung anmeldet.","textPt":"Uma instituição que inscreve trabalhadores com contrato permanente de empresas culturais no seguro de saúde privado.","correct":false}]},
{"cat":"wiso","sub":"unternehmen","q":"Was ist eine Genossenschaft (eG)?","qPt":"O que é uma Genossenschaft (eG) — uma cooperativa registada?","a":"Ein Zusammenschluss von Mitgliedern zur gemeinsamen wirtschaftlichen Förderung, bei dem jedes Mitglied unabhängig von der Kapitaleinlage in der Regel eine Stimme hat.","aPt":"Uma associação de membros com o objetivo de promoção económica conjunta, na qual, independentemente do valor da participação de capital, cada membro tem, em regra, um voto.","options":[{"text":"Eine Vereinigung von Kapitalgebern, bei der das Stimmrecht sich ausschließlich nach der Höhe der Kapitaleinlage richtet.","textPt":"Uma associação de investidores de capital, em que o direito de voto depende exclusivamente do valor da entrada de capital.","correct":false},{"text":"Eine Unternehmensform, die nur von einer einzigen Person gegründet werden kann und keine Mitgliederversammlung kennt.","textPt":"Uma forma de empresa que só pode ser constituída por uma única pessoa e que não tem assembleia de membros.","correct":false},{"text":"Ein Zusammenschluss, dessen Mitglieder unbeschränkt mit ihrem Privatvermögen für die Schulden der Gesellschaft haften.","textPt":"Uma associação cujos membros respondem ilimitadamente com o seu património pessoal pelas dívidas da sociedade.","correct":false},{"text":"Ein Zusammenschluss von Mitgliedern zur gemeinsamen wirtschaftlichen Förderung, bei dem jedes Mitglied unabhängig von der Kapitaleinlage in der Regel eine Stimme hat.","textPt":"Uma associação de membros para a promoção económica comum, em que cada membro tem, em regra, um voto, independentemente do valor da sua entrada de capital.","correct":true}]},
{"cat":"wiso","sub":"unternehmen","q":"Was bedeutet Prokura?","qPt":"O que significa Prokura (uma procuração comercial segundo o direito alemão)?","a":"Eine vom Inhaber erteilte, umfassende Vollmacht, die den Prokuristen berechtigt, das Unternehmen fast uneingeschränkt gerichtlich und außergerichtlich zu vertreten.","aPt":"Uma procuração abrangente, concedida pelo titular da empresa, que autoriza o procurador (Prokurist) a representar a empresa, judicial e extrajudicialmente, de forma quase ilimitada.","options":[{"text":"Eine vom Inhaber erteilte, umfassende Vollmacht, die den Prokuristen berechtigt, das Unternehmen fast uneingeschränkt gerichtlich und außergerichtlich zu vertreten.","textPt":"Uma procuração ampla concedida pelo titular da empresa, que autoriza o Prokurist (procurador comercial) a representar a empresa de forma quase ilimitada, judicial e extrajudicialmente.","correct":true},{"text":"Eine auf einzelne, genau festgelegte Geschäfte beschränkte Vollmacht, die individuell zwischen den Parteien frei ausgehandelt wird.","textPt":"Uma procuração limitada a negócios individuais e precisamente definidos, livremente negociada entre as partes.","correct":false},{"text":"Ein gesetzlicher Anspruch von Arbeitnehmern auf Mitbestimmung bei unternehmerischen Grundsatzentscheidungen.","textPt":"Um direito legal dos trabalhadores à participação nas decisões estratégicas fundamentais da empresa.","correct":false},{"text":"Eine zeitlich auf sechs Monate befristete Vertretungsbefugnis, die danach automatisch erlischt, ohne ins Handelsregister eingetragen zu werden.","textPt":"Um poder de representação limitado a seis meses, que se extingue automaticamente depois e não é inscrito no registo comercial (Handelsregister).","correct":false}]},
{"cat":"wiso","sub":"unternehmen","q":"Was ist der Unterschied zwischen Vollmacht und Prokura?","qPt":"Qual é a diferença entre uma Vollmacht (procuração) e a Prokura?","a":"Eine Vollmacht kann inhaltlich frei und individuell begrenzt werden. Prokura ist eine besondere, gesetzlich geregelte Form der Handlungsvollmacht mit einem gesetzlich festgelegten, weitreichenden Umfang, die ins Handelsregister eingetragen wird.","aPt":"Uma procuração comum pode ter o seu conteúdo livremente limitado e definido caso a caso. A Prokura é uma forma especial e legalmente regulada de procuração comercial, com um âmbito amplo fixado por lei, que é inscrita no registo comercial (Handelsregister).","options":[{"text":"Eine Vollmacht muss immer ins Handelsregister eingetragen werden, Prokura dagegen ist eine rein formlose, mündliche Absprache.","textPt":"Uma procuração comum tem sempre de ser inscrita no registo comercial (Handelsregister), ao passo que a Prokura (procuração comercial ampla prevista por lei) é um acordo puramente informal e verbal.","correct":false},{"text":"Eine Vollmacht kann inhaltlich frei und individuell begrenzt werden. Prokura ist eine besondere, gesetzlich geregelte Form mit einem gesetzlich festgelegten, weitreichenden Umfang, die ins Handelsregister eingetragen wird.","textPt":"Uma procuração comum pode ser livremente limitada no seu conteúdo; a Prokura é uma forma legalmente regulada, com um alcance amplo definido por lei, inscrita no registo comercial (Handelsregister).","correct":true},{"text":"Eine Vollmacht gilt nur für Kaufleute, Prokura kann hingegen von jeder Privatperson ohne Gewerbe erteilt werden.","textPt":"Uma procuração comum só se aplica a comerciantes, enquanto a Prokura pode ser concedida por qualquer particular sem atividade comercial.","correct":false},{"text":"Eine Vollmacht und Prokura unterscheiden sich ausschließlich in der Dauer der Gültigkeit, nicht im Umfang der Vertretungsbefugnis.","textPt":"Uma procuração comum e a Prokura diferem apenas na duração da sua validade, não no alcance do poder de representação.","correct":false}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist ein Wechselkurs?","qPt":"O que é uma taxa de câmbio?","a":"Das Austauschverhältnis zwischen zwei Währungen, das angibt, wie viel Einheiten einer Währung man für eine Einheit einer anderen Währung erhält.","aPt":"A relação de troca entre duas moedas, que indica quantas unidades de uma moeda se obtêm por uma unidade de outra moeda.","options":[{"text":"Der Zinssatz, den Zentralbanken verschiedener Länder sich gegenseitig für kurzfristige Kredite berechnen.","textPt":"A taxa de juro que os bancos centrais de diferentes países cobram entre si por créditos de curto prazo.","correct":false},{"text":"Der Betrag, den ein Land jährlich mehr exportiert als importiert, ausgedrückt in der eigenen Währung.","textPt":"O montante que um país exporta anualmente a mais do que importa, expresso na sua própria moeda.","correct":false},{"text":"Das Austauschverhältnis zwischen zwei Währungen, das angibt, wie viele Einheiten einer Währung man für eine Einheit einer anderen erhält.","textPt":"A relação de troca entre duas moedas, que indica quantas unidades de uma moeda se obtêm por uma unidade de outra.","correct":true},{"text":"Die staatlich festgelegte Obergrenze, bis zu der eine Währung gegenüber dem Euro schwanken darf.","textPt":"O limite máximo fixado pelo Estado até ao qual uma moeda pode flutuar em relação ao euro.","correct":false}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was versteht man unter Außenhandel (Import/Export)?","qPt":"O que se entende por comércio externo (importação/exportação)?","a":"Den Austausch von Waren und Dienstleistungen zwischen verschiedenen Ländern — Export bezeichnet den Verkauf ins Ausland, Import den Kauf aus dem Ausland.","aPt":"A troca de bens e serviços entre diferentes países — a exportação designa a venda para o estrangeiro, a importação a compra proveniente do estrangeiro.","options":[{"text":"Den Austausch von Waren ausschließlich innerhalb der Grenzen eines einzigen Staates zwischen verschiedenen Bundesländern.","textPt":"A troca de bens exclusivamente dentro das fronteiras de um único país, entre diferentes regiões (Länder).","correct":false},{"text":"Export bezeichnet den Kauf von Waren aus dem Ausland, Import den Verkauf von Waren ins Ausland.","textPt":"Exportação designa a compra de bens no estrangeiro, importação a venda de bens para o estrangeiro.","correct":false},{"text":"Den grenzüberschreitenden Transfer von Arbeitskräften zwischen zwei Ländern ohne Austausch von Waren oder Dienstleistungen.","textPt":"A transferência transfronteiriça de mão de obra entre dois países, sem troca de bens ou serviços.","correct":false},{"text":"Den Austausch von Waren und Dienstleistungen zwischen verschiedenen Ländern — Export bezeichnet den Verkauf ins Ausland, Import den Kauf aus dem Ausland.","textPt":"A troca de bens e serviços entre diferentes países — exportação designa a venda para o estrangeiro, importação a compra proveniente do estrangeiro.","correct":true}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist die Handelsbilanz eines Landes?","qPt":"O que é a balança comercial de um país?","a":"Die Gegenüberstellung von Exporten und Importen eines Landes innerhalb eines Zeitraums; ein Überschuss der Exporte über die Importe wird als positive Handelsbilanz (Außenhandelsüberschuss) bezeichnet.","aPt":"A comparação entre as exportações e as importações de um país num determinado período; um excedente das exportações sobre as importações é designado por balança comercial positiva (excedente comercial externo).","options":[{"text":"Die Gegenüberstellung von Exporten und Importen eines Landes innerhalb eines Zeitraums; ein Überschuss der Exporte über die Importe wird als positive Handelsbilanz bezeichnet.","textPt":"A comparação entre exportações e importações de um país num determinado período; quando as exportações superam as importações, fala-se de uma balança comercial positiva.","correct":true},{"text":"Die Gegenüberstellung aller Steuereinnahmen und Staatsausgaben eines Landes innerhalb eines Haushaltsjahres.","textPt":"A comparação entre todas as receitas fiscais e despesas do Estado num ano orçamental.","correct":false},{"text":"Der Wechselkurs einer Landeswährung gegenüber dem US-Dollar an einem bestimmten Stichtag.","textPt":"A taxa de câmbio de uma moeda nacional em relação ao dólar americano numa determinada data.","correct":false},{"text":"Die Summe aller ausländischen Direktinvestitionen, die in einem Land innerhalb eines Jahres getätigt werden.","textPt":"A soma de todo o investimento direto estrangeiro realizado num país durante um ano.","correct":false}]},
{"cat":"wiso","sub":"steuern","q":"Was sind Minijobs sozialversicherungsrechtlich?","qPt":"O que são os Minijobs do ponto de vista da segurança social?","a":"Geringfügige Beschäftigungen bis zu einer bestimmten monatlichen Verdienstgrenze, die für den Arbeitnehmer weitgehend von der Sozialversicherungspflicht befreit sind; der Arbeitgeber zahlt jedoch Pauschalabgaben.","aPt":"Empregos de pouca monta (de baixo rendimento) até um determinado limite mensal de remuneração, que estão, em grande parte, isentos da obrigação de contribuição para a segurança social por parte do trabalhador; contudo, o empregador paga contribuições fixas (a taxa fixa).","options":[{"text":"Beschäftigungen, die für Arbeitgeber und Arbeitnehmer vollständig von allen Sozialversicherungsbeiträgen befreit sind, einschließlich der Pauschalabgaben.","textPt":"Empregos em que empregador e trabalhador estão totalmente isentos de todas as contribuições para a segurança social, incluindo as taxas fixas.","correct":false},{"text":"Geringfügige Beschäftigungen bis zu einer bestimmten monatlichen Verdienstgrenze, die für den Arbeitnehmer weitgehend von der Sozialversicherungspflicht befreit sind; der Arbeitgeber zahlt jedoch Pauschalabgaben.","textPt":"Empregos de reduzida dimensão até um determinado limite mensal de rendimento, em que o trabalhador fica, em grande parte, isento da obrigação de segurança social, enquanto o empregador paga taxas fixas (Pauschalabgaben).","correct":true},{"text":"Befristete Vollzeitstellen mit einer Höchstdauer von drei Monaten, die der regulären Sozialversicherungspflicht unterliegen.","textPt":"Empregos a tempo inteiro, limitados a um máximo de três meses, sujeitos à obrigação normal de segurança social.","correct":false},{"text":"Beschäftigungen, bei denen ausschließlich der Arbeitnehmer die vollen Sozialversicherungsbeiträge ohne Arbeitgeberanteil trägt.","textPt":"Empregos em que apenas o trabalhador suporta a totalidade das contribuições para a segurança social, sem qualquer parte paga pelo empregador.","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was regelt das Entgeltfortzahlungsgesetz?","qPt":"O que regula o Entgeltfortzahlungsgesetz (lei alemã da continuidade do pagamento do salário)?","a":"Es sichert Arbeitnehmern im Krankheitsfall für bis zu 6 Wochen die Fortzahlung des Arbeitsentgelts durch den Arbeitgeber, sofern bestimmte Voraussetzungen (z. B. Mindestbeschäftigungsdauer) erfüllt sind.","aPt":"Garante aos trabalhadores, em caso de doença, a continuação do pagamento do salário pelo empregador durante até 6 semanas, desde que estejam reunidos determinados requisitos (p. ex., um tempo mínimo de vínculo laboral).","options":[{"text":"Es verpflichtet den Arbeitgeber, das Entgelt unbegrenzt fortzuzahlen, solange der Arbeitnehmer krankgeschrieben ist.","textPt":"Obriga o empregador a continuar a pagar o salário indefinidamente, enquanto o trabalhador estiver de baixa médica.","correct":false},{"text":"Es verpflichtet die Krankenkasse, ab dem ersten Krankheitstag Krankengeld anstelle des Arbeitgebers zu zahlen.","textPt":"Obriga a caixa de doença (Krankenkasse) a pagar o subsídio de doença desde o primeiro dia de baixa, em vez do empregador.","correct":false},{"text":"Es sichert Arbeitnehmern im Krankheitsfall für bis zu 6 Wochen die Fortzahlung des Arbeitsentgelts durch den Arbeitgeber, sofern bestimmte Voraussetzungen wie die Mindestbeschäftigungsdauer erfüllt sind.","textPt":"Garante aos trabalhadores, em caso de doença, a continuação do pagamento do salário pelo empregador durante até 6 semanas, desde que se cumpram determinados requisitos, como a duração mínima do vínculo laboral.","correct":true},{"text":"Es regelt ausschließlich die Entgeltfortzahlung an gesetzlichen Feiertagen, nicht im Krankheitsfall.","textPt":"Regula exclusivamente a continuação do pagamento do salário em feriados oficiais, não em caso de doença.","correct":false}]},
{"cat":"wiso","sub":"steuern","q":"Was ist eine betriebliche Altersvorsorge (bAV)?","qPt":"O que é a betriebliche Altersvorsorge (bAV) — a previdência de reforma empresarial?","a":"Eine zusätzliche, vom Arbeitgeber organisierte oder ermöglichte Form der Altersversorgung, die die gesetzliche Rente ergänzen soll, z. B. über Entgeltumwandlung.","aPt":"Uma forma complementar de previdência para a reforma, organizada ou facilitada pelo empregador, destinada a complementar a pensão de reforma pública, por exemplo através da conversão de parte do salário em contribuições (Entgeltumwandlung).","options":[{"text":"Eine staatliche Zusatzrente, die unabhängig vom Arbeitgeber direkt vom Staat an alle Rentner ausgezahlt wird.","textPt":"Uma pensão estatal adicional, paga diretamente pelo Estado a todos os reformados, independentemente do empregador.","correct":false},{"text":"Eine private Rentenversicherung, die ausschließlich der Arbeitnehmer ohne jede Beteiligung des Arbeitgebers abschließt und bespart.","textPt":"Um seguro de reforma privado, subscrito e financiado exclusivamente pelo trabalhador, sem qualquer participação do empregador.","correct":false},{"text":"Eine gesetzliche Pflichtversicherung, die die gesetzliche Rentenversicherung vollständig ersetzt.","textPt":"Um seguro obrigatório por lei, que substitui integralmente o seguro de reforma público (gesetzliche Rentenversicherung).","correct":false},{"text":"Eine zusätzliche, vom Arbeitgeber organisierte oder ermöglichte Form der Altersversorgung, die die gesetzliche Rente ergänzen soll, z. B. über Entgeltumwandlung.","textPt":"Uma forma adicional de previdência para a reforma, organizada ou facilitada pelo empregador, destinada a complementar a pensão estatal, por exemplo através da conversão de salário (Entgeltumwandlung).","correct":true}]},
{"cat":"wiso","sub":"steuern","q":"Was versteht man unter dem Arbeitgeberzuschuss zur betrieblichen Altersvorsorge?","qPt":"O que se entende pela comparticipação obrigatória do empregador na previdência de reforma empresarial?","a":"Ein gesetzlich vorgeschriebener Zuschuss, den der Arbeitgeber bei Entgeltumwandlung zusätzlich in die betriebliche Altersvorsorge einzahlen muss, da er durch die Umwandlung Sozialversicherungsbeiträge einspart.","aPt":"Uma comparticipação exigida por lei, que o empregador tem de pagar adicionalmente para a previdência de reforma empresarial quando há conversão de salário, uma vez que essa conversão lhe permite poupar contribuições para a segurança social.","options":[{"text":"Ein gesetzlich vorgeschriebener Zuschuss, den der Arbeitgeber bei Entgeltumwandlung zusätzlich in die betriebliche Altersvorsorge einzahlen muss, da er durch die Umwandlung Sozialversicherungsbeiträge einspart.","textPt":"Um complemento obrigatório por lei que o empregador tem de pagar adicionalmente na previdência complementar de reforma em caso de conversão de salário (Entgeltumwandlung), porque com isso poupa contribuições para a segurança social.","correct":true},{"text":"Ein freiwilliger Bonus, den der Arbeitgeber nach eigenem Ermessen zahlen kann, ohne gesetzliche Verpflichtung.","textPt":"Um bónus voluntário que o empregador pode pagar segundo o seu próprio critério, sem qualquer obrigação legal.","correct":false},{"text":"Ein Zuschuss, den ausschließlich der Staat bei Entgeltumwandlung an den Arbeitnehmer zahlt, nicht der Arbeitgeber.","textPt":"Um complemento pago exclusivamente pelo Estado ao trabalhador em caso de conversão de salário, e não pelo empregador.","correct":false},{"text":"Ein Betrag, den der Arbeitnehmer dem Arbeitgeber erstatten muss, um die Kosten der Entgeltumwandlung auszugleichen.","textPt":"Um montante que o trabalhador tem de reembolsar ao empregador para compensar os custos da conversão de salário.","correct":false}]},
{"cat":"wiso","sub":"unternehmen","q":"Was ist der Unterschied zwischen einer Aktiengesellschaft (AG) und einer GmbH bezüglich der Organe?","qPt":"Qual é a diferença entre uma Aktiengesellschaft (AG) — sociedade anónima — e uma GmbH — sociedade por quotas — no que respeita aos órgãos sociais?","a":"Bei der AG gibt es zwingend Vorstand, Aufsichtsrat und Hauptversammlung. Bei der GmbH sind Geschäftsführung und Gesellschafterversammlung Pflichtorgane, ein Aufsichtsrat ist meist nur ab einer bestimmten Unternehmensgröße vorgeschrieben.","aPt":"Na AG existem obrigatoriamente a Vorstand (direção/administração), o Aufsichtsrat (conselho fiscal/de supervisão) e a Hauptversammlung (assembleia geral de acionistas). Na GmbH, a gerência (Geschäftsführung) e a assembleia de sócios (Gesellschafterversammlung) são órgãos obrigatórios; um conselho fiscal só é normalmente exigido a partir de determinada dimensão da empresa.","options":[{"text":"Bei der AG gibt es nur eine Gesellschafterversammlung, bei der GmbH sind Vorstand und Aufsichtsrat zwingend vorgeschrieben.","textPt":"Na AG existe apenas uma assembleia de sócios; na GmbH, a direção (Vorstand) e o conselho fiscal (Aufsichtsrat) são órgãos obrigatórios.","correct":false},{"text":"Bei der AG gibt es zwingend Vorstand, Aufsichtsrat und Hauptversammlung. Bei der GmbH sind Geschäftsführung und Gesellschafterversammlung Pflichtorgane, ein Aufsichtsrat ist meist nur ab einer bestimmten Unternehmensgröße vorgeschrieben.","textPt":"Na AG existem obrigatoriamente direção (Vorstand), conselho fiscal (Aufsichtsrat) e assembleia geral (Hauptversammlung); na GmbH, a gerência e a assembleia de sócios são órgãos obrigatórios, sendo o conselho fiscal normalmente exigido só a partir de certa dimensão.","correct":true},{"text":"Sowohl AG als auch GmbH benötigen zwingend einen Aufsichtsrat unabhängig von ihrer Unternehmensgröße.","textPt":"Tanto a AG como a GmbH necessitam obrigatoriamente de um conselho fiscal (Aufsichtsrat), independentemente da sua dimensão.","correct":false},{"text":"Bei der AG entscheidet ausschließlich der Vorstand, eine Hauptversammlung der Aktionäre ist gesetzlich nicht vorgesehen.","textPt":"Na AG decide exclusivamente a direção (Vorstand); a lei não prevê uma assembleia geral de acionistas.","correct":false}]},
{"cat":"wiso","sub":"unternehmen","q":"Was ist eine Hauptversammlung bei einer AG?","qPt":"O que é a Hauptversammlung numa AG — a assembleia geral de acionistas de uma sociedade anónima?","a":"Das oberste Organ der Aktiengesellschaft, in dem die Aktionäre über zentrale Angelegenheiten (z. B. Gewinnverwendung, Wahl des Aufsichtsrats, Satzungsänderungen) entscheiden.","aPt":"O órgão supremo da sociedade anónima, no qual os acionistas decidem sobre assuntos centrais (p. ex., a aplicação dos resultados, a eleição do conselho fiscal, alterações aos estatutos).","options":[{"text":"Ein Gremium aus Arbeitnehmervertretern, das die laufende Geschäftsführung der AG im Alltag überwacht.","textPt":"Um órgão composto por representantes dos trabalhadores, que fiscaliza o dia a dia da gestão da AG.","correct":false},{"text":"Das operative Leitungsorgan der AG, das die tägliche Geschäftsführung verantwortet und das Unternehmen nach außen vertritt.","textPt":"O órgão operacional de direção da AG, responsável pela gestão diária e pela representação da empresa perante terceiros.","correct":false},{"text":"Das oberste Organ der Aktiengesellschaft, in dem die Aktionäre über zentrale Angelegenheiten wie Gewinnverwendung und Wahl des Aufsichtsrats entscheiden.","textPt":"O órgão supremo da sociedade anónima, no qual os acionistas decidem sobre assuntos centrais, como a aplicação dos lucros e a eleição do conselho fiscal (Aufsichtsrat).","correct":true},{"text":"Ein informelles Treffen der Großaktionäre ohne rechtliche Entscheidungsbefugnis über die Gesellschaft.","textPt":"Uma reunião informal dos grandes acionistas, sem qualquer poder de decisão legal sobre a sociedade.","correct":false}]},
{"cat":"wiso","sub":"tarif","q":"Was bedeutet Mitbestimmung auf Unternehmensebene (z. B. im Aufsichtsrat)?","qPt":"O que significa a cogestão (Mitbestimmung) ao nível da empresa (p. ex., no conselho fiscal)?","a":"Arbeitnehmervertreter erhalten (je nach Unternehmensgröße und Mitbestimmungsgesetz) Sitze im Aufsichtsrat und können so auf unternehmerische Grundsatzentscheidungen Einfluss nehmen.","aPt":"Os representantes dos trabalhadores obtêm (dependendo da dimensão da empresa e da lei de cogestão aplicável) assentos no conselho fiscal, podendo assim influenciar decisões empresariais de fundo.","options":[{"text":"Arbeitnehmervertreter erhalten in jedem Unternehmen unabhängig von dessen Größe automatisch die Mehrheit der Sitze im Aufsichtsrat.","textPt":"Os representantes dos trabalhadores obtêm, em qualquer empresa e independentemente da sua dimensão, automaticamente a maioria dos assentos no conselho fiscal (Aufsichtsrat).","correct":false},{"text":"Arbeitnehmer können im Aufsichtsrat über ihr individuelles Gehalt mitbestimmen, nicht jedoch über unternehmerische Grundsatzfragen.","textPt":"Os trabalhadores podem, através do conselho fiscal, decidir sobre o seu salário individual, mas não sobre questões estratégicas da empresa.","correct":false},{"text":"Mitbestimmung bedeutet, dass der Betriebsrat anstelle des Vorstands die operative Geschäftsführung übernimmt.","textPt":"A participação (Mitbestimmung) significa que o conselho de empresa (Betriebsrat) assume a gestão operacional em vez da direção (Vorstand).","correct":false},{"text":"Arbeitnehmervertreter erhalten je nach Unternehmensgröße und Mitbestimmungsgesetz Sitze im Aufsichtsrat und können so auf unternehmerische Grundsatzentscheidungen Einfluss nehmen.","textPt":"Os representantes dos trabalhadores obtêm, de acordo com a dimensão da empresa e a lei da participação (Mitbestimmungsgesetz), assentos no conselho fiscal (Aufsichtsrat) e podem assim influenciar decisões estratégicas fundamentais.","correct":true}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist der Unterschied zwischen Real- und Nominallohn?","qPt":"Qual é a diferença entre salário real e salário nominal?","a":"Der Nominallohn ist der in Geld ausgezahlte Betrag. Der Reallohn beschreibt die tatsächliche Kaufkraft dieses Betrags unter Berücksichtigung der Inflation.","aPt":"O salário nominal é o montante pago em dinheiro. O salário real descreve o poder de compra efetivo desse montante, tendo em conta a inflação.","options":[{"text":"Der Nominallohn ist der in Geld ausgezahlte Betrag. Der Reallohn beschreibt die tatsächliche Kaufkraft dieses Betrags unter Berücksichtigung der Inflation.","textPt":"O salário nominal é o montante pago em dinheiro; o salário real descreve o seu poder de compra efetivo, tendo em conta a inflação.","correct":true},{"text":"Der Reallohn ist der in Geld ausgezahlte Betrag. Der Nominallohn beschreibt dessen Kaufkraft unter Berücksichtigung der Inflation.","textPt":"O salário real é o montante pago em dinheiro; o salário nominal descreve o seu poder de compra tendo em conta a inflação.","correct":false},{"text":"Der Nominallohn ist der Bruttolohn, der Reallohn der Nettolohn nach Abzug von Steuern und Sozialabgaben.","textPt":"O salário nominal é o salário bruto; o salário real é o salário líquido após dedução de impostos e contribuições sociais.","correct":false},{"text":"Der Nominallohn gilt nur für Beamte, der Reallohn ausschließlich für Angestellte in der Privatwirtschaft.","textPt":"O salário nominal aplica-se apenas a funcionários públicos; o salário real apenas a trabalhadores do setor privado.","correct":false}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist eine Volkswirtschaftliche Gesamtrechnung (VGR)?","qPt":"O que é a Volkswirtschaftliche Gesamtrechnung (VGR) — a contabilidade nacional?","a":"Ein statistisches System, das die wirtschaftliche Leistung und die Wertschöpfung einer Volkswirtschaft über einen Zeitraum erfasst, u. a. zur Berechnung des BIP.","aPt":"Um sistema estatístico que regista o desempenho económico e o valor acrescentado de uma economia num determinado período, servindo, entre outros fins, para calcular o PIB.","options":[{"text":"Ein gesetzlich vorgeschriebenes Rechnungslegungssystem, das einzelne Unternehmen zur Erstellung ihrer Jahresbilanz verpflichtet.","textPt":"Um sistema de contabilidade obrigatório por lei, que obriga empresas individuais a elaborar o seu balanço anual.","correct":false},{"text":"Ein statistisches System, das die wirtschaftliche Leistung und die Wertschöpfung einer Volkswirtschaft über einen Zeitraum erfasst, u. a. zur Berechnung des BIP.","textPt":"Um sistema estatístico que regista o desempenho económico e a criação de valor de uma economia num determinado período, servindo nomeadamente para calcular o PIB.","correct":true},{"text":"Ein Verzeichnis aller im Handelsregister eingetragenen Unternehmen eines Landes mit ihren Umsatzzahlen.","textPt":"Um registo de todas as empresas inscritas no registo comercial (Handelsregister) de um país, com os respetivos volumes de negócios.","correct":false},{"text":"Ein internationales Abkommen, das die Wechselkurse zwischen den wichtigsten Weltwährungen verbindlich festlegt.","textPt":"Um acordo internacional que fixa de forma vinculativa as taxas de câmbio entre as principais moedas mundiais.","correct":false}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was versteht man unter sozialer Marktwirtschaft?","qPt":"O que se entende por economia social de mercado?","a":"Ein Wirtschaftssystem, das die Freiheit des Marktes (Angebot und Nachfrage, Wettbewerb) mit sozialem Ausgleich durch den Staat verbindet, z. B. durch Sozialversicherungen und Arbeitnehmerschutzrechte.","aPt":"Um sistema económico que combina a liberdade do mercado (oferta e procura, concorrência) com o equilíbrio social assegurado pelo Estado, por exemplo através de seguros sociais e de direitos de proteção dos trabalhadores.","options":[{"text":"Ein Wirtschaftssystem, in dem der Staat alle Preise und Produktionsmengen zentral plant, ohne freien Wettbewerb.","textPt":"Um sistema económico em que o Estado planeia centralmente todos os preços e quantidades de produção, sem livre concorrência.","correct":false},{"text":"Ein Wirtschaftssystem ganz ohne jede staatliche Einflussnahme, in dem Angebot und Nachfrage allein den Markt bestimmen.","textPt":"Um sistema económico totalmente sem qualquer intervenção do Estado, em que apenas a oferta e a procura determinam o mercado.","correct":false},{"text":"Ein Wirtschaftssystem, das die Freiheit des Marktes (Angebot und Nachfrage, Wettbewerb) mit sozialem Ausgleich durch den Staat verbindet, z. B. durch Sozialversicherungen und Arbeitnehmerschutzrechte.","textPt":"Um sistema económico que combina a liberdade do mercado, com concorrência, com a compensação social assegurada pelo Estado, por exemplo através dos seguros sociais.","correct":true},{"text":"Ein Wirtschaftssystem, in dem ausschließlich Genossenschaften und Staatsbetriebe wirtschaftlich tätig sein dürfen.","textPt":"Um sistema económico em que apenas cooperativas e empresas estatais podem exercer atividade económica.","correct":false}]},
{"cat":"wiso","sub":"tarif","q":"Was ist der Unterschied zwischen Streik und Aussperrung hinsichtlich der Initiative?","qPt":"Qual é a diferença entre greve e lockout no que respeita à iniciativa?","a":"Der Streik ist eine Arbeitskampfmaßnahme der Arbeitnehmerseite (organisiert durch Gewerkschaften), die Aussperrung eine Gegenmaßnahme der Arbeitgeberseite.","aPt":"A greve é uma medida de luta laboral da parte dos trabalhadores (organizada pelos sindicatos), enquanto o lockout é uma contramedida da parte do empregador.","options":[{"text":"Der Streik wird von der Arbeitgeberseite initiiert, die Aussperrung dagegen von den Gewerkschaften als Reaktion darauf.","textPt":"A greve é iniciada pela parte empregadora, enquanto o lockout (Aussperrung) é a reação dos sindicatos a essa iniciativa.","correct":false},{"text":"Streik und Aussperrung sind rechtlich identisch und bezeichnen ausschließlich die Kündigung von Arbeitsverhältnissen durch den Arbeitgeber.","textPt":"A greve e o lockout (Aussperrung) são juridicamente idênticos e designam exclusivamente o despedimento de trabalhadores pelo empregador.","correct":false},{"text":"Der Streik ist eine individuelle Maßnahme einzelner Arbeitnehmer, die Aussperrung eine behördliche Anordnung des Staates.","textPt":"A greve é uma medida individual de trabalhadores isolados, enquanto o lockout (Aussperrung) é uma ordem administrativa do Estado.","correct":false},{"text":"Der Streik ist eine Arbeitskampfmaßnahme der Arbeitnehmerseite (organisiert durch Gewerkschaften), die Aussperrung eine Gegenmaßnahme der Arbeitgeberseite.","textPt":"A greve é uma medida de conflito laboral (Arbeitskampf) da parte dos trabalhadores, organizada pelos sindicatos, enquanto o lockout (Aussperrung) é uma contramedida da parte empregadora.","correct":true}]},
{"cat":"algo","sub":"sql","q":"Was ist der Fehler in diesem UPDATE-Statement?","qPt":"Qual é o erro nesta instrução UPDATE?","a":"Es fehlt eine WHERE-Klausel — ohne sie wird nachname bei ALLEN Zeilen der Tabelle kunden auf 'Müller' gesetzt, nicht nur bei einem bestimmten Kunden.","aPt":"Falta uma cláusula WHERE — sem ela, o campo nachname é definido como 'Müller' em TODAS as linhas da tabela kunden, e não apenas num cliente específico.","options":[{"text":"Es fehlt eine WHERE-Klausel – ohne sie wird nachname bei ALLEN Zeilen der Tabelle kunden auf 'Müller' gesetzt, nicht nur bei einem bestimmten Kunden.","textPt":"Falta uma cláusula WHERE – sem ela, nachname é definido como 'Müller' em TODAS as linhas da tabela kunden, não apenas num cliente específico.","correct":true},{"text":"Das Statement verursacht einen Syntaxfehler, da SET ohne WHERE nicht erlaubt ist.","textPt":"A instrução provoca um erro de sintaxe, pois SET sem WHERE não é permitido.","correct":false},{"text":"Es fehlt der Tabellenname nach UPDATE, daher schlägt das Statement fehl.","textPt":"Falta o nome da tabela após UPDATE, por isso a instrução falha.","correct":false},{"text":"nachname wird nur bei dem Kunden mit der kleinsten kunden_id auf 'Müller' gesetzt.","textPt":"nachname só é definido como 'Müller' no cliente com o menor kunden_id.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Ist dieses Statement wahrscheinlich ein Fehler — und warum?","qPt":"Esta instrução é provavelmente um erro — e porquê?","a":"Ohne WHERE-Klausel löscht DELETE FROM bestellungen ALLE Zeilen der Tabelle. Das ist fast immer ein Fehler, wenn nicht wirklich die ganze Tabelle geleert werden soll.","aPt":"Sem cláusula WHERE, o DELETE FROM bestellungen elimina TODAS as linhas da tabela. Isto é quase sempre um erro, a menos que se pretenda mesmo esvaziar a tabela por completo.","options":[{"text":"Das Statement ist unproblematisch, da DELETE ohne WHERE automatisch nur stornierte Bestellungen löscht.","textPt":"A instrução não é problemática, pois DELETE sem WHERE elimina automaticamente só as encomendas canceladas.","correct":false},{"text":"Ohne WHERE-Klausel löscht DELETE FROM bestellungen ALLE Zeilen der Tabelle. Das ist fast immer ein Fehler, wenn nicht wirklich die ganze Tabelle geleert werden soll.","textPt":"Sem cláusula WHERE, DELETE FROM bestellungen elimina TODAS as linhas da tabela. Isso é quase sempre um erro, a não ser que se pretenda realmente esvaziar a tabela toda.","correct":true},{"text":"Das Statement verursacht einen Syntaxfehler, weil DELETE FROM immer eine WHERE-Klausel benötigt.","textPt":"A instrução provoca um erro de sintaxe, porque DELETE FROM necessita sempre de uma cláusula WHERE.","correct":false},{"text":"Das Statement löscht nur die zuletzt eingefügte Zeile der Tabelle, da kein Filter angegeben ist.","textPt":"A instrução elimina apenas a última linha inserida na tabela, por não haver filtro indicado.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Warum schlägt dieses INSERT-Statement fehl?","qPt":"Por que motivo falha esta instrução INSERT?","a":"Die Spaltenliste nennt 3 Spalten (vorname, nachname, plz), aber es werden nur 2 Werte angegeben — für jede genannte Spalte muss genau ein Wert folgen.","aPt":"A lista de colunas indica 3 colunas (vorname, nachname, plz), mas só são fornecidos 2 valores — para cada coluna indicada tem de seguir-se exatamente um valor.","options":[{"text":"Die Spalte plz fehlt in der VALUES-Liste und wird deshalb automatisch mit NULL vorbelegt, ohne Fehler.","textPt":"A coluna plz está ausente da lista VALUES e é por isso automaticamente preenchida com NULL, sem erro.","correct":false},{"text":"Es werden zu viele Werte angegeben, es müssten nur 2 Spalten in der Spaltenliste stehen.","textPt":"São fornecidos demasiados valores, só deveriam constar 2 colunas na lista de colunas.","correct":false},{"text":"Die Spaltenliste nennt 3 Spalten (vorname, nachname, plz), aber es werden nur 2 Werte angegeben – für jede genannte Spalte muss genau ein Wert folgen.","textPt":"A lista de colunas indica 3 colunas (vorname, nachname, plz), mas apenas são fornecidos 2 valores – para cada coluna indicada tem de haver exatamente um valor.","correct":true},{"text":"Die Reihenfolge von vorname und nachname in der Spaltenliste stimmt nicht mit der Tabelle überein.","textPt":"A ordem de vorname e nachname na lista de colunas não corresponde à da tabela.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Warum liefert diese Abfrage nie ein Ergebnis, selbst wenn austrittsdatum leer ist?","qPt":"Por que motivo esta consulta nunca devolve resultados, mesmo quando austrittsdatum está vazio?","a":"NULL steht für \"unbekannt\" und kann nicht mit = verglichen werden — x = NULL ergibt immer NULL (nicht wahr), nie TRUE.","aPt":"NULL representa \"desconhecido\" e não pode ser comparado com =. A expressão x = NULL dá sempre NULL (não é verdadeiro), nunca TRUE.","options":[{"text":"austrittsdatum wird als leerer String '' gespeichert, der nicht mit NULL übereinstimmt.","textPt":"austrittsdatum é guardado como uma string vazia '', que não corresponde a NULL.","correct":false},{"text":"Die Spalte austrittsdatum existiert nicht in der Tabelle mitarbeiter, daher liefert die Abfrage nichts.","textPt":"A coluna austrittsdatum não existe na tabela mitarbeiter, por isso a consulta não devolve nada.","correct":false},{"text":"WHERE-Klauseln können grundsätzlich keine Vergleiche mit Datumswerten durchführen.","textPt":"As cláusulas WHERE não podem, por princípio, efetuar comparações com valores de data.","correct":false},{"text":"NULL steht für \"unbekannt\" und kann nicht mit = verglichen werden – x = NULL ergibt immer NULL (nicht wahr), nie TRUE.","textPt":"NULL representa \"desconhecido\" e não pode ser comparado com = – x = NULL resulta sempre em NULL (não verdadeiro), nunca em TRUE.","correct":true}]},
{"cat":"algo","sub":"sql","q":"Was ist an diesem Statement problematisch?","qPt":"O que há de problemático nesta instrução?","a":"nachname wird ausgewählt, steht aber nicht in GROUP BY und ist auch keine Aggregatfunktion — pro Gruppe könnten mehrere unterschiedliche nachname-Werte vorkommen.","aPt":"A coluna nachname é selecionada, mas não consta no GROUP BY nem é o resultado de uma função de agregação — em cada grupo podem existir vários valores diferentes de nachname.","options":[{"text":"nachname wird ausgewählt, steht aber nicht in GROUP BY und ist auch keine Aggregatfunktion – pro Gruppe könnten mehrere unterschiedliche nachname-Werte vorkommen.","textPt":"nachname é selecionado, mas não está no GROUP BY e também não é uma função de agregação – em cada grupo poderiam existir vários valores diferentes de nachname.","correct":true},{"text":"vorname darf nicht in GROUP BY stehen, da es bereits in der SELECT-Liste vorkommt.","textPt":"vorname não pode estar no GROUP BY, pois já consta na lista do SELECT.","correct":false},{"text":"COUNT(*) kann nur zusammen mit genau einer GROUP BY-Spalte verwendet werden, hier sind es zwei nötig.","textPt":"COUNT(*) só pode ser usado com exatamente uma coluna no GROUP BY, aqui seriam necessárias duas.","correct":false},{"text":"Das Statement ist korrekt, da nachname implizit als Aggregatfunktion behandelt wird.","textPt":"A instrução está correta, pois nachname é tratado implicitamente como função de agregação.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Was fehlt hier, und was ist die Folge?","qPt":"O que falta aqui, e qual é a consequência?","a":"Es fehlt die ON- bzw. USING-Bedingung des JOINs. In den meisten Datenbanksystemen (z. B. PostgreSQL, Oracle, SQL Server) ist ein JOIN ohne Bedingung ein Syntaxfehler, da ON oder USING zwingend vorgeschrieben ist. Einige Systeme wie MySQL akzeptieren es dagegen und werten es als kartesisches Produkt: jede Zeile aus a wird mit jeder Zeile aus b kombiniert, statt gezielt verknüpft zu werden.","aPt":"Falta a condição ON ou USING do JOIN. Na maioria dos sistemas de bases de dados (p. ex., PostgreSQL, Oracle, SQL Server), um JOIN sem condição é um erro de sintaxe, já que ON ou USING é obrigatório. Alguns sistemas, como o MySQL, aceitam-no e interpretam-no como um produto cartesiano: cada linha de a é combinada com cada linha de b, em vez de serem ligadas de forma específica.","options":[{"text":"Es fehlt nur der Tabellenalias b, ansonsten ist der JOIN korrekt und liefert dasselbe Ergebnis wie mit ON.","textPt":"Falta apenas o alias de tabela b, de resto o JOIN está correto e devolve o mesmo resultado que com ON.","correct":false},{"text":"Es fehlt die ON- bzw. USING-Bedingung des JOINs. In den meisten Datenbanksystemen ist ein JOIN ohne Bedingung ein Syntaxfehler. Einige Systeme wie MySQL akzeptieren es dagegen und werten es als kartesisches Produkt.","textPt":"Falta a condição ON ou USING do JOIN. Na maioria dos sistemas de bases de dados, um JOIN sem condição é um erro de sintaxe. Alguns sistemas, como o MySQL, aceitam-no e interpretam-no como um produto cartesiano.","correct":true},{"text":"Ein JOIN ohne ON-Bedingung verknüpft automatisch über die Primärschlüssel beider Tabellen.","textPt":"Um JOIN sem condição ON associa automaticamente através das chaves primárias de ambas as tabelas.","correct":false},{"text":"Das Statement ist in allen Datenbanksystemen ungültig und führt immer zu einem Syntaxfehler.","textPt":"A instrução é inválida em todos os sistemas de bases de dados e provoca sempre um erro de sintaxe.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Warum verursacht diese Abfrage einen Syntaxfehler?","qPt":"Por que motivo esta consulta provoca um erro de sintaxe?","a":"Das schließende einfache Anführungszeichen nach München fehlt — das String-Literal ist nicht korrekt abgeschlossen.","aPt":"Falta a aspa simples de fecho depois de München — o literal de texto (string) não está corretamente fechado.","options":[{"text":"Der Spaltenname ort existiert nicht in der Tabelle kunden, daher der Syntaxfehler.","textPt":"O nome de coluna ort não existe na tabela kunden, daí o erro de sintaxe.","correct":false},{"text":"Nach WHERE fehlt ein Doppelpunkt vor der Bedingung ort = 'München'.","textPt":"Após WHERE falta um dois-pontos antes da condição ort = 'München'.","correct":false},{"text":"Das schließende einfache Anführungszeichen nach München fehlt – das String-Literal ist nicht korrekt abgeschlossen.","textPt":"Falta o apóstrofo de fecho após München – o literal de string não está corretamente fechado.","correct":true},{"text":"Der Tabellenname kunden ist nicht in Anführungszeichen gesetzt und verursacht deshalb den Fehler.","textPt":"O nome da tabela kunden não está entre aspas e por isso provoca o erro.","correct":false}]},
{"cat":"algo","sub":"sql","q":"Warum funktioniert dieses Statement nicht direkt so?","qPt":"Por que motivo esta instrução não funciona desta forma direta?","a":"Aggregatfunktionen wie AVG() dürfen nicht direkt in WHERE stehen, da WHERE vor der Aggregation ausgewertet wird. Lösung: eine Subquery verwenden.","aPt":"Funções de agregação como AVG() não podem ser usadas diretamente na cláusula WHERE, uma vez que o WHERE é avaliado antes da agregação. Solução: utilizar uma subquery.","options":[{"text":"AVG() funktioniert in WHERE, aber nur wenn zusätzlich eine GROUP BY-Klausel vorhanden ist.","textPt":"AVG() funciona no WHERE, mas apenas se existir adicionalmente uma cláusula GROUP BY.","correct":false},{"text":"Das Statement ist korrekt, berücksichtigt aber nur Mitarbeiter mit einem Gehalt über dem globalen Durchschnitt aller Tabellen.","textPt":"A instrução está correta, mas apenas considera funcionários com um salário acima da média global de todas as tabelas.","correct":false},{"text":"gehalt muss in Anführungszeichen stehen, da es sonst als Textspalte interpretiert wird.","textPt":"gehalt tem de estar entre aspas, caso contrário é interpretado como coluna de texto.","correct":false},{"text":"Aggregatfunktionen wie AVG() dürfen nicht direkt in WHERE stehen, da WHERE vor der Aggregation ausgewertet wird. Lösung: eine Subquery verwenden.","textPt":"Funções de agregação como AVG() não podem estar diretamente no WHERE, pois o WHERE é avaliado antes da agregação. Solução: usar uma subquery.","correct":true}]},
{"cat":"algo","sub":"sql","q":"Was ist an diesem Statement syntaktisch falsch?","qPt":"O que está sintaticamente errado nesta instrução?","a":"Ein UPDATE darf nur eine SET-Klausel haben; mehrere Spalten werden durch Komma getrennt in derselben SET-Klausel gesetzt, vor der WHERE-Klausel.","aPt":"Um UPDATE só pode ter uma cláusula SET; várias colunas são definidas na mesma cláusula SET, separadas por vírgulas, antes da cláusula WHERE.","options":[{"text":"Ein UPDATE darf nur eine SET-Klausel haben; mehrere Spalten werden durch Komma getrennt in derselben SET-Klausel gesetzt, vor der WHERE-Klausel.","textPt":"Um UPDATE só pode ter uma cláusula SET; várias colunas são definidas separadas por vírgula na mesma cláusula SET, antes da cláusula WHERE.","correct":true},{"text":"Die WHERE-Klausel darf bei UPDATE nur vor der ersten SET-Klausel stehen, nicht dazwischen.","textPt":"A cláusula WHERE num UPDATE só pode estar antes da primeira cláusula SET, nunca no meio.","correct":false},{"text":"Ein UPDATE kann beliebig viele SET-Klauseln enthalten, solange jede eine eigene WHERE-Bedingung hat.","textPt":"Um UPDATE pode conter um número arbitrário de cláusulas SET, desde que cada uma tenha a sua própria condição WHERE.","correct":false},{"text":"Die Reihenfolge von preis und lagerbestand in den beiden SET-Klauseln ist falsch und muss vertauscht werden.","textPt":"A ordem de preis e lagerbestand nas duas cláusulas SET está errada e tem de ser trocada.","correct":false}]},
