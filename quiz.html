<style>
  :root{
    --paper:#F1ECDC;
    --paper-2:#E9E2CC;
    --card:#FBF8EE;
    --ink:#22314A;
    --ink-soft:#4C5A72;
    --rule:#C9BE9E;
    --stamp-1:#A6402F;
    --stamp-2:#2C6E62;
    --stamp-3:#7A5A2E;
    --stamp-1-bg:#F4DAD3;
    --stamp-2-bg:#D9EAE5;
    --stamp-3-bg:#EDE1C9;
    --good:#2C6E62;
    --good-bg:#D9EAE5;
    --bad:#A6402F;
    --bad-bg:#F4DAD3;
    --shadow:0 1px 0 rgba(34,49,74,.06);
    --focus:#2C6E62;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#1B1F23;
      --paper-2:#20252A;
      --card:#26292C;
      --ink:#EFE9D8;
      --ink-soft:#B9B2A0;
      --rule:#3B3E3A;
      --stamp-1-bg:#3A2624;
      --stamp-2-bg:#1E322D;
      --stamp-3-bg:#332B1C;
      --good-bg:#1E322D;
      --bad-bg:#3A2624;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1F23;
    --paper-2:#20252A;
    --card:#26292C;
    --ink:#EFE9D8;
    --ink-soft:#B9B2A0;
    --rule:#3B3E3A;
    --stamp-1-bg:#3A2624;
    --stamp-2-bg:#1E322D;
    --stamp-3-bg:#332B1C;
    --good-bg:#1E322D;
    --bad-bg:#3A2624;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--paper-2), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Spectral', Georgia, 'Times New Roman', serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 48px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    border-bottom:1px solid var(--rule);
    padding-bottom:14px;
    margin-bottom:20px;
  }
  h1{
    font-size:1.3rem;
    font-weight:700;
    margin:0;
    letter-spacing:.2px;
  }
  h1 small{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:.68rem;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin-top:4px;
    text-transform:none;
  }
  .header-right{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .back-link, .theme-toggle{
    font-family:'JetBrains Mono', monospace;
    font-size:.68rem;
    letter-spacing:.02em;
    padding:5px 9px;
    border-radius:3px;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .back-link:hover, .theme-toggle:hover{border-color:var(--ink-soft); color:var(--ink);}
  .theme-toggle:focus-visible, .back-link:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .theme-toggle svg{width:13px; height:13px; flex:none;}
  .theme-toggle svg *{stroke:currentColor;}

  .progressbar{
    height:3px;
    background:var(--rule);
    border-radius:2px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .progressbar > div{
    height:100%;
    background:var(--ink-soft);
    transition:width .25s ease;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    font-size:.7rem;
    color:var(--ink-soft);
    margin-bottom:20px;
  }

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
  }
  .chip{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    padding:6px 11px;
    border-radius:3px;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip:hover{border-color:var(--ink-soft);}
  .chip:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .chip[data-active="true"]{
    color:var(--ink);
    border-color:var(--ink);
    background:var(--card);
  }
  .chip .dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    margin-right:6px;
    position:relative;
    top:-1px;
  }

  .qcard{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:2px;
    box-shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 20px -12px rgba(34,49,74,.25);
    padding:26px 24px 22px;
    margin-bottom:16px;
  }
  .tab{
    align-self:flex-start;
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    letter-spacing:.04em;
    padding:4px 9px 4px 8px;
    border-radius:2px;
    margin-bottom:16px;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .tab .dot{width:6px;height:6px;border-radius:50%;}
  .facelabel{
    font-family:'JetBrains Mono', monospace;
    font-size:.62rem;
    color:var(--ink-soft);
    letter-spacing:.08em;
    margin-bottom:10px;
  }
  .qtext{
    font-size:1.18rem;
    line-height:1.5;
    font-weight:600;
    margin-bottom:6px;
  }
  .qpt{
    display:none;
    margin-top:4px;
    margin-bottom:18px;
    padding-top:12px;
    border-top:1px dashed var(--rule);
    font-size:.92rem;
    font-style:italic;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .qpt::before{
    content:'PT · ';
    font-style:normal;
    font-weight:700;
    opacity:.6;
  }
  .show-pt .qpt{ display:block; }

  .codeblock{
    margin:10px 0 0;
    padding:11px 13px;
    background:var(--paper-2);
    border:1px solid var(--rule);
    border-radius:3px;
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    overflow-x:auto;
    color:var(--ink);
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-top:6px;
  }
  .option{
    text-align:left;
    font-family:'Spectral', Georgia, serif;
    font-size:.98rem;
    line-height:1.45;
    padding:12px 14px;
    border-radius:3px;
    border:1px solid var(--rule);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled){border-color:var(--ink-soft);}
  .option:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .option .optpt{
    display:none;
    margin-top:5px;
    font-size:.82rem;
    font-style:italic;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .option .optpt::before{
    content:'PT · ';
    font-style:normal;
    font-weight:700;
    opacity:.6;
  }
  .show-pt .option .optpt{ display:block; }
  .option:disabled{cursor:default;}
  .option.correct{
    border-color:var(--good);
    background:var(--good-bg);
    color:var(--good);
  }
  .option.wrong{
    border-color:var(--bad);
    background:var(--bad-bg);
    color:var(--bad);
  }
  .option.correct .optpt, .option.wrong .optpt{ color:inherit; opacity:.85; }

  .explain{
    display:none;
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--rule);
  }
  .explain.show{ display:block; }
  .explain .explainlabel{
    font-family:'JetBrains Mono', monospace;
    font-size:.62rem;
    color:var(--ink-soft);
    letter-spacing:.08em;
    margin-bottom:8px;
  }
  .explain .atext{
    font-size:.95rem;
    line-height:1.55;
  }
  .explain .apt{
    display:none;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--rule);
    font-size:.88rem;
    font-style:italic;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .explain .apt::before{
    content:'PT · ';
    font-style:normal;
    font-weight:700;
    opacity:.6;
  }
  .show-pt .explain .apt{ display:block; }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  .navgroup{display:flex; gap:8px;}
  button.ctrl{
    font-family:'JetBrains Mono', monospace;
    font-size:.75rem;
    padding:9px 14px;
    border-radius:3px;
    border:1px solid var(--rule);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  button.ctrl:hover:not(:disabled){border-color:var(--ink-soft);}
  button.ctrl:disabled{opacity:.4; cursor:default;}
  button.ctrl.primary{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  footer{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    color:var(--ink-soft);
    margin-top:8px;
  }
  footer button{
    background:none;border:none;
    font-family:inherit;font-size:inherit;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }
  .license-line{
    margin-top:10px;
    font-size:.6rem;
    opacity:.75;
  }
  .license-line a{
    color:inherit;
  }
</style>
</head>

<script>
const QUIZ = [
{"cat":"plan","sub":"anforderungen","q":"Was unterscheidet ein Lastenheft von einem Pflichtenheft?","qPt":"Qual é a diferença entre um Lastenheft e um Pflichtenheft?","a":"Das Lastenheft beschreibt aus Kundensicht das WAS und WOFÜR (Anforderungen). Das Pflichtenheft beschreibt aus Auftragnehmersicht das WIE (technische Umsetzung) und wird vom Auftragnehmer auf Basis des Lastenhefts erstellt.","aPt":"O Lastenheft (caderno de requisitos) descreve, do ponto de vista do cliente, O QUÊ e PARA QUÊ (os requisitos). O Pflichtenheft (caderno de especificações) descreve, do ponto de vista do fornecedor, O COMO (a implementação técnica) e é elaborado pelo fornecedor com base no Lastenheft.","options":[{"text":"Das Lastenheft wird vom Auftragnehmer erstellt und beschreibt die technische Umsetzung, während der Kunde im Pflichtenheft seine Anforderungen festlegt.","textPt":"O Lastenheft (caderno de encargos do cliente) é criado pelo fornecedor e descreve a implementação técnica, enquanto o cliente define os seus requisitos no Pflichtenheft (caderno de encargos técnico).","correct":false},{"text":"Lastenheft und Pflichtenheft sind zwei gleichbedeutende Begriffe für dieselbe Anforderungsliste des Kunden.","textPt":"Lastenheft (caderno de encargos do cliente) e Pflichtenheft (caderno de encargos técnico) são dois termos sinónimos para a mesma lista de requisitos do cliente.","correct":false},{"text":"Das Lastenheft beschreibt aus Kundensicht das Was und Wofür, das Pflichtenheft aus Auftragnehmersicht das Wie der Umsetzung.","textPt":"O Lastenheft (caderno de encargos do cliente) descreve, do ponto de vista do cliente, o Quê e o Para Quê; o Pflichtenheft (caderno de encargos técnico) descreve, do ponto de vista do fornecedor, o Como da implementação.","correct":true},{"text":"Das Lastenheft enthält nur nichtfunktionale Anforderungen, das Pflichtenheft nur funktionale Anforderungen.","textPt":"O Lastenheft (caderno de encargos do cliente) contém apenas requisitos não funcionais, e o Pflichtenheft (caderno de encargos técnico) apenas requisitos funcionais.","correct":false}]},
{"cat":"plan","sub":"anforderungen","q":"Was bedeutet die SMART-Regel bei der Zieldefinition?","qPt":"O que significa a regra SMART na definição de objetivos?","a":"Ziele sollen Spezifisch, Messbar, Attraktiv/Akzeptiert, Realistisch und Terminiert formuliert sein.","aPt":"Os objetivos devem ser formulados de forma Específica, Mensurável, Atrativa/Aceite, Realista e com um Prazo definido (Temporizada).","options":[{"text":"SMART steht für Spezifisch, Messbar, Allgemein, Relevant und Transparent.","textPt":"SMART significa Específico, Medível, Geral, Relevante e Transparente.","correct":false},{"text":"Ziele sollen spezifisch, messbar, attraktiv/akzeptiert, realistisch und terminiert formuliert werden.","textPt":"Os objetivos devem ser formulados de forma específica, medível, atrativa/aceite, realista e com um prazo definido.","correct":true},{"text":"SMART bedeutet, dass Ziele Schnell, Modern, Agil, Risikofrei und Testbar sein müssen.","textPt":"SMART significa que os objetivos devem ser Rápidos, Modernos, Ágeis, Sem Risco e Testáveis.","correct":false},{"text":"Bei SMART-Zielen sind vor allem Spezifität und Terminierung wichtig, Messbarkeit und Akzeptanz sind zweitrangig.","textPt":"Nos objetivos SMART, apenas a especificidade e o prazo são importantes; a mensurabilidade e a aceitação são secundárias.","correct":false}]},
{"cat":"plan","sub":"scrum","q":"Nenne die drei Verantwortlichkeiten (umgangssprachlich oft noch \"Rollen\" genannt) im Scrum Team gemäß aktuellem Scrum Guide.","qPt":"Indica as três responsabilidades (coloquialmente ainda muitas vezes chamadas de \"papéis\") da equipa Scrum, segundo o atual Scrum Guide.","a":"Product Owner (verantwortet den Wert der Arbeit und das Product Backlog), Scrum Master (verantwortet die Etablierung von Scrum, coacht das Team und beseitigt Hindernisse) und die Developers (die das Increment erstellen). Seit der Scrum-Guide-Revision 2020 heißen diese drei offiziell \"Verantwortlichkeiten\" statt \"Rollen\", und es gibt kein eigenständig benanntes \"Entwicklungsteam\" mehr — alle bilden gemeinsam das eine Scrum Team.","aPt":"Product Owner (responsável pelo valor do trabalho e pelo Product Backlog), Scrum Master (responsável por estabelecer o Scrum, orienta a equipa e remove obstáculos) e os Developers (que criam o Increment). Desde a revisão do Scrum Guide de 2020, estas três passaram a chamar-se oficialmente \"responsabilidades\" em vez de \"papéis\", e deixou de existir uma \"equipa de desenvolvimento\" com nome próprio — todos formam, em conjunto, a única Scrum Team.","options":[{"text":"Product Owner, Scrum Master und Entwicklungsteam sind die drei getrennt benannten Rollen laut aktuellem Scrum Guide.","textPt":"Product Owner, Scrum Master e Entwicklungsteam são as três funções (roles) distintas segundo o atual Scrum Guide.","correct":false},{"text":"Projektleiter, Product Owner und Scrum Master bilden gemeinsam das Scrum Team.","textPt":"O gestor de projeto, o Product Owner e o Scrum Master formam juntos a Scrum Team.","correct":false},{"text":"Product Owner, Scrum Master und Stakeholder sind die drei Verantwortlichkeiten im Scrum Team.","textPt":"Product Owner, Scrum Master e os stakeholders são as três responsabilidades da Scrum Team.","correct":false},{"text":"Product Owner, Scrum Master und die Developers bilden gemeinsam das eine Scrum Team; seit 2020 heißen sie offiziell Verantwortlichkeiten statt Rollen.","textPt":"Product Owner, Scrum Master e os Developers formam juntos a única Scrum Team; desde 2020 chamam-se oficialmente responsabilidades (accountabilities), não papéis (roles).","correct":true}]},
{"cat":"plan","sub":"scrum","q":"Was ist ein Sprint in Scrum?","qPt":"O que é um Sprint no Scrum?","a":"Ein fester, meist 1–4 Wochen langer Zeitraum, in dem das Team ein potenziell auslieferbares Produktinkrement erstellt. Die Länge bleibt während des Projekts konstant.","aPt":"Um período fixo, normalmente entre 1 e 4 semanas, durante o qual a equipa cria um incremento do produto potencialmente entregável. A duração mantém-se constante ao longo do projeto.","options":[{"text":"Ein fester, meist 1–4 Wochen dauernder Zeitraum, in dem ein potenziell auslieferbares Produktinkrement entsteht; die Länge bleibt im Projekt konstant.","textPt":"Um período fixo, normalmente de 1 a 4 semanas, durante o qual é criado um incremento de produto potencialmente entregável; a duração mantém-se constante ao longo do projeto.","correct":true},{"text":"Ein flexibler Zeitraum von meist 1–4 Monaten, dessen Länge sich je nach Arbeitsaufwand im Projekt ändern darf.","textPt":"Um período flexível, normalmente de 1 a 4 meses, cuja duração pode variar conforme o volume de trabalho do projeto.","correct":false},{"text":"Ein fester Zeitraum von genau einer Woche, in dem alle offenen Backlog-Einträge abgeschlossen werden müssen.","textPt":"Um período fixo de exatamente uma semana, no qual todos os itens pendentes do backlog têm de ser concluídos.","correct":false},{"text":"Ein Meeting am Ende jeder Woche, in dem der Fortschritt des Projekts bewertet wird.","textPt":"Uma reunião ao final de cada semana em que o progresso do projeto é avaliado.","correct":false}]},
{"cat":"plan","sub":"scrum","q":"Wie unterscheiden sich Wasserfallmodell und agile Vorgehensmodelle grundsätzlich?","qPt":"Qual é a diferença fundamental entre o modelo em cascata (Wasserfallmodell) e os modelos de desenvolvimento ágeis?","a":"Das Wasserfallmodell durchläuft Phasen strikt sequenziell und abgeschlossen (Planung, Design, Umsetzung, Test, Betrieb). Agile Modelle wie Scrum arbeiten iterativ-inkrementell mit kurzen Zyklen und laufender Anpassung an Änderungen.","aPt":"O modelo em cascata percorre as fases de forma estritamente sequencial e concluída (planeamento, design, implementação, teste, operação). Os modelos ágeis, como o Scrum, trabalham de forma iterativa e incremental, em ciclos curtos, com adaptação contínua às mudanças.","options":[{"text":"Das Wasserfallmodell arbeitet iterativ in kurzen Zyklen, während agile Modelle alle Phasen einmalig und sequenziell durchlaufen.","textPt":"O modelo em cascata funciona de forma iterativa em ciclos curtos, enquanto os modelos ágeis percorrem todas as fases uma única vez e sequencialmente.","correct":false},{"text":"Beide Modelle unterscheiden sich nur in der Dokumentationssprache, der Ablauf ist identisch.","textPt":"Os dois modelos diferem apenas na linguagem da documentação; o fluxo de trabalho é idêntico.","correct":false},{"text":"Das Wasserfallmodell durchläuft Phasen streng sequenziell, agile Modelle wie Scrum arbeiten iterativ-inkrementell mit laufender Anpassung.","textPt":"O modelo em cascata percorre as fases de forma estritamente sequencial, enquanto modelos ágeis como o Scrum trabalham de forma iterativa e incremental, com adaptação contínua.","correct":true},{"text":"Agile Modelle verzichten vollständig auf Planung, während das Wasserfallmodell ausschließlich iterativ vorgeht.","textPt":"Os modelos ágeis dispensam totalmente o planeamento, enquanto o modelo em cascata funciona exclusivamente de forma iterativa.","correct":false}]},
{"cat":"plan","sub":"uml","q":"Was zeigt ein UML-Anwendungsfalldiagramm (Use-Case-Diagramm)?","qPt":"O que mostra um diagrama de casos de uso UML (Use-Case-Diagramm)?","a":"Es zeigt Akteure (Nutzer/Systeme) und die Anwendungsfälle (Funktionen), die sie mit dem System ausführen können, sowie Beziehungen wie include und extend.","aPt":"Mostra os atores (utilizadores/sistemas) e os casos de uso (funcionalidades) que estes podem executar com o sistema, bem como relações como include e extend.","options":[{"text":"Es zeigt den zeitlichen Ablauf von Nachrichten zwischen Objekten eines Systems.","textPt":"Mostra a sequência temporal de mensagens entre objetos de um sistema.","correct":false},{"text":"Es zeigt Akteure und die Anwendungsfälle, die sie mit dem System ausführen, sowie Beziehungen wie include und extend.","textPt":"Mostra os atores e os casos de uso que estes executam com o sistema, bem como relações como include e extend.","correct":true},{"text":"Es zeigt die statische Klassenstruktur eines Systems mit Attributen und Methoden.","textPt":"Mostra a estrutura estática das classes de um sistema, com atributos e métodos.","correct":false},{"text":"Es zeigt die Zustände eines Objekts und die Übergänge zwischen ihnen.","textPt":"Mostra os estados de um objeto e as transições entre eles.","correct":false}]},
{"cat":"plan","sub":"uml","q":"Was ist der Unterschied zwischen Aggregation und Komposition in UML?","qPt":"Qual é a diferença entre agregação e composição em UML?","a":"Beide sind \"Teil-Ganzes\"-Beziehungen. Bei der Aggregation kann der Teil unabhängig vom Ganzen existieren (offene Raute). Bei der Komposition ist der Teil existenzabhängig vom Ganzen (gefüllte Raute) — wird das Ganze gelöscht, verschwindet auch der Teil.","aPt":"Ambas são relações \"parte-todo\". Na agregação, a parte pode existir independentemente do todo (losango vazio). Na composição, a parte depende existencialmente do todo (losango preenchido) — se o todo for eliminado, a parte também desaparece.","options":[{"text":"Bei der Aggregation ist der Teil existenzabhängig vom Ganzen (gefüllte Raute), bei der Komposition kann er unabhängig existieren (offene Raute).","textPt":"Na agregação, a parte é existencialmente dependente do todo (losango preenchido); na composição, a parte pode existir de forma independente (losango vazio).","correct":false},{"text":"Aggregation und Komposition sind zwei Bezeichnungen für dieselbe Teil-Ganzes-Beziehung, ein inhaltlicher Unterschied besteht nicht.","textPt":"Agregação e composição são duas designações para a mesma relação parte-todo, não havendo diferença de conteúdo.","correct":false},{"text":"Aggregation beschreibt eine Ist-ein-Beziehung zwischen Ober- und Unterklasse, Komposition eine Teil-Ganzes-Beziehung.","textPt":"Agregação descreve uma relação É-um entre superclasse e subclasse; composição descreve uma relação parte-todo.","correct":false},{"text":"Bei der Aggregation kann der Teil unabhängig vom Ganzen existieren (offene Raute), bei der Komposition ist der Teil existenzabhängig vom Ganzen (gefüllte Raute).","textPt":"Na agregação, a parte pode existir independentemente do todo (losango vazio); na composição, a parte é existencialmente dependente do todo (losango preenchido) — se o todo for eliminado, a parte também desaparece.","correct":true}]},
{"cat":"plan","sub":"wirtschaftlichkeit","q":"Wie berechnet sich der Return on Investment (ROI)?","qPt":"Como se calcula o Retorno sobre o Investimento (ROI)?","a":"ROI = (Gewinn / eingesetztes Kapital) × 100. Er zeigt die prozentuale Rendite einer Investition.","aPt":"ROI = (Lucro / capital investido) × 100. Indica a rentabilidade percentual de um investimento.","options":[{"text":"ROI = (Gewinn / eingesetztes Kapital) × 100 und zeigt die prozentuale Rendite einer Investition.","textPt":"ROI = (Lucro / Capital investido) × 100 e indica o retorno percentual de um investimento.","correct":true},{"text":"ROI = (Umsatz / Gewinn) × 100 und zeigt den Anteil des Gewinns am Umsatz.","textPt":"ROI = (Receita / Lucro) × 100 e indica a proporção do lucro na receita.","correct":false},{"text":"ROI = eingesetztes Kapital / Gewinn und gibt die Amortisationsdauer in Jahren an.","textPt":"ROI = Capital investido / Lucro e indica o período de amortização em anos.","correct":false},{"text":"ROI = (Gewinn − Kosten) / Laufzeit und zeigt den jährlichen Gewinnzuwachs.","textPt":"ROI = (Lucro − Custos) / Duração e indica o aumento anual do lucro.","correct":false}]},
{"cat":"plan","sub":"wirtschaftlichkeit","q":"Was ermittelt die statische Amortisationsrechnung?","qPt":"O que determina o método estático do período de recuperação do investimento (payback period)?","a":"Den Zeitraum, nach dem die Anschaffungskosten einer Investition durch die erzielten Rückflüsse (Einzahlungsüberschüsse) wieder eingespielt sind.","aPt":"O período de tempo após o qual o investimento inicial de um projeto é recuperado através dos retornos (excedentes de entradas de caixa) gerados.","options":[{"text":"Den Gesamtgewinn, den eine Investition über ihre gesamte Nutzungsdauer erzielt.","textPt":"O lucro total que um investimento gera durante toda a sua vida útil.","correct":false},{"text":"Den auf den heutigen Zeitpunkt abgezinsten Wert aller zukünftigen Zahlungen einer Investition.","textPt":"O valor atualizado (descontado para o momento presente) de todos os pagamentos futuros de um investimento.","correct":false},{"text":"Den Zeitraum, nach dem die Anschaffungskosten einer Investition durch die erzielten Einzahlungsüberschüsse wieder eingespielt sind.","textPt":"O período de tempo após o qual os custos de aquisição de um investimento são recuperados através dos excedentes de caixa gerados.","correct":true},{"text":"Die prozentuale Rendite einer Investition bezogen auf das eingesetzte Kapital.","textPt":"O retorno percentual de um investimento em relação ao capital investido.","correct":false}]},
{"cat":"plan","sub":"wirtschaftlichkeit","q":"Was ist eine Nutzwertanalyse und wofür wird sie eingesetzt?","qPt":"O que é uma análise de valor utilitário (Nutzwertanalyse) e para que é utilizada?","a":"Ein Verfahren, um mehrere Alternativen (z. B. Software-Angebote) anhand gewichteter Kriterien vergleichbar zu bewerten und eine begründete Entscheidung zu treffen.","aPt":"Um método para avaliar e comparar várias alternativas (por exemplo, propostas de software) com base em critérios ponderados, permitindo tomar uma decisão fundamentada.","options":[{"text":"Ein Verfahren, das ausschließlich die monetären Kosten mehrerer Alternativen vergleicht, ohne qualitative Kriterien.","textPt":"Um método que compara exclusivamente os custos monetários de várias alternativas, sem critérios qualitativos.","correct":false},{"text":"Ein Verfahren, um mehrere Alternativen anhand gewichteter Kriterien vergleichbar zu bewerten und eine begründete Entscheidung zu treffen.","textPt":"Um método para avaliar e comparar várias alternativas (por exemplo, propostas de software) com base em critérios ponderados, permitindo uma decisão fundamentada.","correct":true},{"text":"Ein Verfahren zur Berechnung der Amortisationsdauer mehrerer Investitionsalternativen.","textPt":"Um método para calcular o período de amortização de várias alternativas de investimento.","correct":false},{"text":"Ein Verfahren, bei dem nur die billigste Alternative ausgewählt wird, unabhängig von weiteren Kriterien.","textPt":"Um método em que se escolhe apenas a alternativa mais barata, independentemente de outros critérios.","correct":false}]},
{"cat":"plan","sub":"pm","q":"Wie definiert man Risiko im Projektmanagement (vereinfachte Formel)?","qPt":"Como se define risco em gestão de projetos (fórmula simplificada)?","a":"Risiko = Eintrittswahrscheinlichkeit × Schadenshöhe (Tragweite). Darauf aufbauend werden Gegenmaßnahmen priorisiert.","aPt":"Risco = probabilidade de ocorrência × gravidade do dano (impacto). Com base nisso, priorizam-se as medidas de mitigação.","options":[{"text":"Risiko = Schadenshöhe / Eintrittswahrscheinlichkeit; je kleiner der Wert, desto dringlicher die Maßnahme.","textPt":"Risco = Gravidade do dano / Probabilidade de ocorrência; quanto menor o valor, mais urgente é a medida.","correct":false},{"text":"Risiko = Eintrittswahrscheinlichkeit + Schadenshöhe; beide Werte werden addiert statt multipliziert.","textPt":"Risco = Probabilidade de ocorrência + Gravidade do dano; os dois valores são somados em vez de multiplicados.","correct":false},{"text":"Risiko wird ausschließlich anhand der Schadenshöhe bewertet, die Wahrscheinlichkeit spielt keine Rolle.","textPt":"O risco é avaliado exclusivamente pela gravidade do dano; a probabilidade não tem qualquer papel.","correct":false},{"text":"Risiko = Eintrittswahrscheinlichkeit × Schadenshöhe; darauf aufbauend werden Gegenmaßnahmen priorisiert.","textPt":"Risco = Probabilidade de ocorrência × Gravidade do dano; com base nisso são priorizadas as contramedidas.","correct":true}]},
{"cat":"plan","sub":"pm","q":"Was ist der kritische Pfad in der Netzplantechnik?","qPt":"O que é o caminho crítico na técnica de planeamento em rede (Netzplantechnik)?","a":"Die Abfolge von Vorgängen mit der längsten Gesamtdauer und ohne Zeitpuffer. Verzögert sich ein Vorgang auf diesem Pfad, verzögert sich das gesamte Projekt.","aPt":"A sequência de atividades com a duração total mais longa e sem margem de folga (buffer). Se uma atividade deste caminho sofrer um atraso, todo o projeto atrasa.","options":[{"text":"Die Abfolge von Vorgängen mit der längsten Gesamtdauer und ohne Zeitpuffer; Verzögerungen hier verzögern das gesamte Projekt.","textPt":"A sequência de atividades com a maior duração total e sem qualquer margem de tempo; um atraso nesta sequência atrasa todo o projeto.","correct":true},{"text":"Die Abfolge von Vorgängen mit der kürzesten Gesamtdauer, die zuerst abgeschlossen werden muss.","textPt":"A sequência de atividades com a menor duração total, que tem de ser concluída em primeiro lugar.","correct":false},{"text":"Die Abfolge von Vorgängen mit dem größten Zeitpuffer, die flexibel verschoben werden kann.","textPt":"A sequência de atividades com a maior margem de tempo, que pode ser adiada com flexibilidade.","correct":false},{"text":"Eine beliebige Vorgangskette, die parallel zum Hauptprojekt läuft und keinen Einfluss auf den Endtermin hat.","textPt":"Uma cadeia de atividades qualquer que corre em paralelo ao projeto principal e não tem influência na data final.","correct":false}]},
{"cat":"plan","sub":"scrum","q":"Was ist das Grundprinzip von Kanban?","qPt":"Qual é o princípio básico do Kanban?","a":"Visualisierung des Arbeitsflusses auf einem Board mit Spalten (z. B. To do / In Arbeit / Fertig) und Begrenzung der gleichzeitig bearbeiteten Aufgaben (WIP-Limit), um den Durchfluss zu optimieren.","aPt":"Visualizar o fluxo de trabalho num quadro (board) com colunas (por exemplo, A fazer / Em curso / Concluído) e limitar o número de tarefas em curso simultaneamente (limite WIP), de forma a otimizar o fluxo.","options":[{"text":"Feste, zeitlich begrenzte Iterationen (Sprints), in denen ein Inkrement fertiggestellt wird.","textPt":"Iterações fixas e delimitadas no tempo (Sprints), nas quais um incremento é concluído.","correct":false},{"text":"Visualisierung des Arbeitsflusses auf einem Board mit Spalten und Begrenzung der gleichzeitig bearbeiteten Aufgaben (WIP-Limit).","textPt":"Visualização do fluxo de trabalho num quadro (board) com colunas e limitação do número de tarefas em curso simultaneamente (limite WIP).","correct":true},{"text":"Tägliche 15-minütige Treffen, in denen der Fortschritt jedes Teammitglieds abgefragt wird.","textPt":"Reuniões diárias de 15 minutos em que se questiona o progresso de cada membro da equipa.","correct":false},{"text":"Striktes sequenzielles Durchlaufen aller Projektphasen ohne Rückschritte.","textPt":"Passagem sequencial e rígida por todas as fases do projeto, sem retrocessos.","correct":false}]},
{"cat":"plan","sub":"scrum","q":"Was bedeutet \"Definition of Done\" in Scrum?","qPt":"O que significa \"Definition of Done\" no Scrum?","a":"Ein im Team vereinbartes, verbindliches Kriterienset, das erfüllt sein muss, damit ein Product-Backlog-Element als fertiggestellt gilt.","aPt":"Um conjunto de critérios vinculativo, acordado pela equipa, que tem de ser cumprido para que um elemento do Product Backlog seja considerado concluído.","options":[{"text":"Eine vom Product Owner allein festgelegte Liste von Wunschfunktionen für das nächste Release.","textPt":"Uma lista de funcionalidades desejadas para o próximo lançamento, definida unicamente pelo Product Owner.","correct":false},{"text":"Das Sprint-Ziel, das zu Beginn jedes Sprints neu vom Scrum Master definiert wird.","textPt":"O objetivo do Sprint, redefinido pelo Scrum Master no início de cada Sprint.","correct":false},{"text":"Ein im Team vereinbartes, verbindliches Kriterienset, das erfüllt sein muss, damit ein Product-Backlog-Element als fertiggestellt gilt.","textPt":"Um conjunto de critérios vinculativo, acordado pela equipa, que tem de ser cumprido para que um item do Product Backlog seja considerado concluído.","correct":true},{"text":"Die Schätzung des Aufwands in Story Points für ein Backlog-Element.","textPt":"A estimativa do esforço em Story Points para um item do backlog.","correct":false}]},
{"cat":"plan","sub":"test","q":"Was ist ein Pflichtenheft-Bestandteil \"Abnahmekriterien\"?","qPt":"O que são os \"critérios de aceitação\" como parte do Pflichtenheft?","a":"Konkrete, überprüfbare Kriterien, anhand derer Auftraggeber und Auftragnehmer gemeinsam feststellen, ob das Softwareprodukt vertragsgemäß fertiggestellt wurde.","aPt":"Critérios concretos e verificáveis, com base nos quais o cliente e o fornecedor determinam em conjunto se o produto de software foi concluído de acordo com o contrato.","options":[{"text":"Konkrete, überprüfbare Kriterien, anhand derer Auftraggeber und Auftragnehmer feststellen, ob das Produkt vertragsgemäß fertiggestellt wurde.","textPt":"Critérios concretos e verificáveis, com base nos quais o cliente e o fornecedor determinam se o produto foi concluído conforme o contrato.","correct":true},{"text":"Eine Liste von Wünschen des Kunden, die rechtlich nicht bindend ist und nur zur Orientierung dient.","textPt":"Uma lista de desejos do cliente, sem valor jurídico vinculativo, que serve apenas como orientação.","correct":false},{"text":"Die technischen Spezifikationen, die ausschließlich der Auftragnehmer intern zur Qualitätssicherung nutzt.","textPt":"As especificações técnicas que o fornecedor utiliza apenas internamente para garantia de qualidade.","correct":false},{"text":"Der vereinbarte Festpreis, zu dem das Projekt abgerechnet wird.","textPt":"O preço fixo acordado, pelo qual o projeto é faturado.","correct":false}]},
{"cat":"plan","sub":"test","q":"Was ist der Unterschied zwischen Verifikation und Validierung?","qPt":"Qual é a diferença entre verificação e validação?","a":"Verifikation prüft \"Bauen wir das Produkt richtig?\" (Erfüllung der Spezifikation). Validierung prüft \"Bauen wir das richtige Produkt?\" (Erfüllung des tatsächlichen Kundenbedarfs).","aPt":"A verificação responde a \"Estamos a construir o produto corretamente?\" (cumprimento da especificação). A validação responde a \"Estamos a construir o produto correto?\" (cumprimento da necessidade real do cliente).","options":[{"text":"Verifikation prüft, ob das Produkt den tatsächlichen Kundenbedarf erfüllt; Validierung prüft die Erfüllung der Spezifikation.","textPt":"A verificação avalia se o produto satisfaz a necessidade real do cliente; a validação avalia o cumprimento da especificação.","correct":false},{"text":"Verifikation und Validierung bezeichnen denselben Prüfprozess und werden synonym verwendet.","textPt":"Verificação e validação designam o mesmo processo de teste e são usadas como sinónimos.","correct":false},{"text":"Verifikation erfolgt nach Projektabschluss durch den Kunden, Validierung während der Entwicklung durch den Auftragnehmer.","textPt":"A verificação ocorre após o fim do projeto, feita pelo cliente; a validação ocorre durante o desenvolvimento, feita pelo fornecedor.","correct":false},{"text":"Verifikation prüft, ob das Produkt die Spezifikation erfüllt; Validierung prüft, ob es den tatsächlichen Kundenbedarf erfüllt.","textPt":"A verificação avalia se o produto cumpre a especificação (\"Construímos o produto corretamente?\"); a validação avalia se satisfaz a necessidade real do cliente (\"Construímos o produto correto?\").","correct":true}]},
{"cat":"plan","sub":"anforderungen","q":"Was ist eine funktionale Anforderung?","qPt":"O que é um requisito funcional?","a":"Eine Anforderung, die beschreibt, WAS ein System tun soll bzw. welche Funktionen es bereitstellen muss (z. B. \"Das System muss Rechnungen erstellen können\").","aPt":"Um requisito que descreve O QUE um sistema deve fazer, ou seja, que funcionalidades deve disponibilizar (por exemplo, \"O sistema deve conseguir emitir faturas\").","options":[{"text":"Eine Anforderung, die beschreibt, welche Funktionen das System bereitstellen muss, z. B. Rechnungen erstellen können.","textPt":"Um requisito que descreve que funções o sistema deve disponibilizar, por exemplo, poder emitir faturas.","correct":true},{"text":"Eine Anforderung an die Qualität oder Rahmenbedingungen des Systems, z. B. Ladezeit oder Sicherheit.","textPt":"Um requisito relativo à qualidade ou às condições gerais do sistema, por exemplo, tempo de carregamento ou segurança.","correct":false},{"text":"Eine Anforderung, die nur im Pflichtenheft, niemals im Lastenheft stehen darf.","textPt":"Um requisito que só pode constar no Pflichtenheft (caderno de encargos técnico), nunca no Lastenheft (caderno de encargos do cliente).","correct":false},{"text":"Eine rechtlich bindende Vorgabe aus einem Vertrag, unabhängig von der Systemfunktion.","textPt":"Uma exigência juridicamente vinculativa resultante de um contrato, independente da função do sistema.","correct":false}]},
{"cat":"plan","sub":"anforderungen","q":"Was ist eine nichtfunktionale Anforderung? Nenne ein Beispiel.","qPt":"O que é um requisito não funcional? Dá um exemplo.","a":"Eine Anforderung an die Qualität/Rahmenbedingungen des Systems statt an konkrete Funktionen, z. B. Performance, Sicherheit, Benutzerfreundlichkeit oder Skalierbarkeit — etwa \"Die Seite muss in unter 2 Sekunden laden\".","aPt":"Um requisito relacionado com a qualidade/condições do sistema, em vez de funcionalidades concretas — por exemplo, desempenho, segurança, usabilidade ou escalabilidade — como \"A página deve carregar em menos de 2 segundos\".","options":[{"text":"Eine Anforderung an Qualität/Rahmenbedingungen statt an konkrete Funktionen, z. B. Performance oder Sicherheit.","textPt":"Um requisito relativo à qualidade ou às condições gerais em vez de a funções concretas, por exemplo, desempenho ou segurança.","correct":true},{"text":"Eine Anforderung, die beschreibt, welche konkrete Funktion das System bereitstellen muss, z. B. Benutzer anlegen können.","textPt":"Um requisito que descreve que função concreta o sistema deve disponibilizar, por exemplo, poder criar utilizadores.","correct":false},{"text":"Eine Anforderung, die ausschließlich die Benutzeroberfläche betrifft und keine weiteren Qualitätsmerkmale umfasst.","textPt":"Um requisito que diz respeito exclusivamente à interface do utilizador e não abrange outras características de qualidade.","correct":false},{"text":"Eine optionale Anforderung, die bei Projektverzögerung ohne Rücksprache gestrichen werden darf.","textPt":"Um requisito opcional que pode ser eliminado sem consulta em caso de atraso do projeto.","correct":false}]},
{"cat":"plan","sub":"vorgehen","q":"Was ist das V-Modell (XT)?","qPt":"O que é o modelo em V (V-Modell XT)?","a":"Ein Vorgehensmodell, das jeder Entwicklungsphase (linker \"V\"-Ast) eine entsprechende Testphase (rechts) gegenüberstellt, z. B. Anforderungsanalyse ↔ Abnahmetest, Grobentwurf ↔ Systemtest, Feinentwurf ↔ Integrationstest, Implementierung ↔ Modultest.","aPt":"Um modelo de processo que faz corresponder a cada fase de desenvolvimento (ramo esquerdo do \"V\") uma fase de teste equivalente (ramo direito) — por exemplo, análise de requisitos ↔ teste de aceitação, conceção geral ↔ teste de sistema, conceção detalhada ↔ teste de integração, implementação ↔ teste de unidade/módulo.","options":[{"text":"Ein rein agiles Modell ohne feste Phasen, bei dem Tests nur am Ende des Projekts stattfinden.","textPt":"Um modelo puramente ágil, sem fases fixas, em que os testes só ocorrem no final do projeto.","correct":false},{"text":"Jeder Entwicklungsphase wird eine entsprechende Testphase gegenübergestellt, z. B. Anforderungsanalyse ↔ Abnahmetest.","textPt":"A cada fase de desenvolvimento é associada uma fase de teste correspondente, por exemplo, análise de requisitos ↔ teste de aceitação.","correct":true},{"text":"Ein Modell, bei dem zuerst alle Tests geschrieben und erst danach die Implementierung begonnen wird.","textPt":"Um modelo em que todos os testes são escritos primeiro e só depois começa a implementação.","correct":false},{"text":"Ein risikogetriebenes Modell, bei dem das Projekt in mehreren Zyklen mit wachsendem Funktionsumfang durchlaufen wird.","textPt":"Um modelo orientado ao risco, em que o projeto percorre vários ciclos com um âmbito de funcionalidades crescente.","correct":false}]},
{"cat":"plan","sub":"vorgehen","q":"Was ist das Spiralmodell nach Boehm?","qPt":"O que é o modelo em espiral de Boehm?","a":"Ein iteratives, risikogetriebenes Vorgehensmodell, bei dem das Projekt in mehreren Zyklen durchlaufen wird, wobei jeder Zyklus Zielbestimmung, Risikoanalyse, Entwicklung/Test und Planung des nächsten Zyklus umfasst.","aPt":"Um modelo de processo iterativo e orientado ao risco, em que o projeto percorre vários ciclos, sendo que cada ciclo inclui a definição de objetivos, a análise de riscos, o desenvolvimento/teste e o planeamento do ciclo seguinte.","options":[{"text":"Ein Modell, bei dem Entwicklungs- und Testphasen strikt einmalig und linear durchlaufen werden.","textPt":"Um modelo em que as fases de desenvolvimento e teste são percorridas uma única vez, de forma linear e rígida.","correct":false},{"text":"Ein Modell, bei dem jeder Entwicklungsphase eine spiegelbildliche Testphase gegenübergestellt wird.","textPt":"Um modelo em que cada fase de desenvolvimento tem uma fase de teste espelhada correspondente.","correct":false},{"text":"Ein iteratives, risikogetriebenes Modell, bei dem jeder Zyklus Zielbestimmung, Risikoanalyse, Entwicklung/Test und Planung des nächsten Zyklus umfasst.","textPt":"Um modelo iterativo orientado ao risco, em que cada ciclo inclui definição de objetivos, análise de risco, desenvolvimento/teste e planeamento do ciclo seguinte.","correct":true},{"text":"Ein Modell ohne Risikoanalyse, das sich ausschließlich auf schnelle Prototypen konzentriert.","textPt":"Um modelo sem análise de risco, focado exclusivamente na criação rápida de protótipos.","correct":false}]},
{"cat":"plan","sub":"vorgehen","q":"Was ist Prototyping als Vorgehensmodell?","qPt":"O que é a prototipagem (Prototyping) como modelo de processo?","a":"Es werden frühzeitig funktionsfähige Vorabversionen (Prototypen) des Systems erstellt, um Anforderungen zu klären oder Konzepte zu testen, bevor die endgültige Lösung entwickelt wird.","aPt":"São criadas, numa fase precoce, versões preliminares funcionais (protótipos) do sistema, para esclarecer requisitos ou testar conceitos antes de se desenvolver a solução final.","options":[{"text":"Es werden frühzeitig funktionsfähige Vorabversionen des Systems erstellt, um Anforderungen zu klären, bevor die endgültige Lösung entwickelt wird.","textPt":"São criadas, numa fase inicial, versões preliminares funcionais (protótipos) do sistema para esclarecer requisitos antes de desenvolver a solução definitiva.","correct":true},{"text":"Es wird ausschließlich die finale Softwareversion in kleinen, dokumentierten Schritten entwickelt.","textPt":"Desenvolve-se exclusivamente a versão final do software em pequenos passos documentados.","correct":false},{"text":"Es werden alle Anforderungen vollständig vor Projektbeginn fixiert, ohne spätere Änderungen zuzulassen.","textPt":"Todos os requisitos são fixados integralmente antes do início do projeto, sem permitir alterações posteriores.","correct":false},{"text":"Es handelt sich um ein Verfahren zur nachträglichen Dokumentation eines bereits fertigen Systems.","textPt":"Trata-se de um processo de documentação posterior de um sistema já concluído.","correct":false}]},
{"cat":"plan","sub":"vorgehen","q":"Was ist Extreme Programming (XP)?","qPt":"O que é a Extreme Programming (XP)?","a":"Ein agiles Vorgehensmodell mit Praktiken wie Pair Programming, Test-Driven Development, kontinuierlicher Integration und kurzen Release-Zyklen, das auf enge Kundenzusammenarbeit setzt.","aPt":"Um modelo de processo ágil com práticas como Pair Programming, Test-Driven Development, integração contínua e ciclos de release curtos, apostando numa colaboração estreita com o cliente.","options":[{"text":"Ein klassisches, dokumentationsintensives Modell mit strikt sequenziellen Phasen ohne Kundenkontakt während der Entwicklung.","textPt":"Um modelo clássico, com documentação intensiva e fases estritamente sequenciais, sem contacto com o cliente durante o desenvolvimento.","correct":false},{"text":"Ein agiles Modell mit Praktiken wie Pair Programming, Test-Driven Development und kontinuierlicher Integration bei enger Kundenzusammenarbeit.","textPt":"Um modelo ágil com práticas como Pair Programming, Test-Driven Development e integração contínua, com estreita colaboração com o cliente.","correct":true},{"text":"Ein Rahmenwerk, das feste Rollen wie Product Owner und Scrum Master sowie Sprints vorschreibt.","textPt":"Uma framework que impõe funções fixas como Product Owner e Scrum Master, além de Sprints.","correct":false},{"text":"Ein Verfahren, bei dem Tests grundsätzlich erst nach vollständigem Abschluss der Implementierung geschrieben werden.","textPt":"Um processo em que os testes são escritos apenas depois de a implementação estar totalmente concluída.","correct":false}]},
{"cat":"plan","sub":"scrum","q":"Was steht im Product Backlog bei Scrum?","qPt":"O que consta no Product Backlog, no Scrum?","a":"Eine priorisierte, sich ständig weiterentwickelnde Liste aller Anforderungen, Funktionen und Änderungen, die am Produkt vorgenommen werden sollen, gepflegt vom Product Owner.","aPt":"Uma lista priorizada e em constante evolução de todos os requisitos, funcionalidades e alterações a realizar no produto, mantida pelo Product Owner.","options":[{"text":"Eine für den aktuellen Sprint fixierte, unveränderliche Liste von Aufgaben, die vom Scrum Master erstellt wird.","textPt":"Uma lista fixa e imutável de tarefas para o Sprint atual, criada pelo Scrum Master.","correct":false},{"text":"Eine priorisierte, sich ständig weiterentwickelnde Liste aller Anforderungen und Änderungen am Produkt, gepflegt vom Product Owner.","textPt":"Uma lista priorizada e em constante evolução de todos os requisitos e alterações do produto, mantida pelo Product Owner.","correct":true},{"text":"Eine Liste technischer Fehler, die ausschließlich von den Developers nach dem Sprint Review gepflegt wird.","textPt":"Uma lista de erros técnicos, mantida exclusivamente pelos Developers após o Sprint Review.","correct":false},{"text":"Ein Dokument, das nach Projektabschluss einmalig erstellt wird, um die erreichten Ziele zusammenzufassen.","textPt":"Um documento criado uma única vez após o fim do projeto, para resumir os objetivos alcançados.","correct":false}]},
{"cat":"plan","sub":"scrum","q":"Was ist ein Sprint Backlog?","qPt":"O que é um Sprint Backlog?","a":"Der Sprint Backlog besteht laut aktuellem Scrum Guide aus drei Elementen: dem Sprint-Ziel (Warum), den für den Sprint ausgewählten Product-Backlog-Einträgen (Was) und einem Plan zu deren Umsetzung (Wie). Er wird von den Developers erstellt und gepflegt und im Sprintverlauf laufend aktualisiert.","aPt":"Segundo o atual Scrum Guide, o Sprint Backlog é composto por três elementos: o objetivo do Sprint (o Porquê), os itens do Product Backlog selecionados para o Sprint (o Quê) e um plano para a sua realização (o Como). É criado e mantido pelos Developers, sendo atualizado continuamente ao longo do Sprint.","options":[{"text":"Besteht nur aus dem Sprint-Ziel und wird ausschließlich vom Scrum Master verwaltet.","textPt":"É composto apenas pelo objetivo do Sprint e é gerido exclusivamente pelo Scrum Master.","correct":false},{"text":"Ist eine unveränderliche Liste, die zu Sprint-Beginn vom Product Owner festgelegt und während des Sprints nicht mehr angepasst wird.","textPt":"É uma lista imutável, definida pelo Product Owner no início do Sprint e que não é mais ajustada durante o Sprint.","correct":false},{"text":"Besteht aus Sprint-Ziel, den für den Sprint ausgewählten Product-Backlog-Einträgen und einem Umsetzungsplan; wird von den Developers erstellt und gepflegt.","textPt":"É composto pelo objetivo do Sprint, pelos itens do Product Backlog selecionados para o Sprint e por um plano de implementação; é criado e mantido pelos Developers.","correct":true},{"text":"Enthält alle Einträge des gesamten Product Backlogs, priorisiert nach Geschäftswert.","textPt":"Contém todos os itens de todo o Product Backlog, priorizados por valor de negócio.","correct":false}]},
{"cat":"plan","sub":"scrum","q":"Was passiert im Daily Scrum?","qPt":"O que acontece no Daily Scrum?","a":"Ein auf 15 Minuten timeboxtes, tägliches Event der Developers, um den Fortschritt in Richtung Sprint-Ziel zu überprüfen und den Sprint Backlog bei Bedarf anzupassen. Der aktuelle Scrum Guide schreibt dafür kein festes Frage-Schema (z. B. \"gestern/heute/Hindernisse\") mehr vor — das Team kann Struktur und Technik frei wählen, solange der Fokus auf dem Sprint-Ziel erhalten bleibt.","aPt":"Um evento diário dos Developers, com timebox de 15 minutos, para verificar o progresso em direção ao objetivo do Sprint e ajustar o Sprint Backlog, se necessário. O atual Scrum Guide já não prescreve um esquema fixo de perguntas (por exemplo, \"ontem/hoje/obstáculos\") — a equipa pode escolher livremente a estrutura e a técnica, desde que o foco no objetivo do Sprint se mantenha.","options":[{"text":"Ein 30-minütiges tägliches Meeting, in dem jedes Teammitglied zwingend die Fragen gestern/heute/Hindernisse beantworten muss.","textPt":"Uma reunião diária de 30 minutos em que cada membro da equipa tem obrigatoriamente de responder às perguntas ontem/hoje/obstáculos.","correct":false},{"text":"Ein wöchentliches Treffen aller Stakeholder zur Bewertung des fertigen Inkrements.","textPt":"Uma reunião semanal com todos os stakeholders para avaliar o incremento concluído.","correct":false},{"text":"Ein optionales Meeting, das nur bei Bedarf und nicht täglich stattfindet.","textPt":"Uma reunião opcional, que só ocorre quando necessário e não diariamente.","correct":false},{"text":"Ein auf 15 Minuten timeboxtes, tägliches Event der Developers zur Überprüfung des Fortschritts Richtung Sprint-Ziel; ein festes Frage-Schema ist nicht mehr vorgeschrieben.","textPt":"Um evento diário dos Developers, com timebox de 15 minutos, para verificar o progresso em relação ao objetivo do Sprint; já não existe um esquema fixo de perguntas obrigatório.","correct":true}]},
{"cat":"plan","sub":"scrum","q":"Was ist ein Sprint Review?","qPt":"O que é um Sprint Review?","a":"Ein Termin am Ende des Sprints, bei dem das Team das fertige Produktinkrement den Stakeholdern präsentiert und Feedback einholt.","aPt":"Uma reunião no final do Sprint, na qual a equipa apresenta o incremento de produto concluído aos stakeholders e recolhe feedback.","options":[{"text":"Ein Termin am Ende des Sprints, bei dem das Team das fertige Produktinkrement den Stakeholdern präsentiert und Feedback einholt.","textPt":"Um evento no final do Sprint em que a equipa apresenta o incremento de produto concluído aos stakeholders e recolhe feedback.","correct":true},{"text":"Ein teaminternes Treffen ohne Stakeholder, bei dem der Entwicklungsprozess reflektiert wird.","textPt":"Uma reunião interna da equipa, sem stakeholders, em que se reflete sobre o processo de desenvolvimento.","correct":false},{"text":"Ein tägliches 15-minütiges Treffen zur Abstimmung der Tagesaufgaben.","textPt":"Uma reunião diária de 15 minutos para alinhar as tarefas do dia.","correct":false},{"text":"Ein Planungstreffen zu Beginn des Sprints, bei dem der Sprint Backlog erstellt wird.","textPt":"Uma reunião de planeamento no início do Sprint, em que o Sprint Backlog é criado.","correct":false}]},
{"cat":"plan","sub":"scrum","q":"Was ist eine Sprint Retrospective?","qPt":"O que é uma Sprint Retrospective?","a":"Ein team-internes Treffen nach dem Sprint Review, in dem reflektiert wird, wie die Zusammenarbeit und der Prozess verbessert werden können.","aPt":"Uma reunião interna da equipa, realizada após o Sprint Review, em que se reflete sobre como melhorar a colaboração e o processo.","options":[{"text":"Ein Treffen mit Stakeholdern, bei dem das Produktinkrement präsentiert wird.","textPt":"Uma reunião com stakeholders em que o incremento de produto é apresentado.","correct":false},{"text":"Ein teaminternes Treffen nach dem Sprint Review, in dem reflektiert wird, wie Zusammenarbeit und Prozess verbessert werden können.","textPt":"Uma reunião interna da equipa, após o Sprint Review, em que se reflete sobre como melhorar a colaboração e o processo.","correct":true},{"text":"Ein tägliches Treffen, in dem Hindernisse im aktuellen Sprint besprochen werden.","textPt":"Uma reunião diária em que se discutem os obstáculos do Sprint atual.","correct":false},{"text":"Ein Treffen zu Projektbeginn, in dem die Teamregeln einmalig festgelegt werden.","textPt":"Uma reunião no início do projeto, em que as regras da equipa são definidas uma única vez.","correct":false}]},
{"cat":"plan","sub":"scrum","q":"Was ist ein Burndown-Chart?","qPt":"O que é um gráfico Burndown?","a":"Ein Diagramm, das den verbleibenden Arbeitsaufwand (z. B. Story Points) über die Zeit eines Sprints darstellt und so den Fortschritt visualisiert.","aPt":"Um gráfico que representa o trabalho restante (por exemplo, em Story Points) ao longo do tempo de um Sprint, visualizando assim o progresso.","options":[{"text":"Ein Diagramm, das zeigt, wie viele Arbeitseinheiten sich in welchem Status befinden.","textPt":"Um gráfico que mostra quantas unidades de trabalho se encontram em cada estado.","correct":false},{"text":"Ein Diagramm, das den kumulierten, bereits erledigten Aufwand über das gesamte Projekt darstellt (nur ansteigend).","textPt":"Um gráfico que mostra o trabalho já concluído, acumulado ao longo de todo o projeto (sempre crescente).","correct":false},{"text":"Ein Diagramm, das den verbleibenden Arbeitsaufwand über die Zeit eines Sprints darstellt und so den Fortschritt visualisiert.","textPt":"Um gráfico que mostra o trabalho restante ao longo do tempo de um Sprint, visualizando assim o progresso.","correct":true},{"text":"Ein Diagramm, das die Verteilung der Story Points auf die Teammitglieder zeigt.","textPt":"Um gráfico que mostra a distribuição dos Story Points entre os membros da equipa.","correct":false}]},
{"cat":"plan","sub":"scrum","q":"Was sind Story Points?","qPt":"O que são Story Points?","a":"Eine relative Maßeinheit zur Schätzung des Aufwands/der Komplexität einer User Story, unabhängig von absoluter Zeit.","aPt":"Uma unidade relativa de medida para estimar o esforço/complexidade de uma User Story, independente do tempo absoluto.","options":[{"text":"Eine absolute Zeitangabe in Stunden, die genau angibt, wie lange eine User Story dauert.","textPt":"Uma indicação de tempo absoluta em horas, que define exatamente quanto tempo uma User Story demora.","correct":false},{"text":"Eine Kennzahl, die den Geschäftswert einer User Story für den Kunden in Euro beziffert.","textPt":"Um indicador que quantifica, em euros, o valor de negócio de uma User Story para o cliente.","correct":false},{"text":"Eine feste Punktzahl, die der Product Owner jeder User Story unabhängig vom Team vergibt.","textPt":"Uma pontuação fixa que o Product Owner atribui a cada User Story, independentemente da equipa.","correct":false},{"text":"Eine relative Maßeinheit zur Schätzung des Aufwands/der Komplexität einer User Story, unabhängig von absoluter Zeit.","textPt":"Uma unidade de medida relativa para estimar o esforço/a complexidade de uma User Story, independente do tempo absoluto.","correct":true}]},
{"cat":"plan","sub":"scrum","q":"Was ist Planning Poker?","qPt":"O que é o Planning Poker?","a":"Eine Schätztechnik, bei der Teammitglieder verdeckt Karten mit Aufwandsschätzungen (oft Fibonacci-Zahlen) wählen und diese gleichzeitig aufdecken, um zu einer gemeinsamen Einschätzung zu kommen.","aPt":"Uma técnica de estimativa em que os membros da equipa escolhem, em segredo, cartas com estimativas de esforço (frequentemente números de Fibonacci) e as revelam simultaneamente, para chegar a uma estimativa consensual.","options":[{"text":"Teammitglieder wählen verdeckt Karten mit Aufwandsschätzungen (oft Fibonacci-Zahlen) und decken sie gleichzeitig auf, um zu einer gemeinsamen Einschätzung zu kommen.","textPt":"Os membros da equipa escolhem, de forma oculta, cartas com estimativas de esforço (frequentemente números de Fibonacci) e revelam-nas simultaneamente, chegando a uma estimativa comum.","correct":true},{"text":"Der Scrum Master legt die Schätzung für jede User Story allein fest und teilt sie dem Team mit.","textPt":"O Scrum Master define sozinho a estimativa de cada User Story e comunica-a à equipa.","correct":false},{"text":"Teammitglieder schätzen offen und einzeln nacheinander, wobei die erste genannte Zahl übernommen wird.","textPt":"Os membros da equipa estimam de forma aberta e individualmente, um a seguir ao outro, prevalecendo o primeiro número indicado.","correct":false},{"text":"Eine Technik, bei der ausschließlich Geldbeträge statt Aufwandspunkten verwendet werden, um Kosten zu schätzen.","textPt":"Uma técnica em que se usam exclusivamente valores monetários, em vez de pontos de esforço, para estimar custos.","correct":false}]},
{"cat":"plan","sub":"scrum","q":"Was ist eine User Story?","qPt":"O que é uma User Story?","a":"Eine kurze, aus Anwendersicht formulierte Beschreibung einer Anforderung, oft im Format \"Als [Rolle] möchte ich [Ziel], damit [Nutzen]\".","aPt":"Uma descrição breve de um requisito, formulada do ponto de vista do utilizador, frequentemente no formato \"Como [papel], quero [objetivo], para que [benefício]\".","options":[{"text":"Ein technisches Dokument, das die Implementierungsdetails einer Funktion aus Entwicklersicht beschreibt.","textPt":"Um documento técnico que descreve os detalhes de implementação de uma funcionalidade do ponto de vista do desenvolvedor.","correct":false},{"text":"Eine kurze, aus Anwendersicht formulierte Anforderung, oft im Format 'Als [Rolle] möchte ich [Ziel], damit [Nutzen]'.","textPt":"Um requisito curto, formulado do ponto de vista do utilizador, frequentemente no formato 'Como [papel], quero [objetivo], para que [benefício]'.","correct":true},{"text":"Eine vollständige, rechtlich bindende Spezifikation aller Funktionen des Systems.","textPt":"Uma especificação completa e juridicamente vinculativa de todas as funções do sistema.","correct":false},{"text":"Eine Liste aller Fehler, die während eines Sprints im System gefunden wurden.","textPt":"Uma lista de todos os erros encontrados no sistema durante um Sprint.","correct":false}]},
{"cat":"plan","sub":"scrum","q":"Was bedeutet das WIP-Limit bei Kanban?","qPt":"O que significa o limite WIP no Kanban?","a":"Es begrenzt die Anzahl der Aufgaben, die gleichzeitig in einer Spalte/einem Arbeitsschritt bearbeitet werden dürfen, um Engpässe zu vermeiden und den Durchfluss zu verbessern.","aPt":"Limita o número de tarefas que podem estar a ser trabalhadas em simultâneo numa coluna/etapa de trabalho, de forma a evitar estrangulamentos e melhorar o fluxo.","options":[{"text":"Es begrenzt die Anzahl der Aufgaben, die gleichzeitig in einem Arbeitsschritt bearbeitet werden dürfen, um Engpässe zu vermeiden.","textPt":"Limita o número de tarefas que podem ser trabalhadas simultaneamente numa etapa do fluxo, para evitar estrangulamentos.","correct":true},{"text":"Es legt fest, wie viele Aufgaben pro Woche mindestens abgeschlossen werden müssen.","textPt":"Define o número mínimo de tarefas que têm de ser concluídas por semana.","correct":false},{"text":"Es begrenzt die maximale Dauer, die eine einzelne Aufgabe im gesamten Board verbringen darf.","textPt":"Limita a duração máxima que uma única tarefa pode passar no quadro (board) como um todo.","correct":false},{"text":"Es bestimmt die Anzahl der Teammitglieder, die an einem Kanban-Board arbeiten dürfen.","textPt":"Determina o número de membros da equipa que podem trabalhar num quadro Kanban.","correct":false}]},
{"cat":"plan","sub":"scrum","q":"Was zeigt ein Cumulative-Flow-Diagram?","qPt":"O que mostra um Cumulative Flow Diagram?","a":"Es zeigt über die Zeit, wie viele Arbeitseinheiten sich in welchem Status (z. B. To do, In Arbeit, Fertig) befinden, und macht Engpässe im Arbeitsfluss sichtbar.","aPt":"Mostra, ao longo do tempo, quantas unidades de trabalho se encontram em cada estado (por exemplo, A fazer, Em curso, Concluído), tornando visíveis os estrangulamentos no fluxo de trabalho.","options":[{"text":"Es zeigt den verbleibenden Arbeitsaufwand eines einzelnen Sprints als fallende Linie.","textPt":"Mostra o trabalho restante de um único Sprint como uma linha descendente.","correct":false},{"text":"Es zeigt die Verteilung der Story Points nach Schwierigkeitsgrad in einem Kreisdiagramm.","textPt":"Mostra a distribuição dos Story Points por grau de dificuldade num gráfico circular.","correct":false},{"text":"Es zeigt ausschließlich die Anzahl abgeschlossener Aufgaben am Ende jedes Monats.","textPt":"Mostra exclusivamente o número de tarefas concluídas ao final de cada mês.","correct":false},{"text":"Es zeigt über die Zeit, wie viele Arbeitseinheiten sich in welchem Status befinden, und macht Engpässe im Arbeitsfluss sichtbar.","textPt":"Mostra, ao longo do tempo, quantas unidades de trabalho se encontram em cada estado, tornando visíveis os estrangulamentos no fluxo de trabalho.","correct":true}]},
{"cat":"plan","sub":"uml","q":"Was ist der Unterschied zwischen Assoziation und Vererbung in UML-Klassendiagrammen?","qPt":"Qual é a diferença entre associação e herança nos diagramas de classes UML?","a":"Eine Assoziation beschreibt eine Beziehung zwischen zwei eigenständigen Klassen (z. B. \"nutzt\", \"hat\"). Vererbung (Generalisierung) beschreibt eine Ist-ein-Beziehung, bei der eine Klasse Eigenschaften einer Oberklasse übernimmt.","aPt":"Uma associação descreve uma relação entre duas classes independentes (por exemplo, \"usa\", \"tem\"). A herança (generalização) descreve uma relação \"é um\", em que uma classe herda as propriedades de uma superclasse.","options":[{"text":"Eine Assoziation beschreibt eine Beziehung zwischen zwei eigenständigen Klassen; Vererbung beschreibt eine Ist-ein-Beziehung mit Übernahme von Oberklassen-Eigenschaften.","textPt":"Uma associação descreve uma relação entre duas classes independentes; a herança descreve uma relação É-um, com herança de propriedades da superclasse.","correct":true},{"text":"Eine Assoziation beschreibt eine Ist-ein-Beziehung, Vererbung eine Beziehung zwischen zwei eigenständigen Klassen.","textPt":"Uma associação descreve uma relação É-um; a herança descreve uma relação entre duas classes independentes.","correct":false},{"text":"Assoziation und Vererbung sind zwei synonyme Begriffe für dieselbe Teil-Ganzes-Beziehung.","textPt":"Associação e herança são dois termos sinónimos para a mesma relação parte-todo.","correct":false},{"text":"Eine Assoziation beschreibt immer eine Existenzabhängigkeit zwischen zwei Objekten, Vererbung beschreibt eine lose Nutzungsbeziehung.","textPt":"Uma associação descreve sempre uma dependência existencial entre dois objetos; a herança descreve uma relação de utilização solta.","correct":false}]},
{"cat":"plan","sub":"uml","q":"Was gibt die Multiplizität in einem UML-Klassendiagramm an?","qPt":"O que indica a multiplicidade num diagrama de classes UML?","a":"Sie gibt an, wie viele Objekte der einen Klasse mit wie vielen Objekten der anderen Klasse in Beziehung stehen können (z. B. 1, 0..1, 1..*, 0..*).","aPt":"Indica quantos objetos de uma classe podem estar relacionados com quantos objetos da outra classe (por exemplo, 1, 0..1, 1..*, 0..*).","options":[{"text":"Sie gibt die Anzahl der Attribute an, die eine Klasse besitzen darf.","textPt":"Indica o número de atributos que uma classe pode ter.","correct":false},{"text":"Sie gibt an, wie viele Objekte der einen Klasse mit wie vielen Objekten der anderen Klasse in Beziehung stehen können, z. B. 1, 0..1, 1..*.","textPt":"Indica quantos objetos de uma classe podem estar relacionados com quantos objetos de outra classe, por exemplo, 1, 0..1, 1..*.","correct":true},{"text":"Sie gibt an, wie oft eine Methode innerhalb eines Sequenzdiagramms aufgerufen werden darf.","textPt":"Indica quantas vezes um método pode ser chamado dentro de um diagrama de sequência.","correct":false},{"text":"Sie beschreibt, ob eine Klasse abstrakt oder konkret ist.","textPt":"Descreve se uma classe é abstrata ou concreta.","correct":false}]},
{"cat":"plan","sub":"uml","q":"Was zeigt ein UML-Sequenzdiagramm?","qPt":"O que mostra um diagrama de sequência UML?","a":"Es stellt den zeitlichen Ablauf von Nachrichten/Methodenaufrufen zwischen Objekten dar und eignet sich zur Visualisierung dynamischer Abläufe.","aPt":"Representa a ordem temporal das mensagens/chamadas de métodos entre objetos, sendo adequado para visualizar fluxos dinâmicos.","options":[{"text":"Es zeigt die statischen Klassen eines Systems mit ihren Attributen und Methoden.","textPt":"Mostra as classes estáticas de um sistema, com os seus atributos e métodos.","correct":false},{"text":"Es zeigt die Akteure und Anwendungsfälle eines Systems.","textPt":"Mostra os atores e os casos de uso de um sistema.","correct":false},{"text":"Es stellt den zeitlichen Ablauf von Nachrichten/Methodenaufrufen zwischen Objekten dar und eignet sich zur Visualisierung dynamischer Abläufe.","textPt":"Representa a sequência temporal de mensagens/chamadas de métodos entre objetos, servindo para visualizar processos dinâmicos.","correct":true},{"text":"Es zeigt die Zustände eines Objekts und die Übergänge zwischen ihnen.","textPt":"Mostra os estados de um objeto e as transições entre eles.","correct":false}]},
{"cat":"plan","sub":"uml","q":"Was zeigt ein UML-Aktivitätsdiagramm?","qPt":"O que mostra um diagrama de atividades UML?","a":"Es visualisiert den Ablauf eines Prozesses oder Algorithmus mit Aktivitäten, Entscheidungen, parallelen Abläufen und Start-/Endpunkten — ähnlich einem Flussdiagramm.","aPt":"Visualiza o fluxo de um processo ou algoritmo, com atividades, decisões, fluxos paralelos e pontos de início/fim — semelhante a um fluxograma.","options":[{"text":"Es zeigt die zeitliche Reihenfolge von Nachrichten zwischen konkreten Objektinstanzen.","textPt":"Mostra a ordem temporal das mensagens entre instâncias concretas de objetos.","correct":false},{"text":"Es zeigt die statische Struktur der Klassen eines Systems und ihre Beziehungen.","textPt":"Mostra a estrutura estática das classes de um sistema e as suas relações.","correct":false},{"text":"Es zeigt, welche Akteure welche Funktionen eines Systems nutzen können.","textPt":"Mostra que atores podem utilizar que funções de um sistema.","correct":false},{"text":"Es visualisiert den Ablauf eines Prozesses mit Aktivitäten, Entscheidungen, parallelen Abläufen und Start-/Endpunkten.","textPt":"Visualiza o fluxo de um processo com atividades, decisões, fluxos paralelos e pontos de início/fim.","correct":true}]},
{"cat":"plan","sub":"uml","q":"Was zeigt ein UML-Zustandsdiagramm (State Machine)?","qPt":"O que mostra um diagrama de estados UML (State Machine)?","a":"Es zeigt die möglichen Zustände eines Objekts und die Übergänge (Transitionen) zwischen diesen Zuständen, ausgelöst durch Ereignisse.","aPt":"Mostra os possíveis estados de um objeto e as transições entre esses estados, desencadeadas por eventos.","options":[{"text":"Es zeigt die möglichen Zustände eines Objekts und die durch Ereignisse ausgelösten Übergänge zwischen diesen Zuständen.","textPt":"Mostra os estados possíveis de um objeto e as transições entre esses estados, desencadeadas por eventos.","correct":true},{"text":"Es zeigt den Ablauf eines Geschäftsprozesses mit parallelen Aktivitäten und Entscheidungen.","textPt":"Mostra o fluxo de um processo de negócio com atividades paralelas e decisões.","correct":false},{"text":"Es zeigt die Vererbungshierarchie zwischen mehreren Klassen.","textPt":"Mostra a hierarquia de herança entre várias classes.","correct":false},{"text":"Es zeigt den Nachrichtenaustausch zwischen mehreren Objekten über die Zeit.","textPt":"Mostra a troca de mensagens entre vários objetos ao longo do tempo.","correct":false}]},
{"cat":"plan","sub":"uml","q":"Was ist ein Entity-Relationship-Modell (ERM)?","qPt":"O que é um modelo entidade-relacionamento (ERM)?","a":"Ein Modell zur Darstellung von Datenobjekten (Entitäten), ihren Attributen und den Beziehungen zwischen ihnen — Grundlage für den Datenbankentwurf.","aPt":"Um modelo para representar objetos de dados (entidades), os seus atributos e as relações entre eles — a base para o desenho de bases de dados.","options":[{"text":"Ein Modell zur Darstellung des zeitlichen Ablaufs von Datenbankzugriffen eines Systems.","textPt":"Um modelo para representar a sequência temporal dos acessos a uma base de dados por um sistema.","correct":false},{"text":"Ein Modell zur Darstellung von Entitäten, ihren Attributen und Beziehungen untereinander — Grundlage für den Datenbankentwurf.","textPt":"Um modelo para representar entidades, os seus atributos e as relações entre elas — base para o desenho de bases de dados.","correct":true},{"text":"Ein UML-Diagramm zur Darstellung der Klassenhierarchie eines objektorientierten Systems.","textPt":"Um diagrama UML para representar a hierarquia de classes de um sistema orientado a objetos.","correct":false},{"text":"Ein Diagramm, das ausschließlich die Benutzeroberfläche einer Datenbankanwendung beschreibt.","textPt":"Um diagrama que descreve exclusivamente a interface do utilizador de uma aplicação de base de dados.","correct":false}]},
{"cat":"plan","sub":"uml","q":"Was bedeutet Kardinalität in einem ER-Modell?","qPt":"O que significa cardinalidade num modelo entidade-relacionamento?","a":"Sie beschreibt, wie viele Instanzen einer Entität mit wie vielen Instanzen einer anderen Entität in Beziehung stehen können, z. B. 1:1, 1:n, n:m.","aPt":"Descreve quantas instâncias de uma entidade podem estar relacionadas com quantas instâncias de outra entidade, por exemplo 1:1, 1:n, n:m.","options":[{"text":"Sie beschreibt die Anzahl der Attribute, die eine Entität besitzen muss.","textPt":"Descreve o número de atributos que uma entidade deve possuir.","correct":false},{"text":"Sie beschreibt, ob eine Entität ein Primär- oder Fremdschlüssel-Attribut besitzt.","textPt":"Descreve se uma entidade possui um atributo de chave primária ou chave estrangeira.","correct":false},{"text":"Sie beschreibt, wie viele Instanzen einer Entität mit wie vielen Instanzen einer anderen Entität in Beziehung stehen können, z. B. 1:1, 1:n, n:m.","textPt":"Descreve quantas instâncias de uma entidade podem estar relacionadas com quantas instâncias de outra entidade, por exemplo, 1:1, 1:n, n:m.","correct":true},{"text":"Sie beschreibt die Reihenfolge, in der Entitäten in der Datenbank angelegt werden müssen.","textPt":"Descreve a ordem em que as entidades devem ser criadas na base de dados.","correct":false}]},
{"cat":"plan","sub":"uml","q":"Wie löst man eine n:m-Beziehung im relationalen Datenmodell auf?","qPt":"Como se resolve uma relação n:m no modelo de dados relacional?","a":"Durch eine zusätzliche Zwischentabelle (Verbindungstabelle), die die Primärschlüssel beider beteiligten Tabellen als Fremdschlüssel enthält.","aPt":"Através de uma tabela intermédia adicional (tabela de associação), que contém as chaves primárias de ambas as tabelas envolvidas como chaves estrangeiras.","options":[{"text":"Indem beide Tabellen zu einer einzigen großen Tabelle zusammengeführt werden.","textPt":"Unindo ambas as tabelas numa única tabela grande.","correct":false},{"text":"Indem in jeder der beiden Tabellen ein zusätzliches Attribut für die jeweils andere Tabelle als Primärschlüssel ergänzt wird, ohne weitere Tabelle.","textPt":"Adicionando, em cada uma das duas tabelas, um atributo extra que referencia a outra tabela como chave primária, sem criar outra tabela.","correct":false},{"text":"Indem eine der beiden Tabellen gelöscht und durch die jeweils andere ersetzt wird.","textPt":"Eliminando uma das duas tabelas e substituindo-a pela outra.","correct":false},{"text":"Durch eine zusätzliche Zwischentabelle, die die Primärschlüssel beider beteiligten Tabellen als Fremdschlüssel enthält.","textPt":"Através de uma tabela intermédia adicional, que contém as chaves primárias de ambas as tabelas envolvidas como chaves estrangeiras.","correct":true}]},
{"cat":"plan","sub":"wirtschaftlichkeit","q":"Was ist die Kapitalwertmethode?","qPt":"O que é o método do valor atual líquido (Kapitalwertmethode)?","a":"Ein dynamisches Investitionsrechnungsverfahren, bei dem alle zukünftigen Ein- und Auszahlungen einer Investition auf den heutigen Zeitpunkt abgezinst und summiert werden; ist der Kapitalwert positiv, gilt die Investition als vorteilhaft.","aPt":"Um método dinâmico de cálculo de investimento, em que todas as entradas e saídas futuras de um investimento são descontadas para o momento atual e somadas; se o valor atual líquido for positivo, o investimento é considerado vantajoso.","options":[{"text":"Alle zukünftigen Ein- und Auszahlungen werden auf den heutigen Zeitpunkt abgezinst und summiert; ein positiver Kapitalwert zeigt eine vorteilhafte Investition.","textPt":"Todos os pagamentos futuros (entradas e saídas) são descontados para o valor presente e somados; um valor atual líquido positivo indica um investimento vantajoso.","correct":true},{"text":"Alle zukünftigen Zahlungen werden ohne Abzinsung einfach addiert, um die Rentabilität zu bewerten.","textPt":"Todos os pagamentos futuros são simplesmente somados, sem desconto, para avaliar a rentabilidade.","correct":false},{"text":"Es wird nur der Zeitpunkt berechnet, zu dem sich die Anschaffungskosten amortisiert haben.","textPt":"Calcula-se apenas o momento em que os custos de aquisição foram amortizados.","correct":false},{"text":"Es wird ausschließlich die prozentuale Rendite bezogen auf das eingesetzte Kapital berechnet.","textPt":"Calcula-se exclusivamente o retorno percentual em relação ao capital investido.","correct":false}]},
{"cat":"plan","sub":"wirtschaftlichkeit","q":"Was ist der Unterschied zwischen statischer und dynamischer Investitionsrechnung?","qPt":"Qual é a diferença entre o cálculo de investimento estático e dinâmico?","a":"Statische Verfahren (z. B. Amortisationsrechnung) berücksichtigen keinen Zeitwert des Geldes, dynamische Verfahren (z. B. Kapitalwertmethode) diskontieren zukünftige Zahlungen auf den heutigen Wert.","aPt":"Os métodos estáticos (por exemplo, o período de recuperação do investimento) não consideram o valor temporal do dinheiro; os métodos dinâmicos (por exemplo, o método do valor atual líquido) descontam os pagamentos futuros para o seu valor atual.","options":[{"text":"Statische Verfahren diskontieren zukünftige Zahlungen auf den heutigen Wert, dynamische Verfahren berücksichtigen keinen Zeitwert des Geldes.","textPt":"Os métodos estáticos descontam os pagamentos futuros para o valor presente; os métodos dinâmicos não consideram o valor temporal do dinheiro.","correct":false},{"text":"Statische Verfahren berücksichtigen keinen Zeitwert des Geldes, dynamische Verfahren diskontieren zukünftige Zahlungen auf den heutigen Wert.","textPt":"Os métodos estáticos não consideram o valor temporal do dinheiro; os métodos dinâmicos descontam os pagamentos futuros para o valor presente.","correct":true},{"text":"Beide Verfahren diskontieren zukünftige Zahlungen gleichermaßen, unterscheiden sich aber in der Berechnung der Steuerlast.","textPt":"Ambos os métodos descontam os pagamentos futuros da mesma forma, diferindo apenas no cálculo da carga fiscal.","correct":false},{"text":"Statische Verfahren werden nur für kurzfristige, dynamische ausschließlich für langfristige Investitionen verwendet.","textPt":"Os métodos estáticos usam-se apenas para investimentos de curto prazo, os dinâmicos exclusivamente para longo prazo.","correct":false}]},
{"cat":"plan","sub":"wirtschaftlichkeit","q":"Was ist der Break-even-Point?","qPt":"O que é o ponto de equilíbrio (break-even point)?","a":"Der Punkt, an dem Erlöse und Kosten gleich hoch sind — ab hier erwirtschaftet ein Produkt/Projekt Gewinn.","aPt":"O ponto em que as receitas e os custos são iguais — a partir daqui, um produto/projeto gera lucro.","options":[{"text":"Der Punkt, an dem die Anschaffungskosten einer Investition vollständig zurückgeflossen sind.","textPt":"O ponto em que os custos de aquisição de um investimento foram totalmente recuperados.","correct":false},{"text":"Der Punkt, an dem der Kapitalwert einer Investition null beträgt.","textPt":"O ponto em que o valor atual líquido de um investimento é zero.","correct":false},{"text":"Der Punkt, an dem Erlöse und Kosten gleich hoch sind — ab hier erwirtschaftet ein Produkt/Projekt Gewinn.","textPt":"O ponto em que as receitas e os custos são iguais — a partir daqui, um produto/projeto gera lucro.","correct":true},{"text":"Der Punkt, an dem die Fixkosten eines Unternehmens auf null sinken.","textPt":"O ponto em que os custos fixos de uma empresa descem a zero.","correct":false}]},
{"cat":"plan","sub":"wirtschaftlichkeit","q":"Was umfasst eine Kosten-Nutzen-Analyse?","qPt":"O que abrange uma análise custo-benefício?","a":"Der Vergleich der voraussichtlichen Kosten einer Maßnahme (z. B. Softwareeinführung) mit ihrem erwarteten Nutzen, um eine Entscheidungsgrundlage zu schaffen.","aPt":"A comparação entre os custos previstos de uma medida (por exemplo, a introdução de um software) e o benefício esperado, de modo a criar uma base para a decisão.","options":[{"text":"Die ausschließliche Berechnung der Anschaffungskosten einer Maßnahme ohne Berücksichtigung ihres Nutzens.","textPt":"O cálculo exclusivo dos custos de aquisição de uma medida, sem considerar o seu benefício.","correct":false},{"text":"Die Bewertung mehrerer Alternativen anhand gewichteter, nicht-monetärer Kriterien ohne Kostenbetrachtung.","textPt":"A avaliação de várias alternativas com base em critérios ponderados e não monetários, sem considerar os custos.","correct":false},{"text":"Die Berechnung des Zeitpunkts, an dem sich eine Maßnahme finanziell amortisiert hat.","textPt":"O cálculo do momento em que uma medida se amortiza financeiramente.","correct":false},{"text":"Der Vergleich der voraussichtlichen Kosten einer Maßnahme mit ihrem erwarteten Nutzen, um eine Entscheidungsgrundlage zu schaffen.","textPt":"A comparação dos custos previstos de uma medida com o seu benefício esperado, para criar uma base de decisão.","correct":true}]},
{"cat":"plan","sub":"pm","q":"Was ist eine Netzplantechnik-Vorwärtsterminierung?","qPt":"O que é o escalonamento para a frente (Vorwärtsterminierung) na técnica de planeamento em rede?","a":"Die Berechnung der frühestmöglichen Anfangs- und Endzeitpunkte aller Vorgänge eines Projekts, ausgehend vom Projektstart.","aPt":"O cálculo dos momentos de início e fim mais precoces possíveis de todas as atividades de um projeto, partindo do início do projeto.","options":[{"text":"Berechnung der spätestmöglichen Anfangs- und Endzeitpunkte aller Vorgänge, ausgehend vom Projektende.","textPt":"Cálculo dos pontos de início e fim mais tardios possíveis de todas as atividades, partindo do fim do projeto.","correct":false},{"text":"Berechnung der frühestmöglichen Anfangs- und Endzeitpunkte aller Vorgänge, ausgehend vom Projektstart.","textPt":"Cálculo dos pontos de início e fim mais precoces possíveis de todas as atividades, partindo do início do projeto.","correct":true},{"text":"Die Ermittlung des längsten Weges durch den Netzplan, der die minimale Projektdauer festlegt.","textPt":"A determinação do caminho mais longo na rede do projeto, que define a duração mínima do projeto.","correct":false},{"text":"Die Berechnung der Zeitspanne, um die sich ein Vorgang verschieben lässt, ohne den Endtermin zu gefährden.","textPt":"O cálculo da margem de tempo em que uma atividade pode ser deslocada sem pôr em risco o prazo final.","correct":false}]},
