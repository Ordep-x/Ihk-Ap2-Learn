{"cat":"algo","sub":"praxis","q":"Was ist eine Pull Request (bzw. Merge Request)?","qPt":"O que é um Pull Request (ou Merge Request)?","a":"Eine Anfrage, Änderungen aus einem Branch in einen anderen (z. B. den Hauptzweig) zu übernehmen, meist verbunden mit Code-Review durch andere Teammitglieder vor der Zusammenführung.","aPt":"Um pedido para integrar as alterações de um branch noutro (por exemplo, o ramo principal), normalmente acompanhado de uma revisão de código (code review) por outros membros da equipa antes da integração.","options":[{"text":"Ein Befehl, der automatisch alle Änderungen aus dem Remote-Repository ohne Review übernimmt.","textPt":"Um comando que integra automaticamente todas as alterações do repositório remoto sem revisão.","correct":false},{"text":"Eine Anfrage, einen Branch dauerhaft zu löschen, nachdem er nicht mehr benötigt wird.","textPt":"Um pedido para apagar permanentemente um branch depois de já não ser necessário.","correct":false},{"text":"Ein lokaler Vorgang, der Änderungen aus dem Staging-Bereich in das lokale Repository übernimmt.","textPt":"Uma operação local que integra alterações da staging area no repositório local.","correct":false},{"text":"Eine Anfrage, Änderungen aus einem Branch in einen anderen (z. B. den Hauptzweig) zu übernehmen, meist verbunden mit Code-Review durch andere Teammitglieder vor der Zusammenführung.","textPt":"Um pedido para integrar alterações de um branch noutro (p. ex. o ramo principal), geralmente acompanhado de code review por outros membros da equipa antes da integração.","correct":true}]},
{"cat":"algo","sub":"praxis","q":"Was ist der Unterschied zwischen Kompilierung und Interpretation?","qPt":"Qual é a diferença entre compilação e interpretação?","a":"Bei der Kompilierung wird der Quellcode vor der Ausführung vollständig in Maschinencode übersetzt. Bei der Interpretation wird der Code zur Laufzeit Zeile für Zeile gelesen und direkt ausgeführt.","aPt":"Na compilação, o código-fonte é totalmente traduzido para código máquina antes da execução. Na interpretação, o código é lido linha a linha em tempo de execução e executado diretamente.","options":[{"text":"Bei der Kompilierung wird der Quellcode vor der Ausführung vollständig in Maschinencode übersetzt. Bei der Interpretation wird der Code zur Laufzeit Zeile für Zeile gelesen und direkt ausgeführt.","textPt":"Na compilação, o código-fonte é traduzido integralmente para código máquina antes da execução. Na interpretação, o código é lido linha a linha em tempo de execução e executado diretamente.","correct":true},{"text":"Bei der Kompilierung wird der Code zur Laufzeit Zeile für Zeile ausgeführt, bei der Interpretation wird er vorher vollständig übersetzt.","textPt":"Na compilação, o código é executado linha a linha em tempo de execução; na interpretação, é traduzido integralmente antes.","correct":false},{"text":"Beide Verfahren erzeugen ausschließlich Maschinencode, unterscheiden sich nur im Zeitpunkt der Ausführung.","textPt":"Ambos os processos produzem exclusivamente código máquina, diferindo apenas no momento da execução.","correct":false},{"text":"Bei der Interpretation wird der Quellcode einmalig vollständig übersetzt und als ausführbare Datei gespeichert.","textPt":"Na interpretação, o código-fonte é traduzido integralmente uma única vez e guardado como ficheiro executável.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Was ist ein Interface in der objektorientierten Programmierung im Vergleich zu einer Klasse?","qPt":"O que é uma interface na programação orientada a objetos, em comparação com uma classe?","a":"Ein Interface definiert einen Vertrag aus Methodensignaturen, traditionell ohne eigene Implementierung (seit Java 8 sind jedoch default- und static-Methoden mit Implementierung möglich); eine Klasse kann diesen Vertrag durch \"implements\" einhalten und muss alle nicht bereits implementierten Methoden konkret umsetzen.","aPt":"Uma interface define um contrato de assinaturas de métodos, tradicionalmente sem implementação própria (embora, desde o Java 8, sejam possíveis métodos default e static com implementação); uma classe pode cumprir esse contrato através de \"implements\" e tem de implementar concretamente todos os métodos que ainda não estejam implementados.","options":[{"text":"Ein Interface kann wie eine Klasse instanziiert werden und muss immer alle Methoden vollständig implementieren.","textPt":"Um interface pode ser instanciado como uma classe e tem sempre de implementar totalmente todos os métodos.","correct":false},{"text":"Ein Interface definiert einen Vertrag aus Methodensignaturen, traditionell ohne eigene Implementierung (seit Java 8 jedoch default- und static-Methoden mit Implementierung möglich); eine Klasse kann diesen Vertrag durch \"implements\" einhalten und muss alle nicht bereits implementierten Methoden konkret umsetzen.","textPt":"Um interface define um contrato de assinaturas de métodos, tradicionalmente sem implementação própria (desde o Java 8 são possíveis métodos default e static com implementação); uma classe pode cumprir esse contrato através de \"implements\" e tem de implementar concretamente todos os métodos ainda não implementados.","correct":true},{"text":"Eine Klasse definiert nur Methodensignaturen ohne Implementierung, während ein Interface die konkrete Umsetzung bereitstellt.","textPt":"Uma classe define apenas assinaturas de métodos sem implementação, enquanto um interface fornece a implementação concreta.","correct":false},{"text":"Ein Interface darf nur Methoden ohne Rückgabewert enthalten, eine Klasse kann beliebige Methoden definieren.","textPt":"Um interface só pode conter métodos sem valor de retorno, uma classe pode definir métodos arbitrários.","correct":false}]},
{"cat":"algo","sub":"oop","q":"Was versteht man unter \"Clean Code\"?","qPt":"O que se entende por \"Clean Code\"?","a":"Quellcode, der klar strukturiert, verständlich benannt, gut wartbar und möglichst einfach ist — u. a. durch aussagekräftige Bezeichner, kleine Funktionen und Vermeidung unnötiger Komplexität.","aPt":"Código-fonte bem estruturado, com nomes compreensíveis, fácil de manter e o mais simples possível — conseguido, entre outros, através de identificadores claros, funções pequenas e evitando complexidade desnecessária.","options":[{"text":"Quellcode, der möglichst kurz ist, auch wenn dadurch Variablennamen auf einzelne Buchstaben reduziert werden.","textPt":"Código-fonte o mais curto possível, mesmo que isso reduza os nomes das variáveis a letras isoladas.","correct":false},{"text":"Quellcode, der ausschließlich durch ausführliche Kommentare zu jeder einzelnen Zeile verständlich gemacht wird.","textPt":"Código-fonte tornado compreensível exclusivamente através de comentários extensos em cada linha.","correct":false},{"text":"Quellcode, der klar strukturiert, verständlich benannt, gut wartbar und möglichst einfach ist – u. a. durch aussagekräftige Bezeichner, kleine Funktionen und Vermeidung unnötiger Komplexität.","textPt":"Código-fonte claramente estruturado, com nomes compreensíveis, de fácil manutenção e o mais simples possível – entre outros, através de identificadores expressivos, funções pequenas e evitando complexidade desnecessária.","correct":true},{"text":"Quellcode, der durch möglichst viele Design Patterns maximale Flexibilität für zukünftige Anforderungen bietet.","textPt":"Código-fonte que, através do maior número possível de design patterns, oferece flexibilidade máxima para requisitos futuros.","correct":false}]},
{"cat":"algo","sub":"ds","q":"Was ist der Unterschied zwischen einer einfach und einer doppelt verketteten Liste?","qPt":"Qual é a diferença entre uma lista ligada simples e uma lista duplamente ligada?","a":"Bei einer einfach verketteten Liste verweist jeder Knoten nur auf den nächsten Knoten. Bei einer doppelt verketteten Liste verweist jeder Knoten zusätzlich auf den vorherigen Knoten, was Navigation in beide Richtungen ermöglicht.","aPt":"Numa lista ligada simples, cada nó aponta apenas para o nó seguinte. Numa lista duplamente ligada, cada nó aponta também para o nó anterior, o que permite navegar em ambas as direções.","options":[{"text":"Bei einer einfach verketteten Liste ist Navigation in beide Richtungen möglich, bei einer doppelt verketteten Liste nur vorwärts.","textPt":"Numa lista ligada simples é possível navegar em ambas as direções, numa lista duplamente ligada apenas para a frente.","correct":false},{"text":"Bei einer doppelt verketteten Liste ist jeder Knoten doppelt im Speicher abgelegt, um Datenverlust zu vermeiden.","textPt":"Numa lista duplamente ligada, cada nó é guardado duas vezes na memória para evitar perda de dados.","correct":false},{"text":"Eine doppelt verkettete Liste hat immer doppelt so viele Elemente wie eine einfach verkettete Liste.","textPt":"Uma lista duplamente ligada tem sempre o dobro dos elementos de uma lista ligada simples.","correct":false},{"text":"Bei einer einfach verketteten Liste verweist jeder Knoten nur auf den nächsten Knoten. Bei einer doppelt verketteten Liste verweist jeder Knoten zusätzlich auf den vorherigen Knoten, was Navigation in beide Richtungen ermöglicht.","textPt":"Numa lista ligada simples, cada nó aponta apenas para o nó seguinte. Numa lista duplamente ligada, cada nó aponta também para o nó anterior, permitindo navegação em ambas as direções.","correct":true}]},
{"cat":"wiso","sub":"tarif","q":"Wer schließt einen Tarifvertrag ab?","qPt":"Quem celebra uma convenção coletiva de trabalho (Tarifvertrag)?","a":"Ein Tarifvertrag wird zwischen einer Gewerkschaft (Arbeitnehmerseite) und einem einzelnen Arbeitgeber oder einem Arbeitgeberverband (Arbeitgeberseite) geschlossen.","aPt":"Uma convenção coletiva de trabalho é celebrada entre um sindicato (parte dos trabalhadores) e um único empregador ou uma associação de empregadores (parte empregadora).","options":[{"text":"Ein Tarifvertrag wird zwischen dem Betriebsrat und der Geschäftsführung des Unternehmens geschlossen.","textPt":"Um Betriebsrat (conselho de trabalhadores da empresa) e a direção da empresa celebram o Tarifvertrag (acordo coletivo).","correct":false},{"text":"Ein Tarifvertrag wird direkt zwischen dem einzelnen Arbeitnehmer und seinem Arbeitgeber vereinbart.","textPt":"Um Tarifvertrag é acordado diretamente entre o trabalhador individual e o seu empregador.","correct":false},{"text":"Ein Tarifvertrag wird zwischen einer Gewerkschaft und einem Arbeitgeber oder Arbeitgeberverband geschlossen.","textPt":"Um Tarifvertrag é celebrado entre um sindicato (Gewerkschaft) e um empregador ou uma associação patronal (Arbeitgeberverband).","correct":true},{"text":"Ein Tarifvertrag wird vom Staat per Gesetz für die jeweilige Branche festgelegt.","textPt":"O Tarifvertrag é fixado pelo Estado através de lei para o respetivo setor.","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was regelt das Kündigungsschutzgesetz (KSchG) und für wen gilt es?","qPt":"O que regula a Lei de Proteção contra o Despedimento (Kündigungsschutzgesetz, KSchG) e para quem se aplica?","a":"Es schützt Arbeitnehmer vor sozial ungerechtfertigten Kündigungen. Es gilt in Betrieben mit i. d. R. mehr als 10 Beschäftigten, wenn das Arbeitsverhältnis länger als 6 Monate besteht.","aPt":"Protege os trabalhadores contra despedimentos socialmente injustificados. Aplica-se, regra geral, a empresas com mais de 10 trabalhadores, quando a relação de trabalho já dura há mais de 6 meses.","options":[{"text":"Es schützt Arbeitnehmer vor sozial ungerechtfertigten Kündigungen und gilt in Betrieben mit i. d. R. mehr als 10 Beschäftigten nach 6 Monaten Betriebszugehörigkeit.","textPt":"Protege os trabalhadores contra despedimentos socialmente injustificados e aplica-se, regra geral, em empresas com mais de 10 trabalhadores após 6 meses de vínculo laboral.","correct":true},{"text":"Es schützt alle Arbeitnehmer ab dem ersten Arbeitstag vor jeder Art von Kündigung, unabhängig von der Betriebsgröße.","textPt":"Protege todos os trabalhadores desde o primeiro dia de trabalho contra qualquer tipo de despedimento, independentemente da dimensão da empresa.","correct":false},{"text":"Es legt die gesetzlichen Kündigungsfristen für alle Arbeitsverhältnisse fest, unabhängig von der Beschäftigtenzahl.","textPt":"Estabelece os prazos legais de aviso prévio para todas as relações laborais, independentemente do número de trabalhadores.","correct":false},{"text":"Es gilt ausschließlich für Auszubildende und schützt sie vor einer Kündigung während der Probezeit.","textPt":"Aplica-se exclusivamente a aprendizes e protege-os de um despedimento durante o período experimental.","correct":false}]},
{"cat":"wiso","sub":"steuern","q":"Nenne die fünf Zweige der gesetzlichen Sozialversicherung in Deutschland.","qPt":"Indica os cinco ramos do seguro social obrigatório na Alemanha.","a":"Kranken-, Renten-, Arbeitslosen-, Pflege- und Unfallversicherung.","aPt":"Seguro de doença, seguro de pensões (reforma), seguro de desemprego, seguro de cuidados continuados (dependência) e seguro de acidentes.","options":[{"text":"Kranken-, Renten-, Haftpflicht-, Pflege- und Unfallversicherung.","textPt":"Seguro de doença, de reforma, de responsabilidade civil (Haftpflicht), de dependência (Pflege) e de acidentes.","correct":false},{"text":"Kranken-, Renten-, Arbeitslosen-, Pflege- und Lebensversicherung.","textPt":"Seguro de doença, de reforma, de desemprego, de dependência (Pflege) e de vida.","correct":false},{"text":"Kranken-, Unfall-, Arbeitslosen-, Pflege- und Rechtsschutzversicherung.","textPt":"Seguro de doença, de acidentes, de desemprego, de dependência (Pflege) e de proteção jurídica.","correct":false},{"text":"Kranken-, Renten-, Arbeitslosen-, Pflege- und Unfallversicherung.","textPt":"Seguro de doença, de reforma, de desemprego, de dependência (Pflegeversicherung) e de acidentes.","correct":true}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was ist die maximale gesetzliche tägliche Arbeitszeit laut Arbeitszeitgesetz?","qPt":"Qual é a duração máxima legal do trabalho diário segundo a Lei do Tempo de Trabalho (Arbeitszeitgesetz)?","a":"Grundsätzlich 8 Stunden pro Werktag, verlängerbar auf bis zu 10 Stunden, wenn im Durchschnitt von 6 Kalendermonaten bzw. 24 Wochen 8 Stunden pro Werktag nicht überschritten werden.","aPt":"Em princípio, 8 horas por dia útil, podendo ser prolongada até 10 horas, desde que, em média, num período de 6 meses de calendário ou 24 semanas, não sejam excedidas as 8 horas por dia útil.","options":[{"text":"Grundsätzlich 10 Stunden pro Werktag, verlängerbar auf bis zu 12 Stunden bei entsprechendem Ausgleich innerhalb eines Jahres.","textPt":"Em princípio 10 horas por dia útil, prorrogável até 12 horas, com compensação adequada dentro de um ano.","correct":false},{"text":"Grundsätzlich 8 Stunden pro Werktag, verlängerbar auf bis zu 10 Stunden, wenn im Durchschnitt von 6 Monaten 8 Stunden nicht überschritten werden.","textPt":"Em princípio 8 horas por dia útil, prorrogável até 10 horas, desde que a média de 8 horas por dia útil não seja excedida num período de 6 meses.","correct":true},{"text":"Grundsätzlich 8 Stunden pro Werktag, die unter keinen Umständen überschritten werden darf.","textPt":"Em princípio 8 horas por dia útil, que não pode ser excedida em nenhuma circunstância.","correct":false},{"text":"Grundsätzlich 6 Stunden pro Werktag, verlängerbar auf bis zu 8 Stunden bei Zustimmung des Betriebsrats.","textPt":"Em princípio 6 horas por dia útil, prorrogável até 8 horas com o consentimento do Betriebsrat (conselho de trabalhadores).","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Wozu dient das Allgemeine Gleichbehandlungsgesetz (AGG)?","qPt":"Para que serve a Lei Geral de Igualdade de Tratamento (Allgemeines Gleichbehandlungsgesetz – AGG)?","a":"Es soll Benachteiligungen aus Gründen wie Rasse/ethnischer Herkunft, Geschlecht, Religion, Behinderung, Alter oder sexueller Identität verhindern oder beseitigen — u. a. im Arbeitsleben.","aPt":"Destina-se a prevenir ou eliminar discriminações com base em motivos como raça/origem étnica, sexo, religião, deficiência, idade ou identidade sexual — nomeadamente no âmbito laboral.","options":[{"text":"Es garantiert allen Arbeitnehmern ein gleiches Gehalt unabhängig von Qualifikation und Berufserfahrung.","textPt":"Garante a todos os trabalhadores um salário igual, independentemente da qualificação e da experiência profissional.","correct":false},{"text":"Es verpflichtet Unternehmen dazu, bei gleicher Eignung bevorzugt Frauen in Führungspositionen einzustellen.","textPt":"Obriga as empresas a dar preferência a mulheres em cargos de chefia em caso de igual aptidão.","correct":false},{"text":"Es soll Benachteiligungen aus Gründen wie Herkunft, Geschlecht, Religion, Behinderung, Alter oder sexueller Identität verhindern oder beseitigen.","textPt":"Visa prevenir ou eliminar discriminações por motivos como origem, sexo, religião, deficiência, idade ou identidade sexual.","correct":true},{"text":"Es regelt ausschließlich den Schutz von Menschen mit Behinderung am Arbeitsplatz.","textPt":"Regula exclusivamente a proteção de pessoas com deficiência no local de trabalho.","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Nenne zwei zentrale Mitbestimmungsrechte des Betriebsrats.","qPt":"Indique dois direitos centrais de participação na decisão (Mitbestimmung) do Betriebsrat (conselho de empresa).","a":"Z. B. bei der Gestaltung von Arbeitszeit (§87 BetrVG) und bei personellen Einzelmaßnahmen wie Einstellungen, Versetzungen oder Kündigungen — hier hat der Betriebsrat Mitspracherechte nach dem Betriebsverfassungsgesetz.","aPt":"Por exemplo, na definição do horário de trabalho (§87 BetrVG) e em medidas individuais de pessoal, como contratações, transferências ou despedimentos — nestes casos, o Betriebsrat tem direito de participação nas decisões, nos termos da Betriebsverfassungsgesetz (lei da organização das empresas).","options":[{"text":"Mitbestimmung bei der Gestaltung der Arbeitszeit (§87 BetrVG) und bei personellen Einzelmaßnahmen wie Einstellungen oder Kündigungen.","textPt":"Participação na definição do horário de trabalho (§87 BetrVG) e em medidas pessoais individuais como contratações ou despedimentos.","correct":true},{"text":"Mitbestimmung bei der Festlegung der Unternehmensstrategie und bei der Wahl des Geschäftsführers.","textPt":"Participação na definição da estratégia da empresa e na eleição do diretor-geral.","correct":false},{"text":"Mitbestimmung bei der Höhe der tariflichen Löhne und bei der Verteilung des Unternehmensgewinns.","textPt":"Participação na fixação dos salários coletivos e na distribuição dos lucros da empresa.","correct":false},{"text":"Mitbestimmung bei der Standortwahl neuer Produktionsanlagen und bei Investitionsentscheidungen.","textPt":"Participação na escolha da localização de novas instalações de produção e em decisões de investimento.","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was regelt das Jugendarbeitsschutzgesetz (JArbSchG)?","qPt":"O que regula a Jugendarbeitsschutzgesetz (JArbSchG, lei de proteção do trabalho de menores)?","a":"Es schützt Kinder und Jugendliche (unter 18 Jahren) am Arbeitsplatz, z. B. durch Begrenzung der Arbeitszeit, Verbot von Nacht-/Akkordarbeit und Pflicht zu ausreichenden Pausen und Ruhezeiten.","aPt":"Protege crianças e jovens (com menos de 18 anos) no local de trabalho, por exemplo através da limitação do horário de trabalho, da proibição do trabalho noturno/à tarefa e da obrigação de pausas e períodos de descanso suficientes.","options":[{"text":"Es schützt alle Arbeitnehmer unter 25 Jahren durch besondere Kündigungsfristen und zusätzlichen Urlaub.","textPt":"Protege todos os trabalhadores com menos de 25 anos através de prazos de aviso prévio especiais e férias adicionais.","correct":false},{"text":"Es regelt die Mindestvergütung für Auszubildende unabhängig vom Alter.","textPt":"Regula a remuneração mínima dos aprendizes, independentemente da idade.","correct":false},{"text":"Es verbietet jede Beschäftigung von Personen unter 18 Jahren in Unternehmen.","textPt":"Proíbe qualquer emprego de pessoas com menos de 18 anos nas empresas.","correct":false},{"text":"Es schützt Kinder und Jugendliche unter 18 Jahren am Arbeitsplatz, u. a. durch Arbeitszeitgrenzen, Nachtarbeitsverbot und Pausenregelungen.","textPt":"Protege crianças e jovens menores de 18 anos no local de trabalho, entre outros através de limites de horário, proibição de trabalho noturno e regras de pausas.","correct":true}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was zeigt der einfache Wirtschaftskreislauf?","qPt":"O que representa o circuito económico simples?","a":"Den Güter- und Geldfluss zwischen den zwei Polen Haushalte (bieten Produktionsfaktoren an, konsumieren Güter) und Unternehmen (produzieren Güter, zahlen Löhne) — jeweils in entgegengesetzter Richtung.","aPt":"O fluxo de bens e de dinheiro entre os dois polos: as famílias (que oferecem fatores de produção e consomem bens) e as empresas (que produzem bens e pagam salários) — cada fluxo em sentido contrário ao outro.","options":[{"text":"Den Güter- und Geldfluss zwischen Staat und Unternehmen, wobei der Staat Steuern erhebt und Subventionen zahlt.","textPt":"O fluxo de bens e de dinheiro entre o Estado e as empresas, em que o Estado cobra impostos e paga subsídios.","correct":false},{"text":"Den Güter- und Geldfluss zwischen Haushalten (bieten Produktionsfaktoren an, konsumieren Güter) und Unternehmen (produzieren Güter, zahlen Löhne) in entgegengesetzter Richtung.","textPt":"O fluxo de bens e de dinheiro entre as famílias (que oferecem fatores de produção e consomem bens) e as empresas (que produzem bens e pagam salários), em sentidos opostos.","correct":true},{"text":"Den Güter- und Geldfluss zwischen Importeuren und Exporteuren auf dem Weltmarkt.","textPt":"O fluxo de bens e de dinheiro entre importadores e exportadores no mercado mundial.","correct":false},{"text":"Den Güter- und Geldfluss zwischen Banken und Unternehmen bei der Vergabe von Krediten.","textPt":"O fluxo de bens e de dinheiro entre bancos e empresas na concessão de créditos.","correct":false}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was versteht man unter Inflation?","qPt":"O que se entende por inflação?","a":"Einen anhaltenden Anstieg des allgemeinen Preisniveaus, wodurch die Kaufkraft des Geldes sinkt.","aPt":"Um aumento sustentado do nível geral de preços, que faz diminuir o poder de compra do dinheiro.","options":[{"text":"Einen anhaltenden Rückgang des allgemeinen Preisniveaus, wodurch die Kaufkraft des Geldes steigt.","textPt":"Uma queda sustentada do nível geral de preços, que faz aumentar o poder de compra do dinheiro.","correct":false},{"text":"Einen kurzfristigen Anstieg der Zinsen, der von der Zentralbank gezielt herbeigeführt wird.","textPt":"Um aumento de curto prazo das taxas de juro, provocado deliberadamente pelo banco central.","correct":false},{"text":"Einen anhaltenden Anstieg des allgemeinen Preisniveaus, wodurch die Kaufkraft des Geldes sinkt.","textPt":"Uma subida sustentada do nível geral de preços, que faz diminuir o poder de compra do dinheiro.","correct":true},{"text":"Einen dauerhaften Rückgang der Arbeitslosigkeit bei gleichzeitig steigenden Löhnen.","textPt":"Uma redução duradoura do desemprego, acompanhada de uma subida dos salários.","correct":false}]},
{"cat":"wiso","sub":"unternehmen","q":"Was ist der zentrale Unterschied zwischen GmbH und AG bei der Haftung?","qPt":"Qual é a principal diferença entre a GmbH e a AG em termos de responsabilidade?","a":"Bei beiden Rechtsformen haftet grundsätzlich nur das Gesellschaftsvermögen (keine private Haftung der Gesellschafter/Aktionäre). Die GmbH hat Stammkapital (mind. 25.000 €), die AG Grundkapital (mind. 50.000 €), das in Aktien zerlegt ist.","aPt":"Em ambas as formas jurídicas, em princípio só responde o património da sociedade (sem responsabilidade pessoal dos sócios/acionistas). A GmbH (sociedade por quotas) tem capital social mínimo de 25.000 €, enquanto a AG (sociedade anónima) tem capital social mínimo de 50.000 €, dividido em ações.","options":[{"text":"Bei beiden haftet grundsätzlich nur das Gesellschaftsvermögen; die GmbH hat Stammkapital (mind. 25.000 €), die AG Grundkapital (mind. 50.000 €) in Aktien.","textPt":"Em ambas, em princípio só responde o património da sociedade; a GmbH tem capital social mínimo de 25.000 €, a AG tem capital mínimo de 50.000 € dividido em ações.","correct":true},{"text":"Bei der GmbH haften die Gesellschafter unbeschränkt mit ihrem Privatvermögen, bei der AG nur mit ihrer Einlage.","textPt":"Na GmbH, os sócios respondem ilimitadamente com o seu património pessoal; na AG, apenas com a sua participação.","correct":false},{"text":"Bei der AG haften die Aktionäre unbeschränkt, während die GmbH-Gesellschafter überhaupt nicht haften.","textPt":"Na AG, os acionistas respondem ilimitadamente, enquanto os sócios da GmbH não respondem de forma alguma.","correct":false},{"text":"Die GmbH benötigt kein Mindestkapital, die AG hingegen ein Grundkapital von mindestens 100.000 €.","textPt":"A GmbH não exige capital social mínimo, enquanto a AG exige um capital mínimo de 100.000 €.","correct":false}]},
{"cat":"wiso","sub":"unternehmen","q":"Was sind zentrale Aufgaben der IHK (Industrie- und Handelskammer)?","qPt":"Quais são as principais funções da IHK (Câmara de Indústria e Comércio)?","a":"U. a. die Überwachung der Berufsausbildung, Organisation von Prüfungen, Interessenvertretung der Wirtschaft und Beratung von Unternehmen.","aPt":"Entre outras, a supervisão da formação profissional, a organização de exames, a representação dos interesses da economia e o aconselhamento a empresas.","options":[{"text":"U. a. Festlegung der Tariflöhne für die jeweilige Branche und Vertretung der Arbeitnehmer in Tarifverhandlungen.","textPt":"Entre outras, a fixação dos salários coletivos do respetivo setor e a representação dos trabalhadores nas negociações coletivas.","correct":false},{"text":"U. a. die staatliche Kontrolle der Steuerzahlungen von Unternehmen und die Verhängung von Bußgeldern.","textPt":"Entre outras, o controlo estatal do pagamento de impostos das empresas e a aplicação de multas.","correct":false},{"text":"U. a. die Vergabe von staatlichen Fördermitteln und die Festsetzung des Mindestlohns.","textPt":"Entre outras, a atribuição de subsídios estatais e a fixação do salário mínimo.","correct":false},{"text":"U. a. Überwachung der Berufsausbildung, Organisation von Prüfungen, Interessenvertretung der Wirtschaft und Beratung von Unternehmen.","textPt":"Entre outras, a supervisão da formação profissional, a organização de exames, a representação dos interesses da economia e o aconselhamento a empresas.","correct":true}]},
{"cat":"wiso","sub":"ausbildung","q":"Wie lang ist die gesetzliche Probezeit im Berufsausbildungsverhältnis maximal?","qPt":"Qual é a duração máxima legal do período experimental (Probezeit) numa relação de formação profissional?","a":"Mindestens 1 Monat und höchstens 4 Monate (§20 BBiG). Während der Probezeit kann das Ausbildungsverhältnis jederzeit ohne Einhaltung einer Frist gekündigt werden.","aPt":"No mínimo 1 mês e no máximo 4 meses (§20 BBiG). Durante o período experimental, a relação de formação pode ser rescindida em qualquer momento, sem necessidade de respeitar um prazo de aviso prévio.","options":[{"text":"Mindestens 1 Monat und höchstens 6 Monate; danach gilt automatisch das Kündigungsschutzgesetz.","textPt":"No mínimo 1 mês e no máximo 6 meses; depois disso aplica-se automaticamente a Kündigungsschutzgesetz (lei de proteção contra despedimento).","correct":false},{"text":"Mindestens 1 Monat und höchstens 4 Monate (§20 BBiG); während dieser Zeit kann jederzeit fristlos gekündigt werden.","textPt":"No mínimo 1 mês e no máximo 4 meses (§20 BBiG); durante esse período, o contrato pode ser rescindido em qualquer momento sem aviso prévio.","correct":true},{"text":"Mindestens 2 Monate und höchstens 3 Monate; eine Kündigung ist während dieser Zeit grundsätzlich ausgeschlossen.","textPt":"No mínimo 2 meses e no máximo 3 meses; durante esse período, a rescisão é, em princípio, excluída.","correct":false},{"text":"Genau 3 Monate, wobei eine Kündigung nur mit einer Frist von 2 Wochen möglich ist.","textPt":"Exatamente 3 meses, sendo a rescisão possível apenas com um aviso prévio de 2 semanas.","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Welche Angaben muss ein Ausbildungsvertrag mindestens enthalten?","qPt":"Que informações deve conter, no mínimo, um contrato de formação profissional (Ausbildungsvertrag)?","a":"U. a. Ausbildungsberuf und -ziel, Beginn und Dauer, Ausbildungsstätte(n), tägliche Arbeitszeit, Dauer der Probezeit, Vergütungshöhe und -zahlungsweise sowie Urlaubsdauer und Kündigungsvoraussetzungen.","aPt":"Entre outras: a profissão e o objetivo da formação, a data de início e a duração, o(s) local(ais) de formação, o horário diário de trabalho, a duração do período experimental, o valor e a forma de pagamento da remuneração, a duração das férias e as condições de rescisão.","options":[{"text":"U. a. den Namen des künftigen Vorgesetzten, die geplante Abteilung nach der Ausbildung und das Zielgehalt nach Übernahme.","textPt":"Entre outros, o nome do futuro superior hierárquico, o departamento previsto após a formação e o salário-alvo após a contratação definitiva.","correct":false},{"text":"U. a. die genaue Prüfungsnote, die erwartet wird, sowie eine Garantie auf unbefristete Übernahme nach der Ausbildung.","textPt":"Entre outros, a nota exata esperada no exame final, bem como uma garantia de contratação permanente após a formação.","correct":false},{"text":"U. a. Ausbildungsberuf und -ziel, Beginn und Dauer, Probezeit, Vergütungshöhe und -zahlungsweise sowie Urlaubsdauer und Kündigungsvoraussetzungen.","textPt":"Entre outros, a profissão e o objetivo da formação, início e duração, período experimental, valor e forma de pagamento da remuneração, duração das férias e condições de rescisão.","correct":true},{"text":"U. a. die Mitgliedschaft in einer Gewerkschaft sowie die Zustimmung der Eltern bei volljährigen Auszubildenden.","textPt":"Entre outros, a filiação sindical e o consentimento dos pais, mesmo no caso de aprendizes maiores de idade.","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Welche gesetzliche Kündigungsfrist gilt nach der Probezeit für Arbeitnehmer laut BGB (Grundregel)?","qPt":"Qual é o prazo legal de aviso prévio (Kündigungsfrist) aplicável aos trabalhadores após o período experimental, segundo a regra geral do BGB?","a":"Die gesetzliche Grundkündigungsfrist beträgt 4 Wochen zum 15. oder zum Ende eines Kalendermonats (§622 BGB), sofern nicht Tarifvertrag oder Arbeitsvertrag längere Fristen vorsehen.","aPt":"O prazo legal base é de 4 semanas, com efeitos a 15 ou ao final de um mês de calendário (§622 BGB), salvo se a convenção coletiva (Tarifvertrag) ou o contrato de trabalho previrem prazos mais longos.","options":[{"text":"4 Wochen zum 15. oder zum Ende eines Kalendermonats (§622 BGB), sofern nicht Tarif- oder Arbeitsvertrag längere Fristen vorsehen.","textPt":"4 semanas, com efeitos no dia 15 ou no fim de um mês de calendário (§622 BGB), salvo se o acordo coletivo ou o contrato de trabalho previr prazos mais longos.","correct":true},{"text":"2 Wochen zum Monatsende, unabhängig von tarifvertraglichen oder arbeitsvertraglichen Regelungen.","textPt":"2 semanas, com efeitos no fim do mês, independentemente de regras de acordos coletivos ou do contrato de trabalho.","correct":false},{"text":"6 Wochen jeweils zum Quartalsende, einheitlich für alle Arbeitsverhältnisse in Deutschland.","textPt":"6 semanas, sempre no fim do trimestre, de forma uniforme para todas as relações laborais na Alemanha.","correct":false},{"text":"1 Monat zum 1. oder 15. eines Monats, der sich mit der Betriebszugehörigkeit nicht verändert.","textPt":"1 mês, com efeitos no dia 1 ou 15 de um mês, que não se altera com o tempo de vínculo à empresa.","correct":false}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was regelt Angebot und Nachfrage auf einem freien Markt?","qPt":"O que regula a oferta e a procura num mercado livre?","a":"Der Marktpreis (Gleichgewichtspreis) bildet sich dort, wo die angebotene Menge der nachgefragten Menge entspricht. Steigt die Nachfrage bei gleichem Angebot, steigt tendenziell der Preis — und umgekehrt.","aPt":"O preço de mercado (preço de equilíbrio) forma-se no ponto em que a quantidade oferecida corresponde à quantidade procurada. Se a procura aumentar mantendo-se a oferta, o preço tende a subir — e vice-versa.","options":[{"text":"Der Marktpreis wird vom Staat so festgelegt, dass Angebot und Nachfrage dauerhaft im Gleichgewicht bleiben.","textPt":"O preço de mercado é fixado pelo Estado de modo a manter permanentemente o equilíbrio entre oferta e procura.","correct":false},{"text":"Der Marktpreis sinkt immer, wenn die Nachfrage steigt, da Unternehmen dann größere Mengen günstiger anbieten können.","textPt":"O preço de mercado desce sempre que a procura aumenta, porque as empresas conseguem então oferecer quantidades maiores a preços mais baixos.","correct":false},{"text":"Der Marktpreis bleibt unabhängig von Angebot und Nachfrage konstant, solange keine staatlichen Eingriffe erfolgen.","textPt":"O preço de mercado mantém-se constante independentemente da oferta e da procura, desde que não haja intervenção do Estado.","correct":false},{"text":"Der Marktpreis bildet sich dort, wo angebotene und nachgefragte Menge übereinstimmen; steigt die Nachfrage bei gleichem Angebot, steigt tendenziell der Preis.","textPt":"O preço de mercado forma-se no ponto em que a quantidade oferecida corresponde à quantidade procurada; se a procura aumentar com a mesma oferta, o preço tende a subir.","correct":true}]},
{"cat":"wiso","sub":"tarif","q":"Was ist der Unterschied zwischen Betriebsrat und Personalrat?","qPt":"Qual é a diferença entre o Betriebsrat e o Personalrat?","a":"Der Betriebsrat vertritt Arbeitnehmerinteressen in privatwirtschaftlichen Betrieben (Grundlage: Betriebsverfassungsgesetz). Der Personalrat übernimmt diese Funktion im öffentlichen Dienst (Grundlage: Personalvertretungsgesetze).","aPt":"O Betriebsrat (conselho de empresa) representa os interesses dos trabalhadores em empresas do setor privado (com base na Betriebsverfassungsgesetz). O Personalrat (conselho de pessoal) desempenha essa função na função pública (com base nas leis de representação de pessoal, Personalvertretungsgesetze).","options":[{"text":"Der Betriebsrat vertritt nur leitende Angestellte, der Personalrat vertritt alle übrigen Arbeitnehmer eines Betriebs.","textPt":"O Betriebsrat representa apenas os quadros dirigentes, o Personalrat representa todos os restantes trabalhadores de uma empresa.","correct":false},{"text":"Der Betriebsrat vertritt Arbeitnehmer in privatwirtschaftlichen Betrieben (BetrVG), der Personalrat übernimmt diese Funktion im öffentlichen Dienst (Personalvertretungsgesetze).","textPt":"O Betriebsrat representa os trabalhadores em empresas do setor privado (BetrVG), enquanto o Personalrat desempenha essa função no serviço público (leis de representação do pessoal).","correct":true},{"text":"Der Betriebsrat ist für Großunternehmen zuständig, der Personalrat ausschließlich für kleine und mittlere Unternehmen.","textPt":"O Betriebsrat é responsável por grandes empresas, o Personalrat exclusivamente por pequenas e médias empresas.","correct":false},{"text":"Der Betriebsrat wird vom Arbeitgeber eingesetzt, der Personalrat hingegen von den Gewerkschaften entsandt.","textPt":"O Betriebsrat é nomeado pelo empregador, enquanto o Personalrat é indicado pelos sindicatos.","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was ist der Unterschied zwischen einer ordentlichen und einer außerordentlichen Kündigung?","qPt":"Qual é a diferença entre um despedimento ordinário (ordentliche Kündigung) e um despedimento extraordinário (außerordentliche Kündigung)?","a":"Die ordentliche Kündigung erfolgt unter Einhaltung der gesetzlichen/vertraglichen Kündigungsfrist. Die außerordentliche (fristlose) Kündigung beendet das Arbeitsverhältnis sofort, erfordert aber einen wichtigen Grund (§626 BGB).","aPt":"O despedimento ordinário é feito respeitando o prazo de aviso prévio legal ou contratual. O despedimento extraordinário (sem aviso prévio) põe fim à relação de trabalho de forma imediata, mas exige um motivo grave (§626 BGB).","options":[{"text":"Die ordentliche Kündigung erfolgt fristlos, die außerordentliche Kündigung erfordert die Einhaltung der gesetzlichen Kündigungsfrist.","textPt":"A rescisão ordinária ocorre sem aviso prévio, a rescisão extraordinária exige o cumprimento do prazo legal de aviso prévio.","correct":false},{"text":"Die ordentliche Kündigung darf nur vom Arbeitnehmer ausgesprochen werden, die außerordentliche Kündigung nur vom Arbeitgeber.","textPt":"A rescisão ordinária só pode ser feita pelo trabalhador, a rescisão extraordinária apenas pelo empregador.","correct":false},{"text":"Die ordentliche Kündigung erfolgt unter Einhaltung der Kündigungsfrist, die außerordentliche (fristlose) Kündigung beendet das Arbeitsverhältnis sofort und erfordert einen wichtigen Grund (§626 BGB).","textPt":"A rescisão ordinária respeita o prazo de aviso prévio, enquanto a rescisão extraordinária (sem aviso prévio) termina a relação laboral de imediato e exige um motivo grave (§626 BGB).","correct":true},{"text":"Die ordentliche Kündigung muss gerichtlich bestätigt werden, die außerordentliche Kündigung nicht.","textPt":"A rescisão ordinária precisa de confirmação judicial, a rescisão extraordinária não.","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was ist eine Änderungskündigung?","qPt":"O que é uma Änderungskündigung (despedimento com proposta de alteração das condições)?","a":"Eine Kündigung, die mit dem Angebot verbunden ist, das Arbeitsverhältnis zu geänderten Bedingungen fortzusetzen (z. B. anderes Gehalt oder andere Tätigkeit).","aPt":"Um despedimento acompanhado da proposta de continuar a relação de trabalho em condições alteradas (por exemplo, com outro salário ou outra função).","options":[{"text":"Eine Kündigung, die mit dem Angebot verbunden ist, das Arbeitsverhältnis zu geänderten Bedingungen fortzusetzen, z. B. anderes Gehalt oder andere Tätigkeit.","textPt":"Uma rescisão associada à proposta de continuar a relação laboral em condições alteradas, por exemplo um salário ou uma função diferentes.","correct":true},{"text":"Eine Kündigung, die ausschließlich bei Umstrukturierungen des gesamten Unternehmens zulässig ist.","textPt":"Uma rescisão apenas admissível em caso de reestruturação de toda a empresa.","correct":false},{"text":"Eine Kündigung, bei der sich nur die Kündigungsfrist, nicht aber die Arbeitsbedingungen ändern.","textPt":"Uma rescisão em que apenas o prazo de aviso prévio se altera, mas não as condições de trabalho.","correct":false},{"text":"Eine Kündigung, die der Arbeitgeber nachträglich zurücknehmen kann, wenn sich die Auftragslage verbessert.","textPt":"Uma rescisão que o empregador pode retirar posteriormente se a situação de encomendas melhorar.","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Wozu dient eine Abmahnung?","qPt":"Para que serve uma Abmahnung (advertência formal)?","a":"Sie weist den Arbeitnehmer auf ein konkretes Fehlverhalten hin, fordert dessen Unterlassung und kündigt im Wiederholungsfall arbeitsrechtliche Konsequenzen (bis zur Kündigung) an — oft Voraussetzung für eine verhaltensbedingte Kündigung.","aPt":"Alerta o trabalhador para um comportamento incorreto concreto, exige que este cesse e anuncia consequências a nível laboral (podendo chegar ao despedimento) em caso de repetição — sendo muitas vezes um requisito prévio para um despedimento por motivos comportamentais.","options":[{"text":"Sie beendet das Arbeitsverhältnis sofort und ersetzt in schweren Fällen die fristlose Kündigung.","textPt":"Termina de imediato a relação laboral e substitui, em casos graves, a rescisão sem aviso prévio.","correct":false},{"text":"Sie dient ausschließlich der Kürzung des Gehalts als Sanktion für ein Fehlverhalten.","textPt":"Serve exclusivamente para reduzir o salário como sanção por um comportamento incorreto.","correct":false},{"text":"Sie ist eine formlose mündliche Verwarnung, die keine rechtlichen Konsequenzen für weiteres Verhalten hat.","textPt":"É uma advertência verbal informal, sem quaisquer consequências jurídicas para o comportamento futuro.","correct":false},{"text":"Sie weist auf ein konkretes Fehlverhalten hin, fordert dessen Unterlassung und kündigt im Wiederholungsfall arbeitsrechtliche Konsequenzen an — oft Voraussetzung für eine verhaltensbedingte Kündigung.","textPt":"Chama a atenção para um comportamento incorreto concreto, exige a sua cessação e anuncia consequências laborais em caso de repetição — frequentemente condição para um despedimento por comportamento.","correct":true}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was ist ein qualifiziertes Arbeitszeugnis?","qPt":"O que é um qualifiziertes Arbeitszeugnis (certificado de trabalho qualificado)?","a":"Ein Zeugnis, das neben Art und Dauer der Tätigkeit auch Leistung und Verhalten des Arbeitnehmers bewertet — im Gegensatz zum einfachen Zeugnis, das nur Tätigkeit und Dauer nennt.","aPt":"Um certificado que, além do tipo e da duração da atividade, avalia também o desempenho e o comportamento do trabalhador — ao contrário do certificado simples, que indica apenas a atividade e a duração.","options":[{"text":"Ein Zeugnis, das nur die Dauer der Beschäftigung, aber keine inhaltlichen Angaben zur Tätigkeit enthält.","textPt":"Um certificado que indica apenas a duração do vínculo, sem quaisquer informações sobre o conteúdo da atividade.","correct":false},{"text":"Ein Zeugnis, das neben Art und Dauer der Tätigkeit auch Leistung und Verhalten des Arbeitnehmers bewertet — im Gegensatz zum einfachen Zeugnis.","textPt":"Um certificado que, além do tipo e da duração da atividade, avalia também o desempenho e o comportamento do trabalhador — em contraste com o certificado simples.","correct":true},{"text":"Ein Zeugnis, das ausschließlich von der IHK ausgestellt wird und die Abschlussprüfung bestätigt.","textPt":"Um certificado emitido exclusivamente pela IHK (Câmara de Comércio e Indústria) que confirma o exame final.","correct":false},{"text":"Ein Zeugnis, das der Arbeitgeber nur auf richterliche Anordnung ausstellen muss.","textPt":"Um certificado que o empregador só é obrigado a emitir por ordem judicial.","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was regelt das Mutterschutzgesetz?","qPt":"O que regula a Mutterschutzgesetz (lei de proteção da maternidade)?","a":"Es schützt schwangere und stillende Arbeitnehmerinnen, u. a. durch Beschäftigungsverbote, Kündigungsschutz und besondere Arbeitszeitregelungen.","aPt":"Protege as trabalhadoras grávidas e lactantes, entre outros aspetos através de proibições de trabalho em determinadas situações, proteção contra o despedimento e regras especiais de horário de trabalho.","options":[{"text":"Es regelt ausschließlich die Höhe des Mutterschaftsgeldes, nicht aber den Kündigungsschutz.","textPt":"Regula exclusivamente o valor do subsídio de maternidade, mas não a proteção contra despedimento.","correct":false},{"text":"Es gewährt schwangeren Arbeitnehmerinnen einen Anspruch auf unbezahlte Freistellung zur Kinderbetreuung nach der Geburt.","textPt":"Concede às trabalhadoras grávidas o direito a uma dispensa não remunerada para cuidar do filho após o nascimento.","correct":false},{"text":"Es schützt schwangere und stillende Arbeitnehmerinnen, u. a. durch Beschäftigungsverbote, Kündigungsschutz und besondere Arbeitszeitregelungen.","textPt":"Protege as trabalhadoras grávidas e lactantes, entre outros através de proibições de trabalho, proteção contra despedimento e regras especiais de horário.","correct":true},{"text":"Es schützt werdende Väter während der Schwangerschaft der Partnerin vor Kündigung und Mehrarbeit.","textPt":"Protege os futuros pais contra despedimento e trabalho extraordinário durante a gravidez da parceira.","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was ist Elternzeit?","qPt":"O que é a Elternzeit (licença parental)?","a":"Ein gesetzlicher Anspruch von Arbeitnehmern auf unbezahlte Freistellung von der Arbeit zur Betreuung eines Kindes, bei gleichzeitigem Kündigungsschutz und Rückkehrrecht auf den Arbeitsplatz.","aPt":"Um direito legal dos trabalhadores a uma dispensa não remunerada do trabalho para cuidar de um filho, com proteção contra o despedimento e direito de regresso ao posto de trabalho durante esse período.","options":[{"text":"Ein gesetzlicher Anspruch auf unbezahlte Freistellung zur Betreuung eines Kindes, bei gleichzeitigem Kündigungsschutz und Rückkehrrecht auf den Arbeitsplatz.","textPt":"Um direito legal a uma dispensa não remunerada para cuidar de um filho, com proteção contra despedimento e direito a regressar ao posto de trabalho.","correct":true},{"text":"Ein gesetzlicher Anspruch auf bezahlten Urlaub von bis zu 3 Jahren in voller Gehaltshöhe zur Kinderbetreuung.","textPt":"Um direito legal a licença remunerada, com salário integral, até 3 anos para cuidar de um filho.","correct":false},{"text":"Ein freiwilliges Angebot des Arbeitgebers, das nur in Großunternehmen mit Betriebsrat gewährt werden muss.","textPt":"Uma oferta voluntária do empregador, obrigatória apenas em grandes empresas com Betriebsrat.","correct":false},{"text":"Ein gesetzlicher Anspruch, der ausschließlich Müttern, nicht aber Vätern zusteht.","textPt":"Um direito legal que cabe exclusivamente às mães, não aos pais.","correct":false}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Wie hoch ist der gesetzliche Mindesturlaub laut Bundesurlaubsgesetz (BUrlG)?","qPt":"Qual é a duração mínima legal de férias segundo a Bundesurlaubsgesetz (BUrlG, lei federal das férias)?","a":"Mindestens 24 Werktage pro Jahr bei einer 6-Tage-Woche (entspricht 20 Arbeitstagen bei einer 5-Tage-Woche).","aPt":"No mínimo 24 dias úteis por ano, numa semana de 6 dias de trabalho (o que corresponde a 20 dias úteis numa semana de 5 dias).","options":[{"text":"Mindestens 30 Werktage pro Jahr bei einer 6-Tage-Woche, entsprechend 25 Arbeitstagen bei einer 5-Tage-Woche.","textPt":"No mínimo 30 dias úteis por ano numa semana de 6 dias, correspondendo a 25 dias úteis numa semana de 5 dias.","correct":false},{"text":"Mindestens 20 Werktage pro Jahr bei einer 6-Tage-Woche, entsprechend 15 Arbeitstagen bei einer 5-Tage-Woche.","textPt":"No mínimo 20 dias úteis por ano numa semana de 6 dias, correspondendo a 15 dias úteis numa semana de 5 dias.","correct":false},{"text":"Mindestens 24 Kalendertage pro Jahr, unabhängig von der Anzahl der Arbeitstage pro Woche.","textPt":"No mínimo 24 dias de calendário por ano, independentemente do número de dias de trabalho por semana.","correct":false},{"text":"Mindestens 24 Werktage pro Jahr bei einer 6-Tage-Woche, entsprechend 20 Arbeitstagen bei einer 5-Tage-Woche.","textPt":"No mínimo 24 dias úteis por ano numa semana de 6 dias, correspondendo a 20 dias úteis numa semana de 5 dias.","correct":true}]},
{"cat":"wiso","sub":"ausbildung","q":"Was regelt das Berufsbildungsgesetz (BBiG) grundsätzlich?","qPt":"O que regula, fundamentalmente, a Berufsbildungsgesetz (BBiG, lei da formação profissional)?","a":"Es bildet die rechtliche Grundlage der beruflichen Ausbildung in Deutschland, u. a. Ausbildungsvertrag, Pflichten von Ausbildenden und Auszubildenden, Prüfungen und Ausbildungsordnungen.","aPt":"Constitui a base legal da formação profissional na Alemanha, regulando, entre outros aspetos, o contrato de formação, as obrigações de formadores e formandos, os exames e os regulamentos de formação (Ausbildungsordnungen).","options":[{"text":"Es regelt ausschließlich die Höhe der Ausbildungsvergütung in allen Branchen einheitlich.","textPt":"Regula exclusivamente, de forma uniforme, o valor da remuneração da formação em todos os setores.","correct":false},{"text":"Es bildet die rechtliche Grundlage der beruflichen Ausbildung in Deutschland, u. a. Ausbildungsvertrag, Pflichten, Prüfungen und Ausbildungsordnungen.","textPt":"Constitui a base jurídica da formação profissional na Alemanha, incluindo o contrato de formação, deveres, exames e regulamentos de formação.","correct":true},{"text":"Es ist eine Betriebsvereinbarung, die nur für einzelne Unternehmen mit eigener Ausbildungswerkstatt gilt.","textPt":"É um acordo de empresa (Betriebsvereinbarung) aplicável apenas a empresas com oficina de formação própria.","correct":false},{"text":"Es regelt die schulische Ausbildung an Berufsschulen und ersetzt die Lehrpläne der Bundesländer.","textPt":"Regula o ensino nas escolas profissionais e substitui os currículos dos estados federados.","correct":false}]},
{"cat":"wiso","sub":"ausbildung","q":"Was ist ein Ausbildungsrahmenplan?","qPt":"O que é um Ausbildungsrahmenplan (plano-quadro de formação)?","a":"Ein Bestandteil der Ausbildungsordnung, der zeitlich und sachlich gegliedert vorgibt, welche Fertigkeiten, Kenntnisse und Fähigkeiten während der Ausbildung vermittelt werden sollen.","aPt":"Uma parte do regulamento de formação (Ausbildungsordnung) que estabelece, organizada por fases temporais e por conteúdos, quais as competências, conhecimentos e capacidades a transmitir durante a formação.","options":[{"text":"Ein individueller Plan, den jeder Ausbildungsbetrieb frei und ohne gesetzliche Vorgaben selbst gestalten kann.","textPt":"Um plano individual que cada empresa formadora pode definir livremente, sem quaisquer diretrizes legais.","correct":false},{"text":"Ein Dokument, das ausschließlich die Prüfungstermine der zuständigen Kammer für das Ausbildungsjahr festlegt.","textPt":"Um documento que fixa exclusivamente as datas de exame da câmara competente para o ano de formação.","correct":false},{"text":"Ein Bestandteil der Ausbildungsordnung, der zeitlich und sachlich gegliedert vorgibt, welche Fertigkeiten, Kenntnisse und Fähigkeiten vermittelt werden sollen.","textPt":"Uma parte do regulamento de formação (Ausbildungsordnung) que define, de forma organizada no tempo e por conteúdo, quais as competências, conhecimentos e capacidades a transmitir.","correct":true},{"text":"Ein vom Betriebsrat erstellter Plan, der die Einsatzzeiten der Auszubildenden in den Abteilungen regelt.","textPt":"Um plano elaborado pelo Betriebsrat que regula os períodos de colocação dos aprendizes nos departamentos.","correct":false}]},
{"cat":"wiso","sub":"ausbildung","q":"Wozu dient das Berichtsheft (Ausbildungsnachweis)?","qPt":"Para que serve o Berichtsheft (caderno de registo da formação)?","a":"Es dokumentiert den Verlauf der Ausbildung, die vermittelten Inhalte und Tätigkeiten und ist Voraussetzung für die Zulassung zur Abschlussprüfung.","aPt":"Documenta o decurso da formação, os conteúdos e as atividades transmitidas, sendo um requisito para a admissão ao exame final.","options":[{"text":"Es dokumentiert den Verlauf der Ausbildung, vermittelte Inhalte und Tätigkeiten und ist Voraussetzung für die Zulassung zur Abschlussprüfung.","textPt":"Documenta o percurso da formação, os conteúdos e as atividades transmitidas, sendo condição para a admissão ao exame final.","correct":true},{"text":"Es dient ausschließlich zur Berechnung der Ausbildungsvergütung durch den Ausbildungsbetrieb.","textPt":"Serve exclusivamente para calcular a remuneração da formação pela empresa formadora.","correct":false},{"text":"Es ist ein freiwilliges Dokument ohne Bedeutung für die Zulassung zur Abschlussprüfung.","textPt":"É um documento facultativo, sem relevância para a admissão ao exame final.","correct":false},{"text":"Es wird vom Betriebsrat geführt, um die Einhaltung der Arbeitszeiten der Auszubildenden zu kontrollieren.","textPt":"É preenchido pelo Betriebsrat para controlar o cumprimento do horário de trabalho dos aprendizes.","correct":false}]},
{"cat":"wiso","sub":"ausbildung","q":"Was ist die Jugend- und Auszubildendenvertretung (JAV)?","qPt":"O que é a Jugend- und Auszubildendenvertretung (JAV, representação dos jovens e dos formandos)?","a":"Eine gewählte Interessenvertretung der jugendlichen Beschäftigten und Auszubildenden im Betrieb, die u. a. deren Belange gegenüber dem Betriebsrat und dem Arbeitgeber vertritt.","aPt":"Um órgão eleito de representação dos interesses dos trabalhadores jovens e dos formandos na empresa, que representa, entre outros aspetos, os seus interesses face ao Betriebsrat e ao empregador.","options":[{"text":"Ein vom Arbeitgeber benannter Ausschuss, der die Einhaltung der Ausbildungsordnung überwacht.","textPt":"Uma comissão nomeada pelo empregador que fiscaliza o cumprimento do regulamento de formação.","correct":false},{"text":"Eine Unterabteilung der Gewerkschaft, die ausschließlich für den Abschluss von Tarifverträgen zuständig ist.","textPt":"Uma subdivisão do sindicato, responsável exclusivamente pela celebração de acordos coletivos.","correct":false},{"text":"Ein gesetzlich vorgeschriebenes Gremium, das in jedem Betrieb unabhängig von der Beschäftigtenzahl bestehen muss.","textPt":"Um órgão legalmente obrigatório que deve existir em toda e qualquer empresa, independentemente do número de trabalhadores.","correct":false},{"text":"Eine gewählte Interessenvertretung der jugendlichen Beschäftigten und Auszubildenden im Betrieb, die deren Belange gegenüber Betriebsrat und Arbeitgeber vertritt.","textPt":"Uma representação de interesses eleita pelos jovens trabalhadores e aprendizes na empresa, que defende os seus interesses perante o Betriebsrat e o empregador.","correct":true}]},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was passiert, wenn ein Auszubildender nach der Abschlussprüfung nicht ausdrücklich übernommen, aber weiterbeschäftigt wird?","qPt":"O que acontece se um formando, após o exame final, não for formalmente contratado, mas continuar a trabalhar na empresa?","a":"Nach §24 BBiG entsteht dann automatisch ein unbefristetes Arbeitsverhältnis, wenn der Auszubildende im Anschluss an die Ausbildung ohne ausdrückliche Vereinbarung weiterbeschäftigt wird.","aPt":"Nos termos do §24 BBiG, forma-se automaticamente uma relação de trabalho sem termo, quando o formando continua a trabalhar após o fim da formação sem que exista um acordo expresso nesse sentido.","options":[{"text":"Das Ausbildungsverhältnis verlängert sich automatisch um weitere 12 Monate zur Festigung der erworbenen Kenntnisse.","textPt":"A relação de formação prolonga-se automaticamente por mais 12 meses para consolidar os conhecimentos adquiridos.","correct":false},{"text":"Nach §24 BBiG entsteht automatisch ein unbefristetes Arbeitsverhältnis, wenn der Auszubildende ohne ausdrückliche Vereinbarung weiterbeschäftigt wird.","textPt":"Segundo o §24 BBiG, forma-se automaticamente uma relação de trabalho sem termo, caso o aprendiz continue a trabalhar sem acordo expresso.","correct":true},{"text":"Es entsteht ein befristetes Arbeitsverhältnis von zunächst 6 Monaten, das anschließend neu verhandelt werden muss.","textPt":"Forma-se uma relação de trabalho a termo de inicialmente 6 meses, que depois tem de ser renegociada.","correct":false},{"text":"Die Weiterbeschäftigung ist unwirksam, solange kein schriftlicher Arbeitsvertrag unterschrieben wurde.","textPt":"A continuação do trabalho é inválida enquanto não for assinado um contrato de trabalho escrito.","correct":false}]},
{"cat":"wiso","sub":"tarif","q":"Was versteht man unter Tarifautonomie?","qPt":"O que se entende por Tarifautonomie (autonomia da negociação coletiva)?","a":"Das verfassungsrechtlich geschützte Recht der Tarifparteien (Gewerkschaften und Arbeitgeber(-verbände)), Löhne und Arbeitsbedingungen eigenständig und ohne staatliche Einmischung auszuhandeln.","aPt":"O direito, protegido constitucionalmente, das partes da negociação coletiva (sindicatos e empregadores/associações de empregadores) de negociarem salários e condições de trabalho de forma autónoma e sem interferência do Estado.","options":[{"text":"Das Recht des Staates, im Streitfall zwischen Gewerkschaften und Arbeitgebern verbindliche Löhne festzusetzen.","textPt":"O direito do Estado de fixar salários vinculativos em caso de litígio entre sindicatos e empregadores.","correct":false},{"text":"Das Recht jedes einzelnen Arbeitnehmers, individuell mit seinem Arbeitgeber über den Tariflohn zu verhandeln.","textPt":"O direito de cada trabalhador individual negociar diretamente com o seu empregador o salário coletivo.","correct":false},{"text":"Das verfassungsrechtlich geschützte Recht der Tarifparteien, Löhne und Arbeitsbedingungen eigenständig und ohne staatliche Einmischung auszuhandeln.","textPt":"O direito, constitucionalmente protegido, das partes de um Tarifvertrag (sindicatos e associações patronais) negociarem salários e condições de trabalho de forma autónoma e sem interferência estatal.","correct":true},{"text":"Die Pflicht der Arbeitgeberverbände, sich bei Lohnverhandlungen an Vorgaben der Bundesregierung zu halten.","textPt":"A obrigação das associações patronais de seguirem diretrizes do governo federal nas negociações salariais.","correct":false}]},
{"cat":"wiso","sub":"tarif","q":"Was ist der Unterschied zwischen Flächentarifvertrag und Firmentarifvertrag (Haustarifvertrag)?","qPt":"Qual é a diferença entre um Flächentarifvertrag (convenção coletiva setorial/regional) e um Firmentarifvertrag/Haustarifvertrag (convenção coletiva de empresa)?","a":"Ein Flächentarifvertrag gilt für eine ganze Branche/Region und wird zwischen Gewerkschaft und Arbeitgeberverband geschlossen. Ein Firmentarifvertrag gilt nur für ein einzelnes Unternehmen und wird direkt zwischen Gewerkschaft und diesem Arbeitgeber vereinbart.","aPt":"Um Flächentarifvertrag aplica-se a todo um setor ou região e é celebrado entre o sindicato e a associação de empregadores. Um Firmentarifvertrag aplica-se apenas a uma única empresa e é acordado diretamente entre o sindicato e esse empregador.","options":[{"text":"Ein Flächentarifvertrag gilt für eine Branche/Region und wird zwischen Gewerkschaft und Arbeitgeberverband geschlossen; ein Firmentarifvertrag gilt nur für ein Unternehmen.","textPt":"Um Flächentarifvertrag (acordo coletivo setorial) aplica-se a um setor ou região e é celebrado entre o sindicato e a associação patronal; um Firmentarifvertrag (acordo coletivo de empresa) aplica-se apenas a uma empresa.","correct":true},{"text":"Ein Flächentarifvertrag gilt nur für ein einzelnes Unternehmen, ein Firmentarifvertrag für eine ganze Branche.","textPt":"Um Flächentarifvertrag aplica-se apenas a uma única empresa, um Firmentarifvertrag a todo um setor.","correct":false},{"text":"Ein Flächentarifvertrag wird vom Betriebsrat ausgehandelt, ein Firmentarifvertrag direkt von der Gewerkschaft mit dem Staat.","textPt":"Um Flächentarifvertrag é negociado pelo Betriebsrat, um Firmentarifvertrag diretamente entre o sindicato e o Estado.","correct":false},{"text":"Beide Tarifvertragsarten gelten ausschließlich innerhalb eines einzelnen Bundeslandes.","textPt":"Ambos os tipos de acordo coletivo aplicam-se exclusivamente dentro de um único estado federado.","correct":false}]},
{"cat":"wiso","sub":"tarif","q":"Was bedeutet Tarifbindung?","qPt":"O que significa Tarifbindung (vinculação a uma convenção coletiva)?","a":"Ein Arbeitsverhältnis unterliegt einem Tarifvertrag, wenn beide Parteien (oder der Arbeitgeber durch Verbandsmitgliedschaft) tarifgebunden sind oder der Tarifvertrag durch Allgemeinverbindlicherklärung gilt.","aPt":"Uma relação de trabalho está sujeita a uma convenção coletiva quando ambas as partes (ou o empregador, através da sua adesão a uma associação patronal) estão vinculadas a essa convenção, ou quando a convenção é declarada de aplicação geral obrigatória (Allgemeinverbindlicherklärung).","options":[{"text":"Ein Arbeitsverhältnis unterliegt einem Tarifvertrag immer dann, wenn der Betrieb mehr als 10 Beschäftigte hat.","textPt":"Uma relação laboral está sempre sujeita a um Tarifvertrag quando a empresa tem mais de 10 trabalhadores.","correct":false},{"text":"Ein Arbeitsverhältnis unterliegt einem Tarifvertrag nur, wenn dies ausdrücklich im Arbeitsvertrag ausgeschlossen wird.","textPt":"Uma relação laboral só está sujeita a um Tarifvertrag se tal for expressamente excluído no contrato de trabalho.","correct":false},{"text":"Ein Arbeitsverhältnis unterliegt automatisch jedem Tarifvertrag der jeweiligen Branche, unabhängig von einer Mitgliedschaft.","textPt":"Uma relação laboral está automaticamente sujeita a qualquer Tarifvertrag do respetivo setor, independentemente de filiação.","correct":false},{"text":"Ein Arbeitsverhältnis unterliegt einem Tarifvertrag, wenn beide Parteien tarifgebunden sind oder der Tarifvertrag durch Allgemeinverbindlicherklärung gilt.","textPt":"Uma relação laboral está sujeita a um Tarifvertrag quando ambas as partes são tarifgebunden (vinculadas pelo acordo coletivo) ou quando o acordo é declarado de aplicação geral (Allgemeinverbindlicherklärung).","correct":true}]},
{"cat":"wiso","sub":"tarif","q":"Was ist das Streikrecht und wo ist es verankert?","qPt":"O que é o direito à greve (Streikrecht) e onde está consagrado?","a":"Das Recht der Gewerkschaften, zur Durchsetzung tariflicher Forderungen zur Arbeitsniederlegung aufzurufen; es leitet sich aus der grundgesetzlich geschützten Koalitionsfreiheit (Art. 9 Abs. 3 GG) ab.","aPt":"É o direito dos sindicatos de convocar a paralisação do trabalho para fazer valer reivindicações coletivas; deriva da liberdade de associação (Koalitionsfreiheit) protegida pela Lei Fundamental alemã (Art. 9, n.º 3, GG).","options":[{"text":"Das Recht jedes einzelnen Arbeitnehmers, individuell die Arbeit zu verweigern, verankert in §626 BGB.","textPt":"O direito de cada trabalhador individual se recusar a trabalhar, consagrado no §626 BGB.","correct":false},{"text":"Das Recht der Gewerkschaften, zur Durchsetzung tariflicher Forderungen zur Arbeitsniederlegung aufzurufen; es leitet sich aus Art. 9 Abs. 3 GG ab.","textPt":"O direito dos sindicatos de convocar a paralisação do trabalho para fazer valer reivindicações coletivas; deriva do Art. 9.º, n.º 3, da Grundgesetz (Lei Fundamental alemã).","correct":true},{"text":"Das Recht der Arbeitgeber, Arbeitnehmer bei Konflikten vorübergehend von der Arbeit auszuschließen, verankert im BetrVG.","textPt":"O direito dos empregadores de excluírem temporariamente trabalhadores do trabalho em caso de conflito, consagrado no BetrVG.","correct":false},{"text":"Das Recht des Betriebsrats, bei Streitigkeiten mit der Geschäftsführung die Produktion zu stoppen, verankert im BBiG.","textPt":"O direito do Betriebsrat de parar a produção em caso de conflito com a direção, consagrado no BBiG.","correct":false}]},
{"cat":"wiso","sub":"tarif","q":"Was ist eine Aussperrung?","qPt":"O que é uma Aussperrung (lockout)?","a":"Eine Arbeitskampfmaßnahme der Arbeitgeberseite, bei der Arbeitnehmer vorübergehend vom Betrieb ausgeschlossen und von der Arbeit sowie der Lohnzahlung freigestellt werden, meist als Reaktion auf einen Streik.","aPt":"Uma medida de conflito laboral por parte do empregador, em que os trabalhadores são temporariamente impedidos de entrar na empresa e dispensados do trabalho e do pagamento do salário, geralmente como reação a uma greve.","options":[{"text":"Eine Arbeitskampfmaßnahme der Gewerkschaft, bei der Arbeitnehmer zur Arbeitsniederlegung aufgerufen werden.","textPt":"Uma medida de luta laboral do sindicato, em que os trabalhadores são chamados a parar o trabalho.","correct":false},{"text":"Eine dauerhafte Kündigung aller am Streik beteiligten Arbeitnehmer durch den Arbeitgeber.","textPt":"Um despedimento definitivo, pelo empregador, de todos os trabalhadores envolvidos na greve.","correct":false},{"text":"Eine Arbeitskampfmaßnahme der Arbeitgeberseite, bei der Arbeitnehmer vorübergehend vom Betrieb ausgeschlossen und von Arbeit und Lohnzahlung freigestellt werden, meist als Reaktion auf einen Streik.","textPt":"Uma medida de luta laboral do lado patronal, em que os trabalhadores são temporariamente excluídos da empresa e dispensados do trabalho e do pagamento do salário, geralmente em reação a uma greve.","correct":true},{"text":"Eine gerichtliche Maßnahme, die einen rechtswidrigen Streik vorübergehend untersagt.","textPt":"Uma medida judicial que proíbe temporariamente uma greve ilegal.","correct":false}]},
{"cat":"wiso","sub":"tarif","q":"Wie wird der Betriebsrat gewählt?","qPt":"Como é eleito o Betriebsrat?","a":"Er wird von den wahlberechtigten Arbeitnehmern des Betriebs in geheimer und unmittelbarer Wahl für eine Amtszeit von in der Regel 4 Jahren gewählt.","aPt":"É eleito pelos trabalhadores da empresa com direito de voto, através de eleição secreta e direta, para um mandato de, regra geral, 4 anos.","options":[{"text":"Von den wahlberechtigten Arbeitnehmern des Betriebs in geheimer und unmittelbarer Wahl für eine Amtszeit von in der Regel 4 Jahren.","textPt":"Pelos trabalhadores com direito de voto da empresa, em votação secreta e direta, para um mandato normalmente de 4 anos.","correct":true},{"text":"Von der Unternehmensleitung aus den Reihen der leitenden Angestellten für eine Amtszeit von 2 Jahren.","textPt":"Pela direção da empresa, escolhido entre os quadros dirigentes, para um mandato de 2 anos.","correct":false},{"text":"Von den Gewerkschaften benannt, ohne dass eine Wahl durch die Belegschaft stattfindet.","textPt":"Nomeado pelos sindicatos, sem que haja uma eleição pelos trabalhadores.","correct":false},{"text":"Von den wahlberechtigten Arbeitnehmern in offener Abstimmung für eine unbegrenzte Amtszeit.","textPt":"Pelos trabalhadores com direito de voto, em votação aberta, para um mandato sem limite de tempo.","correct":false}]},
{"cat":"wiso","sub":"tarif","q":"Was sind soziale Angelegenheiten, bei denen der Betriebsrat zwingend mitbestimmen muss?","qPt":"O que são assuntos sociais em que o Betriebsrat tem obrigatoriamente de participar na decisão?","a":"Z. B. Beginn und Ende der täglichen Arbeitszeit, Pausenregelungen, Urlaubsgrundsätze, Überstunden sowie Fragen der betrieblichen Ordnung (§87 BetrVG).","aPt":"Por exemplo, o início e o fim do horário diário de trabalho, as regras de pausas, os princípios gerais de férias, as horas extraordinárias, bem como questões de ordem interna da empresa (§87 BetrVG).","options":[{"text":"Z. B. die Festlegung der Produktpreise und die Auswahl neuer Lieferanten des Unternehmens.","textPt":"Por exemplo, a fixação dos preços dos produtos e a escolha de novos fornecedores da empresa.","correct":false},{"text":"Z. B. die Entscheidung über Investitionen und die Standortwahl neuer Betriebsstätten.","textPt":"Por exemplo, a decisão sobre investimentos e a escolha da localização de novas instalações.","correct":false},{"text":"Z. B. die Festsetzung der tariflichen Löhne und die Verteilung des Jahresüberschusses.","textPt":"Por exemplo, a fixação dos salários coletivos e a distribuição do resultado anual.","correct":false},{"text":"Z. B. Beginn und Ende der täglichen Arbeitszeit, Pausenregelungen, Urlaubsgrundsätze, Überstunden sowie Fragen der betrieblichen Ordnung (§87 BetrVG).","textPt":"Por exemplo, o início e o fim do horário diário de trabalho, as regras de pausas, os princípios de férias, as horas extraordinárias e questões de ordem interna da empresa (§87 BetrVG).","correct":true}]},
{"cat":"wiso","sub":"tarif","q":"Was ist ein Wirtschaftsausschuss?","qPt":"O que é um Wirtschaftsausschuss (comissão económica)?","a":"Ein Gremium in Unternehmen mit in der Regel mehr als 100 Arbeitnehmern, das über wirtschaftliche Angelegenheiten informiert wird und diese mit der Unternehmensleitung berät.","aPt":"Um órgão existente em empresas com, regra geral, mais de 100 trabalhadores, que é informado sobre assuntos económicos e os discute com a direção da empresa.","options":[{"text":"Ein Gremium, das in jedem Unternehmen unabhängig von der Größe über Lohnfragen entscheidet.","textPt":"Um órgão que, em qualquer empresa independentemente da dimensão, decide sobre questões salariais.","correct":false},{"text":"Ein Gremium in Unternehmen mit i. d. R. mehr als 100 Arbeitnehmern, das über wirtschaftliche Angelegenheiten informiert wird und diese mit der Unternehmensleitung berät.","textPt":"Um órgão em empresas com, regra geral, mais de 100 trabalhadores, que é informado sobre assuntos económicos e os discute com a direção da empresa.","correct":true},{"text":"Ein von der IHK eingesetztes externes Prüfungsorgan zur Kontrolle der Unternehmensbilanz.","textPt":"Um órgão externo de fiscalização, nomeado pela IHK, para controlar o balanço da empresa.","correct":false},{"text":"Ein Ausschuss der Gewerkschaft, der die wirtschaftliche Lage ganzer Branchen analysiert.","textPt":"Uma comissão do sindicato que analisa a situação económica de setores inteiros.","correct":false}]},
{"cat":"wiso","sub":"unternehmen","q":"Was ist ein Einzelunternehmen?","qPt":"O que é um Einzelunternehmen (empresa em nome individual)?","a":"Eine Unternehmensform mit nur einem Inhaber, der das Unternehmen allein führt und mit seinem gesamten Privatvermögen unbeschränkt haftet.","aPt":"Uma forma de empresa com um único titular, que a dirige sozinho e responde ilimitadamente com todo o seu património pessoal.","options":[{"text":"Eine Unternehmensform mit nur einem Inhaber, der ausschließlich mit seiner Kapitaleinlage haftet.","textPt":"Uma forma de empresa com um único proprietário, que responde apenas com a sua participação de capital.","correct":false},{"text":"Eine Unternehmensform, die mindestens zwei Gesellschafter voraussetzt, die gemeinsam unbeschränkt haften.","textPt":"Uma forma de empresa que pressupõe pelo menos dois sócios, que respondem conjuntamente de forma ilimitada.","correct":false},{"text":"Eine Unternehmensform mit nur einem Inhaber, der das Unternehmen allein führt und mit seinem gesamten Privatvermögen unbeschränkt haftet.","textPt":"Uma forma de empresa com um único proprietário, que a dirige sozinho e responde de forma ilimitada com todo o seu património pessoal.","correct":true},{"text":"Eine Unternehmensform, die zwingend in das Handelsregister eingetragen sein muss, um gegründet zu werden.","textPt":"Uma forma de empresa que tem obrigatoriamente de ser inscrita no registo comercial para poder ser constituída.","correct":false}]},
{"cat":"wiso","sub":"unternehmen","q":"Was ist eine GbR (Gesellschaft bürgerlichen Rechts)?","qPt":"O que é uma GbR (Gesellschaft bürgerlichen Rechts, sociedade civil)?","a":"Der einfachste Zusammenschluss mehrerer Personen zu einer Personengesellschaft ohne besondere Formvorschriften; alle Gesellschafter haften unbeschränkt und gesamtschuldnerisch, auch mit ihrem Privatvermögen.","aPt":"A forma mais simples de associação de várias pessoas numa sociedade de pessoas, sem exigências formais especiais; todos os sócios respondem de forma ilimitada e solidária, incluindo com o seu património pessoal.","options":[{"text":"Der einfachste Zusammenschluss mehrerer Personen zu einer Personengesellschaft ohne besondere Formvorschriften; alle Gesellschafter haften unbeschränkt und gesamtschuldnerisch.","textPt":"A forma mais simples de associação de várias pessoas numa sociedade de pessoas, sem exigências formais especiais; todos os sócios respondem de forma ilimitada e solidária.","correct":true},{"text":"Eine Kapitalgesellschaft, bei der die Gesellschafter nur mit ihrer Kapitaleinlage haften.","textPt":"Uma sociedade de capitais em que os sócios respondem apenas com a sua participação de capital.","correct":false},{"text":"Eine Unternehmensform, die zwingend ins Handelsregister eingetragen werden muss und mindestens 25.000 € Stammkapital erfordert.","textPt":"Uma forma de empresa que tem obrigatoriamente de ser inscrita no registo comercial e exige um capital social mínimo de 25.000 €.","correct":false},{"text":"Ein Zusammenschluss, bei dem mindestens ein Gesellschafter nur beschränkt mit seiner Einlage haftet.","textPt":"Uma associação em que pelo menos um sócio responde apenas de forma limitada, com a sua participação.","correct":false}]},
{"cat":"wiso","sub":"unternehmen","q":"Was unterscheidet eine OHG von einer KG?","qPt":"O que distingue uma OHG de uma KG?","a":"Bei der OHG (Offene Handelsgesellschaft) haften alle Gesellschafter unbeschränkt. Bei der KG (Kommanditgesellschaft) gibt es mindestens einen unbeschränkt haftenden Komplementär und mindestens einen nur beschränkt (mit seiner Einlage) haftenden Kommanditisten.","aPt":"Na OHG (Offene Handelsgesellschaft, sociedade em nome coletivo) todos os sócios respondem de forma ilimitada. Na KG (Kommanditgesellschaft, sociedade em comandita) existe pelo menos um sócio com responsabilidade ilimitada (Komplementär) e pelo menos um sócio comanditário (Kommanditist), cuja responsabilidade se limita ao valor da sua entrada de capital.","options":[{"text":"Bei der OHG haftet nur ein Gesellschafter, bei der KG haften alle Gesellschafter gleichermaßen unbeschränkt.","textPt":"Na OHG só um sócio responde, na KG todos os sócios respondem igualmente de forma ilimitada.","correct":false},{"text":"Bei der OHG haften alle Gesellschafter nur beschränkt mit ihrer Einlage, bei der KG unbeschränkt mit ihrem Privatvermögen.","textPt":"Na OHG todos os sócios respondem apenas de forma limitada, com a sua participação; na KG respondem de forma ilimitada com o seu património pessoal.","correct":false},{"text":"Die OHG ist eine Kapitalgesellschaft mit Mindestkapital, die KG eine reine Personengesellschaft ohne Haftung der Gesellschafter.","textPt":"A OHG é uma sociedade de capitais com capital mínimo, a KG é uma sociedade de pessoas pura, sem responsabilidade dos sócios.","correct":false},{"text":"Bei der OHG haften alle Gesellschafter unbeschränkt; bei der KG gibt es mindestens einen unbeschränkt haftenden Komplementär und mindestens einen nur beschränkt haftenden Kommanditisten.","textPt":"Na OHG todos os sócios respondem de forma ilimitada; na KG há pelo menos um sócio comanditado (Komplementär) com responsabilidade ilimitada e pelo menos um comanditário (Kommanditist) com responsabilidade limitada à sua participação.","correct":true}]},
{"cat":"wiso","sub":"unternehmen","q":"Was ist eine UG (haftungsbeschränkt)?","qPt":"O que é uma UG (haftungsbeschränkt)?","a":"Eine \"kleine GmbH\", die bereits mit einem Stammkapital ab 1 € gegründet werden kann, bei der die Haftung wie bei der GmbH auf das Gesellschaftsvermögen beschränkt ist, mit Pflicht zur Rücklagenbildung bis zum Erreichen des GmbH-Mindestkapitals.","aPt":"Uma \"pequena GmbH\" que pode ser constituída já a partir de 1 € de capital social, em que a responsabilidade, tal como na GmbH, se limita ao património da sociedade, havendo a obrigação de constituir reservas até se atingir o capital social mínimo exigido para a GmbH.","options":[{"text":"Eine Kapitalgesellschaft, die bereits ab 1 € Stammkapital gegründet werden kann, bei der die Haftung wie bei der GmbH auf das Gesellschaftsvermögen beschränkt ist und Rücklagen gebildet werden müssen.","textPt":"Uma sociedade de capitais (Kapitalgesellschaft) que pode ser constituída já a partir de 1 € de capital social, com responsabilidade limitada ao património da empresa, como na GmbH, e obrigação de constituir reservas.","correct":true},{"text":"Eine Personengesellschaft ohne Mindestkapital, bei der die Gesellschafter wie bei einer GbR persönlich und unbeschränkt für die Schulden des Unternehmens haften.","textPt":"Uma sociedade de pessoas (Personengesellschaft) sem capital mínimo, em que os sócios respondem pessoal e ilimitadamente pelas dívidas da empresa, como numa GbR (sociedade civil).","correct":false},{"text":"Eine Sonderform der GmbH, die mindestens 12.500 € Stammkapital erfordert und nur von mehreren Gesellschaftern gemeinsam gegründet werden kann.","textPt":"Uma forma especial de GmbH que exige no mínimo 12.500 € de capital social e só pode ser constituída por vários sócios em conjunto.","correct":false},{"text":"Eine Vorgesellschaft, die nach spätestens fünf Jahren automatisch in eine Aktiengesellschaft umgewandelt werden muss, sobald sie Gewinne erzielt.","textPt":"Uma sociedade provisória que tem de ser automaticamente convertida numa sociedade anónima (Aktiengesellschaft) no prazo máximo de cinco anos, assim que gerar lucros.","correct":false}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist eine Marktform \"Monopol\"?","qPt":"O que é a forma de mercado \"monopólio\"?","a":"Eine Marktsituation, in der es nur einen einzigen Anbieter für ein Gut oder eine Dienstleistung gibt, der dadurch großen Einfluss auf den Preis hat.","aPt":"Uma situação de mercado em que existe apenas um único fornecedor de um bem ou serviço, o que lhe confere uma grande influência sobre o preço.","options":[{"text":"Eine Marktsituation, in der wenige große Anbieter den Markt beherrschen und sich bei ihren Preisentscheidungen gegenseitig beeinflussen.","textPt":"Uma situação de mercado em que poucos grandes fornecedores dominam o mercado e se influenciam mutuamente nas decisões de preço.","correct":false},{"text":"Eine Marktsituation, in der nur ein einziger Anbieter ein Gut oder eine Dienstleistung anbietet und dadurch großen Einfluss auf den Preis hat.","textPt":"Uma situação de mercado em que existe apenas um único fornecedor de um bem ou serviço, tendo por isso grande influência sobre o preço.","correct":true},{"text":"Eine Marktsituation mit vielen Anbietern und vielen Nachfragern, in der kein einzelner Marktteilnehmer den Preis beeinflussen kann.","textPt":"Uma situação de mercado com muitos fornecedores e muitos compradores, em que nenhum participante consegue influenciar o preço por si só.","correct":false},{"text":"Eine Marktsituation, in der ein einziger Nachfrager mehreren Anbietern gegenübersteht und so die Preise diktieren kann.","textPt":"Uma situação de mercado em que um único comprador enfrenta vários fornecedores e, por isso, consegue impor os preços.","correct":false}]},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist eine Marktform \"Oligopol\"?","qPt":"O que é a forma de mercado \"oligopólio\"?","a":"Eine Marktsituation, in der wenige große Anbieter den Markt dominieren und sich gegenseitig in ihren Entscheidungen (z. B. Preis) beeinflussen.","aPt":"Uma situação de mercado em que poucos grandes fornecedores dominam o mercado e influenciam mutuamente as suas decisões (por exemplo, em relação ao preço).","options":[{"text":"Eine Marktsituation, in der nur ein einziger Anbieter existiert und allein über den Preis des Gutes entscheidet.","textPt":"Uma situação de mercado em que existe apenas um único fornecedor, que decide sozinho o preço do bem.","correct":false},{"text":"Eine Marktsituation mit zahlreichen kleinen Anbietern, von denen keiner den Marktpreis spürbar beeinflussen kann.","textPt":"Uma situação de mercado com numerosos pequenos fornecedores, nenhum dos quais consegue influenciar sensivelmente o preço de mercado.","correct":false},{"text":"Eine Marktsituation, in der wenige große Anbieter den Markt dominieren und sich bei Entscheidungen wie dem Preis gegenseitig beeinflussen.","textPt":"Uma situação de mercado em que poucos grandes fornecedores dominam o mercado e se influenciam mutuamente em decisões como o preço.","correct":true},{"text":"Eine Marktsituation, in der ein einzelner Nachfrager die Preisgestaltung mehrerer konkurrierender Anbieter bestimmt.","textPt":"Uma situação de mercado em que um único comprador determina os preços de vários fornecedores concorrentes.","correct":false}]},
