<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AP2 Lernkartei — Fachinformatiker Anwendungsentwicklung</title>
<script>
// Apply any saved theme choice before first paint, so there's no flash of the
// wrong theme while the rest of the page loads.
(function(){
  try{
    var saved = localStorage.getItem('ap2-lernkartei-theme');
    if(saved === 'light' || saved === 'dark'){
      document.documentElement.setAttribute('data-theme', saved);
    }
  }catch(e){}
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AP2 Lernkartei">
<meta name="theme-color" content="#22314A">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="./icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1ECDC;
    --paper-2:#E9E2CC;
    --card:#FBF8EE;
    --ink:#22314A;
    --ink-soft:#4C5A72;
    --rule:#C9BE9E;
    --stamp-1:#A6402F;   /* Planen */
    --stamp-2:#2C6E62;   /* Algorithmen */
    --stamp-3:#7A5A2E;   /* Wiso */
    --stamp-1-bg:#F4DAD3;
    --stamp-2-bg:#D9EAE5;
    --stamp-3-bg:#EDE1C9;
    --shadow:0 1px 0 rgba(34,49,74,.06);
    --focus:#2C6E62;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#1B1F23;
      --paper-2:#20252A;
      --card:#26292C;
      --ink:#EFE9D8;
      --ink-soft:#B9B2A0;
      --rule:#3B3E3A;
      --stamp-1-bg:#3A2624;
      --stamp-2-bg:#1E322D;
      --stamp-3-bg:#332B1C;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1F23;
    --paper-2:#20252A;
    --card:#26292C;
    --ink:#EFE9D8;
    --ink-soft:#B9B2A0;
    --rule:#3B3E3A;
    --stamp-1-bg:#3A2624;
    --stamp-2-bg:#1E322D;
    --stamp-3-bg:#332B1C;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--paper-2), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Spectral', Georgia, 'Times New Roman', serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 48px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    border-bottom:1px solid var(--rule);
    padding-bottom:14px;
    margin-bottom:20px;
  }
  h1{
    font-size:1.3rem;
    font-weight:700;
    margin:0;
    letter-spacing:.2px;
  }
  h1 small{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:.68rem;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin-top:4px;
    text-transform:none;
  }
  .drawer-no{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }
  .header-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
  }
  .theme-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:.68rem;
    letter-spacing:.02em;
    padding:5px 9px;
    border-radius:3px;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .theme-toggle:hover{border-color:var(--ink-soft); color:var(--ink);}
  .theme-toggle:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .theme-toggle svg{width:13px; height:13px; flex:none;}
  .theme-toggle svg *{stroke:currentColor;}

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
  }
  .chip{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    padding:6px 11px;
    border-radius:3px;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip:hover{border-color:var(--ink-soft);}
  .chip:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .chip[data-active="true"]{
    color:var(--ink);
    border-color:var(--ink);
    background:var(--card);
  }
  .chip .dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    margin-right:6px;
    position:relative;
    top:-1px;
  }

  .subfilters{
    margin-top:-10px;
    margin-bottom:22px;
  }
  .subfilters .chip{
    font-size:.66rem;
    padding:5px 10px;
    opacity:.85;
  }
  .subfilters .chip[data-active="true"]{
    opacity:1;
  }

  .progressbar{
    height:3px;
    background:var(--rule);
    border-radius:2px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .progressbar > div{
    height:100%;
    background:var(--ink);
    width:0%;
    transition:width .25s ease;
  }
  .progress-label{
    font-family:'JetBrains Mono', monospace;
    font-size:.68rem;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    margin-bottom:22px;
  }

  .stage{
    perspective:1400px;
    margin-bottom:20px;
  }
  .card{
    position:relative;
    min-height:280px;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.7,.3,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:2px;
    box-shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 20px -12px rgba(34,49,74,.25);
    padding:26px 24px 22px;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .face::before{
    content:'';
    position:absolute;
    left:0; right:0; top:44px;
    height:1px;
    background:repeating-linear-gradient(to right, var(--rule) 0 6px, transparent 6px 10px);
    opacity:.55;
  }
  .face.back{transform:rotateY(180deg);}

  .tab{
    align-self:flex-start;
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    letter-spacing:.04em;
    padding:4px 9px 4px 8px;
    border-radius:2px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .tab .dot{width:6px;height:6px;border-radius:50%;}

  .facelabel{
    font-family:'JetBrains Mono', monospace;
    font-size:.62rem;
    color:var(--ink-soft);
    letter-spacing:.08em;
    margin-bottom:10px;
  }
  .qtext{
    font-size:1.18rem;
    line-height:1.5;
    font-weight:600;
    flex:1;
  }
  .atext{
    font-size:1.03rem;
    line-height:1.56;
    flex:1;
    font-weight:500;
  }
  .hint{
    margin-top:auto;
    padding-top:14px;
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    color:var(--ink-soft);
    border-top:1px dashed var(--rule);
  }
  .extra:empty{ display:none; }
  .codeblock{
    margin:12px 0 0;
    padding:11px 13px;
    background:var(--paper-2);
    border:1px solid var(--rule);
    border-radius:3px;
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    overflow-x:auto;
    color:var(--ink);
  }
  .diagram{
    margin:12px 0 0;
    padding:10px;
    background:var(--paper-2);
    border:1px solid var(--rule);
    border-radius:3px;
  }
  .diagram svg{
    display:block;
    width:100%;
    height:auto;
  }
  .cardno{
    position:absolute;
    bottom:14px;
    right:18px;
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    color:var(--ink-soft);
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  .navgroup{display:flex; gap:8px;}
  button.ctrl{
    font-family:'JetBrains Mono', monospace;
    font-size:.75rem;
    padding:9px 14px;
    border-radius:3px;
    border:1px solid var(--rule);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  button.ctrl:hover{border-color:var(--ink-soft);}
  button.ctrl:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  button.ctrl:disabled{opacity:.35; cursor:default;}
  button.ctrl.primary{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  .judge{
    display:flex;
    gap:10px;
    margin-bottom:26px;
  }
  .judge button{
    flex:1;
    font-family:'JetBrains Mono', monospace;
    font-size:.75rem;
    padding:11px 10px;
    border-radius:3px;
    cursor:pointer;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink-soft);
    transition:opacity .15s ease;
  }
  .judge button:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .judge .no{color:var(--stamp-1);}
  .judge .yes{color:var(--stamp-2);}
  .judge button:disabled{opacity:.3; cursor:default;}

  footer{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    color:var(--ink-soft);
    margin-top:8px;
  }
  footer button{
    background:none;border:none;
    font-family:inherit;font-size:inherit;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }

  @media (prefers-reduced-motion: reduce){
    .card{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Lernkartei AP2
      <small>Fachinformatiker/-in Anwendungsentwicklung</small>
    </h1>
    <div class="header-right">
      <div class="drawer-no" id="drawerNo">Schublade 01</div>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Design umschalten"></button>
    </div>
  </header>

  <div class="filters" id="filters"></div>
  <div class="filters subfilters" id="subfilters"></div>

  <div class="progressbar"><div id="progressFill"></div></div>
  <div class="progress-label">
    <span id="progressText">Karte 1 von 230</span>
    <span id="knownText">0 gewusst</span>
  </div>

  <div class="stage">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Karte umdrehen">
      <div class="face front">
        <div class="tab" id="tabFront"><span class="dot"></span><span id="tabTextFront"></span></div>
        <div class="facelabel">FRAGE</div>
        <div class="qtext" id="qtext"></div>
        <div class="extra" id="qextra"></div>
        <div class="hint">Tippen oder Leertaste zum Umdrehen</div>
        <div class="cardno" id="cardnoFront"></div>
      </div>
      <div class="face back">
        <div class="tab" id="tabBack"><span class="dot"></span><span id="tabTextBack"></span></div>
        <div class="facelabel">ANTWORT</div>
        <div class="atext" id="atext"></div>
        <div class="extra" id="aextra"></div>
        <div class="cardno" id="cardnoBack"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="navgroup">
      <button class="ctrl" id="prevBtn">&larr; Zurück</button>
      <button class="ctrl" id="flipBtn">Umdrehen</button>
    </div>
    <button class="ctrl primary" id="nextBtn">Weiter &rarr;</button>
  </div>

  <div class="judge">
    <button class="no" id="noBtn">✕ Nochmal</button>
    <button class="yes" id="yesBtn">✓ Gewusst</button>
  </div>

  <footer>
    <button id="shuffleBtn">mischen</button> ·
    <button id="resetBtn">Fortschritt zurücksetzen</button>
  </footer>

</div>

<script>
const CATS = {
  plan:  { label: 'Planen eines Softwareproduktes', short: 'Planen', var: '--stamp-1', bg: '--stamp-1-bg' },
  algo:  { label: 'Entwicklung & Umsetzung von Algorithmen', short: 'Algorithmen', var: '--stamp-2', bg: '--stamp-2-bg' },
  wiso:  { label: 'Wirtschafts- und Sozialkunde', short: 'Wiso', var: '--stamp-3', bg: '--stamp-3-bg' },
};

const SUBLABELS = {
  'uml': 'UML & ERM',
  'scrum': 'Scrum & Kanban',
  'vorgehen': 'Vorgehensmodelle',
  'wirtschaftlichkeit': 'Wirtschaftlichkeitsrechnung',
  'pm': 'Projektmanagement',
  'test': 'Test & Qualität',
  'anforderungen': 'Anforderungen',
  'recht': 'Verträge & Recht',
  'sicherheit': 'IT-Sicherheit & Datenschutz',
  'lizenz': 'Lizenzmodelle',
  'sonstiges-plan': 'Weiteres',
  'sql': 'SQL & Datenbanken',
  'pseudocode': 'Pseudocode & Programmablauf',
  'ds': 'Datenstrukturen',
  'sort': 'Sortieren & Suchen',
  'oop': 'OOP-Grundlagen',
  'pattern': 'Entwurfsmuster & Architektur',
  'netz': 'Netzwerke',
  'rekursion': 'Rekursion & Zahlensysteme',
  'praxis': 'Entwicklungspraxis',
  'sonstiges-algo': 'Weiteres',
  'arbeitsrecht': 'Arbeitsrecht',
  'ausbildung': 'Ausbildung & BBiG',
  'tarif': 'Tarif & Mitbestimmung',
  'unternehmen': 'Unternehmensformen',
  'wirtschaft': 'Wirtschaft & Markt',
  'steuern': 'Steuern & Sozialversicherung',
  'schutz': 'Datenschutz & Arbeitsschutz',
  'sonstiges-wiso': 'Weiteres',
};

const DECK = [
  // ================= Planen eines Softwareproduktes =================
  {cat:'plan', sub:'anforderungen', q:"Was unterscheidet ein Lastenheft von einem Pflichtenheft?", a:"Das Lastenheft beschreibt aus Kundensicht das WAS und WOFÜR (Anforderungen). Das Pflichtenheft beschreibt aus Auftragnehmersicht das WIE (technische Umsetzung) und wird vom Auftragnehmer auf Basis des Lastenhefts erstellt."},
  {cat:'plan', sub:'anforderungen', q:"Was bedeutet die SMART-Regel bei der Zieldefinition?", a:"Ziele sollen Spezifisch, Messbar, Attraktiv/Akzeptiert, Realistisch und Terminiert formuliert sein."},
  {cat:'plan', sub:'scrum', q:"Nenne die drei Verantwortlichkeiten (umgangssprachlich oft noch \"Rollen\" genannt) im Scrum Team gemäß aktuellem Scrum Guide.", a:"Product Owner (verantwortet den Wert der Arbeit und das Product Backlog), Scrum Master (verantwortet die Etablierung von Scrum, coacht das Team und beseitigt Hindernisse) und die Developers (die das Increment erstellen). Seit der Scrum-Guide-Revision 2020 heißen diese drei offiziell \"Verantwortlichkeiten\" statt \"Rollen\", und es gibt kein eigenständig benanntes \"Entwicklungsteam\" mehr — alle bilden gemeinsam das eine Scrum Team."},
  {cat:'plan', sub:'scrum', q:"Was ist ein Sprint in Scrum?", a:"Ein fester, meist 1–4 Wochen langer Zeitraum, in dem das Team ein potenziell auslieferbares Produktinkrement erstellt. Die Länge bleibt während des Projekts konstant."},
  {cat:'plan', sub:'scrum', q:"Wie unterscheiden sich Wasserfallmodell und agile Vorgehensmodelle grundsätzlich?", a:"Das Wasserfallmodell durchläuft Phasen strikt sequenziell und abgeschlossen (Planung, Design, Umsetzung, Test, Betrieb). Agile Modelle wie Scrum arbeiten iterativ-inkrementell mit kurzen Zyklen und laufender Anpassung an Änderungen."},
  {cat:'plan', sub:'uml', q:"Was zeigt ein UML-Anwendungsfalldiagramm (Use-Case-Diagramm)?", a:"Es zeigt Akteure (Nutzer/Systeme) und die Anwendungsfälle (Funktionen), die sie mit dem System ausführen können, sowie Beziehungen wie include und extend."},
  {cat:'plan', sub:'uml', q:"Was ist der Unterschied zwischen Aggregation und Komposition in UML?", a:"Beide sind \"Teil-Ganzes\"-Beziehungen. Bei der Aggregation kann der Teil unabhängig vom Ganzen existieren (offene Raute). Bei der Komposition ist der Teil existenzabhängig vom Ganzen (gefüllte Raute) — wird das Ganze gelöscht, verschwindet auch der Teil."},
  {cat:'plan', sub:'wirtschaftlichkeit', q:"Wie berechnet sich der Return on Investment (ROI)?", a:"ROI = (Gewinn / eingesetztes Kapital) × 100. Er zeigt die prozentuale Rendite einer Investition."},
  {cat:'plan', sub:'wirtschaftlichkeit', q:"Was ermittelt die statische Amortisationsrechnung?", a:"Den Zeitraum, nach dem die Anschaffungskosten einer Investition durch die erzielten Rückflüsse (Einzahlungsüberschüsse) wieder eingespielt sind."},
  {cat:'plan', sub:'wirtschaftlichkeit', q:"Was ist eine Nutzwertanalyse und wofür wird sie eingesetzt?", a:"Ein Verfahren, um mehrere Alternativen (z. B. Software-Angebote) anhand gewichteter Kriterien vergleichbar zu bewerten und eine begründete Entscheidung zu treffen."},
  {cat:'plan', sub:'pm', q:"Wie definiert man Risiko im Projektmanagement (vereinfachte Formel)?", a:"Risiko = Eintrittswahrscheinlichkeit × Schadenshöhe (Tragweite). Darauf aufbauend werden Gegenmaßnahmen priorisiert."},
  {cat:'plan', sub:'pm', q:"Was ist der kritische Pfad in der Netzplantechnik?", a:"Die Abfolge von Vorgängen mit der längsten Gesamtdauer und ohne Zeitpuffer. Verzögert sich ein Vorgang auf diesem Pfad, verzögert sich das gesamte Projekt."},
  {cat:'plan', sub:'scrum', q:"Was ist das Grundprinzip von Kanban?", a:"Visualisierung des Arbeitsflusses auf einem Board mit Spalten (z. B. To do / In Arbeit / Fertig) und Begrenzung der gleichzeitig bearbeiteten Aufgaben (WIP-Limit), um den Durchfluss zu optimieren."},
  {cat:'plan', sub:'scrum', q:"Was bedeutet \"Definition of Done\" in Scrum?", a:"Ein im Team vereinbartes, verbindliches Kriterienset, das erfüllt sein muss, damit ein Product-Backlog-Element als fertiggestellt gilt."},
  {cat:'plan', sub:'test', q:"Was ist ein Pflichtenheft-Bestandteil \"Abnahmekriterien\"?", a:"Konkrete, überprüfbare Kriterien, anhand derer Auftraggeber und Auftragnehmer gemeinsam feststellen, ob das Softwareprodukt vertragsgemäß fertiggestellt wurde."},
  {cat:'plan', sub:'test', q:"Was ist der Unterschied zwischen Verifikation und Validierung?", a:"Verifikation prüft \"Bauen wir das Produkt richtig?\" (Erfüllung der Spezifikation). Validierung prüft \"Bauen wir das richtige Produkt?\" (Erfüllung des tatsächlichen Kundenbedarfs)."},
  {cat:'plan', sub:'anforderungen', q:"Was ist eine funktionale Anforderung?", a:"Eine Anforderung, die beschreibt, WAS ein System tun soll bzw. welche Funktionen es bereitstellen muss (z. B. \"Das System muss Rechnungen erstellen können\")."},
  {cat:'plan', sub:'anforderungen', q:"Was ist eine nichtfunktionale Anforderung? Nenne ein Beispiel.", a:"Eine Anforderung an die Qualität/Rahmenbedingungen des Systems statt an konkrete Funktionen, z. B. Performance, Sicherheit, Benutzerfreundlichkeit oder Skalierbarkeit — etwa \"Die Seite muss in unter 2 Sekunden laden\"."},
  {cat:'plan', sub:'vorgehen', q:"Was ist das V-Modell (XT)?", a:"Ein Vorgehensmodell, das jeder Entwicklungsphase (linker \"V\"-Ast) eine entsprechende Testphase (rechts) gegenüberstellt, z. B. Anforderungsanalyse ↔ Abnahmetest, Grobentwurf ↔ Systemtest, Feinentwurf ↔ Integrationstest, Implementierung ↔ Modultest."},
  {cat:'plan', sub:'vorgehen', q:"Was ist das Spiralmodell nach Boehm?", a:"Ein iteratives, risikogetriebenes Vorgehensmodell, bei dem das Projekt in mehreren Zyklen durchlaufen wird, wobei jeder Zyklus Zielbestimmung, Risikoanalyse, Entwicklung/Test und Planung des nächsten Zyklus umfasst."},
  {cat:'plan', sub:'vorgehen', q:"Was ist Prototyping als Vorgehensmodell?", a:"Es werden frühzeitig funktionsfähige Vorabversionen (Prototypen) des Systems erstellt, um Anforderungen zu klären oder Konzepte zu testen, bevor die endgültige Lösung entwickelt wird."},
  {cat:'plan', sub:'vorgehen', q:"Was ist Extreme Programming (XP)?", a:"Ein agiles Vorgehensmodell mit Praktiken wie Pair Programming, Test-Driven Development, kontinuierlicher Integration und kurzen Release-Zyklen, das auf enge Kundenzusammenarbeit setzt."},
  {cat:'plan', sub:'scrum', q:"Was steht im Product Backlog bei Scrum?", a:"Eine priorisierte, sich ständig weiterentwickelnde Liste aller Anforderungen, Funktionen und Änderungen, die am Produkt vorgenommen werden sollen, gepflegt vom Product Owner."},
  {cat:'plan', sub:'scrum', q:"Was ist ein Sprint Backlog?", a:"Der Sprint Backlog besteht laut aktuellem Scrum Guide aus drei Elementen: dem Sprint-Ziel (Warum), den für den Sprint ausgewählten Product-Backlog-Einträgen (Was) und einem Plan zu deren Umsetzung (Wie). Er wird von den Developers erstellt und gepflegt und im Sprintverlauf laufend aktualisiert."},
  {cat:'plan', sub:'scrum', q:"Was passiert im Daily Scrum?", a:"Ein auf 15 Minuten timeboxtes, tägliches Event der Developers, um den Fortschritt in Richtung Sprint-Ziel zu überprüfen und den Sprint Backlog bei Bedarf anzupassen. Der aktuelle Scrum Guide schreibt dafür kein festes Frage-Schema (z. B. \"gestern/heute/Hindernisse\") mehr vor — das Team kann Struktur und Technik frei wählen, solange der Fokus auf dem Sprint-Ziel erhalten bleibt."},
  {cat:'plan', sub:'scrum', q:"Was ist ein Sprint Review?", a:"Ein Termin am Ende des Sprints, bei dem das Team das fertige Produktinkrement den Stakeholdern präsentiert und Feedback einholt."},
  {cat:'plan', sub:'scrum', q:"Was ist eine Sprint Retrospective?", a:"Ein team-internes Treffen nach dem Sprint Review, in dem reflektiert wird, wie die Zusammenarbeit und der Prozess verbessert werden können."},
  {cat:'plan', sub:'scrum', q:"Was ist ein Burndown-Chart?", a:"Ein Diagramm, das den verbleibenden Arbeitsaufwand (z. B. Story Points) über die Zeit eines Sprints darstellt und so den Fortschritt visualisiert."},
  {cat:'plan', sub:'scrum', q:"Was sind Story Points?", a:"Eine relative Maßeinheit zur Schätzung des Aufwands/der Komplexität einer User Story, unabhängig von absoluter Zeit."},
  {cat:'plan', sub:'scrum', q:"Was ist Planning Poker?", a:"Eine Schätztechnik, bei der Teammitglieder verdeckt Karten mit Aufwandsschätzungen (oft Fibonacci-Zahlen) wählen und diese gleichzeitig aufdecken, um zu einer gemeinsamen Einschätzung zu kommen."},
  {cat:'plan', sub:'scrum', q:"Was ist eine User Story?", a:"Eine kurze, aus Anwendersicht formulierte Beschreibung einer Anforderung, oft im Format \"Als [Rolle] möchte ich [Ziel], damit [Nutzen]\"."},
  {cat:'plan', sub:'scrum', q:"Was bedeutet das WIP-Limit bei Kanban?", a:"Es begrenzt die Anzahl der Aufgaben, die gleichzeitig in einer Spalte/einem Arbeitsschritt bearbeitet werden dürfen, um Engpässe zu vermeiden und den Durchfluss zu verbessern."},
  {cat:'plan', sub:'scrum', q:"Was zeigt ein Cumulative-Flow-Diagram?", a:"Es zeigt über die Zeit, wie viele Arbeitseinheiten sich in welchem Status (z. B. To do, In Arbeit, Fertig) befinden, und macht Engpässe im Arbeitsfluss sichtbar."},
  {cat:'plan', sub:'uml', q:"Was ist der Unterschied zwischen Assoziation und Vererbung in UML-Klassendiagrammen?", a:"Eine Assoziation beschreibt eine Beziehung zwischen zwei eigenständigen Klassen (z. B. \"nutzt\", \"hat\"). Vererbung (Generalisierung) beschreibt eine Ist-ein-Beziehung, bei der eine Klasse Eigenschaften einer Oberklasse übernimmt."},
  {cat:'plan', sub:'uml', q:"Was gibt die Multiplizität in einem UML-Klassendiagramm an?", a:"Sie gibt an, wie viele Objekte der einen Klasse mit wie vielen Objekten der anderen Klasse in Beziehung stehen können (z. B. 1, 0..1, 1..*, 0..*)."},
  {cat:'plan', sub:'uml', q:"Was zeigt ein UML-Sequenzdiagramm?", a:"Es stellt den zeitlichen Ablauf von Nachrichten/Methodenaufrufen zwischen Objekten dar und eignet sich zur Visualisierung dynamischer Abläufe."},
  {cat:'plan', sub:'uml', q:"Was zeigt ein UML-Aktivitätsdiagramm?", a:"Es visualisiert den Ablauf eines Prozesses oder Algorithmus mit Aktivitäten, Entscheidungen, parallelen Abläufen und Start-/Endpunkten — ähnlich einem Flussdiagramm."},
  {cat:'plan', sub:'uml', q:"Was zeigt ein UML-Zustandsdiagramm (State Machine)?", a:"Es zeigt die möglichen Zustände eines Objekts und die Übergänge (Transitionen) zwischen diesen Zuständen, ausgelöst durch Ereignisse."},
  {cat:'plan', sub:'uml', q:"Was ist ein Entity-Relationship-Modell (ERM)?", a:"Ein Modell zur Darstellung von Datenobjekten (Entitäten), ihren Attributen und den Beziehungen zwischen ihnen — Grundlage für den Datenbankentwurf."},
  {cat:'plan', sub:'uml', q:"Was bedeutet Kardinalität in einem ER-Modell?", a:"Sie beschreibt, wie viele Instanzen einer Entität mit wie vielen Instanzen einer anderen Entität in Beziehung stehen können, z. B. 1:1, 1:n, n:m."},
  {cat:'plan', sub:'uml', q:"Wie löst man eine n:m-Beziehung im relationalen Datenmodell auf?", a:"Durch eine zusätzliche Zwischentabelle (Verbindungstabelle), die die Primärschlüssel beider beteiligten Tabellen als Fremdschlüssel enthält."},
  {cat:'plan', sub:'wirtschaftlichkeit', q:"Was ist die Kapitalwertmethode?", a:"Ein dynamisches Investitionsrechnungsverfahren, bei dem alle zukünftigen Ein- und Auszahlungen einer Investition auf den heutigen Zeitpunkt abgezinst und summiert werden; ist der Kapitalwert positiv, gilt die Investition als vorteilhaft."},
  {cat:'plan', sub:'wirtschaftlichkeit', q:"Was ist der Unterschied zwischen statischer und dynamischer Investitionsrechnung?", a:"Statische Verfahren (z. B. Amortisationsrechnung) berücksichtigen keinen Zeitwert des Geldes, dynamische Verfahren (z. B. Kapitalwertmethode) diskontieren zukünftige Zahlungen auf den heutigen Wert."},
  {cat:'plan', sub:'wirtschaftlichkeit', q:"Was ist der Break-even-Point?", a:"Der Punkt, an dem Erlöse und Kosten gleich hoch sind — ab hier erwirtschaftet ein Produkt/Projekt Gewinn."},
  {cat:'plan', sub:'wirtschaftlichkeit', q:"Was umfasst eine Kosten-Nutzen-Analyse?", a:"Der Vergleich der voraussichtlichen Kosten einer Maßnahme (z. B. Softwareeinführung) mit ihrem erwarteten Nutzen, um eine Entscheidungsgrundlage zu schaffen."},
  {cat:'plan', sub:'pm', q:"Was ist eine Netzplantechnik-Vorwärtsterminierung?", a:"Die Berechnung der frühestmöglichen Anfangs- und Endzeitpunkte aller Vorgänge eines Projekts, ausgehend vom Projektstart."},
  {cat:'plan', sub:'pm', q:"Was ist eine Netzplantechnik-Rückwärtsterminierung?", a:"Die Berechnung der spätestmöglichen Anfangs- und Endzeitpunkte aller Vorgänge, ausgehend vom (fixen) Projektende."},
  {cat:'plan', sub:'pm', q:"Was ist ein Puffer (Slack) in der Netzplantechnik?", a:"Die Zeitspanne, um die sich ein Vorgang verschieben kann, ohne den Gesamtendtermin des Projekts zu gefährden."},
  {cat:'plan', sub:'pm', q:"Was zeigt ein Gantt-Diagramm?", a:"Eine Balkendarstellung, die Vorgänge eines Projekts über die Zeitachse zeigt, inklusive Start-/Endzeitpunkten und teilweise Abhängigkeiten."},
  {cat:'plan', sub:'pm', q:"Was ist ein Meilenstein im Projektmanagement?", a:"Ein bedeutsames, terminiertes Ereignis oder Teilergebnis im Projektverlauf ohne eigene Dauer, das den Fortschritt markiert."},
  {cat:'plan', sub:'pm', q:"Nenne die klassischen Phasen eines Softwareprojekts.", a:"Initiierung/Anforderungsanalyse, Planung/Entwurf, Umsetzung/Implementierung, Test/Abnahme und Einführung/Betrieb (inkl. Wartung)."},
  {cat:'plan', sub:'test', q:"Was ist ein Unit-Test?", a:"Ein Test, der eine einzelne, isolierte Programmeinheit (z. B. eine Methode oder Klasse) auf korrektes Verhalten prüft."},
  {cat:'plan', sub:'test', q:"Was ist ein Integrationstest?", a:"Ein Test, der das Zusammenspiel mehrerer bereits einzeln getesteter Module/Komponenten prüft."},
  {cat:'plan', sub:'test', q:"Was ist ein Systemtest?", a:"Ein Test des gesamten, integrierten Systems gegen die Gesamtanforderungen, meist in einer produktionsnahen Umgebung."},
  {cat:'plan', sub:'test', q:"Was ist ein Abnahmetest?", a:"Ein Test, bei dem der Auftraggeber prüft, ob das fertige System die vereinbarten Anforderungen erfüllt und abgenommen werden kann."},
  {cat:'plan', sub:'test', q:"Was ist der Unterschied zwischen Black-Box- und White-Box-Testing?", a:"Beim Black-Box-Test wird nur das Ein-/Ausgabeverhalten geprüft, ohne die interne Struktur zu kennen. Beim White-Box-Test kennt der Tester den internen Aufbau/Code und testet gezielt Pfade und Strukturen."},
  {cat:'plan', sub:'test', q:"Was ist die Äquivalenzklassenmethode beim Testen?", a:"Eingabewerte werden in Klassen eingeteilt, die voraussichtlich gleich behandelt werden; es wird angenommen, dass ein Testfall pro Klasse repräsentativ für die gesamte Klasse ist."},
  {cat:'plan', sub:'test', q:"Was ist die Grenzwertanalyse beim Testen?", a:"Eine Testmethode, die gezielt Werte an den Rändern von Äquivalenzklassen testet (z. B. Minimum, Maximum, direkt darüber/darunter), da dort Fehler besonders häufig auftreten."},
  {cat:'plan', sub:'recht', q:"Was ist der Unterschied zwischen Werkvertrag und Dienstvertrag?", a:"Beim Werkvertrag (§631 BGB) wird ein konkreter Erfolg/ein Ergebnis geschuldet (z. B. eine fertige Software). Beim Dienstvertrag (§611 BGB) wird nur die Tätigkeit/Arbeitsleistung geschuldet, unabhängig vom Erfolg."},
  {cat:'plan', sub:'recht', q:"Was regeln Allgemeine Geschäftsbedingungen (AGB)?", a:"Vorformulierte Vertragsbedingungen, die eine Partei der anderen bei Vertragsschluss stellt, um wiederkehrende Geschäfte einheitlich zu regeln — unterliegen einer gesetzlichen Inhaltskontrolle."},
  {cat:'plan', sub:'recht', q:"Was bedeutet Gewährleistung im Kaufrecht/Werkvertragsrecht?", a:"Die gesetzliche Pflicht des Verkäufers/Werkunternehmers, für Mängel der gelieferten Sache/des Werks einzustehen, z. B. durch Nacherfüllung (Nachbesserung bzw. Nachlieferung), Minderung, Rücktritt oder Schadensersatz."},
  {cat:'plan', sub:'sicherheit', q:"Was sind die drei klassischen Schutzziele der IT-Sicherheit?", a:"Vertraulichkeit (Confidentiality), Integrität (Integrity) und Verfügbarkeit (Availability) — oft als CIA-Triade bezeichnet."},
  {cat:'plan', sub:'sicherheit', q:"Was ist der Unterschied zwischen symmetrischer und asymmetrischer Verschlüsselung?", a:"Bei symmetrischer Verschlüsselung wird derselbe Schlüssel zum Ver- und Entschlüsseln verwendet. Bei asymmetrischer Verschlüsselung gibt es ein Schlüsselpaar aus öffentlichem und privatem Schlüssel."},
  {cat:'plan', sub:'sicherheit', q:"Was ist eine Firewall?", a:"Ein System (Hard- oder Software), das den Datenverkehr zwischen Netzen anhand definierter Regeln überwacht und filtert, um unerwünschten Zugriff zu verhindern."},
  {cat:'plan', sub:'sicherheit', q:"Was ist ein VPN?", a:"Ein Virtual Private Network stellt eine verschlüsselte Verbindung über ein öffentliches Netz her, sodass Daten sicher wie in einem privaten Netzwerk übertragen werden können."},
  {cat:'plan', sub:'sicherheit', q:"Was besagt die DSGVO grundsätzlich?", a:"Die Datenschutz-Grundverordnung regelt EU-weit einheitlich den Umgang mit personenbezogenen Daten und verpflichtet Unternehmen u. a. zu Rechtmäßigkeit, Zweckbindung, Datenminimierung und Transparenz bei der Verarbeitung."},
  {cat:'plan', sub:'sicherheit', q:"Was versteht man unter \"Privacy by Design\"?", a:"Das Prinzip, Datenschutz bereits von Beginn an in die technische Konzeption und Entwicklung von Systemen und Prozessen einzubeziehen, statt ihn nachträglich hinzuzufügen."},
  {cat:'plan', sub:'lizenz', q:"Was ist der Unterschied zwischen Open-Source- und proprietärer Software?", a:"Open-Source-Software stellt ihren Quellcode offen zur Verfügung und erlaubt meist Nutzung, Veränderung und Weitergabe unter bestimmten Lizenzbedingungen. Proprietäre Software ist closed-source, Rechte liegen beim Hersteller, Nutzung ist meist lizenzpflichtig eingeschränkt."},
  {cat:'plan', sub:'lizenz', q:"Was ist der Unterschied zwischen Freeware und Shareware?", a:"Freeware ist kostenlos nutzbar, meist ohne Weitergabe des Quellcodes. Shareware darf zeitlich oder funktional eingeschränkt kostenlos getestet werden, für die Vollversion ist danach eine Zahlung fällig."},
  {cat:'plan', sub:'pm', q:"Was ist eine Stakeholder-Analyse?", a:"Die systematische Identifikation und Bewertung aller Personen/Gruppen, die von einem Projekt betroffen sind oder Einfluss darauf haben, um deren Interessen und Erwartungen zu berücksichtigen."},
  {cat:'plan', sub:'anforderungen', q:"Was ist ein Lastenheft-Bestandteil \"Muss-Kriterium\" vs. \"Kann-Kriterium\"?", a:"Muss-Kriterien sind zwingend zu erfüllende Anforderungen, ohne die die Lösung nicht akzeptiert wird. Kann-Kriterien sind wünschenswerte, aber nicht zwingende Zusatzanforderungen."},
  {cat:'plan', sub:'pm', q:"Was ist eine SWOT-Analyse?", a:"Eine Analysemethode, die Stärken (Strengths), Schwächen (Weaknesses), Chancen (Opportunities) und Risiken (Threats) eines Vorhabens oder Unternehmens systematisch gegenüberstellt."},
  {cat:'plan', sub:'pm', q:"Was ist ein Change-Request im Projektmanagement?", a:"Ein formal gestellter Antrag auf Änderung des Projektumfangs, der Anforderungen, des Zeitplans oder des Budgets nach Projektstart, der bewertet und genehmigt werden muss."},
  {cat:'plan', sub:'pm', q:"Was bedeutet \"Scope Creep\"?", a:"Die schleichende, unkontrollierte Ausweitung des Projektumfangs ohne entsprechende Anpassung von Zeit, Budget oder Ressourcen."},
  {cat:'plan', sub:'test', q:"Was ist der Unterschied zwischen Qualitätssicherung und Qualitätsmanagement?", a:"Qualitätssicherung (QS) umfasst konkrete Maßnahmen zur Prüfung/Sicherstellung der Produktqualität (z. B. Tests). Qualitätsmanagement (QM) ist der übergeordnete, organisatorische Rahmen, der Prozesse, Verantwortlichkeiten und kontinuierliche Verbesserung steuert."},
  {cat:'plan', sub:'test', q:"Was ist der PDCA-Zyklus?", a:"Ein Modell für kontinuierliche Verbesserung mit den Phasen Plan (Planen), Do (Umsetzen), Check (Überprüfen) und Act (Anpassen/Standardisieren)."},
  // ================= Entwicklung & Umsetzung von Algorithmen =================
  {cat:'algo', sub:'ds', q:"Was ist der Unterschied zwischen Stack und Queue?", a:"Ein Stack arbeitet nach dem LIFO-Prinzip (Last In, First Out) — das zuletzt eingefügte Element wird zuerst entnommen. Eine Queue arbeitet nach FIFO (First In, First Out) — das zuerst eingefügte Element wird zuerst entnommen."},
  {cat:'algo', sub:'ds', q:"Was ist eine verkettete Liste (Linked List)?", a:"Eine dynamische Datenstruktur, bei der jedes Element (Knoten) seinen Wert und einen Verweis (Zeiger) auf das nächste Element speichert — im Gegensatz zum Array liegt der Speicher nicht zwingend zusammenhängend vor."},
  {cat:'algo', sub:'sort', q:"Wie funktioniert Bubble Sort grundsätzlich?", a:"Benachbarte Elemente werden wiederholt paarweise verglichen und bei falscher Reihenfolge vertauscht. Nach jedem Durchlauf \"steigt\" das größte verbliebene Element ans Ende — bis das Array sortiert ist."},
  {cat:'algo', sub:'rekursion', q:"Was ist Rekursion?", a:"Eine Funktion, die sich selbst aufruft, um ein Problem in kleinere gleichartige Teilprobleme zu zerlegen. Sie benötigt eine Abbruchbedingung (Basisfall), sonst läuft sie unendlich weiter."},
  {cat:'algo', sub:'sort', q:"Wie funktioniert die binäre Suche und welche Voraussetzung hat sie?", a:"Sie halbiert wiederholt den Suchbereich, indem sie den Mittelwert mit dem Zielwert vergleicht. Voraussetzung: Das Array muss sortiert sein. Laufzeit: O(log n)."},
  {cat:'algo', sub:'oop', q:"Was bedeutet Kapselung (Encapsulation) in der OOP?", a:"Attribute einer Klasse werden vor direktem Zugriff von außen geschützt (meist private) und nur über definierte Methoden (Getter/Setter) zugänglich gemacht — das schützt die Datenintegrität."},
  {cat:'algo', sub:'oop', q:"Was ist Vererbung (Inheritance) in der OOP?", a:"Eine Klasse (Unterklasse) übernimmt Attribute und Methoden einer anderen Klasse (Oberklasse) und kann diese erweitern oder überschreiben — fördert Wiederverwendbarkeit."},
  {cat:'algo', sub:'oop', q:"Was ist Polymorphismus?", a:"Objekte unterschiedlicher Klassen können über dieselbe Methodensignatur angesprochen werden, verhalten sich dabei aber je nach konkreter Klasse unterschiedlich (z. B. durch Methodenüberschreibung)."},
  {cat:'algo', sub:'oop', q:"Was ist der Unterschied zwischen einer abstrakten Klasse und einem Interface?", a:"Eine abstrakte Klasse kann sowohl implementierte als auch abstrakte Methoden sowie Attribute enthalten und wird über einfache Vererbung genutzt. Ein Interface definiert primär Methodensignaturen (Verträge); eine Klasse kann mehrere Interfaces implementieren. Seit Java 8 dürfen Interfaces zusätzlich default- und static-Methoden mit eigener Implementierung enthalten, Instanzattribute sind aber weiterhin nicht möglich (nur öffentliche, statische, finale Konstanten)."},
  {cat:'algo', sub:'sql', q:"Was unterscheidet Primärschlüssel und Fremdschlüssel in einer Datenbank?", a:"Der Primärschlüssel identifiziert einen Datensatz eindeutig innerhalb seiner Tabelle. Der Fremdschlüssel verweist auf den Primärschlüssel einer anderen Tabelle und stellt so die Beziehung zwischen Tabellen her."},
  {cat:'algo', sub:'sql', q:"Was ist der Unterschied zwischen INNER JOIN und LEFT JOIN in SQL?", a:"INNER JOIN liefert nur Datensätze, die in beiden Tabellen eine Übereinstimmung haben. LEFT JOIN liefert zusätzlich alle Datensätze der linken Tabelle, auch wenn es in der rechten keine Übereinstimmung gibt (dann mit NULL-Werten)."},
  {cat:'algo', sub:'sql', q:"Was fordert die erste Normalform (1NF)?", a:"Jedes Attribut enthält nur atomare (unteilbare) Werte, es gibt keine Wiederholungsgruppen und jede Zeile ist über einen Primärschlüssel eindeutig identifizierbar."},
  {cat:'algo', sub:'sql', q:"Was fordert die zweite Normalform (2NF)?", a:"Die Tabelle erfüllt die 1NF, und jedes Nicht-Schlüsselattribut ist voll funktional abhängig vom gesamten Primärschlüssel (keine Abhängigkeit von nur einem Teil eines zusammengesetzten Schlüssels)."},
  {cat:'algo', sub:'sql', q:"Was fordert die dritte Normalform (3NF)?", a:"Die Tabelle erfüllt die 2NF, und es gibt keine transitiven Abhängigkeiten — Nicht-Schlüsselattribute dürfen nicht von anderen Nicht-Schlüsselattributen abhängen, sondern nur vom Primärschlüssel."},
  {cat:'algo', sub:'sort', q:"Was beschreibt die Big-O-Notation?", a:"Sie beschreibt, wie die Laufzeit oder der Speicherbedarf eines Algorithmus im schlechtesten Fall mit wachsender Eingabegröße n zunimmt, z. B. O(1), O(log n), O(n), O(n²)."},
  {cat:'algo', sub:'ds', q:"Was ist der Unterschied zwischen einem Array und einer verketteten Liste bezüglich des Zugriffs?", a:"Ein Array erlaubt direkten Zugriff über einen Index in O(1), da die Elemente zusammenhängend gespeichert sind. Bei einer verketteten Liste muss man ab dem Anfang sequenziell durchlaufen, Zugriff ist O(n) — dafür sind Einfügen/Löschen oft günstiger."},
  {cat:'algo', sub:'sql', q:"Wozu dient das SQL-Statement GROUP BY?", a:"Es gruppiert Zeilen mit gleichen Werten in bestimmten Spalten zusammen, meist in Kombination mit Aggregatfunktionen wie COUNT(), SUM() oder AVG(), um pro Gruppe ein Ergebnis zu berechnen."},
  {cat:'algo', sub:'ds', q:"Was ist ein Array?", a:"Eine Datenstruktur fester Größe, die Elemente desselben Typs zusammenhängend im Speicher ablegt und über einen Index direkt zugreifbar macht."},
  {cat:'algo', sub:'ds', q:"Was ist ein binärer Baum?", a:"Eine Baumstruktur, bei der jeder Knoten maximal zwei Kindknoten (linkes und rechtes Kind) besitzt."},
  {cat:'algo', sub:'ds', q:"Was ist ein binärer Suchbaum?", a:"Ein binärer Baum, bei dem für jeden Knoten gilt: alle Werte im linken Teilbaum sind kleiner, alle im rechten Teilbaum größer als der Knotenwert. Bei einem ausgeglichenen Baum ermöglicht das Suche in O(log n); im ungünstigsten Fall, z. B. bei einem entarteten (listenartigen) Baum, verschlechtert sich die Laufzeit auf O(n)."},
  {cat:'algo', sub:'ds', q:"Was ist eine Hashtabelle?", a:"Eine Datenstruktur, die Schlüssel über eine Hashfunktion auf Speicherplätze abbildet, um im Idealfall Zugriff, Einfügen und Löschen in O(1) zu ermöglichen."},
  {cat:'algo', sub:'ds', q:"Was ist eine Kollision in einer Hashtabelle und wie kann sie behandelt werden?", a:"Eine Kollision entsteht, wenn zwei Schlüssel auf denselben Speicherplatz abgebildet werden. Behandlung z. B. durch Verkettung (Chaining) oder offene Adressierung."},
  {cat:'algo', sub:'ds', q:"Was ist ein Graph in der Informatik?", a:"Eine Struktur aus Knoten (Nodes) und Kanten (Edges), die Beziehungen zwischen Objekten darstellt — kann gerichtet oder ungerichtet, gewichtet oder ungewichtet sein."},
  {cat:'algo', sub:'sort', q:"Wie funktioniert Selection Sort?", a:"In jedem Durchlauf wird das kleinste (oder größte) Element im unsortierten Bereich gesucht und mit dem ersten unsortierten Element vertauscht."},
  {cat:'algo', sub:'sort', q:"Wie funktioniert Insertion Sort?", a:"Das Array wird schrittweise aufgebaut, indem jedes Element an der richtigen Position im bereits sortierten Teil eingefügt wird."},
  {cat:'algo', sub:'sort', q:"Wie funktioniert Quicksort grundsätzlich?", a:"Ein Pivot-Element wird gewählt, das Array wird in kleinere/größere Elemente als den Pivot partitioniert, und die Teilarrays werden rekursiv sortiert (Divide-and-Conquer)."},
  {cat:'algo', sub:'sort', q:"Wie funktioniert Mergesort grundsätzlich?", a:"Das Array wird rekursiv in Hälften geteilt, bis einzelne Elemente übrig sind, die dann paarweise sortiert wieder zusammengeführt (gemergt) werden — Laufzeit O(n log n)."},
  {cat:'algo', sub:'sort', q:"Welche Zeitkomplexität hat die lineare Suche im schlechtesten Fall?", a:"O(n), da im schlimmsten Fall jedes Element geprüft werden muss."},
  {cat:'algo', sub:'rekursion', q:"Was ist der Unterschied zwischen Rekursion und Iteration?", a:"Rekursion löst ein Problem durch Selbstaufrufe der Funktion, Iteration durch Schleifen. Rekursion kann eleganter sein, benötigt aber mehr Speicher (Aufrufstapel); Iteration ist meist ressourcenschonender."},
  {cat:'algo', sub:'rekursion', q:"Was ist ein Stack Overflow bei Rekursion?", a:"Ein Fehler, der auftritt, wenn zu viele rekursive Aufrufe den Aufrufstapel (Call Stack) überlaufen lassen, meist wegen fehlender oder falscher Abbruchbedingung."},
  {cat:'algo', sub:'oop', q:"Was ist der Konstruktor einer Klasse?", a:"Eine spezielle Methode, die beim Erzeugen eines neuen Objekts automatisch aufgerufen wird, um dessen Attribute zu initialisieren."},
  {cat:'algo', sub:'oop', q:"Was ist der Unterschied zwischen einer Klasse und einem Objekt?", a:"Eine Klasse ist die Bauplan-/Vorlagendefinition mit Attributen und Methoden. Ein Objekt ist eine konkrete Instanz dieser Klasse mit eigenen Attributwerten."},
  {cat:'algo', sub:'oop', q:"Was ist eine statische Methode/ein statisches Attribut in der OOP?", a:"Ein Element, das zur Klasse selbst gehört und nicht an eine einzelne Instanz gebunden ist — es existiert nur einmal, unabhängig davon, wie viele Objekte erzeugt werden."},
  {cat:'algo', sub:'oop', q:"Was ist der Unterschied zwischen Überladen (Overloading) und Überschreiben (Overriding)?", a:"Überladen bedeutet, mehrere Methoden mit gleichem Namen, aber unterschiedlicher Parameterliste in derselben Klasse zu definieren. Überschreiben bedeutet, eine geerbte Methode in einer Unterklasse mit gleicher Signatur neu zu implementieren."},
  {cat:'algo', sub:'oop', q:"Was ist Abstraktion in der OOP?", a:"Das Prinzip, nur die für den jeweiligen Kontext wesentlichen Eigenschaften/Verhaltensweisen eines Objekts abzubilden und unwichtige Details auszublenden."},
  {cat:'algo', sub:'pattern', q:"Was ist das Singleton-Entwurfsmuster?", a:"Ein Entwurfsmuster, das sicherstellt, dass von einer Klasse zur Laufzeit nur genau eine Instanz existiert, und einen globalen Zugriffspunkt darauf bereitstellt."},
  {cat:'algo', sub:'pattern', q:"Was ist das Observer-Entwurfsmuster?", a:"Ein Entwurfsmuster, bei dem sich Beobachter (Observer) bei einem Subjekt registrieren und automatisch benachrichtigt werden, wenn sich dessen Zustand ändert."},
  {cat:'algo', sub:'pattern', q:"Was ist das Factory-Entwurfsmuster?", a:"Ein Entwurfsmuster, das die Erzeugung von Objekten über eine zentrale Methode/Klasse kapselt, statt Objekte direkt mit \"new\" zu erzeugen — erhöht Flexibilität und Austauschbarkeit."},
  {cat:'algo', sub:'pattern', q:"Was beschreibt das MVC-Architekturmuster?", a:"Model-View-Controller trennt eine Anwendung in Datenmodell (Model), Darstellung (View) und Steuerungslogik (Controller), um Zuständigkeiten zu entkoppeln und Wartbarkeit zu erhöhen."},
  {cat:'algo', sub:'pattern', q:"Was ist eine Schichtenarchitektur (Layered Architecture)?", a:"Eine Softwarearchitektur, die eine Anwendung in aufeinander aufbauende Schichten (z. B. Präsentation, Logik, Datenzugriff) unterteilt, wobei jede Schicht nur mit den angrenzenden kommuniziert."},
  {cat:'algo', sub:'pattern', q:"Was ist ein Client-Server-Modell?", a:"Ein Architekturmodell, bei dem Clients Anfragen an einen zentralen Server stellen, der Ressourcen/Dienste bereitstellt und die Anfragen bearbeitet."},
  {cat:'algo', sub:'pattern', q:"Was ist eine REST-API?", a:"Eine Programmierschnittstelle, die dem REST-Architekturstil folgt und über HTTP-Methoden (GET, POST, PUT, DELETE) zustandslos auf Ressourcen zugreift, die über URLs identifiziert werden."},
  {cat:'algo', sub:'pattern', q:"Was ist der Unterschied zwischen JSON und XML?", a:"Beides sind Datenformate zum Datenaustausch. JSON ist kompakter und einfacher lesbar (Schlüssel-Wert-Paare), XML ist ausführlicher mit Tags und erlaubt z. B. Attribute und Validierung über Schemas (XSD)."},
  {cat:'algo', sub:'sql', q:"Was bedeutet ACID bei Datenbanktransaktionen?", a:"Atomicity (Alles-oder-nichts), Consistency (Konsistenz bleibt erhalten), Isolation (Transaktionen beeinflussen sich nicht gegenseitig) und Durability (Ergebnisse bleiben nach Abschluss dauerhaft erhalten)."},
  {cat:'algo', sub:'sql', q:"Was ist ein Datenbankindex und wozu dient er?", a:"Eine zusätzliche Datenstruktur, die den schnellen Zugriff auf Datensätze anhand bestimmter Spalten ermöglicht, ähnlich einem Buchregister — beschleunigt Lesezugriffe, verlangsamt aber Schreibzugriffe."},
  {cat:'algo', sub:'sql', q:"Was macht das SQL-Statement HAVING im Unterschied zu WHERE?", a:"WHERE filtert einzelne Zeilen vor der Gruppierung, HAVING filtert Gruppen (z. B. Ergebnisse von Aggregatfunktionen) nach der Ausführung von GROUP BY."},
  {cat:'algo', sub:'sql', q:"Was macht ein RIGHT JOIN in SQL?", a:"Er liefert alle Datensätze der rechten Tabelle sowie die übereinstimmenden Datensätze der linken Tabelle; gibt es keine Übereinstimmung, werden NULL-Werte für die linke Tabelle eingesetzt."},
  {cat:'algo', sub:'sql', q:"Was ist eine Subquery (Unterabfrage) in SQL?", a:"Eine SQL-Abfrage, die innerhalb einer anderen Abfrage verschachtelt ist, z. B. in der WHERE- oder FROM-Klausel, um Zwischenergebnisse weiterzuverarbeiten."},
  {cat:'algo', sub:'sql', q:"Was ist der Unterschied zwischen DDL und DML in SQL?", a:"DDL (Data Definition Language, z. B. CREATE, ALTER, DROP) definiert die Struktur der Datenbank. DML (Data Manipulation Language, z. B. SELECT, INSERT, UPDATE, DELETE) bearbeitet die Daten selbst."},
  {cat:'algo', sub:'sql', q:"Was bewirkt das SQL-Statement DELETE im Vergleich zu TRUNCATE?", a:"DELETE löscht (optional gefilterte) Zeilen einzeln und protokolliert sie im Transaktionslog, ist rückgängig machbar. TRUNCATE entfernt alle Zeilen einer Tabelle auf einmal, meist schneller, aber nicht zeilenweise protokolliert."},
  {cat:'algo', sub:'sql', q:"Was ist ein zusammengesetzter Schlüssel (Composite Key)?", a:"Ein Primärschlüssel, der aus mehreren Spalten besteht, die zusammen einen Datensatz eindeutig identifizieren."},
  {cat:'algo', sub:'sql', q:"Was ist die Boyce-Codd-Normalform (BCNF)?", a:"Eine Verschärfung der 3NF: Für jede funktionale Abhängigkeit muss die linke Seite ein Superschlüssel sein — beseitigt bestimmte Anomalien, die die 3NF noch zulässt."},
  {cat:'algo', sub:'sql', q:"Was ist eine Anomalie in einer nicht normalisierten Datenbank?", a:"Unerwünschte Effekte wie Einfüge-, Änderungs- oder Löschanomalien, die durch redundante Datenspeicherung entstehen können und durch Normalisierung vermieden werden."},
  {cat:'algo', sub:'sql', q:"Was ist der Unterschied zwischen einem Primärschlüssel und einem Unique-Constraint?", a:"Ein Primärschlüssel identifiziert einen Datensatz eindeutig und darf nicht NULL sein; pro Tabelle gibt es nur einen. Ein Unique-Constraint erzwingt ebenfalls Eindeutigkeit, erlaubt aber NULL-Werte und kann mehrfach pro Tabelle vergeben werden."},
  {cat:'algo', sub:'netz', q:"Was ist das OSI-Referenzmodell?", a:"Ein 7-Schichten-Modell zur Beschreibung der Kommunikation in Netzwerken, von der physikalischen Übertragung (Schicht 1) bis zur Anwendung (Schicht 7)."},
  {cat:'algo', sub:'netz', q:"Auf welcher OSI-Schicht arbeitet ein Switch, auf welcher ein Router?", a:"Ein (klassischer) Switch arbeitet auf Schicht 2 (Sicherungsschicht, MAC-Adressen), ein Router auf Schicht 3 (Vermittlungsschicht, IP-Adressen)."},
  {cat:'algo', sub:'netz', q:"Was ist der Unterschied zwischen TCP und UDP?", a:"TCP ist verbindungsorientiert, stellt eine zuverlässige, geordnete Übertragung mit Fehlerkorrektur sicher. UDP ist verbindungslos, schneller, aber ohne Garantie für Zustellung oder Reihenfolge."},
  {cat:'algo', sub:'netz', q:"Was ist eine IP-Adresse?", a:"Eine eindeutige Adresse, die ein Gerät in einem Netzwerk identifiziert und die Kommunikation über das Internetprotokoll ermöglicht (z. B. IPv4 oder IPv6)."},
  {cat:'algo', sub:'netz', q:"Was macht eine Subnetzmaske?", a:"Sie legt fest, welcher Teil einer IP-Adresse das Netzwerk und welcher Teil das einzelne Gerät (Host) innerhalb dieses Netzwerks bezeichnet."},
  {cat:'algo', sub:'netz', q:"Was macht ein DNS-Server?", a:"Er übersetzt menschenlesbare Domainnamen (z. B. www.example.com) in die zugehörigen IP-Adressen."},
  {cat:'algo', sub:'netz', q:"Was ist der Unterschied zwischen HTTP und HTTPS?", a:"HTTPS ist die verschlüsselte Variante von HTTP (mittels TLS/SSL) und schützt die Datenübertragung zwischen Client und Server vor Abhören und Manipulation."},
  {cat:'algo', sub:'netz', q:"Was ist ein Port in der Netzwerkkommunikation?", a:"Eine logische Adresse (0–65535), über die ein bestimmter Dienst/Prozess auf einem Gerät erreichbar ist, z. B. Port 80 für HTTP oder 443 für HTTPS."},
  {cat:'algo', sub:'rekursion', q:"Was ist der Unterschied zwischen Binär- und Hexadezimalsystem?", a:"Das Binärsystem nutzt die Basis 2 (Ziffern 0/1), das Hexadezimalsystem die Basis 16 (Ziffern 0–9, A–F). Hexadezimalzahlen werden oft genutzt, um Binärzahlen kompakter darzustellen (4 Bit = 1 Hex-Ziffer)."},
  {cat:'algo', sub:'rekursion', q:"Wie wird eine negative Zahl im Zweierkomplement dargestellt?", a:"Man invertiert alle Bits der positiven Binärdarstellung und addiert 1 — dadurch lassen sich Addition/Subtraktion einheitlich mit demselben Rechenwerk durchführen."},
  {cat:'algo', sub:'rekursion', q:"Was ist der Unterschied zwischen einer Exception und einem Syntaxfehler?", a:"Ein Syntaxfehler verletzt die Grammatikregeln der Sprache und verhindert die Kompilierung/Ausführung. Eine Exception ist ein Laufzeitfehler, der während der Programmausführung auftritt und abgefangen (try-catch) werden kann."},
  {cat:'algo', sub:'rekursion', q:"Wozu dient ein try-catch-Block?", a:"Um Programmcode, bei dem ein Laufzeitfehler auftreten könnte, gezielt abzusichern und im Fehlerfall (catch) eine definierte Behandlung statt eines Programmabsturzes auszuführen."},
  {cat:'algo', sub:'praxis', q:"Was ist Test-Driven Development (TDD)?", a:"Eine Entwicklungsmethode, bei der zuerst ein (fehlschlagender) Test geschrieben wird, dann die minimale Implementierung, die den Test besteht, und anschließend der Code refaktorisiert wird."},
  {cat:'algo', sub:'praxis', q:"Was macht der Git-Befehl \"commit\"?", a:"Er speichert die aktuell im Staging-Bereich vorgemerkten Änderungen dauerhaft als neuen Versionsstand (Snapshot) im lokalen Repository."},
  {cat:'algo', sub:'praxis', q:"Was ist ein Branch in Git?", a:"Ein unabhängiger Entwicklungsstrang innerhalb eines Repositories, der parallele Arbeit ermöglicht, ohne den Hauptzweig (z. B. main) direkt zu verändern."},
  {cat:'algo', sub:'praxis', q:"Was passiert beim Git-Befehl \"merge\"?", a:"Änderungen aus einem Branch werden mit einem anderen Branch zusammengeführt, wobei Git versucht, die Änderungen automatisch zu kombinieren."},
  {cat:'algo', sub:'praxis', q:"Was ist ein Merge-Konflikt in Git?", a:"Er tritt auf, wenn dieselbe Stelle einer Datei in zwei zusammenzuführenden Branches unterschiedlich verändert wurde und Git die Änderungen nicht automatisch vereinen kann — manuelle Auflösung ist nötig."},
  {cat:'algo', sub:'praxis', q:"Was ist eine Pull Request (bzw. Merge Request)?", a:"Eine Anfrage, Änderungen aus einem Branch in einen anderen (z. B. den Hauptzweig) zu übernehmen, meist verbunden mit Code-Review durch andere Teammitglieder vor der Zusammenführung."},
  {cat:'algo', sub:'praxis', q:"Was ist der Unterschied zwischen Kompilierung und Interpretation?", a:"Bei der Kompilierung wird der Quellcode vor der Ausführung vollständig in Maschinencode übersetzt. Bei der Interpretation wird der Code zur Laufzeit Zeile für Zeile gelesen und direkt ausgeführt."},
  {cat:'algo', sub:'oop', q:"Was ist ein Interface in der objektorientierten Programmierung im Vergleich zu einer Klasse?", a:"Ein Interface definiert einen Vertrag aus Methodensignaturen, traditionell ohne eigene Implementierung (seit Java 8 sind jedoch default- und static-Methoden mit Implementierung möglich); eine Klasse kann diesen Vertrag durch \"implements\" einhalten und muss alle nicht bereits implementierten Methoden konkret umsetzen."},
  {cat:'algo', sub:'oop', q:"Was versteht man unter \"Clean Code\"?", a:"Quellcode, der klar strukturiert, verständlich benannt, gut wartbar und möglichst einfach ist — u. a. durch aussagekräftige Bezeichner, kleine Funktionen und Vermeidung unnötiger Komplexität."},
  {cat:'algo', sub:'ds', q:"Was ist der Unterschied zwischen einer einfach und einer doppelt verketteten Liste?", a:"Bei einer einfach verketteten Liste verweist jeder Knoten nur auf den nächsten Knoten. Bei einer doppelt verketteten Liste verweist jeder Knoten zusätzlich auf den vorherigen Knoten, was Navigation in beide Richtungen ermöglicht."},
  // ================= Wirtschafts- und Sozialkunde =================
  {cat:'wiso', sub:'tarif', q:"Wer schließt einen Tarifvertrag ab?", a:"Ein Tarifvertrag wird zwischen einer Gewerkschaft (Arbeitnehmerseite) und einem einzelnen Arbeitgeber oder einem Arbeitgeberverband (Arbeitgeberseite) geschlossen."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Was regelt das Kündigungsschutzgesetz (KSchG) und für wen gilt es?", a:"Es schützt Arbeitnehmer vor sozial ungerechtfertigten Kündigungen. Es gilt in Betrieben mit i. d. R. mehr als 10 Beschäftigten, wenn das Arbeitsverhältnis länger als 6 Monate besteht."},
  {cat:'wiso', sub:'steuern', q:"Nenne die fünf Zweige der gesetzlichen Sozialversicherung in Deutschland.", a:"Kranken-, Renten-, Arbeitslosen-, Pflege- und Unfallversicherung."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Was ist die maximale gesetzliche tägliche Arbeitszeit laut Arbeitszeitgesetz?", a:"Grundsätzlich 8 Stunden pro Werktag, verlängerbar auf bis zu 10 Stunden, wenn im Durchschnitt von 6 Kalendermonaten bzw. 24 Wochen 8 Stunden pro Werktag nicht überschritten werden."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Wozu dient das Allgemeine Gleichbehandlungsgesetz (AGG)?", a:"Es soll Benachteiligungen aus Gründen wie Rasse/ethnischer Herkunft, Geschlecht, Religion, Behinderung, Alter oder sexueller Identität verhindern oder beseitigen — u. a. im Arbeitsleben."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Nenne zwei zentrale Mitbestimmungsrechte des Betriebsrats.", a:"Z. B. bei der Gestaltung von Arbeitszeit (§87 BetrVG) und bei personellen Einzelmaßnahmen wie Einstellungen, Versetzungen oder Kündigungen — hier hat der Betriebsrat Mitspracherechte nach dem Betriebsverfassungsgesetz."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Was regelt das Jugendarbeitsschutzgesetz (JArbSchG)?", a:"Es schützt Kinder und Jugendliche (unter 18 Jahren) am Arbeitsplatz, z. B. durch Begrenzung der Arbeitszeit, Verbot von Nacht-/Akkordarbeit und Pflicht zu ausreichenden Pausen und Ruhezeiten."},
  {cat:'wiso', sub:'wirtschaft', q:"Was zeigt der einfache Wirtschaftskreislauf?", a:"Den Güter- und Geldfluss zwischen den zwei Polen Haushalte (bieten Produktionsfaktoren an, konsumieren Güter) und Unternehmen (produzieren Güter, zahlen Löhne) — jeweils in entgegengesetzter Richtung."},
  {cat:'wiso', sub:'wirtschaft', q:"Was versteht man unter Inflation?", a:"Einen anhaltenden Anstieg des allgemeinen Preisniveaus, wodurch die Kaufkraft des Geldes sinkt."},
  {cat:'wiso', sub:'unternehmen', q:"Was ist der zentrale Unterschied zwischen GmbH und AG bei der Haftung?", a:"Bei beiden Rechtsformen haftet grundsätzlich nur das Gesellschaftsvermögen (keine private Haftung der Gesellschafter/Aktionäre). Die GmbH hat Stammkapital (mind. 25.000 €), die AG Grundkapital (mind. 50.000 €), das in Aktien zerlegt ist."},
  {cat:'wiso', sub:'unternehmen', q:"Was sind zentrale Aufgaben der IHK (Industrie- und Handelskammer)?", a:"U. a. die Überwachung der Berufsausbildung, Organisation von Prüfungen, Interessenvertretung der Wirtschaft und Beratung von Unternehmen."},
  {cat:'wiso', sub:'ausbildung', q:"Wie lang ist die gesetzliche Probezeit im Berufsausbildungsverhältnis maximal?", a:"Mindestens 1 Monat und höchstens 4 Monate (§20 BBiG). Während der Probezeit kann das Ausbildungsverhältnis jederzeit ohne Einhaltung einer Frist gekündigt werden."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Welche Angaben muss ein Ausbildungsvertrag mindestens enthalten?", a:"U. a. Ausbildungsberuf und -ziel, Beginn und Dauer, Ausbildungsstätte(n), tägliche Arbeitszeit, Dauer der Probezeit, Vergütungshöhe und -zahlungsweise sowie Urlaubsdauer und Kündigungsvoraussetzungen."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Welche gesetzliche Kündigungsfrist gilt nach der Probezeit für Arbeitnehmer laut BGB (Grundregel)?", a:"Die gesetzliche Grundkündigungsfrist beträgt 4 Wochen zum 15. oder zum Ende eines Kalendermonats (§622 BGB), sofern nicht Tarifvertrag oder Arbeitsvertrag längere Fristen vorsehen."},
  {cat:'wiso', sub:'wirtschaft', q:"Was regelt Angebot und Nachfrage auf einem freien Markt?", a:"Der Marktpreis (Gleichgewichtspreis) bildet sich dort, wo die angebotene Menge der nachgefragten Menge entspricht. Steigt die Nachfrage bei gleichem Angebot, steigt tendenziell der Preis — und umgekehrt."},
  {cat:'wiso', sub:'tarif', q:"Was ist der Unterschied zwischen Betriebsrat und Personalrat?", a:"Der Betriebsrat vertritt Arbeitnehmerinteressen in privatwirtschaftlichen Betrieben (Grundlage: Betriebsverfassungsgesetz). Der Personalrat übernimmt diese Funktion im öffentlichen Dienst (Grundlage: Personalvertretungsgesetze)."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Was ist der Unterschied zwischen einer ordentlichen und einer außerordentlichen Kündigung?", a:"Die ordentliche Kündigung erfolgt unter Einhaltung der gesetzlichen/vertraglichen Kündigungsfrist. Die außerordentliche (fristlose) Kündigung beendet das Arbeitsverhältnis sofort, erfordert aber einen wichtigen Grund (§626 BGB)."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Was ist eine Änderungskündigung?", a:"Eine Kündigung, die mit dem Angebot verbunden ist, das Arbeitsverhältnis zu geänderten Bedingungen fortzusetzen (z. B. anderes Gehalt oder andere Tätigkeit)."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Wozu dient eine Abmahnung?", a:"Sie weist den Arbeitnehmer auf ein konkretes Fehlverhalten hin, fordert dessen Unterlassung und kündigt im Wiederholungsfall arbeitsrechtliche Konsequenzen (bis zur Kündigung) an — oft Voraussetzung für eine verhaltensbedingte Kündigung."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Was ist ein qualifiziertes Arbeitszeugnis?", a:"Ein Zeugnis, das neben Art und Dauer der Tätigkeit auch Leistung und Verhalten des Arbeitnehmers bewertet — im Gegensatz zum einfachen Zeugnis, das nur Tätigkeit und Dauer nennt."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Was regelt das Mutterschutzgesetz?", a:"Es schützt schwangere und stillende Arbeitnehmerinnen, u. a. durch Beschäftigungsverbote, Kündigungsschutz und besondere Arbeitszeitregelungen."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Was ist Elternzeit?", a:"Ein gesetzlicher Anspruch von Arbeitnehmern auf unbezahlte Freistellung von der Arbeit zur Betreuung eines Kindes, bei gleichzeitigem Kündigungsschutz und Rückkehrrecht auf den Arbeitsplatz."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Wie hoch ist der gesetzliche Mindesturlaub laut Bundesurlaubsgesetz (BUrlG)?", a:"Mindestens 24 Werktage pro Jahr bei einer 6-Tage-Woche (entspricht 20 Arbeitstagen bei einer 5-Tage-Woche)."},
  {cat:'wiso', sub:'ausbildung', q:"Was regelt das Berufsbildungsgesetz (BBiG) grundsätzlich?", a:"Es bildet die rechtliche Grundlage der beruflichen Ausbildung in Deutschland, u. a. Ausbildungsvertrag, Pflichten von Ausbildenden und Auszubildenden, Prüfungen und Ausbildungsordnungen."},
  {cat:'wiso', sub:'ausbildung', q:"Was ist ein Ausbildungsrahmenplan?", a:"Ein Bestandteil der Ausbildungsordnung, der zeitlich und sachlich gegliedert vorgibt, welche Fertigkeiten, Kenntnisse und Fähigkeiten während der Ausbildung vermittelt werden sollen."},
  {cat:'wiso', sub:'ausbildung', q:"Wozu dient das Berichtsheft (Ausbildungsnachweis)?", a:"Es dokumentiert den Verlauf der Ausbildung, die vermittelten Inhalte und Tätigkeiten und ist Voraussetzung für die Zulassung zur Abschlussprüfung."},
  {cat:'wiso', sub:'ausbildung', q:"Was ist die Jugend- und Auszubildendenvertretung (JAV)?", a:"Eine gewählte Interessenvertretung der jugendlichen Beschäftigten und Auszubildenden im Betrieb, die u. a. deren Belange gegenüber dem Betriebsrat und dem Arbeitgeber vertritt."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Was passiert, wenn ein Auszubildender nach der Abschlussprüfung nicht ausdrücklich übernommen, aber weiterbeschäftigt wird?", a:"Nach §24 BBiG entsteht dann automatisch ein unbefristetes Arbeitsverhältnis, wenn der Auszubildende im Anschluss an die Ausbildung ohne ausdrückliche Vereinbarung weiterbeschäftigt wird."},
  {cat:'wiso', sub:'tarif', q:"Was versteht man unter Tarifautonomie?", a:"Das verfassungsrechtlich geschützte Recht der Tarifparteien (Gewerkschaften und Arbeitgeber(-verbände)), Löhne und Arbeitsbedingungen eigenständig und ohne staatliche Einmischung auszuhandeln."},
  {cat:'wiso', sub:'tarif', q:"Was ist der Unterschied zwischen Flächentarifvertrag und Firmentarifvertrag (Haustarifvertrag)?", a:"Ein Flächentarifvertrag gilt für eine ganze Branche/Region und wird zwischen Gewerkschaft und Arbeitgeberverband geschlossen. Ein Firmentarifvertrag gilt nur für ein einzelnes Unternehmen und wird direkt zwischen Gewerkschaft und diesem Arbeitgeber vereinbart."},
  {cat:'wiso', sub:'tarif', q:"Was bedeutet Tarifbindung?", a:"Ein Arbeitsverhältnis unterliegt einem Tarifvertrag, wenn beide Parteien (oder der Arbeitgeber durch Verbandsmitgliedschaft) tarifgebunden sind oder der Tarifvertrag durch Allgemeinverbindlicherklärung gilt."},
  {cat:'wiso', sub:'tarif', q:"Was ist das Streikrecht und wo ist es verankert?", a:"Das Recht der Gewerkschaften, zur Durchsetzung tariflicher Forderungen zur Arbeitsniederlegung aufzurufen; es leitet sich aus der grundgesetzlich geschützten Koalitionsfreiheit (Art. 9 Abs. 3 GG) ab."},
  {cat:'wiso', sub:'tarif', q:"Was ist eine Aussperrung?", a:"Eine Arbeitskampfmaßnahme der Arbeitgeberseite, bei der Arbeitnehmer vorübergehend vom Betrieb ausgeschlossen und von der Arbeit sowie der Lohnzahlung freigestellt werden, meist als Reaktion auf einen Streik."},
  {cat:'wiso', sub:'tarif', q:"Wie wird der Betriebsrat gewählt?", a:"Er wird von den wahlberechtigten Arbeitnehmern des Betriebs in geheimer und unmittelbarer Wahl für eine Amtszeit von in der Regel 4 Jahren gewählt."},
  {cat:'wiso', sub:'tarif', q:"Was sind soziale Angelegenheiten, bei denen der Betriebsrat zwingend mitbestimmen muss?", a:"Z. B. Beginn und Ende der täglichen Arbeitszeit, Pausenregelungen, Urlaubsgrundsätze, Überstunden sowie Fragen der betrieblichen Ordnung (§87 BetrVG)."},
  {cat:'wiso', sub:'tarif', q:"Was ist ein Wirtschaftsausschuss?", a:"Ein Gremium in Unternehmen mit in der Regel mehr als 100 Arbeitnehmern, das über wirtschaftliche Angelegenheiten informiert wird und diese mit der Unternehmensleitung berät."},
  {cat:'wiso', sub:'unternehmen', q:"Was ist ein Einzelunternehmen?", a:"Eine Unternehmensform mit nur einem Inhaber, der das Unternehmen allein führt und mit seinem gesamten Privatvermögen unbeschränkt haftet."},
  {cat:'wiso', sub:'unternehmen', q:"Was ist eine GbR (Gesellschaft bürgerlichen Rechts)?", a:"Der einfachste Zusammenschluss mehrerer Personen zu einer Personengesellschaft ohne besondere Formvorschriften; alle Gesellschafter haften unbeschränkt und gesamtschuldnerisch, auch mit ihrem Privatvermögen."},
  {cat:'wiso', sub:'unternehmen', q:"Was unterscheidet eine OHG von einer KG?", a:"Bei der OHG (Offene Handelsgesellschaft) haften alle Gesellschafter unbeschränkt. Bei der KG (Kommanditgesellschaft) gibt es mindestens einen unbeschränkt haftenden Komplementär und mindestens einen nur beschränkt (mit seiner Einlage) haftenden Kommanditisten."},
  {cat:'wiso', sub:'unternehmen', q:"Was ist eine UG (haftungsbeschränkt)?", a:"Eine \"kleine GmbH\", die bereits mit einem Stammkapital ab 1 € gegründet werden kann, bei der die Haftung wie bei der GmbH auf das Gesellschaftsvermögen beschränkt ist, mit Pflicht zur Rücklagenbildung bis zum Erreichen des GmbH-Mindestkapitals."},
  {cat:'wiso', sub:'wirtschaft', q:"Was ist eine Marktform \"Monopol\"?", a:"Eine Marktsituation, in der es nur einen einzigen Anbieter für ein Gut oder eine Dienstleistung gibt, der dadurch großen Einfluss auf den Preis hat."},
  {cat:'wiso', sub:'wirtschaft', q:"Was ist eine Marktform \"Oligopol\"?", a:"Eine Marktsituation, in der wenige große Anbieter den Markt dominieren und sich gegenseitig in ihren Entscheidungen (z. B. Preis) beeinflussen."},
  {cat:'wiso', sub:'wirtschaft', q:"Was ist ein Polypol?", a:"Eine Marktform mit vielen Anbietern und vielen Nachfragern, bei der kein einzelner Marktteilnehmer allein den Preis wesentlich beeinflussen kann (z. B. Modell des vollkommenen Marktes)."},
  {cat:'wiso', sub:'steuern', q:"Was ist die Umsatzsteuer und wer trägt sie wirtschaftlich?", a:"Eine indirekte Steuer auf den Verkauf von Waren und Dienstleistungen, die vom Unternehmen an den Staat abgeführt, aber wirtschaftlich letztlich vom Endverbraucher getragen wird."},
  {cat:'wiso', sub:'steuern', q:"Was ist der Unterschied zwischen direkten und indirekten Steuern?", a:"Bei direkten Steuern (z. B. Einkommensteuer) fallen Steuerschuldner und wirtschaftlich Belasteter zusammen. Bei indirekten Steuern (z. B. Umsatzsteuer) führt ein anderer die Steuer ab, als sie wirtschaftlich trägt."},
  {cat:'wiso', sub:'steuern', q:"Was besteuert die Gewerbesteuer?", a:"Sie besteuert den Ertrag von Gewerbebetrieben und wird von den Gemeinden erhoben, die auch den Hebesatz festlegen."},
  {cat:'wiso', sub:'wirtschaft', q:"Was ist ein Konjunkturzyklus?", a:"Die wiederkehrende Abfolge von Aufschwung, Boom (Hochkonjunktur), Abschwung und Rezession/Depression in der gesamtwirtschaftlichen Entwicklung."},
  {cat:'wiso', sub:'wirtschaft', q:"Was misst das Bruttoinlandsprodukt (BIP)?", a:"Den Gesamtwert aller im Inland innerhalb eines Zeitraums (meist eines Jahres) hergestellten Waren und Dienstleistungen — ein zentraler Indikator für die wirtschaftliche Leistung eines Landes."},
  {cat:'wiso', sub:'wirtschaft', q:"Was ist der Unterschied zwischen Inflation und Deflation?", a:"Inflation beschreibt einen anhaltenden Anstieg des allgemeinen Preisniveaus (Kaufkraftverlust), Deflation einen anhaltenden Rückgang des Preisniveaus."},
  {cat:'wiso', sub:'wirtschaft', q:"Nenne zwei Arten von Arbeitslosigkeit.", a:"Z. B. konjunkturelle Arbeitslosigkeit (durch wirtschaftliche Abschwungphasen), strukturelle Arbeitslosigkeit (durch Wandel von Wirtschaftsstrukturen) und friktionelle Arbeitslosigkeit (durch vorübergehenden Wechsel zwischen Arbeitsplätzen)."},
  {cat:'wiso', sub:'wirtschaft', q:"Was versteht man unter Globalisierung?", a:"Die zunehmende weltweite wirtschaftliche, politische, kulturelle und technologische Vernetzung und gegenseitige Abhängigkeit von Ländern und Märkten."},
  {cat:'wiso', sub:'wirtschaft', q:"Was sind Standortfaktoren für Unternehmen?", a:"Kriterien, die die Attraktivität eines Wirtschaftsstandorts beeinflussen, z. B. Infrastruktur, Lohnkosten, Verfügbarkeit von Fachkräften, Steuerlast, rechtliche Rahmenbedingungen und Nähe zu Absatzmärkten."},
  {cat:'wiso', sub:'schutz', q:"Was regelt das Bundesdatenschutzgesetz (BDSG) im Verhältnis zur DSGVO?", a:"Es ergänzt und konkretisiert die DSGVO für Deutschland dort, wo die DSGVO den Mitgliedstaaten eigenen Regelungsspielraum lässt (z. B. Beschäftigtendatenschutz)."},
  {cat:'wiso', sub:'tarif', q:"Was ist eine Betriebsvereinbarung?", a:"Eine schriftliche Vereinbarung zwischen Arbeitgeber und Betriebsrat, die betriebliche Angelegenheiten verbindlich für alle Arbeitnehmer des Betriebs regelt."},
  {cat:'wiso', sub:'schutz', q:"Was verlangt das Arbeitsschutzgesetz (ArbSchG) von Arbeitgebern?", a:"Es verpflichtet Arbeitgeber, Maßnahmen zur Sicherheit und zum Gesundheitsschutz der Beschäftigten bei der Arbeit zu treffen, u. a. durch Gefährdungsbeurteilungen."},
  {cat:'wiso', sub:'schutz', q:"Was ist eine Gefährdungsbeurteilung?", a:"Eine systematische Ermittlung und Bewertung von Gefahren am Arbeitsplatz mit dem Ziel, geeignete Schutzmaßnahmen abzuleiten."},
  {cat:'wiso', sub:'sonstiges-wiso', q:"Was unterscheidet einen kooperativen von einem autoritären Führungsstil?", a:"Beim kooperativen Führungsstil werden Mitarbeiter in Entscheidungen einbezogen und Verantwortung geteilt. Beim autoritären Führungsstil trifft die Führungskraft Entscheidungen allein und gibt Anweisungen ohne Mitspracherecht der Mitarbeiter."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Was ist ein befristetes Arbeitsverhältnis?", a:"Ein Arbeitsverhältnis, das von vornherein auf einen bestimmten Zeitraum oder Zweck begrenzt ist und ohne Kündigung automatisch mit Fristablauf endet."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Unter welchen Voraussetzungen ist eine sachgrundlose Befristung nach TzBfG zulässig?", a:"Grundsätzlich bis zu einer Gesamtdauer von 2 Jahren, innerhalb derer eine Verlängerung bis zu dreimal möglich ist, sofern zuvor kein Arbeitsverhältnis mit demselben Arbeitgeber bestand."},
  {cat:'wiso', sub:'steuern', q:"Was ist der Unterschied zwischen Brutto- und Nettolohn?", a:"Der Bruttolohn ist der vereinbarte Lohn vor Abzügen. Der Nettolohn ist der tatsächlich ausgezahlte Betrag nach Abzug von Steuern und Sozialversicherungsbeiträgen."},
  {cat:'wiso', sub:'steuern', q:"Wer trägt die Beiträge zur gesetzlichen Sozialversicherung in Deutschland grundsätzlich?", a:"Sie werden in der Regel paritätisch, also etwa zur Hälfte, von Arbeitgeber und Arbeitnehmer getragen (Ausnahmen z. B. bei der Unfallversicherung, die allein der Arbeitgeber trägt)."},
  {cat:'wiso', sub:'steuern', q:"Was ist die Künstlersozialkasse und wen betrifft sie?", a:"Eine Einrichtung, über die selbstständige Künstler und Publizisten Zugang zur gesetzlichen Kranken-, Pflege- und Rentenversicherung erhalten, ähnlich wie Arbeitnehmer, wobei ein Teil der Beiträge über eine Abgabe der Verwerter (z. B. Verlage) finanziert wird."},
  {cat:'wiso', sub:'unternehmen', q:"Was ist eine Genossenschaft (eG)?", a:"Ein Zusammenschluss von Mitgliedern zur gemeinsamen wirtschaftlichen Förderung, bei dem jedes Mitglied unabhängig von der Kapitaleinlage in der Regel eine Stimme hat."},
  {cat:'wiso', sub:'unternehmen', q:"Was bedeutet Prokura?", a:"Eine vom Inhaber erteilte, umfassende Vollmacht, die den Prokuristen berechtigt, das Unternehmen fast uneingeschränkt gerichtlich und außergerichtlich zu vertreten."},
  {cat:'wiso', sub:'unternehmen', q:"Was ist der Unterschied zwischen Vollmacht und Prokura?", a:"Eine Vollmacht kann inhaltlich frei und individuell begrenzt werden. Prokura ist eine besondere, gesetzlich geregelte Form der Handlungsvollmacht mit einem gesetzlich festgelegten, weitreichenden Umfang, die ins Handelsregister eingetragen wird."},
  {cat:'wiso', sub:'wirtschaft', q:"Was ist ein Wechselkurs?", a:"Das Austauschverhältnis zwischen zwei Währungen, das angibt, wie viel Einheiten einer Währung man für eine Einheit einer anderen Währung erhält."},
  {cat:'wiso', sub:'wirtschaft', q:"Was versteht man unter Außenhandel (Import/Export)?", a:"Den Austausch von Waren und Dienstleistungen zwischen verschiedenen Ländern — Export bezeichnet den Verkauf ins Ausland, Import den Kauf aus dem Ausland."},
  {cat:'wiso', sub:'wirtschaft', q:"Was ist die Handelsbilanz eines Landes?", a:"Die Gegenüberstellung von Exporten und Importen eines Landes innerhalb eines Zeitraums; ein Überschuss der Exporte über die Importe wird als positive Handelsbilanz (Außenhandelsüberschuss) bezeichnet."},
  {cat:'wiso', sub:'steuern', q:"Was sind Minijobs sozialversicherungsrechtlich?", a:"Geringfügige Beschäftigungen bis zu einer bestimmten monatlichen Verdienstgrenze, die für den Arbeitnehmer weitgehend von der Sozialversicherungspflicht befreit sind; der Arbeitgeber zahlt jedoch Pauschalabgaben."},
  {cat:'wiso', sub:'arbeitsrecht', q:"Was regelt das Entgeltfortzahlungsgesetz?", a:"Es sichert Arbeitnehmern im Krankheitsfall für bis zu 6 Wochen die Fortzahlung des Arbeitsentgelts durch den Arbeitgeber, sofern bestimmte Voraussetzungen (z. B. Mindestbeschäftigungsdauer) erfüllt sind."},
  {cat:'wiso', sub:'steuern', q:"Was ist eine betriebliche Altersvorsorge (bAV)?", a:"Eine zusätzliche, vom Arbeitgeber organisierte oder ermöglichte Form der Altersversorgung, die die gesetzliche Rente ergänzen soll, z. B. über Entgeltumwandlung."},
  {cat:'wiso', sub:'steuern', q:"Was versteht man unter dem Arbeitgeberzuschuss zur betrieblichen Altersvorsorge?", a:"Ein gesetzlich vorgeschriebener Zuschuss, den der Arbeitgeber bei Entgeltumwandlung zusätzlich in die betriebliche Altersvorsorge einzahlen muss, da er durch die Umwandlung Sozialversicherungsbeiträge einspart."},
  {cat:'wiso', sub:'unternehmen', q:"Was ist der Unterschied zwischen einer Aktiengesellschaft (AG) und einer GmbH bezüglich der Organe?", a:"Bei der AG gibt es zwingend Vorstand, Aufsichtsrat und Hauptversammlung. Bei der GmbH sind Geschäftsführung und Gesellschafterversammlung Pflichtorgane, ein Aufsichtsrat ist meist nur ab einer bestimmten Unternehmensgröße vorgeschrieben."},
  {cat:'wiso', sub:'unternehmen', q:"Was ist eine Hauptversammlung bei einer AG?", a:"Das oberste Organ der Aktiengesellschaft, in dem die Aktionäre über zentrale Angelegenheiten (z. B. Gewinnverwendung, Wahl des Aufsichtsrats, Satzungsänderungen) entscheiden."},
  {cat:'wiso', sub:'tarif', q:"Was bedeutet Mitbestimmung auf Unternehmensebene (z. B. im Aufsichtsrat)?", a:"Arbeitnehmervertreter erhalten (je nach Unternehmensgröße und Mitbestimmungsgesetz) Sitze im Aufsichtsrat und können so auf unternehmerische Grundsatzentscheidungen Einfluss nehmen."},
  {cat:'wiso', sub:'wirtschaft', q:"Was ist der Unterschied zwischen Real- und Nominallohn?", a:"Der Nominallohn ist der in Geld ausgezahlte Betrag. Der Reallohn beschreibt die tatsächliche Kaufkraft dieses Betrags unter Berücksichtigung der Inflation."},
  {cat:'wiso', sub:'wirtschaft', q:"Was ist eine Volkswirtschaftliche Gesamtrechnung (VGR)?", a:"Ein statistisches System, das die wirtschaftliche Leistung und die Wertschöpfung einer Volkswirtschaft über einen Zeitraum erfasst, u. a. zur Berechnung des BIP."},
  {cat:'wiso', sub:'wirtschaft', q:"Was versteht man unter sozialer Marktwirtschaft?", a:"Ein Wirtschaftssystem, das die Freiheit des Marktes (Angebot und Nachfrage, Wettbewerb) mit sozialem Ausgleich durch den Staat verbindet, z. B. durch Sozialversicherungen und Arbeitnehmerschutzrechte."},
  {cat:'wiso', sub:'tarif', q:"Was ist der Unterschied zwischen Streik und Aussperrung hinsichtlich der Initiative?", a:"Der Streik ist eine Arbeitskampfmaßnahme der Arbeitnehmerseite (organisiert durch Gewerkschaften), die Aussperrung eine Gegenmaßnahme der Arbeitgeberseite."},
  // ================= Entwicklung & Umsetzung von Algorithmen =================
  {cat:'algo', sub:'sql', q:"Was ist der Fehler in diesem UPDATE-Statement?", a:"Es fehlt eine WHERE-Klausel — ohne sie wird nachname bei ALLEN Zeilen der Tabelle kunden auf 'Müller' gesetzt, nicht nur bei einem bestimmten Kunden.", qCode:"UPDATE kunden\nSET nachname = 'Müller';", aCode:"UPDATE kunden\nSET nachname = 'Müller'\nWHERE kunden_id = 17;"},
  {cat:'algo', sub:'sql', q:"Ist dieses Statement wahrscheinlich ein Fehler — und warum?", a:"Ohne WHERE-Klausel löscht DELETE FROM bestellungen ALLE Zeilen der Tabelle. Das ist fast immer ein Fehler, wenn nicht wirklich die ganze Tabelle geleert werden soll.", qCode:"DELETE FROM bestellungen;", aCode:"DELETE FROM bestellungen\nWHERE status = 'storniert';\n-- oder, falls wirklich ALLE Zeilen weg sollen:\nTRUNCATE TABLE bestellungen;"},
  {cat:'algo', sub:'sql', q:"Warum schlägt dieses INSERT-Statement fehl?", a:"Die Spaltenliste nennt 3 Spalten (vorname, nachname, plz), aber es werden nur 2 Werte angegeben — für jede genannte Spalte muss genau ein Wert folgen.", qCode:"INSERT INTO kunden (vorname, nachname, plz)\nVALUES ('Anna', 'Schmidt');", aCode:"INSERT INTO kunden (vorname, nachname, plz)\nVALUES ('Anna', 'Schmidt', '10115');"},
  {cat:'algo', sub:'sql', q:"Warum liefert diese Abfrage nie ein Ergebnis, selbst wenn austrittsdatum leer ist?", a:"NULL steht für \"unbekannt\" und kann nicht mit = verglichen werden — x = NULL ergibt immer NULL (nicht wahr), nie TRUE.", qCode:"SELECT * FROM mitarbeiter\nWHERE austrittsdatum = NULL;", aCode:"SELECT * FROM mitarbeiter\nWHERE austrittsdatum IS NULL;"},
  {cat:'algo', sub:'sql', q:"Was ist an diesem Statement problematisch?", a:"nachname wird ausgewählt, steht aber nicht in GROUP BY und ist auch keine Aggregatfunktion — pro Gruppe könnten mehrere unterschiedliche nachname-Werte vorkommen.", qCode:"SELECT vorname, nachname, COUNT(*)\nFROM bestellungen\nGROUP BY vorname;", aCode:"SELECT vorname, nachname, COUNT(*)\nFROM bestellungen\nGROUP BY vorname, nachname;"},
  {cat:'algo', sub:'sql', q:"Was fehlt hier, und was ist die Folge?", a:"Es fehlt die ON- bzw. USING-Bedingung des JOINs. In den meisten Datenbanksystemen (z. B. PostgreSQL, Oracle, SQL Server) ist ein JOIN ohne Bedingung ein Syntaxfehler, da ON oder USING zwingend vorgeschrieben ist. Einige Systeme wie MySQL akzeptieren es dagegen und werten es als kartesisches Produkt: jede Zeile aus a wird mit jeder Zeile aus b kombiniert, statt gezielt verknüpft zu werden.", qCode:"SELECT a.name, b.name\nFROM mitarbeiter a\nJOIN abteilung b;", aCode:"SELECT a.name, b.name\nFROM mitarbeiter a\nJOIN abteilung b ON a.abteilung_id = b.id;"},
  {cat:'algo', sub:'sql', q:"Warum verursacht diese Abfrage einen Syntaxfehler?", a:"Das schließende einfache Anführungszeichen nach München fehlt — das String-Literal ist nicht korrekt abgeschlossen.", qCode:"SELECT name FROM kunden WHERE ort = 'München;", aCode:"SELECT name FROM kunden WHERE ort = 'München';"},
  {cat:'algo', sub:'sql', q:"Warum funktioniert dieses Statement nicht direkt so?", a:"Aggregatfunktionen wie AVG() dürfen nicht direkt in WHERE stehen, da WHERE vor der Aggregation ausgewertet wird. Lösung: eine Subquery verwenden.", qCode:"SELECT name, gehalt\nFROM mitarbeiter\nWHERE gehalt > AVG(gehalt);", aCode:"SELECT name, gehalt\nFROM mitarbeiter\nWHERE gehalt > (SELECT AVG(gehalt) FROM mitarbeiter);"},
