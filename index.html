  {cat:'algo', sub:'sql', q:"Was ist an diesem Statement syntaktisch falsch?", a:"Ein UPDATE darf nur eine SET-Klausel haben; mehrere Spalten werden durch Komma getrennt in derselben SET-Klausel gesetzt, vor der WHERE-Klausel.", qCode:"UPDATE produkte\nSET preis = preis * 1.1\nWHERE kategorie = 'Elektronik'\nSET lagerbestand = lagerbestand - 1;", aCode:"UPDATE produkte\nSET preis = preis * 1.1,\n    lagerbestand = lagerbestand - 1\nWHERE kategorie = 'Elektronik';"},
  {cat:'algo', sub:'sql', q:"Ist dieses Statement falsch? Was unterscheidet es von einem expliziten JOIN?", a:"Syntaktisch gültig (impliziter JOIN über Komma mit Bedingung in WHERE) und liefert dasselbe wie ein INNER JOIN — gilt aber als schlechter Stil, da die Join-Bedingung leicht vergessen werden kann.", qCode:"SELECT * FROM kunden, bestellungen\nWHERE kunden.id = bestellungen.kunden_id;", aCode:"SELECT *\nFROM kunden\nJOIN bestellungen ON kunden.id = bestellungen.kunden_id;"},
  {cat:'algo', sub:'sql', q:"Welches Risiko birgt dieses INSERT-Statement, auch wenn es aktuell funktioniert?", a:"Ohne explizite Spaltenliste verlässt sich das Statement auf die physische Spaltenreihenfolge der Tabelle. Ändert sich diese später, landen Werte in den falschen Spalten, ohne dass sofort ein Fehler auftritt.", qCode:"INSERT INTO kunden VALUES ('Lisa', 'Berlin');", aCode:"INSERT INTO kunden (vorname, stadt)\nVALUES ('Lisa', 'Berlin');"},
  {cat:'algo', sub:'sql', q:"Unter welcher Bedingung schlägt dieses Statement zur Laufzeit fehl?", a:"Liefert die Subquery mehr als eine Zeile (z. B. mehrere Abteilungen mit demselben Namen), schlägt der Vergleich mit = fehl, da = nur einen einzelnen Wert erwartet.", qCode:"SELECT nachname\nFROM mitarbeiter\nWHERE abteilung_id = (\n  SELECT id FROM abteilung WHERE name = 'Vertrieb'\n);", aCode:"SELECT nachname\nFROM mitarbeiter\nWHERE abteilung_id IN (\n  SELECT id FROM abteilung WHERE name = 'Vertrieb'\n);"},
  {cat:'algo', sub:'sql', q:"Warum ist dieses Statement wahrscheinlich nicht das, was beabsichtigt war?", a:"AND bindet stärker als OR, daher wird dies als (kunden_id = 5 AND status = 'offen') OR status = 'storniert' ausgewertet — dadurch werden auch stornierte Bestellungen ANDERER Kunden gelöscht.", qCode:"DELETE FROM bestellungen\nWHERE kunden_id = 5\n  AND status = 'offen'\n  OR status = 'storniert';", aCode:"DELETE FROM bestellungen\nWHERE kunden_id = 5\n  AND (status = 'offen' OR status = 'storniert');"},
  {cat:'algo', sub:'sql', q:"Warum kann dieses Statement bei einer bereits gefüllten Tabelle fehlschlagen?", a:"Eine neue NOT NULL-Spalte ohne Default-Wert kann für bereits existierende Zeilen keinen gültigen Wert erhalten — viele Datenbanksysteme lehnen das ohne DEFAULT ab.", qCode:"ALTER TABLE kunden\nADD COLUMN telefon VARCHAR(20) NOT NULL;", aCode:"ALTER TABLE kunden\nADD COLUMN telefon VARCHAR(20) NOT NULL DEFAULT '';"},
  {cat:'algo', sub:'sql', q:"Was ist hier falsch?", a:"Aggregatfunktionen dürfen nicht in WHERE stehen — Filterungen auf aggregierte Werte gehören in die HAVING-Klausel, die nach der Gruppierung ausgewertet wird.", qCode:"SELECT kunde_id, SUM(betrag) AS summe\nFROM bestellungen\nWHERE SUM(betrag) > 1000\nGROUP BY kunde_id;", aCode:"SELECT kunde_id, SUM(betrag) AS summe\nFROM bestellungen\nGROUP BY kunde_id\nHAVING SUM(betrag) > 1000;"},
  {cat:'algo', sub:'sql', q:"Was ist an der zweiten JOIN-Bedingung wahrscheinlich ein Fehler?", a:"m.id = a.id verknüpft die Mitarbeiter-ID direkt mit der Abteilungs-ID — das sind unterschiedliche Entitäten. Vermutlich sollte über ein Fremdschlüsselfeld verknüpft werden.", qCode:"SELECT *\nFROM mitarbeiter m\nJOIN gehalt g ON m.id = g.mitarbeiter_id\nJOIN abteilung a ON m.id = a.id;", aCode:"SELECT *\nFROM mitarbeiter m\nJOIN gehalt g ON m.id = g.mitarbeiter_id\nJOIN abteilung a ON m.abteilung_id = a.id;"},
  {cat:'algo', sub:'sql', q:"Welcher Syntaxfehler steckt in diesem CREATE TABLE-Statement?", a:"Zwischen den Spaltendefinitionen datum DATE und betrag DECIMAL(10,2) fehlt ein Komma als Trennzeichen.", qCode:"CREATE TABLE bestellungen (\n  id INT PRIMARY KEY,\n  kunde_id INT,\n  datum DATE\n  betrag DECIMAL(10,2)\n);", aCode:"CREATE TABLE bestellungen (\n  id INT PRIMARY KEY,\n  kunde_id INT,\n  datum DATE,\n  betrag DECIMAL(10,2)\n);"},
  {cat:'algo', sub:'sql', q:"Was ist an diesem Statement syntaktisch falsch?", a:"Nach 500 steht ein überflüssiges Komma vor der schließenden Klammer — das ist ein Syntaxfehler.", qCode:"SELECT name FROM kunden\nWHERE id IN (\n  SELECT kunde_id FROM bestellungen WHERE betrag > 500,\n);", aCode:"SELECT name FROM kunden\nWHERE id IN (\n  SELECT kunde_id FROM bestellungen WHERE betrag > 500\n);"},
  {cat:'algo', sub:'sql', q:"Warum liefert diese Abfrage vermutlich viel mehr Zeilen als erwartet?", a:"Es fehlt jede Verknüpfungsbedingung zwischen den beiden Tabellen — das Ergebnis ist ein kartesisches Produkt: jede Zeile aus mitarbeiter wird mit jeder Zeile aus abteilung kombiniert.", qCode:"SELECT name, abteilung\nFROM mitarbeiter, abteilung;", aCode:"SELECT name, abteilung\nFROM mitarbeiter\nJOIN abteilung ON mitarbeiter.abteilung_id = abteilung.id;"},
  {cat:'algo', sub:'sql', q:"Diese beiden Überweisungs-Statements laufen einzeln ohne Fehler — was fehlt trotzdem für den sicheren Praxiseinsatz?", a:"Eine Transaktion um beide Statements herum. Ohne sie könnte z. B. nach dem ersten UPDATE ein Systemabsturz passieren — Geld wird abgebucht, aber nie gutgeschrieben. Das verletzt die Atomicity (A in ACID).", qCode:"UPDATE konto SET saldo = saldo - 100 WHERE konto_id = 1;\nUPDATE konto SET saldo = saldo + 100 WHERE konto_id = 2;", aCode:"BEGIN TRANSACTION;\nUPDATE konto SET saldo = saldo - 100 WHERE konto_id = 1;\nUPDATE konto SET saldo = saldo + 100 WHERE konto_id = 2;\nCOMMIT;"},
  // ================= Planen eines Softwareproduktes =================
  {cat:'plan', sub:'uml', q:"Was zeigt dieses Diagramm, und was bedeutet die Multiplizität \"0..*\" auf der Seite von Bestellung?", a:"Es zeigt eine Assoziation zwischen den Klassen Kunde und Bestellung. Die Multiplizität 1 auf der Kunde-Seite und 0..* auf der Bestellung-Seite bedeutet: Ein Kunde kann keine, eine oder mehrere Bestellungen haben, aber jede Bestellung gehört zu genau einem Kunden.", qSvg:"<svg viewBox=\"0 0 360 110\" xmlns=\"http://www.w3.org/2000/svg\"><style>text{font-family:'JetBrains Mono',monospace;}.box{fill:var(--card);stroke:var(--ink);stroke-width:1.2;}.lbl{font-size:12px;fill:var(--ink);font-weight:600;}.mult{font-size:10px;fill:var(--ink-soft);}.conn{stroke:var(--ink-soft);stroke-width:1.2;}</style><rect class=\"box\" x=\"15\" y=\"30\" width=\"110\" height=\"40\" rx=\"2\"/><text class=\"lbl\" x=\"70\" y=\"54\" text-anchor=\"middle\">Kunde</text><rect class=\"box\" x=\"235\" y=\"30\" width=\"110\" height=\"40\" rx=\"2\"/><text class=\"lbl\" x=\"290\" y=\"54\" text-anchor=\"middle\">Bestellung</text><line class=\"conn\" x1=\"125\" y1=\"50\" x2=\"235\" y2=\"50\"/><text class=\"mult\" x=\"133\" y=\"44\">1</text><text class=\"mult\" x=\"200\" y=\"44\">0..*</text></svg>"},
  {cat:'plan', sub:'uml', q:"Welche der beiden Beziehungen ist die Aggregation und welche die Komposition — und woran erkennt man den Unterschied in der Notation?", a:"Links (offene, nicht gefüllte Raute) steht die Aggregation: Ein Rad kann unabhängig vom Fahrzeug existieren. Rechts (gefüllte Raute) steht die Komposition: Ein Zimmer ist existenzabhängig vom Haus — wird das Haus abgerissen, verschwindet auch das Zimmer als Teil davon.", qSvg:"<svg viewBox=\"0 0 410 110\" xmlns=\"http://www.w3.org/2000/svg\"><style>text{font-family:'JetBrains Mono',monospace;}.box{fill:var(--card);stroke:var(--ink);stroke-width:1.2;}.lbl{font-size:11px;fill:var(--ink);font-weight:600;}.cap{font-size:10px;fill:var(--ink-soft);}.conn{stroke:var(--ink-soft);stroke-width:1.2;}</style><text class=\"cap\" x=\"10\" y=\"14\">Aggregation (offene Raute)</text><rect class=\"box\" x=\"10\" y=\"45\" width=\"90\" height=\"34\" rx=\"2\"/><text class=\"lbl\" x=\"55\" y=\"66\" text-anchor=\"middle\">Fahrzeug</text><polygon points=\"108,72 118,66 128,72 118,78\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><line class=\"conn\" x1=\"100\" y1=\"72\" x2=\"108\" y2=\"72\"/><line class=\"conn\" x1=\"128\" y1=\"72\" x2=\"138\" y2=\"72\"/><rect class=\"box\" x=\"138\" y=\"55\" width=\"60\" height=\"34\" rx=\"2\"/><text class=\"lbl\" x=\"168\" y=\"76\" text-anchor=\"middle\">Rad</text><text class=\"cap\" x=\"210\" y=\"14\">Komposition (gefüllte Raute)</text><rect class=\"box\" x=\"210\" y=\"45\" width=\"80\" height=\"34\" rx=\"2\"/><text class=\"lbl\" x=\"250\" y=\"66\" text-anchor=\"middle\">Haus</text><polygon points=\"298,72 308,66 318,72 308,78\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><line class=\"conn\" x1=\"290\" y1=\"72\" x2=\"298\" y2=\"72\"/><line class=\"conn\" x1=\"318\" y1=\"72\" x2=\"328\" y2=\"72\"/><rect class=\"box\" x=\"328\" y=\"55\" width=\"70\" height=\"34\" rx=\"2\"/><text class=\"lbl\" x=\"363\" y=\"76\" text-anchor=\"middle\">Zimmer</text></svg>"},
  {cat:'plan', sub:'uml', q:"Was drückt dieser Pfeil mit der offenen, nicht gefüllten Dreiecksspitze zwischen Auto und Fahrzeug aus?", a:"Er zeigt eine Generalisierung/Vererbung: Auto ist eine Spezialisierung von Fahrzeug (\"Auto ist ein Fahrzeug\"). Der Pfeil zeigt dabei immer von der Unterklasse zur Oberklasse.", qSvg:"<svg viewBox=\"0 0 220 170\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"genArrow\" markerWidth=\"14\" markerHeight=\"12\" refX=\"11\" refY=\"6\" orient=\"auto\"><path d=\"M0,0 L12,6 L0,12 Z\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1\"/></marker></defs><style>text{font-family:'JetBrains Mono',monospace;}.box{fill:var(--card);stroke:var(--ink);stroke-width:1.2;}.lbl{font-size:12px;fill:var(--ink);font-weight:600;}</style><rect class=\"box\" x=\"55\" y=\"15\" width=\"110\" height=\"36\" rx=\"2\"/><text class=\"lbl\" x=\"110\" y=\"38\" text-anchor=\"middle\">Fahrzeug</text><rect class=\"box\" x=\"55\" y=\"118\" width=\"110\" height=\"36\" rx=\"2\"/><text class=\"lbl\" x=\"110\" y=\"141\" text-anchor=\"middle\">Auto</text><line x1=\"110\" y1=\"118\" x2=\"110\" y2=\"58\" stroke=\"var(--ink)\" stroke-width=\"1.3\" marker-end=\"url(#genArrow)\"/></svg>"},
  {cat:'plan', sub:'uml', q:"Was bedeutet die gestrichelte Verbindung mit der Beschriftung «include» zwischen den beiden Anwendungsfällen?", a:"Der Anwendungsfall \"Bestellung aufgeben\" schließt \"Zahlung prüfen\" zwingend mit ein — jedes Mal, wenn \"Bestellung aufgeben\" ausgeführt wird, läuft automatisch auch \"Zahlung prüfen\" mit. Die Pfeilspitze zeigt dabei vom Basis-Anwendungsfall zum eingeschlossenen Anwendungsfall. Das unterscheidet «include» von «extend», wo die Einbindung nur optional erfolgt.", qSvg:"<svg viewBox=\"0 0 380 190\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"incArrow\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1\"/></marker></defs><style>text{font-family:'JetBrains Mono',monospace;font-size:11px;fill:var(--ink);}.cap{font-size:9px;fill:var(--ink-soft);}.oval{fill:var(--card);stroke:var(--ink);stroke-width:1.2;}.conn{stroke:var(--ink-soft);stroke-width:1.2;fill:none;}.person{stroke:var(--ink);stroke-width:1.3;fill:none;}</style><circle class=\"person\" cx=\"30\" cy=\"40\" r=\"9\"/><line class=\"person\" x1=\"30\" y1=\"49\" x2=\"30\" y2=\"80\"/><line class=\"person\" x1=\"14\" y1=\"60\" x2=\"46\" y2=\"60\"/><line class=\"person\" x1=\"30\" y1=\"80\" x2=\"16\" y2=\"105\"/><line class=\"person\" x1=\"30\" y1=\"80\" x2=\"44\" y2=\"105\"/><text x=\"10\" y=\"120\">Kunde</text><ellipse class=\"oval\" cx=\"220\" cy=\"55\" rx=\"100\" ry=\"30\"/><text x=\"220\" y=\"59\" text-anchor=\"middle\">Bestellung aufgeben</text><ellipse class=\"oval\" cx=\"220\" cy=\"150\" rx=\"95\" ry=\"30\"/><text x=\"220\" y=\"154\" text-anchor=\"middle\">Zahlung prüfen</text><line class=\"conn\" x1=\"46\" y1=\"55\" x2=\"120\" y2=\"55\"/><line x1=\"220\" y1=\"85\" x2=\"220\" y2=\"118\" stroke=\"var(--ink-soft)\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\" marker-end=\"url(#incArrow)\"/><text class=\"cap\" x=\"226\" y=\"105\">«include»</text></svg>"},
  {cat:'plan', sub:'uml', q:"Was ist der Unterschied zwischen dem durchgezogenen und dem gestrichelten Pfeil in diesem Sequenzdiagramm?", a:"Der durchgezogene Pfeil (bestellen()) ist ein synchroner Nachrichtenaufruf vom Kunden an den Webshop. Der gestrichelte Pfeil (Bestätigung) ist die zugehörige Rückantwort (Return-Nachricht) vom Webshop zurück an den Kunden.", qSvg:"<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"seqArrow1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"var(--ink)\"/></marker><marker id=\"seqArrow2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1\"/></marker></defs><style>text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:var(--ink);}.box{fill:var(--card);stroke:var(--ink);stroke-width:1.2;}.life{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:3 3;}</style><rect class=\"box\" x=\"20\" y=\"8\" width=\"80\" height=\"28\" rx=\"2\"/><text x=\"60\" y=\"26\" text-anchor=\"middle\">Kunde</text><rect class=\"box\" x=\"220\" y=\"8\" width=\"80\" height=\"28\" rx=\"2\"/><text x=\"260\" y=\"26\" text-anchor=\"middle\">Webshop</text><line class=\"life\" x1=\"60\" y1=\"36\" x2=\"60\" y2=\"165\"/><line class=\"life\" x1=\"260\" y1=\"36\" x2=\"260\" y2=\"165\"/><line x1=\"60\" y1=\"70\" x2=\"258\" y2=\"70\" stroke=\"var(--ink)\" stroke-width=\"1.3\" marker-end=\"url(#seqArrow1)\"/><text x=\"70\" y=\"64\">bestellen()</text><line x1=\"260\" y1=\"120\" x2=\"62\" y2=\"120\" stroke=\"var(--ink)\" stroke-width=\"1.1\" stroke-dasharray=\"5 3\" marker-end=\"url(#seqArrow2)\"/><text x=\"100\" y=\"114\">Bestätigung</text></svg>"},
  {cat:'plan', sub:'uml', q:"Wie liest man die Kardinalitäten 1 und n in diesem ER-Diagramm zwischen Autor und Buch?", a:"Ein Autor (1) kann n Bücher schreiben, aber jedes Buch wird in diesem Modell genau einem Autor zugeordnet — es handelt sich um eine 1:n-Beziehung zwischen Autor und Buch.", qSvg:"<svg viewBox=\"0 0 360 120\" xmlns=\"http://www.w3.org/2000/svg\"><style>text{font-family:'JetBrains Mono',monospace;}.box{fill:var(--card);stroke:var(--ink);stroke-width:1.2;}.lbl{font-size:12px;fill:var(--ink);font-weight:600;}.mult{font-size:10px;fill:var(--ink-soft);}.conn{stroke:var(--ink-soft);stroke-width:1.2;}.rel{fill:var(--paper-2);stroke:var(--ink);stroke-width:1.2;}</style><rect class=\"box\" x=\"15\" y=\"35\" width=\"90\" height=\"40\" rx=\"2\"/><text class=\"lbl\" x=\"60\" y=\"59\" text-anchor=\"middle\">Autor</text><polygon class=\"rel\" points=\"180,35 220,55 180,75 140,55\"/><text class=\"lbl\" x=\"180\" y=\"59\" text-anchor=\"middle\" font-size=\"10\">schreibt</text><rect class=\"box\" x=\"255\" y=\"35\" width=\"90\" height=\"40\" rx=\"2\"/><text class=\"lbl\" x=\"300\" y=\"59\" text-anchor=\"middle\">Buch</text><line class=\"conn\" x1=\"105\" y1=\"55\" x2=\"140\" y2=\"55\"/><line class=\"conn\" x1=\"220\" y1=\"55\" x2=\"255\" y2=\"55\"/><text class=\"mult\" x=\"112\" y=\"48\">1</text><text class=\"mult\" x=\"235\" y=\"48\">n</text></svg>"},
  // ================= Entwicklung & Umsetzung von Algorithmen =================
  {cat:'algo', sub:'oop', q:"Was gibt dieses Programm aus, und warum (Stichwort: Polymorphismus)?", a:"Es gibt \"Wuff!\" aus. Obwohl die Variable t vom Typ Tier deklariert ist, zeigt sie zur Laufzeit auf ein Hund-Objekt. Bei überschriebenen Methoden entscheidet der tatsächliche (dynamische) Typ des Objekts, welche Methode ausgeführt wird — nicht der deklarierte Typ der Variablen.", qCode:"class Tier {\n    void sprich() { System.out.println(\"Ein Tier macht ein Geräusch\"); }\n}\nclass Hund extends Tier {\n    void sprich() { System.out.println(\"Wuff!\"); }\n}\npublic class Test {\n    public static void main(String[] args) {\n        Tier t = new Hund();\n        t.sprich();\n    }\n}"},
  {cat:'algo', sub:'oop', q:"Wozu wird hier das Schlüsselwort this benötigt?", a:"Der Konstruktor-Parameter heißt genauso wie das Attribut (saldo). this.saldo verweist explizit auf das Objektattribut, saldo (ohne this) auf den lokalen Parameter — ohne this würde sich das Attribut selbst zugewiesen und der übergebene Wert ginge verloren.", qCode:"class Konto {\n    private double saldo;\n    public Konto(double saldo) {\n        this.saldo = saldo;\n    }\n    public double getSaldo() {\n        return saldo;\n    }\n}"},
  {cat:'algo', sub:'oop', q:"Ist das Überladen oder Überschreiben — und woran erkennt man das?", a:"Das ist Überladen (Overloading): Zwei Methoden mit demselben Namen (addiere) in derselben Klasse, aber mit unterschiedlicher Parameterliste (int vs. double). Überschreiben würde eine geerbte Methode in einer Unterklasse mit identischer Signatur betreffen.", qCode:"class Rechner {\n    int addiere(int a, int b) { return a + b; }\n    double addiere(double a, double b) { return a + b; }\n}"},
  {cat:'algo', sub:'oop', q:"Was ist aus Sicht der Kapselung an dieser Klasse problematisch?", a:"Die Attribute sind nicht als private deklariert und damit von außen direkt les- und veränderbar (z. B. mitarbeiter.gehalt = -500;), ohne jede Kontrolle. Korrekt wäre: private Attribute mit öffentlichen Getter-/Setter-Methoden, die z. B. ungültige Werte abfangen können.", qCode:"class Mitarbeiter {\n    String name;\n    double gehalt;\n}"},
  {cat:'algo', sub:'oop', q:"Warum lässt sich dieser Code nicht kompilieren?", a:"Eine abstrakte Klasse kann nicht direkt mit new instanziiert werden — sie dient nur als Vorlage für konkrete Unterklassen, die alle abstrakten Methoden implementieren. new Form() muss durch eine konkrete Unterklasse ersetzt werden, z. B. new Kreis().", qCode:"abstract class Form {\n    abstract double flaeche();\n}\npublic class Test {\n    public static void main(String[] args) {\n        Form f = new Form();\n    }\n}"},
  {cat:'algo', sub:'oop', q:"Warum kompiliert diese Klasse nicht?", a:"Rechnung implementiert das Interface Bezahlbar, setzt aber nicht alle seine Methoden um — storniere() fehlt. Eine Klasse, die ein Interface implementiert, muss zwingend ALLE darin deklarierten Methoden konkret implementieren (sofern sie nicht selbst abstrakt ist).", qCode:"interface Bezahlbar {\n    void bezahle(double betrag);\n    void storniere();\n}\nclass Rechnung implements Bezahlbar {\n    public void bezahle(double betrag) {\n        System.out.println(\"Bezahlt: \" + betrag);\n    }\n}"},
  {cat:'algo', sub:'oop', q:"Was wird hier ausgegeben, und warum?", a:"3. Da anzahl als static deklariert ist, existiert sie nur einmal für die gesamte Klasse (nicht pro Objekt) und wird bei jedem Aufruf des Konstruktors (also bei jeder Objekterzeugung) um 1 erhöht — alle drei erzeugten Objekte teilen sich dieselbe Variable.", qCode:"class Zaehler {\n    static int anzahl = 0;\n    Zaehler() {\n        anzahl++;\n    }\n}\npublic class Test {\n    public static void main(String[] args) {\n        new Zaehler();\n        new Zaehler();\n        new Zaehler();\n        System.out.println(Zaehler.anzahl);\n    }\n}"},
  {cat:'algo', sub:'oop', q:"Was gibt new Auto(\"VW\") aus, und was bewirkt super(marke) hier?", a:"Ausgabe: \"Fahrzeug: VW\" gefolgt von \"Auto erstellt\". super(marke) ruft explizit den Konstruktor der Oberklasse Fahrzeug auf, bevor der Rest des Auto-Konstruktors ausgeführt wird — so wird sichergestellt, dass die Oberklasse korrekt initialisiert wird.", qCode:"class Fahrzeug {\n    Fahrzeug(String marke) {\n        System.out.println(\"Fahrzeug: \" + marke);\n    }\n}\nclass Auto extends Fahrzeug {\n    Auto(String marke) {\n        super(marke);\n        System.out.println(\"Auto erstellt\");\n    }\n}"},
  {cat:'algo', sub:'oop', q:"Überschreibt zeige(String x) in Abgeleitet die Methode zeige(int x) aus Basis?", a:"Nein. Da sich die Parametertypen unterscheiden (int vs. String), handelt es sich nicht um Overriding, sondern um eine zusätzliche überladene Methode. Beide Methoden existieren in Abgeleitet unabhängig nebeneinander.", qCode:"class Basis {\n    void zeige(int x) { System.out.println(\"Basis: \" + x); }\n}\nclass Abgeleitet extends Basis {\n    void zeige(String x) { System.out.println(\"Abgeleitet: \" + x); }\n}"},
  {cat:'algo', sub:'oop', q:"Warum verursacht dieser Code einen Kompilierfehler?", a:"saldo ist private und damit nur innerhalb der Klasse Konto selbst zugänglich — von außen (hier in der Klasse Test) kann nicht direkt auf k.saldo zugegriffen werden. Es wird ein öffentlicher Getter wie getSaldo() benötigt.", qCode:"class Konto {\n    private double saldo = 100.0;\n}\npublic class Test {\n    public static void main(String[] args) {\n        Konto k = new Konto();\n        System.out.println(k.saldo);\n    }\n}"},
  {cat:'algo', sub:'oop', q:"Was wird hier ungefähr ausgegeben, und wie könnte man eine lesbarere Ausgabe erreichen?", a:"Ohne eigene Implementierung gibt System.out.println(p) etwas wie Punkt@1b6d3586 aus (Klassenname + Hashcode) — die geerbte Standard-toString()-Methode von Object. Für eine lesbare Ausgabe (z. B. \"Punkt(3, 4)\") müsste die Klasse Punkt die Methode toString() überschreiben.", qCode:"class Punkt {\n    int x, y;\n    Punkt(int x, int y) { this.x = x; this.y = y; }\n}\npublic class Test {\n    public static void main(String[] args) {\n        Punkt p = new Punkt(3, 4);\n        System.out.println(p);\n    }\n}"},
  {cat:'algo', sub:'oop', q:"Gibt dieser Code true oder false aus, obwohl p1 und p2 dieselben Koordinaten haben?", a:"false. Ohne überschriebene equals()-Methode vergleicht die geerbte Standardimplementierung aus Object nur die Objektreferenzen (Identität) — p1 und p2 sind zwei unterschiedliche Objekte im Speicher, auch wenn ihre Attributwerte gleich sind.", qCode:"class Punkt {\n    int x, y;\n    Punkt(int x, int y) { this.x = x; this.y = y; }\n}\npublic class Test {\n    public static void main(String[] args) {\n        Punkt p1 = new Punkt(1, 2);\n        Punkt p2 = new Punkt(1, 2);\n        System.out.println(p1.equals(p2));\n    }\n}"},
  {cat:'algo', sub:'pseudocode', q:"Was gibt dieser Pseudocode am Ende aus?", a:"10 (0 + 1 + 2 + 3 + 4). Die kopfgesteuerte SOLANGE-Schleife durchläuft i = 0 bis 4 (5 Durchläufe, da bei i = 5 die Bedingung i < 5 nicht mehr erfüllt ist) und summiert dabei alle Werte von i auf.", qCode:"i := 0\nsumme := 0\nSOLANGE i < 5 TUE\n    summe := summe + i\n    i := i + 1\nENDSOLANGE\nAUSGABE summe"},
  {cat:'algo', sub:'rekursion', q:"Was gibt fakultaet(4) zurück? Gehe die Rekursion Schritt für Schritt durch.", a:"24. fakultaet(4) = 4 * fakultaet(3) = 4 * 3 * fakultaet(2) = 4 * 3 * 2 * fakultaet(1) = 4 * 3 * 2 * 1 = 24 — der Basisfall n <= 1 liefert 1 und beendet die Rekursion.", qCode:"FUNKTION fakultaet(n)\n    WENN n <= 1 DANN\n        RÜCKGABE 1\n    SONST\n        RÜCKGABE n * fakultaet(n - 1)\n    ENDWENN\nENDFUNKTION\n\nAUSGABE fakultaet(4)"},
  {cat:'algo', sub:'ds', q:"Welcher Laufzeitfehler tritt hier auf, und warum?", a:"ArrayIndexOutOfBoundsException. Das Array hat 3 Elemente mit den gültigen Indizes 0, 1, 2 (zahlen.length ist 3). Durch i <= zahlen.length wird beim letzten Durchlauf i = 3 erreicht, also ein Index außerhalb des gültigen Bereichs — richtig wäre i < zahlen.length.", qCode:"int[] zahlen = {10, 20, 30};\nfor (int i = 0; i <= zahlen.length; i++) {\n    System.out.println(zahlen[i]);\n}"},
  {cat:'algo', sub:'oop', q:"Gibt dieser Code true oder false aus — und warum ist das für Anfänger oft überraschend?", a:"false. == vergleicht bei Objekten (wie String) die Referenzen, nicht den Inhalt. a und b sind hier zwei unterschiedliche String-Objekte mit demselben Inhalt. Für einen inhaltlichen Vergleich muss a.equals(b) verwendet werden, was hier true ergäbe.", qCode:"String a = new String(\"Hallo\");\nString b = new String(\"Hallo\");\nSystem.out.println(a == b);"},
  {cat:'algo', sub:'oop', q:"Warum funktioniert der Zugriff auf wert in Abgeleitet, obwohl es nicht public ist?", a:"protected erlaubt den Zugriff innerhalb derselben Klasse, desselben Pakets UND durch Unterklassen (auch in anderen Paketen). Da Abgeleitet von Basis erbt, darf sie auf das protected-Attribut wert zugreifen.", qCode:"class Basis {\n    protected int wert = 10;\n}\nclass Abgeleitet extends Basis {\n    void zeige() {\n        System.out.println(wert);\n    }\n}"},
  {cat:'algo', sub:'oop', q:"Dieser Code kompiliert, obwohl Person die Methode sagHallo() nicht selbst implementiert — warum?", a:"Seit Java 8 können Interfaces default-Methoden mit einer Standardimplementierung enthalten. Eine implementierende Klasse erbt diese Implementierung automatisch, wenn sie sie nicht selbst überschreibt — Person nutzt also die Standardimplementierung aus dem Interface.", qCode:"interface Begruessung {\n    default void sagHallo() {\n        System.out.println(\"Hallo!\");\n    }\n}\nclass Person implements Begruessung {}\npublic class Test {\n    public static void main(String[] args) {\n        new Person().sagHallo();\n    }\n}"},
  {cat:'algo', sub:'oop', q:"Warum verursacht die Methode aendere() einen Kompilierfehler?", a:"MWST ist als final deklariert — einmal zugewiesen, kann der Wert nicht mehr geändert werden. Der Versuch, MWST erneut einen Wert zuzuweisen, ist ein Kompilierfehler.", qCode:"class Konstanten {\n    final double MWST = 0.19;\n    void aendere() {\n        MWST = 0.20;\n    }\n}"},
  {cat:'algo', sub:'oop', q:"In welcher Reihenfolge wird hier ausgegeben, und warum?", a:"Zuerst \"A\", dann \"B\". Auch ohne explizites super() ruft Java automatisch den (parameterlosen) Konstruktor der Oberklasse zuerst auf, bevor der Code des Unterklassen-Konstruktors ausgeführt wird — die Oberklasse muss vollständig initialisiert sein, bevor die Unterklasse aufgebaut wird.", qCode:"class A {\n    A() { System.out.println(\"A\"); }\n}\nclass B extends A {\n    B() { System.out.println(\"B\"); }\n}\npublic class Test {\n    public static void main(String[] args) {\n        new B();\n    }\n}"},
  {cat:'algo', sub:'netz', q:"Welche HTTP-Methode wird in einer REST-API typischerweise zum Erstellen einer neuen Ressource verwendet?", a:"POST — sie wird verwendet, um eine neue Ressource zu erstellen, z. B. POST /kunden, um einen neuen Kunden anzulegen. GET dient dem Lesen, PUT/PATCH dem Aktualisieren und DELETE dem Löschen einer Ressource."},
  {cat:'algo', sub:'netz', q:"Was bedeutet \"zustandslos\" (stateless) als Grundprinzip von REST?", a:"Jede Anfrage an den Server muss alle notwendigen Informationen enthalten, um verarbeitet zu werden — der Server speichert keinen Sitzungszustand (Session) zwischen einzelnen Anfragen eines Clients."},
  {cat:'algo', sub:'netz', q:"Was bedeutet \"idempotent\" bei einer HTTP-Methode wie PUT oder DELETE?", a:"Mehrfaches identisches Ausführen derselben Anfrage führt zum gleichen Endzustand wie ein einmaliges Ausführen. PUT /kunden/5 mehrfach mit denselben Daten aufzurufen ändert den Zustand nicht erneut — im Gegensatz z. B. zu POST, das bei jedem Aufruf eine neue Ressource anlegen kann."},
  {cat:'algo', sub:'netz', q:"Was bedeuten die HTTP-Statuscodes 200, 201, 404 und 500?", a:"200 OK: Anfrage erfolgreich verarbeitet. 201 Created: Ressource erfolgreich erstellt (typisch nach POST). 404 Not Found: angeforderte Ressource existiert nicht. 500 Internal Server Error: unerwarteter Fehler auf Serverseite."},
  {cat:'algo', sub:'netz', q:"Was unterscheidet die HTTP-Statuscodes 401 und 403?", a:"401 Unauthorized bedeutet: Der Client ist nicht (korrekt) authentifiziert (z. B. fehlende/ungültige Anmeldedaten). 403 Forbidden bedeutet: Der Client ist zwar authentifiziert, hat aber keine Berechtigung für die angeforderte Aktion/Ressource."},
  // ================= Planen eines Softwareproduktes =================
  {cat:'plan', sub:'sicherheit', q:"Was ist der Unterschied zwischen Hashing und Verschlüsselung?", a:"Verschlüsselung ist umkehrbar (mit dem passenden Schlüssel kann der ursprüngliche Klartext wiederhergestellt werden). Hashing ist eine Einwegfunktion — aus dem Hash-Wert lässt sich der ursprüngliche Wert nicht zurückrechnen. Hashing wird u. a. zur sicheren Passwortspeicherung verwendet."},

  {cat:'algo', sub:'pseudocode', q:"Was wird hier ausgegeben?", a:"15 (1+2+3+4+5). Die Zählschleife läuft von i=1 bis i=5 (jeweils einschließlich) und addiert bei jedem Durchlauf den aktuellen Wert von i zur Summe.", qCode:"summe := 0\nFÜR i VON 1 BIS 5 TUE\n    summe := summe + i\nENDFÜR\nAUSGABE summe"},

  {cat:'algo', sub:'pseudocode', q:"Welche Werte werden nacheinander ausgegeben?", a:"1, 2, 3. Die kopfgesteuerte SOLANGE-Schleife prüft die Bedingung VOR jedem Durchlauf: Bei i=1,2,3 ist i<=3 wahr, bei i=4 nicht mehr — die Schleife endet dann.", qCode:"i := 1\nSOLANGE i <= 3 TUE\n    AUSGABE i\n    i := i + 1\nENDSOLANGE"},
  {cat:'algo', sub:'pseudocode', q:"Welche Werte werden ausgegeben — und was unterscheidet diese Schleife von einer SOLANGE-Schleife?", a:"1, 2, 3 — dasselbe Ergebnis wie bei der SOLANGE-Variante. Der Unterschied: WIEDERHOLE...BIS ist fußgesteuert, die Bedingung wird ERST NACH jedem Durchlauf geprüft. Dadurch wird der Schleifenkörper immer mindestens einmal ausgeführt, selbst wenn die Bedingung von Anfang an erfüllt wäre.", qCode:"i := 1\nWIEDERHOLE\n    AUSGABE i\n    i := i + 1\nBIS i > 3"},
  {cat:'algo', sub:'pseudocode', q:"Was wird hier ausgegeben, und welches gängige Problem löst dieser Algorithmus?", a:"9. Der Algorithmus ermittelt das Maximum eines Feldes (Arrays): max wird mit 0 initialisiert und bei jedem Durchlauf aktualisiert, sobald ein größerer Wert gefunden wird.", qCode:"max := 0\nFeld := [4, 9, 2, 7, 5]\nFÜR i VON 0 BIS 4 TUE\n    WENN Feld[i] > max DANN\n        max := Feld[i]\n    ENDWENN\nENDFÜR\nAUSGABE max"},
  {cat:'algo', sub:'pseudocode', q:"Was berechnet dieser Pseudocode, und was ist das Ergebnis für n=6?", a:"Er berechnet die Fakultät von n (n!). Ergebnis: 720 (1·2·3·4·5·6 = 720).", qCode:"n := 6\nergebnis := 1\nFÜR i VON 1 BIS n TUE\n    ergebnis := ergebnis * i\nENDFÜR\nAUSGABE ergebnis"},
  {cat:'algo', sub:'pseudocode', q:"Was wird ausgegeben?", a:"12. Da a (5) nicht größer als b (12) ist, wird der SONST-Zweig ausgeführt und groesser erhält den Wert von b.", qCode:"a := 5\nb := 12\nWENN a > b DANN\n    groesser := a\nSONST\n    groesser := b\nENDWENN\nAUSGABE groesser"},
  {cat:'algo', sub:'pseudocode', q:"Wie oft wird zaehler erhöht, und was wird am Ende ausgegeben?", a:"6. Von 1 bis 20 sind 3, 6, 9, 12, 15, 18 durch 3 teilbar (i MOD 3 = 0) — das sind 6 Werte, daher wird zaehler sechsmal erhöht.", qCode:"zaehler := 0\nFÜR i VON 1 BIS 20 TUE\n    WENN i MOD 3 = 0 DANN\n        zaehler := zaehler + 1\n    ENDWENN\nENDFÜR\nAUSGABE zaehler"},
  {cat:'algo', sub:'pseudocode', q:"Welchen Wert hat x am Ende, und wie viele Schleifendurchläufe braucht es dafür?", a:"54, nach 3 Durchläufen: x=2→6 (6<20, weiter)→18 (18<20, weiter)→54 (54<20 ist falsch, Schleife endet). x wird bei jedem Durchlauf mit y (3) multipliziert, bis x nicht mehr kleiner als 20 ist.", qCode:"x := 2\ny := 3\nSOLANGE x < 20 TUE\n    x := x * y\nENDSOLANGE\nAUSGABE x"},
  {cat:'algo', sub:'pseudocode', q:"Was gibt dieser Algorithmus aus, und was passiert, wenn gesucht nicht im Feld vorkommt?", a:"3 (Index 3, da Feld[3] = 9). Würde gesucht nicht im Feld vorkommen, bliebe position bei ihrem Startwert -1 — ein üblicher Weg, \"nicht gefunden\" darzustellen, da -1 kein gültiger Feldindex ist.", qCode:"Feld := [3, 8, 1, 9, 4]\ngesucht := 9\nposition := -1\nFÜR i VON 0 BIS 4 TUE\n    WENN Feld[i] = gesucht DANN\n        position := i\n    ENDWENN\nENDFÜR\nAUSGABE position"},
  {cat:'algo', sub:'pseudocode', q:"Was wird ausgegeben?", a:"2. MOD liefert den Rest der Ganzzahldivision: 10 geteilt durch 4 ergibt 2 Rest 2.", qCode:"a := 10\nb := 4\nrest := a MOD b\nAUSGABE rest"},
  {cat:'algo', sub:'pseudocode', q:"Was berechnet dieser Pseudocode, und welchen Wert hat durchschnitt am Ende?", a:"Er berechnet den Durchschnitt aller geraden Zahlen von 1 bis 10 (2,4,6,8,10). summe = 30, anzahl = 5, durchschnitt = 30 / 5 = 6.", qCode:"summe := 0\nanzahl := 0\nFÜR i VON 1 BIS 10 TUE\n    WENN i MOD 2 = 0 DANN\n        summe := summe + i\n        anzahl := anzahl + 1\n    ENDWENN\nENDFÜR\ndurchschnitt := summe / anzahl\nAUSGABE durchschnitt"},
  {cat:'algo', sub:'pseudocode', q:"Was wird ausgegeben?", a:"\"ababab\". Bei jedem der 3 Durchläufe wird die Zeichenkette \"ab\" an text angehängt (Konkatenation), beginnend bei einem leeren String.", qCode:"text := \"\"\nFÜR i VON 1 BIS 3 TUE\n    text := text + \"ab\"\nENDFÜR\nAUSGABE text"},
  {cat:'algo', sub:'pseudocode', q:"Was macht dieser Algorithmus, und was wird für zahl = 17 ausgegeben?", a:"Er prüft, ob zahl eine Primzahl ist, indem er testet, ob sie durch irgendeine Zahl zwischen 2 und zahl-1 ohne Rest teilbar ist. Für 17 (eine Primzahl) bleibt istPrim WAHR, da keine dieser Zahlen ohne Rest teilt.", qCode:"zahl := 17\nistPrim := WAHR\nFÜR i VON 2 BIS zahl - 1 TUE\n    WENN zahl MOD i = 0 DANN\n        istPrim := FALSCH\n    ENDWENN\nENDFÜR\nAUSGABE istPrim"},
  {cat:'algo', sub:'pseudocode', q:"Was wird nacheinander ausgegeben, und welches bekannte Problem löst dieser Code?", a:"Zuerst 7, dann 3. Der Code vertauscht (swapt) die Werte von a und b mithilfe einer Hilfsvariablen hilf — ohne sie würde beim Zuweisen a := b der ursprüngliche Wert von a überschrieben und ginge verloren.", qCode:"a := 3\nb := 7\nhilf := a\na := b\nb := hilf\nAUSGABE a\nAUSGABE b"},
  {cat:'algo', sub:'pseudocode', q:"Wie viele Werte werden insgesamt ausgegeben, und welche sind das?", a:"6 Werte (3 Durchläufe der äußeren Schleife × 2 Durchläufe der inneren Schleife): 1, 2, 2, 4, 3, 6 — für jedes i (1,2,3) wird einmal mit j=1 und einmal mit j=2 multipliziert.", qCode:"FÜR i VON 1 BIS 3 TUE\n    FÜR j VON 1 BIS 2 TUE\n        AUSGABE i * j\n    ENDFÜR\nENDFÜR"},
  {cat:'algo', sub:'pseudocode', q:"Was macht dieser Algorithmus, grob beschrieben?", a:"Er findet heraus, wie viele aufeinanderfolgende Zahlen (beginnend bei 1) mindestens aufsummiert werden müssen, um einen Wert von mindestens 100 zu erreichen, und gibt diese Anzahl aus (i-1, da i nach der Schleife bereits einmal zu weit gezählt wurde).", qCode:"n := 100\nsumme := 0\ni := 1\nSOLANGE summe < n TUE\n    summe := summe + i\n    i := i + 1\nENDSOLANGE\nAUSGABE i - 1"},
  {cat:'algo', sub:'pseudocode', q:"Was wird für alter = 15 ausgegeben? Erkläre den Ablauf durch die verschachtelten Bedingungen.", a:"\"minderjährig\". Die erste Bedingung (alter >= 18) ist falsch, also wird die verschachtelte WENN-Bedingung geprüft (alter >= 16) — auch diese ist mit 15 falsch, also greift deren SONST-Zweig: \"minderjährig\".", qCode:"alter := 15\nWENN alter >= 18 DANN\n    AUSGABE \"volljährig\"\nSONST\n    WENN alter >= 16 DANN\n        AUSGABE \"fast volljährig\"\n    SONST\n        AUSGABE \"minderjährig\"\n    ENDWENN\nENDWENN"},
  {cat:'algo', sub:'pseudocode', q:"Welches bekannte Sortierverfahren wird hier in Pseudocode nachgebildet?", a:"Bubble Sort. Benachbarte Elemente werden paarweise verglichen und bei falscher Reihenfolge vertauscht (die klassische hilf-Variablen-Vertauschung); nach jedem äußeren Durchlauf \"sinkt\" das jeweils größte verbleibende Element an seine richtige Position.", qCode:"Feld := [5, 3, 8, 1]\nFÜR i VON 0 BIS 2 TUE\n    FÜR j VON 0 BIS 2 - i TUE\n        WENN Feld[j] > Feld[j+1] DANN\n            hilf := Feld[j]\n            Feld[j] := Feld[j+1]\n            Feld[j+1] := hilf\n        ENDWENN\n    ENDFÜR\nENDFÜR"},
  {cat:'algo', sub:'pseudocode', q:"Was macht dieser Algorithmus, und wann endet die Schleife?", a:"Er liest wiederholt Zahlen ein und summiert sie auf, bis der Benutzer die Zahl 0 eingibt (Sentinel-/Wächterwert) — 0 dient hier als Abbruchsignal und wird selbst nicht mehr zur Summe addiert.", qCode:"summe := 0\nEINGABE zahl\nSOLANGE zahl <> 0 TUE\n    summe := summe + zahl\n    EINGABE zahl\nENDSOLANGE\nAUSGABE summe"},
];

let order = DECK.map((_,i)=>i);
let activeCats = new Set(Object.keys(CATS));
let availableSubs = [];
let activeSubs = new Set();
let pos = 0;
let flipped = false;
let known = new Set();

const els = {
  filters: document.getElementById('filters'),
  subfilters: document.getElementById('subfilters'),
  card: document.getElementById('card'),
  tabFront: document.getElementById('tabFront'),
  tabTextFront: document.getElementById('tabTextFront'),
  tabBack: document.getElementById('tabBack'),
  tabTextBack: document.getElementById('tabTextBack'),
  qtext: document.getElementById('qtext'),
  atext: document.getElementById('atext'),
  qextra: document.getElementById('qextra'),
  aextra: document.getElementById('aextra'),
  cardnoFront: document.getElementById('cardnoFront'),
  cardnoBack: document.getElementById('cardnoBack'),
  progressFill: document.getElementById('progressFill'),
  progressText: document.getElementById('progressText'),
  knownText: document.getElementById('knownText'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  flipBtn: document.getElementById('flipBtn'),
  yesBtn: document.getElementById('yesBtn'),
  noBtn: document.getElementById('noBtn'),
  shuffleBtn: document.getElementById('shuffleBtn'),
  resetBtn: document.getElementById('resetBtn'),
  drawerNo: document.getElementById('drawerNo'),
  themeToggle: document.getElementById('themeToggle'),
};

function buildFilters(){
  els.filters.innerHTML = '';
  const allChip = makeChip('all', 'Alle', null);
  els.filters.appendChild(allChip);
  Object.entries(CATS).forEach(([key, c])=>{
    els.filters.appendChild(makeChip(key, c.short, c));
  });
  updateFilterUI();
}

function makeChip(key, label, catObj){
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.dataset.key = key;
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.background = catObj ? `var(${catObj.var})` : 'var(--ink-soft)';
  btn.appendChild(dot);
  const span = document.createElement('span');
  span.textContent = label;
  btn.appendChild(span);
  btn.addEventListener('click', ()=> toggleCat(key));
  return btn;
}

function toggleCat(key){
  // tapping "Alle" shows everything. Tapping a specific chip while everything
  // is showing narrows down to just that one; tapping more chips after that
  // adds them to the selection, so several topics can be studied together.
  // Tapping an already-selected chip removes it; removing the last one falls
  // back to "Alle" instead of leaving the deck empty.
  const allKeys = Object.keys(CATS);
  if(key === 'all'){
    activeCats = new Set(allKeys);
  } else if(activeCats.size === allKeys.length){
    activeCats = new Set([key]);
  } else if(activeCats.has(key)){
    activeCats.delete(key);
    if(activeCats.size === 0){
      activeCats = new Set(allKeys);
    }
  } else {
    activeCats.add(key);
  }
  updateFilterUI();
  buildSubFilters();
  rebuildOrder();
}

function updateFilterUI(){
  const all = activeCats.size === Object.keys(CATS).length;
  [...els.filters.children].forEach(chip=>{
    const key = chip.dataset.key;
    if(key === 'all'){
      chip.dataset.active = all ? 'true' : 'false';
    } else {
      chip.dataset.active = activeCats.has(key) ? 'true' : 'false';
    }
  });
}

function buildSubFilters(){
  // which sub-topics actually occur among the currently selected main categories
  const seen = new Set();
  availableSubs = [];
  DECK.forEach(c=>{
    if(activeCats.has(c.cat) && !seen.has(c.sub)){
      seen.add(c.sub);
      availableSubs.push(c.sub);
    }
  });
  activeSubs = new Set(availableSubs);

  els.subfilters.innerHTML = '';
  if(availableSubs.length <= 1){
    return; // nothing meaningful to filter further
  }
  const allChip = makeSubChip('all-sub', 'Alle Themen');
  els.subfilters.appendChild(allChip);
  availableSubs.forEach(key=>{
    els.subfilters.appendChild(makeSubChip(key, SUBLABELS[key] || key));
  });
  updateSubFilterUI();
}

function makeSubChip(key, label){
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.dataset.key = key;
  const span = document.createElement('span');
  span.textContent = label;
  btn.appendChild(span);
  btn.addEventListener('click', ()=> toggleSub(key));
  return btn;
}

function toggleSub(key){
  // same rule as the main filters: start from "Alle Themen", tap topics to
  // build up a selection (SQL + UML together, say), tap a selected one again
  // to drop it, and dropping the last one falls back to "Alle Themen".
  if(key === 'all-sub'){
    activeSubs = new Set(availableSubs);
  } else if(activeSubs.size === availableSubs.length){
    activeSubs = new Set([key]);
  } else if(activeSubs.has(key)){
    activeSubs.delete(key);
    if(activeSubs.size === 0){
      activeSubs = new Set(availableSubs);
    }
  } else {
    activeSubs.add(key);
  }
  updateSubFilterUI();
  rebuildOrder();
}

function updateSubFilterUI(){
  const all = activeSubs.size === availableSubs.length;
  [...els.subfilters.children].forEach(chip=>{
    const key = chip.dataset.key;
    if(key === 'all-sub'){
      chip.dataset.active = all ? 'true' : 'false';
    } else {
      chip.dataset.active = activeSubs.has(key) ? 'true' : 'false';
    }
  });
}

function rebuildOrder(){
  order = DECK.map((_,i)=>i).filter(i => activeCats.has(DECK[i].cat) && activeSubs.has(DECK[i].sub));
  pos = 0;
  flipped = false;
  render();
}

function shuffle(){
  for(let i=order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  flipped = false;
  render();
}

function currentCard(){
  return DECK[order[pos]];
}

function fillExtra(container, code, svg){
  container.innerHTML = '';
  if(code){
    const pre = document.createElement('pre');
    pre.className = 'codeblock';
    pre.textContent = code;
    container.appendChild(pre);
  }
  if(svg){
    const div = document.createElement('div');
    div.className = 'diagram';
    div.innerHTML = svg;
    container.appendChild(div);
  }
}

function render(){
  if(order.length === 0){
    els.qtext.textContent = 'Keine Karten in dieser Auswahl.';
    els.atext.textContent = '';
    els.qextra.innerHTML = '';
    els.aextra.innerHTML = '';
    els.progressText.textContent = '0 von 0';
    els.progressFill.style.width = '0%';
    return;
  }
  const c = currentCard();
  const meta = CATS[c.cat];
  els.qtext.textContent = c.q;
  els.atext.textContent = c.a;
  fillExtra(els.qextra, c.qCode, c.qSvg);
  fillExtra(els.aextra, c.aCode, c.aSvg);

  [els.tabFront, els.tabBack].forEach(tab=>{
    tab.style.background = `var(${meta.bg})`;
    tab.style.color = `var(${meta.var})`;
    tab.querySelector('.dot').style.background = `var(${meta.var})`;
  });
  els.tabTextFront.textContent = meta.label;
  els.tabTextBack.textContent = meta.label;

  const num = `${pos+1} / ${order.length}`;
  els.cardnoFront.textContent = num;
  els.cardnoBack.textContent = num;

  els.card.classList.toggle('flipped', flipped);
  els.progressText.textContent = `Karte ${pos+1} von ${order.length}`;
  els.knownText.textContent = `${known.size} gewusst`;
  els.progressFill.style.width = `${((pos)/order.length)*100}%`;

  els.prevBtn.disabled = pos === 0;
  els.drawerNo.textContent = `Schublade ${String(pos+1).padStart(2,'0')} / ${String(order.length).padStart(2,'0')}`;

  resizeCardToContent();
}

function measureFaceHeight(faceEl){
  const rect = faceEl.getBoundingClientRect();
  const width = rect.width || els.card.getBoundingClientRect().width || 300;
  const clone = faceEl.cloneNode(true);
  clone.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  clone.style.position = 'absolute';
  clone.style.visibility = 'hidden';
  clone.style.pointerEvents = 'none';
  clone.style.left = '-9999px';
  clone.style.top = '0';
  clone.style.right = 'auto';
  clone.style.bottom = 'auto';
  clone.style.width = width + 'px';
  clone.style.height = 'auto';
  clone.style.minHeight = '0';
  clone.style.maxHeight = 'none';
  clone.style.overflow = 'visible';
  document.body.appendChild(clone);
  const h = clone.scrollHeight;
  document.body.removeChild(clone);
  return h;
}

function resizeCardToContent(){
  if(order.length === 0) return;
  const front = els.card.querySelector('.face.front');
  const back = els.card.querySelector('.face.back');
  if(!front || !back) return;
  const needed = Math.max(measureFaceHeight(front), measureFaceHeight(back), 280);
  els.card.style.height = needed + 'px';
}

function flip(){
  if(order.length === 0) return;
  flipped = !flipped;
  els.card.classList.toggle('flipped', flipped);
}

function next(){
  if(order.length === 0) return;
  flipped = false;
  pos = (pos + 1) % order.length;
  render();
}

function prev(){
  if(order.length === 0 || pos === 0) return;
  flipped = false;
  pos -= 1;
  render();
}

function markKnown(isKnown){
  if(order.length === 0) return;
  const idx = order[pos];
  if(isKnown){ known.add(idx); } else { known.delete(idx); }
  next();
}

els.card.addEventListener('click', flip);
els.card.addEventListener('keydown', (e)=>{
  if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flip(); }
});
els.flipBtn.addEventListener('click', flip);
els.nextBtn.addEventListener('click', next);
els.prevBtn.addEventListener('click', prev);
els.yesBtn.addEventListener('click', ()=>markKnown(true));
els.noBtn.addEventListener('click', ()=>markKnown(false));
els.shuffleBtn.addEventListener('click', shuffle);
els.resetBtn.addEventListener('click', ()=>{
  known.clear();
  pos = 0;
  flipped = false;
  render();
});

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') next();
  if(e.key === 'ArrowLeft') prev();
});

let resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resizeCardToContent, 120);
});

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=> resizeCardToContent());
}

// Registers the offline service worker when the page is served over
// http(s) (a published link). On a locally opened file (file://) this
// silently does nothing — the card data is already inline, so the page
// works fully offline either way once it has loaded once.
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

const THEME_LABELS = { auto: 'Automatisch', light: 'Hell', dark: 'Dunkel' };
const THEME_ICONS = {
  auto: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke-width="1.3"/><line x1="8" y1="2" x2="8" y2="14" stroke-width="1.3"/></svg>',
  light: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke-width="1.3"/><line x1="8" y1="1" x2="8" y2="2.5" stroke-width="1.3"/><line x1="8" y1="13.5" x2="8" y2="15" stroke-width="1.3"/><line x1="1" y1="8" x2="2.5" y2="8" stroke-width="1.3"/><line x1="13.5" y1="8" x2="15" y2="8" stroke-width="1.3"/><line x1="3.1" y1="3.1" x2="4.2" y2="4.2" stroke-width="1.3"/><line x1="11.8" y1="11.8" x2="12.9" y2="12.9" stroke-width="1.3"/><line x1="3.1" y1="12.9" x2="4.2" y2="11.8" stroke-width="1.3"/><line x1="11.8" y1="4.2" x2="12.9" y2="3.1" stroke-width="1.3"/></svg>',
  dark: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 1 1 6.5 3a4.3 4.3 0 1 0 6.5 6.5z" fill="none" stroke-width="1.3" stroke-linejoin="round"/></svg>',
};

function loadThemePref(){
  try{
    const v = localStorage.getItem(THEME_KEY);
    if(v === 'light' || v === 'dark') return v;
  }catch(e){}
  return 'auto';
}

function saveThemePref(pref){
  try{
    if(pref === 'auto') localStorage.removeItem(THEME_KEY);
    else localStorage.setItem(THEME_KEY, pref);
  }catch(e){}
}

function applyTheme(pref){
  if(pref === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', pref);
  if(els.themeToggle){
    els.themeToggle.innerHTML = THEME_ICONS[pref] + '<span>' + THEME_LABELS[pref] + '</span>';
    els.themeToggle.setAttribute('aria-label', 'Design: ' + THEME_LABELS[pref] + ' (Automatisch, Hell oder Dunkel) — zum Wechseln klicken');
  }
}

let themePref = loadThemePref();
applyTheme(themePref);
if(els.themeToggle){
  els.themeToggle.addEventListener('click', ()=>{
    const i = THEME_ORDER.indexOf(themePref);
    themePref = THEME_ORDER[(i + 1) % THEME_ORDER.length];
    saveThemePref(themePref);
    applyTheme(themePref);
  });
}

buildFilters();
buildSubFilters();
rebuildOrder();
</script>
</body>
</html>
