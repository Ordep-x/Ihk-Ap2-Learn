{"cat":"algo","sub":"netz","q":"Was ist der Unterschied zwischen TCP und UDP?","a":"TCP ist verbindungsorientiert, stellt eine zuverlässige, geordnete Übertragung mit Fehlerkorrektur sicher. UDP ist verbindungslos, schneller, aber ohne Garantie für Zustellung oder Reihenfolge.","qPt":"Qual é a diferença entre TCP e UDP?","aPt":"O TCP é orientado à ligação e garante uma transmissão fiável e ordenada, com correção de erros. O UDP não é orientado à ligação, é mais rápido, mas não garante a entrega nem a ordem dos dados."},
{"cat":"algo","sub":"netz","q":"Was ist eine IP-Adresse?","a":"Eine eindeutige Adresse, die ein Gerät in einem Netzwerk identifiziert und die Kommunikation über das Internetprotokoll ermöglicht (z. B. IPv4 oder IPv6).","qPt":"O que é um endereço IP?","aPt":"Um endereço único que identifica um dispositivo numa rede e permite a comunicação através do protocolo de Internet (por exemplo, IPv4 ou IPv6)."},
{"cat":"algo","sub":"netz","q":"Was macht eine Subnetzmaske?","a":"Sie legt fest, welcher Teil einer IP-Adresse das Netzwerk und welcher Teil das einzelne Gerät (Host) innerhalb dieses Netzwerks bezeichnet.","qPt":"O que faz uma máscara de subrede?","aPt":"Define qual a parte de um endereço IP que identifica a rede e qual a parte que identifica o dispositivo (host) individual dentro dessa rede."},
{"cat":"algo","sub":"netz","q":"Was macht ein DNS-Server?","a":"Er übersetzt menschenlesbare Domainnamen (z. B. www.example.com) in die zugehörigen IP-Adressen.","qPt":"O que faz um servidor DNS?","aPt":"Traduz nomes de domínio legíveis por humanos (por exemplo, www.example.com) nos respetivos endereços IP."},
{"cat":"algo","sub":"netz","q":"Was ist der Unterschied zwischen HTTP und HTTPS?","a":"HTTPS ist die verschlüsselte Variante von HTTP (mittels TLS/SSL) und schützt die Datenübertragung zwischen Client und Server vor Abhören und Manipulation.","qPt":"Qual é a diferença entre HTTP e HTTPS?","aPt":"O HTTPS é a variante encriptada do HTTP (através de TLS/SSL) e protege a transmissão de dados entre o cliente e o servidor contra escutas e manipulação."},
{"cat":"algo","sub":"netz","q":"Was ist ein Port in der Netzwerkkommunikation?","a":"Eine logische Adresse (0–65535), über die ein bestimmter Dienst/Prozess auf einem Gerät erreichbar ist, z. B. Port 80 für HTTP oder 443 für HTTPS.","qPt":"O que é uma porta (port) na comunicação em rede?","aPt":"Um endereço lógico (0–65535) através do qual um determinado serviço/processo num dispositivo está acessível, por exemplo a porta 80 para HTTP ou a 443 para HTTPS."},
{"cat":"algo","sub":"rekursion","q":"Was ist der Unterschied zwischen Binär- und Hexadezimalsystem?","a":"Das Binärsystem nutzt die Basis 2 (Ziffern 0/1), das Hexadezimalsystem die Basis 16 (Ziffern 0–9, A–F). Hexadezimalzahlen werden oft genutzt, um Binärzahlen kompakter darzustellen (4 Bit = 1 Hex-Ziffer).","qPt":"Qual é a diferença entre o sistema binário e o sistema hexadecimal?","aPt":"O sistema binário usa a base 2 (algarismos 0/1), o sistema hexadecimal usa a base 16 (algarismos 0–9, A–F). Os números hexadecimais são frequentemente usados para representar números binários de forma mais compacta (4 bits = 1 algarismo hexadecimal)."},
{"cat":"algo","sub":"rekursion","q":"Wie wird eine negative Zahl im Zweierkomplement dargestellt?","a":"Man invertiert alle Bits der positiven Binärdarstellung und addiert 1 — dadurch lassen sich Addition/Subtraktion einheitlich mit demselben Rechenwerk durchführen.","qPt":"Como é representado um número negativo em complemento de dois?","aPt":"Inverte-se todos os bits da representação binária positiva e soma-se 1 — isto permite realizar a adição/subtração de forma uniforme com a mesma unidade de cálculo."},
{"cat":"algo","sub":"rekursion","q":"Was ist der Unterschied zwischen einer Exception und einem Syntaxfehler?","a":"Ein Syntaxfehler verletzt die Grammatikregeln der Sprache und verhindert die Kompilierung/Ausführung. Eine Exception ist ein Laufzeitfehler, der während der Programmausführung auftritt und abgefangen (try-catch) werden kann.","qPt":"Qual é a diferença entre uma exceção e um erro de sintaxe?","aPt":"Um erro de sintaxe viola as regras gramaticais da linguagem e impede a compilação/execução. Uma exceção é um erro em tempo de execução, que ocorre durante a execução do programa e pode ser tratado (try-catch)."},
{"cat":"algo","sub":"rekursion","q":"Wozu dient ein try-catch-Block?","a":"Um Programmcode, bei dem ein Laufzeitfehler auftreten könnte, gezielt abzusichern und im Fehlerfall (catch) eine definierte Behandlung statt eines Programmabsturzes auszuführen.","qPt":"Para que serve um bloco try-catch?","aPt":"Para proteger de forma específica trechos de código onde possa ocorrer um erro em tempo de execução e, em caso de erro (catch), executar um tratamento definido em vez de deixar o programa terminar abruptamente."},
{"cat":"algo","sub":"praxis","q":"Was ist Test-Driven Development (TDD)?","a":"Eine Entwicklungsmethode, bei der zuerst ein (fehlschlagender) Test geschrieben wird, dann die minimale Implementierung, die den Test besteht, und anschließend der Code refaktorisiert wird.","qPt":"O que é o Test-Driven Development (TDD)?","aPt":"Um método de desenvolvimento em que primeiro se escreve um teste (que falha), depois a implementação mínima que faz o teste passar, e por fim o código é refatorizado."},
{"cat":"algo","sub":"praxis","q":"Was macht der Git-Befehl \"commit\"?","a":"Er speichert die aktuell im Staging-Bereich vorgemerkten Änderungen dauerhaft als neuen Versionsstand (Snapshot) im lokalen Repository.","qPt":"O que faz o comando Git \"commit\"?","aPt":"Guarda de forma permanente as alterações atualmente marcadas na área de staging como um novo estado de versão (snapshot) no repositório local."},
{"cat":"algo","sub":"praxis","q":"Was ist ein Branch in Git?","a":"Ein unabhängiger Entwicklungsstrang innerhalb eines Repositories, der parallele Arbeit ermöglicht, ohne den Hauptzweig (z. B. main) direkt zu verändern.","qPt":"O que é um branch (ramo) no Git?","aPt":"Uma linha de desenvolvimento independente dentro de um repositório, que permite trabalhar em paralelo sem alterar diretamente o ramo principal (por exemplo, main)."},
{"cat":"algo","sub":"praxis","q":"Was passiert beim Git-Befehl \"merge\"?","a":"Änderungen aus einem Branch werden mit einem anderen Branch zusammengeführt, wobei Git versucht, die Änderungen automatisch zu kombinieren.","qPt":"O que acontece com o comando Git \"merge\"?","aPt":"As alterações de um branch são combinadas com outro branch, sendo que o Git tenta combinar automaticamente as alterações."},
{"cat":"algo","sub":"praxis","q":"Was ist ein Merge-Konflikt in Git?","a":"Er tritt auf, wenn dieselbe Stelle einer Datei in zwei zusammenzuführenden Branches unterschiedlich verändert wurde und Git die Änderungen nicht automatisch vereinen kann — manuelle Auflösung ist nötig.","qPt":"O que é um conflito de merge no Git?","aPt":"Ocorre quando o mesmo trecho de um ficheiro foi alterado de forma diferente em dois branches que estão a ser combinados, e o Git não consegue unir automaticamente as alterações — é necessária a resolução manual."},
{"cat":"algo","sub":"praxis","q":"Was ist eine Pull Request (bzw. Merge Request)?","a":"Eine Anfrage, Änderungen aus einem Branch in einen anderen (z. B. den Hauptzweig) zu übernehmen, meist verbunden mit Code-Review durch andere Teammitglieder vor der Zusammenführung.","qPt":"O que é um Pull Request (ou Merge Request)?","aPt":"Um pedido para integrar as alterações de um branch noutro (por exemplo, o ramo principal), normalmente acompanhado de uma revisão de código (code review) por outros membros da equipa antes da integração."},
{"cat":"algo","sub":"praxis","q":"Was ist der Unterschied zwischen Kompilierung und Interpretation?","a":"Bei der Kompilierung wird der Quellcode vor der Ausführung vollständig in Maschinencode übersetzt. Bei der Interpretation wird der Code zur Laufzeit Zeile für Zeile gelesen und direkt ausgeführt.","qPt":"Qual é a diferença entre compilação e interpretação?","aPt":"Na compilação, o código-fonte é totalmente traduzido para código máquina antes da execução. Na interpretação, o código é lido linha a linha em tempo de execução e executado diretamente."},
{"cat":"algo","sub":"oop","q":"Was ist ein Interface in der objektorientierten Programmierung im Vergleich zu einer Klasse?","a":"Ein Interface definiert einen Vertrag aus Methodensignaturen, traditionell ohne eigene Implementierung (seit Java 8 sind jedoch default- und static-Methoden mit Implementierung möglich); eine Klasse kann diesen Vertrag durch \"implements\" einhalten und muss alle nicht bereits implementierten Methoden konkret umsetzen.","qPt":"O que é uma interface na programação orientada a objetos, em comparação com uma classe?","aPt":"Uma interface define um contrato de assinaturas de métodos, tradicionalmente sem implementação própria (embora, desde o Java 8, sejam possíveis métodos default e static com implementação); uma classe pode cumprir esse contrato através de \"implements\" e tem de implementar concretamente todos os métodos que ainda não estejam implementados."},
{"cat":"algo","sub":"oop","q":"Was versteht man unter \"Clean Code\"?","a":"Quellcode, der klar strukturiert, verständlich benannt, gut wartbar und möglichst einfach ist — u. a. durch aussagekräftige Bezeichner, kleine Funktionen und Vermeidung unnötiger Komplexität.","qPt":"O que se entende por \"Clean Code\"?","aPt":"Código-fonte bem estruturado, com nomes compreensíveis, fácil de manter e o mais simples possível — conseguido, entre outros, através de identificadores claros, funções pequenas e evitando complexidade desnecessária."},
{"cat":"algo","sub":"ds","q":"Was ist der Unterschied zwischen einer einfach und einer doppelt verketteten Liste?","a":"Bei einer einfach verketteten Liste verweist jeder Knoten nur auf den nächsten Knoten. Bei einer doppelt verketteten Liste verweist jeder Knoten zusätzlich auf den vorherigen Knoten, was Navigation in beide Richtungen ermöglicht.","qPt":"Qual é a diferença entre uma lista ligada simples e uma lista duplamente ligada?","aPt":"Numa lista ligada simples, cada nó aponta apenas para o nó seguinte. Numa lista duplamente ligada, cada nó aponta também para o nó anterior, o que permite navegar em ambas as direções."},
{"cat":"wiso","sub":"tarif","q":"Wer schließt einen Tarifvertrag ab?","a":"Ein Tarifvertrag wird zwischen einer Gewerkschaft (Arbeitnehmerseite) und einem einzelnen Arbeitgeber oder einem Arbeitgeberverband (Arbeitgeberseite) geschlossen.","qPt":"Quem celebra uma convenção coletiva de trabalho (Tarifvertrag)?","aPt":"Uma convenção coletiva de trabalho é celebrada entre um sindicato (parte dos trabalhadores) e um único empregador ou uma associação de empregadores (parte empregadora)."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was regelt das Kündigungsschutzgesetz (KSchG) und für wen gilt es?","a":"Es schützt Arbeitnehmer vor sozial ungerechtfertigten Kündigungen. Es gilt in Betrieben mit i. d. R. mehr als 10 Beschäftigten, wenn das Arbeitsverhältnis länger als 6 Monate besteht.","qPt":"O que regula a Lei de Proteção contra o Despedimento (Kündigungsschutzgesetz, KSchG) e para quem se aplica?","aPt":"Protege os trabalhadores contra despedimentos socialmente injustificados. Aplica-se, regra geral, a empresas com mais de 10 trabalhadores, quando a relação de trabalho já dura há mais de 6 meses."},
{"cat":"wiso","sub":"steuern","q":"Nenne die fünf Zweige der gesetzlichen Sozialversicherung in Deutschland.","a":"Kranken-, Renten-, Arbeitslosen-, Pflege- und Unfallversicherung.","qPt":"Indica os cinco ramos do seguro social obrigatório na Alemanha.","aPt":"Seguro de doença, seguro de pensões (reforma), seguro de desemprego, seguro de cuidados continuados (dependência) e seguro de acidentes."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was ist die maximale gesetzliche tägliche Arbeitszeit laut Arbeitszeitgesetz?","a":"Grundsätzlich 8 Stunden pro Werktag, verlängerbar auf bis zu 10 Stunden, wenn im Durchschnitt von 6 Kalendermonaten bzw. 24 Wochen 8 Stunden pro Werktag nicht überschritten werden.","qPt":"Qual é a duração máxima legal do trabalho diário segundo a Lei do Tempo de Trabalho (Arbeitszeitgesetz)?","aPt":"Em princípio, 8 horas por dia útil, podendo ser prolongada até 10 horas, desde que, em média, num período de 6 meses de calendário ou 24 semanas, não sejam excedidas as 8 horas por dia útil."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Wozu dient das Allgemeine Gleichbehandlungsgesetz (AGG)?","a":"Es soll Benachteiligungen aus Gründen wie Rasse/ethnischer Herkunft, Geschlecht, Religion, Behinderung, Alter oder sexueller Identität verhindern oder beseitigen — u. a. im Arbeitsleben.","qPt":"Para que serve a Lei Geral de Igualdade de Tratamento (Allgemeines Gleichbehandlungsgesetz – AGG)?","aPt":"Destina-se a prevenir ou eliminar discriminações com base em motivos como raça/origem étnica, sexo, religião, deficiência, idade ou identidade sexual — nomeadamente no âmbito laboral."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Nenne zwei zentrale Mitbestimmungsrechte des Betriebsrats.","a":"Z. B. bei der Gestaltung von Arbeitszeit (§87 BetrVG) und bei personellen Einzelmaßnahmen wie Einstellungen, Versetzungen oder Kündigungen — hier hat der Betriebsrat Mitspracherechte nach dem Betriebsverfassungsgesetz.","qPt":"Indique dois direitos centrais de participação na decisão (Mitbestimmung) do Betriebsrat (conselho de empresa).","aPt":"Por exemplo, na definição do horário de trabalho (§87 BetrVG) e em medidas individuais de pessoal, como contratações, transferências ou despedimentos — nestes casos, o Betriebsrat tem direito de participação nas decisões, nos termos da Betriebsverfassungsgesetz (lei da organização das empresas)."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was regelt das Jugendarbeitsschutzgesetz (JArbSchG)?","a":"Es schützt Kinder und Jugendliche (unter 18 Jahren) am Arbeitsplatz, z. B. durch Begrenzung der Arbeitszeit, Verbot von Nacht-/Akkordarbeit und Pflicht zu ausreichenden Pausen und Ruhezeiten.","qPt":"O que regula a Jugendarbeitsschutzgesetz (JArbSchG, lei de proteção do trabalho de menores)?","aPt":"Protege crianças e jovens (com menos de 18 anos) no local de trabalho, por exemplo através da limitação do horário de trabalho, da proibição do trabalho noturno/à tarefa e da obrigação de pausas e períodos de descanso suficientes."},
{"cat":"wiso","sub":"wirtschaft","q":"Was zeigt der einfache Wirtschaftskreislauf?","a":"Den Güter- und Geldfluss zwischen den zwei Polen Haushalte (bieten Produktionsfaktoren an, konsumieren Güter) und Unternehmen (produzieren Güter, zahlen Löhne) — jeweils in entgegengesetzter Richtung.","qPt":"O que representa o circuito económico simples?","aPt":"O fluxo de bens e de dinheiro entre os dois polos: as famílias (que oferecem fatores de produção e consomem bens) e as empresas (que produzem bens e pagam salários) — cada fluxo em sentido contrário ao outro."},
{"cat":"wiso","sub":"wirtschaft","q":"Was versteht man unter Inflation?","a":"Einen anhaltenden Anstieg des allgemeinen Preisniveaus, wodurch die Kaufkraft des Geldes sinkt.","qPt":"O que se entende por inflação?","aPt":"Um aumento sustentado do nível geral de preços, que faz diminuir o poder de compra do dinheiro."},
{"cat":"wiso","sub":"unternehmen","q":"Was ist der zentrale Unterschied zwischen GmbH und AG bei der Haftung?","a":"Bei beiden Rechtsformen haftet grundsätzlich nur das Gesellschaftsvermögen (keine private Haftung der Gesellschafter/Aktionäre). Die GmbH hat Stammkapital (mind. 25.000 €), die AG Grundkapital (mind. 50.000 €), das in Aktien zerlegt ist.","qPt":"Qual é a principal diferença entre a GmbH e a AG em termos de responsabilidade?","aPt":"Em ambas as formas jurídicas, em princípio só responde o património da sociedade (sem responsabilidade pessoal dos sócios/acionistas). A GmbH (sociedade por quotas) tem capital social mínimo de 25.000 €, enquanto a AG (sociedade anónima) tem capital social mínimo de 50.000 €, dividido em ações."},
{"cat":"wiso","sub":"unternehmen","q":"Was sind zentrale Aufgaben der IHK (Industrie- und Handelskammer)?","a":"U. a. die Überwachung der Berufsausbildung, Organisation von Prüfungen, Interessenvertretung der Wirtschaft und Beratung von Unternehmen.","qPt":"Quais são as principais funções da IHK (Câmara de Indústria e Comércio)?","aPt":"Entre outras, a supervisão da formação profissional, a organização de exames, a representação dos interesses da economia e o aconselhamento a empresas."},
{"cat":"wiso","sub":"ausbildung","q":"Wie lang ist die gesetzliche Probezeit im Berufsausbildungsverhältnis maximal?","a":"Mindestens 1 Monat und höchstens 4 Monate (§20 BBiG). Während der Probezeit kann das Ausbildungsverhältnis jederzeit ohne Einhaltung einer Frist gekündigt werden.","qPt":"Qual é a duração máxima legal do período experimental (Probezeit) numa relação de formação profissional?","aPt":"No mínimo 1 mês e no máximo 4 meses (§20 BBiG). Durante o período experimental, a relação de formação pode ser rescindida em qualquer momento, sem necessidade de respeitar um prazo de aviso prévio."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Welche Angaben muss ein Ausbildungsvertrag mindestens enthalten?","a":"U. a. Ausbildungsberuf und -ziel, Beginn und Dauer, Ausbildungsstätte(n), tägliche Arbeitszeit, Dauer der Probezeit, Vergütungshöhe und -zahlungsweise sowie Urlaubsdauer und Kündigungsvoraussetzungen.","qPt":"Que informações deve conter, no mínimo, um contrato de formação profissional (Ausbildungsvertrag)?","aPt":"Entre outras: a profissão e o objetivo da formação, a data de início e a duração, o(s) local(ais) de formação, o horário diário de trabalho, a duração do período experimental, o valor e a forma de pagamento da remuneração, a duração das férias e as condições de rescisão."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Welche gesetzliche Kündigungsfrist gilt nach der Probezeit für Arbeitnehmer laut BGB (Grundregel)?","a":"Die gesetzliche Grundkündigungsfrist beträgt 4 Wochen zum 15. oder zum Ende eines Kalendermonats (§622 BGB), sofern nicht Tarifvertrag oder Arbeitsvertrag längere Fristen vorsehen.","qPt":"Qual é o prazo legal de aviso prévio (Kündigungsfrist) aplicável aos trabalhadores após o período experimental, segundo a regra geral do BGB?","aPt":"O prazo legal base é de 4 semanas, com efeitos a 15 ou ao final de um mês de calendário (§622 BGB), salvo se a convenção coletiva (Tarifvertrag) ou o contrato de trabalho previrem prazos mais longos."},
{"cat":"wiso","sub":"wirtschaft","q":"Was regelt Angebot und Nachfrage auf einem freien Markt?","a":"Der Marktpreis (Gleichgewichtspreis) bildet sich dort, wo die angebotene Menge der nachgefragten Menge entspricht. Steigt die Nachfrage bei gleichem Angebot, steigt tendenziell der Preis — und umgekehrt.","qPt":"O que regula a oferta e a procura num mercado livre?","aPt":"O preço de mercado (preço de equilíbrio) forma-se no ponto em que a quantidade oferecida corresponde à quantidade procurada. Se a procura aumentar mantendo-se a oferta, o preço tende a subir — e vice-versa."},
{"cat":"wiso","sub":"tarif","q":"Was ist der Unterschied zwischen Betriebsrat und Personalrat?","a":"Der Betriebsrat vertritt Arbeitnehmerinteressen in privatwirtschaftlichen Betrieben (Grundlage: Betriebsverfassungsgesetz). Der Personalrat übernimmt diese Funktion im öffentlichen Dienst (Grundlage: Personalvertretungsgesetze).","qPt":"Qual é a diferença entre o Betriebsrat e o Personalrat?","aPt":"O Betriebsrat (conselho de empresa) representa os interesses dos trabalhadores em empresas do setor privado (com base na Betriebsverfassungsgesetz). O Personalrat (conselho de pessoal) desempenha essa função na função pública (com base nas leis de representação de pessoal, Personalvertretungsgesetze)."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was ist der Unterschied zwischen einer ordentlichen und einer außerordentlichen Kündigung?","a":"Die ordentliche Kündigung erfolgt unter Einhaltung der gesetzlichen/vertraglichen Kündigungsfrist. Die außerordentliche (fristlose) Kündigung beendet das Arbeitsverhältnis sofort, erfordert aber einen wichtigen Grund (§626 BGB).","qPt":"Qual é a diferença entre um despedimento ordinário (ordentliche Kündigung) e um despedimento extraordinário (außerordentliche Kündigung)?","aPt":"O despedimento ordinário é feito respeitando o prazo de aviso prévio legal ou contratual. O despedimento extraordinário (sem aviso prévio) põe fim à relação de trabalho de forma imediata, mas exige um motivo grave (§626 BGB)."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was ist eine Änderungskündigung?","a":"Eine Kündigung, die mit dem Angebot verbunden ist, das Arbeitsverhältnis zu geänderten Bedingungen fortzusetzen (z. B. anderes Gehalt oder andere Tätigkeit).","qPt":"O que é uma Änderungskündigung (despedimento com proposta de alteração das condições)?","aPt":"Um despedimento acompanhado da proposta de continuar a relação de trabalho em condições alteradas (por exemplo, com outro salário ou outra função)."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Wozu dient eine Abmahnung?","a":"Sie weist den Arbeitnehmer auf ein konkretes Fehlverhalten hin, fordert dessen Unterlassung und kündigt im Wiederholungsfall arbeitsrechtliche Konsequenzen (bis zur Kündigung) an — oft Voraussetzung für eine verhaltensbedingte Kündigung.","qPt":"Para que serve uma Abmahnung (advertência formal)?","aPt":"Alerta o trabalhador para um comportamento incorreto concreto, exige que este cesse e anuncia consequências a nível laboral (podendo chegar ao despedimento) em caso de repetição — sendo muitas vezes um requisito prévio para um despedimento por motivos comportamentais."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was ist ein qualifiziertes Arbeitszeugnis?","a":"Ein Zeugnis, das neben Art und Dauer der Tätigkeit auch Leistung und Verhalten des Arbeitnehmers bewertet — im Gegensatz zum einfachen Zeugnis, das nur Tätigkeit und Dauer nennt.","qPt":"O que é um qualifiziertes Arbeitszeugnis (certificado de trabalho qualificado)?","aPt":"Um certificado que, além do tipo e da duração da atividade, avalia também o desempenho e o comportamento do trabalhador — ao contrário do certificado simples, que indica apenas a atividade e a duração."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was regelt das Mutterschutzgesetz?","a":"Es schützt schwangere und stillende Arbeitnehmerinnen, u. a. durch Beschäftigungsverbote, Kündigungsschutz und besondere Arbeitszeitregelungen.","qPt":"O que regula a Mutterschutzgesetz (lei de proteção da maternidade)?","aPt":"Protege as trabalhadoras grávidas e lactantes, entre outros aspetos através de proibições de trabalho em determinadas situações, proteção contra o despedimento e regras especiais de horário de trabalho."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was ist Elternzeit?","a":"Ein gesetzlicher Anspruch von Arbeitnehmern auf unbezahlte Freistellung von der Arbeit zur Betreuung eines Kindes, bei gleichzeitigem Kündigungsschutz und Rückkehrrecht auf den Arbeitsplatz.","qPt":"O que é a Elternzeit (licença parental)?","aPt":"Um direito legal dos trabalhadores a uma dispensa não remunerada do trabalho para cuidar de um filho, com proteção contra o despedimento e direito de regresso ao posto de trabalho durante esse período."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Wie hoch ist der gesetzliche Mindesturlaub laut Bundesurlaubsgesetz (BUrlG)?","a":"Mindestens 24 Werktage pro Jahr bei einer 6-Tage-Woche (entspricht 20 Arbeitstagen bei einer 5-Tage-Woche).","qPt":"Qual é a duração mínima legal de férias segundo a Bundesurlaubsgesetz (BUrlG, lei federal das férias)?","aPt":"No mínimo 24 dias úteis por ano, numa semana de 6 dias de trabalho (o que corresponde a 20 dias úteis numa semana de 5 dias)."},
{"cat":"wiso","sub":"ausbildung","q":"Was regelt das Berufsbildungsgesetz (BBiG) grundsätzlich?","a":"Es bildet die rechtliche Grundlage der beruflichen Ausbildung in Deutschland, u. a. Ausbildungsvertrag, Pflichten von Ausbildenden und Auszubildenden, Prüfungen und Ausbildungsordnungen.","qPt":"O que regula, fundamentalmente, a Berufsbildungsgesetz (BBiG, lei da formação profissional)?","aPt":"Constitui a base legal da formação profissional na Alemanha, regulando, entre outros aspetos, o contrato de formação, as obrigações de formadores e formandos, os exames e os regulamentos de formação (Ausbildungsordnungen)."},
{"cat":"wiso","sub":"ausbildung","q":"Was ist ein Ausbildungsrahmenplan?","a":"Ein Bestandteil der Ausbildungsordnung, der zeitlich und sachlich gegliedert vorgibt, welche Fertigkeiten, Kenntnisse und Fähigkeiten während der Ausbildung vermittelt werden sollen.","qPt":"O que é um Ausbildungsrahmenplan (plano-quadro de formação)?","aPt":"Uma parte do regulamento de formação (Ausbildungsordnung) que estabelece, organizada por fases temporais e por conteúdos, quais as competências, conhecimentos e capacidades a transmitir durante a formação."},
{"cat":"wiso","sub":"ausbildung","q":"Wozu dient das Berichtsheft (Ausbildungsnachweis)?","a":"Es dokumentiert den Verlauf der Ausbildung, die vermittelten Inhalte und Tätigkeiten und ist Voraussetzung für die Zulassung zur Abschlussprüfung.","qPt":"Para que serve o Berichtsheft (caderno de registo da formação)?","aPt":"Documenta o decurso da formação, os conteúdos e as atividades transmitidas, sendo um requisito para a admissão ao exame final."},
{"cat":"wiso","sub":"ausbildung","q":"Was ist die Jugend- und Auszubildendenvertretung (JAV)?","a":"Eine gewählte Interessenvertretung der jugendlichen Beschäftigten und Auszubildenden im Betrieb, die u. a. deren Belange gegenüber dem Betriebsrat und dem Arbeitgeber vertritt.","qPt":"O que é a Jugend- und Auszubildendenvertretung (JAV, representação dos jovens e dos formandos)?","aPt":"Um órgão eleito de representação dos interesses dos trabalhadores jovens e dos formandos na empresa, que representa, entre outros aspetos, os seus interesses face ao Betriebsrat e ao empregador."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was passiert, wenn ein Auszubildender nach der Abschlussprüfung nicht ausdrücklich übernommen, aber weiterbeschäftigt wird?","a":"Nach §24 BBiG entsteht dann automatisch ein unbefristetes Arbeitsverhältnis, wenn der Auszubildende im Anschluss an die Ausbildung ohne ausdrückliche Vereinbarung weiterbeschäftigt wird.","qPt":"O que acontece se um formando, após o exame final, não for formalmente contratado, mas continuar a trabalhar na empresa?","aPt":"Nos termos do §24 BBiG, forma-se automaticamente uma relação de trabalho sem termo, quando o formando continua a trabalhar após o fim da formação sem que exista um acordo expresso nesse sentido."},
{"cat":"wiso","sub":"tarif","q":"Was versteht man unter Tarifautonomie?","a":"Das verfassungsrechtlich geschützte Recht der Tarifparteien (Gewerkschaften und Arbeitgeber(-verbände)), Löhne und Arbeitsbedingungen eigenständig und ohne staatliche Einmischung auszuhandeln.","qPt":"O que se entende por Tarifautonomie (autonomia da negociação coletiva)?","aPt":"O direito, protegido constitucionalmente, das partes da negociação coletiva (sindicatos e empregadores/associações de empregadores) de negociarem salários e condições de trabalho de forma autónoma e sem interferência do Estado."},
{"cat":"wiso","sub":"tarif","q":"Was ist der Unterschied zwischen Flächentarifvertrag und Firmentarifvertrag (Haustarifvertrag)?","a":"Ein Flächentarifvertrag gilt für eine ganze Branche/Region und wird zwischen Gewerkschaft und Arbeitgeberverband geschlossen. Ein Firmentarifvertrag gilt nur für ein einzelnes Unternehmen und wird direkt zwischen Gewerkschaft und diesem Arbeitgeber vereinbart.","qPt":"Qual é a diferença entre um Flächentarifvertrag (convenção coletiva setorial/regional) e um Firmentarifvertrag/Haustarifvertrag (convenção coletiva de empresa)?","aPt":"Um Flächentarifvertrag aplica-se a todo um setor ou região e é celebrado entre o sindicato e a associação de empregadores. Um Firmentarifvertrag aplica-se apenas a uma única empresa e é acordado diretamente entre o sindicato e esse empregador."},
{"cat":"wiso","sub":"tarif","q":"Was bedeutet Tarifbindung?","a":"Ein Arbeitsverhältnis unterliegt einem Tarifvertrag, wenn beide Parteien (oder der Arbeitgeber durch Verbandsmitgliedschaft) tarifgebunden sind oder der Tarifvertrag durch Allgemeinverbindlicherklärung gilt.","qPt":"O que significa Tarifbindung (vinculação a uma convenção coletiva)?","aPt":"Uma relação de trabalho está sujeita a uma convenção coletiva quando ambas as partes (ou o empregador, através da sua adesão a uma associação patronal) estão vinculadas a essa convenção, ou quando a convenção é declarada de aplicação geral obrigatória (Allgemeinverbindlicherklärung)."},
{"cat":"wiso","sub":"tarif","q":"Was ist das Streikrecht und wo ist es verankert?","a":"Das Recht der Gewerkschaften, zur Durchsetzung tariflicher Forderungen zur Arbeitsniederlegung aufzurufen; es leitet sich aus der grundgesetzlich geschützten Koalitionsfreiheit (Art. 9 Abs. 3 GG) ab.","qPt":"O que é o direito à greve (Streikrecht) e onde está consagrado?","aPt":"É o direito dos sindicatos de convocar a paralisação do trabalho para fazer valer reivindicações coletivas; deriva da liberdade de associação (Koalitionsfreiheit) protegida pela Lei Fundamental alemã (Art. 9, n.º 3, GG)."},
{"cat":"wiso","sub":"tarif","q":"Was ist eine Aussperrung?","a":"Eine Arbeitskampfmaßnahme der Arbeitgeberseite, bei der Arbeitnehmer vorübergehend vom Betrieb ausgeschlossen und von der Arbeit sowie der Lohnzahlung freigestellt werden, meist als Reaktion auf einen Streik.","qPt":"O que é uma Aussperrung (lockout)?","aPt":"Uma medida de conflito laboral por parte do empregador, em que os trabalhadores são temporariamente impedidos de entrar na empresa e dispensados do trabalho e do pagamento do salário, geralmente como reação a uma greve."},
{"cat":"wiso","sub":"tarif","q":"Wie wird der Betriebsrat gewählt?","a":"Er wird von den wahlberechtigten Arbeitnehmern des Betriebs in geheimer und unmittelbarer Wahl für eine Amtszeit von in der Regel 4 Jahren gewählt.","qPt":"Como é eleito o Betriebsrat?","aPt":"É eleito pelos trabalhadores da empresa com direito de voto, através de eleição secreta e direta, para um mandato de, regra geral, 4 anos."},
{"cat":"wiso","sub":"tarif","q":"Was sind soziale Angelegenheiten, bei denen der Betriebsrat zwingend mitbestimmen muss?","a":"Z. B. Beginn und Ende der täglichen Arbeitszeit, Pausenregelungen, Urlaubsgrundsätze, Überstunden sowie Fragen der betrieblichen Ordnung (§87 BetrVG).","qPt":"O que são assuntos sociais em que o Betriebsrat tem obrigatoriamente de participar na decisão?","aPt":"Por exemplo, o início e o fim do horário diário de trabalho, as regras de pausas, os princípios gerais de férias, as horas extraordinárias, bem como questões de ordem interna da empresa (§87 BetrVG)."},
{"cat":"wiso","sub":"tarif","q":"Was ist ein Wirtschaftsausschuss?","a":"Ein Gremium in Unternehmen mit in der Regel mehr als 100 Arbeitnehmern, das über wirtschaftliche Angelegenheiten informiert wird und diese mit der Unternehmensleitung berät.","qPt":"O que é um Wirtschaftsausschuss (comissão económica)?","aPt":"Um órgão existente em empresas com, regra geral, mais de 100 trabalhadores, que é informado sobre assuntos económicos e os discute com a direção da empresa."},
{"cat":"wiso","sub":"unternehmen","q":"Was ist ein Einzelunternehmen?","a":"Eine Unternehmensform mit nur einem Inhaber, der das Unternehmen allein führt und mit seinem gesamten Privatvermögen unbeschränkt haftet.","qPt":"O que é um Einzelunternehmen (empresa em nome individual)?","aPt":"Uma forma de empresa com um único titular, que a dirige sozinho e responde ilimitadamente com todo o seu património pessoal."},
{"cat":"wiso","sub":"unternehmen","q":"Was ist eine GbR (Gesellschaft bürgerlichen Rechts)?","a":"Der einfachste Zusammenschluss mehrerer Personen zu einer Personengesellschaft ohne besondere Formvorschriften; alle Gesellschafter haften unbeschränkt und gesamtschuldnerisch, auch mit ihrem Privatvermögen.","qPt":"O que é uma GbR (Gesellschaft bürgerlichen Rechts, sociedade civil)?","aPt":"A forma mais simples de associação de várias pessoas numa sociedade de pessoas, sem exigências formais especiais; todos os sócios respondem de forma ilimitada e solidária, incluindo com o seu património pessoal."},
{"cat":"wiso","sub":"unternehmen","q":"Was unterscheidet eine OHG von einer KG?","a":"Bei der OHG (Offene Handelsgesellschaft) haften alle Gesellschafter unbeschränkt. Bei der KG (Kommanditgesellschaft) gibt es mindestens einen unbeschränkt haftenden Komplementär und mindestens einen nur beschränkt (mit seiner Einlage) haftenden Kommanditisten.","qPt":"O que distingue uma OHG de uma KG?","aPt":"Na OHG (Offene Handelsgesellschaft, sociedade em nome coletivo) todos os sócios respondem de forma ilimitada. Na KG (Kommanditgesellschaft, sociedade em comandita) existe pelo menos um sócio com responsabilidade ilimitada (Komplementär) e pelo menos um sócio comanditário (Kommanditist), cuja responsabilidade se limita ao valor da sua entrada de capital."},
{"cat":"wiso","sub":"unternehmen","q":"Was ist eine UG (haftungsbeschränkt)?","a":"Eine \"kleine GmbH\", die bereits mit einem Stammkapital ab 1 € gegründet werden kann, bei der die Haftung wie bei der GmbH auf das Gesellschaftsvermögen beschränkt ist, mit Pflicht zur Rücklagenbildung bis zum Erreichen des GmbH-Mindestkapitals.","qPt":"O que é uma UG (haftungsbeschränkt)?","aPt":"Uma \"pequena GmbH\" que pode ser constituída já a partir de 1 € de capital social, em que a responsabilidade, tal como na GmbH, se limita ao património da sociedade, havendo a obrigação de constituir reservas até se atingir o capital social mínimo exigido para a GmbH."},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist eine Marktform \"Monopol\"?","a":"Eine Marktsituation, in der es nur einen einzigen Anbieter für ein Gut oder eine Dienstleistung gibt, der dadurch großen Einfluss auf den Preis hat.","qPt":"O que é a forma de mercado \"monopólio\"?","aPt":"Uma situação de mercado em que existe apenas um único fornecedor de um bem ou serviço, o que lhe confere uma grande influência sobre o preço."},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist eine Marktform \"Oligopol\"?","a":"Eine Marktsituation, in der wenige große Anbieter den Markt dominieren und sich gegenseitig in ihren Entscheidungen (z. B. Preis) beeinflussen.","qPt":"O que é a forma de mercado \"oligopólio\"?","aPt":"Uma situação de mercado em que poucos grandes fornecedores dominam o mercado e influenciam mutuamente as suas decisões (por exemplo, em relação ao preço)."},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist ein Polypol?","a":"Eine Marktform mit vielen Anbietern und vielen Nachfragern, bei der kein einzelner Marktteilnehmer allein den Preis wesentlich beeinflussen kann (z. B. Modell des vollkommenen Marktes).","qPt":"O que é um polipólio (Polypol)?","aPt":"Uma forma de mercado com muitos fornecedores e muitos compradores, em que nenhum participante isolado consegue, por si só, influenciar significativamente o preço (por exemplo, o modelo do mercado perfeito)."},
{"cat":"wiso","sub":"steuern","q":"Was ist die Umsatzsteuer und wer trägt sie wirtschaftlich?","a":"Eine indirekte Steuer auf den Verkauf von Waren und Dienstleistungen, die vom Unternehmen an den Staat abgeführt, aber wirtschaftlich letztlich vom Endverbraucher getragen wird.","qPt":"O que é o Umsatzsteuer (imposto sobre o volume de negócios, correspondente ao IVA) e quem o suporta economicamente?","aPt":"Um imposto indireto sobre a venda de bens e serviços, que é entregue ao Estado pela empresa, mas que, economicamente, é suportado, em última instância, pelo consumidor final."},
{"cat":"wiso","sub":"steuern","q":"Was ist der Unterschied zwischen direkten und indirekten Steuern?","a":"Bei direkten Steuern (z. B. Einkommensteuer) fallen Steuerschuldner und wirtschaftlich Belasteter zusammen. Bei indirekten Steuern (z. B. Umsatzsteuer) führt ein anderer die Steuer ab, als sie wirtschaftlich trägt.","qPt":"Qual é a diferença entre impostos diretos e indiretos?","aPt":"Nos impostos diretos (por exemplo, o imposto sobre o rendimento), o sujeito passivo do imposto coincide com quem economicamente o suporta. Nos impostos indiretos (por exemplo, o imposto sobre o volume de negócios), quem entrega o imposto ao Estado é diferente de quem o suporta economicamente."},
{"cat":"wiso","sub":"steuern","q":"Was besteuert die Gewerbesteuer?","a":"Sie besteuert den Ertrag von Gewerbebetrieben und wird von den Gemeinden erhoben, die auch den Hebesatz festlegen.","qPt":"O que tributa a Gewerbesteuer (imposto sobre a atividade comercial/industrial)?","aPt":"Tributa o rendimento das empresas comerciais/industriais e é cobrada pelos municípios, que também definem a respetiva taxa (Hebesatz)."},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist ein Konjunkturzyklus?","a":"Die wiederkehrende Abfolge von Aufschwung, Boom (Hochkonjunktur), Abschwung und Rezession/Depression in der gesamtwirtschaftlichen Entwicklung.","qPt":"O que é um ciclo económico (Konjunkturzyklus)?","aPt":"A sequência recorrente de recuperação, expansão (boom), abrandamento e recessão/depressão na evolução da economia como um todo."},
{"cat":"wiso","sub":"wirtschaft","q":"Was misst das Bruttoinlandsprodukt (BIP)?","a":"Den Gesamtwert aller im Inland innerhalb eines Zeitraums (meist eines Jahres) hergestellten Waren und Dienstleistungen — ein zentraler Indikator für die wirtschaftliche Leistung eines Landes.","qPt":"O que mede o Produto Interno Bruto (PIB)?","aPt":"O valor total de todos os bens e serviços produzidos no território nacional durante um determinado período (geralmente um ano) — um indicador central do desempenho económico de um país."},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist der Unterschied zwischen Inflation und Deflation?","a":"Inflation beschreibt einen anhaltenden Anstieg des allgemeinen Preisniveaus (Kaufkraftverlust), Deflation einen anhaltenden Rückgang des Preisniveaus.","qPt":"Qual é a diferença entre inflação e deflação?","aPt":"A inflação designa um aumento sustentado do nível geral de preços (com perda de poder de compra); a deflação designa uma queda sustentada do nível de preços."},
{"cat":"wiso","sub":"wirtschaft","q":"Nenne zwei Arten von Arbeitslosigkeit.","a":"Z. B. konjunkturelle Arbeitslosigkeit (durch wirtschaftliche Abschwungphasen), strukturelle Arbeitslosigkeit (durch Wandel von Wirtschaftsstrukturen) und friktionelle Arbeitslosigkeit (durch vorübergehenden Wechsel zwischen Arbeitsplätzen).","qPt":"Indique dois tipos de desemprego.","aPt":"Por exemplo, o desemprego conjuntural (causado por fases de abrandamento económico), o desemprego estrutural (causado por mudanças nas estruturas económicas) e o desemprego friccional (causado pela transição temporária entre postos de trabalho)."},
{"cat":"wiso","sub":"wirtschaft","q":"Was versteht man unter Globalisierung?","a":"Die zunehmende weltweite wirtschaftliche, politische, kulturelle und technologische Vernetzung und gegenseitige Abhängigkeit von Ländern und Märkten.","qPt":"O que se entende por globalização?","aPt":"A crescente interligação e interdependência económica, política, cultural e tecnológica, a nível mundial, entre países e mercados."},
{"cat":"wiso","sub":"wirtschaft","q":"Was sind Standortfaktoren für Unternehmen?","a":"Kriterien, die die Attraktivität eines Wirtschaftsstandorts beeinflussen, z. B. Infrastruktur, Lohnkosten, Verfügbarkeit von Fachkräften, Steuerlast, rechtliche Rahmenbedingungen und Nähe zu Absatzmärkten.","qPt":"O que são fatores de localização (Standortfaktoren) para as empresas?","aPt":"Critérios que influenciam a atratividade de uma localização económica, como a infraestrutura, os custos salariais, a disponibilidade de mão de obra qualificada, a carga fiscal, o quadro legal e a proximidade dos mercados de venda."},
{"cat":"wiso","sub":"schutz","q":"Was regelt das Bundesdatenschutzgesetz (BDSG) im Verhältnis zur DSGVO?","a":"Es ergänzt und konkretisiert die DSGVO für Deutschland dort, wo die DSGVO den Mitgliedstaaten eigenen Regelungsspielraum lässt (z. B. Beschäftigtendatenschutz).","qPt":"O que regula a Bundesdatenschutzgesetz (BDSG, lei federal de proteção de dados) em relação ao RGPD?","aPt":"Complementa e concretiza o RGPD para a Alemanha, nos pontos em que o RGPD deixa aos Estados-membros margem própria de regulamentação (por exemplo, na proteção de dados dos trabalhadores)."},
{"cat":"wiso","sub":"tarif","q":"Was ist eine Betriebsvereinbarung?","a":"Eine schriftliche Vereinbarung zwischen Arbeitgeber und Betriebsrat, die betriebliche Angelegenheiten verbindlich für alle Arbeitnehmer des Betriebs regelt.","qPt":"O que é uma Betriebsvereinbarung (acordo de empresa)?","aPt":"Um acordo escrito entre o empregador e o Betriebsrat que regula, de forma vinculativa para todos os trabalhadores da empresa, questões relativas ao funcionamento da empresa."},
{"cat":"wiso","sub":"schutz","q":"Was verlangt das Arbeitsschutzgesetz (ArbSchG) von Arbeitgebern?","a":"Es verpflichtet Arbeitgeber, Maßnahmen zur Sicherheit und zum Gesundheitsschutz der Beschäftigten bei der Arbeit zu treffen, u. a. durch Gefährdungsbeurteilungen.","qPt":"O que exige a Arbeitsschutzgesetz (ArbSchG, lei de segurança no trabalho) dos empregadores?","aPt":"Obriga os empregadores a adotar medidas de segurança e de proteção da saúde dos trabalhadores no exercício das suas funções, nomeadamente através de avaliações de risco (Gefährdungsbeurteilungen)."},
{"cat":"wiso","sub":"schutz","q":"Was ist eine Gefährdungsbeurteilung?","a":"Eine systematische Ermittlung und Bewertung von Gefahren am Arbeitsplatz mit dem Ziel, geeignete Schutzmaßnahmen abzuleiten.","qPt":"O que é uma Gefährdungsbeurteilung (avaliação de riscos)?","aPt":"Uma identificação e avaliação sistemática dos riscos existentes no local de trabalho, com o objetivo de definir medidas de proteção adequadas."},
{"cat":"wiso","sub":"sonstiges-wiso","q":"Was unterscheidet einen kooperativen von einem autoritären Führungsstil?","a":"Beim kooperativen Führungsstil werden Mitarbeiter in Entscheidungen einbezogen und Verantwortung geteilt. Beim autoritären Führungsstil trifft die Führungskraft Entscheidungen allein und gibt Anweisungen ohne Mitspracherecht der Mitarbeiter.","qPt":"Qual é a diferença entre um estilo de liderança cooperativo e um estilo de liderança autoritário?","aPt":"No estilo de liderança cooperativo, os colaboradores são envolvidos nas decisões e a responsabilidade é partilhada. No estilo de liderança autoritário, é o superior hierárquico que toma as decisões sozinho e dá instruções sem direito de participação dos colaboradores."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was ist ein befristetes Arbeitsverhältnis?","a":"Ein Arbeitsverhältnis, das von vornherein auf einen bestimmten Zeitraum oder Zweck begrenzt ist und ohne Kündigung automatisch mit Fristablauf endet.","qPt":"O que é uma relação de trabalho a termo (contrato a prazo)?","aPt":"Uma relação de trabalho que, desde o início, está limitada a um determinado período ou finalidade e que termina automaticamente com o fim do prazo, sem necessidade de despedimento."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Unter welchen Voraussetzungen ist eine sachgrundlose Befristung nach TzBfG zulässig?","a":"Grundsätzlich bis zu einer Gesamtdauer von 2 Jahren, innerhalb derer eine Verlängerung bis zu dreimal möglich ist, sofern zuvor kein Arbeitsverhältnis mit demselben Arbeitgeber bestand.","qPt":"Em que condições é permitida, segundo a TzBfG (lei alemã do trabalho a tempo parcial e a termo), uma contratação a termo sem motivo justificativo?","aPt":"Em princípio, até uma duração total de 2 anos, dentro da qual é possível renovar o contrato até três vezes, desde que não tenha existido anteriormente uma relação de trabalho com o mesmo empregador."},
{"cat":"wiso","sub":"steuern","q":"Was ist der Unterschied zwischen Brutto- und Nettolohn?","a":"Der Bruttolohn ist der vereinbarte Lohn vor Abzügen. Der Nettolohn ist der tatsächlich ausgezahlte Betrag nach Abzug von Steuern und Sozialversicherungsbeiträgen.","qPt":"Qual é a diferença entre salário bruto e salário líquido?","aPt":"O salário bruto é o valor acordado antes de quaisquer deduções. O salário líquido é o montante efetivamente pago após a dedução de impostos e contribuições para a segurança social."},
{"cat":"wiso","sub":"steuern","q":"Wer trägt die Beiträge zur gesetzlichen Sozialversicherung in Deutschland grundsätzlich?","a":"Sie werden in der Regel paritätisch, also etwa zur Hälfte, von Arbeitgeber und Arbeitnehmer getragen (Ausnahmen z. B. bei der Unfallversicherung, die allein der Arbeitgeber trägt).","qPt":"Quem suporta, em princípio, as contribuições para a segurança social obrigatória na Alemanha?","aPt":"Em regra, são suportadas de forma paritária, ou seja, cerca de metade por cada parte, pelo empregador e pelo trabalhador (há excepções, como o seguro de acidentes de trabalho, que é suportado exclusivamente pelo empregador)."},
{"cat":"wiso","sub":"steuern","q":"Was ist die Künstlersozialkasse und wen betrifft sie?","a":"Eine Einrichtung, über die selbstständige Künstler und Publizisten Zugang zur gesetzlichen Kranken-, Pflege- und Rentenversicherung erhalten, ähnlich wie Arbeitnehmer, wobei ein Teil der Beiträge über eine Abgabe der Verwerter (z. B. Verlage) finanziert wird.","qPt":"O que é a Künstlersozialkasse (caixa de segurança social dos artistas) e quem afeta?","aPt":"Uma instituição através da qual artistas e publicistas independentes têm acesso ao seguro de doença, de dependência e de reforma obrigatórios, de forma semelhante aos trabalhadores por conta de outrem, sendo parte das contribuições financiada por uma taxa paga pelos exploradores das obras (p. ex. editoras)."},
{"cat":"wiso","sub":"unternehmen","q":"Was ist eine Genossenschaft (eG)?","a":"Ein Zusammenschluss von Mitgliedern zur gemeinsamen wirtschaftlichen Förderung, bei dem jedes Mitglied unabhängig von der Kapitaleinlage in der Regel eine Stimme hat.","qPt":"O que é uma Genossenschaft (eG) — uma cooperativa registada?","aPt":"Uma associação de membros com o objetivo de promoção económica conjunta, na qual, independentemente do valor da participação de capital, cada membro tem, em regra, um voto."},
{"cat":"wiso","sub":"unternehmen","q":"Was bedeutet Prokura?","a":"Eine vom Inhaber erteilte, umfassende Vollmacht, die den Prokuristen berechtigt, das Unternehmen fast uneingeschränkt gerichtlich und außergerichtlich zu vertreten.","qPt":"O que significa Prokura (uma procuração comercial segundo o direito alemão)?","aPt":"Uma procuração abrangente, concedida pelo titular da empresa, que autoriza o procurador (Prokurist) a representar a empresa, judicial e extrajudicialmente, de forma quase ilimitada."},
{"cat":"wiso","sub":"unternehmen","q":"Was ist der Unterschied zwischen Vollmacht und Prokura?","a":"Eine Vollmacht kann inhaltlich frei und individuell begrenzt werden. Prokura ist eine besondere, gesetzlich geregelte Form der Handlungsvollmacht mit einem gesetzlich festgelegten, weitreichenden Umfang, die ins Handelsregister eingetragen wird.","qPt":"Qual é a diferença entre uma Vollmacht (procuração) e a Prokura?","aPt":"Uma procuração comum pode ter o seu conteúdo livremente limitado e definido caso a caso. A Prokura é uma forma especial e legalmente regulada de procuração comercial, com um âmbito amplo fixado por lei, que é inscrita no registo comercial (Handelsregister)."},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist ein Wechselkurs?","a":"Das Austauschverhältnis zwischen zwei Währungen, das angibt, wie viel Einheiten einer Währung man für eine Einheit einer anderen Währung erhält.","qPt":"O que é uma taxa de câmbio?","aPt":"A relação de troca entre duas moedas, que indica quantas unidades de uma moeda se obtêm por uma unidade de outra moeda."},
{"cat":"wiso","sub":"wirtschaft","q":"Was versteht man unter Außenhandel (Import/Export)?","a":"Den Austausch von Waren und Dienstleistungen zwischen verschiedenen Ländern — Export bezeichnet den Verkauf ins Ausland, Import den Kauf aus dem Ausland.","qPt":"O que se entende por comércio externo (importação/exportação)?","aPt":"A troca de bens e serviços entre diferentes países — a exportação designa a venda para o estrangeiro, a importação a compra proveniente do estrangeiro."},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist die Handelsbilanz eines Landes?","a":"Die Gegenüberstellung von Exporten und Importen eines Landes innerhalb eines Zeitraums; ein Überschuss der Exporte über die Importe wird als positive Handelsbilanz (Außenhandelsüberschuss) bezeichnet.","qPt":"O que é a balança comercial de um país?","aPt":"A comparação entre as exportações e as importações de um país num determinado período; um excedente das exportações sobre as importações é designado por balança comercial positiva (excedente comercial externo)."},
{"cat":"wiso","sub":"steuern","q":"Was sind Minijobs sozialversicherungsrechtlich?","a":"Geringfügige Beschäftigungen bis zu einer bestimmten monatlichen Verdienstgrenze, die für den Arbeitnehmer weitgehend von der Sozialversicherungspflicht befreit sind; der Arbeitgeber zahlt jedoch Pauschalabgaben.","qPt":"O que são os Minijobs do ponto de vista da segurança social?","aPt":"Empregos de pouca monta (de baixo rendimento) até um determinado limite mensal de remuneração, que estão, em grande parte, isentos da obrigação de contribuição para a segurança social por parte do trabalhador; contudo, o empregador paga contribuições fixas (a taxa fixa)."},
{"cat":"wiso","sub":"arbeitsrecht","q":"Was regelt das Entgeltfortzahlungsgesetz?","a":"Es sichert Arbeitnehmern im Krankheitsfall für bis zu 6 Wochen die Fortzahlung des Arbeitsentgelts durch den Arbeitgeber, sofern bestimmte Voraussetzungen (z. B. Mindestbeschäftigungsdauer) erfüllt sind.","qPt":"O que regula o Entgeltfortzahlungsgesetz (lei alemã da continuidade do pagamento do salário)?","aPt":"Garante aos trabalhadores, em caso de doença, a continuação do pagamento do salário pelo empregador durante até 6 semanas, desde que estejam reunidos determinados requisitos (p. ex., um tempo mínimo de vínculo laboral)."},
{"cat":"wiso","sub":"steuern","q":"Was ist eine betriebliche Altersvorsorge (bAV)?","a":"Eine zusätzliche, vom Arbeitgeber organisierte oder ermöglichte Form der Altersversorgung, die die gesetzliche Rente ergänzen soll, z. B. über Entgeltumwandlung.","qPt":"O que é a betriebliche Altersvorsorge (bAV) — a previdência de reforma empresarial?","aPt":"Uma forma complementar de previdência para a reforma, organizada ou facilitada pelo empregador, destinada a complementar a pensão de reforma pública, por exemplo através da conversão de parte do salário em contribuições (Entgeltumwandlung)."},
{"cat":"wiso","sub":"steuern","q":"Was versteht man unter dem Arbeitgeberzuschuss zur betrieblichen Altersvorsorge?","a":"Ein gesetzlich vorgeschriebener Zuschuss, den der Arbeitgeber bei Entgeltumwandlung zusätzlich in die betriebliche Altersvorsorge einzahlen muss, da er durch die Umwandlung Sozialversicherungsbeiträge einspart.","qPt":"O que se entende pela comparticipação obrigatória do empregador na previdência de reforma empresarial?","aPt":"Uma comparticipação exigida por lei, que o empregador tem de pagar adicionalmente para a previdência de reforma empresarial quando há conversão de salário, uma vez que essa conversão lhe permite poupar contribuições para a segurança social."},
{"cat":"wiso","sub":"unternehmen","q":"Was ist der Unterschied zwischen einer Aktiengesellschaft (AG) und einer GmbH bezüglich der Organe?","a":"Bei der AG gibt es zwingend Vorstand, Aufsichtsrat und Hauptversammlung. Bei der GmbH sind Geschäftsführung und Gesellschafterversammlung Pflichtorgane, ein Aufsichtsrat ist meist nur ab einer bestimmten Unternehmensgröße vorgeschrieben.","qPt":"Qual é a diferença entre uma Aktiengesellschaft (AG) — sociedade anónima — e uma GmbH — sociedade por quotas — no que respeita aos órgãos sociais?","aPt":"Na AG existem obrigatoriamente a Vorstand (direção/administração), o Aufsichtsrat (conselho fiscal/de supervisão) e a Hauptversammlung (assembleia geral de acionistas). Na GmbH, a gerência (Geschäftsführung) e a assembleia de sócios (Gesellschafterversammlung) são órgãos obrigatórios; um conselho fiscal só é normalmente exigido a partir de determinada dimensão da empresa."},
{"cat":"wiso","sub":"unternehmen","q":"Was ist eine Hauptversammlung bei einer AG?","a":"Das oberste Organ der Aktiengesellschaft, in dem die Aktionäre über zentrale Angelegenheiten (z. B. Gewinnverwendung, Wahl des Aufsichtsrats, Satzungsänderungen) entscheiden.","qPt":"O que é a Hauptversammlung numa AG — a assembleia geral de acionistas de uma sociedade anónima?","aPt":"O órgão supremo da sociedade anónima, no qual os acionistas decidem sobre assuntos centrais (p. ex., a aplicação dos resultados, a eleição do conselho fiscal, alterações aos estatutos)."},
{"cat":"wiso","sub":"tarif","q":"Was bedeutet Mitbestimmung auf Unternehmensebene (z. B. im Aufsichtsrat)?","a":"Arbeitnehmervertreter erhalten (je nach Unternehmensgröße und Mitbestimmungsgesetz) Sitze im Aufsichtsrat und können so auf unternehmerische Grundsatzentscheidungen Einfluss nehmen.","qPt":"O que significa a cogestão (Mitbestimmung) ao nível da empresa (p. ex., no conselho fiscal)?","aPt":"Os representantes dos trabalhadores obtêm (dependendo da dimensão da empresa e da lei de cogestão aplicável) assentos no conselho fiscal, podendo assim influenciar decisões empresariais de fundo."},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist der Unterschied zwischen Real- und Nominallohn?","a":"Der Nominallohn ist der in Geld ausgezahlte Betrag. Der Reallohn beschreibt die tatsächliche Kaufkraft dieses Betrags unter Berücksichtigung der Inflation.","qPt":"Qual é a diferença entre salário real e salário nominal?","aPt":"O salário nominal é o montante pago em dinheiro. O salário real descreve o poder de compra efetivo desse montante, tendo em conta a inflação."},
{"cat":"wiso","sub":"wirtschaft","q":"Was ist eine Volkswirtschaftliche Gesamtrechnung (VGR)?","a":"Ein statistisches System, das die wirtschaftliche Leistung und die Wertschöpfung einer Volkswirtschaft über einen Zeitraum erfasst, u. a. zur Berechnung des BIP.","qPt":"O que é a Volkswirtschaftliche Gesamtrechnung (VGR) — a contabilidade nacional?","aPt":"Um sistema estatístico que regista o desempenho económico e o valor acrescentado de uma economia num determinado período, servindo, entre outros fins, para calcular o PIB."},
{"cat":"wiso","sub":"wirtschaft","q":"Was versteht man unter sozialer Marktwirtschaft?","a":"Ein Wirtschaftssystem, das die Freiheit des Marktes (Angebot und Nachfrage, Wettbewerb) mit sozialem Ausgleich durch den Staat verbindet, z. B. durch Sozialversicherungen und Arbeitnehmerschutzrechte.","qPt":"O que se entende por economia social de mercado?","aPt":"Um sistema económico que combina a liberdade do mercado (oferta e procura, concorrência) com o equilíbrio social assegurado pelo Estado, por exemplo através de seguros sociais e de direitos de proteção dos trabalhadores."},
{"cat":"wiso","sub":"tarif","q":"Was ist der Unterschied zwischen Streik und Aussperrung hinsichtlich der Initiative?","a":"Der Streik ist eine Arbeitskampfmaßnahme der Arbeitnehmerseite (organisiert durch Gewerkschaften), die Aussperrung eine Gegenmaßnahme der Arbeitgeberseite.","qPt":"Qual é a diferença entre greve e lockout no que respeita à iniciativa?","aPt":"A greve é uma medida de luta laboral da parte dos trabalhadores (organizada pelos sindicatos), enquanto o lockout é uma contramedida da parte do empregador."},
{"cat":"algo","sub":"sql","q":"Was ist der Fehler in diesem UPDATE-Statement?","a":"Es fehlt eine WHERE-Klausel — ohne sie wird nachname bei ALLEN Zeilen der Tabelle kunden auf 'Müller' gesetzt, nicht nur bei einem bestimmten Kunden.","qCode":"UPDATE kunden\nSET nachname = 'Müller';","aCode":"UPDATE kunden\nSET nachname = 'Müller'\nWHERE kunden_id = 17;","qPt":"Qual é o erro nesta instrução UPDATE?","aPt":"Falta uma cláusula WHERE — sem ela, o campo nachname é definido como 'Müller' em TODAS as linhas da tabela kunden, e não apenas num cliente específico."},
{"cat":"algo","sub":"sql","q":"Ist dieses Statement wahrscheinlich ein Fehler — und warum?","a":"Ohne WHERE-Klausel löscht DELETE FROM bestellungen ALLE Zeilen der Tabelle. Das ist fast immer ein Fehler, wenn nicht wirklich die ganze Tabelle geleert werden soll.","qCode":"DELETE FROM bestellungen;","aCode":"DELETE FROM bestellungen\nWHERE status = 'storniert';\n-- oder, falls wirklich ALLE Zeilen weg sollen:\nTRUNCATE TABLE bestellungen;","qPt":"Esta instrução é provavelmente um erro — e porquê?","aPt":"Sem cláusula WHERE, o DELETE FROM bestellungen elimina TODAS as linhas da tabela. Isto é quase sempre um erro, a menos que se pretenda mesmo esvaziar a tabela por completo."},
{"cat":"algo","sub":"sql","q":"Warum schlägt dieses INSERT-Statement fehl?","a":"Die Spaltenliste nennt 3 Spalten (vorname, nachname, plz), aber es werden nur 2 Werte angegeben — für jede genannte Spalte muss genau ein Wert folgen.","qCode":"INSERT INTO kunden (vorname, nachname, plz)\nVALUES ('Anna', 'Schmidt');","aCode":"INSERT INTO kunden (vorname, nachname, plz)\nVALUES ('Anna', 'Schmidt', '10115');","qPt":"Por que motivo falha esta instrução INSERT?","aPt":"A lista de colunas indica 3 colunas (vorname, nachname, plz), mas só são fornecidos 2 valores — para cada coluna indicada tem de seguir-se exatamente um valor."},
{"cat":"algo","sub":"sql","q":"Warum liefert diese Abfrage nie ein Ergebnis, selbst wenn austrittsdatum leer ist?","a":"NULL steht für \"unbekannt\" und kann nicht mit = verglichen werden — x = NULL ergibt immer NULL (nicht wahr), nie TRUE.","qCode":"SELECT * FROM mitarbeiter\nWHERE austrittsdatum = NULL;","aCode":"SELECT * FROM mitarbeiter\nWHERE austrittsdatum IS NULL;","qPt":"Por que motivo esta consulta nunca devolve resultados, mesmo quando austrittsdatum está vazio?","aPt":"NULL representa \"desconhecido\" e não pode ser comparado com =. A expressão x = NULL dá sempre NULL (não é verdadeiro), nunca TRUE."},
{"cat":"algo","sub":"sql","q":"Was ist an diesem Statement problematisch?","a":"nachname wird ausgewählt, steht aber nicht in GROUP BY und ist auch keine Aggregatfunktion — pro Gruppe könnten mehrere unterschiedliche nachname-Werte vorkommen.","qCode":"SELECT vorname, nachname, COUNT(*)\nFROM bestellungen\nGROUP BY vorname;","aCode":"SELECT vorname, nachname, COUNT(*)\nFROM bestellungen\nGROUP BY vorname, nachname;","qPt":"O que há de problemático nesta instrução?","aPt":"A coluna nachname é selecionada, mas não consta no GROUP BY nem é o resultado de uma função de agregação — em cada grupo podem existir vários valores diferentes de nachname."},
{"cat":"algo","sub":"sql","q":"Was fehlt hier, und was ist die Folge?","a":"Es fehlt die ON- bzw. USING-Bedingung des JOINs. In den meisten Datenbanksystemen (z. B. PostgreSQL, Oracle, SQL Server) ist ein JOIN ohne Bedingung ein Syntaxfehler, da ON oder USING zwingend vorgeschrieben ist. Einige Systeme wie MySQL akzeptieren es dagegen und werten es als kartesisches Produkt: jede Zeile aus a wird mit jeder Zeile aus b kombiniert, statt gezielt verknüpft zu werden.","qCode":"SELECT a.name, b.name\nFROM mitarbeiter a\nJOIN abteilung b;","aCode":"SELECT a.name, b.name\nFROM mitarbeiter a\nJOIN abteilung b ON a.abteilung_id = b.id;","qPt":"O que falta aqui, e qual é a consequência?","aPt":"Falta a condição ON ou USING do JOIN. Na maioria dos sistemas de bases de dados (p. ex., PostgreSQL, Oracle, SQL Server), um JOIN sem condição é um erro de sintaxe, já que ON ou USING é obrigatório. Alguns sistemas, como o MySQL, aceitam-no e interpretam-no como um produto cartesiano: cada linha de a é combinada com cada linha de b, em vez de serem ligadas de forma específica."},
{"cat":"algo","sub":"sql","q":"Warum verursacht diese Abfrage einen Syntaxfehler?","a":"Das schließende einfache Anführungszeichen nach München fehlt — das String-Literal ist nicht korrekt abgeschlossen.","qCode":"SELECT name FROM kunden WHERE ort = 'München;","aCode":"SELECT name FROM kunden WHERE ort = 'München';","qPt":"Por que motivo esta consulta provoca um erro de sintaxe?","aPt":"Falta a aspa simples de fecho depois de München — o literal de texto (string) não está corretamente fechado."},
{"cat":"algo","sub":"sql","q":"Warum funktioniert dieses Statement nicht direkt so?","a":"Aggregatfunktionen wie AVG() dürfen nicht direkt in WHERE stehen, da WHERE vor der Aggregation ausgewertet wird. Lösung: eine Subquery verwenden.","qCode":"SELECT name, gehalt\nFROM mitarbeiter\nWHERE gehalt > AVG(gehalt);","aCode":"SELECT name, gehalt\nFROM mitarbeiter\nWHERE gehalt > (SELECT AVG(gehalt) FROM mitarbeiter);","qPt":"Por que motivo esta instrução não funciona desta forma direta?","aPt":"Funções de agregação como AVG() não podem ser usadas diretamente na cláusula WHERE, uma vez que o WHERE é avaliado antes da agregação. Solução: utilizar uma subquery."},
{"cat":"algo","sub":"sql","q":"Was ist an diesem Statement syntaktisch falsch?","a":"Ein UPDATE darf nur eine SET-Klausel haben; mehrere Spalten werden durch Komma getrennt in derselben SET-Klausel gesetzt, vor der WHERE-Klausel.","qCode":"UPDATE produkte\nSET preis = preis * 1.1\nWHERE kategorie = 'Elektronik'\nSET lagerbestand = lagerbestand - 1;","aCode":"UPDATE produkte\nSET preis = preis * 1.1,\n    lagerbestand = lagerbestand - 1\nWHERE kategorie = 'Elektronik';","qPt":"O que está sintaticamente errado nesta instrução?","aPt":"Um UPDATE só pode ter uma cláusula SET; várias colunas são definidas na mesma cláusula SET, separadas por vírgulas, antes da cláusula WHERE."},
{"cat":"algo","sub":"sql","q":"Ist dieses Statement falsch? Was unterscheidet es von einem expliziten JOIN?","a":"Syntaktisch gültig (impliziter JOIN über Komma mit Bedingung in WHERE) und liefert dasselbe wie ein INNER JOIN — gilt aber als schlechter Stil, da die Join-Bedingung leicht vergessen werden kann.","qCode":"SELECT * FROM kunden, bestellungen\nWHERE kunden.id = bestellungen.kunden_id;","aCode":"SELECT *\nFROM kunden\nJOIN bestellungen ON kunden.id = bestellungen.kunden_id;","qPt":"Esta instrução está errada? O que a distingue de um JOIN explícito?","aPt":"É sintaticamente válida (um JOIN implícito através de vírgula, com a condição na cláusula WHERE) e produz o mesmo resultado que um INNER JOIN — mas é considerada má prática, já que a condição de junção pode facilmente ser esquecida."},
{"cat":"algo","sub":"sql","q":"Welches Risiko birgt dieses INSERT-Statement, auch wenn es aktuell funktioniert?","a":"Ohne explizite Spaltenliste verlässt sich das Statement auf die physische Spaltenreihenfolge der Tabelle. Ändert sich diese später, landen Werte in den falschen Spalten, ohne dass sofort ein Fehler auftritt.","qCode":"INSERT INTO kunden VALUES ('Lisa', 'Berlin');","aCode":"INSERT INTO kunden (vorname, stadt)\nVALUES ('Lisa', 'Berlin');","qPt":"Que risco traz esta instrução INSERT, mesmo que funcione atualmente?","aPt":"Sem uma lista explícita de colunas, a instrução depende da ordem física das colunas na tabela. Se essa ordem for alterada mais tarde, os valores acabam em colunas erradas, sem que ocorra imediatamente um erro."},
{"cat":"algo","sub":"sql","q":"Unter welcher Bedingung schlägt dieses Statement zur Laufzeit fehl?","a":"Liefert die Subquery mehr als eine Zeile (z. B. mehrere Abteilungen mit demselben Namen), schlägt der Vergleich mit = fehl, da = nur einen einzelnen Wert erwartet.","qCode":"SELECT nachname\nFROM mitarbeiter\nWHERE abteilung_id = (\n  SELECT id FROM abteilung WHERE name = 'Vertrieb'\n);","aCode":"SELECT nachname\nFROM mitarbeiter\nWHERE abteilung_id IN (\n  SELECT id FROM abteilung WHERE name = 'Vertrieb'\n);","qPt":"Em que condição falha esta instrução em tempo de execução?","aPt":"Se a subquery devolver mais do que uma linha (p. ex., vários departamentos com o mesmo nome), a comparação com = falha, já que o = espera apenas um único valor."},
{"cat":"algo","sub":"sql","q":"Warum ist dieses Statement wahrscheinlich nicht das, was beabsichtigt war?","a":"AND bindet stärker als OR, daher wird dies als (kunden_id = 5 AND status = 'offen') OR status = 'storniert' ausgewertet — dadurch werden auch stornierte Bestellungen ANDERER Kunden gelöscht.","qCode":"DELETE FROM bestellungen\nWHERE kunden_id = 5\n  AND status = 'offen'\n  OR status = 'storniert';","aCode":"DELETE FROM bestellungen\nWHERE kunden_id = 5\n  AND (status = 'offen' OR status = 'storniert');","qPt":"Por que motivo esta instrução provavelmente não corresponde ao que se pretendia?","aPt":"O AND tem precedência sobre o OR, por isso isto é avaliado como (kunden_id = 5 AND status = 'offen') OR status = 'storniert' — com isto, também são eliminadas encomendas canceladas de OUTROS clientes."},
{"cat":"algo","sub":"sql","q":"Warum kann dieses Statement bei einer bereits gefüllten Tabelle fehlschlagen?","a":"Eine neue NOT NULL-Spalte ohne Default-Wert kann für bereits existierende Zeilen keinen gültigen Wert erhalten — viele Datenbanksysteme lehnen das ohne DEFAULT ab.","qCode":"ALTER TABLE kunden\nADD COLUMN telefon VARCHAR(20) NOT NULL;","aCode":"ALTER TABLE kunden\nADD COLUMN telefon VARCHAR(20) NOT NULL DEFAULT '';","qPt":"Por que motivo esta instrução pode falhar numa tabela já preenchida com dados?","aPt":"Uma nova coluna NOT NULL sem valor por defeito (DEFAULT) não tem como receber um valor válido nas linhas já existentes — muitos sistemas de bases de dados rejeitam isto se não for indicado um DEFAULT."},
{"cat":"algo","sub":"sql","q":"Was ist hier falsch?","a":"Aggregatfunktionen dürfen nicht in WHERE stehen — Filterungen auf aggregierte Werte gehören in die HAVING-Klausel, die nach der Gruppierung ausgewertet wird.","qCode":"SELECT kunde_id, SUM(betrag) AS summe\nFROM bestellungen\nWHERE SUM(betrag) > 1000\nGROUP BY kunde_id;","aCode":"SELECT kunde_id, SUM(betrag) AS summe\nFROM bestellungen\nGROUP BY kunde_id\nHAVING SUM(betrag) > 1000;","qPt":"O que está errado aqui?","aPt":"Funções de agregação não podem estar na cláusula WHERE — filtros sobre valores agregados pertencem à cláusula HAVING, que é avaliada depois do agrupamento."},
{"cat":"algo","sub":"sql","q":"Was ist an der zweiten JOIN-Bedingung wahrscheinlich ein Fehler?","a":"m.id = a.id verknüpft die Mitarbeiter-ID direkt mit der Abteilungs-ID — das sind unterschiedliche Entitäten. Vermutlich sollte über ein Fremdschlüsselfeld verknüpft werden.","qCode":"SELECT *\nFROM mitarbeiter m\nJOIN gehalt g ON m.id = g.mitarbeiter_id\nJOIN abteilung a ON m.id = a.id;","aCode":"SELECT *\nFROM mitarbeiter m\nJOIN gehalt g ON m.id = g.mitarbeiter_id\nJOIN abteilung a ON m.abteilung_id = a.id;","qPt":"O que é provavelmente um erro na segunda condição de JOIN?","aPt":"m.id = a.id liga diretamente o ID do funcionário ao ID do departamento — tratam-se de entidades diferentes. Provavelmente a ligação deveria ser feita através de um campo de chave estrangeira."},
{"cat":"algo","sub":"sql","q":"Welcher Syntaxfehler steckt in diesem CREATE TABLE-Statement?","a":"Zwischen den Spaltendefinitionen datum DATE und betrag DECIMAL(10,2) fehlt ein Komma als Trennzeichen.","qCode":"CREATE TABLE bestellungen (\n  id INT PRIMARY KEY,\n  kunde_id INT,\n  datum DATE\n  betrag DECIMAL(10,2)\n);","aCode":"CREATE TABLE bestellungen (\n  id INT PRIMARY KEY,\n  kunde_id INT,\n  datum DATE,\n  betrag DECIMAL(10,2)\n);","qPt":"Que erro de sintaxe existe nesta instrução CREATE TABLE?","aPt":"Falta uma vírgula como separador entre as definições de coluna datum DATE e betrag DECIMAL(10,2)."},
{"cat":"algo","sub":"sql","q":"Was ist an diesem Statement syntaktisch falsch?","a":"Nach 500 steht ein überflüssiges Komma vor der schließenden Klammer — das ist ein Syntaxfehler.","qCode":"SELECT name FROM kunden\nWHERE id IN (\n  SELECT kunde_id FROM bestellungen WHERE betrag > 500,\n);","aCode":"SELECT name FROM kunden\nWHERE id IN (\n  SELECT kunde_id FROM bestellungen WHERE betrag > 500\n);","qPt":"O que está sintaticamente errado nesta instrução?","aPt":"Depois de 500 existe uma vírgula a mais antes do parêntese de fecho — isso é um erro de sintaxe."},
{"cat":"algo","sub":"sql","q":"Warum liefert diese Abfrage vermutlich viel mehr Zeilen als erwartet?","a":"Es fehlt jede Verknüpfungsbedingung zwischen den beiden Tabellen — das Ergebnis ist ein kartesisches Produkt: jede Zeile aus mitarbeiter wird mit jeder Zeile aus abteilung kombiniert.","qCode":"SELECT name, abteilung\nFROM mitarbeiter, abteilung;","aCode":"SELECT name, abteilung\nFROM mitarbeiter\nJOIN abteilung ON mitarbeiter.abteilung_id = abteilung.id;","qPt":"Por que motivo esta consulta devolve provavelmente muitas mais linhas do que o esperado?","aPt":"Falta qualquer condição de ligação entre as duas tabelas — o resultado é um produto cartesiano: cada linha de mitarbeiter é combinada com cada linha de abteilung."},
{"cat":"algo","sub":"sql","q":"Diese beiden Überweisungs-Statements laufen einzeln ohne Fehler — was fehlt trotzdem für den sicheren Praxiseinsatz?","a":"Eine Transaktion um beide Statements herum. Ohne sie könnte z. B. nach dem ersten UPDATE ein Systemabsturz passieren — Geld wird abgebucht, aber nie gutgeschrieben. Das verletzt die Atomicity (A in ACID).","qCode":"UPDATE konto SET saldo = saldo - 100 WHERE konto_id = 1;\nUPDATE konto SET saldo = saldo + 100 WHERE konto_id = 2;","aCode":"BEGIN TRANSACTION;\nUPDATE konto SET saldo = saldo - 100 WHERE konto_id = 1;\nUPDATE konto SET saldo = saldo + 100 WHERE konto_id = 2;\nCOMMIT;","qPt":"Estas duas instruções de transferência executam-se individualmente sem erro — o que falta, ainda assim, para uma utilização segura em produção?","aPt":"Uma transação que envolva as duas instruções. Sem ela, poderia ocorrer, por exemplo, uma falha do sistema logo após o primeiro UPDATE — o dinheiro seria debitado, mas nunca creditado. Isto viola a Atomicity (o A do ACID)."},
{"cat":"plan","sub":"uml","q":"Was zeigt dieses Diagramm, und was bedeutet die Multiplizität \"0..*\" auf der Seite von Bestellung?","a":"Es zeigt eine Assoziation zwischen den Klassen Kunde und Bestellung. Die Multiplizität 1 auf der Kunde-Seite und 0..* auf der Bestellung-Seite bedeutet: Ein Kunde kann keine, eine oder mehrere Bestellungen haben, aber jede Bestellung gehört zu genau einem Kunden.","qSvg":"<svg viewBox=\"0 0 360 110\" xmlns=\"http://www.w3.org/2000/svg\"><style>text{font-family:'JetBrains Mono',monospace;}.box{fill:var(--card);stroke:var(--ink);stroke-width:1.2;}.lbl{font-size:12px;fill:var(--ink);font-weight:600;}.mult{font-size:10px;fill:var(--ink-soft);}.conn{stroke:var(--ink-soft);stroke-width:1.2;}</style><rect class=\"box\" x=\"15\" y=\"30\" width=\"110\" height=\"40\" rx=\"2\"/><text class=\"lbl\" x=\"70\" y=\"54\" text-anchor=\"middle\">Kunde</text><rect class=\"box\" x=\"235\" y=\"30\" width=\"110\" height=\"40\" rx=\"2\"/><text class=\"lbl\" x=\"290\" y=\"54\" text-anchor=\"middle\">Bestellung</text><line class=\"conn\" x1=\"125\" y1=\"50\" x2=\"235\" y2=\"50\"/><text class=\"mult\" x=\"133\" y=\"44\">1</text><text class=\"mult\" x=\"200\" y=\"44\">0..*</text></svg>","qPt":"O que mostra este diagrama, e o que significa a multiplicidade \"0..*\" do lado de Bestellung?","aPt":"Mostra uma associação entre as classes Kunde (cliente) e Bestellung (encomenda). A multiplicidade 1 do lado de Kunde e 0..* do lado de Bestellung significa: um Kunde pode ter nenhuma, uma ou várias Bestellung, mas cada Bestellung pertence exatamente a um Kunde."},
{"cat":"plan","sub":"uml","q":"Welche der beiden Beziehungen ist die Aggregation und welche die Komposition — und woran erkennt man den Unterschied in der Notation?","a":"Links (offene, nicht gefüllte Raute) steht die Aggregation: Ein Rad kann unabhängig vom Fahrzeug existieren. Rechts (gefüllte Raute) steht die Komposition: Ein Zimmer ist existenzabhängig vom Haus — wird das Haus abgerissen, verschwindet auch das Zimmer als Teil davon.","qSvg":"<svg viewBox=\"0 0 410 110\" xmlns=\"http://www.w3.org/2000/svg\"><style>text{font-family:'JetBrains Mono',monospace;}.box{fill:var(--card);stroke:var(--ink);stroke-width:1.2;}.lbl{font-size:11px;fill:var(--ink);font-weight:600;}.cap{font-size:10px;fill:var(--ink-soft);}.conn{stroke:var(--ink-soft);stroke-width:1.2;}</style><text class=\"cap\" x=\"10\" y=\"14\">Aggregation (offene Raute)</text><rect class=\"box\" x=\"10\" y=\"45\" width=\"90\" height=\"34\" rx=\"2\"/><text class=\"lbl\" x=\"55\" y=\"66\" text-anchor=\"middle\">Fahrzeug</text><polygon points=\"108,72 118,66 128,72 118,78\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><line class=\"conn\" x1=\"100\" y1=\"72\" x2=\"108\" y2=\"72\"/><line class=\"conn\" x1=\"128\" y1=\"72\" x2=\"138\" y2=\"72\"/><rect class=\"box\" x=\"138\" y=\"55\" width=\"60\" height=\"34\" rx=\"2\"/><text class=\"lbl\" x=\"168\" y=\"76\" text-anchor=\"middle\">Rad</text><text class=\"cap\" x=\"210\" y=\"14\">Komposition (gefüllte Raute)</text><rect class=\"box\" x=\"210\" y=\"45\" width=\"80\" height=\"34\" rx=\"2\"/><text class=\"lbl\" x=\"250\" y=\"66\" text-anchor=\"middle\">Haus</text><polygon points=\"298,72 308,66 318,72 308,78\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><line class=\"conn\" x1=\"290\" y1=\"72\" x2=\"298\" y2=\"72\"/><line class=\"conn\" x1=\"318\" y1=\"72\" x2=\"328\" y2=\"72\"/><rect class=\"box\" x=\"328\" y=\"55\" width=\"70\" height=\"34\" rx=\"2\"/><text class=\"lbl\" x=\"363\" y=\"76\" text-anchor=\"middle\">Zimmer</text></svg>","qPt":"Qual das duas relações é a agregação e qual é a composição — e como se reconhece a diferença na notação?","aPt":"À esquerda (losango aberto, não preenchido) está a agregação: uma Rad (roda) pode existir independentemente do Fahrzeug (veículo). À direita (losango preenchido) está a composição: um Zimmer (quarto) depende existencialmente da Haus (casa) — se a casa for demolida, o quarto desaparece também, como parte dela."},
{"cat":"plan","sub":"uml","q":"Was drückt dieser Pfeil mit der offenen, nicht gefüllten Dreiecksspitze zwischen Auto und Fahrzeug aus?","a":"Er zeigt eine Generalisierung/Vererbung: Auto ist eine Spezialisierung von Fahrzeug (\"Auto ist ein Fahrzeug\"). Der Pfeil zeigt dabei immer von der Unterklasse zur Oberklasse.","qSvg":"<svg viewBox=\"0 0 220 170\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"genArrow\" markerWidth=\"14\" markerHeight=\"12\" refX=\"11\" refY=\"6\" orient=\"auto\"><path d=\"M0,0 L12,6 L0,12 Z\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1\"/></marker></defs><style>text{font-family:'JetBrains Mono',monospace;}.box{fill:var(--card);stroke:var(--ink);stroke-width:1.2;}.lbl{font-size:12px;fill:var(--ink);font-weight:600;}</style><rect class=\"box\" x=\"55\" y=\"15\" width=\"110\" height=\"36\" rx=\"2\"/><text class=\"lbl\" x=\"110\" y=\"38\" text-anchor=\"middle\">Fahrzeug</text><rect class=\"box\" x=\"55\" y=\"118\" width=\"110\" height=\"36\" rx=\"2\"/><text class=\"lbl\" x=\"110\" y=\"141\" text-anchor=\"middle\">Auto</text><line x1=\"110\" y1=\"118\" x2=\"110\" y2=\"58\" stroke=\"var(--ink)\" stroke-width=\"1.3\" marker-end=\"url(#genArrow)\"/></svg>","qPt":"O que exprime esta seta com a ponta triangular aberta, não preenchida, entre Auto e Fahrzeug?","aPt":"Mostra uma generalização/herança: Auto (carro) é uma especialização de Fahrzeug (veículo) (\"um Auto é um Fahrzeug\"). A seta aponta sempre da subclasse para a superclasse."},
{"cat":"plan","sub":"uml","q":"Was bedeutet die gestrichelte Verbindung mit der Beschriftung «include» zwischen den beiden Anwendungsfällen?","a":"Der Anwendungsfall \"Bestellung aufgeben\" schließt \"Zahlung prüfen\" zwingend mit ein — jedes Mal, wenn \"Bestellung aufgeben\" ausgeführt wird, läuft automatisch auch \"Zahlung prüfen\" mit. Die Pfeilspitze zeigt dabei vom Basis-Anwendungsfall zum eingeschlossenen Anwendungsfall. Das unterscheidet «include» von «extend», wo die Einbindung nur optional erfolgt.","qSvg":"<svg viewBox=\"0 0 380 190\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"incArrow\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1\"/></marker></defs><style>text{font-family:'JetBrains Mono',monospace;font-size:11px;fill:var(--ink);}.cap{font-size:9px;fill:var(--ink-soft);}.oval{fill:var(--card);stroke:var(--ink);stroke-width:1.2;}.conn{stroke:var(--ink-soft);stroke-width:1.2;fill:none;}.person{stroke:var(--ink);stroke-width:1.3;fill:none;}</style><circle class=\"person\" cx=\"30\" cy=\"40\" r=\"9\"/><line class=\"person\" x1=\"30\" y1=\"49\" x2=\"30\" y2=\"80\"/><line class=\"person\" x1=\"14\" y1=\"60\" x2=\"46\" y2=\"60\"/><line class=\"person\" x1=\"30\" y1=\"80\" x2=\"16\" y2=\"105\"/><line class=\"person\" x1=\"30\" y1=\"80\" x2=\"44\" y2=\"105\"/><text x=\"10\" y=\"120\">Kunde</text><ellipse class=\"oval\" cx=\"220\" cy=\"55\" rx=\"100\" ry=\"30\"/><text x=\"220\" y=\"59\" text-anchor=\"middle\">Bestellung aufgeben</text><ellipse class=\"oval\" cx=\"220\" cy=\"150\" rx=\"95\" ry=\"30\"/><text x=\"220\" y=\"154\" text-anchor=\"middle\">Zahlung prüfen</text><line class=\"conn\" x1=\"46\" y1=\"55\" x2=\"120\" y2=\"55\"/><line x1=\"220\" y1=\"85\" x2=\"220\" y2=\"118\" stroke=\"var(--ink-soft)\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\" marker-end=\"url(#incArrow)\"/><text class=\"cap\" x=\"226\" y=\"105\">«include»</text></svg>","qPt":"O que significa a ligação tracejada com a indicação «include» entre os dois casos de utilização?","aPt":"O caso de utilização \"Bestellung aufgeben\" (fazer encomenda) inclui obrigatoriamente \"Zahlung prüfen\" (verificar pagamento) — sempre que \"Bestellung aufgeben\" é executado, \"Zahlung prüfen\" é automaticamente executado também. A ponta da seta aponta do caso de utilização base para o caso de utilização incluído. Isto distingue «include» de «extend», em que a inclusão é apenas opcional."},
