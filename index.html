{"cat":"plan","sub":"uml","q":"Was ist der Unterschied zwischen dem durchgezogenen und dem gestrichelten Pfeil in diesem Sequenzdiagramm?","a":"Der durchgezogene Pfeil (bestellen()) ist ein synchroner Nachrichtenaufruf vom Kunden an den Webshop. Der gestrichelte Pfeil (Bestätigung) ist die zugehörige Rückantwort (Return-Nachricht) vom Webshop zurück an den Kunden.","qSvg":"<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"seqArrow1\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"var(--ink)\"/></marker><marker id=\"seqArrow2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1\"/></marker></defs><style>text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:var(--ink);}.box{fill:var(--card);stroke:var(--ink);stroke-width:1.2;}.life{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:3 3;}</style><rect class=\"box\" x=\"20\" y=\"8\" width=\"80\" height=\"28\" rx=\"2\"/><text x=\"60\" y=\"26\" text-anchor=\"middle\">Kunde</text><rect class=\"box\" x=\"220\" y=\"8\" width=\"80\" height=\"28\" rx=\"2\"/><text x=\"260\" y=\"26\" text-anchor=\"middle\">Webshop</text><line class=\"life\" x1=\"60\" y1=\"36\" x2=\"60\" y2=\"165\"/><line class=\"life\" x1=\"260\" y1=\"36\" x2=\"260\" y2=\"165\"/><line x1=\"60\" y1=\"70\" x2=\"258\" y2=\"70\" stroke=\"var(--ink)\" stroke-width=\"1.3\" marker-end=\"url(#seqArrow1)\"/><text x=\"70\" y=\"64\">bestellen()</text><line x1=\"260\" y1=\"120\" x2=\"62\" y2=\"120\" stroke=\"var(--ink)\" stroke-width=\"1.1\" stroke-dasharray=\"5 3\" marker-end=\"url(#seqArrow2)\"/><text x=\"100\" y=\"114\">Bestätigung</text></svg>","qPt":"Qual é a diferença entre a seta contínua e a seta tracejada neste diagrama de sequência?","aPt":"A seta contínua (bestellen()) é uma chamada de mensagem síncrona do Kunde (cliente) para o Webshop. A seta tracejada (Bestätigung — confirmação) é a resposta correspondente (mensagem de retorno) do Webshop de volta para o Kunde."},
{"cat":"plan","sub":"uml","q":"Wie liest man die Kardinalitäten 1 und n in diesem ER-Diagramm zwischen Autor und Buch?","a":"Ein Autor (1) kann n Bücher schreiben, aber jedes Buch wird in diesem Modell genau einem Autor zugeordnet — es handelt sich um eine 1:n-Beziehung zwischen Autor und Buch.","qSvg":"<svg viewBox=\"0 0 360 120\" xmlns=\"http://www.w3.org/2000/svg\"><style>text{font-family:'JetBrains Mono',monospace;}.box{fill:var(--card);stroke:var(--ink);stroke-width:1.2;}.lbl{font-size:12px;fill:var(--ink);font-weight:600;}.mult{font-size:10px;fill:var(--ink-soft);}.conn{stroke:var(--ink-soft);stroke-width:1.2;}.rel{fill:var(--paper-2);stroke:var(--ink);stroke-width:1.2;}</style><rect class=\"box\" x=\"15\" y=\"35\" width=\"90\" height=\"40\" rx=\"2\"/><text class=\"lbl\" x=\"60\" y=\"59\" text-anchor=\"middle\">Autor</text><polygon class=\"rel\" points=\"180,35 220,55 180,75 140,55\"/><text class=\"lbl\" x=\"180\" y=\"59\" text-anchor=\"middle\" font-size=\"10\">schreibt</text><rect class=\"box\" x=\"255\" y=\"35\" width=\"90\" height=\"40\" rx=\"2\"/><text class=\"lbl\" x=\"300\" y=\"59\" text-anchor=\"middle\">Buch</text><line class=\"conn\" x1=\"105\" y1=\"55\" x2=\"140\" y2=\"55\"/><line class=\"conn\" x1=\"220\" y1=\"55\" x2=\"255\" y2=\"55\"/><text class=\"mult\" x=\"112\" y=\"48\">1</text><text class=\"mult\" x=\"235\" y=\"48\">n</text></svg>","qPt":"Como se interpretam as cardinalidades 1 e n neste diagrama ER entre Autor e Buch?","aPt":"Um Autor (autor) (1) pode escrever n Buch (livros), mas cada Buch é associado, neste modelo, a exatamente um Autor — trata-se de uma relação 1:n entre Autor e Buch."},
{"cat":"algo","sub":"oop","q":"Was gibt dieses Programm aus, und warum (Stichwort: Polymorphismus)?","a":"Es gibt \"Wuff!\" aus. Obwohl die Variable t vom Typ Tier deklariert ist, zeigt sie zur Laufzeit auf ein Hund-Objekt. Bei überschriebenen Methoden entscheidet der tatsächliche (dynamische) Typ des Objekts, welche Methode ausgeführt wird — nicht der deklarierte Typ der Variablen.","qCode":"class Tier {\n    void sprich() { System.out.println(\"Ein Tier macht ein Geräusch\"); }\n}\nclass Hund extends Tier {\n    void sprich() { System.out.println(\"Wuff!\"); }\n}\npublic class Test {\n    public static void main(String[] args) {\n        Tier t = new Hund();\n        t.sprich();\n    }\n}","qPt":"O que é que este programa imprime, e porquê (palavra-chave: polimorfismo)?","aPt":"Imprime \"Wuff!\". Embora a variável t esteja declarada do tipo Tier (animal), em tempo de execução ela referencia um objeto Hund (cão). Em métodos sobrescritos (overriding), é o tipo real (dinâmico) do objeto que determina qual o método executado — não o tipo declarado da variável."},
{"cat":"algo","sub":"oop","q":"Wozu wird hier das Schlüsselwort this benötigt?","a":"Der Konstruktor-Parameter heißt genauso wie das Attribut (saldo). this.saldo verweist explizit auf das Objektattribut, saldo (ohne this) auf den lokalen Parameter — ohne this würde sich das Attribut selbst zugewiesen und der übergebene Wert ginge verloren.","qCode":"class Konto {\n    private double saldo;\n    public Konto(double saldo) {\n        this.saldo = saldo;\n    }\n    public double getSaldo() {\n        return saldo;\n    }\n}","qPt":"Para que é necessária aqui a palavra-chave this?","aPt":"O parâmetro do construtor tem o mesmo nome do atributo (saldo). this.saldo refere-se explicitamente ao atributo do objeto, enquanto saldo (sem this) se refere ao parâmetro local — sem this, o atributo seria atribuído a si mesmo e o valor recebido seria perdido."},
{"cat":"algo","sub":"oop","q":"Ist das Überladen oder Überschreiben — und woran erkennt man das?","a":"Das ist Überladen (Overloading): Zwei Methoden mit demselben Namen (addiere) in derselben Klasse, aber mit unterschiedlicher Parameterliste (int vs. double). Überschreiben würde eine geerbte Methode in einer Unterklasse mit identischer Signatur betreffen.","qCode":"class Rechner {\n    int addiere(int a, int b) { return a + b; }\n    double addiere(double a, double b) { return a + b; }\n}","qPt":"Isto é sobrecarga (overloading) ou sobrescrita (overriding) — e como se reconhece?","aPt":"Isto é sobrecarga (overloading): dois métodos com o mesmo nome (addiere) na mesma classe, mas com listas de parâmetros diferentes (int vs. double). A sobrescrita (overriding) envolveria um método herdado, numa subclasse, com assinatura idêntica."},
{"cat":"algo","sub":"oop","q":"Was ist aus Sicht der Kapselung an dieser Klasse problematisch?","a":"Die Attribute sind nicht als private deklariert und damit von außen direkt les- und veränderbar (z. B. mitarbeiter.gehalt = -500;), ohne jede Kontrolle. Korrekt wäre: private Attribute mit öffentlichen Getter-/Setter-Methoden, die z. B. ungültige Werte abfangen können.","qCode":"class Mitarbeiter {\n    String name;\n    double gehalt;\n}","qPt":"Do ponto de vista do encapsulamento, o que há de problemático nesta classe?","aPt":"Os atributos não estão declarados como private, por isso podem ser lidos e alterados diretamente a partir do exterior (por exemplo, mitarbeiter.gehalt = -500;), sem qualquer controlo. O correto seria ter atributos private com métodos getter/setter públicos, que podem, por exemplo, rejeitar valores inválidos."},
{"cat":"algo","sub":"oop","q":"Warum lässt sich dieser Code nicht kompilieren?","a":"Eine abstrakte Klasse kann nicht direkt mit new instanziiert werden — sie dient nur als Vorlage für konkrete Unterklassen, die alle abstrakten Methoden implementieren. new Form() muss durch eine konkrete Unterklasse ersetzt werden, z. B. new Kreis().","qCode":"abstract class Form {\n    abstract double flaeche();\n}\npublic class Test {\n    public static void main(String[] args) {\n        Form f = new Form();\n    }\n}","qPt":"Por que razão este código não compila?","aPt":"Uma classe abstrata não pode ser instanciada diretamente com new — serve apenas como modelo para subclasses concretas, que têm de implementar todos os métodos abstratos. new Form() tem de ser substituído por uma subclasse concreta, por exemplo new Kreis()."},
{"cat":"algo","sub":"oop","q":"Warum kompiliert diese Klasse nicht?","a":"Rechnung implementiert das Interface Bezahlbar, setzt aber nicht alle seine Methoden um — storniere() fehlt. Eine Klasse, die ein Interface implementiert, muss zwingend ALLE darin deklarierten Methoden konkret implementieren (sofern sie nicht selbst abstrakt ist).","qCode":"interface Bezahlbar {\n    void bezahle(double betrag);\n    void storniere();\n}\nclass Rechnung implements Bezahlbar {\n    public void bezahle(double betrag) {\n        System.out.println(\"Bezahlt: \" + betrag);\n    }\n}","qPt":"Por que razão esta classe não compila?","aPt":"Rechnung implementa a interface Bezahlbar, mas não implementa todos os seus métodos — falta storniere(). Uma classe que implementa uma interface tem obrigatoriamente de implementar de forma concreta TODOS os métodos nela declarados (a menos que ela própria seja abstrata)."},
{"cat":"algo","sub":"oop","q":"Was wird hier ausgegeben, und warum?","a":"3. Da anzahl als static deklariert ist, existiert sie nur einmal für die gesamte Klasse (nicht pro Objekt) und wird bei jedem Aufruf des Konstruktors (also bei jeder Objekterzeugung) um 1 erhöht — alle drei erzeugten Objekte teilen sich dieselbe Variable.","qCode":"class Zaehler {\n    static int anzahl = 0;\n    Zaehler() {\n        anzahl++;\n    }\n}\npublic class Test {\n    public static void main(String[] args) {\n        new Zaehler();\n        new Zaehler();\n        new Zaehler();\n        System.out.println(Zaehler.anzahl);\n    }\n}","qPt":"O que é apresentado aqui, e porquê?","aPt":"3. Como anzahl está declarada como static, existe apenas uma vez para toda a classe (e não por objeto) e é incrementada em 1 sempre que o construtor é chamado (ou seja, sempre que se cria um objeto) — os três objetos criados partilham a mesma variável."},
{"cat":"algo","sub":"oop","q":"Was gibt new Auto(\"VW\") aus, und was bewirkt super(marke) hier?","a":"Ausgabe: \"Fahrzeug: VW\" gefolgt von \"Auto erstellt\". super(marke) ruft explizit den Konstruktor der Oberklasse Fahrzeug auf, bevor der Rest des Auto-Konstruktors ausgeführt wird — so wird sichergestellt, dass die Oberklasse korrekt initialisiert wird.","qCode":"class Fahrzeug {\n    Fahrzeug(String marke) {\n        System.out.println(\"Fahrzeug: \" + marke);\n    }\n}\nclass Auto extends Fahrzeug {\n    Auto(String marke) {\n        super(marke);\n        System.out.println(\"Auto erstellt\");\n    }\n}","qPt":"O que é apresentado por new Auto(\"VW\"), e o que faz super(marke) aqui?","aPt":"Resultado: \"Fahrzeug: VW\" seguido de \"Auto erstellt\". super(marke) chama explicitamente o construtor da superclasse Fahrzeug antes de ser executado o resto do construtor de Auto — isto garante que a superclasse é corretamente inicializada."},
{"cat":"algo","sub":"oop","q":"Überschreibt zeige(String x) in Abgeleitet die Methode zeige(int x) aus Basis?","a":"Nein. Da sich die Parametertypen unterscheiden (int vs. String), handelt es sich nicht um Overriding, sondern um eine zusätzliche überladene Methode. Beide Methoden existieren in Abgeleitet unabhängig nebeneinander.","qCode":"class Basis {\n    void zeige(int x) { System.out.println(\"Basis: \" + x); }\n}\nclass Abgeleitet extends Basis {\n    void zeige(String x) { System.out.println(\"Abgeleitet: \" + x); }\n}","qPt":"O método zeige(String x) em Abgeleitet substitui (faz override de) o método zeige(int x) de Basis?","aPt":"Não. Como os tipos dos parâmetros são diferentes (int vs. String), não se trata de overriding, mas sim de uma sobrecarga (overload) adicional do método. Os dois métodos existem em Abgeleitet de forma independente, um ao lado do outro."},
{"cat":"algo","sub":"oop","q":"Warum verursacht dieser Code einen Kompilierfehler?","a":"saldo ist private und damit nur innerhalb der Klasse Konto selbst zugänglich — von außen (hier in der Klasse Test) kann nicht direkt auf k.saldo zugegriffen werden. Es wird ein öffentlicher Getter wie getSaldo() benötigt.","qCode":"class Konto {\n    private double saldo = 100.0;\n}\npublic class Test {\n    public static void main(String[] args) {\n        Konto k = new Konto();\n        System.out.println(k.saldo);\n    }\n}","qPt":"Por que razão este código provoca um erro de compilação?","aPt":"saldo é private e, por isso, só é acessível dentro da própria classe Konto — a partir do exterior (aqui, na classe Test) não se pode aceder diretamente a k.saldo. É necessário um getter público, como getSaldo()."},
{"cat":"algo","sub":"oop","q":"Was wird hier ungefähr ausgegeben, und wie könnte man eine lesbarere Ausgabe erreichen?","a":"Ohne eigene Implementierung gibt System.out.println(p) etwas wie Punkt@1b6d3586 aus (Klassenname + Hashcode) — die geerbte Standard-toString()-Methode von Object. Für eine lesbare Ausgabe (z. B. \"Punkt(3, 4)\") müsste die Klasse Punkt die Methode toString() überschreiben.","qCode":"class Punkt {\n    int x, y;\n    Punkt(int x, int y) { this.x = x; this.y = y; }\n}\npublic class Test {\n    public static void main(String[] args) {\n        Punkt p = new Punkt(3, 4);\n        System.out.println(p);\n    }\n}","qPt":"O que é, aproximadamente, apresentado aqui, e como se poderia obter uma saída mais legível?","aPt":"Sem uma implementação própria, System.out.println(p) apresenta algo como Punkt@1b6d3586 (nome da classe + hashcode) — o método toString() padrão herdado de Object. Para obter uma saída legível (por exemplo, \"Punkt(3, 4)\"), a classe Punkt teria de fazer override ao método toString()."},
{"cat":"algo","sub":"oop","q":"Gibt dieser Code true oder false aus, obwohl p1 und p2 dieselben Koordinaten haben?","a":"false. Ohne überschriebene equals()-Methode vergleicht die geerbte Standardimplementierung aus Object nur die Objektreferenzen (Identität) — p1 und p2 sind zwei unterschiedliche Objekte im Speicher, auch wenn ihre Attributwerte gleich sind.","qCode":"class Punkt {\n    int x, y;\n    Punkt(int x, int y) { this.x = x; this.y = y; }\n}\npublic class Test {\n    public static void main(String[] args) {\n        Punkt p1 = new Punkt(1, 2);\n        Punkt p2 = new Punkt(1, 2);\n        System.out.println(p1.equals(p2));\n    }\n}","qPt":"Este código apresenta true ou false, apesar de p1 e p2 terem as mesmas coordenadas?","aPt":"false. Sem um método equals() com override, a implementação padrão herdada de Object compara apenas as referências dos objetos (a identidade) — p1 e p2 são dois objetos diferentes na memória, mesmo que os valores dos seus atributos sejam iguais."},
{"cat":"algo","sub":"rekursion","q":"Was gibt fakultaet(4) zurück? Gehe die Rekursion Schritt für Schritt durch.","a":"24. fakultaet(4) = 4 * fakultaet(3) = 4 * 3 * fakultaet(2) = 4 * 3 * 2 * fakultaet(1) = 4 * 3 * 2 * 1 = 24 — der Basisfall n <= 1 liefert 1 und beendet die Rekursion.","qCode":"FUNKTION fakultaet(n)\n    WENN n <= 1 DANN\n        RÜCKGABE 1\n    SONST\n        RÜCKGABE n * fakultaet(n - 1)\n    ENDWENN\nENDFUNKTION\n\nAUSGABE fakultaet(4)","qPt":"O que devolve fakultaet(4)? Percorre a recursão passo a passo.","aPt":"24. fakultaet(4) = 4 * fakultaet(3) = 4 * 3 * fakultaet(2) = 4 * 3 * 2 * fakultaet(1) = 4 * 3 * 2 * 1 = 24 — o caso base n <= 1 devolve 1 e termina a recursão."},
{"cat":"algo","sub":"ds","q":"Welcher Laufzeitfehler tritt hier auf, und warum?","a":"ArrayIndexOutOfBoundsException. Das Array hat 3 Elemente mit den gültigen Indizes 0, 1, 2 (zahlen.length ist 3). Durch i <= zahlen.length wird beim letzten Durchlauf i = 3 erreicht, also ein Index außerhalb des gültigen Bereichs — richtig wäre i < zahlen.length.","qCode":"int[] zahlen = {10, 20, 30};\nfor (int i = 0; i <= zahlen.length; i++) {\n    System.out.println(zahlen[i]);\n}","qPt":"Que erro de execução ocorre aqui, e porquê?","aPt":"ArrayIndexOutOfBoundsException. O array tem 3 elementos, com os índices válidos 0, 1 e 2 (zahlen.length é 3). Com i <= zahlen.length, na última iteração atinge-se i = 3, ou seja, um índice fora do intervalo válido — o correto seria i < zahlen.length."},
{"cat":"algo","sub":"oop","q":"Gibt dieser Code true oder false aus — und warum ist das für Anfänger oft überraschend?","a":"false. == vergleicht bei Objekten (wie String) die Referenzen, nicht den Inhalt. a und b sind hier zwei unterschiedliche String-Objekte mit demselben Inhalt. Für einen inhaltlichen Vergleich muss a.equals(b) verwendet werden, was hier true ergäbe.","qCode":"String a = new String(\"Hallo\");\nString b = new String(\"Hallo\");\nSystem.out.println(a == b);","qPt":"Este código apresenta true ou false — e por que razão isto costuma surpreender os principiantes?","aPt":"false. No caso de objetos (como String), o == compara as referências, não o conteúdo. Aqui, a e b são dois objetos String diferentes com o mesmo conteúdo. Para comparar o conteúdo, é preciso usar a.equals(b), o que neste caso daria true."},
{"cat":"algo","sub":"oop","q":"Warum funktioniert der Zugriff auf wert in Abgeleitet, obwohl es nicht public ist?","a":"protected erlaubt den Zugriff innerhalb derselben Klasse, desselben Pakets UND durch Unterklassen (auch in anderen Paketen). Da Abgeleitet von Basis erbt, darf sie auf das protected-Attribut wert zugreifen.","qCode":"class Basis {\n    protected int wert = 10;\n}\nclass Abgeleitet extends Basis {\n    void zeige() {\n        System.out.println(wert);\n    }\n}","qPt":"Por que razão o acesso a wert funciona em Abgeleitet, embora não seja public?","aPt":"protected permite o acesso dentro da mesma classe, do mesmo pacote E através de subclasses (mesmo que estejam noutros pacotes). Como Abgeleitet é subclasse de Basis (herda de Basis), pode aceder ao atributo protected wert."},
{"cat":"algo","sub":"oop","q":"Dieser Code kompiliert, obwohl Person die Methode sagHallo() nicht selbst implementiert — warum?","a":"Seit Java 8 können Interfaces default-Methoden mit einer Standardimplementierung enthalten. Eine implementierende Klasse erbt diese Implementierung automatisch, wenn sie sie nicht selbst überschreibt — Person nutzt also die Standardimplementierung aus dem Interface.","qCode":"interface Begruessung {\n    default void sagHallo() {\n        System.out.println(\"Hallo!\");\n    }\n}\nclass Person implements Begruessung {}\npublic class Test {\n    public static void main(String[] args) {\n        new Person().sagHallo();\n    }\n}","qPt":"Este código compila, embora Person não implemente o próprio método sagHallo() — porquê?","aPt":"Desde o Java 8, as interfaces podem conter métodos default com uma implementação padrão. Uma classe que implementa a interface herda automaticamente essa implementação se não a substituir (override) ela própria — Person utiliza, portanto, a implementação padrão da interface."},
{"cat":"algo","sub":"oop","q":"Warum verursacht die Methode aendere() einen Kompilierfehler?","a":"MWST ist als final deklariert — einmal zugewiesen, kann der Wert nicht mehr geändert werden. Der Versuch, MWST erneut einen Wert zuzuweisen, ist ein Kompilierfehler.","qCode":"class Konstanten {\n    final double MWST = 0.19;\n    void aendere() {\n        MWST = 0.20;\n    }\n}","qPt":"Por que razão o método aendere() provoca um erro de compilação?","aPt":"MWST está declarada como final — depois de atribuído, o valor já não pode ser alterado. A tentativa de atribuir novamente um valor a MWST provoca um erro de compilação."},
{"cat":"algo","sub":"oop","q":"In welcher Reihenfolge wird hier ausgegeben, und warum?","a":"Zuerst \"A\", dann \"B\". Auch ohne explizites super() ruft Java automatisch den (parameterlosen) Konstruktor der Oberklasse zuerst auf, bevor der Code des Unterklassen-Konstruktors ausgeführt wird — die Oberklasse muss vollständig initialisiert sein, bevor die Unterklasse aufgebaut wird.","qCode":"class A {\n    A() { System.out.println(\"A\"); }\n}\nclass B extends A {\n    B() { System.out.println(\"B\"); }\n}\npublic class Test {\n    public static void main(String[] args) {\n        new B();\n    }\n}","qPt":"Em que ordem é apresentada a saída aqui, e porquê?","aPt":"Primeiro \"A\", depois \"B\". Mesmo sem um super() explícito, o Java chama automaticamente primeiro o construtor (sem parâmetros) da superclasse, antes de ser executado o código do construtor da subclasse — a superclasse tem de estar totalmente inicializada antes de a subclasse ser construída."},
{"cat":"algo","sub":"netz","q":"Welche HTTP-Methode wird in einer REST-API typischerweise zum Erstellen einer neuen Ressource verwendet?","a":"POST — sie wird verwendet, um eine neue Ressource zu erstellen, z. B. POST /kunden, um einen neuen Kunden anzulegen. GET dient dem Lesen, PUT/PATCH dem Aktualisieren und DELETE dem Löschen einer Ressource.","qPt":"Qual é o método HTTP normalmente utilizado numa API REST para criar um novo recurso?","aPt":"POST — é utilizado para criar um novo recurso, por exemplo POST /kunden, para registar um novo cliente. O GET serve para ler, o PUT/PATCH para atualizar e o DELETE para eliminar um recurso."},
{"cat":"algo","sub":"netz","q":"Was bedeutet \"zustandslos\" (stateless) als Grundprinzip von REST?","a":"Jede Anfrage an den Server muss alle notwendigen Informationen enthalten, um verarbeitet zu werden — der Server speichert keinen Sitzungszustand (Session) zwischen einzelnen Anfragen eines Clients.","qPt":"O que significa \"sem estado\" (stateless) como princípio fundamental do REST?","aPt":"Cada pedido ao servidor tem de conter toda a informação necessária para ser processado — o servidor não guarda estado de sessão (session) entre pedidos individuais de um cliente."},
{"cat":"algo","sub":"netz","q":"Was bedeutet \"idempotent\" bei einer HTTP-Methode wie PUT oder DELETE?","a":"Mehrfaches identisches Ausführen derselben Anfrage führt zum gleichen Endzustand wie ein einmaliges Ausführen. PUT /kunden/5 mehrfach mit denselben Daten aufzurufen ändert den Zustand nicht erneut — im Gegensatz z. B. zu POST, das bei jedem Aufruf eine neue Ressource anlegen kann.","qPt":"O que significa \"idempotente\" numa operação HTTP como PUT ou DELETE?","aPt":"Executar o mesmo pedido várias vezes de forma idêntica resulta no mesmo estado final que executá-lo apenas uma vez. Chamar PUT /kunden/5 repetidamente com os mesmos dados não altera o estado novamente — ao contrário, por exemplo, do POST, que pode criar um novo recurso a cada chamada."},
{"cat":"algo","sub":"netz","q":"Was bedeuten die HTTP-Statuscodes 200, 201, 404 und 500?","a":"200 OK: Anfrage erfolgreich verarbeitet. 201 Created: Ressource erfolgreich erstellt (typisch nach POST). 404 Not Found: angeforderte Ressource existiert nicht. 500 Internal Server Error: unerwarteter Fehler auf Serverseite.","qPt":"O que significam os códigos de estado HTTP 200, 201, 404 e 500?","aPt":"200 OK: o pedido foi processado com sucesso. 201 Created: o recurso foi criado com sucesso (tipicamente após um POST). 404 Not Found: o recurso pedido não existe. 500 Internal Server Error: erro inesperado do lado do servidor."},
{"cat":"algo","sub":"netz","q":"Was unterscheidet die HTTP-Statuscodes 401 und 403?","a":"401 Unauthorized bedeutet: Der Client ist nicht (korrekt) authentifiziert (z. B. fehlende/ungültige Anmeldedaten). 403 Forbidden bedeutet: Der Client ist zwar authentifiziert, hat aber keine Berechtigung für die angeforderte Aktion/Ressource.","qPt":"O que distingue os códigos de estado HTTP 401 e 403?","aPt":"401 Unauthorized significa que o cliente não está (corretamente) autenticado (por exemplo, por falta de credenciais ou credenciais inválidas). 403 Forbidden significa que o cliente está autenticado, mas não tem autorização para a ação/recurso pedido."},
{"cat":"plan","sub":"sicherheit","q":"Was ist der Unterschied zwischen Hashing und Verschlüsselung?","a":"Verschlüsselung ist umkehrbar (mit dem passenden Schlüssel kann der ursprüngliche Klartext wiederhergestellt werden). Hashing ist eine Einwegfunktion — aus dem Hash-Wert lässt sich der ursprüngliche Wert nicht zurückrechnen. Hashing wird u. a. zur sicheren Passwortspeicherung verwendet.","qPt":"Qual é a diferença entre hashing e encriptação?","aPt":"A encriptação é reversível (com a chave adequada, é possível recuperar o texto original). O hashing é uma função unidirecional — a partir do valor de hash não é possível recalcular o valor original. O hashing é utilizado, entre outras coisas, para o armazenamento seguro de palavras-passe."},
{"cat":"plan","sub":"sicherheit","q":"Was ist Zwei-Faktor-Authentifizierung (2FA)?","a":"Eine Anmeldemethode, die zwei unabhängige Faktoren aus unterschiedlichen Kategorien kombiniert (z. B. Wissen wie ein Passwort + Besitz wie ein Smartphone-Code), um die Sicherheit gegenüber einer reinen Passwortanmeldung deutlich zu erhöhen.","qPt":"O que é a autenticação de dois fatores (2FA)?","aPt":"Um método de autenticação que combina dois fatores independentes de categorias diferentes (por exemplo, algo que se sabe, como uma palavra-passe, e algo que se possui, como um código enviado para o smartphone), de modo a aumentar significativamente a segurança em relação a um login apenas com palavra-passe."},
{"cat":"plan","sub":"sicherheit","q":"Was versteht man unter Social Engineering?","a":"Manipulationstechniken, die menschliches Vertrauen oder Unachtsamkeit ausnutzen, um an vertrauliche Informationen zu gelangen oder Personen zu Handlungen zu bewegen (z. B. Phishing-E-Mails, vorgetäuschte Anrufe des \"IT-Supports\").","qPt":"O que se entende por engenharia social (Social Engineering)?","aPt":"Técnicas de manipulação que exploram a confiança ou a falta de atenção das pessoas para obter informação confidencial ou induzi-las a determinadas ações (por exemplo, e-mails de phishing, chamadas telefónicas a fingir ser do \"suporte de TI\")."},
{"cat":"plan","sub":"sicherheit","q":"Warum ist regelmäßiges Patch-Management wichtig für die IT-Sicherheit?","a":"Software-Updates (Patches) schließen bekannt gewordene Sicherheitslücken. Ungepatchte Systeme sind ein beliebtes Angriffsziel, da Schwachstellen oft öffentlich bekannt und leicht ausnutzbar sind.","qPt":"Por que razão é importante uma gestão regular de patches (Patch-Management) para a segurança informática?","aPt":"As atualizações de software (patches) corrigem vulnerabilidades de segurança conhecidas. Sistemas sem patches aplicados são um alvo frequente de ataques, uma vez que as vulnerabilidades são muitas vezes públicas e fáceis de explorar."},
{"cat":"plan","sub":"sicherheit","q":"Was ist ein Denial-of-Service-Angriff (DoS)?","a":"Ein Angriff, der ein System oder einen Dienst durch Überlastung (z. B. massenhafte Anfragen) für legitime Nutzer unerreichbar machen soll — bei verteilten Angriffen über viele Systeme spricht man von DDoS (Distributed Denial of Service).","qPt":"O que é um ataque de Denial-of-Service (DoS)?","aPt":"Um ataque que procura tornar um sistema ou serviço inacessível para os utilizadores legítimos através de sobrecarga (por exemplo, um grande volume de pedidos) — quando o ataque é distribuído por muitos sistemas, fala-se em DDoS (Distributed Denial of Service)."},
{"cat":"plan","sub":"pm","q":"Ein Vorgang hat FAZ (frühester Anfangszeitpunkt) = 5 und Dauer = 4. Wie hoch ist der früheste Endzeitpunkt (FEZ)?","a":"FEZ = FAZ + Dauer = 5 + 4 = 9.","qPt":"Uma atividade tem FAZ (início mais cedo) = 5 e duração = 4. Qual é o FEZ (fim mais cedo)?","aPt":"FEZ = FAZ + duração = 5 + 4 = 9."},
{"cat":"plan","sub":"pm","q":"Wie berechnet sich der Gesamtpuffer (GP) eines Vorgangs in der Netzplantechnik?","a":"GP = SEZ − FEZ (spätester Endzeitpunkt minus frühester Endzeitpunkt), alternativ auch SAZ − FAZ. Ist GP = 0, liegt der Vorgang auf dem kritischen Pfad.","qPt":"Como se calcula a folga total (GP) de uma atividade na técnica de planeamento em rede (Netzplantechnik)?","aPt":"GP = SEZ − FEZ (fim mais tarde menos fim mais cedo), ou, em alternativa, SAZ − FAZ (início mais tarde menos início mais cedo). Se GP = 0, a atividade está no caminho crítico."},
{"cat":"algo","sub":"sql","q":"Was bedeutet \"Isolation\" (das I in ACID) bei Datenbanktransaktionen in der Praxis?","a":"Parallel laufende Transaktionen dürfen sich nicht gegenseitig in unerwünschter Weise beeinflussen — jede Transaktion läuft (aus ihrer Sicht) so ab, als wäre sie die einzige, die gerade auf die Datenbank zugreift, obwohl technisch mehrere gleichzeitig ablaufen können.","qPt":"O que significa \"Isolation\" (o I de ACID) na prática, em transações de bases de dados?","aPt":"As transações que correm em paralelo não se podem influenciar mutuamente de forma indesejada — cada transação decorre (do seu ponto de vista) como se fosse a única a aceder à base de dados naquele momento, embora, tecnicamente, várias possam estar a correr em simultâneo."},
{"cat":"algo","sub":"pseudocode","q":"Gibt es eine gemeinsame Struktur, die (fast) jede Algorithmen-Pseudocode-Aufgabe der AP2 verwendet?","qPt":"Existe uma estrutura comum que (quase) todos os exercícios de pseudocódigo da AP2 seguem?","qCode":"methodenName(parameter: Typ[]): Rückgabetyp\n\n    // 1) ERGEBNIS ANLEGEN  (je nach Rückgabetyp)\n    ergebnis = 0                    // zählen?\n    ergebnis = new Typ[n]           // Array bauen?\n    ergebnis = new List<Typ>()      // Liste bauen?\n\n    // 2) EINGABE DURCHLAUFEN\n    for (i = 0; i < array.length; i++)      // oder: while (array.length > 0)\n        element = array[i]                  // oder: array.get(i)\n\n        // 3) PRO ELEMENT ENTSCHEIDEN\n        // -> zählen? vergleichen mit Sentinel (MAX_VALUE/MIN_VALUE)?\n        // -> an einem berechneten Index speichern? zur Liste hinzufügen?\n\n    // 4) ERGEBNIS ZURÜCKGEBEN\n    return ergebnis\nend methodenName","a":"Ja. Fast jede Algorithmen-Aufgabe folgt diesem Ablauf: (1) das Ergebnis anlegen — der Rückgabetyp verrät, was das ist; (2) die Eingabe mit for/while durchlaufen, immer über .length/.size() und über get-Methoden; (3) pro Element entscheiden; (4) zurückgeben.","aPt":"Sim. Decides o que vais construir OLHANDO para o tipo de retorno: Integer é quase sempre um contador a começar em 0; Tipo[] ou List<Tipo> é uma coleção nova; void significa que vais alterar o array que já existe. Percorres os dados com for (processar cada elemento uma vez) ou while (repetir até esvaziar/encontrar algo), sempre pelos getters. Dentro do ciclo decides: contar, comparar com uma sentinela para achar o maior/menor, guardar num índice calculado, ou adicionar a uma lista. No fim, devolves o resultado. As próximas 8 cartas mostram este esqueleto em 8 situações diferentes.","aCode":"Padrão                                Exemplo (carta)\n──────────────────────────────────────────────────────────\nContar com condição                   Ginásio: membros mais ativos\nOrdenar com comparador externo        Hotel: ordenar reservas\nProcurar o melhor (sentinela+remove)  Hospital: fila de prioridade\nHistograma / array por categoria      Parque: sobrelotação por piso\nMin/Max + lista condicional (2D)      Escola: notas e reprovações\nDepurar com tabela de rasto           Biblioteca: estatística por autor\nConstruir lista sem duplicados        Loja: lista de clientes\nMédia com filtro sobre outra lista    Loja: gasto médio por cliente\nPolimorfismo com ligação dinâmica     Central de notificações"},
{"cat":"algo","sub":"pseudocode","q":"Die Klasse Mitglied hat die Attribute name, besucheDiesenMonat und besucheVorigenMonat (alle mit Get-Methoden). Ein Array mitglieder vom Typ Mitglied[] ist gegeben. Entwickle zaehleAktiver(Mitglied[] mitglieder): Integer, das zählt, bei wie vielen Mitgliedern die Besuche in diesem Monat höher waren als im vorigen.","qPt":"A classe Mitglied (membro de um ginásio) tem os atributos name, besucheDiesenMonat (visitas este mês) e besucheVorigenMonat (visitas no mês passado), todos com getters. Existe um array mitglieder do tipo Mitglied[]. Cria zaehleAktiver(Mitglied[] mitglieder): Integer, que conta em quantos membros as visitas deste mês foram maiores que as do mês passado.","qCode":"Klasse Mitglied\n  - name: String\n  - besucheDiesenMonat: Integer\n  - besucheVorigenMonat: Integer\n  (alle Attribute mit get-Methoden)\n\nzaehleAktiver(mitglieder: Mitglied[]): Integer\n    ???","a":"count:Integer=0 initialisieren, mit einem for über mitglieder.length laufen und bei jedem i die beiden Getter desselben Objekts vergleichen: mitglieder[i].getBesucheDiesenMonat() > mitglieder[i].getBesucheVorigenMonat(). Trifft das zu, count++. Am Ende return count.","aPt":"Cria-se um contador count a 0, percorre-se mitglieder com um for simples, e em CADA posição i comparam-se os dois getters do MESMO objeto: mitglieder[i].getBesucheDiesenMonat() > mitglieder[i].getBesucheVorigenMonat(). Sempre que verdadeiro, incrementa-se o contador; no fim, devolve-se count. Padrão: 'contar com condição' — o mais simples e mais frequente. Repara que não precisas de array novo nem de 'new' aqui, só de UM valor (Integer).","aCode":"zaehleAktiver(mitglieder: Mitglied[]): Integer\n    count: Integer = 0\n    for (i = 0; i < mitglieder.length; i++)\n        if (mitglieder[i].getBesucheDiesenMonat() > mitglieder[i].getBesucheVorigenMonat()) count++\n    End For\n    Return count\nEnd zaehleAktiver"},
{"cat":"algo","sub":"pseudocode","q":"Für das Array buchungen (Klasse Zimmerbuchung) soll sortiere(Zimmerbuchung[] buchungen, Function vergleiche): void entwickelt werden. Die Funktion vergleiche(a, b) liefert einen Wert > 0, wenn b vor a sortiert werden soll. Gib einen Sortieralgorithmus deiner Wahl im Pseudocode an und nenne ihn.","qPt":"Para o array buchungen (classe Zimmerbuchung, reservas de hotel), cria sortiere(Zimmerbuchung[] buchungen, Function vergleiche): void. A função vergleiche(a, b) devolve um valor > 0 quando b deve vir ANTES de a. Escreve um algoritmo de ordenação à tua escolha em pseudocódigo e diz o nome dele.","qCode":"Klasse Zimmerbuchung { gast: String, preis: double, bewertung: Integer }  // getters\n\n// vergleiche(a, b) > 0  significa: b deve vir ANTES de a (trocar)\nsortiere(buchungen: Zimmerbuchung[], vergleiche: Function): void\n    ???","a":"Bubble Sort passt am besten: der Vergleich läuft über die übergebene Funktion vergleiche(a,b) statt über ein festes Kriterium. Zwei verschachtelte for-Schleifen: die äußere (i) verkleinert bei jedem Durchlauf den noch zu prüfenden Bereich (length-1-i), die innere (j) vergleicht Nachbarn und tauscht sie mit einer Hilfsvariable, wenn vergleiche(buchungen[j], buchungen[j+1]) > 0 ist.","aPt":"Bubble Sort é a escolha mais simples quando o critério de comparação vem de FORA (a função vergleiche), em vez de estar fixo no código — assim o mesmo sort() serve para ordenar por preço, por avaliação, ou por qualquer outro critério, sem alterar o algoritmo. Estrutura: dois for aninhados — o de fora (i) vai 'empurrando' o maior valor para o fim a cada volta (por isso o limite encolhe, length-1-i); o de dentro (j) percorre os pares vizinhos e troca-os com uma variável auxiliar (k) quando vergleiche diz que sim. Erro clássico: trocar sem a variável auxiliar — perdes um dos dois valores, porque buchungen[j]=buchungen[j+1] já apaga o original antes de o copiares de volta. Padrão: 'ordenar com comparador externo', o mesmo Bubble Sort de sempre, só que a condição de troca vem de uma função passada como parâmetro.","aCode":"sortiere(buchungen: Zimmerbuchung[], vergleiche: Function): void\n    for (i = 0; i < buchungen.length - 1; i++)\n        for (j = 0; j < buchungen.length - 1 - i; j++)\n            if (vergleiche(buchungen[j], buchungen[j+1]) > 0)\n                Zimmerbuchung k = buchungen[j]\n                buchungen[j] = buchungen[j+1]\n                buchungen[j+1] = k\n            End if\n        End for\n    End for\nEnd sortiere\n\n// Gewählter Algorithmus: Bubble Sort"},
{"cat":"algo","sub":"pseudocode","q":"Ein Array warteliste (Klasse Patient: name, prioritaet, alle mit get/set) enthält wartende Patienten. Es soll immer der Patient mit der HÖCHSTEN prioritaet als Nächstes behandelt werden. Entwickle behandlungsReihenfolge(warteliste: Patient[]): Patient[], das die Behandlungsreihenfolge in einem neuen Array zurückgibt, bis die Warteliste leer ist.","qPt":"Um array warteliste (classe Patient: name, prioritaet, todos com get/set) tem pacientes à espera. Deve ser sempre atendido a seguir o paciente com a prioridade MAIS ALTA. Cria behandlungsReihenfolge(warteliste: Patient[]): Patient[], que devolve a ordem de atendimento num array novo, até a lista de espera ficar vazia.","qCode":"Klasse Patient { name: String, prioritaet: Integer }   // get/set vorhanden\n\nbehandlungsReihenfolge(warteliste: Patient[]): Patient[]\n    reihenfolge = new Patient[warteliste.length]\n    naechster = 0\n    ???  // SOLANGE noch Patienten übrig sind: den mit der höchsten\n         // prioritaet finden, speichern, aus warteliste entfernen","a":"Solange warteliste nicht leer ist (while warteliste.length > 0), eine innere Suche nach dem höchsten prioritaet-Wert starten, mit maxPrioritaet als Sentinel (Integer.MIN_VALUE), damit garantiert der erste echte Wert größer ist. Danach den Gewinner (maxPos) speichern, aus warteliste entfernen.","aPt":"Padrão: 'procurar o melhor com sentinela', dentro de um ciclo que repete até esvaziar os dados — a mesma ideia de encontrar um extremo (agora o MÁXIMO, não o mínimo), com remoção a cada volta. Como não sabes de antemão quantos pacientes restam, usas while (warteliste.length > 0) em vez de um for fixo. A cada volta: maxPrioritaet arranca em Integer.MIN_VALUE (sentinela pequena, para garantir que o primeiro valor real a comparar vence), percorres toda a warteliste à procura de quem tem a prioridade mais alta (maxPos vai sendo atualizado), guardas esse paciente em reihenfolge[naechster], e REMOVES da warteliste — esquecer o remove() criaria um ciclo infinito, porque warteliste.length nunca chegaria a 0.","aCode":"behandlungsReihenfolge(warteliste: Patient[]): Patient[]\n    reihenfolge = new Patient[warteliste.length]\n    naechster = 0\n\n    while (warteliste.length > 0)\n        maxPrioritaet = Integer.MIN_VALUE\n        maxPos = 0\n        for i = 0 to warteliste.length - 1\n            if warteliste[i].getPrioritaet() > maxPrioritaet\n                maxPrioritaet = warteliste[i].getPrioritaet()\n                maxPos = i\n            end if\n        end for\n\n        reihenfolge[naechster] = warteliste[maxPos]\n        naechster = naechster + 1\n        warteliste.remove(maxPos)\n    end while\n\n    return reihenfolge\nend behandlungsReihenfolge"},
{"cat":"algo","sub":"pseudocode","q":"Die Klasse Messung speichert stockwerk (0 bis 4), belegt und kapazitaet (alle mit Get-Methoden). Im Array messungen sind viele solcher Messungen über die Zeit gespeichert. Eine Überlastung liegt vor, wenn belegt größer als kapazitaet ist. Entwickle zaehleUeberlastungen(Messung[] messungen): Integer[], das für jedes der 5 Stockwerke zählt, wie oft eine Überlastung gemessen wurde.","qPt":"A classe Messung (medição num parque de estacionamento) guarda stockwerk (piso, 0 a 4), belegt (lugares ocupados) e kapazitaet (capacidade), todos com getters. No array messungen estão muitas destas medições ao longo do tempo. Há sobrelotação quando belegt é maior que kapazitaet. Cria zaehleUeberlastungen(Messung[] messungen): Integer[], que conta, para cada um dos 5 pisos, quantas vezes houve sobrelotação.","qCode":"Klasse Messung\n  - stockwerk: Integer   // 0 bis 4\n  - belegt: Integer\n  - kapazitaet: Integer\n  (alle Attribute mit get-Methoden)\n\nzaehleUeberlastungen(messungen: Messung[]): Integer[]\n    ???","a":"Ein Ergebnis-Array fester Größe 5 anlegen, mit 0 initialisieren. Dann messungen durchlaufen und bei jedem Element prüfen, ob belegt > kapazitaet ist; wenn ja, den Zähler an der Position stockwerk erhöhen. Am Ende das Array zurückgeben.","aPt":"Padrão: 'histograma / array por categoria' — o índice do array de resultado É a categoria (aqui, o piso), e o valor é a contagem. Passos: 1) criar Integer[5] a zero. 2) percorrer messungen com um for simples. 3) para cada medição, comparar belegt() com kapazitaet(); se belegt > kapazitaet, incrementar ueberlastungen[stockwerk] — repara que usas o getStockwerk() diretamente como índice, sem precisar de '-1' desta vez, porque os pisos já começam em 0 (ao contrário de outros exemplos em que a categoria começa em 1). 4) devolver o array. Este é o padrão mais direto de histograma, sem complicações de limites.","aCode":"zaehleUeberlastungen(messungen: Messung[]): Integer[]\n    ueberlastungen = new Integer[5]\n    for (s = 0; s < 5; s++)\n        ueberlastungen[s] = 0\n    End for\n\n    for (i = 0; i < messungen.length; i++)\n        wenn messungen[i].getBelegt() > messungen[i].getKapazitaet()\n            ueberlastungen[messungen[i].getStockwerk()]++\n        ende wenn\n    End for\n\n    return ueberlastungen\nEnd zaehleUeberlastungen"},
{"cat":"algo","sub":"pseudocode","q":"Das zweidimensionale Array noten (Spalte 0 = SchuelerId, Spalten 1-8 = Noten in 8 Fächern) soll ausgewertet werden. Gesucht: die minimale und maximale Note über ALLE Schüler hinweg, sowie — für jede Note unter einer Mindestnote — ein Eintrag (SchuelerId, Fachnummer, Note) in einer Liste. Entwickle statistik(noten: int[][], mindestnote: int): Notenstatistik(minNote:int, maxNote:int, nichtBestanden:List).","qPt":"O array bidimensional noten (coluna 0 = ID do aluno, colunas 1-8 = notas em 8 disciplinas) deve ser analisado. Procura-se: a nota mínima e máxima entre TODOS os alunos, e — para cada nota abaixo de uma nota mínima de aprovação — um registo (ID do aluno, nº da disciplina, nota) numa lista. Cria statistik(noten: int[][], mindestnote: int): Notenstatistik(minNote:int, maxNote:int, nichtBestanden:List).","qCode":"// noten[linha][coluna]: coluna 0 = SchuelerId, colunas 1..8 = notas das 8 disciplinas\n// List<T>: construtor List(), add(o)\n\nNotenstatistik statistik(noten: int[][], mindestnote: int) {\n    ???\n}","a":"minNote mit Integer.MAX_VALUE starten, maxNote mit Integer.MIN_VALUE (Sentinels), eine leere List<NotenEintrag> anlegen. Zwei verschachtelte for-Schleifen: außen über jeden Schüler (s), innen über jedes Fach (f=1..8). v = noten[s][f] ist die Note. Liegt v unter mindestnote, einen neuen NotenEintrag zur Liste hinzufügen. Danach mit if/else-if minNote bzw. maxNote aktualisieren.","aPt":"Padrão: min/max com sentinelas + construção de uma lista condicional, sobre um array 2D. minNote arranca em Integer.MAX_VALUE, maxNote em Integer.MIN_VALUE — assim o primeiro valor real encontrado substitui sempre o extremo inicial. Percorres cada aluno (s, ciclo de fora) e cada disciplina (f de 1 a 8, ciclo de dentro); v=noten[s][f] é a nota. Se v for menor que mindestnote, cria-se um NotenEintrag com noten[s][0] (o ID do aluno, guardado na coluna 0), o número da disciplina f, e a nota v — e adiciona-se à lista. Repara no 'if/else if' para o min/max: um valor que já define um novo mínimo não é testado contra o máximo na mesma iteração. Pensa: se o array só tivesse UM aluno com UMA nota, maxNote nunca seria atualizado (ficaria em MIN_VALUE) — é este tipo de caso-limite que vale a pena testar sempre que vires esta estrutura.","aCode":"Notenstatistik statistik(noten: int[][], mindestnote: int) {\n    int minNote = Integer.MAX_VALUE;\n    int maxNote = Integer.MIN_VALUE;\n    List<NotenEintrag> nichtBestanden = new List<NotenEintrag>();\n\n    for (int s = 0; s < noten.length; s++) {\n        for (int f = 1; f <= 8; f++) {\n            int v = noten[s][f];\n            if (v < mindestnote) {\n                nichtBestanden.add(new NotenEintrag(noten[s][0], f, v));\n            }\n            if (v < minNote) minNote = v;\n            else if (v > maxNote) maxNote = v;\n        }\n    }\n    return new Notenstatistik(minNote, maxNote, nichtBestanden);\n}"},
{"cat":"algo","sub":"pseudocode","q":"AutorStatistik soll pro Autor und insgesamt auswerten, wie viele Bücher ausgeliehen wurden und wie lang die durchschnittliche Ausleihdauer war. Mit Testdaten (Autor 'Orwell' zweimal, dann Autor 'Kafka' einmal) soll Orwell korrekt ausgewertet werden, aber die Gesamtauswertung (alle Autoren zusammen) liefert ein falsches Ergebnis. Finde die zwei Fehler mit einer Datenverlaufstabelle.","qPt":"AutorStatistik deve calcular, por autor e no total, quantos livros foram emprestados e qual foi a duração média do empréstimo. Com dados de teste (autor 'Orwell' duas vezes, depois autor 'Kafka' uma vez), Orwell é avaliado corretamente, mas a avaliação total (todos os autores juntos) dá um resultado errado. Encontra os dois erros com uma tabela de rasto — a mesma técnica que já usámos antes.","qCode":"AutorStatistik(List<Ausleihe> ausleihen): void\n  a0 = ausleihen[0]\n  autor = a0.Autor\n  autorTageSumme = 0; autorAnzahl = 0\n  gesamtTageSumme = 0; gesamtAnzahl = 0\n\n  foreach (a in ausleihen)\n    wenn (autor != a.Autor)\n      // ... imprime estatística do autor, transfere para gesamt*, reinicia autor* ...\n      gesamtAnzahl = gesamtAnzahl + autorAnzahl\n      gesamtTageSumme = gesamtTageSumme + autorTageSumme\n      // (reinicia autorAnzahl/autorTageSumme, autor = a.Autor)\n    ende wenn\n    autorAnzahl += 1\n    autorTageSumme += a.AusleiheTage\n  fim foreach\n\n  // imprime \"Gesamtauswertung\": Durchschnitt = gesamtTageSumme / autorAnzahl, Anzahl=gesamtAnzahl\n  ??? // dois erros aqui — encontra-os com uma tabela de rasto","a":"Fehler 1: die Transfer-Logik (autor* → gesamt*) läuft nur, wenn ein Autorenwechsel erkannt wird — der LETZTE Autor der Liste (Kafka) löst das nie aus, seine Werte erreichen gesamt* also nie. Fehler 2: die Gesamtauswertung teilt durch autorAnzahl statt durch gesamtAnzahl — eine falsche Variable.","aPt":"Esta é exatamente a mesma 'armadilha' que já tínhamos visto numa prova real — agora num exemplo meu, para praticares a técnica outra vez sem decorares a resposta. Ao tracear linha a linha: a transferência de autor* para gesamt* só acontece DENTRO do 'if (autor != a.Autor)', ou seja, só quando deteta MUDANÇA de autor. Mas o ÚLTIMO autor da lista (Kafka, já que a lista acaba aí) nunca é seguido por outro autor — por isso os dados de Kafka nunca chegam a gesamt*. No final do foreach: gesamtAnzahl só tem a contagem de Orwell (2), devia ter 3; gesamtTageSumme só tem a soma de Orwell. Erro 2: a linha final divide por autorAnzahl (a variável do ÚLTIMO autor, que ficou com o valor de Kafka, 1) em vez de gesamtAnzahl (que devia ter a soma de todos). Lição: um erro que só aparece no ÚLTIMO elemento de uma lista é dos mais fáceis de não detetar sem tracear — é exatamente para isto que serve a tabela de rasto."},
{"cat":"algo","sub":"pseudocode","q":"Bestellung{datum,kundenName,betrag} liegt in List<Bestellung> vor — eine Zeile pro Bestellung, ein Kunde kann mehrfach bestellt haben. a) erzeugeKundenListe(List<Bestellung>): List<Kunde> soll EINEN Kunde(kundenName, 0.0) pro eindeutigem Namen erzeugen. b) berechneDurchschnitt(List<Bestellung>, Date start, Date ende): List<Kunde> soll erzeugeKundenListe wiederverwenden und für jeden Kunden den Durchschnittsbetrag seiner Bestellungen im Zeitraum berechnen, mit datum.between(start,ende):Boolean.","qPt":"Bestellung{datum,kundenName,betrag} está numa List<Bestellung> — uma linha por encomenda, e um cliente pode ter várias encomendas. a) erzeugeKundenListe(List<Bestellung>): List<Kunde> deve criar UM Kunde(kundenName, 0.0) por cada nome ÚNICO. b) berechneDurchschnitt(List<Bestellung>, Date start, Date ende): List<Kunde> deve reutilizar erzeugeKundenListe e calcular, para cada cliente, o valor médio das suas encomendas no período, usando datum.between(start,ende):Boolean.","qCode":"Bestellung { datum:Date, kundenName:String, betrag:double }   // getters\nKunde { kundenName:String, durchschnitt:double, + Kunde(kundenName,durchschnitt) }\nList<T>: add(t), size(), get(i), contains(t)   // contains compara por 'kundenName'\nDate: datum.between(start, ende): Boolean\n\na) List<Kunde> erzeugeKundenListe(List<Bestellung> bestellungen) { ??? }\nb) List<Kunde> berechneDurchschnitt(List<Bestellung> bestellungen, Date start, Date ende) { ??? }","a":"a) Über bestellungen iterieren, für jede Zeile ein Kunde(name,0.0) bauen, aber nur hinzufügen, wenn kundenListe.contains(k) false ist — verhindert Duplikate, da jeder Kunde mehrfach vorkommen kann. b) erzeugeKundenListe wiederverwenden, dann pro Kunde (äußere Schleife) eine innere Schleife über ALLE bestellungen, die zu diesem Kunden gehören UND im Zeitraum liegen, Summe und Anzahl sammeln, am Ende durchschnitt setzen.","aPt":"a) Padrão: 'construir uma lista sem duplicados'. Percorres bestellungen (cada cliente pode aparecer várias vezes, uma por encomenda), crias um Kunde(nome,0.0) para cada linha, mas só o adicionas se kundenListe.contains(k) for falso — se já existir lá um com o mesmo nome. Sem este 'if', terias o mesmo cliente duplicado tantas vezes quantas encomendas tivesse feito. b) Padrão: 'para cada elemento de uma lista, procurar os dados correspondentes NOUTRA lista e calcular uma média'. Chamas erzeugeKundenListe para teres a lista de clientes, depois para CADA cliente (ciclo de fora) percorres TODA a bestellungen outra vez (ciclo de dentro) e só somas betrag quando a encomenda é do MESMO cliente E está dentro do período. O 'if (anzahl>0)' no fim evita dividir por zero se esse cliente não tiver nenhuma encomenda no período. Aqui percorres Listas com .size()/.get(i), não arrays com índices.","aCode":"List<Kunde> erzeugeKundenListe(List<Bestellung> bestellungen) {\n    List<Kunde> kundenListe = new List<Kunde>();\n    for (int i = 0; i < bestellungen.size(); i++) {\n        Bestellung b = bestellungen.get(i);\n        Kunde k = new Kunde(b.getKundenName(), 0.0);\n        if (!kundenListe.contains(k)) {\n            kundenListe.add(k);\n        }\n    }\n    return kundenListe;\n}\n\nList<Kunde> berechneDurchschnitt(List<Bestellung> bestellungen, Date start, Date ende) {\n    List<Kunde> kundenListe = erzeugeKundenListe(bestellungen);\n    for (int i = 0; i < kundenListe.size(); i++) {\n        double summe = 0.0;\n        int anzahl = 0;\n        for (int j = 0; j < bestellungen.size(); j++) {\n            Bestellung b = bestellungen.get(j);\n            if (b.getDatum().between(start, ende)\n                    && b.getKundenName() == kundenListe.get(i).getKundenName()) {\n                summe = summe + b.getBetrag();\n                anzahl = anzahl + 1;\n            }\n        }\n        if (anzahl > 0) {\n            kundenListe.get(i).setDurchschnitt(summe / anzahl);\n        }\n    }\n    return kundenListe;\n}"},
{"cat":"algo","sub":"pseudocode","q":"NotificationCenter verwaltet eine List<Notification> ausstehend. Notification ist abstrakt mit send():Boolean. EmailNotification und SmsNotification erben von Notification und überschreiben send() jeweils unterschiedlich. Entwickle sendeAlle(): List<Notification>, das alle erfolgreich gesendeten Notifications zurückgibt — und nenne den Mechanismus, der es erlaubt, mit EINER Liste vom Typ Notification trotzdem die richtige Version von send() für jedes konkrete Objekt aufzurufen.","qPt":"NotificationCenter gere uma List<Notification> ausstehend (pendentes). Notification é abstrata com send():Boolean. EmailNotification e SmsNotification herdam de Notification e sobrescrevem send() cada uma à sua maneira. Cria sendeAlle(): List<Notification>, que devolve todas as notificações enviadas com sucesso — e diz o nome do mecanismo que permite, com UMA lista do tipo Notification, continuar a chamar a versão CERTA de send() para cada objeto concreto.","qCode":"Notification (abstrakt) { +send():Boolean }\nEmailNotification erbt von Notification  { +send() }\nSmsNotification erbt von Notification    { +send() }\nNotificationCenter { - ausstehend: List<Notification>; +sendeAlle(): List<Notification> }\n\nList<Notification> sendeAlle() { ??? }","a":"Mit for über ausstehend.size() iterieren, jedes Element holen (n=ausstehend.get(i)) und n.send() aufrufen. Obwohl die Liste als List<Notification> deklariert ist, entscheidet zur Laufzeit der TATSÄCHLICHE Objekttyp (EmailNotification oder SmsNotification), welche überschriebene Methode läuft — Polymorphie mit dynamischer Bindung.","aPt":"O código em si é o padrão mais simples: percorres a lista com um for normal, chamas n.send() em cada elemento, e se devolver verdadeiro adicionas à lista de resultado. O que torna isto um exercício de POLIMORFISMO é o facto de 'ausstehend' ser List<Notification> (a classe-mãe ABSTRATA), mas cada posição guardar, na realidade, ou um EmailNotification ou um SmsNotification. Quando chamas n.send(), o programa não corre nada da classe Notification (que é abstrata) — em tempo de execução, olha para o tipo REAL do objeto e corre a versão SOBRESCRITA correspondente (enviar e-mail vs enviar SMS). Isto chama-se polimorfismo com ligação dinâmica: o mesmo código ('n.send()') comporta-se de forma diferente consoante o objeto concreto, decidido só em tempo de execução. É a resposta certa sempre que vires 'uma lista da classe-mãe, mas o comportamento muda consoante a subclasse'.","aCode":"List<Notification> sendeAlle() {\n    List<Notification> gesendet = new List<Notification>();\n    for (int i = 0; i < ausstehend.size(); i++) {\n        Notification n = ausstehend.get(i);\n        if (n.send()) {\n            gesendet.add(n);\n        }\n    }\n    return gesendet;\n}\n\n// Mecanismo: Polymorphie mit dynamischer Bindung —\n// o tipo REAL do objeto decide qual send() corre."}

let order = DECK.map((_,i)=>i);
let activeCats = new Set(Object.keys(CATS));
let availableSubs = [];
let activeSubs = new Set();
let pos = 0;
let flipped = false;
let known = new Set();

// Remembers where you left off (which cards, in which order, which filter,
// which ones you already marked "gewusst") so reopening the app continues
// instead of starting over at card 1 every time. Purely a per-device
// convenience via localStorage — never required for the app to work, and
// "Fortschritt zurücksetzen" clears it for a clean restart.
const PROGRESS_KEY = 'ap2-lernkartei-progress';

function saveProgress(){
  try{
    localStorage.setItem(PROGRESS_KEY, JSON.stringify({
      order, pos,
      known: [...known],
      activeCats: [...activeCats],
      activeSubs: [...activeSubs],
    }));
  }catch(e){}
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(PROGRESS_KEY);
    if(!raw) return null;
    const saved = JSON.parse(raw);
    if(!Array.isArray(saved.order) || !saved.order.every(i => Number.isInteger(i) && i >= 0 && i < DECK.length)) return null;
    if(typeof saved.pos !== 'number' || saved.pos < 0 || saved.pos >= Math.max(saved.order.length, 1)) return null;
    return saved;
  }catch(e){ return null; }
}

const els = {
  filters: document.getElementById('filters'),
  subfilters: document.getElementById('subfilters'),
  card: document.getElementById('card'),
  tabFront: document.getElementById('tabFront'),
  tabTextFront: document.getElementById('tabTextFront'),
  tabBack: document.getElementById('tabBack'),
  tabTextBack: document.getElementById('tabTextBack'),
  qtext: document.getElementById('qtext'),
  atext: document.getElementById('atext'),
  qextra: document.getElementById('qextra'),
  aextra: document.getElementById('aextra'),
  qpt: document.getElementById('qpt'),
  apt: document.getElementById('apt'),
  cardnoFront: document.getElementById('cardnoFront'),
  cardnoBack: document.getElementById('cardnoBack'),
  progressFill: document.getElementById('progressFill'),
  progressText: document.getElementById('progressText'),
  knownText: document.getElementById('knownText'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  flipBtn: document.getElementById('flipBtn'),
  yesBtn: document.getElementById('yesBtn'),
  noBtn: document.getElementById('noBtn'),
  shuffleBtn: document.getElementById('shuffleBtn'),
  resetBtn: document.getElementById('resetBtn'),
  drawerNo: document.getElementById('drawerNo'),
  themeToggle: document.getElementById('themeToggle'),
  ptToggle: document.getElementById('ptToggle'),
};

function buildFilters(){
  els.filters.innerHTML = '';
  const allChip = makeChip('all', 'Alle', null);
  els.filters.appendChild(allChip);
  Object.entries(CATS).forEach(([key, c])=>{
    els.filters.appendChild(makeChip(key, c.short, c));
  });
  updateFilterUI();
}

function makeChip(key, label, catObj){
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.dataset.key = key;
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.background = catObj ? `var(${catObj.var})` : 'var(--ink-soft)';
  btn.appendChild(dot);
  const span = document.createElement('span');
  span.textContent = label;
  btn.appendChild(span);
  btn.addEventListener('click', ()=> toggleCat(key));
  return btn;
}

function toggleCat(key){
  // tapping "Alle" shows everything. Tapping a specific chip while everything
  // is showing narrows down to just that one; tapping more chips after that
  // adds them to the selection, so several topics can be studied together.
  // Tapping an already-selected chip removes it; removing the last one falls
  // back to "Alle" instead of leaving the deck empty.
  const allKeys = Object.keys(CATS);
  if(key === 'all'){
    activeCats = new Set(allKeys);
  } else if(activeCats.size === allKeys.length){
    activeCats = new Set([key]);
  } else if(activeCats.has(key)){
    activeCats.delete(key);
    if(activeCats.size === 0){
      activeCats = new Set(allKeys);
    }
  } else {
    activeCats.add(key);
  }
  updateFilterUI();
  buildSubFilters();
  rebuildOrder();
}

function updateFilterUI(){
  const all = activeCats.size === Object.keys(CATS).length;
  [...els.filters.children].forEach(chip=>{
    const key = chip.dataset.key;
    if(key === 'all'){
      chip.dataset.active = all ? 'true' : 'false';
    } else {
      chip.dataset.active = activeCats.has(key) ? 'true' : 'false';
    }
  });
}

function buildSubFilters(){
  // which sub-topics actually occur among the currently selected main categories
  const seen = new Set();
  availableSubs = [];
  DECK.forEach(c=>{
    if(activeCats.has(c.cat) && !seen.has(c.sub)){
      seen.add(c.sub);
      availableSubs.push(c.sub);
    }
  });
  activeSubs = new Set(availableSubs);

  els.subfilters.innerHTML = '';
  if(availableSubs.length <= 1){
    return; // nothing meaningful to filter further
  }
  const allChip = makeSubChip('all-sub', 'Alle Themen');
  els.subfilters.appendChild(allChip);
  availableSubs.forEach(key=>{
    els.subfilters.appendChild(makeSubChip(key, SUBLABELS[key] || key));
  });
  updateSubFilterUI();
}

function makeSubChip(key, label){
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.dataset.key = key;
  const span = document.createElement('span');
  span.textContent = label;
  btn.appendChild(span);
  btn.addEventListener('click', ()=> toggleSub(key));
  return btn;
}

function toggleSub(key){
  // same rule as the main filters: start from "Alle Themen", tap topics to
  // build up a selection (SQL + UML together, say), tap a selected one again
  // to drop it, and dropping the last one falls back to "Alle Themen".
  if(key === 'all-sub'){
    activeSubs = new Set(availableSubs);
  } else if(activeSubs.size === availableSubs.length){
    activeSubs = new Set([key]);
  } else if(activeSubs.has(key)){
    activeSubs.delete(key);
    if(activeSubs.size === 0){
      activeSubs = new Set(availableSubs);
    }
  } else {
    activeSubs.add(key);
  }
  updateSubFilterUI();
  rebuildOrder();
}

function updateSubFilterUI(){
  const all = activeSubs.size === availableSubs.length;
  [...els.subfilters.children].forEach(chip=>{
    const key = chip.dataset.key;
    if(key === 'all-sub'){
      chip.dataset.active = all ? 'true' : 'false';
    } else {
      chip.dataset.active = activeSubs.has(key) ? 'true' : 'false';
    }
  });
}

function rebuildOrder(){
  order = DECK.map((_,i)=>i).filter(i => activeCats.has(DECK[i].cat) && activeSubs.has(DECK[i].sub));
  pos = 0;
  flipped = false;
  render();
  saveProgress();
}

function shuffle(){
  for(let i=order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  flipped = false;
  render();
  saveProgress();
}

function currentCard(){
  return DECK[order[pos]];
}

function fillExtra(container, code, svg){
  container.innerHTML = '';
  if(code){
    const pre = document.createElement('pre');
    pre.className = 'codeblock';
    pre.textContent = code;
    container.appendChild(pre);
  }
  if(svg){
    const div = document.createElement('div');
    div.className = 'diagram';
    div.innerHTML = svg;
    container.appendChild(div);
  }
}

function render(){
  if(order.length === 0){
    els.qtext.textContent = 'Keine Karten in dieser Auswahl.';
    els.atext.textContent = '';
    els.qextra.innerHTML = '';
    els.aextra.innerHTML = '';
    els.qpt.textContent = '';
    els.apt.textContent = '';
    els.progressText.textContent = '0 von 0';
    els.progressFill.style.width = '0%';
    return;
  }
  const c = currentCard();
  const meta = CATS[c.cat];
  els.qtext.textContent = c.q;
  els.atext.textContent = c.a;
  fillExtra(els.qextra, c.qCode, c.qSvg);
  fillExtra(els.aextra, c.aCode, c.aSvg);
  els.qpt.textContent = c.qPt || '';
  els.apt.textContent = c.aPt || '';

  [els.tabFront, els.tabBack].forEach(tab=>{
    tab.style.background = `var(${meta.bg})`;
    tab.style.color = `var(${meta.var})`;
    tab.querySelector('.dot').style.background = `var(${meta.var})`;
  });
  els.tabTextFront.textContent = meta.label;
  els.tabTextBack.textContent = meta.label;

  const num = `${pos+1} / ${order.length}`;
  els.cardnoFront.textContent = num;
  els.cardnoBack.textContent = num;

  els.card.classList.toggle('flipped', flipped);
  els.progressText.textContent = `Karte ${pos+1} von ${order.length}`;
  els.knownText.textContent = `${known.size} gewusst`;
  els.progressFill.style.width = `${((pos)/order.length)*100}%`;

  els.prevBtn.disabled = pos === 0;
  els.drawerNo.textContent = `Schublade ${String(pos+1).padStart(2,'0')} / ${String(order.length).padStart(2,'0')}`;

  resizeCardToContent();
}

function measureFaceHeight(faceEl){
  const rect = faceEl.getBoundingClientRect();
  const width = rect.width || els.card.getBoundingClientRect().width || 300;
  const clone = faceEl.cloneNode(true);
  clone.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  clone.style.position = 'absolute';
  clone.style.visibility = 'hidden';
  clone.style.pointerEvents = 'none';
  clone.style.left = '-9999px';
  clone.style.top = '0';
  clone.style.right = 'auto';
  clone.style.bottom = 'auto';
  clone.style.width = width + 'px';
  clone.style.height = 'auto';
  clone.style.minHeight = '0';
  clone.style.maxHeight = 'none';
  clone.style.overflow = 'visible';
  document.body.appendChild(clone);
  const h = clone.scrollHeight;
  document.body.removeChild(clone);
  return h;
}

function resizeCardToContent(){
  if(order.length === 0) return;
  const front = els.card.querySelector('.face.front');
  const back = els.card.querySelector('.face.back');
  if(!front || !back) return;
  const needed = Math.max(measureFaceHeight(front), measureFaceHeight(back), 280);
  els.card.style.height = needed + 'px';
}

function flip(){
  if(order.length === 0) return;
  flipped = !flipped;
  els.card.classList.toggle('flipped', flipped);
}

function next(){
  if(order.length === 0) return;
  flipped = false;
  pos = (pos + 1) % order.length;
  render();
  saveProgress();
}

function prev(){
  if(order.length === 0 || pos === 0) return;
  flipped = false;
  pos -= 1;
  render();
  saveProgress();
}

function markKnown(isKnown){
  if(order.length === 0) return;
  const idx = order[pos];
  if(isKnown){ known.add(idx); } else { known.delete(idx); }
  next();
}

els.card.addEventListener('click', flip);
els.card.addEventListener('keydown', (e)=>{
  if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flip(); }
});
els.flipBtn.addEventListener('click', flip);
els.nextBtn.addEventListener('click', next);
els.prevBtn.addEventListener('click', prev);
els.yesBtn.addEventListener('click', ()=>markKnown(true));
els.noBtn.addEventListener('click', ()=>markKnown(false));
els.shuffleBtn.addEventListener('click', shuffle);
els.resetBtn.addEventListener('click', ()=>{
  known.clear();
  pos = 0;
  flipped = false;
  render();
  saveProgress();
});

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') next();
  if(e.key === 'ArrowLeft') prev();
});

let resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resizeCardToContent, 120);
});

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=> resizeCardToContent());
}

// Registers the offline service worker when the page is served over
// http(s) (a published link). On a locally opened file (file://) this
// silently does nothing — the card data is already inline, so the page
// works fully offline either way once it has loaded once.
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

// Light/dark theme toggle. Defaults to following the phone's system setting
// (Automatisch); an explicit choice is remembered per-device so it sticks
// the next time the app is opened, but it's just a local convenience —
// never required for the app to work.
const THEME_KEY = 'ap2-lernkartei-theme';
const THEME_ORDER = ['auto', 'light', 'dark'];
const THEME_LABELS = { auto: 'Automatisch', light: 'Hell', dark: 'Dunkel' };
const THEME_ICONS = {
  auto: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke-width="1.3"/><line x1="8" y1="2" x2="8" y2="14" stroke-width="1.3"/></svg>',
  light: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke-width="1.3"/><line x1="8" y1="1" x2="8" y2="2.5" stroke-width="1.3"/><line x1="8" y1="13.5" x2="8" y2="15" stroke-width="1.3"/><line x1="1" y1="8" x2="2.5" y2="8" stroke-width="1.3"/><line x1="13.5" y1="8" x2="15" y2="8" stroke-width="1.3"/><line x1="3.1" y1="3.1" x2="4.2" y2="4.2" stroke-width="1.3"/><line x1="11.8" y1="11.8" x2="12.9" y2="12.9" stroke-width="1.3"/><line x1="3.1" y1="12.9" x2="4.2" y2="11.8" stroke-width="1.3"/><line x1="11.8" y1="4.2" x2="12.9" y2="3.1" stroke-width="1.3"/></svg>',
  dark: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 1 1 6.5 3a4.3 4.3 0 1 0 6.5 6.5z" fill="none" stroke-width="1.3" stroke-linejoin="round"/></svg>',
};

function loadThemePref(){
  try{
    const v = localStorage.getItem(THEME_KEY);
    if(v === 'light' || v === 'dark') return v;
  }catch(e){}
  return 'auto';
}

function saveThemePref(pref){
  try{
    if(pref === 'auto') localStorage.removeItem(THEME_KEY);
    else localStorage.setItem(THEME_KEY, pref);
  }catch(e){}
}

function applyTheme(pref){
  if(pref === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', pref);
  if(els.themeToggle){
    els.themeToggle.innerHTML = THEME_ICONS[pref] + '<span>' + THEME_LABELS[pref] + '</span>';
    els.themeToggle.setAttribute('aria-label', 'Design: ' + THEME_LABELS[pref] + ' (Automatisch, Hell oder Dunkel) — zum Wechseln klicken');
  }
}

let themePref = loadThemePref();
applyTheme(themePref);
if(els.themeToggle){
  els.themeToggle.addEventListener('click', ()=>{
    const i = THEME_ORDER.indexOf(themePref);
    themePref = THEME_ORDER[(i + 1) % THEME_ORDER.length];
    saveThemePref(themePref);
    applyTheme(themePref);
  });
}

// Optional Portuguese translation shown under the German question/answer,
// for cards where it helps — purely a reading aid, the German stays the
// main text since that's what appears in the real exam. Remembered via
// localStorage so the choice persists between visits, same as the theme.
const PT_KEY = 'ap2-lernkartei-show-pt';
function loadPtPref(){
  try{ return localStorage.getItem(PT_KEY) === '1'; }catch(e){ return false; }
}
function savePtPref(on){
  try{
    if(on) localStorage.setItem(PT_KEY, '1');
    else localStorage.removeItem(PT_KEY);
  }catch(e){}
}
function applyPtPref(on){
  document.body.classList.toggle('show-pt', on);
  if(els.ptToggle){
    els.ptToggle.classList.toggle('primary', on);
    els.ptToggle.setAttribute('aria-label', (on ? 'Portugiesische Übersetzung ausblenden' : 'Portugiesische Übersetzung einblenden'));
  }
}

let showPt = loadPtPref();
applyPtPref(showPt);
if(els.ptToggle){
  els.ptToggle.addEventListener('click', ()=>{
    showPt = !showPt;
    savePtPref(showPt);
    applyPtPref(showPt);
  });
}

const savedProgress = loadProgress();
if(savedProgress){
  // Resume exactly where the last visit left off: same filter, same
  // shuffle/sequence, same card, same "gewusst" marks.
  activeCats = new Set(savedProgress.activeCats && savedProgress.activeCats.length ? savedProgress.activeCats : Object.keys(CATS));
  buildFilters();
  buildSubFilters(); // recomputes availableSubs from activeCats, defaults activeSubs to "all"
  if(savedProgress.activeSubs && savedProgress.activeSubs.length){
    const restoredSubs = savedProgress.activeSubs.filter(s => availableSubs.includes(s));
    if(restoredSubs.length) activeSubs = new Set(restoredSubs);
  }
  updateSubFilterUI();
  order = savedProgress.order;
  pos = savedProgress.pos;
  known = new Set(savedProgress.known || []);
  flipped = false;
  render();
} else {
  buildFilters();
  buildSubFilters();
  rebuildOrder();
}
</script>
</body>
</html>
