<script>
// Apply any saved theme choice before first paint, so there's no flash of the
// wrong theme while the rest of the page loads.
(function(){
  try{
    var saved = localStorage.getItem('ap2-lernkartei-theme');
    if(saved === 'light' || saved === 'dark'){
      document.documentElement.setAttribute('data-theme', saved);
    }
  }catch(e){}
})();
</script>

<style>
  :root{
    --paper:#F1ECDC;
    --paper-2:#E9E2CC;
    --card:#FBF8EE;
    --ink:#22314A;
    --ink-soft:#4C5A72;
    --rule:#C9BE9E;
    --stamp-1:#A6402F;   /* Planen */
    --stamp-2:#2C6E62;   /* Algorithmen */
    --stamp-3:#7A5A2E;   /* Wiso */
    --stamp-1-bg:#F4DAD3;
    --stamp-2-bg:#D9EAE5;
    --stamp-3-bg:#EDE1C9;
    --shadow:0 1px 0 rgba(34,49,74,.06);
    --focus:#2C6E62;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#1B1F23;
      --paper-2:#20252A;
      --card:#26292C;
      --ink:#EFE9D8;
      --ink-soft:#B9B2A0;
      --rule:#3B3E3A;
      --stamp-1-bg:#3A2624;
      --stamp-2-bg:#1E322D;
      --stamp-3-bg:#332B1C;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1F23;
    --paper-2:#20252A;
    --card:#26292C;
    --ink:#EFE9D8;
    --ink-soft:#B9B2A0;
    --rule:#3B3E3A;
    --stamp-1-bg:#3A2624;
    --stamp-2-bg:#1E322D;
    --stamp-3-bg:#332B1C;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--paper-2), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Spectral', Georgia, 'Times New Roman', serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 48px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    border-bottom:1px solid var(--rule);
    padding-bottom:14px;
    margin-bottom:20px;
  }
  h1{
    font-size:1.3rem;
    font-weight:700;
    margin:0;
    letter-spacing:.2px;
  }
  h1 small{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:.68rem;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin-top:4px;
    text-transform:none;
  }
  .drawer-no{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }
  .header-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
  }
  .exams-link{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    color:var(--ink-soft);
    text-decoration:none;
    border:1px solid var(--rule);
    padding:5px 9px;
    border-radius:3px;
    transition:border-color .15s ease, color .15s ease;
  }
  .exams-link:hover{border-color:var(--ink-soft); color:var(--ink);}
  .qpt, .apt{
    display:none;
    margin-top:14px;
    padding-top:12px;
    border-top:1px dashed var(--rule);
    font-size:.92rem;
    font-style:italic;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .qpt::before, .apt::before{
    content:'PT · ';
    font-style:normal;
    font-weight:700;
    opacity:.6;
  }
  .show-pt .qpt, .show-pt .apt{ display:block; }

  .theme-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:.68rem;
    letter-spacing:.02em;
    padding:5px 9px;
    border-radius:3px;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .theme-toggle:hover{border-color:var(--ink-soft); color:var(--ink);}
  .theme-toggle:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .theme-toggle svg{width:13px; height:13px; flex:none;}
  .theme-toggle svg *{stroke:currentColor;}

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
  }
  .chip{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    padding:6px 11px;
    border-radius:3px;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip:hover{border-color:var(--ink-soft);}
  .chip:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .chip[data-active="true"]{
    color:var(--ink);
    border-color:var(--ink);
    background:var(--card);
  }
  .chip .dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    margin-right:6px;
    position:relative;
    top:-1px;
  }

  .subfilters{
    margin-top:-10px;
    margin-bottom:22px;
  }
  .subfilters .chip{
    font-size:.66rem;
    padding:5px 10px;
    opacity:.85;
  }
  .subfilters .chip[data-active="true"]{
    opacity:1;
  }

  .progressbar{
    height:3px;
    background:var(--rule);
    border-radius:2px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .progressbar > div{
    height:100%;
    background:var(--ink);
    width:0%;
    transition:width .25s ease;
  }
  .progress-label{
    font-family:'JetBrains Mono', monospace;
    font-size:.68rem;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    margin-bottom:22px;
  }

  .stage{
    perspective:1400px;
    margin-bottom:20px;
  }
  .card{
    position:relative;
    min-height:280px;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.7,.3,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:2px;
    box-shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 20px -12px rgba(34,49,74,.25);
    padding:26px 24px 22px;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .face::before{
    content:'';
    position:absolute;
    left:0; right:0; top:44px;
    height:1px;
    background:repeating-linear-gradient(to right, var(--rule) 0 6px, transparent 6px 10px);
    opacity:.55;
  }
  .face.back{transform:rotateY(180deg);}

  .tab{
    align-self:flex-start;
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    letter-spacing:.04em;
    padding:4px 9px 4px 8px;
    border-radius:2px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .tab .dot{width:6px;height:6px;border-radius:50%;}

  .facelabel{
    font-family:'JetBrains Mono', monospace;
    font-size:.62rem;
    color:var(--ink-soft);
    letter-spacing:.08em;
    margin-bottom:10px;
  }
  .qtext{
    font-size:1.18rem;
    line-height:1.5;
    font-weight:600;
    flex:1;
  }
  .atext{
    font-size:1.03rem;
    line-height:1.56;
    flex:1;
    font-weight:500;
  }
  .hint{
    margin-top:auto;
    padding-top:14px;
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    color:var(--ink-soft);
    border-top:1px dashed var(--rule);
  }
  .extra:empty{ display:none; }
  .codeblock{
    margin:12px 0 0;
    padding:11px 13px;
    background:var(--paper-2);
    border:1px solid var(--rule);
    border-radius:3px;
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    overflow-x:auto;
    color:var(--ink);
  }
  .diagram{
    margin:12px 0 0;
    padding:10px;
    background:var(--paper-2);
    border:1px solid var(--rule);
    border-radius:3px;
  }
  .diagram svg{
    display:block;
    width:100%;
    height:auto;
  }
  .cardno{
    position:absolute;
    bottom:14px;
    right:18px;
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    color:var(--ink-soft);
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  .navgroup{display:flex; gap:8px;}
  button.ctrl{
    font-family:'JetBrains Mono', monospace;
    font-size:.75rem;
    padding:9px 14px;
    border-radius:3px;
    border:1px solid var(--rule);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  button.ctrl:hover{border-color:var(--ink-soft);}
  button.ctrl:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  button.ctrl:disabled{opacity:.35; cursor:default;}
  button.ctrl.primary{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  .judge{
    display:flex;
    gap:10px;
    margin-bottom:26px;
  }
  .judge button{
    flex:1;
    font-family:'JetBrains Mono', monospace;
    font-size:.75rem;
    padding:11px 10px;
    border-radius:3px;
    cursor:pointer;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink-soft);
    transition:opacity .15s ease;
  }
  .judge button:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .judge .no{color:var(--stamp-1);}
  .judge .yes{color:var(--stamp-2);}
  .judge button:disabled{opacity:.3; cursor:default;}

  footer{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    color:var(--ink-soft);
    margin-top:8px;
  }
  footer button{
    background:none;border:none;
    font-family:inherit;font-size:inherit;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }
  .license-line{
    margin-top:10px;
    font-size:.6rem;
    opacity:.75;
  }
  .-line a{
    color:inherit;
  }

  @media (prefers-reduced-motion: reduce){
    .card{transition:none;}
  }
</style>
</head>

<script>
const CATS = {
  plan:  { label: 'Planen eines Softwareproduktes', short: 'Planen', var: '--stamp-1', bg: '--stamp-1-bg' },
  algo:  { label: 'Entwicklung & Umsetzung von Algorithmen', short: 'Algorithmen', var: '--stamp-2', bg: '--stamp-2-bg' },
  wiso:  { label: 'Wirtschafts- und Sozialkunde', short: 'Wiso', var: '--stamp-3', bg: '--stamp-3-bg' },
};

const SUBLABELS = {
  'uml': 'UML & ERM',
  'scrum': 'Scrum & Kanban',
  'vorgehen': 'Vorgehensmodelle',
  'wirtschaftlichkeit': 'Wirtschaftlichkeitsrechnung',
  'pm': 'Projektmanagement',
  'test': 'Test & Qualität',
  'anforderungen': 'Anforderungen',
  'recht': 'Verträge & Recht',
  'sicherheit': 'IT-Sicherheit & Datenschutz',
  'lizenz': 'Lizenzmodelle',
  'sonstiges-plan': 'Weiteres',
  'sql': 'SQL & Datenbanken',
  'pseudocode': 'Pseudocode & Programmablauf',
  'ds': 'Datenstrukturen',
  'sort': 'Sortieren & Suchen',
  'oop': 'OOP-Grundlagen',
  'pattern': 'Entwurfsmuster & Architektur',
  'netz': 'Netzwerke',
  'rekursion': 'Rekursion & Zahlensysteme',
  'praxis': 'Entwicklungspraxis',
  'sonstiges-algo': 'Weiteres',
  'arbeitsrecht': 'Arbeitsrecht',
  'ausbildung': 'Ausbildung & BBiG',
  'tarif': 'Tarif & Mitbestimmung',
  'unternehmen': 'Unternehmensformen',
  'wirtschaft': 'Wirtschaft & Markt',
  'steuern': 'Steuern & Sozialversicherung',
  'schutz': 'Datenschutz & Arbeitsschutz',
  'sonstiges-wiso': 'Weiteres',
};

const DECK = [
{"cat":"plan","sub":"anforderungen","q":"Was unterscheidet ein Lastenheft von einem Pflichtenheft?","a":"Das Lastenheft beschreibt aus Kundensicht das WAS und WOFÜR (Anforderungen). Das Pflichtenheft beschreibt aus Auftragnehmersicht das WIE (technische Umsetzung) und wird vom Auftragnehmer auf Basis des Lastenhefts erstellt.","qPt":"Qual é a diferença entre um Lastenheft e um Pflichtenheft?","aPt":"O Lastenheft (caderno de requisitos) descreve, do ponto de vista do cliente, O QUÊ e PARA QUÊ (os requisitos). O Pflichtenheft (caderno de especificações) descreve, do ponto de vista do fornecedor, O COMO (a implementação técnica) e é elaborado pelo fornecedor com base no Lastenheft."},
{"cat":"plan","sub":"anforderungen","q":"Was bedeutet die SMART-Regel bei der Zieldefinition?","a":"Ziele sollen Spezifisch, Messbar, Attraktiv/Akzeptiert, Realistisch und Terminiert formuliert sein.","qPt":"O que significa a regra SMART na definição de objetivos?","aPt":"Os objetivos devem ser formulados de forma Específica, Mensurável, Atrativa/Aceite, Realista e com um Prazo definido (Temporizada)."},
{"cat":"plan","sub":"scrum","q":"Nenne die drei Verantwortlichkeiten (umgangssprachlich oft noch \"Rollen\" genannt) im Scrum Team gemäß aktuellem Scrum Guide.","a":"Product Owner (verantwortet den Wert der Arbeit und das Product Backlog), Scrum Master (verantwortet die Etablierung von Scrum, coacht das Team und beseitigt Hindernisse) und die Developers (die das Increment erstellen). Seit der Scrum-Guide-Revision 2020 heißen diese drei offiziell \"Verantwortlichkeiten\" statt \"Rollen\", und es gibt kein eigenständig benanntes \"Entwicklungsteam\" mehr — alle bilden gemeinsam das eine Scrum Team.","qPt":"Indica as três responsabilidades (coloquialmente ainda muitas vezes chamadas de \"papéis\") da equipa Scrum, segundo o atual Scrum Guide.","aPt":"Product Owner (responsável pelo valor do trabalho e pelo Product Backlog), Scrum Master (responsável por estabelecer o Scrum, orienta a equipa e remove obstáculos) e os Developers (que criam o Increment). Desde a revisão do Scrum Guide de 2020, estas três passaram a chamar-se oficialmente \"responsabilidades\" em vez de \"papéis\", e deixou de existir uma \"equipa de desenvolvimento\" com nome próprio — todos formam, em conjunto, a única Scrum Team."},
{"cat":"plan","sub":"scrum","q":"Was ist ein Sprint in Scrum?","a":"Ein fester, meist 1–4 Wochen langer Zeitraum, in dem das Team ein potenziell auslieferbares Produktinkrement erstellt. Die Länge bleibt während des Projekts konstant.","qPt":"O que é um Sprint no Scrum?","aPt":"Um período fixo, normalmente entre 1 e 4 semanas, durante o qual a equipa cria um incremento do produto potencialmente entregável. A duração mantém-se constante ao longo do projeto."},
{"cat":"plan","sub":"scrum","q":"Wie unterscheiden sich Wasserfallmodell und agile Vorgehensmodelle grundsätzlich?","a":"Das Wasserfallmodell durchläuft Phasen strikt sequenziell und abgeschlossen (Planung, Design, Umsetzung, Test, Betrieb). Agile Modelle wie Scrum arbeiten iterativ-inkrementell mit kurzen Zyklen und laufender Anpassung an Änderungen.","qPt":"Qual é a diferença fundamental entre o modelo em cascata (Wasserfallmodell) e os modelos de desenvolvimento ágeis?","aPt":"O modelo em cascata percorre as fases de forma estritamente sequencial e concluída (planeamento, design, implementação, teste, operação). Os modelos ágeis, como o Scrum, trabalham de forma iterativa e incremental, em ciclos curtos, com adaptação contínua às mudanças."},
{"cat":"plan","sub":"uml","q":"Was zeigt ein UML-Anwendungsfalldiagramm (Use-Case-Diagramm)?","a":"Es zeigt Akteure (Nutzer/Systeme) und die Anwendungsfälle (Funktionen), die sie mit dem System ausführen können, sowie Beziehungen wie include und extend.","qPt":"O que mostra um diagrama de casos de uso UML (Use-Case-Diagramm)?","aPt":"Mostra os atores (utilizadores/sistemas) e os casos de uso (funcionalidades) que estes podem executar com o sistema, bem como relações como include e extend."},
{"cat":"plan","sub":"uml","q":"Was ist der Unterschied zwischen Aggregation und Komposition in UML?","a":"Beide sind \"Teil-Ganzes\"-Beziehungen. Bei der Aggregation kann der Teil unabhängig vom Ganzen existieren (offene Raute). Bei der Komposition ist der Teil existenzabhängig vom Ganzen (gefüllte Raute) — wird das Ganze gelöscht, verschwindet auch der Teil.","qPt":"Qual é a diferença entre agregação e composição em UML?","aPt":"Ambas são relações \"parte-todo\". Na agregação, a parte pode existir independentemente do todo (losango vazio). Na composição, a parte depende existencialmente do todo (losango preenchido) — se o todo for eliminado, a parte também desaparece."},
{"cat":"plan","sub":"wirtschaftlichkeit","q":"Wie berechnet sich der Return on Investment (ROI)?","a":"ROI = (Gewinn / eingesetztes Kapital) × 100. Er zeigt die prozentuale Rendite einer Investition.","qPt":"Como se calcula o Retorno sobre o Investimento (ROI)?","aPt":"ROI = (Lucro / capital investido) × 100. Indica a rentabilidade percentual de um investimento."},
{"cat":"plan","sub":"wirtschaftlichkeit","q":"Was ermittelt die statische Amortisationsrechnung?","a":"Den Zeitraum, nach dem die Anschaffungskosten einer Investition durch die erzielten Rückflüsse (Einzahlungsüberschüsse) wieder eingespielt sind.","qPt":"O que determina o método estático do período de recuperação do investimento (payback period)?","aPt":"O período de tempo após o qual o investimento inicial de um projeto é recuperado através dos retornos (excedentes de entradas de caixa) gerados."},
{"cat":"plan","sub":"wirtschaftlichkeit","q":"Was ist eine Nutzwertanalyse und wofür wird sie eingesetzt?","a":"Ein Verfahren, um mehrere Alternativen (z. B. Software-Angebote) anhand gewichteter Kriterien vergleichbar zu bewerten und eine begründete Entscheidung zu treffen.","qPt":"O que é uma análise de valor utilitário (Nutzwertanalyse) e para que é utilizada?","aPt":"Um método para avaliar e comparar várias alternativas (por exemplo, propostas de software) com base em critérios ponderados, permitindo tomar uma decisão fundamentada."},
{"cat":"plan","sub":"pm","q":"Wie definiert man Risiko im Projektmanagement (vereinfachte Formel)?","a":"Risiko = Eintrittswahrscheinlichkeit × Schadenshöhe (Tragweite). Darauf aufbauend werden Gegenmaßnahmen priorisiert.","qPt":"Como se define risco em gestão de projetos (fórmula simplificada)?","aPt":"Risco = probabilidade de ocorrência × gravidade do dano (impacto). Com base nisso, priorizam-se as medidas de mitigação."},
{"cat":"plan","sub":"pm","q":"Was ist der kritische Pfad in der Netzplantechnik?","a":"Die Abfolge von Vorgängen mit der längsten Gesamtdauer und ohne Zeitpuffer. Verzögert sich ein Vorgang auf diesem Pfad, verzögert sich das gesamte Projekt.","qPt":"O que é o caminho crítico na técnica de planeamento em rede (Netzplantechnik)?","aPt":"A sequência de atividades com a duração total mais longa e sem margem de folga (buffer). Se uma atividade deste caminho sofrer um atraso, todo o projeto atrasa."},
{"cat":"plan","sub":"scrum","q":"Was ist das Grundprinzip von Kanban?","a":"Visualisierung des Arbeitsflusses auf einem Board mit Spalten (z. B. To do / In Arbeit / Fertig) und Begrenzung der gleichzeitig bearbeiteten Aufgaben (WIP-Limit), um den Durchfluss zu optimieren.","qPt":"Qual é o princípio básico do Kanban?","aPt":"Visualizar o fluxo de trabalho num quadro (board) com colunas (por exemplo, A fazer / Em curso / Concluído) e limitar o número de tarefas em curso simultaneamente (limite WIP), de forma a otimizar o fluxo."},
{"cat":"plan","sub":"scrum","q":"Was bedeutet \"Definition of Done\" in Scrum?","a":"Ein im Team vereinbartes, verbindliches Kriterienset, das erfüllt sein muss, damit ein Product-Backlog-Element als fertiggestellt gilt.","qPt":"O que significa \"Definition of Done\" no Scrum?","aPt":"Um conjunto de critérios vinculativo, acordado pela equipa, que tem de ser cumprido para que um elemento do Product Backlog seja considerado concluído."},
{"cat":"plan","sub":"test","q":"Was ist ein Pflichtenheft-Bestandteil \"Abnahmekriterien\"?","a":"Konkrete, überprüfbare Kriterien, anhand derer Auftraggeber und Auftragnehmer gemeinsam feststellen, ob das Softwareprodukt vertragsgemäß fertiggestellt wurde.","qPt":"O que são os \"critérios de aceitação\" como parte do Pflichtenheft?","aPt":"Critérios concretos e verificáveis, com base nos quais o cliente e o fornecedor determinam em conjunto se o produto de software foi concluído de acordo com o contrato."},
{"cat":"plan","sub":"test","q":"Was ist der Unterschied zwischen Verifikation und Validierung?","a":"Verifikation prüft \"Bauen wir das Produkt richtig?\" (Erfüllung der Spezifikation). Validierung prüft \"Bauen wir das richtige Produkt?\" (Erfüllung des tatsächlichen Kundenbedarfs).","qPt":"Qual é a diferença entre verificação e validação?","aPt":"A verificação responde a \"Estamos a construir o produto corretamente?\" (cumprimento da especificação). A validação responde a \"Estamos a construir o produto correto?\" (cumprimento da necessidade real do cliente)."},
{"cat":"plan","sub":"anforderungen","q":"Was ist eine funktionale Anforderung?","a":"Eine Anforderung, die beschreibt, WAS ein System tun soll bzw. welche Funktionen es bereitstellen muss (z. B. \"Das System muss Rechnungen erstellen können\").","qPt":"O que é um requisito funcional?","aPt":"Um requisito que descreve O QUE um sistema deve fazer, ou seja, que funcionalidades deve disponibilizar (por exemplo, \"O sistema deve conseguir emitir faturas\")."},
{"cat":"plan","sub":"anforderungen","q":"Was ist eine nichtfunktionale Anforderung? Nenne ein Beispiel.","a":"Eine Anforderung an die Qualität/Rahmenbedingungen des Systems statt an konkrete Funktionen, z. B. Performance, Sicherheit, Benutzerfreundlichkeit oder Skalierbarkeit — etwa \"Die Seite muss in unter 2 Sekunden laden\".","qPt":"O que é um requisito não funcional? Dá um exemplo.","aPt":"Um requisito relacionado com a qualidade/condições do sistema, em vez de funcionalidades concretas — por exemplo, desempenho, segurança, usabilidade ou escalabilidade — como \"A página deve carregar em menos de 2 segundos\"."},
{"cat":"plan","sub":"vorgehen","q":"Was ist das V-Modell (XT)?","a":"Ein Vorgehensmodell, das jeder Entwicklungsphase (linker \"V\"-Ast) eine entsprechende Testphase (rechts) gegenüberstellt, z. B. Anforderungsanalyse ↔ Abnahmetest, Grobentwurf ↔ Systemtest, Feinentwurf ↔ Integrationstest, Implementierung ↔ Modultest.","qPt":"O que é o modelo em V (V-Modell XT)?","aPt":"Um modelo de processo que faz corresponder a cada fase de desenvolvimento (ramo esquerdo do \"V\") uma fase de teste equivalente (ramo direito) — por exemplo, análise de requisitos ↔ teste de aceitação, conceção geral ↔ teste de sistema, conceção detalhada ↔ teste de integração, implementação ↔ teste de unidade/módulo."},
{"cat":"plan","sub":"vorgehen","q":"Was ist das Spiralmodell nach Boehm?","a":"Ein iteratives, risikogetriebenes Vorgehensmodell, bei dem das Projekt in mehreren Zyklen durchlaufen wird, wobei jeder Zyklus Zielbestimmung, Risikoanalyse, Entwicklung/Test und Planung des nächsten Zyklus umfasst.","qPt":"O que é o modelo em espiral de Boehm?","aPt":"Um modelo de processo iterativo e orientado ao risco, em que o projeto percorre vários ciclos, sendo que cada ciclo inclui a definição de objetivos, a análise de riscos, o desenvolvimento/teste e o planeamento do ciclo seguinte."},
{"cat":"plan","sub":"vorgehen","q":"Was ist Prototyping als Vorgehensmodell?","a":"Es werden frühzeitig funktionsfähige Vorabversionen (Prototypen) des Systems erstellt, um Anforderungen zu klären oder Konzepte zu testen, bevor die endgültige Lösung entwickelt wird.","qPt":"O que é a prototipagem (Prototyping) como modelo de processo?","aPt":"São criadas, numa fase precoce, versões preliminares funcionais (protótipos) do sistema, para esclarecer requisitos ou testar conceitos antes de se desenvolver a solução final."},
{"cat":"plan","sub":"vorgehen","q":"Was ist Extreme Programming (XP)?","a":"Ein agiles Vorgehensmodell mit Praktiken wie Pair Programming, Test-Driven Development, kontinuierlicher Integration und kurzen Release-Zyklen, das auf enge Kundenzusammenarbeit setzt.","qPt":"O que é a Extreme Programming (XP)?","aPt":"Um modelo de processo ágil com práticas como Pair Programming, Test-Driven Development, integração contínua e ciclos de release curtos, apostando numa colaboração estreita com o cliente."},
{"cat":"plan","sub":"scrum","q":"Was steht im Product Backlog bei Scrum?","a":"Eine priorisierte, sich ständig weiterentwickelnde Liste aller Anforderungen, Funktionen und Änderungen, die am Produkt vorgenommen werden sollen, gepflegt vom Product Owner.","qPt":"O que consta no Product Backlog, no Scrum?","aPt":"Uma lista priorizada e em constante evolução de todos os requisitos, funcionalidades e alterações a realizar no produto, mantida pelo Product Owner."},
{"cat":"plan","sub":"scrum","q":"Was ist ein Sprint Backlog?","a":"Der Sprint Backlog besteht laut aktuellem Scrum Guide aus drei Elementen: dem Sprint-Ziel (Warum), den für den Sprint ausgewählten Product-Backlog-Einträgen (Was) und einem Plan zu deren Umsetzung (Wie). Er wird von den Developers erstellt und gepflegt und im Sprintverlauf laufend aktualisiert.","qPt":"O que é um Sprint Backlog?","aPt":"Segundo o atual Scrum Guide, o Sprint Backlog é composto por três elementos: o objetivo do Sprint (o Porquê), os itens do Product Backlog selecionados para o Sprint (o Quê) e um plano para a sua realização (o Como). É criado e mantido pelos Developers, sendo atualizado continuamente ao longo do Sprint."},
{"cat":"plan","sub":"scrum","q":"Was passiert im Daily Scrum?","a":"Ein auf 15 Minuten timeboxtes, tägliches Event der Developers, um den Fortschritt in Richtung Sprint-Ziel zu überprüfen und den Sprint Backlog bei Bedarf anzupassen. Der aktuelle Scrum Guide schreibt dafür kein festes Frage-Schema (z. B. \"gestern/heute/Hindernisse\") mehr vor — das Team kann Struktur und Technik frei wählen, solange der Fokus auf dem Sprint-Ziel erhalten bleibt.","qPt":"O que acontece no Daily Scrum?","aPt":"Um evento diário dos Developers, com timebox de 15 minutos, para verificar o progresso em direção ao objetivo do Sprint e ajustar o Sprint Backlog, se necessário. O atual Scrum Guide já não prescreve um esquema fixo de perguntas (por exemplo, \"ontem/hoje/obstáculos\") — a equipa pode escolher livremente a estrutura e a técnica, desde que o foco no objetivo do Sprint se mantenha."},
{"cat":"plan","sub":"scrum","q":"Was ist ein Sprint Review?","a":"Ein Termin am Ende des Sprints, bei dem das Team das fertige Produktinkrement den Stakeholdern präsentiert und Feedback einholt.","qPt":"O que é um Sprint Review?","aPt":"Uma reunião no final do Sprint, na qual a equipa apresenta o incremento de produto concluído aos stakeholders e recolhe feedback."},
{"cat":"plan","sub":"scrum","q":"Was ist eine Sprint Retrospective?","a":"Ein team-internes Treffen nach dem Sprint Review, in dem reflektiert wird, wie die Zusammenarbeit und der Prozess verbessert werden können.","qPt":"O que é uma Sprint Retrospective?","aPt":"Uma reunião interna da equipa, realizada após o Sprint Review, em que se reflete sobre como melhorar a colaboração e o processo."},
{"cat":"plan","sub":"scrum","q":"Was ist ein Burndown-Chart?","a":"Ein Diagramm, das den verbleibenden Arbeitsaufwand (z. B. Story Points) über die Zeit eines Sprints darstellt und so den Fortschritt visualisiert.","qPt":"O que é um gráfico Burndown?","aPt":"Um gráfico que representa o trabalho restante (por exemplo, em Story Points) ao longo do tempo de um Sprint, visualizando assim o progresso."},
{"cat":"plan","sub":"scrum","q":"Was sind Story Points?","a":"Eine relative Maßeinheit zur Schätzung des Aufwands/der Komplexität einer User Story, unabhängig von absoluter Zeit.","qPt":"O que são Story Points?","aPt":"Uma unidade relativa de medida para estimar o esforço/complexidade de uma User Story, independente do tempo absoluto."},
{"cat":"plan","sub":"scrum","q":"Was ist Planning Poker?","a":"Eine Schätztechnik, bei der Teammitglieder verdeckt Karten mit Aufwandsschätzungen (oft Fibonacci-Zahlen) wählen und diese gleichzeitig aufdecken, um zu einer gemeinsamen Einschätzung zu kommen.","qPt":"O que é o Planning Poker?","aPt":"Uma técnica de estimativa em que os membros da equipa escolhem, em segredo, cartas com estimativas de esforço (frequentemente números de Fibonacci) e as revelam simultaneamente, para chegar a uma estimativa consensual."},
{"cat":"plan","sub":"scrum","q":"Was ist eine User Story?","a":"Eine kurze, aus Anwendersicht formulierte Beschreibung einer Anforderung, oft im Format \"Als [Rolle] möchte ich [Ziel], damit [Nutzen]\".","qPt":"O que é uma User Story?","aPt":"Uma descrição breve de um requisito, formulada do ponto de vista do utilizador, frequentemente no formato \"Como [papel], quero [objetivo], para que [benefício]\"."},
{"cat":"plan","sub":"scrum","q":"Was bedeutet das WIP-Limit bei Kanban?","a":"Es begrenzt die Anzahl der Aufgaben, die gleichzeitig in einer Spalte/einem Arbeitsschritt bearbeitet werden dürfen, um Engpässe zu vermeiden und den Durchfluss zu verbessern.","qPt":"O que significa o limite WIP no Kanban?","aPt":"Limita o número de tarefas que podem estar a ser trabalhadas em simultâneo numa coluna/etapa de trabalho, de forma a evitar estrangulamentos e melhorar o fluxo."},
{"cat":"plan","sub":"scrum","q":"Was zeigt ein Cumulative-Flow-Diagram?","a":"Es zeigt über die Zeit, wie viele Arbeitseinheiten sich in welchem Status (z. B. To do, In Arbeit, Fertig) befinden, und macht Engpässe im Arbeitsfluss sichtbar.","qPt":"O que mostra um Cumulative Flow Diagram?","aPt":"Mostra, ao longo do tempo, quantas unidades de trabalho se encontram em cada estado (por exemplo, A fazer, Em curso, Concluído), tornando visíveis os estrangulamentos no fluxo de trabalho."},
{"cat":"plan","sub":"uml","q":"Was ist der Unterschied zwischen Assoziation und Vererbung in UML-Klassendiagrammen?","a":"Eine Assoziation beschreibt eine Beziehung zwischen zwei eigenständigen Klassen (z. B. \"nutzt\", \"hat\"). Vererbung (Generalisierung) beschreibt eine Ist-ein-Beziehung, bei der eine Klasse Eigenschaften einer Oberklasse übernimmt.","qPt":"Qual é a diferença entre associação e herança nos diagramas de classes UML?","aPt":"Uma associação descreve uma relação entre duas classes independentes (por exemplo, \"usa\", \"tem\"). A herança (generalização) descreve uma relação \"é um\", em que uma classe herda as propriedades de uma superclasse."},
{"cat":"plan","sub":"uml","q":"Was gibt die Multiplizität in einem UML-Klassendiagramm an?","a":"Sie gibt an, wie viele Objekte der einen Klasse mit wie vielen Objekten der anderen Klasse in Beziehung stehen können (z. B. 1, 0..1, 1..*, 0..*).","qPt":"O que indica a multiplicidade num diagrama de classes UML?","aPt":"Indica quantos objetos de uma classe podem estar relacionados com quantos objetos da outra classe (por exemplo, 1, 0..1, 1..*, 0..*)."},
{"cat":"plan","sub":"uml","q":"Was zeigt ein UML-Sequenzdiagramm?","a":"Es stellt den zeitlichen Ablauf von Nachrichten/Methodenaufrufen zwischen Objekten dar und eignet sich zur Visualisierung dynamischer Abläufe.","qPt":"O que mostra um diagrama de sequência UML?","aPt":"Representa a ordem temporal das mensagens/chamadas de métodos entre objetos, sendo adequado para visualizar fluxos dinâmicos."},
{"cat":"plan","sub":"uml","q":"Was zeigt ein UML-Aktivitätsdiagramm?","a":"Es visualisiert den Ablauf eines Prozesses oder Algorithmus mit Aktivitäten, Entscheidungen, parallelen Abläufen und Start-/Endpunkten — ähnlich einem Flussdiagramm.","qPt":"O que mostra um diagrama de atividades UML?","aPt":"Visualiza o fluxo de um processo ou algoritmo, com atividades, decisões, fluxos paralelos e pontos de início/fim — semelhante a um fluxograma."},
{"cat":"plan","sub":"uml","q":"Was zeigt ein UML-Zustandsdiagramm (State Machine)?","a":"Es zeigt die möglichen Zustände eines Objekts und die Übergänge (Transitionen) zwischen diesen Zuständen, ausgelöst durch Ereignisse.","qPt":"O que mostra um diagrama de estados UML (State Machine)?","aPt":"Mostra os possíveis estados de um objeto e as transições entre esses estados, desencadeadas por eventos."},
{"cat":"plan","sub":"uml","q":"Was ist ein Entity-Relationship-Modell (ERM)?","a":"Ein Modell zur Darstellung von Datenobjekten (Entitäten), ihren Attributen und den Beziehungen zwischen ihnen — Grundlage für den Datenbankentwurf.","qPt":"O que é um modelo entidade-relacionamento (ERM)?","aPt":"Um modelo para representar objetos de dados (entidades), os seus atributos e as relações entre eles — a base para o desenho de bases de dados."},
{"cat":"plan","sub":"uml","q":"Was bedeutet Kardinalität in einem ER-Modell?","a":"Sie beschreibt, wie viele Instanzen einer Entität mit wie vielen Instanzen einer anderen Entität in Beziehung stehen können, z. B. 1:1, 1:n, n:m.","qPt":"O que significa cardinalidade num modelo entidade-relacionamento?","aPt":"Descreve quantas instâncias de uma entidade podem estar relacionadas com quantas instâncias de outra entidade, por exemplo 1:1, 1:n, n:m."},
{"cat":"plan","sub":"uml","q":"Wie löst man eine n:m-Beziehung im relationalen Datenmodell auf?","a":"Durch eine zusätzliche Zwischentabelle (Verbindungstabelle), die die Primärschlüssel beider beteiligten Tabellen als Fremdschlüssel enthält.","qPt":"Como se resolve uma relação n:m no modelo de dados relacional?","aPt":"Através de uma tabela intermédia adicional (tabela de associação), que contém as chaves primárias de ambas as tabelas envolvidas como chaves estrangeiras."},
{"cat":"plan","sub":"wirtschaftlichkeit","q":"Was ist die Kapitalwertmethode?","a":"Ein dynamisches Investitionsrechnungsverfahren, bei dem alle zukünftigen Ein- und Auszahlungen einer Investition auf den heutigen Zeitpunkt abgezinst und summiert werden; ist der Kapitalwert positiv, gilt die Investition als vorteilhaft.","qPt":"O que é o método do valor atual líquido (Kapitalwertmethode)?","aPt":"Um método dinâmico de cálculo de investimento, em que todas as entradas e saídas futuras de um investimento são descontadas para o momento atual e somadas; se o valor atual líquido for positivo, o investimento é considerado vantajoso."},
{"cat":"plan","sub":"wirtschaftlichkeit","q":"Was ist der Unterschied zwischen statischer und dynamischer Investitionsrechnung?","a":"Statische Verfahren (z. B. Amortisationsrechnung) berücksichtigen keinen Zeitwert des Geldes, dynamische Verfahren (z. B. Kapitalwertmethode) diskontieren zukünftige Zahlungen auf den heutigen Wert.","qPt":"Qual é a diferença entre o cálculo de investimento estático e dinâmico?","aPt":"Os métodos estáticos (por exemplo, o período de recuperação do investimento) não consideram o valor temporal do dinheiro; os métodos dinâmicos (por exemplo, o método do valor atual líquido) descontam os pagamentos futuros para o seu valor atual."},
{"cat":"plan","sub":"wirtschaftlichkeit","q":"Was ist der Break-even-Point?","a":"Der Punkt, an dem Erlöse und Kosten gleich hoch sind — ab hier erwirtschaftet ein Produkt/Projekt Gewinn.","qPt":"O que é o ponto de equilíbrio (break-even point)?","aPt":"O ponto em que as receitas e os custos são iguais — a partir daqui, um produto/projeto gera lucro."},
{"cat":"plan","sub":"wirtschaftlichkeit","q":"Was umfasst eine Kosten-Nutzen-Analyse?","a":"Der Vergleich der voraussichtlichen Kosten einer Maßnahme (z. B. Softwareeinführung) mit ihrem erwarteten Nutzen, um eine Entscheidungsgrundlage zu schaffen.","qPt":"O que abrange uma análise custo-benefício?","aPt":"A comparação entre os custos previstos de uma medida (por exemplo, a introdução de um software) e o benefício esperado, de modo a criar uma base para a decisão."},
{"cat":"plan","sub":"pm","q":"Was ist eine Netzplantechnik-Vorwärtsterminierung?","a":"Die Berechnung der frühestmöglichen Anfangs- und Endzeitpunkte aller Vorgänge eines Projekts, ausgehend vom Projektstart.","qPt":"O que é o escalonamento para a frente (Vorwärtsterminierung) na técnica de planeamento em rede?","aPt":"O cálculo dos momentos de início e fim mais precoces possíveis de todas as atividades de um projeto, partindo do início do projeto."},
{"cat":"plan","sub":"pm","q":"Was ist eine Netzplantechnik-Rückwärtsterminierung?","a":"Die Berechnung der spätestmöglichen Anfangs- und Endzeitpunkte aller Vorgänge, ausgehend vom (fixen) Projektende.","qPt":"O que é o escalonamento para trás (Rückwärtsterminierung) na técnica de planeamento em rede?","aPt":"O cálculo dos momentos de início e fim mais tardios possíveis de todas as atividades, partindo do fim (fixo) do projeto."},
{"cat":"plan","sub":"pm","q":"Was ist ein Puffer (Slack) in der Netzplantechnik?","a":"Die Zeitspanne, um die sich ein Vorgang verschieben kann, ohne den Gesamtendtermin des Projekts zu gefährden.","qPt":"O que é uma margem de folga (slack) na técnica de planeamento em rede?","aPt":"O período de tempo durante o qual uma atividade pode ser deslocada sem comprometer a data final global do projeto."},
{"cat":"plan","sub":"pm","q":"Was zeigt ein Gantt-Diagramm?","a":"Eine Balkendarstellung, die Vorgänge eines Projekts über die Zeitachse zeigt, inklusive Start-/Endzeitpunkten und teilweise Abhängigkeiten.","qPt":"O que mostra um diagrama de Gantt?","aPt":"Uma representação em barras que mostra as atividades de um projeto ao longo do eixo do tempo, incluindo datas de início/fim e, por vezes, as suas dependências."},
{"cat":"plan","sub":"pm","q":"Was ist ein Meilenstein im Projektmanagement?","a":"Ein bedeutsames, terminiertes Ereignis oder Teilergebnis im Projektverlauf ohne eigene Dauer, das den Fortschritt markiert.","qPt":"O que é um milestone (marco) em gestão de projetos?","aPt":"Um evento ou resultado parcial importante e datado no decorrer do projeto, sem duração própria, que marca o progresso."},
{"cat":"plan","sub":"pm","q":"Nenne die klassischen Phasen eines Softwareprojekts.","a":"Initiierung/Anforderungsanalyse, Planung/Entwurf, Umsetzung/Implementierung, Test/Abnahme und Einführung/Betrieb (inkl. Wartung).","qPt":"Indica as fases clássicas de um projeto de software.","aPt":"Iniciação/análise de requisitos, planeamento/conceção, implementação, teste/aceitação e implantação/operação (incluindo manutenção)."},
{"cat":"plan","sub":"test","q":"Was ist ein Unit-Test?","a":"Ein Test, der eine einzelne, isolierte Programmeinheit (z. B. eine Methode oder Klasse) auf korrektes Verhalten prüft.","qPt":"O que é um teste unitário (Unit-Test)?","aPt":"Um teste que verifica o comportamento correto de uma única unidade de programa isolada (por exemplo, um método ou uma classe)."},
{"cat":"plan","sub":"test","q":"Was ist ein Integrationstest?","a":"Ein Test, der das Zusammenspiel mehrerer bereits einzeln getesteter Module/Komponenten prüft.","qPt":"O que é um teste de integração?","aPt":"Um teste que verifica a interação entre vários módulos/componentes já testados individualmente."},
{"cat":"plan","sub":"test","q":"Was ist ein Systemtest?","a":"Ein Test des gesamten, integrierten Systems gegen die Gesamtanforderungen, meist in einer produktionsnahen Umgebung.","qPt":"O que é um teste de sistema?","aPt":"Um teste do sistema completo e integrado em relação aos requisitos globais, normalmente num ambiente semelhante ao de produção."},
{"cat":"plan","sub":"test","q":"Was ist ein Abnahmetest?","a":"Ein Test, bei dem der Auftraggeber prüft, ob das fertige System die vereinbarten Anforderungen erfüllt und abgenommen werden kann.","qPt":"O que é um teste de aceitação?","aPt":"Um teste em que o cliente verifica se o sistema concluído cumpre os requisitos acordados e pode ser aceite."},
{"cat":"plan","sub":"test","q":"Was ist der Unterschied zwischen Black-Box- und White-Box-Testing?","a":"Beim Black-Box-Test wird nur das Ein-/Ausgabeverhalten geprüft, ohne die interne Struktur zu kennen. Beim White-Box-Test kennt der Tester den internen Aufbau/Code und testet gezielt Pfade und Strukturen.","qPt":"Qual é a diferença entre teste de caixa-preta (Black-Box) e teste de caixa-branca (White-Box)?","aPt":"No teste de caixa-preta, apenas se verifica o comportamento de entrada/saída, sem conhecer a estrutura interna. No teste de caixa-branca, o testador conhece a estrutura interna/o código e testa de forma direcionada caminhos e estruturas específicas."},
{"cat":"plan","sub":"test","q":"Was ist die Äquivalenzklassenmethode beim Testen?","a":"Eingabewerte werden in Klassen eingeteilt, die voraussichtlich gleich behandelt werden; es wird angenommen, dass ein Testfall pro Klasse repräsentativ für die gesamte Klasse ist.","qPt":"O que é o método das classes de equivalência no teste de software?","aPt":"Os valores de entrada são divididos em classes que, presumivelmente, serão tratadas da mesma forma; assume-se que um caso de teste por classe é representativo de toda a classe."},
{"cat":"plan","sub":"test","q":"Was ist die Grenzwertanalyse beim Testen?","a":"Eine Testmethode, die gezielt Werte an den Rändern von Äquivalenzklassen testet (z. B. Minimum, Maximum, direkt darüber/darunter), da dort Fehler besonders häufig auftreten.","qPt":"O que é a análise de valores-limite no teste de software?","aPt":"Um método de teste que testa especificamente valores nos limites das classes de equivalência (por exemplo, mínimo, máximo, imediatamente acima/abaixo), uma vez que é aí que os erros ocorrem com mais frequência."},
{"cat":"plan","sub":"recht","q":"Was ist der Unterschied zwischen Werkvertrag und Dienstvertrag?","a":"Beim Werkvertrag (§631 BGB) wird ein konkreter Erfolg/ein Ergebnis geschuldet (z. B. eine fertige Software). Beim Dienstvertrag (§611 BGB) wird nur die Tätigkeit/Arbeitsleistung geschuldet, unabhängig vom Erfolg.","qPt":"Qual é a diferença entre contrato de empreitada (Werkvertrag) e contrato de prestação de serviços (Dienstvertrag)?","aPt":"No contrato de empreitada (§631 BGB) é devido um resultado/sucesso concreto (por exemplo, um software concluído). No contrato de prestação de serviços (§611 BGB) é devida apenas a atividade/o trabalho em si, independentemente do resultado."},
{"cat":"plan","sub":"recht","q":"Was regeln Allgemeine Geschäftsbedingungen (AGB)?","a":"Vorformulierte Vertragsbedingungen, die eine Partei der anderen bei Vertragsschluss stellt, um wiederkehrende Geschäfte einheitlich zu regeln — unterliegen einer gesetzlichen Inhaltskontrolle.","qPt":"O que regulam as Condições Gerais de Contrato (Allgemeine Geschäftsbedingungen, AGB)?","aPt":"São cláusulas contratuais pré-formuladas que uma das partes apresenta à outra na celebração do contrato, para regular de forma uniforme negócios recorrentes — estão sujeitas a um controlo legal de conteúdo."},
{"cat":"plan","sub":"recht","q":"Was bedeutet Gewährleistung im Kaufrecht/Werkvertragsrecht?","a":"Die gesetzliche Pflicht des Verkäufers/Werkunternehmers, für Mängel der gelieferten Sache/des Werks einzustehen, z. B. durch Nacherfüllung (Nachbesserung bzw. Nachlieferung), Minderung, Rücktritt oder Schadensersatz.","qPt":"O que significa garantia legal (Gewährleistung) no direito da compra e venda/no direito da empreitada?","aPt":"É a obrigação legal do vendedor/empreiteiro de responder por defeitos na coisa/obra entregue, por exemplo através de cumprimento posterior (reparação ou substituição), redução do preço, resolução do contrato ou indemnização."},
{"cat":"plan","sub":"sicherheit","q":"Was sind die drei klassischen Schutzziele der IT-Sicherheit?","a":"Vertraulichkeit (Confidentiality), Integrität (Integrity) und Verfügbarkeit (Availability) — oft als CIA-Triade bezeichnet.","qPt":"Quais são os três objetivos clássicos de proteção da segurança informática?","aPt":"Confidencialidade (Confidentiality), Integridade (Integrity) e Disponibilidade (Availability) — frequentemente designados como a tríade CIA."},
{"cat":"plan","sub":"sicherheit","q":"Was ist der Unterschied zwischen symmetrischer und asymmetrischer Verschlüsselung?","a":"Bei symmetrischer Verschlüsselung wird derselbe Schlüssel zum Ver- und Entschlüsseln verwendet. Bei asymmetrischer Verschlüsselung gibt es ein Schlüsselpaar aus öffentlichem und privatem Schlüssel.","qPt":"Qual é a diferença entre encriptação simétrica e assimétrica?","aPt":"Na encriptação simétrica é usada a mesma chave para encriptar e desencriptar. Na encriptação assimétrica existe um par de chaves, uma pública e uma privada."},
{"cat":"plan","sub":"sicherheit","q":"Was ist eine Firewall?","a":"Ein System (Hard- oder Software), das den Datenverkehr zwischen Netzen anhand definierter Regeln überwacht und filtert, um unerwünschten Zugriff zu verhindern.","qPt":"O que é uma firewall?","aPt":"Um sistema (hardware ou software) que monitoriza e filtra o tráfego de dados entre redes com base em regras definidas, para impedir acessos não autorizados."},
{"cat":"plan","sub":"sicherheit","q":"Was ist ein VPN?","a":"Ein Virtual Private Network stellt eine verschlüsselte Verbindung über ein öffentliches Netz her, sodass Daten sicher wie in einem privaten Netzwerk übertragen werden können.","qPt":"O que é uma VPN?","aPt":"Uma Virtual Private Network estabelece uma ligação encriptada através de uma rede pública, permitindo transmitir dados com segurança como numa rede privada."},
{"cat":"plan","sub":"sicherheit","q":"Was besagt die DSGVO grundsätzlich?","a":"Die Datenschutz-Grundverordnung regelt EU-weit einheitlich den Umgang mit personenbezogenen Daten und verpflichtet Unternehmen u. a. zu Rechtmäßigkeit, Zweckbindung, Datenminimierung und Transparenz bei der Verarbeitung.","qPt":"Qual é o conteúdo essencial do RGPD?","aPt":"O Regulamento Geral sobre a Proteção de Dados regula de forma uniforme, em toda a UE, o tratamento de dados pessoais e obriga as empresas, entre outros aspetos, a cumprir os princípios da licitude, limitação da finalidade, minimização dos dados e transparência no tratamento."},
{"cat":"plan","sub":"sicherheit","q":"Was versteht man unter \"Privacy by Design\"?","a":"Das Prinzip, Datenschutz bereits von Beginn an in die technische Konzeption und Entwicklung von Systemen und Prozessen einzubeziehen, statt ihn nachträglich hinzuzufügen.","qPt":"O que se entende por \"Privacy by Design\"?","aPt":"O princípio de incluir a proteção de dados desde o início na conceção técnica e no desenvolvimento de sistemas e processos, em vez de a acrescentar posteriormente."},
{"cat":"plan","sub":"lizenz","q":"Was ist der Unterschied zwischen Open-Source- und proprietärer Software?","a":"Open-Source-Software stellt ihren Quellcode offen zur Verfügung und erlaubt meist Nutzung, Veränderung und Weitergabe unter bestimmten Lizenzbedingungen. Proprietäre Software ist closed-source, Rechte liegen beim Hersteller, Nutzung ist meist lizenzpflichtig eingeschränkt.","qPt":"Qual é a diferença entre software open source e software proprietário?","aPt":"O software open source disponibiliza abertamente o seu código-fonte e normalmente permite a utilização, alteração e distribuição sob determinadas condições de licença. O software proprietário é closed-source, os direitos pertencem ao fabricante e a utilização é geralmente limitada por licença."},
{"cat":"plan","sub":"lizenz","q":"Was ist der Unterschied zwischen Freeware und Shareware?","a":"Freeware ist kostenlos nutzbar, meist ohne Weitergabe des Quellcodes. Shareware darf zeitlich oder funktional eingeschränkt kostenlos getestet werden, für die Vollversion ist danach eine Zahlung fällig.","qPt":"Qual é a diferença entre freeware e shareware?","aPt":"O freeware pode ser utilizado gratuitamente, geralmente sem disponibilização do código-fonte. O shareware pode ser testado gratuitamente, com limitações de tempo ou de funcionalidades, sendo depois necessário pagar para obter a versão completa."},
{"cat":"plan","sub":"pm","q":"Was ist eine Stakeholder-Analyse?","a":"Die systematische Identifikation und Bewertung aller Personen/Gruppen, die von einem Projekt betroffen sind oder Einfluss darauf haben, um deren Interessen und Erwartungen zu berücksichtigen.","qPt":"O que é uma análise de stakeholders?","aPt":"A identificação e avaliação sistemática de todas as pessoas/grupos afetados por um projeto ou com influência sobre ele, de forma a considerar os seus interesses e expectativas."},
{"cat":"plan","sub":"anforderungen","q":"Was ist ein Lastenheft-Bestandteil \"Muss-Kriterium\" vs. \"Kann-Kriterium\"?","a":"Muss-Kriterien sind zwingend zu erfüllende Anforderungen, ohne die die Lösung nicht akzeptiert wird. Kann-Kriterien sind wünschenswerte, aber nicht zwingende Zusatzanforderungen.","qPt":"O que distingue, no caderno de encargos (Lastenheft), um \"critério obrigatório\" (Muss-Kriterium) de um \"critério opcional\" (Kann-Kriterium)?","aPt":"Os critérios obrigatórios são requisitos que têm de ser cumpridos, sem os quais a solução não é aceite. Os critérios opcionais são requisitos adicionais desejáveis, mas não obrigatórios."},
{"cat":"plan","sub":"pm","q":"Was ist eine SWOT-Analyse?","a":"Eine Analysemethode, die Stärken (Strengths), Schwächen (Weaknesses), Chancen (Opportunities) und Risiken (Threats) eines Vorhabens oder Unternehmens systematisch gegenüberstellt.","qPt":"O que é uma análise SWOT?","aPt":"Um método de análise que confronta sistematicamente os pontos fortes (Strengths), os pontos fracos (Weaknesses), as oportunidades (Opportunities) e as ameaças (Threats) de um projeto ou empresa."},
{"cat":"plan","sub":"pm","q":"Was ist ein Change-Request im Projektmanagement?","a":"Ein formal gestellter Antrag auf Änderung des Projektumfangs, der Anforderungen, des Zeitplans oder des Budgets nach Projektstart, der bewertet und genehmigt werden muss.","qPt":"O que é um Change Request na gestão de projetos?","aPt":"Um pedido formal de alteração ao âmbito do projeto, aos requisitos, ao cronograma ou ao orçamento, feito depois do início do projeto, que tem de ser avaliado e aprovado."},
{"cat":"plan","sub":"pm","q":"Was bedeutet \"Scope Creep\"?","a":"Die schleichende, unkontrollierte Ausweitung des Projektumfangs ohne entsprechende Anpassung von Zeit, Budget oder Ressourcen.","qPt":"O que significa \"Scope Creep\"?","aPt":"O alargamento gradual e descontrolado do âmbito do projeto, sem o correspondente ajuste do tempo, orçamento ou recursos."},
{"cat":"plan","sub":"test","q":"Was ist der Unterschied zwischen Qualitätssicherung und Qualitätsmanagement?","a":"Qualitätssicherung (QS) umfasst konkrete Maßnahmen zur Prüfung/Sicherstellung der Produktqualität (z. B. Tests). Qualitätsmanagement (QM) ist der übergeordnete, organisatorische Rahmen, der Prozesse, Verantwortlichkeiten und kontinuierliche Verbesserung steuert.","qPt":"Qual é a diferença entre garantia de qualidade e gestão da qualidade?","aPt":"A garantia de qualidade (QS) engloba medidas concretas para verificar/assegurar a qualidade do produto (por exemplo, testes). A gestão da qualidade (QM) é o enquadramento organizacional mais amplo que rege processos, responsabilidades e a melhoria contínua."},
{"cat":"plan","sub":"test","q":"Was ist der PDCA-Zyklus?","a":"Ein Modell für kontinuierliche Verbesserung mit den Phasen Plan (Planen), Do (Umsetzen), Check (Überprüfen) und Act (Anpassen/Standardisieren).","qPt":"O que é o ciclo PDCA?","aPt":"Um modelo de melhoria contínua com as fases Plan (planear), Do (executar), Check (verificar) e Act (atuar/padronizar)."},
{"cat":"algo","sub":"ds","q":"Was ist der Unterschied zwischen Stack und Queue?","a":"Ein Stack arbeitet nach dem LIFO-Prinzip (Last In, First Out) — das zuletzt eingefügte Element wird zuerst entnommen. Eine Queue arbeitet nach FIFO (First In, First Out) — das zuerst eingefügte Element wird zuerst entnommen.","qPt":"Qual é a diferença entre uma Stack e uma Queue?","aPt":"Uma Stack funciona segundo o princípio LIFO (Last In, First Out) — o último elemento inserido é o primeiro a ser retirado. Uma Queue funciona segundo o princípio FIFO (First In, First Out) — o primeiro elemento inserido é o primeiro a ser retirado."},
{"cat":"algo","sub":"ds","q":"Was ist eine verkettete Liste (Linked List)?","a":"Eine dynamische Datenstruktur, bei der jedes Element (Knoten) seinen Wert und einen Verweis (Zeiger) auf das nächste Element speichert — im Gegensatz zum Array liegt der Speicher nicht zwingend zusammenhängend vor.","qPt":"O que é uma lista ligada (Linked List)?","aPt":"Uma estrutura de dados dinâmica em que cada elemento (nó) armazena o seu valor e uma referência (ponteiro) para o elemento seguinte — ao contrário de um array, a memória não tem de estar armazenada de forma contígua."},
{"cat":"algo","sub":"sort","q":"Wie funktioniert Bubble Sort grundsätzlich?","a":"Benachbarte Elemente werden wiederholt paarweise verglichen und bei falscher Reihenfolge vertauscht. Nach jedem Durchlauf \"steigt\" das größte verbliebene Element ans Ende — bis das Array sortiert ist.","qPt":"Como funciona basicamente o Bubble Sort?","aPt":"Elementos vizinhos são repetidamente comparados aos pares e trocados quando estão na ordem errada. Após cada passagem, o maior elemento restante \"sobe\" até ao final — até o array estar ordenado."},
{"cat":"algo","sub":"rekursion","q":"Was ist Rekursion?","a":"Eine Funktion, die sich selbst aufruft, um ein Problem in kleinere gleichartige Teilprobleme zu zerlegen. Sie benötigt eine Abbruchbedingung (Basisfall), sonst läuft sie unendlich weiter.","qPt":"O que é a recursividade?","aPt":"Uma função que se chama a si mesma para decompor um problema em subproblemas mais pequenos e do mesmo tipo. Necessita de uma condição de paragem (caso base), caso contrário continua indefinidamente."},
{"cat":"algo","sub":"sort","q":"Wie funktioniert die binäre Suche und welche Voraussetzung hat sie?","a":"Sie halbiert wiederholt den Suchbereich, indem sie den Mittelwert mit dem Zielwert vergleicht. Voraussetzung: Das Array muss sortiert sein. Laufzeit: O(log n).","qPt":"Como funciona a pesquisa binária e que condição tem de estar reunida?","aPt":"Divide repetidamente o intervalo de pesquisa a meio, comparando o valor do meio com o valor procurado. Condição: o array tem de estar ordenado. Complexidade temporal: O(log n)."},
{"cat":"algo","sub":"oop","q":"Was bedeutet Kapselung (Encapsulation) in der OOP?","a":"Attribute einer Klasse werden vor direktem Zugriff von außen geschützt (meist private) und nur über definierte Methoden (Getter/Setter) zugänglich gemacht — das schützt die Datenintegrität.","qPt":"O que significa encapsulamento (Encapsulation) na POO?","aPt":"Os atributos de uma classe são protegidos de acesso direto a partir do exterior (geralmente privados) e tornados acessíveis apenas através de métodos definidos (getters/setters) — isto protege a integridade dos dados."},
{"cat":"algo","sub":"oop","q":"Was ist Vererbung (Inheritance) in der OOP?","a":"Eine Klasse (Unterklasse) übernimmt Attribute und Methoden einer anderen Klasse (Oberklasse) und kann diese erweitern oder überschreiben — fördert Wiederverwendbarkeit.","qPt":"O que é a herança (Inheritance) na POO?","aPt":"Uma classe (subclasse) herda atributos e métodos de outra classe (superclasse) e pode alargá-los ou sobrepô-los (override) — promove a reutilização de código."},
{"cat":"algo","sub":"oop","q":"Was ist Polymorphismus?","a":"Objekte unterschiedlicher Klassen können über dieselbe Methodensignatur angesprochen werden, verhalten sich dabei aber je nach konkreter Klasse unterschiedlich (z. B. durch Methodenüberschreibung).","qPt":"O que é o polimorfismo?","aPt":"Objetos de classes diferentes podem ser tratados através da mesma assinatura de método, mas comportam-se de forma diferente de acordo com a classe concreta (por exemplo, através da sobreposição de métodos/override)."},
{"cat":"algo","sub":"oop","q":"Was ist der Unterschied zwischen einer abstrakten Klasse und einem Interface?","a":"Eine abstrakte Klasse kann sowohl implementierte als auch abstrakte Methoden sowie Attribute enthalten und wird über einfache Vererbung genutzt. Ein Interface definiert primär Methodensignaturen (Verträge); eine Klasse kann mehrere Interfaces implementieren. Seit Java 8 dürfen Interfaces zusätzlich default- und static-Methoden mit eigener Implementierung enthalten, Instanzattribute sind aber weiterhin nicht möglich (nur öffentliche, statische, finale Konstanten).","qPt":"Qual é a diferença entre uma classe abstrata e uma interface?","aPt":"Uma classe abstrata pode conter tanto métodos implementados como métodos abstratos, além de atributos, e é utilizada através de herança simples. Uma interface define principalmente assinaturas de métodos (contratos); uma classe pode implementar várias interfaces. Desde o Java 8, as interfaces também podem conter métodos default e static com implementação própria, mas continuam a não permitir atributos de instância (apenas constantes públicas, estáticas e finais)."},
{"cat":"algo","sub":"sql","q":"Was unterscheidet Primärschlüssel und Fremdschlüssel in einer Datenbank?","a":"Der Primärschlüssel identifiziert einen Datensatz eindeutig innerhalb seiner Tabelle. Der Fremdschlüssel verweist auf den Primärschlüssel einer anderen Tabelle und stellt so die Beziehung zwischen Tabellen her.","qPt":"Qual é a diferença entre chave primária e chave estrangeira numa base de dados?","aPt":"A chave primária identifica de forma única um registo dentro da sua tabela. A chave estrangeira remete para a chave primária de outra tabela, estabelecendo assim a relação entre tabelas."},
{"cat":"algo","sub":"sql","q":"Was ist der Unterschied zwischen INNER JOIN und LEFT JOIN in SQL?","a":"INNER JOIN liefert nur Datensätze, die in beiden Tabellen eine Übereinstimmung haben. LEFT JOIN liefert zusätzlich alle Datensätze der linken Tabelle, auch wenn es in der rechten keine Übereinstimmung gibt (dann mit NULL-Werten).","qPt":"Qual é a diferença entre INNER JOIN e LEFT JOIN em SQL?","aPt":"O INNER JOIN devolve apenas os registos que têm correspondência em ambas as tabelas. O LEFT JOIN devolve, além disso, todos os registos da tabela da esquerda, mesmo quando não há correspondência na tabela da direita (nesse caso com valores NULL)."},
{"cat":"algo","sub":"sql","q":"Was fordert die erste Normalform (1NF)?","a":"Jedes Attribut enthält nur atomare (unteilbare) Werte, es gibt keine Wiederholungsgruppen und jede Zeile ist über einen Primärschlüssel eindeutig identifizierbar.","qPt":"O que exige a primeira forma normal (1FN)?","aPt":"Cada atributo contém apenas valores atómicos (indivisíveis), não existem grupos repetitivos e cada linha é identificável de forma única através de uma chave primária."},
{"cat":"algo","sub":"sql","q":"Was fordert die zweite Normalform (2NF)?","a":"Die Tabelle erfüllt die 1NF, und jedes Nicht-Schlüsselattribut ist voll funktional abhängig vom gesamten Primärschlüssel (keine Abhängigkeit von nur einem Teil eines zusammengesetzten Schlüssels).","qPt":"O que exige a segunda forma normal (2FN)?","aPt":"A tabela cumpre a 1FN e cada atributo que não faz parte da chave depende funcionalmente da totalidade da chave primária (sem dependência de apenas uma parte de uma chave composta)."},
{"cat":"algo","sub":"sql","q":"Was fordert die dritte Normalform (3NF)?","a":"Die Tabelle erfüllt die 2NF, und es gibt keine transitiven Abhängigkeiten — Nicht-Schlüsselattribute dürfen nicht von anderen Nicht-Schlüsselattributen abhängen, sondern nur vom Primärschlüssel.","qPt":"O que exige a terceira forma normal (3FN)?","aPt":"A tabela cumpre a 2FN e não existem dependências transitivas — os atributos que não fazem parte da chave não podem depender de outros atributos não-chave, mas apenas da chave primária."},
{"cat":"algo","sub":"sort","q":"Was beschreibt die Big-O-Notation?","a":"Sie beschreibt, wie die Laufzeit oder der Speicherbedarf eines Algorithmus im schlechtesten Fall mit wachsender Eingabegröße n zunimmt, z. B. O(1), O(log n), O(n), O(n²).","qPt":"O que descreve a notação Big-O?","aPt":"Descreve como o tempo de execução ou a necessidade de memória de um algoritmo aumenta no pior caso com o crescimento do tamanho da entrada n, por exemplo O(1), O(log n), O(n), O(n²)."},
{"cat":"algo","sub":"ds","q":"Was ist der Unterschied zwischen einem Array und einer verketteten Liste bezüglich des Zugriffs?","a":"Ein Array erlaubt direkten Zugriff über einen Index in O(1), da die Elemente zusammenhängend gespeichert sind. Bei einer verketteten Liste muss man ab dem Anfang sequenziell durchlaufen, Zugriff ist O(n) — dafür sind Einfügen/Löschen oft günstiger.","qPt":"Qual é a diferença entre um array e uma lista ligada em termos de acesso?","aPt":"Um array permite acesso direto através de um índice em O(1), uma vez que os elementos estão armazenados de forma contígua. Numa lista ligada é preciso percorrê-la sequencialmente a partir do início, pelo que o acesso é O(n) — em contrapartida, a inserção/remoção é normalmente mais eficiente."},
{"cat":"algo","sub":"sql","q":"Wozu dient das SQL-Statement GROUP BY?","a":"Es gruppiert Zeilen mit gleichen Werten in bestimmten Spalten zusammen, meist in Kombination mit Aggregatfunktionen wie COUNT(), SUM() oder AVG(), um pro Gruppe ein Ergebnis zu berechnen.","qPt":"Para que serve a instrução SQL GROUP BY?","aPt":"Agrupa linhas que têm valores iguais em determinadas colunas, normalmente em combinação com funções de agregação como COUNT(), SUM() ou AVG(), para calcular um resultado por grupo."},
{"cat":"algo","sub":"ds","q":"Was ist ein Array?","a":"Eine Datenstruktur fester Größe, die Elemente desselben Typs zusammenhängend im Speicher ablegt und über einen Index direkt zugreifbar macht.","qPt":"O que é um array?","aPt":"Uma estrutura de dados de tamanho fixo que armazena elementos do mesmo tipo de forma contígua na memória e permite o acesso direto através de um índice."},
{"cat":"algo","sub":"ds","q":"Was ist ein binärer Baum?","a":"Eine Baumstruktur, bei der jeder Knoten maximal zwei Kindknoten (linkes und rechtes Kind) besitzt.","qPt":"O que é uma árvore binária?","aPt":"Uma estrutura em árvore em que cada nó tem, no máximo, dois nós-filho (filho esquerdo e filho direito)."},
{"cat":"algo","sub":"ds","q":"Was ist ein binärer Suchbaum?","a":"Ein binärer Baum, bei dem für jeden Knoten gilt: alle Werte im linken Teilbaum sind kleiner, alle im rechten Teilbaum größer als der Knotenwert. Bei einem ausgeglichenen Baum ermöglicht das Suche in O(log n); im ungünstigsten Fall, z. B. bei einem entarteten (listenartigen) Baum, verschlechtert sich die Laufzeit auf O(n).","qPt":"O que é uma árvore binária de pesquisa?","aPt":"Uma árvore binária em que, para cada nó, todos os valores na subárvore esquerda são menores e todos os valores na subárvore direita são maiores do que o valor do nó. Numa árvore equilibrada, isto permite pesquisar em O(log n); no pior caso, por exemplo numa árvore degenerada (semelhante a uma lista), o tempo de execução piora para O(n)."},
{"cat":"algo","sub":"ds","q":"Was ist eine Hashtabelle?","a":"Eine Datenstruktur, die Schlüssel über eine Hashfunktion auf Speicherplätze abbildet, um im Idealfall Zugriff, Einfügen und Löschen in O(1) zu ermöglichen.","qPt":"O que é uma tabela de hash?","aPt":"Uma estrutura de dados que mapeia chaves para posições de memória através de uma função de hash, permitindo, no caso ideal, acesso, inserção e remoção em O(1)."},
{"cat":"algo","sub":"ds","q":"Was ist eine Kollision in einer Hashtabelle und wie kann sie behandelt werden?","a":"Eine Kollision entsteht, wenn zwei Schlüssel auf denselben Speicherplatz abgebildet werden. Behandlung z. B. durch Verkettung (Chaining) oder offene Adressierung.","qPt":"O que é uma colisão numa tabela de hash e como pode ser tratada?","aPt":"Uma colisão ocorre quando duas chaves são mapeadas para a mesma posição de memória. Pode ser tratada, por exemplo, através de encadeamento (chaining) ou de endereçamento aberto."},
{"cat":"algo","sub":"ds","q":"Was ist ein Graph in der Informatik?","a":"Eine Struktur aus Knoten (Nodes) und Kanten (Edges), die Beziehungen zwischen Objekten darstellt — kann gerichtet oder ungerichtet, gewichtet oder ungewichtet sein.","qPt":"O que é um grafo em informática?","aPt":"Uma estrutura composta por nós (nodes) e arestas (edges) que representa relações entre objetos — pode ser dirigido ou não dirigido, com ou sem pesos."},
{"cat":"algo","sub":"sort","q":"Wie funktioniert Selection Sort?","a":"In jedem Durchlauf wird das kleinste (oder größte) Element im unsortierten Bereich gesucht und mit dem ersten unsortierten Element vertauscht.","qPt":"Como funciona o Selection Sort?","aPt":"Em cada passagem, procura-se o menor (ou maior) elemento na parte não ordenada e troca-se com o primeiro elemento não ordenado."},
{"cat":"algo","sub":"sort","q":"Wie funktioniert Insertion Sort?","a":"Das Array wird schrittweise aufgebaut, indem jedes Element an der richtigen Position im bereits sortierten Teil eingefügt wird.","qPt":"Como funciona o Insertion Sort?","aPt":"O array é construído progressivamente, inserindo cada elemento na posição correta dentro da parte já ordenada."},
{"cat":"algo","sub":"sort","q":"Wie funktioniert Quicksort grundsätzlich?","a":"Ein Pivot-Element wird gewählt, das Array wird in kleinere/größere Elemente als den Pivot partitioniert, und die Teilarrays werden rekursiv sortiert (Divide-and-Conquer).","qPt":"Como funciona basicamente o Quicksort?","aPt":"Escolhe-se um elemento pivot, o array é particionado em elementos menores/maiores do que o pivot, e os subarrays são ordenados recursivamente (divisão e conquista)."},
{"cat":"algo","sub":"sort","q":"Wie funktioniert Mergesort grundsätzlich?","a":"Das Array wird rekursiv in Hälften geteilt, bis einzelne Elemente übrig sind, die dann paarweise sortiert wieder zusammengeführt (gemergt) werden — Laufzeit O(n log n).","qPt":"Como funciona basicamente o Mergesort?","aPt":"O array é dividido recursivamente em metades até restarem elementos isolados, que depois são combinados (merged) de forma ordenada, aos pares — complexidade O(n log n)."},
{"cat":"algo","sub":"sort","q":"Welche Zeitkomplexität hat die lineare Suche im schlechtesten Fall?","a":"O(n), da im schlimmsten Fall jedes Element geprüft werden muss.","qPt":"Qual é a complexidade temporal da pesquisa linear no pior caso?","aPt":"O(n), uma vez que, no pior caso, é necessário verificar todos os elementos."},
{"cat":"algo","sub":"rekursion","q":"Was ist der Unterschied zwischen Rekursion und Iteration?","a":"Rekursion löst ein Problem durch Selbstaufrufe der Funktion, Iteration durch Schleifen. Rekursion kann eleganter sein, benötigt aber mehr Speicher (Aufrufstapel); Iteration ist meist ressourcenschonender.","qPt":"Qual é a diferença entre recursão e iteração?","aPt":"A recursão resolve um problema através de chamadas da função a si própria, enquanto a iteração usa ciclos. A recursão pode ser mais elegante, mas precisa de mais memória (pilha de chamadas); a iteração é geralmente mais eficiente em termos de recursos."},
{"cat":"algo","sub":"rekursion","q":"Was ist ein Stack Overflow bei Rekursion?","a":"Ein Fehler, der auftritt, wenn zu viele rekursive Aufrufe den Aufrufstapel (Call Stack) überlaufen lassen, meist wegen fehlender oder falscher Abbruchbedingung.","qPt":"O que é um Stack Overflow na recursão?","aPt":"Um erro que ocorre quando demasiadas chamadas recursivas fazem a pilha de chamadas (call stack) ultrapassar o seu limite, normalmente por falta de uma condição de paragem ou por uma condição incorreta."},
{"cat":"algo","sub":"oop","q":"Was ist der Konstruktor einer Klasse?","a":"Eine spezielle Methode, die beim Erzeugen eines neuen Objekts automatisch aufgerufen wird, um dessen Attribute zu initialisieren.","qPt":"O que é o construtor de uma classe?","aPt":"Um método especial que é chamado automaticamente quando um novo objeto é criado, para inicializar os seus atributos."},
{"cat":"algo","sub":"oop","q":"Was ist der Unterschied zwischen einer Klasse und einem Objekt?","a":"Eine Klasse ist die Bauplan-/Vorlagendefinition mit Attributen und Methoden. Ein Objekt ist eine konkrete Instanz dieser Klasse mit eigenen Attributwerten.","qPt":"Qual é a diferença entre uma classe e um objeto?","aPt":"Uma classe é a definição/modelo (plano) com atributos e métodos. Um objeto é uma instância concreta dessa classe, com os seus próprios valores de atributos."},
{"cat":"algo","sub":"oop","q":"Was ist eine statische Methode/ein statisches Attribut in der OOP?","a":"Ein Element, das zur Klasse selbst gehört und nicht an eine einzelne Instanz gebunden ist — es existiert nur einmal, unabhängig davon, wie viele Objekte erzeugt werden.","qPt":"O que é um método estático/atributo estático na POO?","aPt":"Um elemento que pertence à própria classe e não está associado a uma instância individual — existe apenas uma vez, independentemente de quantos objetos forem criados."},
{"cat":"algo","sub":"oop","q":"Was ist der Unterschied zwischen Überladen (Overloading) und Überschreiben (Overriding)?","a":"Überladen bedeutet, mehrere Methoden mit gleichem Namen, aber unterschiedlicher Parameterliste in derselben Klasse zu definieren. Überschreiben bedeutet, eine geerbte Methode in einer Unterklasse mit gleicher Signatur neu zu implementieren.","qPt":"Qual é a diferença entre sobrecarga (overloading) e sobreposição (overriding)?","aPt":"A sobrecarga consiste em definir vários métodos com o mesmo nome, mas com listas de parâmetros diferentes, na mesma classe. A sobreposição consiste em reimplementar um método herdado numa subclasse com a mesma assinatura."},
{"cat":"algo","sub":"oop","q":"Was ist Abstraktion in der OOP?","a":"Das Prinzip, nur die für den jeweiligen Kontext wesentlichen Eigenschaften/Verhaltensweisen eines Objekts abzubilden und unwichtige Details auszublenden.","qPt":"O que é a abstração na POO?","aPt":"O princípio de representar apenas as propriedades/comportamentos essenciais de um objeto para o contexto em questão, ocultando os detalhes irrelevantes."},
{"cat":"algo","sub":"pattern","q":"Was ist das Singleton-Entwurfsmuster?","a":"Ein Entwurfsmuster, das sicherstellt, dass von einer Klasse zur Laufzeit nur genau eine Instanz existiert, und einen globalen Zugriffspunkt darauf bereitstellt.","qPt":"O que é o padrão de design Singleton?","aPt":"Um padrão de design que garante que existe exatamente uma instância de uma classe em tempo de execução, fornecendo um ponto de acesso global a essa instância."},
{"cat":"algo","sub":"pattern","q":"Was ist das Observer-Entwurfsmuster?","a":"Ein Entwurfsmuster, bei dem sich Beobachter (Observer) bei einem Subjekt registrieren und automatisch benachrichtigt werden, wenn sich dessen Zustand ändert.","qPt":"O que é o padrão de design Observer?","aPt":"Um padrão de design em que os observadores (observers) se registam junto de um sujeito (subject) e são automaticamente notificados quando o estado deste muda."},
{"cat":"algo","sub":"pattern","q":"Was ist das Factory-Entwurfsmuster?","a":"Ein Entwurfsmuster, das die Erzeugung von Objekten über eine zentrale Methode/Klasse kapselt, statt Objekte direkt mit \"new\" zu erzeugen — erhöht Flexibilität und Austauschbarkeit.","qPt":"O que é o padrão de design Factory?","aPt":"Um padrão de design que encapsula a criação de objetos através de um método/classe central, em vez de criar objetos diretamente com \"new\" — aumenta a flexibilidade e a capacidade de substituição."},
{"cat":"algo","sub":"pattern","q":"Was beschreibt das MVC-Architekturmuster?","a":"Model-View-Controller trennt eine Anwendung in Datenmodell (Model), Darstellung (View) und Steuerungslogik (Controller), um Zuständigkeiten zu entkoppeln und Wartbarkeit zu erhöhen.","qPt":"O que descreve o padrão de arquitetura MVC?","aPt":"Model-View-Controller separa uma aplicação em modelo de dados (Model), apresentação (View) e lógica de controlo (Controller), de modo a desacoplar responsabilidades e aumentar a manutenibilidade."},
{"cat":"algo","sub":"pattern","q":"Was ist eine Schichtenarchitektur (Layered Architecture)?","a":"Eine Softwarearchitektur, die eine Anwendung in aufeinander aufbauende Schichten (z. B. Präsentation, Logik, Datenzugriff) unterteilt, wobei jede Schicht nur mit den angrenzenden kommuniziert.","qPt":"O que é uma arquitetura em camadas (Layered Architecture)?","aPt":"Uma arquitetura de software que divide uma aplicação em camadas sucessivas (por exemplo, apresentação, lógica, acesso a dados), em que cada camada comunica apenas com as camadas adjacentes."},
{"cat":"algo","sub":"pattern","q":"Was ist ein Client-Server-Modell?","a":"Ein Architekturmodell, bei dem Clients Anfragen an einen zentralen Server stellen, der Ressourcen/Dienste bereitstellt und die Anfragen bearbeitet.","qPt":"O que é um modelo cliente-servidor?","aPt":"Um modelo de arquitetura em que os clientes fazem pedidos a um servidor central, que fornece recursos/serviços e processa esses pedidos."},
{"cat":"algo","sub":"pattern","q":"Was ist eine REST-API?","a":"Eine Programmierschnittstelle, die dem REST-Architekturstil folgt und über HTTP-Methoden (GET, POST, PUT, DELETE) zustandslos auf Ressourcen zugreift, die über URLs identifiziert werden.","qPt":"O que é uma API REST?","aPt":"Uma interface de programação que segue o estilo arquitetural REST e acede a recursos, identificados por URLs, de forma sem estado (stateless), através de métodos HTTP (GET, POST, PUT, DELETE)."},
{"cat":"algo","sub":"pattern","q":"Was ist der Unterschied zwischen JSON und XML?","a":"Beides sind Datenformate zum Datenaustausch. JSON ist kompakter und einfacher lesbar (Schlüssel-Wert-Paare), XML ist ausführlicher mit Tags und erlaubt z. B. Attribute und Validierung über Schemas (XSD).","qPt":"Qual é a diferença entre JSON e XML?","aPt":"Ambos são formatos de dados para troca de informação. O JSON é mais compacto e mais fácil de ler (pares chave-valor); o XML é mais extenso, usa tags e permite, por exemplo, atributos e validação através de esquemas (XSD)."},
{"cat":"algo","sub":"sql","q":"Was bedeutet ACID bei Datenbanktransaktionen?","a":"Atomicity (Alles-oder-nichts), Consistency (Konsistenz bleibt erhalten), Isolation (Transaktionen beeinflussen sich nicht gegenseitig) und Durability (Ergebnisse bleiben nach Abschluss dauerhaft erhalten).","qPt":"O que significa ACID nas transações de bases de dados?","aPt":"Atomicity/Atomicidade (tudo ou nada), Consistency/Consistência (a consistência é mantida), Isolation/Isolamento (as transações não se influenciam mutuamente) e Durability/Durabilidade (os resultados permanecem permanentemente após a conclusão)."},
{"cat":"algo","sub":"sql","q":"Was ist ein Datenbankindex und wozu dient er?","a":"Eine zusätzliche Datenstruktur, die den schnellen Zugriff auf Datensätze anhand bestimmter Spalten ermöglicht, ähnlich einem Buchregister — beschleunigt Lesezugriffe, verlangsamt aber Schreibzugriffe.","qPt":"O que é um índice de base de dados e para que serve?","aPt":"Uma estrutura de dados adicional que permite o acesso rápido a registos com base em determinadas colunas, semelhante a um índice de um livro — acelera as leituras, mas torna as escritas mais lentas."},
{"cat":"algo","sub":"sql","q":"Was macht das SQL-Statement HAVING im Unterschied zu WHERE?","a":"WHERE filtert einzelne Zeilen vor der Gruppierung, HAVING filtert Gruppen (z. B. Ergebnisse von Aggregatfunktionen) nach der Ausführung von GROUP BY.","qPt":"O que faz a instrução SQL HAVING em comparação com WHERE?","aPt":"O WHERE filtra linhas individuais antes do agrupamento; o HAVING filtra grupos (por exemplo, resultados de funções de agregação) depois de executado o GROUP BY."},
{"cat":"algo","sub":"sql","q":"Was macht ein RIGHT JOIN in SQL?","a":"Er liefert alle Datensätze der rechten Tabelle sowie die übereinstimmenden Datensätze der linken Tabelle; gibt es keine Übereinstimmung, werden NULL-Werte für die linke Tabelle eingesetzt.","qPt":"O que faz um RIGHT JOIN em SQL?","aPt":"Devolve todos os registos da tabela da direita, juntamente com os registos correspondentes da tabela da esquerda; quando não há correspondência, são colocados valores NULL para a tabela da esquerda."},
{"cat":"algo","sub":"sql","q":"Was ist eine Subquery (Unterabfrage) in SQL?","a":"Eine SQL-Abfrage, die innerhalb einer anderen Abfrage verschachtelt ist, z. B. in der WHERE- oder FROM-Klausel, um Zwischenergebnisse weiterzuverarbeiten.","qPt":"O que é uma subquery (subconsulta) em SQL?","aPt":"Uma consulta SQL aninhada dentro de outra consulta, por exemplo na cláusula WHERE ou FROM, para processar resultados intermédios."},
{"cat":"algo","sub":"sql","q":"Was ist der Unterschied zwischen DDL und DML in SQL?","a":"DDL (Data Definition Language, z. B. CREATE, ALTER, DROP) definiert die Struktur der Datenbank. DML (Data Manipulation Language, z. B. SELECT, INSERT, UPDATE, DELETE) bearbeitet die Daten selbst.","qPt":"Qual é a diferença entre DDL e DML em SQL?","aPt":"O DDL (Data Definition Language, por exemplo CREATE, ALTER, DROP) define a estrutura da base de dados. O DML (Data Manipulation Language, por exemplo SELECT, INSERT, UPDATE, DELETE) manipula os próprios dados."},
{"cat":"algo","sub":"sql","q":"Was bewirkt das SQL-Statement DELETE im Vergleich zu TRUNCATE?","a":"DELETE löscht (optional gefilterte) Zeilen einzeln und protokolliert sie im Transaktionslog, ist rückgängig machbar. TRUNCATE entfernt alle Zeilen einer Tabelle auf einmal, meist schneller, aber nicht zeilenweise protokolliert.","qPt":"O que faz a instrução SQL DELETE em comparação com TRUNCATE?","aPt":"O DELETE apaga linhas (opcionalmente filtradas) uma a uma e regista-as no log de transações, sendo reversível. O TRUNCATE remove todas as linhas de uma tabela de uma só vez, geralmente mais rápido, mas sem registo linha a linha."},
{"cat":"algo","sub":"sql","q":"Was ist ein zusammengesetzter Schlüssel (Composite Key)?","a":"Ein Primärschlüssel, der aus mehreren Spalten besteht, die zusammen einen Datensatz eindeutig identifizieren.","qPt":"O que é uma chave composta (Composite Key)?","aPt":"Uma chave primária composta por várias colunas que, em conjunto, identificam de forma única um registo."},
{"cat":"algo","sub":"sql","q":"Was ist die Boyce-Codd-Normalform (BCNF)?","a":"Eine Verschärfung der 3NF: Für jede funktionale Abhängigkeit muss die linke Seite ein Superschlüssel sein — beseitigt bestimmte Anomalien, die die 3NF noch zulässt.","qPt":"O que é a Forma Normal de Boyce-Codd (BCNF)?","aPt":"Um reforço da 3FN: para cada dependência funcional, o lado esquerdo tem de ser uma superchave — elimina determinadas anomalias que a 3FN ainda permite."},
{"cat":"algo","sub":"sql","q":"Was ist eine Anomalie in einer nicht normalisierten Datenbank?","a":"Unerwünschte Effekte wie Einfüge-, Änderungs- oder Löschanomalien, die durch redundante Datenspeicherung entstehen können und durch Normalisierung vermieden werden.","qPt":"O que é uma anomalia numa base de dados não normalizada?","aPt":"Efeitos indesejados, como anomalias de inserção, de atualização ou de eliminação, que podem surgir devido ao armazenamento redundante de dados e que são evitados através da normalização."},
{"cat":"algo","sub":"sql","q":"Was ist der Unterschied zwischen einem Primärschlüssel und einem Unique-Constraint?","a":"Ein Primärschlüssel identifiziert einen Datensatz eindeutig und darf nicht NULL sein; pro Tabelle gibt es nur einen. Ein Unique-Constraint erzwingt ebenfalls Eindeutigkeit, erlaubt aber NULL-Werte und kann mehrfach pro Tabelle vergeben werden.","qPt":"Qual é a diferença entre uma chave primária e uma restrição Unique (Unique Constraint)?","aPt":"Uma chave primária identifica um registo de forma única e não pode ser NULL; só pode existir uma por tabela. Uma restrição Unique também garante a unicidade, mas permite valores NULL e pode ser definida várias vezes na mesma tabela."},
{"cat":"algo","sub":"netz","q":"Was ist das OSI-Referenzmodell?","a":"Ein 7-Schichten-Modell zur Beschreibung der Kommunikation in Netzwerken, von der physikalischen Übertragung (Schicht 1) bis zur Anwendung (Schicht 7).","qPt":"O que é o modelo de referência OSI?","aPt":"Um modelo de 7 camadas para descrever a comunicação em redes, desde a transmissão física (camada 1) até à aplicação (camada 7)."},
{"cat":"algo","sub":"netz","q":"Auf welcher OSI-Schicht arbeitet ein Switch, auf welcher ein Router?","a":"Ein (klassischer) Switch arbeitet auf Schicht 2 (Sicherungsschicht, MAC-Adressen), ein Router auf Schicht 3 (Vermittlungsschicht, IP-Adressen).","qPt":"Em que camada OSI opera um switch e em que camada opera um router?","aPt":"Um switch (clássico) opera na camada 2 (camada de ligação de dados, endereços MAC); um router opera na camada 3 (camada de rede, endereços IP)."},
